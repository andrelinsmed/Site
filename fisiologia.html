<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fisiologia · Mecanismos</title>
<style>
/* Fisiologia — resumos de fisiologia e fisiopatologia, na roupagem vitrine do site */
:root{
  --bg:#f5f5f7; --card:#ffffff; --ink:#1d1d1f; --muted:#6e6e73; --line:#d2d2d7; --soft:#f5f5f7; --hover:#ebebef;
  --accent:#0066cc; --accent-soft:#e8f2fd; --bad:#b3261e;
  --s-fsh:#2a78d6; --s-lh:#eb6834; --s-e2:#1baf7a; --s-p4:#eda100; --band:rgba(179,38,30,.06); --tip:#fff8e1; --tipline:#f0d78c;
  --shadow:0 1px 3px rgba(0,0,0,.04),0 10px 30px rgba(0,0,0,.045); --bar:rgba(245,245,247,.86);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1d1d1f; --ink:#f5f5f7; --muted:#a1a1a6; --line:#38383a; --soft:#2c2c2e; --hover:#2c2c2e;
  --accent:#2997ff; --accent-soft:#0b2a4a; --bad:#ee7f78;
  --s-fsh:#3987e5; --s-lh:#d95926; --s-e2:#199e70; --s-p4:#c98500; --band:rgba(238,127,120,.09); --tip:#2b2610; --tipline:#5c4f1c;
  --shadow:0 1px 2px rgba(0,0,0,.4); --bar:rgba(22,22,23,.82);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;
  padding:0 max(22px,env(safe-area-inset-right,0px)) 60px max(22px,env(safe-area-inset-left,0px))}
button{font-family:var(--font)}
.kicker{font-size:11px;letter-spacing:.13em;font-weight:700;color:var(--muted);text-transform:uppercase}
.ghost{font:600 13px var(--font);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer}
.ghost:hover{background:var(--hover)}

/* Biblioteca */
.lib{max-width:1080px;margin:0 auto;padding-top:64px}
.lib h1{font-size:clamp(44px,7vw,76px);line-height:1.02;letter-spacing:-.06em;margin:14px 0 12px;font-weight:750}
.lib .lead{font-size:19px;color:var(--muted);max-width:620px;margin:0 0 40px}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:20px}
.rcard{display:flex;flex-direction:column;text-align:left;border:0;border-radius:24px;background:var(--card);box-shadow:var(--shadow);padding:0;overflow:hidden;cursor:pointer;color:var(--ink);
  transition:transform .4s cubic-bezier(.2,.75,.25,1),box-shadow .4s}
.rcard:hover{transform:translateY(-4px);box-shadow:0 16px 40px rgba(0,0,0,.11)}
.rcard:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
.rcard .tcv{position:relative;height:170px;background:#dcecff;color:#1d1d1f;padding:22px 24px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.tcv .tk{font-size:11px;letter-spacing:.13em;font-weight:700;text-transform:uppercase;opacity:.65}
.tcv .tn{font-size:64px;font-weight:750;letter-spacing:-.06em;line-height:1}
.tcv strong{position:absolute;right:18px;top:-18px;font-size:120px;line-height:1;opacity:.12}
:root[data-theme="dark"] .rcard .tcv{filter:brightness(.82)}
/* conteúdo vindo do Google Docs: títulos com fundo colorido, cores e marca-texto do original */
.doc h2.hb,.doc h3.hb{background:var(--hb);color:var(--c);padding:8px 14px;border-radius:12px;border-top:0;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.doc h2.hb{margin-top:52px}.doc h3.hb{display:inline-block;margin:28px 0 10px}
.doc h2.hc,.doc h3.hc{color:var(--c)}
.doc .cc{color:var(--c)}
.doc mark{background:var(--m);color:#1d1d1f;border-radius:3px;padding:0 2px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.doc mark .cc{color:inherit}
:root[data-theme="dark"] .doc .cc,:root[data-theme="dark"] .doc h2.hc,:root[data-theme="dark"] .doc h3.hc{color:color-mix(in srgb,var(--c) 40%,#ffffff)}
.doc figure{margin:14px 0}.doc figure img{margin:0;border-radius:10px}
.doc td p,.doc th p{margin:0}
.doc a{color:var(--accent);overflow-wrap:anywhere}
.doc p,.doc li{text-align:justify;hyphens:auto;-webkit-hyphens:auto}
.doc td,.doc th{text-align:left;hyphens:manual}
.rcard .bd{padding:20px 22px 22px;display:flex;flex-direction:column;gap:6px}
.rcard .sp{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.rcard .tt{font-size:24px;font-weight:700;letter-spacing:-.04em;line-height:1.12}
.rcard .ds{font-size:14px;color:var(--muted)}
.rcard .go{font-size:15px;font-weight:600;color:var(--accent);margin-top:6px}
.soon{border:2px dashed var(--line);border-radius:24px;padding:28px;color:var(--muted);font-size:15px;display:flex;flex-direction:column;justify-content:center;gap:6px;min-height:200px}
.soon b{color:var(--ink);font-size:18px;letter-spacing:-.02em}

/* Leitura */
.reader{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:250px minmax(0,1fr);gap:40px;padding-top:24px}
.toc{position:sticky;top:20px;align-self:start;max-height:calc(100vh - 40px);overflow-y:auto;padding:8px 0 20px}
.toc .back{margin-bottom:18px}
.toc ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px}
.toc a{display:block;color:var(--ink);text-decoration:none;font-size:13.5px;line-height:1.35;padding:6px 10px;border-radius:10px}
.toc a:hover{background:var(--hover)}
.toc a.h3{padding-left:22px;color:var(--muted);font-size:13px}
.toc a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.toc-btn{display:none}
.doc{background:var(--card);border-radius:28px;box-shadow:var(--shadow);padding:48px clamp(22px,5vw,64px) 56px;min-width:0}
.doc-head{margin-bottom:28px}
.doc.embed{padding:0;overflow:hidden}
.embed-frame{display:block;width:100%;min-height:80vh;border:0;background:#f7f4f1}
.doc-banner{display:block;width:100%;height:auto;margin:0 0 22px}
.doc.pages{padding:18px;background:var(--card)}
.pg{display:block;width:100%;height:auto;border-radius:12px;background:#fff;margin:0 0 14px;cursor:zoom-in;box-shadow:0 0 0 1px var(--line)}
.zoom{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.88);overflow:auto;-webkit-overflow-scrolling:touch;cursor:zoom-out}
.zoom img{display:block;width:min(1600px,200vw);max-width:none;margin:0 auto}
.zoom-x{position:fixed;top:12px;right:12px;z-index:51;font:600 14px var(--font);color:#fff;background:rgba(255,255,255,.18);border:0;border-radius:999px;padding:9px 16px;cursor:pointer}
.doc-head h1{font-size:clamp(34px,5vw,52px);line-height:1.04;letter-spacing:-.055em;margin:12px 0 8px}
.doc-head p{color:var(--muted);margin:0}
.doc h2{font-size:clamp(24px,3vw,30px);letter-spacing:-.04em;line-height:1.15;margin:48px 0 14px;padding-top:24px;border-top:1px solid var(--line);scroll-margin-top:24px}
.doc h3{font-size:19px;letter-spacing:-.02em;margin:30px 0 8px;scroll-margin-top:24px}
.doc p,.doc li{font-size:16.5px}
.doc p{margin:0 0 12px}
.doc ol,.doc ul{padding-left:22px;margin:0 0 14px}
.doc li p{margin:0 0 4px}
.doc strong{font-weight:650}
.doc img{max-width:100%;height:auto;display:block;border-radius:14px;margin:8px auto}
.doc blockquote{margin:16px 0;padding:14px 18px;background:var(--tip);border:1px solid var(--tipline);border-radius:16px}
.doc blockquote p:last-child{margin:0}
.tbl{overflow-x:auto;margin:14px 0 20px;border-radius:16px;border:1px solid var(--line)}
.doc table{border-collapse:collapse;width:100%;font-size:14.5px;line-height:1.45}
.doc th,.doc td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.doc th{background:var(--soft);font-weight:650}
.doc tr:last-child td{border-bottom:0}
.tbl.figs{border:0;border-radius:0}
.tbl.figs td{border:0;padding:6px;width:50%;font-size:13.5px;color:var(--muted)}
.doc .fig-cap{font-size:13.5px;color:var(--muted)}

/* ---------- Fisiologia ---------- */
.rcard .fcv{position:relative;height:170px;background:var(--soft);padding:22px 24px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.fcv .tk{font-size:11px;letter-spacing:.13em;font-weight:700;text-transform:uppercase;color:var(--muted)}
.fcv .tn{font-size:30px;font-weight:750;letter-spacing:-.05em;line-height:1.05;color:var(--ink)}
.fcv svg{position:absolute;right:-4px;top:-10px;width:150px;height:150px;color:var(--ink);opacity:.07}
.rcard .tt{font-size:22px}
.ideia{background:var(--soft);border-radius:20px;padding:20px 24px;margin:0 0 6px}
.doc .ideia p{font-size:clamp(18px,2.2vw,21px);line-height:1.45;font-weight:600;letter-spacing:-.02em;margin:6px 0 0;text-align:left;hyphens:manual}
.casc{margin:22px 0 28px;padding:20px 18px 22px;border-radius:20px;border:1px solid var(--line)}
.casc figcaption,.fig figcaption{font-size:11px;letter-spacing:.13em;font-weight:700;color:var(--muted);text-transform:uppercase;text-align:center}
.fig figcaption{font-size:13px;letter-spacing:0;font-weight:400;text-transform:none;margin-top:10px}
.doc .casc ol{list-style:none;padding:0;margin:14px 0 0;display:flex;flex-direction:column;align-items:center}
.doc .casc li{display:flex;gap:8px;justify-content:center;width:100%;position:relative;padding-top:24px;text-align:center;font-size:15px}
.doc .casc li:first-child{padding-top:0}
.casc li+li::before{content:"";position:absolute;top:4px;left:50%;width:1.5px;height:13px;background:var(--muted);transform:translateX(-50%)}
.casc li+li::after{content:"";position:absolute;top:15px;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top:6px solid var(--muted);border-bottom:0}
.casc li span{background:var(--soft);border-radius:12px;padding:9px 14px;line-height:1.4;max-width:520px;text-align:center}
.casc li.par span{flex:1 1 0;max-width:250px;display:flex;align-items:center;justify-content:center}
.casc li.fim span{background:var(--ink);color:var(--card);font-weight:600}
.casc .casc-n{font-size:13.5px;color:var(--muted);text-align:center;margin:14px 0 0}
.mapa td:first-child{width:50%;font-weight:550}
.doc .conexao{margin-top:34px;padding-top:18px;border-top:1px solid var(--line);font-size:14.5px;color:var(--muted);text-align:left}
.conexao .kicker{display:block;margin-bottom:4px}
.fontes{font-size:12.5px;color:var(--muted);margin-top:14px}
.fig{margin:22px 0 26px}
.ciclo .leg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink);margin-bottom:6px}
.ciclo .leg span{display:inline-flex;align-items:center;gap:6px}
.ciclo .sw{display:inline-block;width:16px;height:3px;border-radius:2px}
.sw.fsh{background:var(--s-fsh)}.sw.lh{background:var(--s-lh)}.sw.e2{background:var(--s-e2)}.sw.p4{background:var(--s-p4)}
.ciclo .plot{position:relative}
.ciclo svg{display:block;width:100%;height:auto;overflow:visible;touch-action:pan-y}
.ciclo .ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ln.fsh{stroke:var(--s-fsh)}.ln.lh{stroke:var(--s-lh)}.ln.e2{stroke:var(--s-e2)}.ln.p4{stroke:var(--s-p4)}
.ciclo .band{fill:var(--band)}
.ciclo .ovu{stroke:var(--muted);stroke-dasharray:3 4;stroke-width:1}
.ciclo .axis{stroke:var(--line);stroke-width:1}
.ciclo .tick,.ciclo .ph{font:11.5px var(--font);fill:var(--muted)}
.ciclo .ph.b{font-weight:650;fill:var(--ink)}
.ciclo .lab{font:600 12px var(--font);fill:var(--ink);paint-order:stroke;stroke:var(--card);stroke-width:4px;stroke-linejoin:round}
.ciclo .cross{stroke:var(--ink);stroke-width:1;opacity:.35}
.ciclo .hit{fill:transparent;cursor:crosshair}
.ciclo .tip{position:absolute;top:0;z-index:2;width:min(260px,70%);background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:10px 12px;font-size:13px;line-height:1.45;pointer-events:none}
.ciclo .tip b{display:block;font-size:13.5px;margin-bottom:2px}
.ciclo .tip p{margin:0 0 6px;font-size:12.5px;color:var(--muted);text-align:left}
.ciclo .tip .r{display:flex;justify-content:space-between;gap:10px}
.ciclo .tip .r span{display:inline-flex;align-items:center;gap:6px}
.zonas .zwrap{display:flex;gap:24px;align-items:center}
.zonas svg{width:150px;flex:none}
.zonas .torso{fill:var(--soft);stroke:var(--line);stroke-width:1.5}
.zonas .costal{fill:none;stroke:var(--line);stroke-width:1.5}
.zonas .umb{fill:var(--muted)}
.zonas .z{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.5}
.zonas .zn{font:700 15px var(--font);fill:var(--accent)}
.doc .zonas ol{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:12px}
.doc .zonas li{font-size:15px;text-align:left;hyphens:manual}
.zonas li b{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.zonas .zb{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:12px}
.ciclo .ph.short{display:none}
@media (max-width:600px){.ciclo .tip{position:static;width:auto;margin-top:8px;box-shadow:none}.ciclo .tick,.ciclo .ph{font-size:21px}.ciclo .ph.long{display:none}.ciclo .ph.short{display:inline}.ciclo .lab{font-size:23px;stroke-width:7px}.ciclo .ln{stroke-width:3.6}.ciclo .ovu{stroke-width:2}}
@media (max-width:600px){.zonas .zwrap{flex-direction:column;align-items:stretch}.zonas svg{width:120px;align-self:center}.casc li.par{flex-direction:column;align-items:center}.casc li.par span{max-width:100%;width:100%}}

@media (max-width:900px){
  body{padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
  .reader{grid-template-columns:minmax(0,1fr);gap:14px;padding-top:14px}
  .toc{position:static;max-height:none;padding:0}
  .toc-btn{display:inline-block;margin-left:8px}
  .toc ol{display:none;margin-top:10px;background:var(--card);border-radius:18px;padding:8px;box-shadow:var(--shadow)}
  .toc.open ol{display:flex}
  .toc .back{margin-bottom:0}
  .doc{border-radius:22px;padding:32px 18px 40px}
  .doc.pages{padding:6px;border-radius:16px}
  .pg{margin-bottom:6px;border-radius:10px}
  .lib{padding-top:36px}
}
/* ---------- Flashcards ---------- */
.fc-seg{display:inline-flex;gap:2px;padding:3px;margin:0 0 22px;background:var(--hover);border-radius:999px}
.fc-seg button{font:600 14px var(--font);color:var(--muted);background:none;border:0;border-radius:999px;padding:8px 16px;cursor:pointer}
.fc-seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.doc.pages .fc-seg{margin:10px 10px 16px}
.reader.fc-mode .toc ol,.reader.fc-mode .toc .toc-btn{display:none!important}
.fc{max-width:680px;margin:6px auto 10px;text-align:center}
.fc .fc-intro{color:var(--muted);font-size:15.5px;margin:0 auto 22px;max-width:460px;text-align:center}
.fc .fc-k{font-size:11px;letter-spacing:.13em;font-weight:700;text-transform:uppercase;color:var(--muted)}
.fc .fc-gen{font:600 15px var(--font);color:#fff;background:var(--accent-solid,#0071e3);border:0;border-radius:999px;padding:12px 24px;cursor:pointer;margin-top:4px}
.fc .fc-gen:hover{filter:brightness(1.07)}
.fc-card{perspective:1400px;margin:22px 0 16px;cursor:pointer;outline:none}
.fc-in{position:relative;min-height:300px;transition:transform .55s cubic-bezier(.2,.75,.25,1);transform-style:preserve-3d}
.fc-card.flip .fc-in{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:24px;padding:34px 34px 28px;display:flex;flex-direction:column;justify-content:center;gap:14px;text-align:left}
.fc-front{background:var(--card);box-shadow:var(--shadow),0 0 0 1px var(--line)}
.fc-back{background:var(--ink);color:var(--card);transform:rotateY(180deg)}
.fc-face .lab{font-size:11px;letter-spacing:.13em;font-weight:700;text-transform:uppercase;color:var(--muted)}
.fc-back .lab{color:inherit;opacity:.62}
.fc-face .tx{font-size:clamp(19px,2.4vw,23px);line-height:1.38;letter-spacing:-.02em;font-weight:600;text-align:left;hyphens:manual}
.fc-back .tx{font-size:clamp(16.5px,2vw,19px);font-weight:500;line-height:1.5}
.fc-face .hint{margin-top:auto;font-size:12.5px;color:var(--muted)}
.fc-back .hint{color:inherit;opacity:.55}
.fc-bar{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.fc-bar .ghost{font-size:14px;padding:9px 16px}
.fc-cnt{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:70px}
.fc-prog{height:4px;border-radius:2px;background:var(--hover);overflow:hidden;max-width:300px;margin:14px auto 0}
.fc-prog i{display:block;height:100%;background:var(--accent);transition:width .3s}
.fc-end{padding:30px 10px}
.fc-end b{display:block;font-size:24px;letter-spacing:-.03em;margin-bottom:6px}
@media (max-width:600px){.fc-in{min-height:340px}.fc-face{padding:26px 22px 20px}}
</style>
</head>

  <h1>Fisiologia.</h1>
  <p class="lead">A fisiologia e a fisiopatologia dos temas das tutorias, com esquemas para entender o mecanismo de um olhar.</p>

<script>
const ROTEIROS = [{"id": "carcinogenese-colon-colo", "area": "Oncologia", "titulo": "Carcinogênese: câncer colorretal e câncer do colo do útero", "resumo": "Oncogenes e supressores, a sequência adenoma-carcinoma no intestino e como as proteínas E6 e E7 do HPV transformam a célula do colo.", "html": "<div class=\"ideia\"><span class=\"kicker\">Em uma frase<\/span><p>O câncer é uma evolução acumulada: mutação após mutação, uma célula ganha vantagens para proliferar, escapar da morte e invadir. No intestino isso acontece passo a passo dentro do adenoma; no colo do útero, por ação de duas proteínas do HPV.<\/p><\/div>\n<h2>Fisiologia do controle celular<\/h2>\n<p>A célula normal se divide quando recebe sinais e para quando há dano. Três grupos de genes fazem esse controle. Os proto-oncogenes funcionam como acelerador (KRAS, BRAF): uma mutação de ganho de função em um único alelo já basta para manter o sinal de proliferação ligado. Os genes supressores de tumor funcionam como freio (APC, TP53, RB): é preciso perder os dois alelos, a hipótese dos dois golpes de Knudson. Os genes de reparo do DNA (MLH1, MSH2, MSH6, PMS2) corrigem erros de replicação; quando falham, as mutações se acumulam mais rápido.<\/p>\n<p>O p53 é o guardião do genoma: diante de dano ao DNA, ele para o ciclo celular para reparo ou leva a célula à apoptose. A proteína Rb segura o fator de transcrição E2F e impede a passagem da fase G1 para a S; quando Rb é fosforilada, E2F é liberado e a célula se divide.<\/p>\n<h2>Fisiopatologia<\/h2>\n<h3>Câncer colorretal: a sequência adenoma-carcinoma<\/h3>\n<p>Na via clássica, de instabilidade cromossômica (a maioria dos casos), o primeiro passo é a perda do APC. Sem APC, a betacatenina não é degradada, a via Wnt fica ligada e as células da cripta proliferam sem parar, formando focos de cripta aberrante e pequenos adenomas. A ativação do KRAS faz o adenoma crescer; perdas no cromossomo 18q (SMAD4) o tornam avançado, com displasia de alto grau; e a perda do TP53 permite a transformação em carcinoma invasor. Esse caminho leva em média cerca de dez anos, o que é a base do rastreamento: retirar o pólipo na colonoscopia interrompe a sequência. Na polipose adenomatosa familiar, a primeira mutação do APC já vem herdada.<\/p>\n<figure class=\"casc\"><figcaption>Sequência adenoma-carcinoma (via cromossômica)<\/figcaption><ol><li><span>Mucosa normal<\/span><\/li><li><span>Perda do APC: betacatenina acumula, via Wnt ligada<\/span><\/li><li><span>Foco de cripta aberrante e adenoma inicial<\/span><\/li><li><span>Ativação do KRAS: adenoma cresce<\/span><\/li><li><span>Perda de 18q (SMAD4): adenoma avançado<\/span><\/li><li><span>Perda do TP53<\/span><\/li><li class=\"fim\"><span>Carcinoma invasor<\/span><\/li><\/ol><p class=\"casc-n\">Em média, cerca de 10 anos entre o adenoma e o carcinoma: a janela do rastreamento.<\/p><\/figure>\n<p>Em cerca de 15% dos casos, o defeito está no reparo de pareamento do DNA, a via de instabilidade de microssatélites. Ela pode ser herdada (síndrome de Lynch) ou adquirida, pela metilação do promotor do MLH1. As mutações se acumulam em sequências repetitivas de genes como o receptor II do TGF-beta e o BAX. Esses tumores são mais frequentes no cólon direito, costumam ser mucinosos e com muitos linfócitos, e respondem bem à imunoterapia. Há ainda a via serrilhada, ligada ao BRAF e à metilação do DNA.<\/p>\n<p>O ambiente intestinal participa da promoção. Dietas ricas em gordura e em ultraprocessados e pobres em fibra aumentam os ácidos biliares que chegam ao cólon, e a microbiota os converte em ácidos biliares secundários (como o desoxicólico), que geram estresse oxidativo, inflamação e dano ao DNA. A fibra, ao contrário, gera butirato, que nutre o colonócito e tem efeito protetor.<\/p>\n<h3>Câncer do colo do útero: o HPV<\/h3>\n<p>O HPV infecta a zona de transformação do colo, onde o epitélio está em metaplasia e as células basais ficam mais acessíveis por microtraumas. A maioria das infecções é transitória e eliminada pela imunidade em um a dois anos, às vezes deixando apenas lesão de baixo grau, com coilócitos (a infecção produtiva). O risco está na infecção persistente por tipos de alto risco, principalmente 16 e 18.<\/p>\n<p>Na persistência, o DNA viral pode se integrar ao genoma da célula, muitas vezes rompendo o gene E2, que controlava o vírus. Sem E2, as oncoproteínas E6 e E7 são produzidas em excesso. A E6 se liga ao p53 e o leva à degradação, de modo que a célula perde a capacidade de parar para reparo ou entrar em apoptose; a E6 também ativa a telomerase. A E7 se liga ao Rb, libera o E2F e empurra a célula da fase G1 para a S sem controle. Como o Rb está inativado, a proteína p16 se acumula, e por isso a imuno-histoquímica para p16 ajuda a identificar lesões transformadas pelo HPV.<\/p>\n<figure class=\"casc\"><figcaption>HPV: da infecção ao carcinoma<\/figcaption><ol><li><span>Infecção da zona de transformação<\/span><\/li><li><span>A maioria regride (infecção transitória, LSIL / NIC 1)<\/span><\/li><li><span>Persistência de HPV de alto risco (16, 18)<\/span><\/li><li><span>Integração do DNA viral, perda do E2<\/span><\/li><li class=\"par\"><span>E6 degrada p53<\/span><span>E7 inativa Rb e libera E2F<\/span><\/li><li><span>Instabilidade genômica e proliferação sem controle (HSIL / NIC 2 e 3)<\/span><\/li><li class=\"fim\"><span>Carcinoma invasor<\/span><\/li><\/ol><p class=\"casc-n\">A progressão leva anos, o que permite o rastreamento pelo citopatológico e a prevenção pela vacina.<\/p><\/figure>\n<p>Tabagismo, imunossupressão (como no HIV), início sexual precoce, muitos parceiros, multiparidade e uso prolongado de contraceptivo oral funcionam como cofatores, facilitando a persistência ou a progressão.<\/p>\n<div class=\"tbl mapa\"><table><thead><tr><th>Mecanismo<\/th><th>O que aparece na clínica<\/th><\/tr><\/thead><tbody><tr><td>Perda do APC, via Wnt ligada<\/td><td>Pólipos adenomatosos (na polipose familiar, centenas deles)<\/td><\/tr><tr><td>Sequência lenta adenoma-carcinoma<\/td><td>Rastreamento com colonoscopia e pesquisa de sangue oculto<\/td><\/tr><tr><td>Deficiência de reparo (Lynch)<\/td><td>Câncer colorretal jovem, cólon direito, história familiar, endométrio<\/td><\/tr><tr><td>Infecção produtiva do HPV<\/td><td>Coilócitos, LSIL no citopatológico<\/td><\/tr><tr><td>E6 e E7 inativam p53 e Rb<\/td><td>HSIL, p16 positivo, risco de invasão<\/td><\/tr><tr><td>Tumor invade estroma e vasos<\/td><td>Sangramento pós-coito, corrimento, dor pélvica; no intestino, alteração do hábito, sangue nas fezes, anemia<\/td><\/tr><\/tbody><\/table><\/div><p class=\"conexao\"><span class=\"kicker\">Conexões no site<\/span>Tutorias 1.3 (Câncer colorretal) e 1.5 (Câncer do colo do útero) e roteiros SP 1.3 e 1.5 de Morfologia.<\/p>", "fontes": "Resumo elaborado com base em Robbins e Cotran, Patologia: Bases Patológicas das Doenças; INCA; Ministério da Saúde, Diretrizes para o Rastreamento do Câncer do Colo do Útero.", "tut": "Tutorias 1.3 e 1.5"}, {"id": "climaterio-menopausa", "area": "Ginecologia", "titulo": "Climatério e menopausa", "resumo": "Esgotamento folicular, por que o FSH sobe e como a falta de estrogênio explica fogachos, atrofia, perda óssea e risco cardiovascular.", "html": "<div class=\"ideia\"><span class=\"kicker\">Em uma frase<\/span><p>A menopausa é a falência folicular do ovário: sem folículos, caem a inibina e o estradiol, o FSH sobe, e cada tecido que depende de estrogênio sente a falta à sua maneira.<\/p><\/div>\n<h2>Fisiologia<\/h2>\n<h3>Um estoque que não se renova<\/h3>\n<p>A mulher nasce com todos os folículos que terá: cerca de 1 a 2 milhões ao nascimento, algumas centenas de milhares na menarca e apenas cerca de mil perto da menopausa. A cada ciclo, muitos folículos são recrutados e quase todos entram em atresia. Quando o estoque se esgota, o ovário deixa de responder às gonadotrofinas.<\/p>\n<h3>Da perimenopausa à pós-menopausa<\/h3>\n<p>O primeiro sinal hormonal é a queda da inibina B, produzida pelos folículos em crescimento. Com menos inibina, o FSH sobe ainda com ciclos presentes, acelera o recrutamento e encurta a fase folicular, de modo que os ciclos ficam mais curtos. Depois surgem falhas de ovulação: o estradiol oscila (pode até ficar alto em alguns ciclos), a progesterona falta, e os ciclos ficam irregulares, com risco de sangramento anormal.<\/p>\n<p>A menopausa é definida em retrospecto, após 12 meses de amenorreia, por volta dos 50 anos. Na pós-menopausa, o FSH e o LH ficam altos (o FSH mais que o LH), o estradiol fica baixo, e o estrogênio predominante passa a ser a estrona, produzida no tecido adiposo pela aromatização de androgênios das adrenais e do estroma ovariano.<\/p>\n<figure class=\"casc\"><figcaption>Da falência folicular à menopausa<\/figcaption><ol><li><span>Esgotamento dos folículos<\/span><\/li><li class=\"par\"><span>Queda da inibina B<\/span><span>Queda do estradiol<\/span><\/li><li><span>Perda do feedback negativo: FSH e LH sobem<\/span><\/li><li><span>Ciclos curtos, depois anovulatórios e irregulares<\/span><\/li><li class=\"fim\"><span>Amenorreia por 12 meses: menopausa<\/span><\/li><\/ol><\/figure>\n<h2>Fisiopatologia dos sintomas<\/h2>\n<h3>Fogachos<\/h3>\n<p>O estrogênio modula os neurônios do núcleo arqueado do hipotálamo que expressam kisspeptina, neurocinina B e dinorfina (neurônios KNDy). Com estrogênio baixo, esses neurônios ficam hiperativos e a zona termoneutra se estreita: pequenas elevações da temperatura central passam a disparar os mecanismos de perda de calor, com vasodilatação periférica, calor no rosto e no tronco, sudorese e, às vezes, palpitação. À noite, os suores interrompem o sono. Essa via explica os medicamentos que bloqueiam o receptor de neurocinina 3.<\/p>\n<h3>Síndrome geniturinária<\/h3>\n<p>O epitélio vaginal e uretral depende de estrogênio para se manter espesso e rico em glicogênio. Sem estrogênio, o epitélio afina, o glicogênio diminui, os lactobacilos perdem substrato, o pH vaginal sobe e a mucosa fica seca e frágil. Daí vêm ressecamento, ardor, dispareunia, urgência miccional e infecções urinárias de repetição.<\/p>\n<h3>Osso<\/h3>\n<p>O estrogênio freia a reabsorção óssea: reduz o RANKL, aumenta a osteoprotegerina e encurta a vida dos osteoclastos. Sem ele, a reabsorção supera a formação, e a perda óssea é mais rápida nos primeiros anos após a menopausa, sobretudo no osso trabecular (vértebras, punho, colo do fêmur). O resultado é osteopenia, osteoporose e fraturas por fragilidade.<\/p>\n<h3>Coração, metabolismo, pele e humor<\/h3>\n<p>O estrogênio favorece a vasodilatação dependente de óxido nítrico e um perfil lipídico mais favorável. Depois da menopausa, o LDL tende a subir, a gordura se desloca para a região visceral e a resistência à insulina aumenta, aproximando o risco cardiovascular feminino do masculino. Na pele, cai a produção de colágeno. A oscilação hormonal interfere na serotonina e na noradrenalina, e os despertares noturnos pioram humor, memória e concentração. O índice de Kupperman soma esses sintomas para graduar a intensidade do climatério.<\/p>\n<h3>E a TPM?<\/h3>\n<p>Na tensão pré-menstrual os níveis hormonais costumam ser normais. O que muda é a sensibilidade do sistema nervoso às oscilações da fase lútea: metabólitos da progesterona, como a alopregnanolona, atuam no receptor GABA-A, e a interação com a serotonina parece central (o que explica a boa resposta aos inibidores seletivos da recaptação de serotonina). Os sintomas aparecem na fase lútea e somem com a menstruação.<\/p>\n<div class=\"tbl mapa\"><table><thead><tr><th>Mecanismo<\/th><th>O que aparece na clínica<\/th><\/tr><\/thead><tbody><tr><td>Estrogênio baixo estreita a zona termoneutra do hipotálamo<\/td><td>Fogachos, sudorese noturna, insônia<\/td><\/tr><tr><td>Atrofia do epitélio vaginal e uretral, pH vaginal mais alto<\/td><td>Ressecamento, dispareunia, urgência, infecção urinária de repetição<\/td><\/tr><tr><td>Reabsorção óssea maior que a formação<\/td><td>Osteoporose e fraturas (vértebra, punho, quadril)<\/td><\/tr><tr><td>Perda do efeito vascular e metabólico do estrogênio<\/td><td>LDL mais alto, gordura visceral, mais risco cardiovascular<\/td><\/tr><tr><td>Oscilação hormonal sobre serotonina e noradrenalina<\/td><td>Irritabilidade, humor deprimido, dificuldade de concentração<\/td><\/tr><tr><td>Anovulação da perimenopausa<\/td><td>Ciclos irregulares e sangramento uterino anormal<\/td><\/tr><\/tbody><\/table><\/div><p class=\"conexao\"><span class=\"kicker\">Conexões no site<\/span>Tutoria 2.1 (Climatério e TPM) e o resumo de Ciclo menstrual e sangramento uterino anormal.<\/p>", "fontes": "Resumo elaborado com base em Guyton e Hall, Tratado de Fisiologia Médica; Berek e Novak, Tratado de Ginecologia; Febrasgo, Manual de Climatério.", "tut": "Tutoria 2.1"}, {"id": "gestacao-adaptacoes", "area": "Obstetrícia", "titulo": "Adaptações da gestação, diabetes gestacional e pré-eclâmpsia", "resumo": "Como o corpo materno muda para nutrir o feto e o que dá errado no diabetes gestacional e na pré-eclâmpsia.", "html": "<div class=\"ideia\"><span class=\"kicker\">Em uma frase<\/span><p>A gestação reprograma a fisiologia materna para nutrir o feto, com mais volume, mais débito cardíaco, menos resistência vascular e alguma resistência à insulina. As doenças da gestação aparecem quando essa adaptação falha.<\/p><\/div>\n<h2>Fisiologia: as adaptações maternas<\/h2>\n<h3>Cardiovascular e sangue<\/h3>\n<p>O volume plasmático aumenta cerca de 40 a 50%, mais do que a massa de hemácias (cerca de 20 a 30%). A hemoglobina cai por diluição, a chamada anemia fisiológica da gestação. O débito cardíaco sobe de 30 a 50%, pelo aumento da frequência cardíaca e do volume sistólico. A resistência vascular periférica cai por ação da progesterona, do óxido nítrico e das prostaglandinas, e a pressão arterial costuma ficar mais baixa no segundo trimestre. A partir da segunda metade, o útero em decúbito dorsal comprime a veia cava e reduz o retorno venoso: por isso a gestante deve deitar em decúbito lateral esquerdo.<\/p>\n<p>A gestação é um estado de hipercoagulabilidade: aumentam o fibrinogênio e os fatores VII, VIII e X, e cai a proteína S. Isso protege contra a hemorragia no parto, mas aumenta o risco de trombose venosa.<\/p>\n<h3>Respiratório e renal<\/h3>\n<p>A progesterona estimula o centro respiratório: o volume corrente e a ventilação por minuto aumentam, a PaCO₂ cai e surge uma alcalose respiratória compensada pelos rins. O útero eleva o diafragma e reduz a capacidade residual funcional, o que contribui para a dispneia fisiológica.<\/p>\n<p>O fluxo plasmático renal e a taxa de filtração glomerular aumentam cerca de 50%, de modo que creatinina e ureia ficam mais baixas do que fora da gestação. A glicosúria pode ser fisiológica. A progesterona e a compressão uterina dilatam os ureteres, mais à direita, e a estase urinária aumenta o risco de pielonefrite.<\/p>\n<h3>Digestório e metabolismo<\/h3>\n<p>A progesterona relaxa a musculatura lisa: o esfíncter esofágico inferior perde tônus (refluxo), o trânsito intestinal fica lento (constipação) e a vesícula esvazia menos (cálculos). No metabolismo, a primeira metade é anabólica, com estoque de gordura. Na segunda metade, os hormônios placentários (lactogênio placentário, progesterona, cortisol, hormônio do crescimento placentário) criam resistência à insulina, que mantém a glicose materna disponível para o feto.<\/p>\n<h2>Fisiopatologia<\/h2>\n<h3>Diabetes mellitus gestacional<\/h3>\n<p>Na gestação normal, o pâncreas responde à resistência insulínica aumentando a secreção de insulina. No diabetes gestacional, a célula beta não consegue compensar e surge hiperglicemia. A glicose atravessa a placenta por difusão facilitada, mas a insulina materna não. O pâncreas fetal responde com hiperinsulinemia (hipótese de Pedersen), e a insulina, que é um hormônio de crescimento para o feto, leva à macrossomia. Ao nascer, a glicose materna é cortada de repente, mas a hiperinsulinemia persiste, causando hipoglicemia neonatal. A insulina também atrasa a maturação do surfactante, aumentando o risco de desconforto respiratório.<\/p>\n<figure class=\"casc\"><figcaption>Diabetes gestacional: da mãe ao feto<\/figcaption><ol><li><span>Hormônios placentários aumentam a resistência à insulina<\/span><\/li><li><span>Célula beta materna não compensa<\/span><\/li><li><span>Hiperglicemia materna<\/span><\/li><li><span>Glicose atravessa a placenta (insulina não)<\/span><\/li><li><span>Hiperinsulinemia fetal<\/span><\/li><li class=\"par fim\"><span>Macrossomia e distocia de ombro<\/span><span>Hipoglicemia neonatal<\/span><span>Atraso na maturação pulmonar<\/span><\/li><\/ol><\/figure>\n<h3>Pré-eclâmpsia<\/h3>\n<p>Na placentação normal, o trofoblasto invade as artérias espiraladas e destrói sua camada muscular, transformando-as em vasos largos e de baixa resistência que garantem o fluxo para a placenta. Na pré-eclâmpsia, essa invasão é superficial: as artérias continuam estreitas e reativas, e a placenta sofre isquemia e estresse oxidativo.<\/p>\n<p>A placenta isquêmica libera na circulação materna fatores antiangiogênicos, principalmente o sFlt-1 e a endoglina solúvel, que sequestram o VEGF e o PlGF. Sem esses fatores, o endotélio materno adoece em todo o corpo. A disfunção endotelial explica tudo o que se vê: vasoconstrição e hipertensão, aumento da permeabilidade com edema, lesão glomerular com proteinúria, ativação de plaquetas e da coagulação, lesão hepática e, no sistema nervoso, cefaleia, escotomas e convulsões (eclâmpsia). A forma grave com hemólise, elevação de enzimas hepáticas e plaquetopenia é a síndrome HELLP. Como a origem está na placenta, a resolução definitiva é o parto; o ácido acetilsalicílico em baixa dose e o cálcio, iniciados no pré-natal das gestantes de risco, reduzem a chance de a doença aparecer.<\/p>\n<figure class=\"casc\"><figcaption>Pré-eclâmpsia: da placenta ao endotélio<\/figcaption><ol><li><span>Invasão trofoblástica superficial<\/span><\/li><li><span>Artérias espiraladas estreitas<\/span><\/li><li><span>Isquemia e estresse oxidativo placentário<\/span><\/li><li><span>Liberação de sFlt-1 e endoglina solúvel (menos VEGF e PlGF livres)<\/span><\/li><li><span>Disfunção endotelial sistêmica<\/span><\/li><li class=\"par fim\"><span>Hipertensão<\/span><span>Proteinúria e edema<\/span><span>HELLP<\/span><span>Eclâmpsia<\/span><\/li><\/ol><\/figure><div class=\"tbl mapa\"><table><thead><tr><th>Mecanismo<\/th><th>O que aparece na clínica<\/th><\/tr><\/thead><tbody><tr><td>Volume plasmático aumenta mais que as hemácias<\/td><td>Hemoglobina mais baixa (anemia fisiológica)<\/td><\/tr><tr><td>Compressão da veia cava pelo útero<\/td><td>Hipotensão e tontura em decúbito dorsal<\/td><\/tr><tr><td>Progesterona no centro respiratório<\/td><td>Dispneia fisiológica, PaCO₂ baixa<\/td><\/tr><tr><td>Ureteres dilatados e estase urinária<\/td><td>Mais pielonefrite<\/td><\/tr><tr><td>Resistência à insulina não compensada<\/td><td>Diabetes gestacional, macrossomia, hipoglicemia neonatal<\/td><\/tr><tr><td>Disfunção endotelial por fatores antiangiogênicos<\/td><td>Hipertensão, proteinúria, cefaleia, escotomas, dor epigástrica<\/td><\/tr><\/tbody><\/table><\/div><p class=\"conexao\"><span class=\"kicker\">Conexões no site<\/span>Tutoria 2.2 (Gestação e pré-natal) e Semiologia, Parto e partograma.<\/p>", "fontes": "Resumo elaborado com base em Rezende, Obstetrícia Fundamental; Williams Obstetrics; Guyton e Hall, Tratado de Fisiologia Médica.", "tut": "Tutoria 2.2"}, {"id": "ciclo-menstrual-sua", "area": "Ginecologia", "titulo": "Ciclo menstrual e sangramento uterino anormal", "resumo": "Eixo hipotálamo-hipófise-ovário, fases do ciclo, endométrio e por que a anovulação faz o sangramento perder o ritmo.", "html": "<div class=\"ideia\"><span class=\"kicker\">Em uma frase<\/span><p>O endométrio é um espelho dos hormônios ovarianos: o estrogênio faz crescer, a progesterona organiza e estabiliza, e a queda dos dois provoca a descamação. Quando falta ovulação, falta progesterona, e o sangramento perde o ritmo.<\/p><\/div>\n<h2>Fisiologia<\/h2>\n<h3>O eixo hipotálamo-hipófise-ovário<\/h3>\n<p>O hipotálamo libera GnRH em pulsos, e é justamente a pulsatilidade que mantém a hipófise anterior respondendo com FSH e LH. A exposição contínua ao GnRH faz o contrário: dessensibiliza os receptores e desliga o eixo, o que explica o uso dos análogos de GnRH para bloquear o ovário.<\/p>\n<p>No ovário vale a teoria das duas células. O LH estimula as células da teca a produzir androgênios (androstenediona), que passam para as células da granulosa, onde o FSH ativa a aromatase e converte esses androgênios em estradiol. Sem as duas gonadotrofinas trabalhando juntas, não há estrogênio suficiente.<\/p>\n<h3>Fase folicular, ovulação e fase lútea<\/h3>\n<p>No início do ciclo, com estradiol e progesterona baixos, o FSH sobe e recruta um grupo de folículos. O folículo com mais receptores de FSH e mais aromatase passa a produzir mais estradiol e inibina B, que inibem o FSH; os outros folículos, dependentes de FSH, entram em atresia, e o dominante segue sozinho.<\/p>\n<p>Quando o estradiol fica alto e sustentado por cerca de dois dias, o feedback sobre a hipófise se inverte de negativo para positivo, e surge o pico de LH. A ovulação acontece cerca de 34 a 36 horas depois do início do pico. O folículo rompido vira corpo lúteo, que produz progesterona (e também estradiol e inibina A). A fase lútea é a parte mais constante do ciclo, cerca de 14 dias: sem gravidez, o corpo lúteo regride, progesterona e estradiol caem, o FSH volta a subir e um novo ciclo começa. Na gravidez, o hCG do trofoblasto mantém o corpo lúteo.<\/p>\n<figure class=\"fig ciclo\" data-ciclo='{\"L\": 58, \"R\": 646, \"series\": [[\"fsh\", \"FSH\", [[1, 0.45], [3, 0.55], [5, 0.5], [7, 0.38], [10, 0.28], [12, 0.3], [13, 0.48], [14, 0.72], [15, 0.38], [17, 0.2], [21, 0.14], [25, 0.2], [27, 0.36], [28, 0.45]]], [\"lh\", \"LH\", [[1, 0.2], [5, 0.2], [9, 0.21], [11, 0.25], [12, 0.33], [13, 0.68], [14, 1.0], [15, 0.42], [16, 0.22], [20, 0.16], [28, 0.18]]], [\"e2\", \"Estradiol\", [[1, 0.1], [4, 0.13], [7, 0.24], [10, 0.5], [12, 0.82], [13, 0.86], [14, 0.55], [15, 0.32], [17, 0.38], [21, 0.56], [24, 0.44], [26, 0.24], [28, 0.11]]], [\"p4\", \"Progesterona\", [[1, 0.05], [12, 0.06], [14, 0.09], [16, 0.25], [18, 0.55], [21, 0.86], [23, 0.75], [25, 0.42], [27, 0.13], [28, 0.06]]]], \"notas\": [[1, 5, \"Menstruação\", \"Estradiol e progesterona baixos; o FSH sobe e recruta folículos. A camada funcional do endométrio descama.\"], [6, 11, \"Fase folicular\", \"O folículo dominante produz estradiol e inibina B; o FSH cai. O endométrio prolifera.\"], [12, 13, \"Fase folicular tardia\", \"Estradiol alto e sustentado: o feedback sobre a hipófise passa de negativo a positivo.\"], [14, 14, \"Ovulação\", \"Pico de LH; a ovulação acontece cerca de 34 a 36 horas após o início do pico.\"], [15, 19, \"Fase lútea\", \"O corpo lúteo produz progesterona e estradiol. O endométrio fica secretor.\"], [20, 24, \"Fase lútea média\", \"Pico de progesterona: endométrio pronto para a implantação.\"], [25, 28, \"Fase lútea tardia\", \"Sem gravidez, o corpo lúteo regride; estradiol e progesterona caem e vem a menstruação.\"]]}'><div class=\"leg\"><span><i class=\"sw fsh\"><\/i>FSH<\/span><span><i class=\"sw lh\"><\/i>LH<\/span><span><i class=\"sw e2\"><\/i>Estradiol<\/span><span><i class=\"sw p4\"><\/i>Progesterona<\/span><\/div><div class=\"plot\"><svg viewBox=\"0 0 660 300\" role=\"img\" aria-label=\"Esquema dos níveis de FSH, LH, estradiol e progesterona ao longo de um ciclo de 28 dias: FSH sobe no início, LH tem pico no dia 14, estradiol tem pico antes da ovulação e um segundo menor na fase lútea, progesterona tem pico por volta do dia 21.\"><rect class=\"band\" x=\"58.0\" y=\"22\" width=\"87.1\" height=\"228\"/><line class=\"ovu\" x1=\"341.1\" x2=\"341.1\" y1=\"22\" y2=\"250\"/><text class=\"ph long\" x=\"101.6\" y=\"36\" text-anchor=\"middle\">Menst 248.6,239.0 L254.0,239.0 L259.4,238.9 L264.9,238.8 L270.3,238.8 L275.8,238.7 L281.2,238.6 L286.7,238.5 L292.1,238.4 L297.6,238.4 L303.0,238.0 L308.4,237.8 L313.9,237.6 L319.3,237.3 L324.8,236.7 L330.2,235.9 L335.7,234.5 L341.1,232.5 L346.6,230.1 L352.0,227.2 L357.4,223.9 L362.9,220.3 L368.3,216.2 L373.8,211.8 L379.2,206.9 L384.7,201.5 L390.1,195.5 L395.6,188.9 L401.0,181.7 L406.4,174.2 L411.9,166.5 L417.3,158.6 L422.8,150.9 L428.2,143.3 L433.7,138.1 L439.1,132.4 L444.6,126.5 L450.0,120.4 L455.4,114.3 L460.9,108.3 L466.3,102.5 L471.8,97.2 L477.2,92.5 L482.7,88.5 L488.1,85.3 L493.6,83.2 L499.0,81.6 L504.4,81.8 L509.9,83.3 L515.3,86.1 L520.8,89.8 L526.2,94.3 L531.7,99.2 L537.1,104.5 L542.6,110.5 L548.0,117.7 L553.4,125.7 L558.9,134.3 L564.3,143.2 L569.8,152.1 L575.2,160.6 L580.7,168.5 L586.1,176.2 L591.6,184.1 L597.0,192.1 L602.4,199.8 L607.9,207.1 L613.3,213.9 L618.8,219.8 L624.2,224.8 L629.7,231.5 L635.1,235.1 L640.6,236.9 L646.0,238.4\"/><text class=\"lab\" x=\"101.6\" y=\"133.3\" text-anchor=\"middle\">FSH<\/text><text class=\"lab\" x=\"348.7\" y=\"54.0\" text-anchor=\"start\">LH<\/text><text class=\"lab\" x=\"310.6\" y=\"81.2\" text-anchor=\"end\">Estradiol<\/text><text class=\"lab\" x=\"493.6\" y=\"73.2\" text-anchor=\"middle\">Progesterona<\/text><line class=\"cross\" x1=\"0\" x2=\"0\" y1=\"22\" y2=\"250\" visibility=\"hidden\"/><rect class=\"hit\" x=\"58\" y=\"22\" width=\"588\" height=\"228\"/><\/svg><div class=\"tip\" hidden><\/div><\/div><figcaption>Esquema dos hormônios em um ciclo de 28 dias (níveis relativos, sem escala). Passe o dedo ou o mouse sobre o gráfico para ver o que acontece em cada dia.<\/figcaption><\/figure>\n<h3>O que acontece no endométrio<\/h3>\n<p>Na fase proliferativa, o estradiol faz glândulas, estroma e artérias espiraladas crescerem. Na fase secretora, a progesterona transforma esse tecido: as glândulas ficam tortuosas e secretoras, o estroma fica edemaciado e se prepara para a decidualização. É a progesterona que dá ao endométrio uma estrutura estável e organizada.<\/p>\n<p>Quando a progesterona cai, aumentam as prostaglandinas locais, as artérias espiraladas sofrem vasoconstrição, a camada funcional entra em isquemia e descama. A camada basal permanece e regenera o endométrio no ciclo seguinte. O sangramento normal para por vasoconstrição, agregação plaquetária, formação de fibrina e reepitelização estimulada pelo novo estrogênio. É por isso que a menstruação ovulatória costuma ser previsível em intervalo, duração e volume.<\/p>\n<h2>Fisiopatologia<\/h2>\n<h3>PALM-COEIN: estrutural ou funcional<\/h3>\n<p>A classificação da FIGO separa as causas de sangramento uterino anormal em estruturais (Pólipo, Adenomiose, Leiomioma, Malignidade e hiperplasia), que costumam ser vistas em exame de imagem ou histologia, e não estruturais (Coagulopatia, disfunção Ovulatória, causa Endometrial, Iatrogênica e Não classificada).<\/p>\n<h3>Disfunção ovulatória: estrogênio sem oposição<\/h3>\n<p>É a causa funcional mais comum e a que melhor mostra a fisiologia. Sem ovulação não há corpo lúteo, e sem corpo lúteo não há progesterona. O endométrio continua sob estímulo do estrogênio, fica espesso, muito vascularizado e sem a sustentação do estroma secretor. Esse tecido frágil descama de forma assíncrona, em pontos diferentes e em momentos diferentes, por ruptura (quando cresce além do que o estrogênio sustenta) ou por privação (quando o estrogênio oscila e cai). O resultado é sangramento irregular, às vezes prolongado e intenso, intercalado com períodos de amenorreia.<\/p>\n<p>Acontece nos extremos da vida reprodutiva (logo após a menarca, pela imaturidade do feedback positivo, e na perimenopausa, pelo declínio folicular) e em quadros como síndrome dos ovários policísticos, hiperprolactinemia, hipotireoidismo, obesidade e estresse. A longo prazo, o estrogênio sem oposição aumenta o risco de hiperplasia endometrial e de carcinoma de endométrio. Por isso o tratamento lógico usa progestagênio (sozinho ou no contraceptivo combinado): ele devolve ao endométrio a organização que faltava.<\/p>\n<figure class=\"casc\"><figcaption>Do ciclo anovulatório ao sangramento<\/figcaption><ol><li><span>Ciclo sem ovulação<\/span><\/li><li><span>Sem corpo lúteo, sem progesterona<\/span><\/li><li><span>Estrogênio sem oposição<\/span><\/li><li><span>Endométrio espesso, vascularizado e instável<\/span><\/li><li><span>Descamação assíncrona, por ruptura ou por privação<\/span><\/li><li class=\"fim\"><span>Sangramento irregular, prolongado ou intenso<\/span><\/li><li class=\"fim\"><span>A longo prazo: hiperplasia e risco de carcinoma de endométrio<\/span><\/li><\/ol><\/figure>\n<h3>Causas estruturais e coagulopatia<\/h3>\n<p>O leiomioma submucoso aumenta a superfície endometrial, deforma a cavidade e atrapalha a contração do miométrio e a hemostasia, produzindo aumento do fluxo. Na adenomiose, glândulas e estroma endometriais dentro do miométrio deixam o útero aumentado e amolecido, com sangramento aumentado e dismenorreia. O pólipo é um crescimento focal, muitas vezes com sangramento intermenstrual. Nas coagulopatias, como a doença de von Willebrand, a hemostasia primária falha e o sangramento é intenso desde a menarca.<\/p>\n<div class=\"tbl mapa\"><table><thead><tr><th>Mecanismo<\/th><th>O que aparece na clínica<\/th><\/tr><\/thead><tbody><tr><td>Anovulação: sem progesterona, estrogênio sem oposição<\/td><td>Ciclos irregulares, sangramento imprevisível, às vezes intenso; endométrio espesso na ultrassonografia<\/td><\/tr><tr><td>Leiomioma submucoso: mais superfície endometrial e contração prejudicada<\/td><td>Fluxo aumentado e prolongado, anemia ferropriva, útero aumentado<\/td><\/tr><tr><td>Adenomiose: endométrio dentro do miométrio<\/td><td>Dismenorreia progressiva, fluxo aumentado, útero globoso e amolecido<\/td><\/tr><tr><td>Pólipo: crescimento focal do endométrio<\/td><td>Sangramento intermenstrual ou pós-coito<\/td><\/tr><tr><td>Coagulopatia: falha da hemostasia primária<\/td><td>Fluxo intenso desde a menarca, sangramentos em outros locais<\/td><\/tr><\/tbody><\/table><\/div><p class=\"conexao\"><span class=\"kicker\">Conexões no site<\/span>Tutoria 2.4 e roteiro SP 2.4 (Sangramento uterino anormal) e Tutoria 2.1 (Climatério e TPM).<\/p>", "fontes": "Resumo elaborado com base em Guyton e Hall, Tratado de Fisiologia Médica; Berek e Novak, Tratado de Ginecologia; classificação PALM-COEIN da FIGO.", "tut": "Tutoria 2.4"}, {"id": "sp-3-1-farmacocinetica", "area": "Toxicologia e Farmacologia", "titulo": "Farmacocinética: o que o organismo faz com o fármaco", "resumo": "Absorção, distribuição, ligação às proteínas plasmáticas e biotransformação, com gráficos e esquemas interativos.", "src": "referenciais/sp-3-1-farmacocinetica.html", "fontes": "Base: aula de Farmacocinética e Farmacodinâmica (Prof. Giancarlo Nicoletti). Referências ao fim de cada seção.", "tut": "SP 3.1"}];

const FLASH = {"carcinogenese-colon-colo": [["Quais são os três grupos de genes que controlam a divisão celular?", "Proto-oncogenes (aceleradores, como KRAS e BRAF), genes supressores de tumor (freios, como APC, TP53 e RB) e genes de reparo do DNA (MLH1, MSH2, MSH6, PMS2)."], ["Quantos alelos precisam ser alterados em um proto-oncogene para causar efeito?", "Basta um. Uma mutação de ganho de função em um único alelo já mantém o sinal de proliferação ligado."], ["O que é a hipótese dos dois golpes de Knudson?", "Para um gene supressor de tumor perder a função, os dois alelos precisam ser perdidos. Em síndromes hereditárias, o primeiro golpe já vem herdado."], ["Por que o p53 é chamado de guardião do genoma?", "Diante de dano ao DNA, ele para o ciclo celular para que haja reparo ou, se o dano for grande, leva a célula à apoptose."], ["Como a proteína Rb controla o ciclo celular?", "Segura o fator de transcrição E2F e impede a passagem da fase G1 para S. Quando é fosforilada, libera o E2F e a célula se divide."], ["Qual é o primeiro passo da sequência adenoma-carcinoma?", "A perda do APC: a betacatenina não é degradada, a via Wnt fica ligada e as células da cripta proliferam, formando focos de cripta aberrante e adenomas iniciais."], ["Quais são os passos seguintes da sequência adenoma-carcinoma?", "Ativação do KRAS (o adenoma cresce), perda de 18q/SMAD4 (adenoma avançado) e perda do TP53 (carcinoma invasor)."], ["Quanto tempo leva a sequência adenoma-carcinoma e por que isso importa?", "Em média cerca de 10 anos. Essa janela permite o rastreamento: retirar o pólipo na colonoscopia interrompe a sequência."], ["O que acontece na polipose adenomatosa familiar?", "A primeira mutação do APC já é herdada, e surgem centenas de adenomas no cólon desde cedo, com risco de câncer próximo de 100% sem colectomia."], ["O que é a via de instabilidade de microssatélites?", "Cerca de 15% dos casos: falha no reparo de pareamento do DNA, herdada (Lynch) ou por metilação do promotor do MLH1. Mutações se acumulam em sequências repetitivas, como as do receptor II do TGF-beta e do BAX."], ["Como são os tumores com instabilidade de microssatélites?", "Mais frequentes no cólon direito, mucinosos, com muitos linfócitos, e respondem bem à imunoterapia."], ["Como a dieta participa da carcinogênese colorretal?", "Dietas ricas em gordura e ultraprocessados aumentam os ácidos biliares secundários (como o desoxicólico), que causam estresse oxidativo, inflamação e dano ao DNA."], ["Por que a fibra é protetora para o cólon?", "Porque a microbiota a fermenta em butirato, que nutre o colonócito e tem efeito protetor."], ["Onde o HPV infecta o colo do útero e por quê?", "Na zona de transformação, onde o epitélio está em metaplasia e as células basais ficam mais acessíveis por microtraumas."], ["Qual a evolução da maioria das infecções por HPV?", "É transitória e eliminada pela imunidade em 1 a 2 anos, às vezes deixando só lesão de baixo grau com coilócitos."], ["O que acontece quando o DNA do HPV se integra ao genoma da célula?", "Muitas vezes o gene E2, que controlava o vírus, é rompido. Sem E2, as oncoproteínas E6 e E7 são produzidas em excesso."], ["O que a proteína E6 do HPV faz?", "Liga-se ao p53 e o leva à degradação, de modo que a célula perde a capacidade de parar para reparo ou entrar em apoptose. Também ativa a telomerase."], ["O que a proteína E7 do HPV faz?", "Liga-se ao Rb, libera o E2F e empurra a célula da fase G1 para a S sem controle."], ["Por que a p16 é marcador de lesão por HPV?", "Com o Rb inativado pela E7, a p16 se acumula na célula. Sua positividade na imuno-histoquímica identifica lesões transformadas pelo HPV."], ["Quais cofatores favorecem a persistência ou progressão do HPV?", "Tabagismo, imunossupressão (como HIV), início sexual precoce, muitos parceiros, multiparidade e uso prolongado de contraceptivo oral."]], "climaterio-menopausa": [["Por que a menopausa acontece?", "Por falência folicular: a mulher nasce com um estoque de folículos que não se renova, e quando ele se esgota o ovário deixa de responder às gonadotrofinas."], ["Quantos folículos a mulher tem ao longo da vida?", "Cerca de 1 a 2 milhões ao nascimento, algumas centenas de milhares na menarca e apenas cerca de mil perto da menopausa."], ["Qual é o primeiro sinal hormonal da perimenopausa?", "A queda da inibina B, produzida pelos folículos em crescimento. Com menos inibina, o FSH sobe mesmo com ciclos ainda presentes."], ["Por que os ciclos ficam mais curtos no início da perimenopausa?", "O FSH elevado acelera o recrutamento folicular e encurta a fase folicular."], ["Por que surge sangramento irregular na perimenopausa?", "Aparecem ciclos sem ovulação: o estradiol oscila, a progesterona falta e o endométrio sangra de forma irregular."], ["Como a menopausa é definida?", "Em retrospecto, após 12 meses de amenorreia, por volta dos 50 anos."], ["Como fica o perfil hormonal na pós-menopausa?", "FSH e LH altos (FSH mais que LH) e estradiol baixo, pela perda do feedback negativo."], ["Qual estrogênio predomina na pós-menopausa e de onde ele vem?", "A estrona, produzida no tecido adiposo pela aromatização de androgênios das adrenais e do estroma ovariano."], ["O que são os neurônios KNDy e qual sua relação com os fogachos?", "Neurônios do núcleo arqueado que expressam kisspeptina, neurocinina B e dinorfina. Sem estrogênio, ficam hiperativos e estreitam a zona termoneutra."], ["Por que o estreitamento da zona termoneutra causa fogacho?", "Pequenas elevações da temperatura central passam a disparar perda de calor: vasodilatação periférica, calor no rosto e tronco, sudorese e às vezes palpitação."], ["Que tratamento se baseia na via dos neurônios KNDy?", "Os antagonistas do receptor de neurocinina 3, que reduzem os fogachos sem usar hormônio."], ["Por que falta de estrogênio causa síndrome geniturinária?", "O epitélio vaginal e uretral afina e perde glicogênio. Os lactobacilos perdem substrato, o pH sobe e a mucosa fica seca e frágil."], ["Quais sintomas compõem a síndrome geniturinária?", "Ressecamento, ardor, dispareunia, urgência miccional e infecções urinárias de repetição."], ["Como o estrogênio protege o osso?", "Reduz o RANKL, aumenta a osteoprotegerina e encurta a vida dos osteoclastos, freando a reabsorção."], ["Onde a perda óssea pós-menopausa é mais intensa?", "No osso trabecular, como vértebras, punho e colo do fêmur, sobretudo nos primeiros anos após a menopausa."], ["Por que o risco cardiovascular aumenta após a menopausa?", "Perde-se a vasodilatação dependente de óxido nítrico, o LDL sobe, a gordura vai para a região visceral e a resistência à insulina aumenta."], ["Por que o humor e a cognição pioram no climatério?", "A oscilação hormonal interfere na serotonina e na noradrenalina, e os despertares noturnos pelos suores pioram humor, memória e concentração."], ["Na TPM, os níveis hormonais estão alterados?", "Não, costumam ser normais. O que muda é a sensibilidade do sistema nervoso às oscilações hormonais da fase lútea."], ["Qual mecanismo central explica a TPM?", "Metabólitos da progesterona, como a alopregnanolona, atuam no receptor GABA-A, e a interação com a serotonina é central. Por isso os ISRS funcionam bem."], ["Quando aparecem e somem os sintomas da TPM?", "Aparecem na fase lútea e desaparecem com a menstruação."]], "gestacao-adaptacoes": [["Quanto aumentam o volume plasmático e a massa de hemácias na gestação?", "O volume plasmático aumenta cerca de 40 a 50% e a massa de hemácias cerca de 20 a 30%, causando a anemia fisiológica por diluição."], ["Como o débito cardíaco aumenta na gestação?", "Sobe de 30 a 50% pelo aumento da frequência cardíaca e do volume sistólico."], ["Por que a resistência vascular cai na gestação?", "Pela ação da progesterona, do óxido nítrico e das prostaglandinas. A pressão arterial fica mais baixa no segundo trimestre."], ["Por que a gestante deve deitar em decúbito lateral esquerdo?", "Porque na segunda metade o útero comprime a veia cava em decúbito dorsal, reduz o retorno venoso e causa hipotensão."], ["Quais alterações da coagulação acontecem na gestação?", "Aumentam o fibrinogênio e os fatores VII, VIII e X, e cai a proteína S. Isso protege contra hemorragia no parto, mas aumenta o risco de trombose."], ["Por que a gestante tem PaCO₂ mais baixa?", "A progesterona estimula o centro respiratório, aumentando volume corrente e ventilação por minuto. Surge alcalose respiratória compensada pelos rins."], ["Por que existe dispneia fisiológica na gestação?", "Pelo estímulo respiratório da progesterona e pela elevação do diafragma pelo útero, que reduz a capacidade residual funcional."], ["O que acontece com a função renal na gestação?", "Fluxo plasmático renal e taxa de filtração aumentam cerca de 50%, e creatinina e ureia ficam mais baixas que fora da gestação."], ["Por que a gestante tem mais pielonefrite?", "A progesterona e a compressão uterina dilatam os ureteres (mais à direita), causando estase urinária."], ["Quais efeitos digestivos a progesterona causa?", "Relaxa a musculatura lisa: refluxo pela perda de tônus do esfíncter esofágico inferior, constipação pelo trânsito lento e cálculos pela vesícula que esvazia menos."], ["Como o metabolismo muda na primeira e na segunda metade da gestação?", "A primeira metade é anabólica, com estoque de gordura. Na segunda, os hormônios placentários causam resistência à insulina, mantendo glicose disponível para o feto."], ["O que diferencia a gestação normal do diabetes gestacional?", "Na gestação normal o pâncreas aumenta a secreção de insulina e compensa a resistência. No diabetes gestacional a célula beta não consegue compensar."], ["Por que o feto de mãe com diabetes fica macrossômico?", "A glicose atravessa a placenta, mas a insulina não. O pâncreas fetal produz muita insulina, que é hormônio de crescimento para o feto (hipótese de Pedersen)."], ["Por que o recém-nascido de mãe diabética tem hipoglicemia?", "Ao nascer, a glicose materna é cortada de repente, mas a hiperinsulinemia fetal persiste."], ["Por que o filho de mãe diabética tem mais desconforto respiratório?", "A hiperinsulinemia atrasa a maturação do surfactante pulmonar."], ["O que acontece com as artérias espiraladas na placentação normal?", "O trofoblasto invade e destrói a camada muscular delas, transformando-as em vasos largos e de baixa resistência."], ["O que falha na placentação da pré-eclâmpsia?", "A invasão trofoblástica é superficial: as artérias espiraladas continuam estreitas e reativas, e a placenta sofre isquemia e estresse oxidativo."], ["Quais fatores a placenta isquêmica libera e o que eles fazem?", "sFlt-1 e endoglina solúvel, fatores antiangiogênicos que sequestram VEGF e PlGF e causam disfunção endotelial em todo o corpo."], ["Como a disfunção endotelial explica a clínica da pré-eclâmpsia?", "Vasoconstrição (hipertensão), permeabilidade aumentada (edema), lesão glomerular (proteinúria), ativação plaquetária, lesão hepática e sintomas neurológicos (cefaleia, escotomas, convulsão)."], ["Qual é o tratamento definitivo da pré-eclâmpsia e como preveni-la?", "O parto, já que a origem está na placenta. AAS em baixa dose e cálcio iniciados no pré-natal de gestantes de risco reduzem a chance de a doença surgir."]], "ciclo-menstrual-sua": [["Por que o GnRH precisa ser liberado em pulsos?", "A pulsatilidade mantém a hipófise respondendo com FSH e LH. A exposição contínua dessensibiliza os receptores e desliga o eixo."], ["Como os análogos de GnRH bloqueiam o ovário?", "Por estímulo contínuo do receptor: após uma liberação inicial, a hipófise se dessensibiliza e FSH e LH caem."], ["O que é a teoria das duas células?", "O LH estimula a teca a produzir androgênios, que passam para a granulosa, onde o FSH ativa a aromatase e os converte em estradiol."], ["Como se escolhe o folículo dominante?", "O folículo com mais receptores de FSH e mais aromatase produz mais estradiol e inibina B, que reduzem o FSH. Os outros, dependentes de FSH, entram em atresia."], ["O que desencadeia o pico de LH?", "Estradiol alto e sustentado por cerca de dois dias inverte o feedback sobre a hipófise de negativo para positivo."], ["Quando ocorre a ovulação em relação ao pico de LH?", "Cerca de 34 a 36 horas após o início do pico de LH."], ["O que o corpo lúteo produz e quanto dura a fase lútea?", "Produz progesterona, estradiol e inibina A. A fase lútea é a mais constante do ciclo, cerca de 14 dias."], ["O que mantém o corpo lúteo na gravidez?", "O hCG produzido pelo trofoblasto."], ["O que o estradiol faz no endométrio?", "Na fase proliferativa, faz glândulas, estroma e artérias espiraladas crescerem."], ["O que a progesterona faz no endométrio?", "Na fase secretora, torna as glândulas tortuosas e secretoras e o estroma edemaciado, dando ao endométrio estrutura estável e preparando a decidualização."], ["Qual é a sequência de eventos que leva à menstruação?", "Queda da progesterona → aumento de prostaglandinas → vasoconstrição das artérias espiraladas → isquemia e descamação da camada funcional."], ["Como o sangramento menstrual normal para?", "Por vasoconstrição, agregação plaquetária, formação de fibrina e reepitelização estimulada pelo novo estrogênio."], ["Como o PALM-COEIN separa as causas de SUA?", "Estruturais: pólipo, adenomiose, leiomioma, malignidade e hiperplasia. Não estruturais: coagulopatia, disfunção ovulatória, endometrial, iatrogênica e não classificada."], ["Qual é a causa funcional mais comum de SUA?", "A disfunção ovulatória: sem ovulação não há corpo lúteo, e sem corpo lúteo não há progesterona."], ["Como é o endométrio sob estrogênio sem oposição?", "Espesso, muito vascularizado e sem a sustentação do estroma secretor. Esse tecido frágil descama de forma assíncrona, por ruptura ou por privação."], ["Em que situações a anovulação é mais comum?", "Nos extremos da vida reprodutiva (após a menarca e na perimenopausa) e em SOP, hiperprolactinemia, hipotireoidismo, obesidade e estresse."], ["Qual o risco do estrogênio sem oposição a longo prazo?", "Hiperplasia endometrial e carcinoma de endométrio."], ["Por que o progestagênio é o tratamento lógico do SUA anovulatório?", "Porque devolve ao endométrio a organização e a estabilidade que a falta de progesterona tirou."], ["Como o leiomioma submucoso e a adenomiose causam sangramento?", "O mioma submucoso aumenta a superfície endometrial e atrapalha a contração e a hemostasia. Na adenomiose, glândulas no miométrio deixam o útero aumentado, com sangramento e dismenorreia."], ["Como a doença de von Willebrand causa SUA?", "A hemostasia primária falha, e o sangramento menstrual é intenso desde a menarca."]]};
function fcShuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function fcEsc(s){ return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function flashRender(host, id, titulo){
  const all = FLASH[id] || [];
  let deck = [], i = 0;
  host.innerHTML = `<div class="fc"><div class="fc-k">Flashcards · ${fcEsc(titulo)}</div>
    <p class="fc-intro" style="margin-top:10px">${all.length} cartões sobre este tema. A cada clique em “Gerar flashcards” eles vêm em uma ordem diferente. Toque no cartão para ver a resposta.</p>
    <button class="fc-gen" type="button">Gerar flashcards</button><div class="fc-run"></div></div>`;
  const run = host.querySelector(".fc-run"), gen = host.querySelector(".fc-gen");
  function draw(){
    if (i >= deck.length){
      run.innerHTML = `<div class="fc-end"><b>Fim do baralho.</b><span class="fc-intro">Você passou pelos ${deck.length} cartões. Gere de novo para embaralhar.</span></div>`;
      gen.textContent = "Gerar flashcards de novo"; return;
    }
    const [q, a] = deck[i];
    run.innerHTML = `<div class="fc-card" tabindex="0" role="button" aria-label="Virar cartão"><div class="fc-in">
        <div class="fc-face fc-front"><span class="lab">Pergunta</span><span class="tx">${fcEsc(q)}</span><span class="hint">Toque para ver a resposta</span></div>
        <div class="fc-face fc-back"><span class="lab">Resposta</span><span class="tx">${fcEsc(a)}</span><span class="hint">Toque para voltar à pergunta</span></div></div></div>
      <div class="fc-bar"><button class="ghost fc-prev" type="button">← Anterior</button><span class="fc-cnt">${i + 1} de ${deck.length}</span><button class="ghost fc-next" type="button">Próximo →</button></div>
      <div class="fc-prog"><i style="width:${(i + 1) / deck.length * 100}%"></i></div>`;
    const card = run.querySelector(".fc-card");
    const flip = ()=>card.classList.toggle("flip");
    card.addEventListener("click", flip);
    card.addEventListener("keydown", e=>{ if (e.key === " " || e.key === "Enter"){ e.preventDefault(); flip(); } });
    run.querySelector(".fc-prev").disabled = i === 0;
    run.querySelector(".fc-prev").addEventListener("click", ()=>{ if (i > 0){ i--; draw(); } });
    run.querySelector(".fc-next").addEventListener("click", ()=>{ i++; draw(); });
    card.focus({preventScroll:true});
  }
  gen.addEventListener("click", ()=>{ deck = fcShuffle(all); i = 0; host.querySelector(".fc-intro").hidden = true; gen.textContent = "Embaralhar de novo"; draw(); });
}
document.addEventListener("keydown", e=>{
  const run = document.querySelector(".fc-run"); if (!run || !run.offsetParent) return;
  if (e.key === "ArrowRight") run.querySelector(".fc-next")?.click();
  if (e.key === "ArrowLeft") run.querySelector(".fc-prev")?.click();
});
/* Abas "Conteúdo | Flashcards" no leitor (Tutoria, Morfologia, Fisiologia) */
function flashTabs(id, titulo){
  const doc = document.getElementById("doc"), reader = document.getElementById("reader");
  reader.classList.remove("fc-mode");
  if (!(FLASH[id] || []).length) return;
  const body = document.createElement("div"); body.className = "fc-body";
  while (doc.firstChild) body.appendChild(doc.firstChild);
  const seg = document.createElement("div"); seg.className = "fc-seg"; seg.setAttribute("role", "group"); seg.setAttribute("aria-label", "Modo");
  seg.innerHTML = `<button type="button" data-m="c" aria-pressed="true">Conteúdo</button><button type="button" data-m="f" aria-pressed="false">Flashcards</button>`;
  const pane = document.createElement("div"); pane.className = "fc-pane"; pane.hidden = true;
  doc.append(seg, body, pane);
  seg.querySelectorAll("button").forEach(b=>b.addEventListener("click", ()=>{
    const f = b.dataset.m === "f";
    seg.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed", String(x === b)));
    body.hidden = f; pane.hidden = !f; reader.classList.toggle("fc-mode", f);
    if (f && !pane.firstChild) flashRender(pane, id, titulo);
    window.scrollTo({top:0});
  }));
}

/* Leitura */
let spy = null;
function openR(id){
  const r = ROTEIROS.find(x=>x.id===id); if (!r) return;
  const doc = $("doc"), tl = $("tocList"); tl.innerHTML = "";
  const addToc = (txt, cls, target)=>{
    const li = document.createElement("li"), a = document.createElement("a");
    a.href = "#"; a.textContent = txt; a.className = cls; a._t = target;
    a.addEventListener("click", e=>{ e.preventDefault(); a._t(); $("toc").classList.remove("open"); $("tocBtn").setAttribute("aria-expanded","false"); });
    li.appendChild(a); tl.appendChild(li); return a;
  };
  if (r.pages){
    doc.className = "doc pages"; doc.innerHTML = "";
    r.pages.forEach((src,i)=>{ const im = document.createElement("img"); im.className = "pg"; im.id = "pg" + (i+1); im.loading = i < 2 ? "eager" : "lazy";
      im.alt = r.sp + " · página " + (i+1); im.src = src; im.addEventListener("click", ()=>zoom(src)); doc.appendChild(im); });
    r.toc.forEach(h=>addToc(h.t, h.lvl === 3 ? "h3" : "h2", ()=>{
      const im = $("pg" + h.page); const top = im.getBoundingClientRect().top + window.scrollY + im.offsetHeight * h.y - 16;
      window.scrollTo({top: Math.max(0, top), behavior:"smooth"}); }));
  } else if (r.src){
    /* Referencial interativo guardado como página própria: abre dentro do leitor, na altura do conteúdo */
    doc.className = "doc embed"; doc.innerHTML = "";
    const f = document.createElement("iframe"); f.className = "embed-frame"; f.title = r.titulo; f.src = r.src;
    doc.appendChild(f);
    const fit = ()=>{ try { f.style.height = f.contentDocument.documentElement.scrollHeight + "px"; } catch(e){} };
    const goTo = el=>window.scrollTo({top: f.getBoundingClientRect().top + window.scrollY + el.getBoundingClientRect().top - 16, behavior:"smooth"});
    f.addEventListener("load", ()=>{
      try {
        const d = f.contentDocument; fit(); new ResizeObserver(fit).observe(d.body);
        d.querySelectorAll('a[href^="#"]').forEach(a=>a.addEventListener("click", e=>{ const t = d.getElementById(a.getAttribute("href").slice(1)); if (t){ e.preventDefault(); goTo(t); } }));
        d.querySelectorAll("h1.q, h2").forEach(h=>{ if (/^Refer/.test(h.textContent.trim())) return; addToc(h.textContent, h.tagName === "H1" ? "h2" : "h3", ()=>goTo(h)); });
      } catch(e){}
    });
  } else {
    doc.className = "doc";
    doc.innerHTML = `<header class="doc-head"><div class="kicker"></div><h1></h1><p></p></header>` + r.html + `<p class="fontes"></p>`;
    doc.querySelector(".kicker").textContent = "Fisiologia · " + r.tut;
    doc.querySelector("h1").textContent = r.titulo;
    doc.querySelector(".doc-head p").textContent = r.resumo;
    doc.querySelector(".fontes").textContent = r.fontes;
    doc.querySelectorAll("[data-ciclo]").forEach(cicloHover);
    doc.querySelectorAll("h2,h3").forEach((h,i)=>{ if (!h.id) h.id = "s" + i;
      addToc(h.textContent, h.tagName.toLowerCase(), ()=>h.scrollIntoView({behavior:"smooth", block:"start"}))._h = h; });
  }
  flashTabs(r.id, r.titulo);
  $("lib").hidden = true; $("reader").hidden = false; window.scrollTo({top:0});
  try { history.replaceState(null, "", "#" + id); } catch(e){}
  if (spy) spy.disconnect();
  if (r.pages || r.src) return;
  const links = [...tl.querySelectorAll("a")];
  spy = new IntersectionObserver(es=>{
    es.forEach(en=>{ if (en.isIntersecting){ links.forEach(a=>a.classList.toggle("on", a._h===en.target)); } });
  }, {rootMargin:"0px 0px -75% 0px"});
  doc.querySelectorAll("h2,h3").forEach(h=>spy.observe(h));
}
$("backLib").addEventListener("click", ()=>{ $("reader").hidden = true; $("lib").hidden = false; window.scrollTo({top:0}); try { history.replaceState(null, "", location.pathname + location.search); } catch(e){} });
$("tocBtn").addEventListener("click", ()=>{ const o = $("toc").classList.toggle("open"); $("tocBtn").setAttribute("aria-expanded", o ? "true" : "false"); });

/* Gráfico do ciclo: linha-guia e quadro com o que acontece em cada dia */
function cicloHover(fig){
  const D = JSON.parse(fig.dataset.ciclo), svg = fig.querySelector("svg"), tip = fig.querySelector(".tip"), cross = svg.querySelector(".cross"), hit = svg.querySelector(".hit");
  const vb = svg.viewBox.baseVal, X = d => D.L + (d - 1) / 27 * (D.R - D.L);
  const val = (pts, d)=>{ for (let i = 0; i < pts.length - 1; i++){ const [x0,y0] = pts[i], [x1,y1] = pts[i+1]; if (d >= x0 && d <= x1) return y0 + (y1 - y0) * (d - x0) / (x1 - x0); } return pts[pts.length-1][1]; };
  const nivel = v => v >= .9 ? "pico" : v >= .6 ? "alto" : v >= .3 ? "moderado" : "baixo";
  function show(ev){
    const r = svg.getBoundingClientRect(), sx = (ev.clientX - r.left) / r.width * vb.width;
    const d = Math.min(28, Math.max(1, Math.round(1 + (sx - D.L) / (D.R - D.L) * 27)));
    const x = X(d); cross.setAttribute("x1", x); cross.setAttribute("x2", x); cross.setAttribute("visibility", "visible");
    const n = D.notas.find(n=>d >= n[0] && d <= n[1]);
    tip.innerHTML = `<b>Dia ${d} · ${n[2]}</b><p>${n[3]}</p>` + D.series.map(([id, nome, pts])=>`<div class="r"><span><i class="sw ${id}"></i>${nome}</span><span>${nivel(val(pts, d))}</span></div>`).join("");
    tip.hidden = false;
    const px = x / vb.width * r.width, w = tip.offsetWidth;
    tip.style.left = (px + 14 + w > r.width ? Math.max(0, px - 14 - w) : px + 14) + "px";
  }
  const hide = ()=>{ tip.hidden = true; cross.setAttribute("visibility", "hidden"); };
  hit.addEventListener("pointermove", show); hit.addEventListener("pointerdown", show); hit.addEventListener("pointerleave", hide);
}
function zoom(src){ $("zoomImg").src = src; $("zoom").hidden = false; $("zoomX").hidden = false; $("zoom").scrollTo(0,0); }
function unzoom(){ $("zoom").hidden = true; $("zoomX").hidden = true; }
$("zoom").addEventListener("click", unzoom); $("zoomX").addEventListener("click", unzoom);
document.addEventListener("keydown", e=>{ if (e.key === "Escape") unzoom(); });
const start = location.hash.slice(1);
if (start && ROTEIROS.some(r=>r.id===start)) openR(start);
</script>
