<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Habilidades médicas</title>
<style>
/* Tutoria — objetivos de aprendizagem respondidos por situação-problema, na roupagem vitrine do site */
:root{
  --bg:#f5f5f7; --card:#ffffff; --ink:#1d1d1f; --muted:#6e6e73; --line:#d2d2d7; --soft:#f5f5f7; --hover:#ebebef;
  --accent:#0066cc; --accent-soft:#e8f2fd; --bad:#b3261e; --bad-soft:#fcebe9; --tip:#fff8e1; --tipline:#f0d78c;
  --shadow:0 1px 3px rgba(0,0,0,.04),0 10px 30px rgba(0,0,0,.045); --bar:rgba(245,245,247,.86);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1d1d1f; --ink:#f5f5f7; --muted:#a1a1a6; --line:#38383a; --soft:#2c2c2e; --hover:#2c2c2e;
  --accent:#2997ff; --accent-soft:#0b2a4a; --bad:#ee7f78; --bad-soft:#3a1e1d; --tip:#2b2610; --tipline:#5c4f1c;
  --shadow:0 1px 2px rgba(0,0,0,.4); --bar:rgba(22,22,23,.82);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;
  padding:0 max(22px,env(safe-area-inset-right,0px)) 60px max(22px,env(safe-area-inset-left,0px))}
button{font-family:var(--font)}
.kicker{font-size:11px;letter-spacing:.13em;font-weight:700;color:var(--muted);text-transform:uppercase}
.ghost{font:600 13px var(--font);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer}
.ghost:hover{background:var(--hover)}

/* Biblioteca */
.lib{max-width:1080px;margin:0 auto;padding-top:64px}
.lib h1{font-size:clamp(44px,7vw,76px);line-height:1.02;letter-spacing:-.06em;margin:14px 0 12px;font-weight:750}
.lib .lead{font-size:19px;color:var(--muted);max-width:620px;margin:0 0 40px}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:20px}
.rcard{display:flex;flex-direction:column;text-align:left;border:0;border-radius:24px;background:var(--card);box-shadow:var(--shadow);padding:0;overflow:hidden;cursor:pointer;color:var(--ink);
  transition:transform .4s cubic-bezier(.2,.75,.25,1),box-shadow .4s}
.rcard:hover{transform:translateY(-4px);box-shadow:0 16px 40px rgba(0,0,0,.11)}
.rcard:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
.rcard .tcv{position:relative;height:170px;background:#dcecff;color:#1d1d1f;padding:22px 24px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.tcv .tk{font-size:11px;letter-spacing:.13em;font-weight:700;text-transform:uppercase;opacity:.65}
.tcv .tn{font-size:64px;font-weight:750;letter-spacing:-.06em;line-height:1}
.tcv strong{position:absolute;right:18px;top:-18px;font-size:120px;line-height:1;opacity:.12}
:root[data-theme="dark"] .rcard .tcv{filter:brightness(.82)}
/* conteúdo vindo do Google Docs: títulos com fundo colorido, cores e marca-texto do original */
.doc h2.hb,.doc h3.hb{background:var(--hb);color:var(--c);padding:8px 14px;border-radius:12px;border-top:0;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.doc h2.hb{margin-top:52px}.doc h3.hb{display:inline-block;margin:28px 0 10px}
.doc h2.hc,.doc h3.hc{color:var(--c)}
.doc .cc{color:var(--c)}
.doc mark{background:var(--m);color:#1d1d1f;border-radius:3px;padding:0 2px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.doc mark .cc{color:inherit}
:root[data-theme="dark"] .doc .cc,:root[data-theme="dark"] .doc h2.hc,:root[data-theme="dark"] .doc h3.hc{color:color-mix(in srgb,var(--c) 40%,#ffffff)}
.doc figure{margin:14px 0}.doc figure img{margin:0;border-radius:10px}
.doc td p,.doc th p{margin:0}
.doc a{color:var(--accent);overflow-wrap:anywhere}
.doc .teoria p,.doc .teoria li{text-align:justify;hyphens:auto;-webkit-hyphens:auto}
.doc td,.doc th{text-align:left;hyphens:manual}
.rcard .bd{padding:20px 22px 22px;display:flex;flex-direction:column;gap:6px}
.rcard .sp{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.rcard .tt{font-size:24px;font-weight:700;letter-spacing:-.04em;line-height:1.12}
.rcard .ds{font-size:14px;color:var(--muted)}
.rcard .go{font-size:15px;font-weight:600;color:var(--accent);margin-top:6px}
.soon{border:2px dashed var(--line);border-radius:24px;padding:28px;color:var(--muted);font-size:15px;display:flex;flex-direction:column;justify-content:center;gap:6px;min-height:200px}
.soon b{color:var(--ink);font-size:18px;letter-spacing:-.02em}

/* Leitura */
.reader{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:250px minmax(0,1fr);gap:40px;padding-top:24px}
.toc{position:sticky;top:20px;align-self:start;max-height:calc(100vh - 40px);overflow-y:auto;padding:8px 0 20px}
.toc .back{margin-bottom:18px}
.toc ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px}
.toc a{display:block;color:var(--ink);text-decoration:none;font-size:13.5px;line-height:1.35;padding:6px 10px;border-radius:10px}
.toc a:hover{background:var(--hover)}
.toc a.h3{padding-left:22px;color:var(--muted);font-size:13px}
.toc a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.toc-btn{display:none}
.doc{background:var(--card);border-radius:28px;box-shadow:var(--shadow);padding:48px clamp(22px,5vw,64px) 56px;min-width:0}
.doc-head{margin-bottom:28px}
.doc-banner{display:block;width:100%;height:auto;margin:0 0 22px}
.doc.pages{padding:18px;background:var(--card)}
.pg{display:block;width:100%;height:auto;border-radius:12px;background:#fff;margin:0 0 14px;cursor:zoom-in;box-shadow:0 0 0 1px var(--line)}
.zoom{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.88);overflow:auto;-webkit-overflow-scrolling:touch;cursor:zoom-out}
.zoom img{display:block;width:min(1600px,200vw);max-width:none;margin:0 auto}
.zoom-x{position:fixed;top:12px;right:12px;z-index:51;font:600 14px var(--font);color:#fff;background:rgba(255,255,255,.18);border:0;border-radius:999px;padding:9px 16px;cursor:pointer}
.doc-head h1{font-size:clamp(34px,5vw,52px);line-height:1.04;letter-spacing:-.055em;margin:12px 0 8px}
.doc-head p{color:var(--muted);margin:0}
.doc h2{font-size:clamp(24px,3vw,30px);letter-spacing:-.04em;line-height:1.15;margin:48px 0 14px;padding-top:24px;border-top:1px solid var(--line);scroll-margin-top:24px}
.doc h3{font-size:19px;letter-spacing:-.02em;margin:30px 0 8px;scroll-margin-top:24px}
.doc p,.doc li{font-size:16.5px}
.doc p{margin:0 0 12px}
.doc ol,.doc ul{padding-left:22px;margin:0 0 14px}
.doc li p{margin:0 0 4px}
.doc strong{font-weight:650}
.doc img{max-width:100%;height:auto;display:block;border-radius:14px;margin:8px auto}
.doc blockquote{margin:16px 0;padding:14px 18px;background:var(--tip);border:1px solid var(--tipline);border-radius:16px}
.doc blockquote p:last-child{margin:0}
.tbl{overflow-x:auto;margin:14px 0 20px;border-radius:16px;border:1px solid var(--line)}
.doc table{border-collapse:collapse;width:100%;font-size:14.5px;line-height:1.45}
.doc th,.doc td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.doc th{background:var(--soft);font-weight:650}
.doc tr:last-child td{border-bottom:0}
.tbl.figs{border:0;border-radius:0}
.tbl.figs td{border:0;padding:6px;width:50%;font-size:13.5px;color:var(--muted)}
.doc .fig-cap{font-size:13.5px;color:var(--muted)}


/* roteiros exportados do Notion: mantém cores, destaques, quadros e colunas do original */
body.loading{cursor:progress}
.doc.notion p,.doc.notion li{white-space:pre-wrap}
.doc.notion h4,.doc.notion h5{font-size:17px;margin:22px 0 8px;letter-spacing:-.01em}
.doc.notion figure{margin:18px 0}
.doc.notion figure.image{text-align:center}
.doc.notion figure.image img{display:inline-block;margin:0 auto}
.doc.notion .callout{display:flex;gap:10px;border-radius:14px;padding:14px 16px;margin:16px 0;white-space:normal}
.doc.notion .callout p{margin:0}
.doc.notion .column-list{display:flex;gap:28px;margin:14px 0}
.doc.notion .column{flex:1;min-width:0}
.doc.notion .column > *:first-child{margin-top:0}
.doc.notion .icon{display:inline-flex;align-items:center;justify-content:center;max-width:1.2em;max-height:1.2em;vertical-align:text-bottom;margin-right:.4em}
.doc.notion details{margin:10px 0;padding:10px 14px;border-radius:12px;background:var(--soft)}
.doc.notion summary{cursor:pointer;font-weight:600}
.doc.notion ul.toggle{list-style:none;padding-left:0}
.doc.notion blockquote{margin:14px 0;padding:4px 0 4px 16px;border-left:3px solid var(--ink);background:none;border-radius:0}
.doc.notion .simple-table-header-color{background:var(--soft)}
.doc.notion .simple-table-header{font-weight:650}
.doc .block-color-orange,.doc .highlight-orange{color:#d27b2d}.doc .block-color-red,.doc .highlight-red{color:#cf5148}
.doc .block-color-blue,.doc .highlight-blue{color:#387dc9}.doc .block-color-teal,.doc .highlight-teal{color:#50946e}
.doc .block-color-purple,.doc .highlight-purple{color:#9a6bb4}.doc .block-color-pink,.doc .highlight-pink{color:#c14c8a}
.doc .block-color-gray,.doc .highlight-gray{color:#7d7a75}.doc .block-color-yellow,.doc .highlight-yellow{color:#cb9434}
.doc .block-color-gray_background{background:#f0efed}.doc .block-color-orange_background{background:#fbebde}.doc .block-color-yellow_background{background:#f9f3dc}
.doc .block-color-teal_background{background:#e8f1ec}.doc .block-color-blue_background{background:#e5f2fc}.doc .block-color-purple_background{background:#f3ebf9}
.doc .block-color-pink_background{background:#fae9f1}.doc .block-color-red_background{background:#fce9e7}
.doc [class*="_background"]{color:#1d1d1f;border-radius:6px}
.doc li[class*="_background"],.doc p[class*="_background"]{padding:2px 6px}
.doc .highlight-gray_background{background:rgba(42,28,0,.07)}.doc .highlight-orange_background{background:rgba(224,101,1,.13)}.doc .highlight-yellow_background{background:rgba(211,168,0,.14)}
.doc .highlight-blue_background{background:rgba(0,124,215,.1)}.doc .highlight-red_background{background:rgba(223,22,0,.1)}.doc .highlight-teal_background{background:rgba(0,100,45,.09)}
:root[data-theme="dark"] .doc .block-color-orange,:root[data-theme="dark"] .doc .highlight-orange{color:#e8955a}
:root[data-theme="dark"] .doc .block-color-red,:root[data-theme="dark"] .doc .highlight-red{color:#ee7f78}
:root[data-theme="dark"] .doc [class*="highlight-"][class*="_background"]{color:inherit;background:rgba(255,255,255,.12)}
@media (max-width:700px){.doc.notion .column-list{flex-direction:column;gap:0}}

/* ---------- Semiologia ---------- */
.rcard .scv{position:relative;height:170px;background:var(--soft);padding:22px 24px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.scv .tk{font-size:11px;letter-spacing:.13em;font-weight:700;text-transform:uppercase;color:var(--muted)}
.scv .tn{font-size:34px;font-weight:750;letter-spacing:-.05em;line-height:1.05;color:var(--ink)}
.scv svg{position:absolute;right:-6px;top:-8px;width:150px;height:150px;color:var(--ink);opacity:.07}
.seg{display:inline-flex;gap:2px;padding:3px;margin:4px 0 26px;background:var(--hover);border-radius:999px}
.seg button{font:600 14px var(--font);color:var(--muted);background:none;border:0;border-radius:999px;padding:8px 16px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.guide-intro{color:var(--muted);margin:0 0 18px}
.gprog{display:flex;align-items:center;gap:12px;margin:0 0 26px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.gprog .track{flex:1;max-width:320px;height:6px;border-radius:3px;background:var(--hover);overflow:hidden}
.gprog .fill{display:block;height:100%;width:0;background:var(--accent);border-radius:3px;transition:width .3s}
.etapa{border-top:1px solid var(--line);padding-top:6px;margin-top:30px}
.etapa h2{border-top:0!important;padding-top:0!important;margin:16px 0 12px!important;display:flex;align-items:baseline;gap:10px}
.etapa h2 .n{font-size:13px;font-weight:700;color:var(--accent);letter-spacing:0}
.etapa.alerta{border:0;background:#fdecec;border-radius:18px;padding:6px 20px 14px;margin-top:34px}
.etapa.alerta h2{color:#b3261e}
:root[data-theme="dark"] .etapa.alerta{background:#3a1e1d}:root[data-theme="dark"] .etapa.alerta h2{color:#ee7f78}
.check{display:flex;gap:14px;align-items:flex-start;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.etapa .check:last-child{border-bottom:0}
.check input{appearance:none;-webkit-appearance:none;flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);margin:2px 0 0;display:grid;place-items:center;cursor:pointer;background:var(--card)}
.check input:checked{background:var(--accent);border-color:var(--accent)}
.check input:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.check input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.check .t{font-weight:650;font-size:16px;line-height:1.35;display:block}
.check .d{display:block;color:var(--muted);font-size:14.5px;line-height:1.55;margin-top:3px}
.check.done .t{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.alerta .check input{display:none}.alerta .check{cursor:default}
.registro{background:var(--soft);border-radius:16px;padding:16px 18px;font-size:15px;line-height:1.6}
.registro + .ghost{margin-top:10px}
/* registro montado a partir do checklist */
.citem{border-bottom:1px solid var(--line)}
.etapa .citem:last-of-type{border-bottom:0}
.citem .check{border-bottom:0}
.rg{margin:-4px 4px 14px 40px;display:flex;flex-direction:column;gap:8px}
.rg[hidden]{display:none}
.rg .seg{margin:0;align-self:flex-start}
.rg .seg button{font-size:12.5px;padding:5px 12px}
.rg .seg button[data-m="a"][aria-pressed="true"]{color:var(--bad)}
.rg-opts{display:flex;flex-wrap:wrap;gap:6px}
.rg-opts button{font:500 12.5px var(--font);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 11px;cursor:pointer}
.rg-opts button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.rg textarea{font:15px/1.5 var(--font);color:var(--ink);background:var(--soft);border:1px solid transparent;border-radius:12px;padding:9px 12px;resize:none;overflow:hidden;width:100%;box-sizing:border-box}
.rg textarea:focus{outline:none;border-color:var(--accent);background:var(--card)}
.rg.alt textarea{background:var(--bad-soft)}
.rg .hint{font-size:12.5px;color:var(--muted)}
.reg-out{background:var(--soft);border-radius:16px;padding:18px 20px;font-size:15px;line-height:1.65;text-align:left}
.reg-out p{margin:0 0 8px}.reg-out p:last-child{margin:0}
.reg-out b{font-weight:650}
.reg-out .blank{background:rgba(255,184,0,.28);color:inherit;border-radius:4px;padding:0 3px}
.reg-out .alt{color:var(--bad)}
.reg-out .empty{color:var(--muted)}
.reg-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.reg-legend{font-size:12.5px;color:var(--muted);margin:10px 0 0}
.reg-legend .blank{background:rgba(255,184,0,.28);border-radius:4px;padding:0 3px}
.reg-ex{margin-top:14px}
.reg-pill{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:max(18px,env(safe-area-inset-bottom,0px));z-index:30;font:600 13.5px var(--font);color:#fff;background:var(--accent-solid,#0071e3);border:0;border-radius:999px;padding:11px 18px;box-shadow:0 6px 20px rgba(0,0,0,.18);cursor:pointer;transition:opacity .2s,transform .2s}
.reg-pill[hidden]{display:none}
.reg-pill.off{opacity:0;transform:translateY(10px);pointer-events:none}
@media (max-width:900px){.rg{margin-left:36px}}
.fontes{font-size:12.5px;color:var(--muted);margin-top:34px}
.reset-row{display:flex;gap:10px;align-items:center;margin-top:24px}
.doc .teoria h2{font-size:clamp(22px,2.6vw,26px)}
.doc .teoria h2[class*="_background"]{border-top:0;padding:8px 14px;border-radius:12px;margin-top:40px}

@media (max-width:900px){
  body{padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
  .reader{grid-template-columns:minmax(0,1fr);gap:14px;padding-top:14px}
  .toc{position:static;max-height:none;padding:0}
  .toc-btn{display:inline-block;margin-left:8px}
  .toc ol{display:none;margin-top:10px;background:var(--card);border-radius:18px;padding:8px;box-shadow:var(--shadow)}
  .toc.open ol{display:flex}
  .toc .back{margin-bottom:0}
  .doc{border-radius:22px;padding:32px 18px 40px}
  .doc.pages{padding:6px;border-radius:16px}
  .pg{margin-bottom:6px;border-radius:10px}
  .lib{padding-top:36px}
}

/* ---------- Como caiu na prova ---------- */
.caiu-box{margin:28px 0 34px;background:var(--soft);border-radius:20px;padding:22px clamp(16px,3vw,26px) 18px}
.caiu-box .ck{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.13em;font-weight:700;text-transform:uppercase;color:var(--accent)}
.caiu-box .ck::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
.caiu-box .src{font-size:13px;color:var(--muted);margin:4px 0 12px}
.doc .caiu-box p.st{font-size:16px;text-align:left;hyphens:manual;margin:0 0 14px}
.caiu-box ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.caiu-box li{margin:0}
.doc .caiu-box li,.caiu-box .op{text-align:left;hyphens:manual;-webkit-hyphens:manual}
@media (max-width:600px){.caiu-box{margin-left:-6px;margin-right:-6px;padding:18px 14px 14px}}
.caiu-box .op{width:100%;display:flex;gap:12px;align-items:flex-start;text-align:left;font:15.5px/1.5 var(--font);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 14px;cursor:pointer}
.caiu-box .op:hover{border-color:#86868b}
.caiu-box .op .lt{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid #c7c7cc;display:grid;place-items:center;font-weight:700;font-size:12.5px}
.caiu-box.done .op{cursor:default}.caiu-box.done .op:hover{border-color:var(--line)}
.caiu-box .op.ok{background:#e5f4ec;border-color:#1d7446}.caiu-box .op.ok .lt{background:#1d7446;border-color:#1d7446;color:#fff}
.caiu-box .op.bad{background:var(--bad-soft);border-color:var(--bad)}.caiu-box .op.bad .lt{background:var(--bad);border-color:var(--bad);color:#fff}
:root[data-theme="dark"] .caiu-box .op.ok{background:#173027;border-color:#5cc48d}:root[data-theme="dark"] .caiu-box .op.ok .lt{background:#5cc48d;border-color:#5cc48d;color:#111}
.caiu-box .vd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.caiu-box .vd b{font-size:13px;padding:3px 10px;border-radius:999px}
.caiu-box .vd b.ok{background:#e5f4ec;color:#1d7446}.caiu-box .vd b.bad{background:var(--bad-soft);color:var(--bad)}
:root[data-theme="dark"] .caiu-box .vd b.ok{background:#173027;color:#5cc48d}
.doc .caiu-box p.why{font-size:15px;text-align:left;hyphens:manual;margin:10px 0 0;padding:12px 14px;background:var(--card);border-radius:14px}

@media (max-width:900px){
  body{padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
  .reader{grid-template-columns:minmax(0,1fr);gap:14px;padding-top:14px}
  .toc{position:static;max-height:none;padding:0}
  .toc-btn{display:inline-block;margin-left:8px}
  .toc ol{display:none;margin-top:10px;background:var(--card);border-radius:18px;padding:8px;box-shadow:var(--shadow)}
  .toc.open ol{display:flex}

<script>
const TEMAS = [{"id": "puericultura", "nome": "Puericultura", "resumo": "Consulta da criança: frequência, anamnese, antropometria, exame físico, reflexos primitivos, triagem neonatal, icterícia e vacinas.", "teoria": "<h2 class=\"block-color-blue_background\" data-notion-highlight=\"blue_background\">PUERICULTURA<\/h2><p class=\"\">Puericultura é a consulta periódica de uma criança feita com o propósito de avaliar seu crescimento e desenvolvimento demaneira próxima. Dessa forma, durante essas consultas deve-se realizar orientações educativas, ações de promoção da saúde,ações relacionadas à prevenção de doenças e observação dos riscos e vulnerabilidades sob a qual está submetida a respectivacriança. Além disso, é papel da puericultura observar fatores de risco e vulnerabilidades que cercam as diferentes fases do processo de crescimento e desenvolvimento da criança.<\/p><h2 class=\"block-color-blue_background\" data-notion-highlight=\"blue_background\">QUAL DEVE SER A FREQUÊNCIA DO ACOMPANHAMENTO?<\/h2><p class=\"\"> Nos primeiros 2 anos de vida as consultas são mais frequentes devido ao processo de crescimento e desenvolvimento ser mais intenso, por isso, no 1° ano de vida é recomendado um mínimo de 7 consultas de rotina, na 1°/2°/4°/6°/9° e 12° mês. No 2° ano de vida, deve se ter um mínimo de 2 consultas de rotina: no 18°e 24° mês. A partir dos 2 anos de idade as consultas podem se tornar anuais. Assim, além da oportunidade de avaliar o desenvolvimento da criança, tal organização da frequência de consultas adotada pelo Ministério da Saúde toma como base o calendário de vacinação, permitindo a verificação do cartão vacinal em meses oportunos ao nascimento, com 1, 2, 3, 4, 5, 6, 12 e 15 meses.<\/p><h2 class=\"block-color-blue_background\" data-notion-highlight=\"blue_background\">ANAMNESE NA PUERICULTURA<\/h2><p class=\"\">A anamnese deve ser completa, com todos os itens de uma anamnese comum, mas devendo também abordar:<\/p><p class=\"\">1. Antecedentes pessoais da criança com informações desde a sua concepção, com ênfase nos antecedentes patológicos e alimentares, questionando acerca da gestação, nascimento, bem como o período neonatal.<\/p><p class=\"\">2. Desenvolvimento neuropsicomotor (DNPM) onde é preciso colher um relato da família sobre o aparecimento de habilidades motoras, aquisição de linguagem gestual e falada, controle esfincteriano bem como desenvolvimento socioafetivo da criança com membros da família e amigos.<\/p><p class=\"\">3. Antecedentes vacinais devendo além de registrar as vacinas tomadas e períodos em que foram realizadas, registrar eventos adversos (locais ou sistêmicos) caso tenham ocorrido.<\/p><p class=\"\">4. História de formação da família, relacionamento dos pais e aceitação da criança neste processo.<\/p><p class=\"\">5. Habitação é um ponto importante para a compreensão do profissional acerca das condições de vida e saúde da criança e sua família, de modo a conseguir, dessa forma, compreender se existem fatores de risco para doenças respiratórias, infecto-parasitárias e dermatológicas.<\/p><p class=\"\">6. Hábitos atuais da criança também devem ser questionados à família, abarcando seus respectivos hábitos: alimentares, intestinais, urinários, sono, higiene corporal bem como bucal, lazer e atividade física. Neste ponto, é relevante também questionar, quanto tempo a criança fica exposta a telas de telefone, tablets, televisão, etc.<\/p><h2 class=\"block-color-blue_background\" data-notion-highlight=\"blue_background\">EXAME FÍSICO DOS SISTEMAS<\/h2><p class=\"\">É preciso estabelecer uma relação de confiança com a criança para poder realizar o exame físico completo, uma vez que estar em contato com uma figura desconhecida como a do médico muitas vezes pode causar estresse para a mesma. Na Puericultura nem sempre será possível realizar o exame físico na sequência crânio-caudal com costuma-se realizar nas outras áreas da Medicina, assim, é possível iniciar parte do exame físico com a criança ainda no colo de um dos seus familiares. Dentre todos os sistemas que não devem ser esquecidos nesta consulta com o recém-nascido, conforme tabela do ministério da saúde:<\/p><div class=\"tbl\"><table class=\"simple-table\"><thead class=\"simple-table-header\"><tr><th class=\"simple-table-header-color simple-table-header\" style=\"width:264.5px\">Tópico do exame físico<\/th><th class=\"simple-table-header-color simple-table-header\" style=\"width:430.5px\">Ações específicas (resumo)<\/th><\/tr><\/thead><tbody><tr><td class=\"\" style=\"width:264.5px\">Peso, comprimento e perímetro cefálico<\/td><td class=\"\" style=\"width:430.5px\">Avaliar crescimento. Perda de peso até 10% ao nascer é normal. PC &lt; -2 ou &gt; +2 DP pode indicar alterações neurológicas.<\/td><\/tr><tr><td class=\"\" style=\"width:264.5px\">Desenvolvimento social e psicoafetivo<\/td><td class=\"\" style=\"width:430.5px\">Observar interação mãe/cuidador com o bebê e estímulos oferecidos.<\/td><\/tr><tr><td class=\"\" style=\"width:264.5px\">Estado geral<\/td><td class=\"\" style=\"width:430.5px\">Avaliar postura, padrão respiratório, estado de alerta/sono/choro, sinais de desidratação ou hipoglicemia e temperatura.<\/td><\/tr><tr><td class=\"\" style=\"width:264.5px\">Face<\/td><td class=\"\" style=\"width:430.5px\">Pesquisar assimetrias, deformidades ou características sindrômicas.<\/td><\/tr><tr><td class=\"\" style=\"width:264.5px\">Pele<\/td><td class=\"\" style=\"width:430.5px\">Observar edema, palidez, cianose e icterícia.<\/td><\/tr><tr><td class=\"\" style=\"width:264.5px\">Crânio<\/td><td class=\"\" style=\"width:430.5px\">Avaliar fontanelas (anterior e posterior), presença de bossa ou cefalohematoma.<\/td><\/tr><tr><td class=\"\" style=\"width:264.5px\">Olhos<\/td><td class=\"\" style=\"width:430.5px\">Testar reflexo fotomotor e reflexo vermelho (triagem para catarata, retinoblastoma e retinopatia da prematuridade).<\/td><\/tr><tr><td class=\"\" style=\"width:264.5px\">Orelhas e audição<\/td><td class=\"\" style=\"width:430.5px\">Orientar realização do teste da orelhinha (triagem auditiva neonatal).<\/td><\/tr><tr><td class=\"\" style=\"width:264.5px\">Nariz<\/td><td class=\"\" style=\"width:430.5px\">Avaliar forma e presença de secreção.<\/td><\/tr><tr><td class=\"\" style=\"width:264.5px\">Boca<\/td><td class=\"\" style=\"width:430.5px\">Observar língua, palato, úvula, freio lingual e coloração dos lábios.<\/td><\/tr><tr><td class=\"\" style=\"width:264.5px\">Pescoço<\/td><td class=\"\" style=\"width:430.5px\">Verificar assimetria facial ou torcicolo congênito.<\/td><\/tr><tr><td class=\"\" style=\"width:264.5px\">Tórax<\/td><td class=\"\" style=\"width:430.5px\">Avaliar simetria, fratura de clavícula, sinais respiratórios e auscultar coração (FC 120–160 bpm).<\/td><\/tr><tr><td class=\"\" style=\"width:264.5px\">Abdome<\/td><td class=\"\" style=\"width:430.5px\">Avaliar forma, respiração abdominal, presença de hérnias, visceromegalias ou sinais de onfalite.<\/td><\/tr><tr><td class=\"\" style=\"width:264.5px\">Genitália<\/td><td class=\"\" style=\"width:430.5px\">Verificar testículos na bolsa escrotal, hidrocele, fimose fisiológica ou alterações do meato urinário.<\/td><\/tr><tr><td class=\"\" style=\"width:264.5px\">Ânus e reto<\/td><td class=\"\" style=\"width:430.5px\">Avaliar permeabilidade e posição anal.<\/td><\/tr><tr><td class=\"\" style=\"width:264.5px\">Sistema osteoarticular<\/td><td class=\"\" style=\"width:430.5px\">Examinar membros, identificar pé torto e realizar testes de Ortolani e Barlow (displasia do quadril).<\/td><\/tr><tr><td class=\"\" style=\"width:264.5px\">Coluna vertebral<\/td><td class=\"\" style=\"width:430.5px\">Inspecionar especialmente a região lombo-sacra.<\/td><\/tr><tr><td class=\"\" style=\"width:264.5px\">Avaliação neurológica<\/td><td class=\"\" style=\"width:430.5px\">Observar reflexos primitivos (sucção, preensão, Moro), postura e tônus.<\/td><\/tr><\/tbody><\/table><\/div><p class=\"\">Segundo o Ministério da Saúde, as consultas seguintes à primeira não devem obrigatoriamente contar com todos os elementos de um exame físico completo, no entanto, até os 10 anos de idade recomenda que procedimentos específicos não deixem de ser realizados, como:<br/><strong>DADOS ANTROPOMÉTRICOS:<\/strong> Nesta etapa do exame físico deve-se realizar as medidas de: Peso; Comprimento/altura; Índice de massa corpórea (IMC); Perímetro cefálico; Perímetro torácico (até os 3 anos de idade); Circunferência abdominal. Assim, as informações do peso, altura, IMC e perímetro cefálico devem ser transpostas para as curvas disponíveis na Caderneta de Saúde da Criança e as informações devem ser compartilhadas com os pais.<br/><strong>RASTREAMENTO PARA DISPLASIA EVOLUTIVA DO QUADRIL (BARLOW E ORTOLANI): <\/strong>Duas manobras devem ser realizadas logo nas primeiras consultas até os 2 meses, testando um membro de cada vez a partir das manobras de Barlow (provocativa do deslocamento) e Ortolani (sua redução).<\/p><p class=\"\">Manobra de Barlow é um teste provocativo realizado com quadris e joelhos do recém-nascido fletidos. Seguram-se as pernas gentilmente, com a coxa em adução (A), e o examinador aplica uma força no sentido posterior. A manobra é positiva (B) se o quadril é deslocável (luxável). Já a manobra de Ortolani é o reverso de Barlow. O examinador segura as coxas do recém-nascido e gentilmente realiza a abdução do quadril enquanto move anteriormente o trocanter com os dois dedos (A). A manobra é positiva (B) quando a cabeça do fêmur luxada retorna ao acetábulo com um “clunk” palpável quando o quadril é abduzido.<\/p><p class=\"\"><strong>AUSCULTA CARDÍACA<\/strong>: Assim como em todo atendimento médico, a ausculta da frequência cardíaca (FC) deve ser realizada na Puericultura. Logo, é importante saber as faixas de FC, bem como a FC média em cada etapa da infância, podendo em caso de discrepâncias pensar em possibilidades diagnósticas.<br/><strong>AFERIÇÃO DA PRESSÃO ARTERIAL:<\/strong> Segundo o Ministério da Saúde, recomenda-se que a pressão arterial (PA) seja aferida em crianças uma primeira medida aos 3 anos de idade e segunda medida aos 6 anos, no entanto, outras referências não fazem menção a idades específicas para a medida.<\/p><p class=\"\"><mark class=\"highlight-blue_background\" data-notion-highlight=\"blue_background\"><strong>REFLEXOS PRIMITIVOS:<\/strong><\/mark><br/>Para avaliar o desenvolvimento cognitivo e motor, observa-se, através do exame físico, a presença dos reflexos primitivos, dando atenção às idades em que eles estão presentes e quando desaparecem, sendo um bom avaliador da integridade do sistema<br/>nervoso central. Os reflexos primitivos surgem em idades previsíveis e, após um determinado período, são suprimidos pela maturação da função dos níveis cerebrais superiores. Os reflexos são:<\/p><p class=\"\"><mark class=\"highlight-blue_background\" data-notion-highlight=\"blue_background\"><strong>Reflexo de sucção:<\/strong><\/mark> está estabelecido com 34 semanas de idade gestacional. Para avaliá-lo, deve-se colocar um dedo limpo na boca do recém-nascido.<\/p><p class=\"\"><mark class=\"highlight-blue_background\" data-notion-highlight=\"blue_background\"><strong>Reflexo de Moro<\/strong><\/mark>: é avaliado pelo ato de segurar a criança pelas mãos e liberar subitamente seus braços. Após isso o bebê faz um movimento de abdução dos membros superiores, seguido por adução e flexão dos membros superiores.<br/>Esse reflexo \"simula\" uma queda. A idade limite para o desaparecimento desse reflexo é 5 meses.<\/p><p class=\"\"><mark class=\"highlight-blue_background\" data-notion-highlight=\"blue_background\"><strong>Reflexo tônico-cervical: <\/strong><\/mark>o examinador deve colocar a criança em posição supina e rotacionar sua cabeça em um ângulo de 90º (para um dos lados do corpo), devendo, a criança, em condições normais, permanecer assim por 15 segundos. O reflexo exagerado e/ou persistente (além do terceiro mês de vida) representa comprometimento cerebral.<\/p><p class=\"\"><mark class=\"highlight-blue_background\" data-notion-highlight=\"blue_background\"><strong>Reflexo de preensão palmar:<\/strong><\/mark> o examinador coloca o dedo indicador na palma da mão da criança, gerando a flexão dos dedos. Deve desaparecer entre 4 e 6 meses, quando se torna um movimento voluntário de preensão.<\/p><p class=\"\"><mark class=\"highlight-blue_background\" data-notion-highlight=\"blue_background\"><strong>Reflexo de preensão plantar:<\/strong><\/mark> com o indicador, pressiona-se a planta dos pés, desencadeando o fechamento dos dedos em resposta ao estímulo. Desaparece por volta dos 9-12 meses.<\/p><p class=\"\"><mark class=\"highlight-blue_background\" data-notion-highlight=\"blue_background\"><strong>Reflexo cutâneo-plantar (sinal de Babinski):<\/strong><\/mark><strong> <\/strong>utiliza-se um objeto levemente pontiagudo (por exemplo: caneta) e direciona-o no sentido latero-medial (em direção ao dedão do pé). Em condições normais, ocorre flexão plantar, ou seja,  o hálux (dedão do pé) é “fletido para frente”, enquanto em indivíduos com lesão do trato corticoespinhal, ocorre a flexão dorsal – extensão do hálux. Pode estar presentes em crianças de até dois anos.<\/p><p class=\"\"><mark class=\"highlight-blue_background\" data-notion-highlight=\"blue_background\"><strong>Reflexo de Galant:<\/strong><\/mark> é desencadeado por estímulo tátil na região dorso lateral, tendo como resposta um encurvamento do tronco ipsilateral. Dura até cerca de 2-3 meses.<\/p><p class=\"\"><mark class=\"highlight-blue_background\" data-notion-highlight=\"blue_background\"><strong>Reflexo de busca:<\/strong><\/mark> é desencadeado por estímulo da face ao redor da boca. Observa-se, nesse caso, a rotação da cabeça na tentativa de “buscar” o objeto, seguido de sucção reflexa do mesmo.<\/p><p class=\"\">TESTE DE TRIAGEM NEONATAL:<br/>A Triagem Neonatal Biológica é realizada através de exames no sangue colhido no papel-filtro (sangue seco), obtido por punção no calcanhar do recém-nascido. Essa triagem tem a função de prevenir alterações no desenvolvimento físico e mental de crianças que possam ter alguma das doenças triadas. É capaz de suspeitar precocemente quais recém-nascidos podem apresentar essas doenças e iniciar o tratamento o mais rápido possível. Todo recém-nascido deve ter acesso ao Teste do Pezinho e às etapas da Triagem Neonatal. O objetivo é realizar a coleta de sangue em 100% dos recém-nascidos no Brasil, seguida da análise desse sangue nos laboratórios especializados dos Serviços de Referência em Triagem Neonatal (SRTN), estabelecidos em todo o País. Os testes objetivam identificar casos positivos, que serão buscados pelos SRTN em conjunto com a Atenção Primária. As doenças incluídas no Teste do Pezinho do Sistema Único de Saúde (SUS) regulamentado pelo Ministério da Saúde, são:<\/p><p class=\"\"><strong>Deficiência de Biotinidase<\/strong>: Um erro inato do metabolismo tratável, de origem genética e herança autossômica recessiva, que afeta a reciclagem da biotina.<\/p><p class=\"\"><strong>Fenilcetonúria:<\/strong> Doença genética com padrão de herança autossômica recessiva. Na maioria dos casos, é resultante da deficiência de uma enzima hepática, a fenilalanina hidroxilase.<br/><strong>Hiperplasia adrenal congênita:<\/strong> Conjunto de doenças genéticas de herança autossômica recessiva, em que há deficiência na biossíntese do hormônio cortisol.<\/p><p class=\"\"><strong>Hipotireoidismo congênito primário:<\/strong> Refere-se à diminuição ou ausência de hormônios tireoidianos e se caracteriza por diminuição dos níveis séricos de T4 (tiroxina, também chamada tetraiodotironina) e T3 (triiodotironina).<br/><strong>Doenças falciformes:<\/strong> Doença genética e hereditária caracterizada por uma mutação na molécula da Hb A, chamada então de HbS. As hemoglobinopatias são doenças hereditárias amplamente distribuídas por todo o mundo.<br/><strong>Toxoplasmose: <\/strong>Uma das zoonoses (doenças transmitidas por animais) mais comuns do mundo. É uma doença infecciosa causada pelo protozoário chamado Toxoplasma gondii, cujos hospedeiros definitivos são gatos e outros felinos.<\/p><p class=\"\"><mark class=\"highlight-blue_background\" data-notion-highlight=\"blue_background\"><strong>ICTERÍCIA NEONATAL:<\/strong><\/mark><br/>A icterícia neonatal é uma manifestação clínica da elevação da bilirrubina sérica total, denominada hiperbilirrubinemia neonatal, resultante da deposição de bilirrubina na pele do recém-nascido. As características da icterícia neonatal incluem pele, esclera e<br/>mucosas amareladas. Geralmente, a icterícia neonatal é uma condição leve, transitória e autolimitada, conhecida como icterícia fisiológica. No entanto, é importante diferenciá-la da icterícia patológica, que é mais grave. Existem dois tipos de hiperbilirrubinemia neonatal: a hiperbilirrubinemia não conjugada e a hiperbilirrubinemia conjugada. Na maioria dos recém-nascidos, a hiperbilirrubinemia não conjugada é a causa da icterícia clínica. Contudo, alguns bebês apresentam<br/>hiperbilirrubinemia conjugada, que é sempre patológica e indica uma etiologia médica ou cirúrgica subjacente. A falha na identificação e no tratamento da icterícia patológica pode resultar em encefalopatia bilirrubínica e sequelas neurológicas<br/>associadas.<br/><strong>FISIOPATOLOGIA:<\/strong> A icterícia fisiológica decorre de três fatores principais: maior produção de bilirrubina, menor capacidade<br/>hepática de conjugação e excreção, e aumento da circulação êntero-hepática. Em recém-nascidos, há maior destruição de<br/>hemácias (com meia-vida reduzida), além de uma flora intestinal imatura, o que favorece a reabsorção da bilirrubina. Por outro<br/>lado, a icterícia patológica pode ser classificada em três mecanismos distintos:<\/p><ol class=\"numbered-list\" start=\"1\" type=\"1\"><li>Aumento da produção de bilirrubina: comum em doenças hemolíticas (como incompatibilidade ABO ou Rh) e em casos de policitemia.<\/li><\/ol><ol class=\"numbered-list\" start=\"2\" type=\"1\"><li>Redução do clearence hepático: observada em condições como as síndromes de Crigler-Najjar tipo I e II, síndrome de Gilbert, diabetes materna, hipotiroidismo congênito e galactosemia.<\/li><\/ol><ol class=\"numbered-list\" start=\"3\" type=\"1\"><li>Aumento da circulação êntero-hepática: geralmente associado a alterações da motilidade intestinal causadas por obstruções funcionais ou anatômicas.<br/>TRATAMENTO: O tratamento da icterícia neonatal varia conforme o tipo de bilirrubina predominante.<\/li><\/ol><h2 class=\"\">VACINAÇÃO<\/h2><p class=\"\">Vacinar é a melhor forma de proteger a criança contra doenças graves. Ao nascer, a criança recebe da equipe de saúde o seu Cartão de Vacinas e começa sua própria vacinação, adquirindo uma proteção mais duradoura. Vacinas em dia são a principal<br/>proteção contra doenças graves e, nos primeiros 1000 dias de vida, desde ainda no útero materno, são essenciais para toda a vida. Este Calendário indica as vacinas de cada fase.<\/p><div class=\"tbl\"><table class=\"simple-table\"><thead class=\"simple-table-header\"><tr><th class=\"block-color-teal_background simple-table-header\">Vacina<\/th><th class=\"block-color-teal_background simple-table-header\" style=\"width:128.9499969482422px\">Idade<\/th><th class=\"block-color-teal_background simple-table-header\" style=\"width:75px\">Dose<\/th><th class=\"block-color-teal_background simple-table-header\">Doenças evitadas<\/th><\/tr><\/thead><tbody><tr><td class=\"\">BCG<\/td><td class=\"\" style=\"width:128.9499969482422px\">Ao nascer<\/td><td class=\"\" style=\"width:75px\">1 dose<\/td><td class=\"\">Formas graves e disseminadas da tuberculose e efeito protetor contra hanseníase<\/td><\/tr><tr><td class=\"\">Hepatite B<\/td><td class=\"\" style=\"width:128.9499969482422px\">Ao nascer<\/td><td class=\"\" style=\"width:75px\">1 dose<\/td><td class=\"\">Hepatite B e D<\/td><\/tr><tr><td class=\"\">Penta (DTP + Hib + HB)<\/td><td class=\"\" style=\"width:128.9499969482422px\">2, 4 e 6 meses<\/td><td class=\"\" style=\"width:75px\">3 doses<\/td><td class=\"\">Difteria, tétano, coqueluche, infecções por <em>Haemophilus influenzae<\/em> tipo b e hepatite B<\/td><\/tr><tr><td class=\"\">Poliomielite inativada (VIP)<\/td><td class=\"\" style=\"width:128.9499969482422px\">2, 4, 6 meses e 15 meses<\/td><td class=\"\" style=\"width:75px\">4 doses<\/td><td class=\"\">Poliomielite (paralisia infantil)<\/td><\/tr><tr><td class=\"\">Pneumocócica 10-valente<\/td><td class=\"\" style=\"width:128.9499969482422px\">2, 4 e 12 meses<\/td><td class=\"\" style=\"width:75px\">3 doses<\/td><td class=\"\">Doenças pneumocócicas invasivas pelos sorogrupos contidos na vacina<\/td><\/tr><tr><td class=\"\">Rotavírus humano<\/td><td class=\"\" style=\"width:128.9499969482422px\">2 e 4 meses<\/td><td class=\"\" style=\"width:75px\">2 doses<\/td><td class=\"\">Gastroenterite viral (diarreia e vômito)<\/td><\/tr><tr><td class=\"\">Meningocócica C<\/td><td class=\"\" style=\"width:128.9499969482422px\">3 e 5 meses<\/td><td class=\"\" style=\"width:75px\">2 doses<\/td><td class=\"\">Doenças meningocócicas (meningite, encefalite, meningoencefalite) pelo meningococo C<\/td><\/tr><tr><td class=\"\">Influenza trivalente<\/td><td class=\"\" style=\"width:128.9499969482422px\">A partir de 6 meses<\/td><td class=\"\" style=\"width:75px\">1 dose anual<\/td><td class=\"\">Influenza (gripe)<\/td><\/tr><tr><td class=\"\">Covid-19<\/td><td class=\"\" style=\"width:128.9499969482422px\">6 e 7 meses<\/td><td class=\"\" style=\"width:75px\">2 doses<\/td><td class=\"\">Formas graves da COVID-19 e óbitos pelo vírus SARS-CoV-2<\/td><\/tr><tr><td class=\"\">Febre amarela<\/td><td class=\"\" style=\"width:128.9499969482422px\">6–8 meses, 9 meses e 4 anos<\/td><td class=\"\" style=\"width:75px\">3 doses<\/td><td class=\"\">Febre amarela<\/td><\/tr><tr><td class=\"\">Meningocócica ACWY<\/td><td class=\"\" style=\"width:128.9499969482422px\">12 meses<\/td><td class=\"\" style=\"width:75px\">1 dose<\/td><td class=\"\">Doenças meningocócicas pelos sorogrupos A, C, W e Y<\/td><\/tr><tr><td class=\"\">Tríplice viral (SCR)<\/td><td class=\"\" style=\"width:128.9499969482422px\">12 e 15 meses<\/td><td class=\"\" style=\"width:75px\">2 doses<\/td><td class=\"\">Sarampo, caxumba, rubéola e síndrome da rubéola congênita<\/td><\/tr><tr><td class=\"\">DTP<\/td><td class=\"\" style=\"width:128.9499969482422px\">15 meses e 4 anos<\/td><td class=\"\" style=\"width:75px\">2 doses<\/td><td class=\"\">Difteria, tétano e coqueluche<\/td><\/tr><tr><td class=\"\">Varicela<\/td><td class=\"\" style=\"width:128.9499969482422px\">15 meses e 4 anos<\/td><td class=\"\" style=\"width:75px\">2 doses<\/td><td class=\"\">Varicela<\/td><\/tr><tr><td class=\"\">Hepatite A<\/td><td class=\"\" style=\"width:128.9499969482422px\">15 meses<\/td><td class=\"\" style=\"width:75px\">1 dose<\/td><td class=\"\">Hepatite A<\/td><\/tr><tr><td class=\"\">dT<\/td><td class=\"\" style=\"width:128.9499969482422px\">7 anos<\/td><td class=\"\" style=\"width:75px\">1 dose<\/td><td class=\"\">Difteria e tétano<\/td><\/tr><tr><td class=\"\">HPV (quadrivalente)<\/td><td class=\"\" style=\"width:128.9499969482422px\">9 a 14 anos<\/td><td class=\"\" style=\"width:75px\">1 dose<\/td><td class=\"\">Infecções causadas pelo papilomavírus humano<\/td><\/tr><\/tbody><\/table><\/div><h3 class=\"\">Outra forma de visualização em tabela <\/h3><div class=\"tbl\"><table class=\"simple-table\"><thead class=\"simple-table-header\"><tr><th class=\"block-color-blue_background simple-table-header\">Idade<\/th><th class=\"block-color-blue_background simple-table-header\" style=\"width:460px\">Vacinas<\/th><\/tr><\/thead><tbody><tr><td class=\"\">Ao nascer<\/td><td class=\"\" style=\"width:460px\">BCG; Hepatite B<\/td><\/tr><tr><td class=\"\">2 meses<\/td><td class=\"\" style=\"width:460px\">Penta (DTP + Hib + HB); Poliomielite inativada (VIP); Pneumocócica 10-valente; Rotavírus humano<\/td><\/tr><tr><td class=\"\">3 meses<\/td><td class=\"\" style=\"width:460px\">Meningocócica C<\/td><\/tr><tr><td class=\"\">4 meses<\/td><td class=\"\" style=\"width:460px\">Penta (DTP + Hib + HB); Poliomielite inativada (VIP); Pneumocócica 10-valente; Rotavírus humano<\/td><\/tr><tr><td class=\"\">5 meses<\/td><td class=\"\" style=\"width:460px\">Meningocócica C<\/td><\/tr><tr><td class=\"\">6 meses<\/td><td class=\"\" style=\"width:460px\">Penta (DTP + Hib + HB); Poliomielite inativada (VIP); Influenza; Covid-19; Febre amarela<\/td><\/tr><tr><td class=\"\">7 meses<\/td><td class=\"\" style=\"width:460px\">Covid-19<\/td><\/tr><tr><td class=\"\">9 meses<\/td><td class=\"\" style=\"width:460px\">Febre amarela<\/td><\/tr><tr><td class=\"\">12 meses<\/td><td class=\"\" style=\"width:460px\">Pneumocócica 10-valente; Meningocócica ACWY; Tríplice viral (SCR)<\/td><\/tr><tr><td class=\"\">15 meses<\/td><td class=\"\" style=\"width:460px\">Poliomielite inativada (VIP); Tríplice viral (SCR); DTP; Varicela; Hepatite A<\/td><\/tr><tr><td class=\"\">4 anos<\/td><td class=\"\" style=\"width:460px\">DTP; Varicela; Febre amarela<\/td><\/tr><tr><td class=\"\">7 anos<\/td><td class=\"\" style=\"width:460px\">dT<\/td><\/tr><tr><td class=\"\">9–14 anos<\/td><td class=\"\" style=\"width:460px\">HPV<\/td><\/tr><\/tbody><\/table><\/div><p class=\"\">\n<\/p>", "guia": {"intro": "Roteiro para uma consulta de puericultura. O que muda de uma consulta para outra é a idade: a anamnese e o exame acompanham o momento do crescimento e do desenvolvimento da criança.", "etapas": [{"titulo": "Antes de começar", "itens": [["Conferir a idade e o calendário de consultas", "Mínimo de 7 consultas no 1º ano (1ª semana, 1, 2, 4, 6, 9 e 12 meses), 2 no 2º ano (18 e 24 meses) e depois anuais.", {"s": "Consulta", "n": "Consulta de puericultura. Criança de ___, acompanhada por ___."}], ["Pedir a Caderneta da Saúde da Criança", "Curvas de crescimento, marcos do desenvolvimento e cartão de vacinas.", {"s": "Consulta", "n": "Caderneta da Criança apresentada.", "a": ["Caderneta da Criança não apresentada."]}], ["Preparar o ambiente", "Sala aquecida, balança, antropômetro, fita métrica, estetoscópio e oftalmoscópio para o reflexo vermelho.", null], ["Criar vínculo com a criança e o cuidador", "Começar com a criança no colo; nem sempre dá para seguir a ordem crânio-caudal. Deixar o que incomoda (orofaringe, otoscopia) para o fim.", null]]}, {"titulo": "Anamnese direcionada", "itens": [["Motivo da consulta e queixas", "Ouvir as dúvidas e preocupações da família.", {"s": "Queixas", "n": "Consulta de rotina. Sem queixas.", "a": ["Responsável refere ___ há ___."]}], ["Gestação, nascimento e período neonatal", "Pré-natal e intercorrências, tipo de parto, idade gestacional, peso, comprimento e perímetro cefálico ao nascer, Apgar, internação, icterícia e resultado das triagens neonatais (teste do pezinho, da orelhinha, reflexo vermelho).", {"s": "Antecedentes", "n": "Pré-natal com ___ consultas, sem intercorrências. Parto ___ (vaginal / cesárea), IG ___ semanas, PN ___ g, comprimento ___ cm, PC ___ cm, Apgar ___/___. Sem internação neonatal. Triagens neonatais normais.", "a": ["Pré-natal com ___ consultas. Parto ___, IG ___ semanas, PN ___ g, Apgar ___/___. Intercorrências: ___."]}], ["Antecedentes patológicos e alimentares", "Doenças, internações, alergias. Aleitamento materno (exclusivo até 6 meses, livre demanda, pega), introdução alimentar a partir dos 6 meses.", {"s": "Alimentação", "n": "Sem doenças, internações ou alergias prévias. Em aleitamento materno exclusivo, em livre demanda, com boa pega.", "a": [["Aleitamento misto ou fórmula", "Aleitamento ___ (misto / fórmula infantil): ___."], ["Introdução alimentar", "Aleitamento materno complementado; introdução alimentar iniciada aos ___ meses: ___."], ["Antecedentes", "Antecedentes: ___ (doenças / internações / alergias)."]]}], ["Desenvolvimento neuropsicomotor", "Relato da família sobre habilidades motoras, linguagem gestual e falada, controle esfincteriano e relação com familiares e amigos. Comparar com os marcos da Caderneta.", {"s": "Desenvolvimento", "n": "Desenvolvimento neuropsicomotor adequado para a idade, segundo os marcos da Caderneta.", "a": ["Marcos não alcançados para a idade: ___."]}], ["Vacinação", "Registrar as vacinas e as datas e perguntar sobre eventos adversos locais ou sistêmicos.", {"s": "Vacinação", "n": "Vacinas em dia, sem eventos adversos.", "a": ["Vacinas em atraso: ___.", "Evento adverso após ___: ___."]}], ["Família e habitação", "Formação da família, relacionamento dos pais e aceitação da criança. Condições de moradia: riscos para doenças respiratórias, infecto-parasitárias e dermatológicas.", {"s": "Família e hábitos", "n": "Mora com ___, em casa de alvenaria com saneamento básico. Boa aceitação da criança pela família.", "a": ["Mora com ___. Condições de moradia: ___ (risco para ___)."]}], ["Hábitos atuais", "Alimentação, hábito intestinal e urinário, sono, higiene corporal e bucal, lazer, atividade física e tempo de tela.", {"s": "Família e hábitos", "n": "Sono, eliminações e higiene sem alterações. Sem exposição a telas.", "a": ["Hábitos: ___ (sono / hábito intestinal / urinário / higiene / tempo de tela)."]}]]}, {"titulo": "Antropometria", "itens": [["Pesar a criança", "Sem roupa até os 2 anos. No recém-nascido, perda de até 10% do peso de nascimento é esperada.", {"s": "Antropometria", "n": "Peso ___ g (escore-z ___).", "a": ["Peso ___ g, perda de ___% em relação ao peso de nascimento."]}], ["Medir comprimento ou altura", "Deitado (comprimento) nos menores de 2 anos; em pé (altura) depois.", {"s": "Antropometria", "n": "Comprimento ___ cm (escore-z ___)."}], ["Perímetro cefálico", "PC abaixo de −2 ou acima de +2 desvios-padrão pode indicar alteração neurológica.", {"s": "Antropometria", "n": "PC ___ cm, entre −2 e +2 DP.", "a": ["PC ___ cm, abaixo de −2 DP.", "PC ___ cm, acima de +2 DP."]}], ["Perímetro torácico e circunferência abdominal", "Perímetro torácico até os 3 anos.", {"s": "Antropometria", "n": "Perímetro torácico ___ cm."}], ["Calcular o IMC e plotar tudo nas curvas da Caderneta", "Compartilhar com os pais como a criança está crescendo.", {"s": "Antropometria", "n": "IMC ___ kg/m². Crescimento adequado nas curvas da Caderneta.", "a": ["IMC ___ kg/m². ___ (queda / ascensão) de canal na curva de ___."]}]]}, {"titulo": "Sinais vitais", "itens": [["Frequência cardíaca", "Recém-nascido: 120–160 bpm. Conhecer as faixas de cada idade para perceber discrepâncias.", {"s": "Sinais vitais", "n": "FC ___ bpm."}], ["Frequência respiratória e temperatura", "Observar o padrão respiratório e sinais de esforço.", {"s": "Sinais vitais", "n": "FR ___ irpm, Tax ___ °C, sem sinais de esforço respiratório.", "a": ["FR ___ irpm, Tax ___ °C. Sinais de esforço respiratório: ___."]}], ["Pressão arterial", "Segundo o Ministério da Saúde, primeira medida aos 3 anos e segunda aos 6 anos.", {"s": "Sinais vitais", "n": "PA ___ mmHg."}]]}, {"titulo": "Exame físico por sistemas", "itens": [["Estado geral e interação", "Postura, padrão respiratório, estado de alerta, sono e choro; sinais de desidratação, hipoglicemia, febre. Observar a interação do cuidador com o bebê.", {"s": "Exame físico", "n": "Bom estado geral, ativa e reativa, boa interação com o cuidador.", "a": ["___ estado geral, ___ (hipoativa / irritada / sonolenta)."]}], ["Pele", "Edema, palidez, cianose e icterícia.", {"s": "Exame físico", "n": "Corada, hidratada, anictérica, acianótica, sem edema.", "a": [["Icterícia", "Ictérica até a zona ___ de Kramer."], ["Palidez", "Descorada ___/4+."], ["Cianose", "Cianose ___ (central / periférica)."]]}], ["Crânio e face", "Fontanelas anterior e posterior, bossa ou cefalo-hematoma; assimetrias, deformidades ou traços sindrômicos.", {"s": "Exame físico", "n": "Fontanela anterior normotensa, medindo ___ × ___ cm. Sem bossa, cefalo-hematoma ou dismorfias.", "a": ["Fontanela anterior ___ (abaulada / deprimida).", "Cefalo-hematoma em ___.", "Dismorfias: ___."]}], ["Olhos", "Reflexo fotomotor e reflexo vermelho (triagem de catarata, retinoblastoma e retinopatia da prematuridade).", {"s": "Exame físico", "n": "Reflexo fotomotor presente. Reflexo vermelho presente e simétrico bilateralmente.", "a": ["Reflexo vermelho ___ (ausente / assimétrico / leucocoria) em ___. Encaminhada à oftalmologia."]}], ["Orelhas e audição", "Confirmar a triagem auditiva neonatal (teste da orelhinha).", {"s": "Exame físico", "n": "Orelhas sem alterações. Triagem auditiva neonatal normal.", "a": ["Triagem auditiva neonatal ___ (com falha / não realizada)."]}], ["Nariz e boca", "Forma e secreção nasal; língua, palato, úvula, freio lingual e cor dos lábios.", {"s": "Exame físico", "n": "Nariz sem secreção. Palato íntegro, freio lingual sem alterações, lábios corados.", "a": ["Freio lingual curto (anquiloglossia).", "___."]}], ["Pescoço", "Assimetria ou torcicolo congênito.", {"s": "Exame físico", "n": "Pescoço simétrico, sem torcicolo.", "a": ["Torcicolo à ___."]}], ["Tórax", "Simetria, fratura de clavícula, sinais de desconforto respiratório; ausculta cardíaca e pulmonar.", {"s": "Exame físico", "n": "Tórax simétrico, clavículas íntegras, sem desconforto respiratório. Bulhas rítmicas e normofonéticas, em 2 tempos, sem sopros. Murmúrio vesicular presente bilateralmente, sem ruídos adventícios.", "a": [["Sopro", "Sopro ___ em ___."], ["Ruídos adventícios", "Ruídos adventícios: ___."], ["Clavícula", "Crepitação em clavícula ___ (suspeita de fratura)."]]}], ["Abdome", "Forma, respiração abdominal, hérnias, visceromegalias, sinais de onfalite no coto umbilical.", {"s": "Exame físico", "n": "Abdome flácido, sem visceromegalias ou hérnias. Coto umbilical sem sinais de onfalite.", "a": ["Hérnia umbilical ___.", "Coto umbilical com ___ (hiperemia / secreção / odor fétido): onfalite."]}], ["Genitália e ânus", "Testículos na bolsa escrotal, hidrocele, fimose fisiológica, meato urinário; permeabilidade e posição do ânus.", {"s": "Exame físico", "n": "Genitália típica, sem alterações. Ânus pérvio e tópico.", "a": ["Testículo ___ não palpável na bolsa escrotal.", "Hidrocele ___.", "___."]}], ["Quadril: manobras de Barlow e Ortolani", "Até os 2 meses, um membro de cada vez. Barlow (provocativa): quadril e joelho fletidos, coxa em adução, força posterior; positiva se o quadril luxa. Ortolani (redução): abdução da coxa empurrando o trocanter para frente; positiva com o “clunk” da cabeça do fêmur voltando ao acetábulo.", {"s": "Exame físico", "n": "Manobras de Barlow e Ortolani negativas.", "a": ["Manobra de ___ (Ortolani / Barlow) positiva à ___. Encaminhada à ortopedia."]}], ["Membros e coluna", "Pé torto; inspeção da coluna, sobretudo a região lombossacra.", {"s": "Exame físico", "n": "Membros sem deformidades, pés sem alterações. Coluna e região lombossacra sem alterações.", "a": ["Pé torto ___.", "Região lombossacra com ___ (fosseta / tufo de pelos / mancha)."]}]]}, {"titulo": "Avaliação neurológica e reflexos primitivos", "itens": [["Postura e tônus", "Observar a postura em repouso e o tônus.", {"s": "Exame neurológico", "n": "Postura e tônus adequados para a idade.", "a": ["Hipotonia ___.", "Hipertonia ___."]}], ["Sucção e busca", "Sucção: dedo limpo na boca (presente desde 34 semanas de IG). Busca: estímulo ao redor da boca, a criança gira a cabeça e suga.", {"s": "Exame neurológico", "g": ["ref", "sucção, busca"], "n": "Reflexos de sucção e busca adequados para a idade.", "a": ["Sucção débil."]}], ["Moro", "Segurar a criança pelas mãos e soltar os braços: abdução seguida de adução e flexão dos membros superiores. Desaparece até os 5 meses.", {"s": "Exame neurológico", "g": ["ref", "Moro"], "n": "Reflexo de Moro adequado para a idade.", "a": ["Reflexo de Moro ___ (assimétrico / ausente / persistente após os 5 meses)."]}], ["Tônico-cervical", "Em supino, girar a cabeça 90°. Persistente ou exagerado após o 3º mês indica comprometimento cerebral.", {"s": "Exame neurológico", "g": ["ref", "tônico-cervical"], "n": "Reflexo tônico-cervical adequado para a idade.", "a": ["Reflexo tônico-cervical persistente após o 3º mês."]}], ["Preensão palmar e plantar", "Palmar desaparece entre 4 e 6 meses; plantar por volta de 9–12 meses.", {"s": "Exame neurológico", "g": ["ref", "preensão palmar e plantar"], "n": "Reflexos de preensão palmar e plantar adequados para a idade.", "a": ["Preensão ___ (palmar / plantar) ___."]}], ["Cutâneo-plantar e Galant", "Babinski pode estar presente até os 2 anos. Galant (estímulo dorso-lateral → encurvamento do tronco) dura até cerca de 2–3 meses.", {"s": "Exame neurológico", "g": ["ref", "cutâneo-plantar, Galant"], "n": "Reflexos cutâneo-plantar e de Galant adequados para a idade.", "a": ["___."]}]]}, {"titulo": "Triagens, vacinas e orientações", "itens": [["Conferir as triagens neonatais", "Teste do pezinho (fenilcetonúria, hipotireoidismo congênito, doença falciforme, hiperplasia adrenal congênita, deficiência de biotinidase, toxoplasmose), teste da orelhinha e reflexo vermelho.", {"s": "Triagens", "n": "Testes do pezinho, da orelhinha e do olhinho realizados, com resultados normais.", "a": ["Triagem ___ ___ (alterada / pendente): ___."]}], ["Atualizar a caderneta de vacinas", "Conferir as doses previstas para a idade no calendário vigente do PNI.", {"s": "Conduta", "n": "Vacinas atualizadas conforme o calendário do PNI. Aplicadas hoje: ___."}], ["Orientar a família", "Alimentação, sono, higiene, prevenção de acidentes e tempo de tela. Explicar as curvas e os marcos e combinar o próximo retorno.", {"s": "Conduta", "n": "Orientações sobre alimentação, sono, higiene, prevenção de acidentes e tempo de tela. Retorno em ___."}]]}, {"titulo": "Sinais de alerta", "alerta": true, "itens": [["Crescimento fora do esperado", "Perda de peso maior que 10% no recém-nascido; PC abaixo de −2 ou acima de +2 DP; queda nas curvas."], ["Icterícia que preocupa", "Icterícia nas primeiras 24 horas, intensa ou prolongada: diferenciar a fisiológica da patológica."], ["Reflexo vermelho alterado", "Encaminhar para avaliação oftalmológica."], ["Barlow ou Ortolani positivos", "Suspeita de displasia do quadril: encaminhar."], ["Reflexos primitivos persistentes ou atraso de marcos", "Investigar o desenvolvimento neuropsicomotor."]]}, {"titulo": "Registro (exemplo)", "registro": "Criança em bom estado geral, ativa, corada, hidratada, anictérica. Peso, comprimento e PC adequados para a idade nas curvas da Caderneta. Fontanela anterior normotensa. Reflexo vermelho presente bilateralmente. Ausculta cardíaca e pulmonar sem alterações. Abdome flácido, sem visceromegalias, coto umbilical sem sinais de onfalite. Testículos tópicos. Manobras de Barlow e Ortolani negativas. Reflexos primitivos presentes e adequados para a idade. Vacinas em dia.", "itens": []}], "fontes": "Elaborado a partir do seu material de estudo e do Ministério da Saúde (Caderneta da Criança; Cadernos de Atenção Básica n. 33 – Saúde da Criança).", "secoes": ["Consulta", "Queixas", "Antecedentes", "Alimentação", "Desenvolvimento", "Vacinação", "Família e hábitos", "Antropometria", "Sinais vitais", "Exame físico", "Exame neurológico", "Triagens", "Conduta"]}, "videos": []}, {"id": "parto-e-partograma", "nome": "Parto e partograma", "resumo": "Trabalho de parto, bacia obstétrica, estática fetal, mecanismo e períodos clínicos do parto e preenchimento do partograma.", "teoria": "\n<p>O parto é um processo fisiológico em que as contrações uterinas promovem o apagamento e a dilatação do colo do útero e impulsionam o feto pelo canal de parto até o nascimento. Depois, as contrações continuam para permitir o desprendimento da placenta e ajudar a controlar o sangramento materno.<\/p>\n<p>Para compreender esse processo, é preciso integrar três elementos:<\/p>\n<ul class=\"bulleted-list\">\n<li><strong>Motor:<\/strong> as contrações uterinas e, no período expulsivo, a participação da musculatura abdominal (prensa abdominal).<\/li>\n<li><strong>Trajeto:<\/strong> o canal de parto, formado pelas partes moles (segmento inferior do útero, colo, vagina e períneo) e pela pelve óssea.<\/li>\n<li><strong>Objeto:<\/strong> o feto, que precisa adaptar sua posição e seus diâmetros aos diferentes segmentos da pelve materna.<\/li>\n<\/ul>\n\n<h2 class=\"block-color-orange\">Trabalho de parto<\/h2>\n<h3>Definição<\/h3>\n<p>Segundo o Rezende Obstetrícia Fundamental, o trabalho de parto é o processo fisiológico caracterizado por contrações uterinas regulares e efetivas que promovem modificações progressivas do colo uterino, com apagamento e dilatação, permitindo a descida e, depois, o nascimento do feto.<\/p>\n<p>O diagnóstico não depende apenas da presença de dor ou de contrações: é necessário que a atividade uterina provoque <strong>modificações cervicais progressivas<\/strong>.<\/p>\n<h3>Critérios para identificar o trabalho de parto<\/h3>\n<ul class=\"bulleted-list\">\n<li><strong>Contrações uterinas regulares<\/strong>, que se tornam progressivamente mais intensas, mais longas e mais frequentes.<\/li>\n<li><strong>Apagamento cervical:<\/strong> o colo encurta e fica mais fino.<\/li>\n<li><strong>Dilatação cervical progressiva:<\/strong> o orifício do colo aumenta de diâmetro.<\/li>\n<li><strong>Progressão obstétrica:<\/strong> descida da apresentação fetal pelo canal de parto.<\/li>\n<\/ul>\n<h3>Contrações rítmicas<\/h3>\n<p>Durante quase toda a gestação o útero se contrai, mas de forma irregular e não efetiva, sem produzir dilatação progressiva. O que caracteriza o trabalho de parto é a instalação de um <strong>padrão contrátil rítmico e efetivo<\/strong>.<\/p>\n<aside class=\"callout block-color-gray_background\"><div><span class=\"icon\">💡<\/span><\/div><div>\n<p><strong>Critério de contração rítmica (padrão efetivo):<\/strong> 2 ou mais contrações a cada 10 minutos, com duração de 45 a 60 segundos cada.<\/p>\n<p><strong>Para abrir o partograma:<\/strong> 2 a 3 contrações em 10 minutos associadas a dilatação de pelo menos 5 cm (fase ativa).<\/p>\n<\/div><\/aside>\n<h3>O que a contração faz no útero?<\/h3>\n<p>Durante a contração, o miométrio se encurta e aumenta sua tensão, com atividade predominante na porção superior do útero, que impulsiona o feto para baixo. O resultado clínico aparece em quatro fenômenos encadeados:<\/p>\n<figure class=\"image\"><img loading=\"lazy\" alt=\"\" src=\"img/2caa721be1666701.webp\"><\/figure>\n<ol class=\"numbered-list\">\n<li><strong>Apagamento:<\/strong> o colo fica mais curto e fino e se incorpora ao segmento inferior do útero. Deixa de ser um “canal” e passa a ser apenas um orifício.\n<figure class=\"image\"><img loading=\"lazy\" alt=\"\" src=\"img/dc250c3e3418e7ba.webp\"><\/figure>\n<figure class=\"image\"><img loading=\"lazy\" alt=\"\" src=\"img/71367498b2cc3086.webp\"><\/figure>\n<\/li>\n<li><strong>Dilatação:<\/strong> o orifício cervical aumenta progressivamente de diâmetro até cerca de 10 cm (dilatação completa).\n<figure class=\"image\"><img loading=\"lazy\" alt=\"\" src=\"img/0a74ac1471aa396d.webp\"><\/figure>\n<\/li>\n<li><strong>Descida:<\/strong> a apresentação fetal avança pela pelve, acompanhada no toque vaginal pelos planos de De Lee.<\/li>\n<li><strong>Expulsão:<\/strong> o feto atravessa o canal de parto e nasce; depois, as contrações continuam e promovem o desprendimento da placenta.<\/li>\n<\/ol>\n\n<h2 class=\"block-color-orange\">Trajeto: a bacia obstétrica<\/h2>\n<p>A bacia obstétrica é a estrutura óssea da pelve materna que forma parte do canal de parto. É o trajeto rígido pelo qual a apresentação fetal precisa passar no parto vaginal. A pelve é dividida em três estreitos (níveis) que o feto precisa vencer.<\/p>\n<figure class=\"image\"><img loading=\"lazy\" alt=\"\" src=\"img/b999223f1cb6ce74.webp\"><\/figure>\n<figure class=\"image\"><img loading=\"lazy\" alt=\"\" src=\"img/1e1a8a19275c50f9.webp\"><\/figure>\n<h3>Estreito superior (a entrada)<\/h3>\n<p>Vai do promontório à borda superior da sínfise púbica. O diâmetro mais importante aqui é o anteroposterior.<\/p>\n<ul class=\"bulleted-list\">\n<li><strong>Conjugata vera anatômica (~11 cm):<\/strong> do promontório à borda superior da sínfise púbica.<\/li>\n<li><strong>Conjugata vera obstétrica (~10,5 cm):<\/strong> do promontório à face interna da sínfise. É o espaço real que o feto tem para passar.<\/li>\n<li><strong>Conjugata diagonalis (~12 cm):<\/strong> do promontório à borda inferior da sínfise. É o único desses diâmetros que se consegue medir no toque vaginal; subtraindo cerca de 1,5 cm, estima-se a conjugata obstétrica.<\/li>\n<\/ul>\n<h3>Estreito médio (o “aperto”)<\/h3>\n<p>É o plano de menor dimensão da pelve.<\/p>\n<figure class=\"image\"><img loading=\"lazy\" alt=\"\" src=\"img/f734b32d176c3fa4.webp\"><\/figure>\n<ul class=\"bulleted-list\">\n<li><strong>Referência anatômica:<\/strong> as espinhas isquiáticas.<\/li>\n<li><strong>Importância:<\/strong> corresponde ao plano 0 de De Lee. Quando o ponto de referência da apresentação chega a esse plano, considera-se a apresentação insinuada (encaixada).<\/li>\n<li><strong>Diâmetro bi-isquiático:<\/strong> mede cerca de 10,5 cm. Espinhas muito salientes ao toque sugerem bacia estreita.<\/li>\n<\/ul>\n<h3>Estreito inferior (a saída)<\/h3>\n<p>É delimitado pela borda inferior do púbis e pelo cóccix.<\/p>\n<ul class=\"bulleted-list\">\n<li><strong>Conjugata exitus:<\/strong> mede 9,5 cm, mas pode chegar a 11–12 cm com a retropulsão do cóccix (movimento para trás) durante a passagem da cabeça fetal.<\/li>\n<li><strong>Diâmetro bituberoso:<\/strong> mede cerca de 11 cm e pode ser avaliado externamente.<\/li>\n<\/ul>\n<h3>Planos de Hodge e de De Lee<\/h3>\n<p>São as referências usadas para descrever a altura da apresentação na pelve. Os <strong>planos de Hodge<\/strong> são quatro planos paralelos, do estreito superior até a ponta do cóccix. Os <strong>planos de De Lee<\/strong> tomam as espinhas isquiáticas como plano 0 e medem em centímetros: acima delas os valores são negativos (−1 a −5) e abaixo, positivos (+1 a +5). Na prática clínica e no partograma usa-se De Lee.<\/p>\n<div class=\"column-list\"><div class=\"column\"><figure class=\"image\"><img loading=\"lazy\" alt=\"\" src=\"img/0e7f415c3f522cb5.webp\"><\/figure><\/div><div class=\"column\"><figure class=\"image\"><img loading=\"lazy\" alt=\"\" src=\"img/ae782c212a078f97.webp\"><\/figure><\/div><\/div>\n<figure class=\"image\"><img loading=\"lazy\" alt=\"\" src=\"img/ef24cddb10534f68.webp\"><\/figure>\n<figure class=\"image\"><img loading=\"lazy\" alt=\"\" src=\"img/bfedebb01639e14a.webp\"><\/figure>\n<figure class=\"image\"><img loading=\"lazy\" alt=\"\" src=\"img/97d91bda8d78e8a3.webp\"><\/figure>\n\n<h2 class=\"block-color-orange\">Objeto: estática fetal<\/h2>\n<p>A estática fetal estuda a relação do feto com o útero e com a pelve materna, sobretudo no fim da gestação e no trabalho de parto.<\/p>\n<h3>Atitude<\/h3>\n<p>Relação das partes fetais entre si. O habitual é a flexão generalizada: cabeça fletida sobre o tórax, coluna encurvada e membros fletidos, formando o “ovoide fetal”.<\/p>\n<h3>Situação<\/h3>\n<p>Relação entre o maior eixo do feto e o maior eixo do útero: longitudinal, transversa ou oblíqua.<\/p>\n<figure class=\"image\"><img loading=\"lazy\" alt=\"\" src=\"img/99375908bbcb88c9.webp\"><\/figure>\n<h3>Apresentação<\/h3>\n<p>Parte do feto que ocupa a área do estreito superior e tende a se insinuar primeiro: cefálica, pélvica ou córmica (de ombro, na situação transversa). Na apresentação cefálica, o grau de flexão da cabeça define o tipo: fletida (de vértice) ou defletida de 1º grau (bregma), de 2º grau (fronte) e de 3º grau (face).<\/p>\n<figure class=\"image\"><img loading=\"lazy\" alt=\"\" src=\"img/a8ff40479c539bac.webp\"><\/figure>\n<h3>Posição<\/h3>\n<p>Relação do dorso fetal com o lado materno: esquerda ou direita (e, secundariamente, anterior ou posterior).<\/p>\n<figure class=\"image\"><img loading=\"lazy\" alt=\"\" src=\"img/349fec56cbc6acb0.webp\"><\/figure>\n<h3>Variedade de posição<\/h3>\n<p>Relação entre o ponto de referência da apresentação e os pontos da pelve materna. Na apresentação cefálica fletida, o ponto de referência é o occipício:<\/p>\n<ul class=\"bulleted-list\">\n<li><strong>OEA:<\/strong> occipitoesquerda anterior.<\/li>\n<li><strong>OEP:<\/strong> occipitoesquerda posterior.<\/li>\n<li><strong>ODA:<\/strong> occipitodireita anterior.<\/li>\n<li><strong>ODP:<\/strong> occipitodireita posterior.<\/li>\n<li><strong>OET e ODT:<\/strong> occipitoesquerda e occipitodireita transversas.<\/li>\n<li><strong>OP e OS:<\/strong> occipitopúbica e occipitossacra.<\/li>\n<\/ul>\n<figure class=\"image\"><img loading=\"lazy\" alt=\"\" src=\"img/8609e13646b510b7.webp\"><\/figure>\n\n<h2 class=\"block-color-orange\">Mecanismo do parto<\/h2>\n<p>Os movimentos do mecanismo do parto são contínuos e entrelaçados. Para facilitar o estudo, costuma-se dividi-los em tempos, descritos aqui para a apresentação cefálica fletida.<\/p>\n<h3>1. Insinuação<\/h3>\n<p>É a passagem do maior diâmetro transverso da apresentação (o biparietal, na cefálica fletida) pelo estreito superior da pelve.<\/p>\n<ul class=\"bulleted-list\">\n<li>A cabeça adapta sua posição e seus diâmetros às dimensões da pelve.<\/li>\n<li>No início, a sutura sagital costuma estar orientada em um diâmetro oblíquo ou transverso do estreito superior, que oferecem melhores condições de entrada que o anteroposterior.<\/li>\n<li>Pode ocorrer <strong>assinclitismo<\/strong>, quando a sutura sagital não está equidistante do púbis e do sacro.<\/li>\n<\/ul>\n<p>A variedade de posição mais frequente no início da insinuação varia conforme a população e a morfologia da pelve, e há diferença entre autores franceses e anglo-saxões nesse ponto.<\/p>\n<figure class=\"image\"><img loading=\"lazy\" alt=\"\" src=\"img/d8f16f1ab1a65749.webp\"><\/figure>\n<h3>2. Descida<\/h3>\n<p>É a progressão do feto pelo canal de parto. Começa desde o início do trabalho de parto e continua até a expulsão completa. Após a insinuação, a cabeça avança em direção ao assoalho pélvico, mantendo sua orientação e aumentando discretamente a flexão ao encontrar resistência, o que favorece a passagem por diâmetros menores. Ao fim desta etapa, o ápice da cabeça alcança o assoalho pélvico, enquanto sua circunferência máxima fica aproximadamente no nível do estreito médio.<\/p>\n<p><strong>O que impulsiona a descida:<\/strong><\/p>\n<ul class=\"bulleted-list\">\n<li><strong>Contrações uterinas<\/strong>, que empurram o feto pelo canal de parto.<\/li>\n<li><strong>Tônus uterino<\/strong>, que mantém a pressão sobre o conteúdo uterino.<\/li>\n<li><strong>Dominância contrátil do fundo uterino:<\/strong> as contrações são mais intensas na porção superior do útero, direcionando a força para baixo.<\/li>\n<li><strong>Aumento da frequência e da intensidade das contrações<\/strong> ao longo do trabalho de parto.<\/li>\n<\/ul>\n<h3>Rotação interna da cabeça<\/h3>\n<p>Durante a descida, a cabeça precisa girar para se adaptar à saída pélvica. O assoalho pélvico tem uma superfície côncava, em goteira, com planos inclinados lateralmente. Ao distendê-lo, a cabeça desliza sobre esses planos e roda:<\/p>\n<ol class=\"numbered-list\">\n<li>A cabeça desce e distende o assoalho pélvico.<\/li>\n<li>O contato com os planos inclinados favorece a rotação.<\/li>\n<li>A sutura sagital passa a se orientar no sentido anteroposterior da saída pélvica.<\/li>\n<li>O occipício geralmente se posiciona anteriormente, sob a sínfise púbica, preparando o desprendimento.<\/li>\n<\/ol>\n<p>Descida e rotação acontecem de forma integrada; esse movimento combinado é chamado de <strong>penetração rotativa<\/strong> (Fernando Magalhães).<\/p>\n<figure class=\"image\"><img loading=\"lazy\" alt=\"\" src=\"img/f70dff9859d49bdc.webp\"><\/figure>\n<h3>Insinuação das espáduas<\/h3>\n<p>Enquanto a cabeça desce e roda, os ombros começam a atravessar o estreito superior.<\/p>\n<ul class=\"bulleted-list\">\n<li><strong>Diâmetro biacromial:<\/strong> cerca de 12 cm, maior que os diâmetros disponíveis para a passagem direta.<\/li>\n<li><strong>Adaptação:<\/strong> os ombros se aproximam, reduzindo o diâmetro efetivo, e se orientam em um diâmetro oblíquo ou no transverso do estreito superior.<\/li>\n<li><strong>Progressão:<\/strong> à medida que a cabeça avança, os ombros também descem em direção ao assoalho pélvico.<\/li>\n<\/ul>\n<figure class=\"image\"><img loading=\"lazy\" alt=\"\" src=\"img/9b34e7520433145f.webp\"><\/figure>\n<h3>3. Desprendimento da cabeça<\/h3>\n<p>Após a descida e a rotação interna, a cabeça está no assoalho pélvico, com a sutura sagital no sentido anteroposterior e o occipício sob o arco púbico. Apoiada nesse ponto, a cabeça faz um movimento de <strong>deflexão (extensão)<\/strong> para acompanhar a curvatura do canal de parto. Exteriorizam-se, em sequência, o occipício, o vértice, a fronte, o nariz, a boca e, por fim, o mento.<\/p>\n<h3>4. Rotação externa da cabeça (restituição) e rotação interna das espáduas<\/h3>\n<p>Depois de sair, a cabeça faz uma pequena rotação, a <strong>restituição<\/strong>: volta parcialmente à orientação que tinha antes da rotação interna. Ao mesmo tempo, os ombros fazem a sua rotação interna, levando o diâmetro biacromial para o sentido anteroposterior da saída pélvica. Os dois movimentos estão ligados e alinham cabeça e tronco para a saída do restante do corpo.<\/p>\n<h3>5. Desprendimento das espáduas e do restante do corpo<\/h3>\n<p>O ombro anterior passa primeiro, deslizando sob o arco púbico. Em seguida, o ombro posterior ultrapassa o períneo, com ajuda de uma flexão lateral do tronco fetal. Depois dos ombros, o restante do corpo sai com relativa facilidade, completando o nascimento.<\/p>\n<figure class=\"image\"><img loading=\"lazy\" alt=\"\" src=\"img/c1fa0b0a2c48a929.webp\"><\/figure>\n\n<h2 class=\"block-color-orange\">Períodos clínicos do parto<\/h2>\n<h3>1º período: dilatação<\/h3>\n<p>Começa com contrações dolorosas que modificam o colo e termina com a dilatação completa (10 cm). A dilatação resulta principalmente da tração das contrações sobre o colo, associada à pressão da bolsa das águas e da apresentação. A forma como o colo se modifica depende da paridade: nas <strong>primíparas<\/strong>, o apagamento geralmente precede a dilatação; nas <strong>multíparas<\/strong>, os dois ocorrem ao mesmo tempo. A bolsa das águas costuma se romper no fim da dilatação ou no início da expulsão.<\/p>\n<h3>2º período: expulsão<\/h3>\n<p>Começa com a dilatação completa e termina com a saída do feto. Depende da ação conjunta da contração uterina (metrossístole), componente fundamental, e da prensa abdominal, que surge por reflexo quando a apresentação distende as paredes vaginais, o reto e a bexiga. Após a saída do feto, o fundo uterino desce até a cicatriz umbilical e as contrações continuam, agora indolores.<\/p>\n<h3>3º período: secundamento (dequitação)<\/h3>\n<p>Começa após a expulsão do feto e termina com a saída da placenta e das membranas. A retração uterina reduz a área de inserção placentária e descola a placenta, que é inextensível, no plano da camada esponjosa da decídua basal, com formação do hematoma retroplacentário. Completa-se habitualmente em até 10 minutos; após 30 minutos, configura-se retenção placentária.<\/p>\n<h3>4º período: período de Greenberg<\/h3>\n<p>Corresponde à primeira hora após a dequitação e é o momento de maior risco de hemorragia. Enquanto estava implantada, a placenta se ligava ao útero pelas artérias e veias uteroplacentárias; ao termo, passam por essa região cerca de <strong>600 mL de sangue por minuto<\/strong>. Quando a placenta se descola, esses vasos se rompem e a área de inserção vira uma ferida ampla e muito vascularizada, que o organismo precisa controlar em poucos minutos.<\/p>\n<p>A hemostasia ocorre em quatro fases sucessivas:<\/p>\n<ol class=\"numbered-list\">\n<li><strong>Miotamponagem:<\/strong> a contração e a retração das fibras miometriais comprimem os vasos abertos (ligaduras vivas de Pinard). É o principal mecanismo.<\/li>\n<li><strong>Trombotamponagem:<\/strong> formação de trombos nos vasos e do coágulo na área de inserção.<\/li>\n<li><strong>Indiferença miouterina:<\/strong> o útero alterna contração e relaxamento; é a fase de maior risco de sangramento.<\/li>\n<li><strong>Contração uterina fixa:<\/strong> tônus permanente, após cerca de uma hora.<\/li>\n<\/ol>\n<p>O sinal clínico de hemostasia eficaz é o <strong>globo de segurança de Pinard<\/strong>: útero firme e contraído, com o fundo na altura da cicatriz umbilical.<\/p>\n\n<h2 class=\"block-color-orange\">Partograma<\/h2>\n<p>O partograma é o registro gráfico do trabalho de parto, aberto na fase ativa, em que se anotam a dilatação cervical, a descida da apresentação e as condições maternas e fetais. Ajuda a perceber cedo as distocias e padroniza o acompanhamento.<\/p>\n<figure class=\"image\"><img loading=\"lazy\" alt=\"\" src=\"img/25c990c657075f81.webp\"><\/figure>\n<h3>Dilatação e descida<\/h3>\n<ul class=\"bulleted-list\">\n<li>A <strong>dilatação<\/strong> é marcada com um triângulo, na escala da esquerda (0 a 10 cm).<\/li>\n<li>A <strong>altura da apresentação<\/strong> é marcada com um círculo, segundo os planos de De Lee (ou de Hodge), na escala da direita.<\/li>\n<\/ul>\n<h3>Linha de alerta e linha de ação<\/h3>\n<p>São duas linhas paralelas, inclinadas a 45° (velocidade de 1 cm por hora) e separadas por 4 quadrados (4 horas). Se não vierem impressas, quem abre o partograma deve traçá-las. A linha de alerta parte do ponto da primeira dilatação registrada na fase ativa.<\/p>\n<ul class=\"bulleted-list\">\n<li><strong>Linha de alerta:<\/strong> a dilatação deve acompanhar essa linha ou ficar à esquerda dela. Se a curva a ultrapassar, é sinal de atenção.<\/li>\n<li><strong>Linha de ação:<\/strong> indica a necessidade de intervenção, que não é necessariamente cesárea.<\/li>\n<\/ul>\n<p>Desde 2018, a OMS não recomenda usar a linha de ação como indicação automática de intervenção, e sim a avaliação individualizada de cada parturiente.<\/p>\n<h3>Batimentos cardíacos fetais e contrações<\/h3>\n<p>Os batimentos cardíacos fetais (BCF) são marcados com um ponto na frequência encontrada no momento do exame.<\/p>\n<p>As contrações são registradas em quadrados: cada quadrado pintado corresponde a uma contração em 10 minutos, e o preenchimento indica a duração. Contrações efetivas (mais longas) preenchem o quadrado inteiro; contrações de 20 a 39 segundos são marcadas com metade do quadrado, com um traço na diagonal.<\/p>\n<figure class=\"image\"><img loading=\"lazy\" alt=\"\" src=\"img/cedafc245c05da0a.webp\"><\/figure>\n", "guia": {"intro": "Roteiro para a admissão e o acompanhamento de uma gestante em trabalho de parto: anamnese obstétrica dirigida, exame geral e obstétrico, toque vaginal e decisão sobre a fase do trabalho de parto.", "etapas": [{"titulo": "Antes de começar", "itens": [["Higienizar as mãos, apresentar-se e identificar a gestante", "Explicar o que vai ser feito, pedir consentimento e garantir privacidade. Oferecer a presença do acompanhante.", null], ["Ter em mãos o cartão da gestante", "Idade gestacional, pré-natal, exames, tipagem sanguínea, sorologias e intercorrências.", {"s": "Identificação", "n": "Cartão da gestante: ___ consultas de pré-natal, tipagem sanguínea ___, sorologias ___."}]]}, {"titulo": "Anamnese obstétrica direcionada", "itens": [["Idade gestacional", "Pela data da última menstruação e pela ultrassonografia mais precoce.", {"s": "Identificação", "n": "Gestante de ___ semanas e ___ dias (DUM ___ / USG de ___ semanas)."}], ["Paridade e partos anteriores", "Gestações, partos (vaginais e cesáreas) e abortos; duração e intercorrências dos partos anteriores. Cesárea prévia muda a conduta.", {"s": "Identificação", "n": "G___P___A___ (___ partos vaginais, ___ cesáreas).", "a": ["G___P___A___, com cesárea prévia há ___ (indicação: ___)."]}], ["Contrações", "Quando c
