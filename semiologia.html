 Graves têm lâminas largas. O mecanismo de abertura e trava é testado antes, já de luvas. Segundo o Bates, o espéculo é umedecido com água morna, porque o gel interfere na citologia e nas culturas.<\/p>\n<p>A paciente fica em posição ginecológica, com os quadris na borda da mesa, joelhos fletidos e abdome e coxas cobertos. A tensão da musculatura fecha o introito e aumenta o desconforto, por isso pedir que ela relaxe glúteos, coxas e assoalho pélvico, com respiração lenta, faz parte da técnica.<\/p>\n\n<h2 class=\"block-color-purple_background\">Inspeção da genitália externa<\/h2>\n<p>A inspeção tem duas etapas:<\/p>\n<ul class=\"bulleted-list\">\n<li><strong>Estática:<\/strong> com os lábios em repouso, apenas olhando. Avalia-se a pilificação (Tanner P1 a P5), o monte do púbis, grandes e pequenos lábios, períneo, abaulamentos na região das glândulas de Bartholin, tumefações e lesões.<\/li>\n<li><strong>Dinâmica:<\/strong> afastando delicadamente os pequenos lábios com os dedos. Avalia-se vestíbulo, meato uretral, glândulas de Skene e de Bartholin, introito e fúrcula. Se houver queixa de prolapso, pede-se que a paciente faça força ou tussa.<\/li>\n<\/ul>\n<p>Qualquer lesão é descrita por localização, número, tamanho, cor, superfície (úlcera, vesícula, verrucosidade), secreção, dor e edema.<\/p>\n\n<h2 class=\"block-color-purple_background\">Exame especular<\/h2>\n<h3>Introdução do espéculo<\/h3>\n<p>A técnica segue uma sequência que respeita a anatomia da vagina:<\/p>\n<figure class=\"image\"><img loading=\"lazy\" alt=\"\" src=\"img/84ba23258a13f1c8.webp\"><\/figure>\n<ol class=\"numbered-list\">\n<li>Avisar a paciente e afastar os lábios com o indicador e o médio da mão não dominante, expondo o introito.<\/li>\n<li>Apoiar o espéculo <strong>fechado<\/strong> na comissura posterior, sem pressionar o meato uretral.<\/li>\n<li>Introduzir com inclinação de cerca de 30 a 45 graus em direção posterior (ao sacro), acompanhando o eixo da vagina. O Bates usa 30 graus como referência; os slides da estação falam em 45 graus.<\/li>\n<li>Na metade do trajeto, girar para a posição horizontal, com as valvas paralelas às paredes anterior e posterior da vagina.<\/li>\n<li>Introduzir completamente, mantendo leve pressão posterior, e só então abrir devagar e travar, envolvendo o colo.<\/li>\n<\/ol>\n<figure class=\"image\"><img loading=\"lazy\" alt=\"\" src=\"img/7f2590b2af4d721b.webp\"><\/figure>\n<p>Os erros clássicos são abrir as valvas na entrada ou no meio do canal, direcionar o espéculo para cima (em direção à uretra), forçar contra resistência e introduzir sem avisar. Abrir antes de chegar ao fundo provoca dor imediata.<\/p>\n<div class=\"caiu-slot\" data-i=\"0\"><\/div>\n<h3>Encontrando e examinando o colo<\/h3>\n<p>Se o colo não aparece, o certo é recuar um pouco, fechar parcialmente, redirecionar e avançar de novo, em vez de abrir e fechar repetidamente. No útero retrovertido, o colo aponta mais para a frente. Se houver secreção atrapalhando, remove-se só o excesso com a pinça de Cheron e algodão, sem friccionar o colo antes da coleta.<\/p>\n<p>Com o espéculo, avalia-se a vagina (cor, pregas, atrofia, lesões, secreção, sangramento, prolapsos) e o colo (cor, posição, superfície, ectopia, pólipos, ulceração, sangramento, secreção e aspecto do orifício). Segundo o Bates, secreção amarelada endocervical sugere cervicite, e lesões verrucosas, friáveis ou lobuladas sugerem condiloma ou câncer.<\/p>\n<aside class=\"callout block-color-gray_background\"><div><span class=\"icon\">💡<\/span><\/div><div>\n<p><strong>Lesão visível muda tudo:<\/strong> lesão vegetante, friável ou sangrante no colo, ou sangramento pós-coital com lesão, é sinal de alerta. A prioridade é colposcopia e biópsia, e não colher preventivo e esperar o resultado.<\/p>\n<\/div><\/aside>\n\n<h2 class=\"block-color-purple_background\">Coleta do exame citopatológico (Papanicolau)<\/h2>\n<p>A coleta precisa alcançar a <strong>junção escamocolunar e a zona de transformação<\/strong>. A lâmina é identificada na extremidade fosca, com lápis, antes de colher. A ordem é sempre ectocérvice primeiro e endocérvice depois.<\/p>\n<figure class=\"image\"><img loading=\"lazy\" alt=\"\" src=\"img/0938ddcf944bc676.webp\"><\/figure>\n<ol class=\"numbered-list\">\n<li><strong>Ectocérvice, com a espátula de Ayre:<\/strong> encaixar a extremidade mais longa no orifício externo, mantendo contato com a ectocérvice, e girar 360 graus com pressão suave e contínua.<\/li>\n<li><strong>Endocérvice, com a escova:<\/strong> introduzir delicadamente no canal e girar. Em gestantes, usa-se swab de algodão no lugar da escova.<\/li>\n<li><strong>Espalhamento:<\/strong> o material da espátula na metade da lâmina, em movimento único, e o da escova rolado na área restante.<\/li>\n<li><strong>Fixação imediata:<\/strong> com álcool ou spray. O grande inimigo da amostra é o dessecamento ao ar, que destrói a morfologia celular.<\/li>\n<\/ol>\n<figure class=\"image\"><img loading=\"lazy\" alt=\"\" src=\"img/3e174069866758f4.webp\"><\/figure>\n<p>Girar só 90 graus, não manter contato com o colo ou demorar para fixar são os erros que geram amostra pobre. A coleta de fundo de saco vaginal (antiga coleta \"tríplice\") não é recomendada para rastreamento.<\/p>\n<div class=\"caiu-slot\" data-i=\"1\"><\/div>\n<h3>Retirada do espéculo e qualidade da amostra<\/h3>\n<p>Para retirar, destrava-se o espéculo e recua-se lentamente, mantendo-o aberto com o polegar até liberar o colo, inspecionando as paredes vaginais na saída. Ele é fechado ao sair do introito.<\/p>\n<p>A qualidade da amostra depende de a paciente estar preparada (fora da menstruação, sem relação sexual, duchas, cremes ou absorvente interno nas 48 horas anteriores, segundo o Bates), de o colo estar bem visualizado, de a área correta ser amostrada, de a técnica ser delicada e de a fixação ser imediata.<\/p>\n\n<h2 class=\"block-color-purple_background\">Toque bimanual<\/h2>\n<h3>Técnica<\/h3>\n<p>Antes de começar, explica-se que é uma nova etapa e pede-se permissão de novo. Com a mão dominante enluvada e lubrificada, introduzem-se o indicador e o médio, palma para cima, com pressão predominantemente posterior; o polegar fica afastado e os outros dedos fletidos, para não tocar a uretra e o clitóris. A mão abdominal, no hipogástrio, faz contrapressão e \"aprisiona\" o útero e os anexos entre as duas mãos.<\/p>\n<figure class=\"image\"><img loading=\"lazy\" alt=\"\" src=\"img/da5a093346f72961.webp\"><\/figure>\n<p>Avaliam-se as paredes vaginais, o colo (posição, consistência, mobilidade e <strong>dor à mobilização<\/strong>), o útero (tamanho, forma, consistência, mobilidade, dor e versão), os anexos (girando os dedos para os fórnices laterais) e o fundo de saco. Segundo o Bates, o colo normal se mobiliza um pouco sem dor; dor à mobilização do colo ou dos anexos sugere doença inflamatória pélvica, gravidez ectópica ou apendicite, e nodularidade dolorosa nos fórnices sugere endometriose. Ovário palpável após a menopausa deve ser investigado.<\/p>\n<p>\"Normal\" não é \"não senti nada\": registra-se o que foi possível avaliar e as limitações do exame.<\/p>\n<h3>Quando fazer e quando não fazer<\/h3>\n<p>O toque bimanual é indicado em queixas ginecológicas (dor pélvica, dispareunia, sangramento uterino anormal), na suspeita de doença inflamatória pélvica, em massa pélvica, em alteração ao especular ou à imagem e antes de alguns procedimentos, como a inserção de DIU. Não é feito por rotina em mulher assintomática, e não é método de rastreamento de câncer de ovário.<\/p>\n<p>A ordem do exame é sempre <strong>inspeção externa, exame especular e toque bimanual<\/strong>. O toque deve ser evitado ou adiado em violência sexual recente (que exige acolhimento e exame pericial próprios), metrorragia volumosa e dor local de grande intensidade.<\/p>\n<div class=\"caiu-slot\" data-i=\"2\"><\/div>\n\n<h2 class=\"block-color-purple_background\">Rastreamento do câncer do colo do útero<\/h2>\n<h3>Quem rastrear<\/h3>\n<p>A população-alvo são as pessoas com colo do útero, de <strong>25 a 64 anos<\/strong>, que já iniciaram atividade sexual. Antes dos 25 anos, o rastreamento não é indicado em assintomáticas de risco habitual. Imunossuprimidas (HIV, transplantadas, uso de imunossupressores) começam mais cedo e com intervalo menor. Mulheres com histerectomia total por doença benigna, sem história de lesão de alto grau e com exames anteriores normais, podem ser excluídas do rastreamento.<\/p>\n<h3>DNA-HPV: o método primário<\/h3>\n<p>Segundo as Diretrizes Brasileiras de 2025, o teste de DNA-HPV oncogênico é o <strong>método primário<\/strong> de rastreamento, em implantação progressiva no SUS. Ele detecta o DNA dos tipos de alto risco e é mais sensível que a citologia para lesões de alto grau. A citologia continua sendo usada onde o teste ainda não está disponível e como teste reflexo.<\/p>\n<figure class=\"image\"><img loading=\"lazy\" alt=\"\" src=\"img/e4b2bc82d80998dd.webp\"><\/figure>\n<div class=\"tbl\"><table class=\"simple-table\"><thead><tr><th class=\"simple-table-header-color simple-table-header\">Resultado do DNA-HPV<\/th><th class=\"simple-table-header-color simple-table-header\">Conduta<\/th><\/tr><\/thead><tbody>\n<tr><td>Negativo<\/td><td>Repetir em 5 anos<\/td><\/tr>\n<tr><td>HPV 16 e/ou 18<\/td><td>Colposcopia, independentemente da citologia<\/td><\/tr>\n<tr><td>Outros HPV oncogênicos<\/td><td>Citologia reflexa na mesma amostra: se ASC-US ou mais grave, ou insatisfatória, colposcopia; se normal, repetir o DNA-HPV em 12 meses<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>A infecção pelo HPV é muito frequente e, na maioria das vezes, transitória. O evento decisivo para o câncer é a <strong>persistência<\/strong> de tipos oncogênicos, principalmente o 16 e o 18. Tabagismo, imunossupressão e ausência de rastreamento aumentam o risco de progressão.<\/p>\n<h3>Rastreamento por citologia<\/h3>\n<p>Onde a citologia é o método usado, ela é feita na mesma faixa etária: após dois exames anuais consecutivos normais, passa a ser repetida a cada 3 anos. O rastreamento pode ser encerrado aos 64 anos em quem teve pelo menos dois exames normais nos últimos 10 anos, sendo o último há menos de 5 anos.<\/p>\n<div class=\"tbl\"><table class=\"simple-table\"><thead><tr><th class=\"simple-table-header-color simple-table-header\">Resultado da citologia<\/th><th class=\"simple-table-header-color simple-table-header\">Conduta<\/th><\/tr><\/thead><tbody>\n<tr><td>Negativo (NILM)<\/td><td>Seguir a rotina<\/td><\/tr>\n<tr><td>ASC-US<\/td><td>25 a 29 anos: repetir em 12 meses; 30 anos ou mais: repetir em 6 meses<\/td><\/tr>\n<tr><td>LSIL (baixo grau, NIC I)<\/td><td>Repetir em 6 meses<\/td><\/tr>\n<tr><td>ASC-H, HSIL (NIC II e III), AGC, AIS<\/td><td>Colposcopia, sem repetir a citologia<\/td><\/tr>\n<tr><td>Suspeita de carcinoma ou lesão visível<\/td><td>Encaminhamento prioritário e biópsia<\/td><\/tr>\n<tr><td>Insatisfatória<\/td><td>Repetir em 6 a 12 semanas, corrigindo o que prejudicou a amostra<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<div class=\"caiu-slot\" data-i=\"3\"><\/div>\n<h3>Colposcopia<\/h3>\n<p>A colposcopia examina o colo com magnificação e iluminação e orienta a biópsia para a área mais suspeita. Após o ácido acético, áreas que ficam brancas (epitélio acetobranco) chamam atenção, assim como os padrões vasculares em mosaico e pontilhado, sobretudo quando grosseiros. No teste de Schiller, o epitélio escamoso maduro, rico em glicogênio, cora-se de castanho-escuro com o lugol; a área que fica amarelo-clara (iodo-negativa) não tem glicogênio e é suspeita.<\/p>\n<figure class=\"image\"><img loading=\"lazy\" alt=\"\" src=\"img/9c4cb584b5f321d0.webp\"><\/figure>\n<h3>Vacina e outras necessidades preventivas<\/h3>\n<p>A vacina contra o HPV é feita em dose única, na rotina, para meninas e meninos de 9 a 14 anos, com resgate de não vacinados de 15 a 19 anos em 2026. A vacinação não dispensa o rastreamento. A consulta ginecológica também é o momento de revisar a mamografia, a contracepção, a testagem para IST e outras vacinas.<\/p>\n", "guia": {"intro": "Roteiro para o exame ginecológico com coleta do citopatológico: anamnese focal, inspeção da genitália externa, exame especular, coleta e toque bimanual, nessa ordem.", "secoes": ["Queixa principal", "Antecedentes ginecológicos e obstétricos", "Genitália externa", "Exame especular", "Coleta", "Toque bimanual", "Impressão e conduta"], "fontes": "Elaborado a partir do material da Estação 1 de HM4 (slides e conferência), com base em Bickley, Bates: Propedêutica Médica, 13. ed.; Porto, Semiologia Médica, 9. ed.; e Diretrizes Brasileiras para o Rastreamento do Câncer do Colo do Útero (INCA, 2025).", "etapas": [{"titulo": "Antes de começar", "itens": [["Separar e testar o material", "Espéculo do menor tamanho adequado (testar a trava já de luvas), espátula de Ayre, escova, lâmina identificada a lápis, fixador, pinça de Cheron, foco e campo.", null], ["Higienizar as mãos, apresentar-se e identificar a paciente", "Nome completo e mais um dado.", null], ["Explicar o exame, pedir consentimento e oferecer acompanhante", "Avisar antes de cada etapa e combinar que ela pode pedir pausa.", null]]}, {"titulo": "Anamnese ginecológica focal", "itens": [["Identificar a queixa principal", "Corrimento, sangramento, dor, lesão, prurido ou consulta preventiva.", {"s": "Queixa principal", "n": "Consulta preventiva, sem queixas ginecológicas.", "a": [["Corrimento", "Corrimento vaginal há ___, de aspecto ___, ___ (com / sem) odor e prurido."], ["Sangramento", "Sangramento ___ (pós-coital / intermenstrual) há ___."], ["Dor", "Dor pélvica há ___, ___ (cíclica / contínua), com dispareunia ___."]]}], ["Ciclo menstrual e DUM", "Menarca, regularidade, duração, fluxo, sangramento intermenstrual ou pós-coital, menopausa.", {"s": "Antecedentes ginecológicos e obstétricos", "n": "Menarca aos ___ anos, ciclos regulares de ___ dias, duração de ___ dias, fluxo habitual. DUM: ___.", "a": [["Irregular", "Menarca aos ___ anos, ciclos irregulares de ___ a ___ dias. DUM: ___."], ["Menopausa", "Menopausa aos ___ anos. Nega sangramento após a menopausa."]]}], ["Vida sexual, contracepção e IST", "Sexarca, parcerias, método contraceptivo, uso de preservativo, IST prévias, dispareunia.", {"s": "Antecedentes ginecológicos e obstétricos", "n": "Sexarca aos ___ anos, vida sexual ativa, em uso de ___ como método contraceptivo, uso ___ de preservativo. Nega IST prévias e dispareunia."}], ["Gestações, último preventivo e mamografia", "G P A, data e resultado do último exame do colo, procedimentos prévios e última mamografia.", {"s": "Antecedentes ginecológicos e obstétricos", "n": "G___P___A___. Último preventivo em ___, com resultado normal. Última mamografia em ___.", "a": [["Exame alterado", "G___P___A___. Último preventivo em ___, com resultado ___ (alterado). ___ (fez / não fez) colposcopia."]]}]]}, {"titulo": "Posicionamento", "itens": [["Posição ginecológica", "Quadris na borda da mesa, joelhos fletidos, abdome e coxas cobertos, foco alinhado ao introito. Pedir que relaxe o assoalho pélvico.", null], ["Calçar luvas e avisar antes de tocar", "Lembrar a paciente de que pode pedir para parar.", null]]}, {"titulo": "Inspeção da genitália externa", "itens": [["Inspeção estática", "Pilificação (Tanner), monte do púbis, grandes e pequenos lábios, períneo, abaulamentos e lesões.", {"s": "Genitália externa", "n": "Pilificação de distribuição ginecoide, grandes lábios simétricos, sem lesões, tumefações ou abaulamentos.", "a": [["Lesão", "Lesão ___ (úlcera / vesículas / verrucosa) em ___, de ___ cm, ___ (dolorosa / indolor)."], ["Atrofia", "Grandes e pequenos lábios com sinais de atrofia e mucosa ressecada."]]}], ["Inspeção dinâmica", "Afastar os pequenos lábios: vestíbulo, meato, Skene, Bartholin (4 e 8 horas), introito e fúrcula. Esforço ou tosse se houver queixa de prolapso.", {"s": "Genitália externa", "n": "Vestíbulo, meato uretral e glândulas de Skene sem alterações; região das glândulas de Bartholin sem abaulamentos. Sem prolapsos ao esforço.", "a": [["Bartholin", "Abaulamento em região de glândula de Bartholin ___ (direita / esquerda), ___ (doloroso / indolor)."], ["Prolapso", "Prolapso de parede vaginal ___ ao esforço."]]}]]}, {"titulo": "Exame especular", "itens": [["Afastar os lábios com a mão não dominante", "Expor o introito e a comissura posterior.", null], ["Introduzir o espéculo fechado, apoiado na comissura posterior", "Inclinação de 30 a 45 graus em direção posterior, sem pressionar o meato.", null], ["Girar para a horizontal na metade e introduzir até o fundo", "Só então abrir devagar e travar, envolvendo o colo.", null], ["Examinar a vagina", "Cor, pregas, atrofia, lesões, secreção e sangramento.", {"s": "Exame especular", "n": "Paredes vaginais róseas e pregueadas, sem lesões, com conteúdo vaginal fisiológico.", "a": [["Corrimento", "Conteúdo vaginal ___ (branco grumoso / amarelo-esverdeado bolhoso / acinzentado), ___ (com / sem) odor."], ["Atrofia", "Paredes vaginais pálidas e atróficas."]]}], ["Examinar o colo", "Cor, posição, superfície, ectopia, pólipos, ulceração, sangramento, secreção e orifício.", {"s": "Exame especular", "n": "Colo centralizado, róseo, de superfície regular, sem lesões, sangramento ou secreção anormal.", "a": [["Ectopia", "Colo róseo com área de ectopia periorificial, regular, sem lesões suspeitas."], ["Lesão suspeita", "Lesão ___ (vegetante / friável / ulcerada) no colo, de ___ cm, sangrante ao contato."], ["Cervicite", "Secreção endocervical mucopurulenta, colo friável."]]}]]}, {"titulo": "Coleta do citopatológico", "itens": [["Ectocérvice com a espátula de Ayre", "Extremidade longa no orifício externo, girar 360 graus com contato contínuo.", null], ["Endocérvice com a escova", "Introduzir no canal e girar. Em gestantes, swab de algodão.", null], ["Espalhar na lâmina e fixar imediatamente", "Espátula na metade da lâmina, escova rolada no restante; álcool ou spray sem demora.", {"s": "Coleta", "n": "Coleta citológica realizada em ectocérvice e endocérvice, lâmina identificada e fixada imediatamente.", "a": ["Coleta não realizada (___)."]}], ["Retirar o espéculo inspecionando as paredes", "Destravar, recuar devagar e fechar ao sair do introito.", null]]}, {"titulo": "Toque bimanual", "itens": [["Explicar a nova etapa e pedir permissão", "É um novo procedimento: o consentimento é renovado.", null], ["Dois dedos com pressão posterior e mão abdominal no hipogástrio", "Polegar afastado, sem tocar uretra e clitóris.", null], ["Avaliar o colo", "Posição, consistência, mobilidade e dor à mobilização.", {"s": "Toque bimanual", "n": "Colo de consistência fibroelástica, móvel e indolor à mobilização.", "a": ["Dor à mobilização do colo."]}], ["Avaliar útero e anexos", "Útero: tamanho, forma, consistência, mobilidade, versão e dor. Anexos pelos fórnices laterais.", {"s": "Toque bimanual", "n": "Útero antevertido, de tamanho habitual, móvel e indolor. Anexos sem massas palpáveis e indolores.", "a": [["Útero aumentado", "Útero aumentado, compatível com ___ semanas, de contornos ___ (regulares / irregulares), ___ (móvel / pouco móvel)."], ["Anexo doloroso", "Dor à palpação do anexo ___, ___ (sem / com) massa palpável."]]}]]}, {"titulo": "Fechamento", "itens": [["Ajudar a paciente a se recompor e explicar os achados", "Dizer quando sai o resultado e qual o próximo passo.", null], ["Definir a conduta", "Orientar o intervalo do rastreamento ou encaminhar a investigação se houver lesão.", {"s": "Impressão e conduta", "n": "Exame ginecológico sem alterações. Orientada quanto ao resultado e ao intervalo do rastreamento.", "a": [["Lesão suspeita", "Lesão suspeita em colo uterino. Encaminhada para colposcopia e biópsia."]]}]]}, {"titulo": "Sinais de alerta", "alerta": true, "itens": [["Lesão vegetante, friável ou sangrante no colo", "Não é rastreamento: colposcopia e biópsia."], ["Sangramento pós-coital recorrente", "Investigar o colo, mesmo com citologia prévia normal."], ["Dor à mobilização do colo e dos anexos", "Pensar em DIP; fazer beta-hCG para afastar gravidez ectópica."], ["Ovário palpável após a menopausa", "Exige investigação."], ["Sangramento após a menopausa", "Investigar o endométrio."]]}, {"titulo": "Registro (exemplo de exame normal)", "registro": "Paciente orientada quanto ao exame e consentiu com o procedimento. Vulva sem lesões ou tumefações, meato uretral sem alterações, região das glândulas de Bartholin sem abaulamentos. Exame especular com paredes vaginais róseas, sem lesões; colo centralizado, de superfície regular, sem sangramento ou secreção anormal. Coleta citológica realizada em ectocérvice e endocérvice, lâmina identificada e fixada imediatamente. Toque bimanual: colo móvel e indolor; útero de tamanho habitual, móvel e indolor; anexos sem massas palpáveis e sem dor. Procedimento bem tolerado.", "itens": []}]}, "caiu": [{"tag": "UNP Salgado Filho · 2026.2 · Questão 16", "s": "Uma estudante realiza o exame especular em uma paciente. Após explicar o procedimento e obter sua permissão, seleciona um espéculo de tamanho adequado. De acordo com a técnica descrita durante a estação de exame ginecológico, qual é a conduta correta para a introdução do espéculo?", "o": ["Introduzi-lo aberto, perpendicularmente ao introito vaginal.", "Introduzi-lo fechado, apoiado na comissura posterior, inicialmente com angulação aproximada de 45 graus.", "Introduzi-lo aberto e direcioná-lo para o fórnice anterior.", "Introduzi-lo fechado, horizontalmente, mantendo as valvas paralelas às paredes laterais da vagina."], "c": 1, "why": "O espéculo entra fechado, apoiado na comissura posterior e inclinado em direção ao sacro, acompanhando o eixo posterossuperior da vagina. Só na metade do trajeto ele gira para a horizontal, e só no fundo é aberto. Entrar aberto ou direcioná-lo para cima machuca e pressiona a uretra."}, {"tag": "UNIFG São Sebastião · 2025.2 · Questão 6", "s": "Para realizar o exame citopatológico, a coleta correta da ectocérvice ocorre quando:", "o": ["A espátula é girada apenas 90° para evitar sangramento.", "A escova endocervical é usada sempre antes da espátula.", "A espátula é aplicada paralelamente ao canal cervical e tracionada suavemente.", "A parte mais longa da espátula é posicionada no orifício cervical externo e girada 360°."], "c": 3, "why": "A espátula de Ayre tem uma ponta mais longa que se encaixa no orifício externo; girando 360 graus com contato contínuo, ela varre toda a zona de transformação. Girar só 90 graus deixa a amostra incompleta, e a ordem correta é espátula antes da escova."}, {"tag": "UNIFG São Sebastião · 2025.2 · Questão 16", "s": "Durante treinamento de exame ginecológico, uma estudante inicia o exame pelo toque bimanual e, em seguida, tenta visualizar o colo uterino com o espéculo. A preceptora solicita que repita o procedimento na ordem correta. Qual é a sequência recomendada?", "o": ["Exame especular → toque bimanual → inspeção externa.", "Inspeção externa → toque bimanual → exame especular.", "Toque bimanual → inspeção externa → exame especular.", "Inspeção externa → exame especular → toque bimanual."], "c": 3, "why": "O exame vai do menos para o mais invasivo e do que se vê para o que se palpa: inspeção externa, exame especular (com a coleta, antes que o lubrificante e a manipulação alterem o colo) e, por último, o toque bimanual."}, {"tag": "FASEH · 2026.2 · Questão 18", "s": "Uma mulher de 27 anos, assintomática, imunocompetente, com colo do útero e vida sexual iniciada, procura a Unidade Básica de Saúde para avaliação preventiva. Nega história de lesão cervical de alto grau ou tratamento prévio por neoplasia intraepitelial cervical. Nunca realizou rastreamento do câncer do colo do útero. Considerando as Diretrizes Brasileiras para o Rastreamento do Câncer do Colo do Útero de 2025, qual é a conduta mais adequada para essa paciente?", "o": ["Realizar inicialmente citologia cervical e reservar o teste para DNA-HPV oncogênico para os casos em que forem identificadas alterações citológicas.", "Adiar o início do rastreamento até os 30 anos, quando deverá ser realizado teste para DNA-HPV oncogênico, devido à elevada frequência de infecções transitórias pelo HPV em mulheres mais jovens.", "Iniciar o rastreamento com exame citopatológico; se o resultado for normal, repetir anualmente até obter dois exames consecutivos normais e, posteriormente, a cada três anos.", "Realizar concomitantemente citologia cervical e teste para DNA- HPV oncogênico, repetindo ambos a cada cinco anos quando os resultados forem negativos.", "Realizar teste para detecção de DNA-HPV oncogênico como método primário; se o resultado for negativo, repetir o rastreamento em cinco anos."], "c": 4, "why": "Pelas Diretrizes de 2025, o DNA-HPV oncogênico é o método primário de rastreamento dos 25 aos 64 anos. Se negativo, repete-se em 5 anos. A citologia entra como teste reflexo para os HPV não 16/18 ou onde o teste molecular ainda não está disponível."}], "videos": [{"id": "1JYEsNed57GVcluUjIHM8bL1DOogUOj1s", "nome": "Exame físico ginecológico", "teoria": "Inspeção da genitália externa", "guia": "Inspeção da genitália externa"}]}, {"id": "genitalia-masculina", "nome": "Genitália masculina e toque retal", "resumo": "Pênis, bolsa escrotal, Valsalva e transiluminação, hérnias, inspeção perianal, toque retal e diferenciação da próstata.", "teoria": "<p>O exame da genitália masculina avalia o pênis, a bolsa escrotal com seu conteúdo (testículos, epidídimos e funículos espermáticos) e as regiões inguinais. O toque retal completa a avaliação, examinando a região perianal, o canal anal, a ampola retal e a próstata.<\/p>\n<p>São exames que mobilizam questões pessoais e culturais, por isso o ambiente seguro vem antes da técnica. O toque retal, em especial, é uma invasão consentida: a decisão de fazê-lo pesa o valor diagnóstico esperado contra o desconforto e a dignidade da pessoa.<\/p>\n\n<h2 class=\"block-color-blue_background\">Antes de examinar: confiança e indicação<\/h2>\n<p>O exame começa com privacidade total, temperatura agradável e material separado antes. A postura é profissional e sem julgamentos sobre escolhas e orientações sexuais. O examinador se apresenta, explica o procedimento e sua importância, avisa o que vai tocar e por quê, pede permissão explícita e combina a presença de acompanhante, se o paciente quiser.<\/p>\n<p>O exame genital detalhado é feito quando há motivo: sintomas urinários, suspeita de IST (corrimento uretral, úlcera, vesículas, verrugas, prurido, dor genital), dor ou alteração escrotal (dor testicular, aumento de volume, massa, assimetria nova) e infertilidade. Em um adulto sem queixa nem achado geniturinário, em que o exame não mudaria a conduta, não se faz exame genital detalhado só por ser homem.<\/p>\n\n<h2 class=\"block-color-blue_background\">Anatomia e fisiologia que orientam o exame<\/h2>\n<figure class=\"image\"><img loading=\"lazy\" alt=\"\" src=\"img/d2966367b65b8ebd.webp\"><\/figure>\n<h3>Pênis<\/h3>\n<p>O pênis é formado por dois <strong>corpos cavernosos<\/strong>, na face dorsal, responsáveis pela rigidez da ereção, e por um <strong>corpo esponjoso<\/strong>, na face ventral, que envolve a uretra e forma a glande. O <strong>prepúcio<\/strong> é a dobra de pele retrátil que recobre a glande nos não circuncidados. A uretra masculina mede cerca de 20 cm e tem as porções prostática, membranosa e esponjosa, o que importa também para a sondagem vesical.<\/p>\n<h3>Testículo, epidídimo e funículo<\/h3>\n<p>O testículo produz espermatozoides (nos túbulos seminíferos) e testosterona (nas células de Leydig). É envolvido pela túnica albugínea e pela <strong>túnica vaginal<\/strong>, uma serosa que permite sua mobilidade e onde se acumula líquido na hidrocele. O <strong>epidídimo<\/strong> fica aderido à face posterior do testículo, com cabeça, corpo e cauda, e faz a maturação e o armazenamento dos espermatozoides. O <strong>ducto deferente<\/strong> sobe pelo funículo espermático e é palpável como um cordão firme.<\/p>\n<p>O caminho do espermatozoide é túbulos seminíferos, rede testicular, ductos eferentes, epidídimo, ducto deferente, ducto ejaculatório, uretra e meato. As vesículas seminais produzem a maior parte do volume do sêmen, e a próstata contribui com cerca de 20 a 30%, incluindo o PSA.<\/p>\n<h3>Eixo hormonal e puberdade<\/h3>\n<p>O GnRH hipotalâmico estimula a hipófise a liberar LH e FSH. O LH age nas células de Leydig, que produzem testosterona; o FSH age nas células de Sertoli, que sustentam a espermatogênese e produzem inibina B. Testosterona e inibina fazem feedback negativo. Por isso, um achado local pode refletir doença testicular, hipofisária ou sistêmica.<\/p>\n<p>O primeiro sinal da puberdade masculina é o aumento do volume testicular para cerca de <strong>4 mL<\/strong> (orquidômetro de Prader), seguido do crescimento do escroto, do pênis e dos pelos pubianos. O volume adulto é maior que 15 mL. Testículos pequenos sugerem hipogonadismo, dano testicular ou atraso puberal; assimetria pode indicar varicocele, trauma, torção prévia, tumor ou inflamação.<\/p>\n\n<h2 class=\"block-color-blue_background\">Inspeção e palpação do pênis<\/h2>\n<figure class=\"image\"><img loading=\"lazy\" alt=\"\" src=\"img/eb16082b5f5b060c.webp\"><\/figure>\n<p>A inspeção percorre pele e pelos (distribuição, lesões, parasitas, sinais flogísticos), prepúcio, glande, sulco balanoprepucial e meato uretral.<\/p>\n<ul class=\"bulleted-list\">\n<li><strong>Prepúcio:<\/strong> a retração faz parte do exame, pelo paciente ou pelo examinador. Na <strong>fimose<\/strong>, um anel prepucial estreito impede expor a glande. Na <strong>parafimose<\/strong>, o prepúcio retraído não volta, garroteia a glande e causa edema: é uma urgência. O esmegma é fisiológico.<\/li>\n<li><strong>Glande e sulco:<\/strong> procurar lesões, cicatrizes, nódulos e sinais inflamatórios. Balanite é a inflamação da glande; balanopostite, da glande e do prepúcio. As glândulas de Tyson, pápulas perláceas em fileira no sulco, são variante normal e não IST.<\/li>\n<li><strong>Meato uretral:<\/strong> comprimido suavemente entre o polegar e o indicador para abri-lo e ver se há secreção. Na hipospádia, o meato fica na face ventral; na epispádia, na dorsal.<\/li>\n<\/ul>\n<p>Na palpação, o corpo do pênis é examinado entre o polegar e os dois primeiros dedos, procurando nódulos, endurecimentos, placas fibrosas (doença de Peyronie) e dor. Se houver queixa de corrimento, faz-se a expressão da uretra da base até a glande.<\/p>\n<aside class=\"callout block-color-gray_background\"><div><span class=\"icon\">💡<\/span><\/div><div>\n<p><strong>Sempre recolocar o prepúcio<\/strong> ao fim do exame (e da sondagem vesical), para evitar a parafimose.<\/p>\n<\/div><\/aside>\n<div class=\"caiu-slot\" data-i=\"0\"><\/div>\n\n<h2 class=\"block-color-blue_background\">Bolsa escrotal e seu conteúdo<\/h2>\n<h3>Inspeção<\/h3>\n<p>Avaliam-se a pele, o contorno, o edema, as assimetrias e as lesões, levantando o escroto para ver a face posterior. O testículo esquerdo costuma ficar mais baixo que o direito, o que é normal. O exame pode ser feito deitado e em pé; em pé, ficam mais evidentes a varicocele e a hérnia. Uma bolsa vazia sugere criptorquidia.<\/p>\n<figure class=\"image\"><img loading=\"lazy\" alt=\"\" src=\"img/bfaafbbfbbeca5b9.webp\"><\/figure>\n<h3>Palpação<\/h3>\n<ul class=\"bulleted-list\">\n<li><strong>Testículos:<\/strong> cada um entre o polegar e os dedos indicador e médio, avaliando forma, volume, consistência, superfície, nódulos e dor. O normal é firme e elástico, liso, simétrico e indolor, embora a compressão provoque uma dor visceral profunda. Uma massa firme, indolor e irregular no testículo é suspeita de tumor.<\/li>\n<li><strong>Epidídimo:<\/strong> com o testículo estabilizado, palpar cabeça, corpo e cauda na face posterior. Ele é nodular e em cordão, o que não deve ser confundido com nódulo.<\/li>\n<li><strong>Funículo espermático e deferente:<\/strong> palpar com o polegar e o indicador do epidídimo até o anel inguinal superficial. O deferente é um cordão liso e firme, diferente das veias.<\/li>\n<\/ul>\n<h3>Manobra de Valsalva e transiluminação<\/h3>\n<p>Na <strong>manobra de Valsalva<\/strong>, o paciente tosse ou faz força com a glote fechada. O aumento do funículo por veias dilatadas, com aspecto de \"saco de vermes\", sugere varicocele, mais comum à esquerda e mais evidente em pé.<\/p>\n<p>Na <strong>transiluminação<\/strong>, uma luz é colocada atrás do escroto em ambiente escuro. Uma massa cística (hidrocele, espermatocele) transmite um brilho avermelhado; tecido sólido e sangue (testículo, tumor e a maioria das hérnias) não transiluminam.<\/p>\n<figure class=\"image\"><img loading=\"lazy\" alt=\"\" src=\"img/88be195826644d36.webp\"><\/figure>\n<div class=\"tbl\"><table class=\"simple-table\"><thead><tr><th class=\"simple-table-header-color simple-table-header\">Achado<\/th><th class=\"simple-table-header-color simple-table-header\">Pista semiológica<\/th><\/tr><\/thead><tbody>\n<tr><td>Hidrocele<\/td><td>Indolor, cística, envolve o testículo e dificulta palpá-lo; transilumina; os dedos passam acima da massa e o funículo é palpável<\/td><\/tr>\n<tr><td>Hérnia inguinoescrotal<\/td><td>Os dedos não passam acima da massa; aumenta com a tosse; pode reduzir; não transilumina<\/td><\/tr>\n<tr><td>Varicocele<\/td><td>\"Saco de vermes\" no funículo, piora em pé e com Valsalva, desaparece deitado<\/td><\/tr>\n<tr><td>Tumor testicular<\/td><td>Nódulo indolor no testículo, pico entre 15 e 34 anos; não transilumina. Fatores de risco: criptorquidia, câncer contralateral, história familiar<\/td><\/tr>\n<tr><td>Epididimite<\/td><td>Epidídimo aumentado e doloroso, com febre ou sintomas urinários; elevar o testículo alivia (sinal de Prehn positivo)<\/td><\/tr>\n<tr><td>Torção testicular<\/td><td>Dor súbita e intensa, náuseas e vômitos, testículo elevado e horizontalizado, reflexo cremastérico ausente, elevação não alivia: urgência<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<div class=\"caiu-slot\" data-i=\"1\"><\/div>\n\n<h2 class=\"block-color-blue_background\">Pesquisa de hérnias inguinais e femorais<\/h2>\n<p>Segundo o Bates, a pesquisa de hérnia faz parte do exame da região inguinoescrotal e é melhor feita com o paciente em pé e o examinador sentado à frente. Primeiro, inspecionam-se as regiões inguinais pedindo que o paciente tussa. Depois, com o indicador, invagina-se a pele do escroto subindo pelo funículo até o anel inguinal superficial e pede-se nova tosse: uma protrusão contra a ponta do dedo indica hérnia. A hérnia femoral é pesquisada abaixo do ligamento inguinal, medialmente ao pulso femoral. Uma massa dolorosa, com náuseas ou vômitos, não deve ser reduzida, porque pode estar encarcerada.<\/p>\n\n<h2 class=\"block-color-blue_background\">Toque retal: indicações e limites<\/h2>\n<p>O toque retal é bem indicado em sangramento retal ou sangue nas fezes, dor anal ou perianal, alteração do hábito intestinal ou incontinência fecal, avaliação da próstata (sintomas urinários, suspeita de hiperplasia, prostatite ou câncer, PSA alterado) e avaliação neurológica (síndrome da cauda equina, lesão medular, tônus do esfíncter).<\/p>\n<p>É contraindicado diante de recusa do paciente, trauma anorretal grave com suspeita de lesão do reto, imunossupressão grave e dor intratável. Na <strong>prostatite aguda<\/strong>, a palpação deve ser extremamente delicada, sem massagem, pelo risco de bacteremia. O rastreamento do câncer de próstata não é obrigatório para todo homem assintomático: é uma decisão compartilhada, considerando idade, risco, expectativa de vida, benefícios e danos.<\/p>\n\n<h2 class=\"block-color-blue_background\">Técnica do toque retal<\/h2>\n<h3>Posição<\/h3>\n<figure class=\"image\"><img loading=\"lazy\" alt=\"\" src=\"img/4c6776ae36bab17e.webp\"><\/figure>\n<p>A posição mais usada e confortável é a de <strong>Sims<\/strong>: decúbito lateral esquerdo, com a coxa direita fletida. A posição <strong>genupeitoral<\/strong>, com joelhos e peito apoiados na maca, oferece excelente exposição, mas é menos confortável. Na mulher, o toque retal costuma ser feito em posição ginecológica, após o exame pélvico.<\/p>\n<h3>Anatomia do canal anal<\/h3>\n<p>O canal anal mede cerca de 4 cm e o reto, 12 a 15 cm. O <strong>esfíncter interno<\/strong> é de músculo liso, involuntário, e mantém o ânus fechado em repouso; o <strong>esfíncter externo<\/strong> é de músculo estriado, voluntário, e faz o controle final da defecação.<\/p>\n<h3>Inspeção perianal<\/h3>\n<p>A inspeção não é opcional. Na <strong>estática<\/strong>, com o paciente em repouso, afastam-se os glúteos procurando lesões, úlceras, condilomas, hemorroidas, fissuras, fístulas e tumorações. Na <strong>dinâmica<\/strong>, pede-se que o paciente faça força como para evacuar, procurando prolapso retal e exteriorização de hemorroidas internas.<\/p>\n<figure class=\"image\"><img loading=\"lazy\" alt=\"\" src=\"img/b21f27177ddb906a.webp\"><\/figure>\n<h3>O toque passo a passo<\/h3>\n<figure class=\"image\"><img loading=\"lazy\" alt=\"\" src=\"img/6dc7eacc9f4e367f.webp\"><\/figure>\n<ol class=\"numbered-list\">\n<li><strong>Introdução:<\/strong> avisar que haverá pressão, mas não dor. Apoiar a ponta do indicador enluvado e lubrificado sobre o ânus, esperar o esfíncter relaxar e introduzir delicadamente em direção ao umbigo.<\/li>\n<li><strong>Tônus:<\/strong> o tônus de repouso reflete o esfíncter interno; pedir uma <strong>contração voluntária<\/strong> avalia o externo. Um esfíncter frouxo sugere lesão medular sacral.<\/li>\n<li><strong>Paredes do reto:<\/strong> girar o dedo para palpar toda a circunferência, procurando pólipos, massas, nódulos e dor.<\/li>\n<li><strong>Próstata:<\/strong> girar a mão até a polpa do dedo ficar voltada para a <strong>parede anterior<\/strong> do reto, a cerca de 5 cm da borda anal. Avisar que pode dar vontade de urinar e deslizar sobre os lobos laterais e o sulco mediano.<\/li>\n<li><strong>Finalização:<\/strong> retirar o dedo, inspecionar a luva (sangue, muco, aspecto das fezes) e oferecer papel ou toalha.<\/li>\n<\/ol>\n<div class=\"caiu-slot\" data-i=\"2\"><\/div>\n\n<h2 class=\"block-color-blue_background\">A próstata ao toque<\/h2>\n<p>A próstata tem a forma de uma castanha, pesa cerca de 20 a 30 g e envolve a uretra prostática logo abaixo da bexiga. Sua face posterior repousa contra a parede anterior do reto, e é por isso que o toque funciona, sobretudo para a <strong>zona periférica<\/strong>, onde nasce a maioria dos cânceres. A zona de transição, onde cresce a hiperplasia, e a face anterior não são palpáveis.<\/p>\n<p>A próstata normal tem até cerca de 30 g (uma regra prática é estimar 10 g por polpa digital), é simétrica, de limites nítidos, superfície lisa, consistência fibroelástica (como borracha), com sulco mediano palpável e indolor.<\/p>\n<div class=\"tbl\"><table class=\"simple-table\"><thead><tr><th class=\"simple-table-header-color simple-table-header\">Condição<\/th><th class=\"simple-table-header-color simple-table-header\">Achados clássicos ao toque<\/th><\/tr><\/thead><tbody>\n<tr><td>Normal<\/td><td>Fibroelástica, lisa, simétrica, limites nítidos, sulco mediano palpável, indolor<\/td><\/tr>\n<tr><td>Prostatite aguda<\/td><td>Aumentada, amolecida, quente e muito dolorosa, com febre, disúria e dor perineal<\/td><\/tr>\n<tr><td>Hiperplasia prostática benigna (HPB)<\/td><td>Aumentada, simétrica, elástica, lisa e regular; o sulco mediano pode se apagar<\/td><\/tr>\n<tr><td>Câncer<\/td><td>Nódulo endurecido (pétreo), assimetria, limites imprecisos, superfície irregular<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<figure class=\"image\"><img loading=\"lazy\" alt=\"\" src=\"img/7ef44a857d307cbd.webp\"><\/figure>\n<aside class=\"callout block-color-gray_background\"><div><span class=\"icon\">💡<\/span><\/div><div>\n<p><strong>Toque normal não exclui HPB:<\/strong> o crescimento central, ao redor da uretra, é o que obstrui, e ele não é palpável. A intensidade dos sintomas não acompanha o tamanho da próstata ao toque.<\/p>\n<\/div><\/aside>\n<h3>Sintomas do trato urinário inferior e PSA<\/h3>\n<p>O crescimento da zona de transição comprime a uretra e aumenta a resistência ao fluxo urinário. Os sintomas se dividem em <strong>de esvaziamento<\/strong> (jato fraco, hesitação, esforço, gotejamento, sensação de esvaziamento incompleto) e <strong>de armazenamento<\/strong> (urgência, aumento da frequência, noctúria). Nem todo sintoma urinário é HPB: hiperatividade vesical, medicamentos, diabetes, infecções e doenças neurológicas também os causam.<\/p>\n<p>O PSA pode subir na HPB, na prostatite e no câncer. Toque e PSA se complementam: aumento difuso e simétrico favorece HPB, e nódulo ou endurecimento favorece câncer, mas nenhum dos dois, isoladamente, confirma o diagnóstico. Um paciente com HPB que evolui com febre, calafrios e dor perineal tem prostatite bacteriana aguda.<\/p>\n<div class=\"caiu-slot\" data-i=\"3\"><\/div>\n", "guia": {"intro": "Roteiro para o exame da genitália masculina e o toque retal: anamnese dirigida, inspeção e palpação do pênis e do escroto, pesquisa de hérnias, inspeção perianal e toque retal com avaliação da próstata.", "secoes": ["Queixa principal", "História da doença atual", "Genitália", "Regiões inguinais", "Região perianal e toque retal", "Impressão e conduta"], "fontes": "Elaborado a partir do material da Estação 2 de HM4 (slides e conferência), com base em Bickley, Bates: Propedêutica Médica, 13. ed., caps. Genitália masculina e Ânus, reto e próstata; Martins, Semiologia Clínica (2021); e Porto, Semiologia Médica, 9. ed.", "etapas": [{"titulo": "Antes de começar", "itens": [["Higienizar as mãos, apresentar-se e identificar o paciente", "Ambiente reservado e temperatura agradável.", null], ["Explicar o exame, pedir consentimento e oferecer acompanhante", "Avisar o que será tocado e por quê. Postura sem julgamentos.", null], ["Calçar luvas", "Luvas para todo o exame genital e para o toque.", null]]}, {"titulo": "Anamnese dirigida", "itens": [["Identificar a queixa principal", "Sintomas urinários, corrimento, lesão genital, dor ou aumento escrotal, infertilidade.", {"s": "Queixa principal", "n": "Avaliação de rotina, sem queixas geniturinárias.", "a": [["Sintomas urinários", "Jato fraco, hesitação e noctúria há ___."], ["Escroto", "Aumento de volume escrotal ___ (direito / esquerdo) há ___."], ["Corrimento", "Corrimento uretral há ___."]]}], ["Sintomas do trato urinário inferior", "Esvaziamento (jato fraco, hesitação, gotejamento, esvaziamento incompleto) e armazenamento (urgência, frequência, noctúria). Hematúria, febre.", {"s": "História da doença atual", "n": "Nega sintomas urinários, hematúria e febre.", "a": [["Obstrutivos", "Refere jato fraco, hesitação, sensação de esvaziamento incompleto e noctúria (___ vezes por noite) há ___. Nega febre e hematúria."], ["Irritativos", "Refere disúria, polaciúria e urgência há ___."]]}], ["Sintomas genitais e sexuais", "Lesões, corrimento, dor escrotal (início súbito ou gradual), parcerias, uso de preservativo, IST prévias.", {"s": "História da doença atual", "n": "Nega lesões genitais, corrimento uretral e dor escrotal. Uso regular de preservativo.", "a": [["Dor súbita", "Dor escrotal súbita e intensa à ___ há ___ horas, com náuseas e vômitos."]]}]]}, {"titulo": "Pênis", "itens": [["Inspecionar pele, pelos e raiz do pênis", "Distribuição pilosa, lesões, parasitas e sinais flogísticos.", {"s": "Genitália", "n": "Pilificação de padrão masculino adulto, pele do pênis sem lesões.", "a": [["Lesão", "Lesão ___ (úlcera / vesículas / verrucosa) em ___, ___ (dolorosa / indolor)."]]}], ["Retrair o prepúcio e examinar glande e sulco", "Fimose, parafimose, balanite, lesões. Glândulas de Tyson são normais.", {"s": "Genitália", "n": "Prepúcio retrátil, glande e sulco balanoprepucial sem lesões.", "a": [["Fimose", "Prepúcio não retrátil (fimose)."], ["Parafimose", "Prepúcio retraído e garroteando a glande, com edema importante (parafimose)."], ["Balanopostite", "Hiperemia e edema de glande e prepúcio."]]}], ["Abrir o meato uretral", "Compressão suave entre polegar e indicador: posição, secreção.", {"s": "Genitália", "n": "Meato uretral tópico, sem secreção.", "a": ["Secreção uretral ___ (purulenta / mucoide).", "Meato em posição ___ (ventral / dorsal)."]}], ["Palpar o corpo do pênis e recolocar o prepúcio", "Nódulos, placas fibrosas, dor. Sempre devolver o prepúcio à posição.", {"s": "Genitália", "n": "Corpo do pênis sem nódulos ou placas palpáveis.", "a": ["Placa fibrosa palpável em ___ do corpo do pênis."]}]]}, {"titulo": "Bolsa escrotal", "itens": [["Inspecionar a bolsa, inclusive a face posterior", "Pele, contorno, simetria, edema, bolsa vazia.", {"s": "Genitália", "n": "Bolsa escrotal simétrica, pele sem lesões.", "a": [["Aumento", "Aumento de volume em hemibolsa ___ (direita / esquerda)."], ["Bolsa vazia", "Hemibolsa ___ vazia (testículo não palpável)."]]}], ["Palpar os testículos", "Entre polegar, indicador e médio: tamanho, consistência, superfície, nódulos e dor.", {"s": "Genitália", "n": "Testículos tópicos, de volume adulto (cerca de ___ mL), lisos, fibroelásticos e indolores.", "a": [["Nódulo", "Nódulo endurecido e indolor no testículo ___ (direito / esquerdo), de ___ cm."], ["Doloroso", "Testículo ___ doloroso, ___ (elevado e horizontalizado / em posição habitual)."]]}], ["Palpar epidídimos e funículos", "Epidídimo na face posterior; deferente como cordão liso e firme até o anel inguinal.", {"s": "Genitália", "n": "Epidídimos e funículos espermáticos sem alterações.", "a": ["Epidídimo ___ aumentado e doloroso."]}], ["Manobra de Valsalva e transiluminação, se houver aumento", "Varicocele aumenta com Valsalva; massa cística transilumina.", {"s": "Genitália", "n": "Sem varicocele à manobra de Valsalva.", "a": [["Varicocele", "Dilatação venosa no funículo ___ em ortostase, aumentando com Valsalva (varicocele)."], ["Hidrocele", "Massa cística envolvendo o testículo ___, com transiluminação positiva e funículo palpável acima dela (hidrocele)."]]}]]}, {"titulo": "Regiões inguinais", "itens": [["Inspecionar com o paciente em pé, pedindo para tossir", "Procurar abaulamentos e assimetria.", null], ["Palpar o anel inguinal superficial e a região femoral", "Invaginar o escroto com o indicador até o anel e pedir tosse.", {"s": "Regiões inguinais", "n": "Regiões inguinais e femorais sem hérnias à manobra de tosse.", "a": ["Hérnia inguinal ___ (direita / esquerda), ___ (redutível / irredutível)."]}]]}, {"titulo": "Região perianal e toque retal", "itens": [["Posicionar em Sims ou genupeitoral", "Sims: decúbito lateral esquerdo com a coxa direita fletida.", null], ["Inspeção perianal estática e dinâmica", "Repouso e depois esforço evacuatório: fissuras, hemorroidas, fístulas, condilomas, prolapso.", {"s": "Região perianal e toque retal", "n": "Região perianal sem lesões, fissuras ou hemorroidas, sem prolapso ao esforço.", "a": [["Hemorroidas", "Hemorroidas ___ (externas / internas exteriorizadas ao esforço)."], ["Fissura", "Fissura anal em ___."]]}], ["Introduzir o indicador lubrificado e avaliar o tônus", "Esperar o esfíncter relaxar; pedir contração voluntária para o esfíncter externo.", {"s": "Região perianal e toque retal", "n": "Esfíncter anal normotônico, com contração voluntária preservada.", "a": ["Esfíncter ___ (hipotônico / hipertônico)."]}], ["Palpar as paredes do reto", "Girar o dedo em toda a circunferência: massas, pólipos, dor.", {"s": "Região perianal e toque retal", "n": "Ampola retal ___ (com fezes / vazia), sem massas palpáveis.", "a": ["Massa palpável em parede ___ do reto, a ___ cm da borda anal."]}], ["Palpar a próstata com a polpa voltada para a parede anterior", "Tamanho, forma, limites, superfície, consistência, sulco mediano e dor.", {"s": "Região perianal e toque retal", "n": "Próstata de cerca de ___ g, lisa, fibroelástica, simétrica, de limites nítidos, sulco mediano palpável, indolor.", "a": [["HPB", "Próstata aumentada (cerca de ___ g), elástica, lisa, simétrica, com sulco mediano apagado, indolor."], ["Nódulo", "Nódulo endurecido de ___ cm em lobo ___ da próstata, com limites imprecisos."], ["Dolorosa", "Próstata aumentada, amolecida, quente e muito dolorosa."]]}], ["Retirar e inspecionar a luva", "Sangue, muco, aspecto das fezes. Oferecer papel.", {"s": "Região perianal e toque retal", "n": "Luva sem sangue.", "a": ["Luva com ___ (sangue vivo / melena / muco)."]}]]}, {"titulo": "Fechamento", "itens": [["Explicar os achados e definir a conduta", "Sem alterações ou investigação dirigida (PSA, ultrassonografia, urologia, testes para IST).", {"s": "Impressão e conduta", "n": "Exame genital e toque retal sem alterações.", "a": [["Achado", "Achado de ___. Solicitado ___ e orientado retorno."]]}]]}, {"titulo": "Sinais de alerta", "alerta": true, "itens": [["Dor escrotal súbita com testículo elevado e cremastérico ausente", "Torção testicular: urgência, sem esperar exames."], ["Prepúcio retraído que não volta, com edema da glande", "Parafimose: urgência."], ["Nódulo indolor no testículo", "Suspeita de tumor testicular."], ["Próstata com nódulo pétreo ou assimétrica", "Suspeita de câncer de próstata."], ["Febre, dor perineal e próstata muito dolorosa", "Prostatite aguda: não massagear."], ["Hérnia dolorosa e irredutível, com vômitos", "Encarceramento: não tentar reduzir."]]}, {"titulo": "Registro (exemplo de exame normal)", "registro": "Genitália: pilificação adulta, pênis sem lesões, prepúcio retrátil, glande e meato tópico sem secreção; bolsa escrotal simétrica, testículos tópicos de volume adulto, lisos, fibroelásticos e indolores; epidídimos e funículos sem alterações; sem varicocele à manobra de Valsalva. Regiões inguinais sem hérnias. Região perianal sem lesões; toque retal com esfíncter normotônico, ampola com fezes e sem massas; próstata de cerca de 20 g, lisa, fibroelástica, simétrica, de limites nítidos, sulco mediano palpável e indolor. Luva sem sangue.", "itens": []}]}, "caiu": [{"tag": "UNP Salgado Filho · 2026.2 · Questão 20", "s": "Um paciente do sexo masculino, de 28 anos, comparece à Unidade Básica de Saúde queixando-se de dor intensa e inchaço na região da glande. Relata que, durante o banho, retraiu a pele do pênis para higienização e, em seguida, não conseguiu retorná-la à posição habitual. Ao exame físico da genitália, o médico observa edema marcante da glande provocado por um anel prepucial estreito retraído e posicionado no sulco balanoprepucial, promovendo estrangulamento local. Com base na semiotécnica peniana descrita no material de estudo, assinale a alternativa com o diagnóstico semiológico correto para essa alteração:", "o": ["Parafimose", "Hipospádia", "Balanopostite", "Fimose"], "c": 0, "why": "Na parafimose, o prepúcio foi retraído e não consegue voltar, formando um anel que garroteia a glande e causa edema: é uma urgência. Na fimose acontece o contrário, o anel estreito impede expor a glande. Por isso, ao fim do exame e da sondagem, o prepúcio sempre é recolocado."}, {"tag": "UNP Salgado Filho · 2026.2 · Questão 13", "s": "Homem, 52 anos, relata aumento progressivo e indolor do escroto direito há 8 meses, sem relação com esforço. No exame em ortostatismo, há uma massa indolor, de consistência cística, que envolve o testículo e dificulta sua palpação isolada. O examinador consegue posicionar os dedos acima da massa e palpa o funículo espermático, que tem aspecto normal. A massa não se altera com a manobra de Valsalva nem com o decúbito dorsal, e a transiluminação é positiva. Qual alternativa apresenta a hipótese e o achado semiológico que melhor a sustenta?", "o": ["Varicocele – o volume que não se altera com o decúbito, característico da dilatação do plexo pampiniforme.", "Hérnia inguinoescrotal indireta – o conteúdo intestinal com gás, que explica a transiluminação positiva.", "Tumor testicular – a massa indolor que envolve o testículo e impede sua palpação isolada.", "Hidrocele – a palpação acima da massa, associada à transiluminação positiva."], "c": 3, "why": "Hidrocele é líquido na túnica vaginal: massa cística e indolor que envolve o testículo, transilumina e permite que os dedos passem acima dela, palpando o funículo normal. Na hérnia, os dedos não passam acima da massa; a varicocele muda com o decúbito e com Valsalva; o tumor é sólido e não transilumina."}, {"tag": "UNP Salgado Filho · 2025.2 · Questão 19", "s": "Durante o exame físico, o toque retal é um procedimento fundamental para avaliação da ampola retal, próstata e estruturas adjacentes. Sobre a semiotécnica correta do toque retal, qual das alternativas descreve adequadamente a conduta recomendada?", "o": ["O toque retal não permite a avaliação de estruturas como hemorroidas ou pólipos.", "A palpação deve ser realizada introduzindo o segundo quirodáctilo e avaliando apenas a parede posterior do reto.", "O exame deve ser realizado com a polpa digital voltada para a face posterior do paciente, pois isso aumenta a sensibilidade tátil, e a rotação do quirodáctilo durante a palpação deve ser evitada para não reduzir a precisão do exame.", "O tônus dos esfíncteres anais pode ser avaliado solicitando ao paciente que realize uma contração voluntária durante o exame."], "c": 3, "why": "O tônus de repouso reflete o esfíncter interno, e a contração voluntária pedida durante o toque avalia o esfíncter externo. A polpa do dedo fica voltada para a parede anterior para palpar a próstata, e o toque também avalia hemorroidas, pólipos e massas."}, {"tag": "UNP Salgado Filho · 2026.2 · Questão 14", "s": "Homem, 67 anos, apresenta há 1 ano jato urinário fraco, hesitação, sensação de esvaziamento incompleto e noctúria (3 vezes por noite). Nega febre, hematúria ou dor. Ao toque retal (posição de Sims), o esfíncter está normotônico. Com a polpa digital voltada para a parede anterior do reto, a cerca de 5 cm da borda anal, palpa-se uma próstata de cerca de três polpas digitais (~30 g), simétrica, fibroelástica, lisa, com limites nítidos, sulco mediano preservado e indolor. Considerando a anatomia prostática e os limites do toque retal, qual interpretação está correta?", "o": ["A discordância sugere falha técnica, pois a próstata deveria ser palpada com a polpa voltada para a parede posterior (sacral) do reto.", "A avaliação fica incompleta sem manobra de Valsalva durante o toque, pois ela torna o lobo mediano palpável pela parede anterior do reto.", "O exame não exclui HPB, pois só a face posterior da glândula é palpável, e o crescimento central/anterior que obstrui a uretra não é detectável.", "O exame afasta HPB, pois nela a glândula costuma apresentar- se com volume preservado e com sulco mediano obliterado; deve-se buscar causa extraprostática."], "c": 2, "why": "O toque só alcança a face posterior da próstata (zona periférica). A hiperplasia cresce na zona de transição, ao redor da uretra, e é esse crescimento central que obstrui. Por isso, uma próstata normal ao toque não exclui HPB, e a intensidade dos sintomas não acompanha o tamanho palpado."}], "videos": [{"id": "1yCVruRtkrgvb8jg_l0mdaAodlkWniAor", "nome": "Exame genital masculino", "teoria": "Inspeção e palpação do pênis", "guia": "Pênis"}]}, {"id": "paciente-360", "nome": "Paciente 360", "resumo": "Consulta em SOAP: nódulo mamário, lesão no colo, endometriose, sangramento uterino e miomas, climatério e outras queixas geniturinárias.", "teoria": "<p>A estação Paciente 360 leva a semiologia para dentro de casos clínicos completos. Cada caso percorre anamnese, exame físico, avaliação e plano, e o objetivo é usar a técnica aprendida nas outras estações para chegar a uma hipótese e a uma conduta, sem esquecer a pessoa por trás da queixa.<\/p>\n<p>Os cinco casos do módulo são Vânia (44 anos, nódulo mamário), Talita (35 anos, lesão no colo), Daniela (34 anos, endometriose), Valéria (35 anos, sangramento uterino anormal por miomas) e Lúcia (49 anos, síndrome climatérica). As provas também cobram outras queixas geniturinárias frequentes, que estão reunidas no fim deste texto.<\/p>\n\n<h2 class=\"block-color-orange_background\">Como a estação funciona: SOAP e cuidado centrado na pessoa<\/h2>\n<p>Cada caso é registrado no modelo <strong>SOAP<\/strong>:<\/p>\n<ul class=\"bulleted-list\">\n<li><strong>Subjetivo:<\/strong> a queixa, a história, os fatores de risco e o que a paciente sente e teme.<\/li>\n<li><strong>Objetivo:<\/strong> os achados do exame físico e dos exames disponíveis.<\/li>\n<li><strong>Avaliação:<\/strong> a hipótese diagnóstica e o raciocínio que a sustenta.<\/li>\n<li><strong>Plano:<\/strong> exames, tratamento medicamentoso e não medicamentoso, orientações e seguimento.<\/li>\n<\/ul>\n<p>O primeiro componente do Método Clínico Centrado na Pessoa é explorar a <strong>experiência da doença<\/strong>: medos, expectativas, significados e impacto na vida. Acolher não é pedir exames indiscriminadamente, e rotular a paciente como \"ansiosa\" faz perder uma parte essencial da consulta.<\/p>\n\n<h2 class=\"block-color-orange_background\">Vânia: nódulo mamário<\/h2>\n<h3>Anamnese e fatores de risco<\/h3>\n<p>Diante de um nódulo, a anamnese precisa esclarecer o contexto hormonal (ciclo, gestação, lactação, perimenopausa, uso de hormônios), as características do nódulo (quando surgiu, onde, se cresce, se dói, se muda com o ciclo), sinais associados (secreção mamilar, alterações da pele e do mamilo) e antecedentes (trauma, cirurgia, biópsia, exames anteriores).<\/p>\n<p>Os fatores de risco para câncer de mama se agrupam em genéticos (mutações BRCA1 e BRCA2, síndrome de Li-Fraumeni), familiares (câncer de mama ou de ovário em parentes), pessoais (câncer prévio, hiperplasia atípica, carcinoma in situ, mama densa), reprodutivos e hormonais (menarca precoce, menopausa tardia, nuliparidade ou primeira gestação após os 30 anos) e ambientais (álcool, tabaco, sedentarismo, radiação ionizante, obesidade após a menopausa).<\/p>\n<h3>Exame e sinais suspeitos<\/h3>\n<p>O exame segue a sequência do exame das mamas, terminando com a descrição completa do nódulo. Sugerem benignidade o nódulo móvel, regular, bem delimitado, fibroelástico ou cístico. Aumentam a suspeita o nódulo endurecido, irregular, fixo ou em crescimento, a retração da pele ou do mamilo, a pele em casca de laranja, a secreção sanguinolenta e os linfonodos endurecidos.<\/p>\n<figure class=\"image\"><img loading=\"lazy\" alt=\"\" src=\"img/6bfb2676ecab90e7.webp\"><\/figure>\n<p>Na menacme, uma nodularidade pouco definida pode ser reavaliada após um ciclo, de preferência uma semana depois da menstruação; se persistir, solicita-se imagem. A investigação de um nódulo segue a <strong>avaliação tripla<\/strong>: clínica, imagem e, quando indicada, amostragem de tecido. A concordância entre as três é o que dá segurança à conduta.<\/p>\n<div class=\"tbl\"><table class=\"simple-table\"><thead><tr><th class=\"simple-table-header-color simple-table-header\">Idade<\/th><th class=\"simple-table-header-color simple-table-header\">Imagem inicial do nódulo palpável<\/th><\/tr><\/thead><tbody>\n<tr><td>Abaixo de 30 anos<\/td><td>Ultrassonografia direcionada<\/td><\/tr>\n<tr><td>30 a 39 anos<\/td><td>Ultrassonografia, mamografia diagnóstica ou tomossíntese, conforme o risco<\/td><\/tr>\n<tr><td>40 anos ou mais<\/td><td>Mamografia diagnóstica ou tomossíntese, com ultrassonografia se necessário<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h3>BI-RADS e diagnósticos diferenciais<\/h3>\n<p>O BI-RADS é a linguagem do laudo de imagem e orienta a conduta, mas não é diagnóstico histológico. A regra de bolso é: categoria 0, completar a avaliação; 1 e 2, rotina; 3, controle em curto intervalo (6 meses); 4 e 5, biópsia; 6, malignidade já comprovada. Um BI-RADS 1 ou 2 não encerra a investigação de um nódulo clinicamente suspeito.<\/p>\n<figure class=\"image\"><img loading=\"lazy\" alt=\"\" src=\"img/07a6f20720dda0cf.webp\"><\/figure>\n<p>A idade ajuda a pensar nos diferenciais: o fibroadenoma predomina em jovens, os cistos entre 35 e 50 anos e o câncer aumenta após os 40 a 50 anos. O tumor phyllodes lembra um fibroadenoma, mas cresce rápido e deforma a mama.<\/p>\n\n<h2 class=\"block-color-orange_background\">Talita: lesão no colo do útero<\/h2>\n<p>Talita veio \"só de rotina\" e, ao exame especular, tinha uma lesão vegetante, friável e vascularizada de cerca de 2 cm no colo. Esse caso ensina a regra mais importante do colo: <strong>lesão visível não é rastreamento<\/strong>. A prioridade é a confirmação histológica, com colposcopia e biópsia, e o encaminhamento para a ginecologia oncológica. A citologia não deve atrasar a investigação, e uma citologia negativa não a encerra.<\/p>\n<p>A persistência do HPV de alto risco está presente em quase todos os casos de câncer do colo, e os tipos 16 e 18 respondem pela maior parte. Tabagismo e imunossupressão aumentam o risco. A doença pode se apresentar com sangramento após a relação (sinusorragia), sangramento irregular, corrimento persistente e dor pélvica; na doença avançada, pode haver hidronefrose.<\/p>\n<p>Depois da confirmação, o estadiamento FIGO define o tratamento. Uma lesão restrita ao colo, entre 2 e 4 cm e sem linfonodos, como a de Talita, é estádio IB2. A comunicação segue o protocolo SPIKES: explicar que a alteração pode ser um câncer, mas que é preciso analisar um fragmento para confirmar, sem garantir benignidade nem antecipar o diagnóstico.<\/p>\n\n<h2 class=\"block-color-orange_background\">Daniela: endometriose<\/h2>\n<p>A endometriose é uma doença inflamatória crônica e dependente de estrogênio, em que um tecido semelhante ao endométrio cresce fora do útero. Atinge cerca de 5 a 10% das mulheres em idade reprodutiva, e a intensidade da dor não acompanha a extensão da doença.<\/p>\n<p>A suspeita se baseia na anamnese: <strong>dismenorreia progressiva<\/strong>, dor pélvica, dispareunia profunda, dor para evacuar ou urinar e sangramento intestinal ou urinário durante a menstruação, além de infertilidade. É importante investigar o impacto no trabalho, na sexualidade, no sono e no humor.<\/p>\n<p>No exame, o toque bimanual pode encontrar útero retrovertido e pouco móvel (por aderências), massa anexial dolorosa (endometrioma) e nódulos dolorosos nos ligamentos uterossacros e no fundo de saco. Segundo o Bates, o desvio lateral do colo sugere acometimento dos uterossacros. Um exame normal, porém, não exclui a doença, sobretudo a superficial.<\/p>\n<p>A ultrassonografia transvaginal feita por examinador treinado é o exame inicial, e a ressonância fica para casos inconclusivos ou planejamento cirúrgico. O CA-125 não confirma nem exclui. O tratamento clínico usa analgésicos e anti-inflamatórios, anticoncepcionais combinados e progestagênios; o tratamento hormonal controla os sintomas, mas não melhora a fertilidade.<\/p>\n<div class=\"caiu-slot\" data-i=\"0\"><\/div>\n\n<h2 class=\"block-color-orange_background\">Valéria: sangramento uterino anormal e miomas<\/h2>\n<p>Sangramento uterino anormal é qualquer alteração de frequência, regularidade, duração ou volume da menstruação. A abordagem começa sempre do mesmo jeito: <strong>excluir gestação<\/strong> e avaliar estabilidade hemodinâmica e anemia. Só depois se classifica a causa pelo sistema <strong>PALM-COEIN<\/strong>.<\/p>\n<figure class=\"image\"><img loading=\"lazy\" alt=\"\" src=\"img/11aace65ac8243b6.webp\"><\/figure>\n<p>O grupo PALM reúne as causas estruturais (pólipo, adenomiose, leiomioma, malignidade e hiperplasia), e o COEIN as não estruturais (coagulopatia, disfunção ovulatória, causa endometrial, iatrogênica e não classificada). Ver um mioma na ultrassonografia não prova que ele seja a causa do sangramento.<\/p>\n<p>Os leiomiomas são tumores benignos do miométrio, dependentes de hormônios, mais comuns com história familiar, ancestralidade negra, obesidade e menarca precoce. No exame, pode haver palidez e um útero aumentado, irregular e bocelado. Os exames iniciais são beta-hCG, hemograma, ferritina e ultrassonografia transvaginal; a amostragem do endométrio é indicada a partir dos 45 anos.<\/p>\n<h3>Classificação FIGO dos miomas<\/h3>\n<p>A localização do mioma importa mais do que o tamanho. Os <strong>submucosos (FIGO 0 a 2)<\/strong> causam sangramento intenso e prejudicam a fertilidade mesmo quando pequenos; os intramurais (3 e 4) causam sangramento e aumento uterino; os subserosos (5 a 7) causam sintomas de volume e compressão.<\/p>\n<figure class=\"image\"><img loading=\"lazy\" alt=\"\" src=\"img/5624049f2db8a9be.webp\"><\/figure>\n<p>O tratamento clínico (ácido tranexâmico, anti-inflamatórios, anticoncepcionais, progestagênios, DIU hormonal) controla o sangramento, mas não reduz o mioma. A miomectomia é indicada para quem deseja engravidar (histeroscópica nos FIGO 0 a 2), e a histerectomia ou a embolização para quem já tem a prole definida. A anemia sempre precisa ser tratada.<\/p>\n<div class=\"caiu-slot\" data-i=\"1\"><\/div>\n\n<h2 class=\"block-color-orange_background\">Lúcia: síndrome climatérica<\/h2>\n<p>O climatério é a transição da fase reprodutiva para a não reprodutiva, entre cerca de 40 e 65 anos. A <strong>menopausa<\/strong> é a última menstruação, e seu diagnóstico é retrospectivo, após 12 meses consecutivos de amenorreia. A perimenopausa é o período de irregularidade menstrual e sintomas que antecede e acompanha a menopausa. Menopausa antes dos 40 anos exige investigar insuficiência ovariana prematura.<\/p>\n<figure class=\"image\"><img loading=\"lazy\" alt=\"\" src=\"img/db18e9d9ccd964b5.webp\"><\/figure>\n<p>Em mulheres com 45 anos ou mais, irregularidade menstrual e sintomas típicos, o diagnóstico é clínico, e o FSH não é recomendado de rotina, porque oscila muito nessa fase. Os fogachos acontecem porque a queda do estrogênio ativa neurônios hipotalâmicos (KNDy) e estreita a zona termoneutra. Os diagnósticos diferenciais incluem gravidez, doenças da tireoide, anemia, ansiedade, depressão e medicamentos. Sangramento após 12 meses de amenorreia exige investigação do endométrio.<\/p>\n<p>A terapia hormonal é o tratamento mais eficaz dos fogachos moderados a intensos, desde que não haja contraindicação. Mulheres com útero usam estrogênio associado a progestagênio, para proteger o endométrio; as histerectomizadas usam estrogênio isolado. As contraindicações incluem sangramento sem diagnóstico, câncer de mama, tromboembolismo, doença coronariana, AVC e doença hepática ativa. Nesses casos, as opções não hormonais são antidepressivos (venlafaxina, desvenlafaxina, paroxetina, escitalopram), gabapentina e fezolinetanto. Queixas geniturinárias isoladas respondem a lubrificantes, hidratantes e estrogênio vaginal em baixa dose.<\/p>\n\n<h2 class=\"block-color-orange_background\">Outras queixas geniturinárias que caem na prova<\/h2>\n<h3>Infecção do trato urinário<\/h3>\n<p>A <strong>cistite<\/strong> causa disúria, aumento da frequência, urgência e dor suprapúbica, sem febre. A <strong>pielonefrite<\/strong> acrescenta febre, calafrios, dor lombar, náuseas e vômitos, e o sinal de Giordano (dor à punho-percussão lombar) costuma ser positivo. Segundo o Martins, esse sinal é sensível, mas pouco específico, porque também aparece na litíase e em dores musculares. Cistite não complicada em mulher não gestante é tratada ambulatorialmente; pielonefrite sem sinais de gravidade também pode ser, mas sepse, vômitos, gestação ou obstrução indicam internação. Bacteriúria assintomática fora da gestação não é tratada.<\/p>\n<div class=\"caiu-slot\" data-i=\"2\"><\/div>\n<h3>Litíase urinária<\/h3>\n<p>A cólica renal é uma dor súbita e intensa no flanco, em cólica, sem posição de alívio (o paciente fica inquieto), que irradia para a virilha e os genitais, com náuseas e hematúria. A tomografia sem contraste é o exame padrão. Cálculos ureterais distais pequenos, sem infecção, podem ser tratados com terapia expulsiva. Febre com obstrução, anúria ou rim único indicam desobstrução de urgência.<\/p>\n<h3>Uretrite e úlceras genitais<\/h3>\n<p>A uretrite gonocócica tem início agudo, com secreção purulenta e abundante; a não gonocócica (clamídia), secreção escassa e mucoide. O fator de risco mais relevante é ter múltiplas parcerias recentes com uso eventual de preservativo. As parcerias dos últimos 60 dias devem ser avaliadas e tratadas, e o paciente deve ser testado para HIV, sífilis e hepatites.<\/p>\n<p>Entre as úlceras genitais, a <strong>sífilis primária<\/strong> tem úlcera geralmente única, indolor, de base limpa e bordas endurecidas, com linfonodos inguinais indolores. O <strong>herpes<\/strong> tem vesículas agrupadas e dolorosas que ulceram e recorrem. O <strong>cancro mole<\/strong> tem úlceras múltiplas, dolorosas e de base suja. O linfogranuloma venéreo tem uma lesão inicial fugaz seguida de bubão inguinal doloroso.<\/p>\n<h3>Doença inflamatória pélvica (DIP)<\/h3>\n<p>É a infecção ascendente do trato genital superior, geralmente por gonococo, clamídia e anaeróbios. O diagnóstico clínico usa os critérios maiores (dor no hipogástrio, dor à palpação dos anexos e dor à mobilização do colo) e menores (febre, secreção endocervical anormal, leucocitose, provas inflamatórias elevadas, entre outros). O toque bimanual é o exame-chave, e o beta-hCG é obrigatório, porque a dor à mobilização também ocorre na gravidez ectópica. O tratamento é empírico e cobre gonococo, clamídia e anaeróbios.<\/p>\n<h3>Endocrinologia ginecológica e planejamento reprodutivo<\/h3>\n<p>A <strong>síndrome dos ovários policísticos<\/strong> é diagnosticada pelos critérios de Rotterdam (dois de três): anovulação, hiperandrogenismo clínico ou laboratorial e ovários policísticos à ultrassonografia, depois de excluir gestação, doença tireoidiana, hiperprolactinemia e hiperplasia adrenal. O hirsutismo é quantificado pelo escore de Ferriman-Gallwey. Na amenorreia secundária, a primeira causa a excluir é a gestação, seguida de TSH e prolactina.<\/p>\n<p>A contracepção de emergência com levonorgestrel é mais eficaz quanto mais cedo for usada, idealmente em até 72 horas, e não é abortiva. A laqueadura, pela Lei 14.443/2022, exige capacidade civil plena e idade acima de 21 anos ou pelo menos dois filhos vivos, com prazo mínimo de 60 dias entre a manifestação da vontade e a cirurgia, sem necessidade de consentimento do cônjuge.<\/p>\n<div class=\"caiu-slot\" data-i=\"3\"><\/div>\n", "guia": {"intro": "Roteiro para a consulta ginecológica no modelo SOAP, como na estação Paciente 360: acolher a experiência da paciente, colher a história dirigida, examinar, formular a avaliação e montar o plano.", "secoes": ["Subjetivo", "Antecedentes", "Objetivo", "Avaliação", "Plano"], "fontes": "Elaborado a partir do material da Estação 3 de HM4 (roteiros Paciente 360 e conferência de fechamento), com base em Bickley, Bates: Propedêutica Médica, 13. ed.; Martins, Semiologia Clínica (2021); Porto, Semiologia Médica, 9. ed.; protocolos do Ministério da Saúde e TelessaúdeRS.", "etapas": [{"titulo": "Acolhimento", "itens": [["Apresentar-se e identificar a paciente", "Nome completo e mais um dado.", null], ["Explorar a experiência da doença", "Perguntar o que ela pensa que tem, o que teme, o que espera da consulta e como a queixa afeta sua vida.", {"s": "Subjetivo", "n": "Refere preocupação com ___ e espera ___ da consulta."}]]}, {"titulo": "Subjetivo: a queixa", "itens": [["Caracterizar a queixa principal", "Início, duração, evolução, fatores de melhora e piora, relação com o ciclo.", {"s": "Subjetivo", "n": "Queixa de ___ há ___.", "a": [["Nódulo mamário", "Percebeu nódulo em mama ___ há ___, com crescimento ___, ___ (indolor / doloroso), sem secreção mamilar."], ["Sangramento", "Aumento do volume menstrual há ___, com coágulos e cansaço."], ["Dor pélvica", "Dismenorreia progressiva há ___, com dispareunia profunda e dor para evacuar no período menstrual."], ["Fogachos", "Ondas de calor há ___, com sudorese noturna, insônia e irregularidade menstrual."]]}], ["Pesquisar sintomas associados e sinais de alarme", "Sangramento pós-coital, febre, perda de peso, secreção mamilar sanguinolenta, sintomas urinários ou intestinais.", {"s": "Subjetivo", "n": "Nega febre, perda de peso, sangramento pós-coital e sintomas urinários ou intestinais.", "a": ["Refere também ___."]}]]}, {"titulo": "Antecedentes e fatores de risco", "itens": [["Antecedentes ginecológicos e obstétricos", "Menarca, ciclo, DUM, G P A, contracepção, último preventivo e mamografia.", {"s": "Antecedentes", "n": "Menarca aos ___ anos, ciclos ___, DUM: ___. G___P___A___. Em uso de ___. Último preventivo em ___ e última mamografia em ___."}], ["Fatores de risco relevantes para a queixa", "História familiar de câncer de mama ou ovário, tabagismo, imunossupressão, uso de hormônios, tromboembolismo prévio.", {"s": "Antecedentes", "n": "Nega história familiar de câncer, tabagismo e tromboembolismo.", "a": [["Familiar", "___ (mãe / irmã) com câncer de ___ aos ___ anos."], ["Tromboembolismo", "Trombose venosa profunda há ___ anos."]]}]]}, {"titulo": "Objetivo: exame físico", "itens": [["Exame geral e sinais vitais", "Estado geral, palidez, PA, FC, IMC.", {"s": "Objetivo", "n": "Bom estado geral, corada, PA ___ mmHg, FC ___ bpm, IMC ___ kg/m².", "a": ["Descorada ___/4+, PA ___ mmHg, FC ___ bpm."]}], ["Exame dirigido à queixa", "Mamas, exame especular, toque bimanual ou abdome, conforme o caso.", {"s": "Objetivo", "n": "Exame ___ sem alterações.", "a": [["Mama", "Nódulo em mama ___, às ___ horas, de ___ cm, ___ (endurecido / fibroelástico), ___ (móvel / fixo)."], ["Colo", "Ao especular, lesão ___ (vegetante / friável) no colo, de ___ cm."], ["Útero", "Útero aumentado, compatível com ___ semanas, irregular, móvel e indolor."], ["Endometriose", "Útero retrovertido e pouco móvel, nodularidade dolorosa em fundo de saco posterior."]]}]]}, {"titulo": "Avaliação", "itens": [["Formular a hipótese diagnóstica", "Relacionar os achados à hipótese e citar os principais diferenciais.", {"s": "Avaliação", "n": "Hipótese diagnóstica: ___. Diferenciais: ___."}]]}, {"titulo": "Plano", "itens": [["Exames complementares", "Imagem conforme a idade, beta-hCG no sangramento, colposcopia na lesão de colo, hemograma e ferritina.", {"s": "Plano", "n": "Solicitado(s): ___."}], ["Tratamento e medidas não medicamentosas", "Com referência a diretriz ou protocolo.", {"s": "Plano", "n": "Prescrito(s): ___. Orientado(s): ___."}], ["Comunicação e seguimento", "Explicar a hipótese sem antecipar diagnóstico, checar compreensão, combinar retorno.", {"s": "Plano", "n": "Explicada a hipótese e os próximos passos; retorno em ___."}]]}, {"titulo": "Sinais de alerta", "alerta": true, "itens": [["Nódulo mamário endurecido, fixo ou com retração", "Investigação diagnóstica em qualquer idade."], ["Lesão visível no colo", "Colposcopia e biópsia, não rastreamento."], ["Sangramento com instabilidade ou anemia grave", "Estabilizar antes de investigar a causa."], ["Dor pélvica com febre, irritação peritoneal ou beta-hCG positivo", "Afastar DIP grave, gravidez ectópica, torção e cisto roto."], ["Sangramento após 12 meses de amenorreia", "Investigar o endométrio."]]}, {"titulo": "Registro (exemplo de SOAP)", "registro": "S: Mulher de 35 anos com aumento do volume menstrual há 8 meses, com coágulos e cansaço; preocupada com a possibilidade de câncer. Ciclos regulares, DUM há 10 dias, G2P2A0, sem desejo de nova gestação. O: Descorada 1+/4+, PA 110 x 70 mmHg, FC 92 bpm. Útero aumentado, compatível com 12 semanas, irregular, móvel e indolor. A: Sangramento uterino anormal, provável leiomioma (PALM), com anemia a confirmar. P: Beta-hCG, hemograma, ferritina e ultrassonografia transvaginal; ácido tranexâmico nos dias de maior fluxo; explicadas as opções de tratamento e retorno com exames.", "itens": []}]}, "caiu": [{"tag": "UNP Salgado Filho · 2026.2 · Questão 11", "s": "Uma mulher de 31 anos procura atendimento por apresentar dor pélvica recorrente há três anos. Relata que a dor piora progressivamente durante a menstruação. Também refere dispareunia profunda e dor para evacuar principalmente durante o período menstrual. Considerando os dados obtidos na anamnese, qual característica é mais sugestiva de endometriose?", "o": ["Dor pélvica cíclica associada à dismenorreia e sintomas intestinais durante a menstruação.", "Dor pélvica exclusivamente no período ovulatório.", "Corrimento vaginal purulento associado à febre.", "Dor abdominal contínua sem relação com o ciclo menstrual."], "c": 0, "why": "A endometriose é suspeitada pela dismenorreia progressiva associada a dispareunia profunda e sintomas intestinais ou urinários no período menstrual. Corrimento purulento com febre sugere infecção, e dor contínua sem relação com o ciclo aponta para outras causas."}, {"tag": "UNP Salgado Filho · 2026.2 · Questão 12", "s": "Mulher de 29 anos, com ciclos previamente regulares, procura atendimento por sangramento vaginal irregular iniciado há 10 dias, associado a discreta dor em hipogástrio. Refere vida sexual ativa e uso irregular de preservativo. Ao exame, encontra-se hemodinamicamente estável, sem sinais de sangramento intenso. Antes de classificar o quadro como sangramento uterino anormal segundo o sistema PALM-COEIN, qual é a conduta inicial mais apropriada?", "o": ["Solicitar ultrassonografia transvaginal para pesquisar causas estruturais, como pólipos e leiomiomas.", "Iniciar contraceptivo hormonal combinado e avaliar a resposta clínica ao tratamento.", "Solicitar dosagem de FSH e LH para investigar disfunção ovulatória.", "Solicitar teste de gravidez para excluir sangramento relacionado à gestação."], "c": 3, "why": "Antes de classificar qualquer sangramento pelo PALM-COEIN, é obrigatório excluir gestação, porque complicações da gravidez são causa frequente de sangramento irregular na idade fértil e mudam completamente a conduta."}, {"tag": "FASEH · 2026.2 · Questão 19", "s": "Três mulheres procuram atendimento médico com manifestações sugestivas de infecção do trato urinário: Paciente 1: 27 anos, previamente hígida, apresenta disúria, urgência e polaciúria há dois dias. Nega febre, calafrios, náuseas ou dor lombar. Encontra-se em bom estado geral e sem dor à punho-percussão lombar. Paciente 2: 32 anos, previamente hígida, apresenta febre, calafrios, disúria e dor lombar direita. Apresenta dor à punho-percussão lombar direita, mas encontra-se hemodinamicamente estável, tolerando líquidos e medicamentos por via oral, sem sinais de sepse ou suspeita de obstrução urinária. Paciente 3: 41 anos, apresenta febre alta, calafrios e dor lombar esquerda. Encontra-se hipotensa e taquicárdica. Exame de imagem evidencia cálculo ureteral obstrutivo associado à hidronefrose ipsilateral. Considerando o diagnóstico mais provável, o local de tratamento e a estratégia antimicrobiana, assinale a alternativa CORRETA, dentre as abaixo dispostas.", "o": ["Paciente 1: pielonefrite inicial, tratamento ambulatorial com fluoroquinolona; Paciente 2: cistite complicada, tratamento ambulatorial com fosfomicina; Paciente 3: pielonefrite aguda não complicada, tratamento ambulatorial após controle da febre.", "Paciente 1: cistite aguda, necessitando internação para antibioticoterapia parenteral; Paciente 2: pielonefrite aguda, passível de tratamento ambulatorial com fosfomicina em dose única; Paciente 3: pielonefrite obstrutiva, com indicação de tratamento ambulatorial desde que seja iniciada antibioticoterapia de amplo espectro.", "Paciente 1: cistite aguda não complicada, tratamento ambulatorial com nitrofurantoína; Paciente 2: pielonefrite aguda sem critérios de internação, tratamento ambulatorial com fosfomicina; Paciente 3: pielonefrite associada à obstrução, necessitando internação e antibioticoterapia, sem necessidade de abordagem imediata da obstrução caso a função renal esteja preservada.", "Paciente 1: cistite aguda não complicada, tratamento ambulatorial com nitrofurantoína; Paciente 2: pielonefrite aguda, necessitando obrigatoriamente internação e nitrofurantoína por via oral; Paciente 3: pielonefrite ob
