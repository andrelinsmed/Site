strutiva, inicialmente tratada apenas com antibioticoterapia, reservando-se a descompressão urinária para os casos sem resposta clínica.", "Paciente 1: cistite aguda não complicada, tratamento ambulatorial com nitrofurantoína; Paciente 2: pielonefrite aguda sem critérios de internação, tratamento ambulatorial com antimicrobiano oral apropriado para pielonefrite; Paciente 3: pielonefrite associada à obstrução urinária e instabilidade hemodinâmica, necessitando internação, antibioticoterapia parenteral e avaliação urológica urgente para descompressão do trato urinário."], "c": 4, "why": "Cistite sem febre e sem dor lombar é tratada ambulatorialmente, por exemplo com nitrofurantoína. Pielonefrite com febre e Giordano positivo, mas estável, pode ser tratada por via oral em casa. Sinais de gravidade, vômitos que impedem a via oral, gestação ou obstrução indicam internação."}, {"tag": "FASEH · 2026.2 · Questão 8", "s": "Uma adolescente de 17 anos, G2P2A0, não emancipada, comparece à unidade de saúde solicitando laqueadura tubária como método contraceptivo definitivo. Teve duas gestações sem complicações relevantes e possui dois filhos vivos. Não apresenta condição clínica que determine risco à sua vida ou à saúde em eventual nova gestação. Após receber informações sobre métodos contraceptivos reversíveis, mantém sua decisão e afirma compreender o caráter definitivo do procedimento e a possibilidade de arrependimento. Seus responsáveis legais manifestam concordância com a realização da esterilização. Considerando a legislação brasileira vigente sobre planejamento familiar, qual é a conduta mais adequada?", "o": ["Realizar a esterilização, pois a concordância dos responsáveis legais supre o requisito de capacidade civil plena.", "Realizar a esterilização após o prazo legal de 60 dias, pois seu cumprimento supre a limitação decorrente da menoridade.", "Realizar a esterilização, pois a existência de dois filhos vivos constitui requisito suficiente, independentemente da capacidade civil.", "Não realizar a esterilização voluntária neste momento, pois ter dois filhos vivos não afasta a exigência de capacidade civil plena.", "Realizar a esterilização após avaliação multiprofissional, pois o aconselhamento especializado supre o requisito de capacidade civil plena."], "c": 3, "why": "Pela Lei 14.443/2022, a esterilização voluntária exige capacidade civil plena e idade acima de 21 anos ou pelo menos dois filhos vivos. Ter dois filhos não supre a falta de capacidade civil, e nem a autorização dos responsáveis nem o prazo de 60 dias resolvem isso na adolescente não emancipada."}], "videos": []}, {"id": "sondagem-vesical", "nome": "Sondagem vesical", "resumo": "Tipos de cateter, indicações e contraindicações, calibre e material, técnica feminina e masculina, manutenção, complicações e retirada.", "teoria": "<p>A sondagem vesical é a introdução de um cateter pela uretra até a bexiga, para drenar a urina. Parece um procedimento simples, mas exige técnica rigorosa: é uma das principais portas de entrada de infecção hospitalar, e uma passagem forçada pode lesar a uretra.<\/p>\n<p>A segurança da sondagem depende de quatro decisões: indicar corretamente, escolher o cateter certo, manter a técnica estéril e retirar a sonda assim que ela deixar de ser necessária.<\/p>\n\n<h2 class=\"block-color-teal_background\">Tipos de cateter e de sondagem<\/h2>\n<figure class=\"image\"><img loading=\"lazy\" alt=\"\" src=\"img/f14ea637219f57cb.webp\"><\/figure>\n<p>Os cateteres podem ser classificados de três formas:<\/p>\n<ul class=\"bulleted-list\">\n<li><strong>Pelo tempo de permanência:<\/strong> na <strong>sondagem de alívio<\/strong> (intermitente), usa-se um cateter sem balão, de ponta obtusa (Nelaton), que é retirado logo após esvaziar a bexiga. Na <strong>sondagem de demora<\/strong>, usa-se o cateter de Foley, que tem um balão na ponta, inflado dentro da bexiga para fixá-lo, e fica em drenagem contínua.<\/li>\n<li><strong>Pelo número de vias:<\/strong> uma via (alívio), duas vias (drenagem e balão, o Foley comum) e três vias (drenagem, balão e irrigação, usado para coágulos e no pós-operatório urológico).<\/li>\n<li><strong>Pela forma de inserção:<\/strong> externo (fixado à genitália, para incontinência), uretral e suprapúbico (inserido por punção ou cirurgia através da parede abdominal).<\/li>\n<\/ul>\n<aside class=\"callout block-color-gray_background\"><div><span class=\"icon\">💡<\/span><\/div><div>\n<p><strong>Alerta:<\/strong> cerca de 75% das infecções urinárias hospitalares estão associadas ao cateter, e o principal fator de risco é o tempo de uso. Use o menor calibre adequado e retire a sonda assim que possível.<\/p>\n<\/div><\/aside>\n\n<h2 class=\"block-color-teal_background\">Indicações e contraindicações<\/h2>\n<p>A <strong>sondagem de alívio<\/strong> é indicada na retenção urinária aguda, para medir o resíduo pós-miccional, para colher urina para exame, para instilar medicamentos na bexiga e para explorar a uretra.<\/p>\n<p>A <strong>sondagem de demora<\/strong> é indicada na obstrução aguda ou crônica, na bexiga neurogênica, na irrigação vesical, no pós-operatório urológico ou pélvico, para controlar o débito urinário em pacientes graves e na incontinência com lesão de pele perineal. Usar a sonda de demora por conveniência da equipe, ou para controlar incontinência em paciente sem lesão de pele, é inadequado e aumenta o risco de infecção.<\/p>\n<p>É importante diferenciar <strong>retenção de anúria<\/strong>. Na retenção, a bexiga está cheia (o bexigoma, uma massa acima do púbis, dolorosa e maciça à percussão) e a sonda drena a urina e faz a massa desaparecer. Na anúria, os rins não produzem urina e a bexiga está vazia. A causa mais comum de retenção no homem idoso é a hiperplasia prostática benigna.<\/p>\n<h3>Contraindicações<\/h3>\n<p>A principal contraindicação é a <strong>suspeita de lesão uretral<\/strong>: sangue no meato, hematoma escrotal, perineal ou peniano, ou próstata \"alta\" ao toque retal após trauma. Nessas situações, a sonda pode transformar uma lesão parcial em completa, e a conduta é avaliação urológica e, se necessário, cistostomia suprapúbica. Também contraindicam a sondagem uretral a estenose grave, a infecção uretral e a recusa do paciente. O câncer de próstata, por si só, não é contraindicação.<\/p>\n<div class=\"caiu-slot\" data-i=\"0\"><\/div>\n\n<h2 class=\"block-color-teal_background\">Anatomia que importa<\/h2>\n<figure class=\"image\"><img loading=\"lazy\" alt=\"\" src=\"img/fef5a0f97de3eb56.webp\"><\/figure>\n<p>A <strong>uretra masculina<\/strong> mede cerca de 18 a 20 cm e tem as porções prostática, membranosa e esponjosa. O ponto de maior resistência fica na transição bulbomembranosa, junto ao esfíncter externo, e na hiperplasia prostática o colo vesical fica deslocado para cima. Colocar o pênis a 90 graus do corpo retifica a uretra e facilita a passagem.<\/p>\n<p>A <strong>uretra feminina<\/strong> mede cerca de 3,5 a 4 cm, e o meato fica no vestíbulo, entre os pequenos lábios, acima do óstio vaginal. Em mulheres com atrofia, o meato pode ser difícil de ver. A uretra curta e a proximidade com o ânus explicam por que a infecção urinária é mais frequente nas mulheres.<\/p>\n<p>A bexiga tem capacidade de cerca de 350 a 500 mL, e os rins produzem em torno de 1.500 mL de urina por dia.<\/p>\n\n<h2 class=\"block-color-teal_background\">Calibre e material do cateter<\/h2>\n<p>O calibre é medido em <strong>French (Fr)<\/strong>, e cada unidade corresponde a cerca de 0,33 mm. Em adultos, usam-se calibres de 12 a 24 Fr, e em crianças, de 6 a 12 Fr. Na estação, a referência é <strong>12 a 14 Fr na mulher e 16 a 18 Fr no homem<\/strong>. Os livros variam entre si, mas concordam que o menor calibre adequado é o melhor: cateteres grossos aumentam erosão, estenose e infecção e ficam reservados para irrigação e hematúria com coágulos. Na hiperplasia prostática com resistência, o Amato sugere tentar um cateter mais calibroso.<\/p>\n<p>O material é escolhido pelo tempo de permanência:<\/p>\n<div class=\"tbl\"><table class=\"simple-table\"><thead><tr><th class=\"simple-table-header-color simple-table-header\">Material<\/th><th class=\"simple-table-header-color simple-table-header\">Uso<\/th><\/tr><\/thead><tbody>\n<tr><td>PVC (plástico)<\/td><td>Cateterismo intermitente, sem balão<\/td><\/tr>\n<tr><td>Látex<\/td><td>7 a 14 dias; causa incrustação e reação tecidual<\/td><\/tr>\n<tr><td>Látex siliconizado<\/td><td>14 a 21 dias<\/td><\/tr>\n<tr><td>Silicone puro<\/td><td>30 a 90 dias; indicado para alérgicos ao látex; menos biofilme<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<div class=\"caiu-slot\" data-i=\"1\"><\/div>\n\n<h2 class=\"block-color-teal_background\">Material e preparo<\/h2>\n<figure class=\"image\"><img loading=\"lazy\" alt=\"\" src=\"img/3f7e3941f06ca0dc.webp\"><\/figure>\n<p>O material inclui o cateter (Nelaton ou Foley) e a bolsa coletora de sistema fechado; o kit estéril (cuba-rim, cúpula, pinça, campo e campo fenestrado); material de higiene íntima (luvas de procedimento, gazes, sabão neutro); antisséptico (clorexidina ou PVPI); luvas estéreis, gorro, máscara e óculos; seringa com lidocaína gel a 2%; seringa de 20 mL com água destilada para o balão; e esparadrapo ou fita para fixar.<\/p>\n<p>O preparo do paciente começa com a identificação dupla (nome e data de nascimento), a explicação do procedimento, o consentimento e a privacidade. A mulher fica em posição ginecológica e o homem em decúbito dorsal, com as pernas levemente afastadas. Antes da antissepsia, faz-se a <strong>higiene íntima<\/strong> com luva de procedimento: na mulher, do púbis para o ânus; no homem, do meato para a periferia, usando cada gaze uma única vez.<\/p>\n<p>Depois, o profissional higieniza as mãos, se paramenta, calça as luvas estéreis e abre o campo. O balão é <strong>testado antes<\/strong> com o volume indicado na sonda e esvaziado; o cateter é conectado à bolsa e lubrificado.<\/p>\n<figure class=\"image\"><img loading=\"lazy\" alt=\"\" src=\"img/63cc3ca02d03ade6.webp\"><\/figure>\n\n<h2 class=\"block-color-teal_background\">Técnica feminina<\/h2>\n<figure class=\"image\"><img loading=\"lazy\" alt=\"\" src=\"img/c82b3f8f3494e06a.webp\"><\/figure>\n<ol class=\"numbered-list\">\n<li>Afastar os pequenos lábios com o polegar e o indicador da mão não dominante. Essa mão passa a ser considerada contaminada e mantém os lábios afastados até o fim.<\/li>\n<li>Fazer a antissepsia com a pinça e gazes, do púbis para o ânus (grandes lábios, pequenos lábios e meato), usando uma gaze para cada movimento.<\/li>\n<li>Colocar o campo fenestrado e lubrificar os 5 a 10 cm distais do cateter.<\/li>\n<li>Localizar o meato e introduzir o cateter até sair urina; avançar mais 3 a 4 cm.<\/li>\n<li>Insuflar o balão com o volume indicado pelo fabricante (impresso na sonda) e tracionar levemente até sentir resistência.<\/li>\n<\/ol>\n<p>Se o cateter entrar na vagina, ele está contaminado: deve ser descartado e substituído por outro. O primeiro pode ser deixado na vagina temporariamente, como referência para não repetir o erro.<\/p>\n\n<h2 class=\"block-color-teal_background\">Técnica masculina<\/h2>\n<figure class=\"image\"><img loading=\"lazy\" alt=\"\" src=\"img/ebf6f2d491ea7701.webp\"><\/figure>\n<ol class=\"numbered-list\">\n<li>Retrair o prepúcio e fazer a antissepsia do meato para a periferia.<\/li>\n<li>Injetar lentamente cerca de 10 mL de lidocaína gel no meato e aguardar alguns minutos, para anestesiar e lubrificar a uretra.<\/li>\n<li>Posicionar o pênis <strong>perpendicular ao corpo (90 graus)<\/strong>, discretamente tracionado, o que retifica a uretra.<\/li>\n<li>Introduzir o cateter até sentir a resistência do esfíncter externo e, então, inclinar o pênis a cerca de 45 graus em direção ao abdome e continuar.<\/li>\n<li>Avançar até a bifurcação em Y do cateter e só insuflar o balão depois de ver a urina refluir, para ter certeza de que ele está na bexiga, e não na uretra.<\/li>\n<li>Tracionar levemente até ancorar e <strong>recolocar o prepúcio<\/strong>, para evitar parafimose.<\/li>\n<\/ol>\n<aside class=\"callout block-color-gray_background\"><div><span class=\"icon\">💡<\/span><\/div><div>\n<p><strong>Nunca forçar:<\/strong> forçar contra resistência cria falso trajeto e pode inflar o balão dentro da uretra. Diante de suspeita de lesão uretral ou de impossibilidade de passar a sonda com segurança, a conduta é a drenagem suprapúbica.<\/p>\n<p><strong>Sem urina?<\/strong> Uma leve compressão suprapúbica ou a infusão de 50 mL de soro com aspiração fácil confirmam que a sonda está na bexiga.<\/p>\n<\/div><\/aside>\n<div class=\"caiu-slot\" data-i=\"2\"><\/div>\n\n<h2 class=\"block-color-teal_background\">Fixação, bolsa coletora e registro<\/h2>\n<figure class=\"image\"><img loading=\"lazy\" alt=\"\" src=\"img/be0782989e3924ed.webp\"><\/figure>\n<p>A sonda é fixada na face interna da coxa na mulher e na face anteromedial da coxa ou no abdome no homem, sem tração. A bolsa coletora fica <strong>sempre abaixo do nível da bexiga<\/strong>, sem tocar o chão e com o tubo sem dobras. O registro inclui data e hora, tipo e calibre do cateter, volume colocado no balão, volume, cor e aspecto da urina e reações do paciente.<\/p>\n\n<h2 class=\"block-color-teal_background\">Sondagem de alívio<\/h2>\n<p>A higiene, a antissepsia e os equipamentos de proteção são os mesmos. Usa-se um cateter sem balão (10 a 14 Fr), introduzido até drenar a urina em uma cuba ou frasco estéril; ele é mantido só enquanto drena e retirado em seguida, com o volume anotado. No cateterismo intermitente de rotina, a frequência deve impedir que a bexiga se distenda além de cerca de 300 a 350 mL.<\/p>\n\n<h2 class=\"block-color-teal_background\">Manutenção e prevenção de infecção<\/h2>\n<p>Os cuidados com a sonda de demora visam reduzir a infecção urinária associada ao cateter:<\/p>\n<ul class=\"bulleted-list\">\n<li><strong>Higiene perineal com água e sabão<\/strong>, incluindo a junção entre o cateter e o meato, pelo menos duas vezes ao dia e após as evacuações.<\/li>\n<li><strong>Sistema fechado:<\/strong> não desconectar a sonda da bolsa e não irrigar cateter de duas vias (para isso existe o de três vias).<\/li>\n<li><strong>Fluxo livre:<\/strong> tubo sem dobras, bolsa abaixo da bexiga e esvaziada com frequência.<\/li>\n<li><strong>Sem irrigação profilática<\/strong> com antimicrobianos, e retirada da sonda assim que possível.<\/li>\n<\/ul>\n\n<h2 class=\"block-color-teal_background\">Complicações e retirada da sonda<\/h2>\n<figure class=\"image\"><img loading=\"lazy\" alt=\"\" src=\"img/ab55c4ab9fbb2cb7.webp\"><\/figure>\n<p>As complicações podem ser <strong>mecânicas<\/strong> (resistência à passagem, falso trajeto, balão inflado na uretra, inserção na vagina, lesão uretral, retirada traumática e parafimose) ou <strong>clínicas<\/strong> (infecção urinária, a mais comum, hematúria, disúria, espasmos vesicais, obstrução por sedimentos ou coágulos e retenção após a retirada). Em pós-operatório urológico com sonda de três vias, débito baixo com dor e plenitude vesical sugere obstrução por coágulos.<\/p>\n<p>Para retirar a sonda, explica-se o procedimento, calçam-se luvas de procedimento, <strong>esvazia-se totalmente o balão<\/strong> aspirando com seringa e traciona-se o cateter de forma contínua e delicada. Depois, aguarda-se a diurese espontânea; se demorar, uma compressa morna suprapúbica e o som de água corrente podem ajudar. Quando o balão não esvazia, a causa mais provável é a cristalização da solução que foi colocada nele, bloqueando o canal.<\/p>\n<div class=\"caiu-slot\" data-i=\"3\"><\/div>\n", "guia": {"intro": "Roteiro para a sondagem vesical de demora, com as diferenças da técnica feminina e masculina. Na sondagem de alívio, o preparo é o mesmo, com cateter sem balão retirado logo após a drenagem.", "secoes": ["Indicação", "Procedimento", "Resultado", "Intercorrências"], "fontes": "Elaborado a partir do material da Estação 4 de HM4 (slides), com base em Amato, Procedimentos Médicos: técnica e tática, 2. ed., cap. 51; e Scalabrini Neto e Dias, Procedimentos em Emergências (cateterismo vesical).", "etapas": [{"titulo": "Indicação e escolha do cateter", "itens": [["Confirmar a indicação", "Retenção, débito urinário em paciente grave, obstrução, pós-operatório, bexiga neurogênica. Não usar por conveniência da equipe.", {"s": "Indicação", "n": "Sondagem vesical de demora indicada por ___.", "a": [["Retenção", "Sondagem indicada por retenção urinária aguda, com bexigoma palpável."], ["Alívio", "Sondagem de alívio indicada por ___."]]}], ["Afastar contraindicações", "Sangue no meato, hematoma perineal ou escrotal, próstata alta após trauma, estenose grave, recusa.", null], ["Escolher tipo, calibre e material", "Foley 12 a 14 Fr na mulher e 16 a 18 Fr no homem; silicone se alergia ao látex ou uso prolongado.", {"s": "Procedimento", "n": "Utilizado cateter de Foley ___ Fr, de ___ (látex / silicone)."}]]}, {"titulo": "Preparo", "itens": [["Identificar o paciente, explicar e pedir consentimento", "Nome e data de nascimento; privacidade.", null], ["Posicionar", "Mulher em posição ginecológica; homem em decúbito dorsal com as pernas levemente afastadas.", null], ["Higiene íntima com luva de procedimento", "Mulher: do púbis para o ânus. Homem: do meato para a periferia. Uma gaze por movimento.", null], ["Paramentar, calçar luvas estéreis e abrir o campo", "Gorro, máscara, óculos; antisséptico na cúpula.", null], ["Testar o balão, conectar à bolsa e lubrificar", "Volume impresso na sonda; esvaziar após o teste.", null]]}, {"titulo": "Técnica feminina", "itens": [["Afastar os pequenos lábios com a mão não dominante", "Essa mão fica contaminada e mantém os lábios afastados.", null], ["Antissepsia do púbis para o ânus e campo fenestrado", "Grandes lábios, pequenos lábios e meato, uma gaze por movimento.", null], ["Introduzir pelo meato até sair urina e avançar mais 3 a 4 cm", "Se entrar na vagina, descartar e usar outro cateter.", null]]}, {"titulo": "Técnica masculina", "itens": [["Retrair o prepúcio e fazer a antissepsia do meato para a periferia", "Gaze no sulco balanoprepucial para apoio.", null], ["Injetar 10 mL de lidocaína gel e aguardar", "Anestesia e lubrificação da uretra.", null], ["Pênis a 90 graus, introduzir até a resistência e inclinar a 45 graus", "Avançar até a bifurcação em Y. Nunca forçar.", null], ["Recolocar o prepúcio ao final", "Evita parafimose.", null]]}, {"titulo": "Insuflar, fixar e registrar", "itens": [["Insuflar o balão só após o refluxo de urina", "Volume indicado pelo fabricante; tracionar levemente até ancorar.", {"s": "Procedimento", "n": "Balão insuflado com ___ mL de água destilada após refluxo de urina."}], ["Fixar na coxa sem tração e manter a bolsa abaixo da bexiga", "Mulher: face interna da coxa. Homem: face anteromedial da coxa ou abdome.", {"s": "Procedimento", "n": "Sonda fixada em ___, bolsa coletora abaixo do nível da bexiga."}], ["Anotar o volume e o aspecto da urina", "Volume, cor e aspecto.", {"s": "Resultado", "n": "Drenados ___ mL de urina ___ (clara / concentrada), sem hematúria.", "a": ["Drenados ___ mL de urina com ___ (hematúria / grumos)."]}], ["Registrar intercorrências e reações", "Resistência, dor, sangramento, número de tentativas.", {"s": "Intercorrências", "n": "Procedimento sem intercorrências, bem tolerado.", "a": [["Resistência", "Resistência à passagem em uretra ___; ___ (sucesso com cateter de ___ Fr / suspenso e solicitada avaliação urológica)."], ["Vagina", "Primeira tentativa em vagina; cateter descartado e substituído."]]}]]}, {"titulo": "Manutenção e retirada", "itens": [["Orientar os cuidados com a sonda", "Higiene perineal com água e sabão 2 vezes ao dia e após evacuar; sistema fechado; bolsa abaixo da bexiga, sem tocar o chão.", null], ["Retirar assim que não for mais necessária", "Esvaziar todo o balão com seringa, tracionar de forma contínua e aguardar a diurese espontânea.", null]]}, {"titulo": "Sinais de alerta", "alerta": true, "itens": [["Sangue no meato ou hematoma perineal após trauma", "Não sondar pela uretra: avaliação urológica e cistostomia."], ["Resistência importante à passagem", "Não forçar: risco de falso trajeto e lesão uretral."], ["Ausência de urina com o cateter supostamente na bexiga", "Não insuflar o balão antes de confirmar a posição."], ["Febre, calafrios ou dor com sonda de demora", "Pensar em infecção associada ao cateter."], ["Débito baixo com dor e plenitude vesical", "Obstrução da sonda, por exemplo por coágulos."]]}, {"titulo": "Registro (exemplo de procedimento sem intercorrências)", "registro": "Realizada sondagem vesical de demora por retenção urinária aguda, após consentimento, com técnica asséptica. Utilizado cateter de Foley 16 Fr de látex, introduzido sem resistência; balão insuflado com 10 mL de água destilada após refluxo de urina. Drenados 600 mL de urina clara. Sonda fixada na face anteromedial da coxa, bolsa coletora abaixo do nível da bexiga. Procedimento sem intercorrências, bem tolerado.", "itens": []}]}, "caiu": [{"tag": "UNIFG São Sebastião · 2025.2 · Questão 1", "s": "Qual das situações abaixo representa contraindicação absoluta à sondagem vesical de demora por via uretral?", "o": ["Suspeita de lesão uretral após trauma pélvico, com presença de sangue no meato.", "Incontinência urinária de urgência em paciente idoso institucionalizado.", "Necessidade de controle rigoroso do débito urinário em paciente com insuficiência renal aguda.", "Retenção urinária aguda em paciente com hipertrofia prostática e dores intensas."], "c": 0, "why": "Sangue no meato após trauma pélvico sugere lesão uretral. Passar a sonda pode transformar uma lesão parcial em completa; a conduta é avaliação urológica e, se necessário, cistostomia suprapúbica. Retenção por HPB e controle de débito são indicações, não contraindicações."}, {"tag": "UNP Salgado Filho · 2026.2 · Questão 5", "s": "Paciente com necessidade de sondagem vesical de demora prolongada relata alergia confirmada ao látex. Assinale a alternativa que indica o material mais adequado para o cateter nesse caso.", "o": ["Látex revestido de silicone, considerado seguro para pacientes alérgicos.", "Não há necessidade de trocar o material, desde que o calibre seja reduzido.", "Silicone puro, opção preferencial tanto para pacientes alérgicos ao látex quanto para uso prolongado.", "PVC rígido, indicado exclusivamente para uso de curta duração"], "c": 2, "why": "Para alérgicos ao látex e para uso prolongado, o material indicado é o silicone puro. O látex siliconizado continua tendo látex, e o calibre não muda o problema da alergia."}, {"tag": "UNP Salgado Filho · 2026.2 · Questão 7", "s": "Um homem de 68 anos, com hiperplasia prostática, apresenta retenção urinária aguda. Durante a tentativa de cateterismo uretral, há resistência importante à progressão do cateter e suspeita de lesão uretral. Diante dessa situação, qual é a conduta mais adequada?", "o": ["Retirar imediatamente o cateter e repetir a tentativa com um cateter de maior calibre.", "Manter o cateter parcialmente introduzido e realizar irrigação vesical para confirmar sua posição antes de prosseguir.", "Avaliar a possibilidade de lesão uretral e, diante de suspeita de ruptura ou impossibilidade de sondagem segura, realizar drenagem suprapúbica.", "Prosseguir com a introdução do cateter, aplicando maior força para ultrapassar o ponto de resistência."], "c": 2, "why": "Nunca se força um cateter contra resistência: isso cria falso trajeto e pode lesar a uretra. Diante de suspeita de lesão ou de impossibilidade de passar a sonda com segurança, a saída é a drenagem suprapúbica."}, {"tag": "UNIFG São Sebastião · 2025.2 · Questão 3", "s": "Durante a retirada de um cateter vesical de demora, observa-se impossibilidade de esvaziar o balão, mesmo após tentativa adequada de aspiração. Qual das alternativas abaixo descreve a causa técnica mais provável para essa ocorrência?", "o": ["Inserção inicial do cateter em uretra feminina com calibre inadequado, provocando sua ruptura.", "Realização de tração contínua do cateter antes da completa drenagem da bolsa coletora.", "Formação de cálculo vesical secundário ao uso prolongado do cateter, impedindo sua mobilização.", "Cristalização da solução instalada no balão, levando ao bloqueio do seu canal de drenagem."], "c": 3, "why": "O balão que não esvazia costuma ter o canal bloqueado por cristalização da solução que foi colocada nele. Por isso se usa água destilada, no volume indicado pelo fabricante."}], "videos": [{"id": "1_tHfjYuoy_tmxGTJwbsJY0tDBGJmpnwp", "nome": "Sondagem vesical feminina", "teoria": "Técnica feminina", "guia": "Técnica feminina"}, {"id": "13sxbTgczEkRglGladop2xTVe4Jxi95O-", "nome": "Sondagem vesical masculina", "teoria": "Técnica masculina", "guia": "Técnica masculina"}]}];

let spy = null;
function toc(entries){
  const tl = $("tocList"); tl.innerHTML = "";
  entries.forEach(([txt, cls, el])=>{
    const li = document.createElement("li"), a = document.createElement("a");
    a.href = "#"; a.textContent = txt; a.className = cls; a._h = el;
    a.addEventListener("click", e=>{ e.preventDefault(); el.scrollIntoView({behavior:"smooth", block:"start"}); $("toc").classList.remove("open"); $("tocBtn").setAttribute("aria-expanded","false"); });
    li.appendChild(a); tl.appendChild(li);
  });
  if (spy) spy.disconnect();
  const links = [...tl.querySelectorAll("a")];
  spy = new IntersectionObserver(es=>es.forEach(en=>{ if (en.isIntersecting) links.forEach(a=>a.classList.toggle("on", a._h === en.target)); }), {rootMargin:"0px 0px -75% 0px"});
  entries.forEach(([,,el])=>spy.observe(el));
}

function renderCaiu(pane, t){

    const box = document.createElement("div"); box.className = "caiu-box";

    box.querySelector(".src").textContent = q.tag; box.querySelector(".st").textContent = q.s;
    box.querySelector(".why").innerHTML = "<strong>Por quê:</strong> " + esc(q.why);
    const ol = box.querySelector("ol");
    q.o.forEach((o,i)=>{ const li = document.createElement("li"); const b = document.createElement("button"); b.type = "button"; b.className = "op";
      b.innerHTML = `<span class="lt">${L[i]}</span><span></span>`; b.lastChild.textContent = o;
      b.addEventListener("click", ()=>{ if (box.classList.contains("done")) return; box.classList.add("done");
        const ops = box.querySelectorAll(".op"); ops[q.c].classList.add("ok"); if (i !== q.c) b.classList.add("bad");
        const v = box.querySelector(".vd b"); v.className = i === q.c ? "ok" : "bad"; v.textContent = i === q.c ? "Acertou" : "Errou · gabarito " + L[q.c];
        box.querySelector(".vd").hidden = false; box.querySelector(".why").hidden = false; });
      li.appendChild(b); ol.appendChild(li); });
    box.querySelector(".vd button").addEventListener("click", ()=>{ box.classList.remove("done"); box.querySelectorAll(".op").forEach(x=>x.classList.remove("ok","bad")); box.querySelector(".vd").hidden = true; box.querySelector(".why").hidden = true; });
    slot.replaceWith(box);
  });
}
/* Vídeos do Google Drive: o player do Drive é carregado só quando a pessoa toca no play */
function videoCard(v){
  const w = document.createElement("div"); w.className = "video";
  w.innerHTML = `<div class="vbox"><button class="vplay" type="button" aria-label="Assistir: ${esc(v.nome)}"><img alt="" loading="lazy" referrerpolicy="no-referrer"><span class="vcirc"></span><span class="vcap"><span class="vk">Vídeo</span><span class="vt"></span></span></button></div><a class="vlink" target="_blank" rel="noopener">Abrir no Google Drive ↗</a>`;
  w.querySelector(".vt").textContent = v.nome;
  const img = w.querySelector("img"); img.onerror = ()=>img.remove(); img.src = `https://drive.google.com/thumbnail?id=${v.id}&sz=w1280`;
  w.querySelector(".vlink").href = `https://drive.google.com/file/d/${v.id}/view`;
  w.querySelector(".vplay").addEventListener("click", ()=>{
    const f = document.createElement("iframe"); f.src = `https://drive.google.com/file/d/${v.id}/preview`;
    f.allow = "autoplay; fullscreen; encrypted-media; picture-in-picture"; f.allowFullscreen = true; f.title = v.nome;
    w.querySelector(".vbox").replaceChildren(f);
  });
  return w;
}
const clean = s => s.replace(/^\d\d/, "").trim().toLowerCase();
function placeVideos(pane, t, modo){
  const vids = t.videos || []; if (!vids.length) return;
  const heads = [...pane.querySelectorAll(modo === "teoria" ? "h2,h3" : ".etapa h2")];
  const loose = [];
  const groups = new Map();
  vids.forEach(v=>{
    const key = clean(modo === "teoria" ? v.teoria : v.guia);
    const h = heads.find(h=>clean(h.textContent).startsWith(key));
    if (!h) { loose.push(v); return; }
    if (!groups.has(h)) groups.set(h, []); groups.get(h).push(v);
  });
  groups.forEach((vs, h)=>{
    const box = vs.length > 1 ? Object.assign(document.createElement("div"), {className:"vgal"}) : null;
    vs.forEach(v=>(box || h.parentNode).appendChild(videoCard(v)));
    if (box) h.insertAdjacentElement("afterend", box);
    else h.insertAdjacentElement("afterend", h.parentNode.lastChild);
  });
  if (loose.length){ const g = document.createElement("div"); g.className = "vgal"; loose.forEach(v=>g.appendChild(videoCard(v))); pane.prepend(g); }
}
/* Flashcards salvos para cada conteúdo, mostrados em ordem aleatória a cada "Gerar flashcards" */
const FLASH = {"puericultura": [["O que é a puericultura?", "O acompanhamento periódico da criança para avaliar crescimento e desenvolvimento, com orientações, promoção da saúde, prevenção de doenças e atenção a riscos e vulnerabilidades."], ["Quantas consultas de rotina são recomendadas no 1º ano de vida e quando?", "No mínimo 7: na 1ª semana e no 1º, 2º, 4º, 6º, 9º e 12º mês."], ["E no 2º ano de vida e depois?", "No mínimo 2 consultas no 2º ano (18 e 24 meses). A partir dos 2 anos, as consultas podem ser anuais."], ["Por que o calendário de consultas segue o calendário de vacinas?", "Para que a caderneta seja conferida em meses oportunos, aproveitando as consultas para atualizar a vacinação."], ["O que a anamnese da puericultura deve incluir além da anamnese comum?", "Gestação, parto e período neonatal, alimentação (aleitamento), marcos do desenvolvimento, vacinação, sono, eliminações e condições de vida da família."], ["Quanto de perda de peso é normal no recém-nascido?", "Até 10% do peso de nascimento nos primeiros dias, recuperado em cerca de 2 semanas."], ["Para que serve medir o perímetro cefálico?", "Para acompanhar o crescimento do crânio e do cérebro. Valores abaixo de -2 ou acima de +2 desvios-padrão podem indicar alterações neurológicas (microcefalia, hidrocefalia)."], ["Quais medidas antropométricas são feitas em toda consulta?", "Peso, comprimento ou estatura e perímetro cefálico (nos primeiros anos), registrados nas curvas da caderneta da criança."], ["Quais reflexos primitivos se avaliam no recém-nascido?", "Sucção, busca, preensão palmar e plantar, Moro, marcha reflexa e tônico-cervical assimétrico, junto com postura e tônus."], ["O que é o reflexo de Moro e quando desaparece?", "Após um estímulo súbito, a criança abre os braços e depois os fecha como num abraço. Some por volta dos 4 a 6 meses; persistência ou assimetria merece investigação."], ["O que avaliar nas fontanelas?", "Tamanho, tensão e fechamento. Fontanela abaulada sugere hipertensão intracraniana; deprimida, desidratação. A posterior fecha por volta de 2 meses e a anterior entre 9 e 18 meses."], ["Para que servem as manobras de Ortolani e Barlow?", "Para rastrear displasia do desenvolvimento do quadril no recém-nascido e nos primeiros meses."], ["O que avaliar na região lombossacra do bebê?", "Inspecionar sinais de disrafismo, como fosseta, tufo de pelos, hemangioma ou massa na linha média."], ["Quais são as triagens neonatais obrigatórias?", "Teste do pezinho, da orelhinha, do olhinho (reflexo vermelho), do coraçãozinho (oximetria) e, onde disponível, da linguinha."], ["Quais vacinas são aplicadas ao nascer?", "BCG (formas graves de tuberculose) e hepatite B, ambas em dose única ao nascer."], ["Quando se aplica a vacina pentavalente?", "Aos 2, 4 e 6 meses. Ela protege contra difteria, tétano, coqueluche, Haemophilus influenzae b e hepatite B."], ["Qual a recomendação de aleitamento materno?", "Aleitamento exclusivo até os 6 meses e complementado até 2 anos ou mais."], ["Quais são sinais de alerta na consulta de puericultura?", "Perda ou parada de ganho de peso, perímetro cefálico fora da curva, atraso ou perda de marcos do desenvolvimento, icterícia prolongada e sinais de maus-tratos ou negligência."], ["Toda consulta de puericultura exige exame físico completo?", "Não. Segundo o Ministério da Saúde, as consultas após a primeira podem focar nos itens relevantes para a idade e para as queixas."], ["O que deve sempre fechar a consulta de puericultura?", "Orientações para a família (alimentação, sono, prevenção de acidentes, vacinas, sinais de alerta) e registro na caderneta com agendamento do retorno."]], "parto-e-partograma": [["Quais são os três elementos do parto?", "Motor (as contrações uterinas e a prensa abdominal), trajeto (canal de parto mole e pelve óssea) e objeto (o feto)."], ["Como se identifica o trabalho de parto?", "Por contrações regulares e dolorosas, que modificam o colo (apagamento e dilatação progressiva). Contrações sem mudança do colo não definem trabalho de parto."], ["O que a contração uterina faz no trabalho de parto?", "Apaga e dilata o colo até cerca de 10 cm, faz a apresentação descer pela pelve e, depois do nascimento, promove o descolamento da placenta."], ["Qual a diferença entre conjugata vera anatômica e obstétrica?", "A anatômica (~11 cm) vai do promontório à borda superior da sínfise. A obstétrica (~10,5 cm) vai do promontório à face interna da sínfise e é o espaço real para o feto."], ["Quais são os estreitos da bacia obstétrica?", "Superior (a entrada), médio (o aperto, entre as espinhas isquiáticas) e inferior (a saída)."], ["O que são os planos de De Lee?", "Medidas em centímetros da altura da apresentação em relação às espinhas isquiáticas, que são o plano zero. Negativos acima, positivos abaixo."], ["O que define atitude, situação e apresentação fetal?", "Atitude é a relação das partes fetais entre si (flexão). Situação é a relação entre o maior eixo fetal e o uterino (longitudinal, transversa). Apresentação é a parte que ocupa o estreito superior (cefálica, pélvica)."], ["O que é variedade de posição?", "A relação de um ponto de referência da apresentação (na cefálica fletida, o lambda/occipital) com pontos da pelve materna, como em OEA (occipitoesquerda anterior)."], ["Quais são os tempos do mecanismo de parto?", "Insinuação, descida (com rotação interna), desprendimento da cabeça, rotação externa (restituição) e desprendimento das espáduas e do corpo."], ["O que é a insinuação?", "A passagem do maior diâmetro da apresentação pelo estreito superior. Na cefálica fletida, corresponde ao biparietal, e a apresentação fica próxima do plano zero."], ["Quais são os períodos clínicos do parto?", "1º: dilatação. 2º: expulsão. 3º: secundamento (dequitação). 4º: período de Greenberg."], ["Quanto tempo leva o secundamento normal?", "Habitualmente até 10 minutos. Depois de 30 minutos, considera-se retenção placentária."], ["O que é o período de Greenberg e por que é perigoso?", "A primeira hora após a dequitação, momento de maior risco de hemorragia pós-parto. A hemostasia depende da contração do miométrio (ligaduras vivas)."], ["O que se registra no partograma?", "Dilatação cervical, altura da apresentação, frequência cardíaca fetal, contrações, estado da bolsa e do líquido, medicações e ocitocina."], ["Quando se começa o partograma?", "Na fase ativa do trabalho de parto, quando a dilatação está progredindo com contrações regulares."], ["Como são a linha de alerta e a linha de ação?", "Duas linhas paralelas, inclinadas a 45° (1 cm por hora) e separadas por 4 horas. A linha de alerta parte da primeira dilatação registrada na fase ativa."], ["O que significa a curva de dilatação ultrapassar a linha de alerta?", "A progressão está lenta e a parturiente precisa de reavaliação mais atenta. Cruzar a linha de ação exige intervenção médica."], ["Qual a frequência cardíaca fetal normal?", "Entre 110 e 160 batimentos por minuto, avaliada antes, durante e após as contrações."], ["O que avaliar no toque vaginal?", "Dilatação, apagamento, consistência e posição do colo, altura da apresentação (De Lee), variedade de posição, bolsa e aspecto do líquido."], ["Quais são sinais de alerta no trabalho de parto?", "Sangramento vaginal importante, alteração da frequência cardíaca fetal, líquido meconial espesso, febre, hipertonia uterina, parada de progressão e pressão arterial elevada com sintomas."]], "abdomen-agudo": [["Quais são os cinco tipos de abdome agudo?", "Inflamatório, obstrutivo, perfurativo, hemorrágico e vascular."], ["Como se apresenta o abdome agudo inflamatório e quais exemplos?", "Com irritação peritoneal localizada. Exemplos: apendicite, colecistite, pancreatite e diverticulite."], ["Como se apresenta o abdome agudo obstrutivo?", "Dor em cólica, distensão abdominal, vômitos e parada de eliminação de gases e fezes. Exemplos: bridas e hérnia encarcerada."], ["Como se apresenta o abdome agudo perfurativo?", "Dor súbita, intensa e difusa, que evolui com peritonite. Exemplo clássico: úlcera péptica perfurada."], ["Como se apresenta o abdome agudo hemorrágico?", "Com sinais de choque hipovolêmico. Exemplos: gravidez ectópica rota e trauma abdominal."], ["Qual a pista clínica do abdome agudo vascular?", "Dor intensa desproporcional ao exame físico, sem irritação peritoneal no início. Exemplos: trombose mesentérica e aneurisma de aorta."], ["Qual é a ordem do exame físico do abdome e por quê?", "Inspeção, ausculta, percussão e palpação. A ausculta vem antes para que a palpação não altere os ruídos intestinais."], ["O que observar na inspeção do abdome?", "Forma (plano, globoso, distendido), abaulamentos, cicatrizes, lesões de pele, peristaltismo visível e pulsações anormais, examinando em pé e deitado."], ["O que a ausculta pode sugerir no abdome agudo?", "Ruídos aumentados e metálicos sugerem obstrução. Silêncio abdominal sugere íleo paralítico ou peritonite."], ["O que a percussão pode mostrar?", "Timpanismo difuso na distensão gasosa e perda da macicez hepática no pneumoperitônio (sinal de Jobert)."], ["Como se pesquisa o sinal de Blumberg e o que ele indica?", "Compressão lenta e profunda seguida de descompressão brusca. Dor mais forte na descompressão indica irritação peritoneal, como na apendicite."], ["Como se pesquisa o sinal de Murphy?", "Palpando o hipocôndrio direito enquanto o paciente inspira fundo. A interrupção súbita da inspiração por dor sugere colecistite aguda."], ["O que é o sinal de Rovsing?", "Dor na fossa ilíaca direita ao comprimir o quadrante inferior esquerdo, pelo deslocamento de gases em direção ao ceco inflamado. Sugere apendicite."], ["Como se pesquisa o sinal do psoas?", "Elevando a perna direita contra resistência ou estendendo a coxa direita em decúbito lateral esquerdo. Dor na fossa ilíaca direita sugere apendicite retrocecal."], ["Como se pesquisa o sinal do obturador?", "Flexionando quadril e joelho direitos a 90° e rodando a coxa internamente. Dor no hipogástrio ou fossa ilíaca direita sugere apêndice pélvico."], ["Onde fica o ponto de McBurney?", "Na junção do terço lateral com os dois terços mediais da linha entre a espinha ilíaca anterossuperior direita e o umbigo. Dor ali sugere apendicite."], ["O que é defesa abdominal involuntária?", "Contração reflexa e persistente da musculatura sobre a área inflamada, que não cede com distração. No extremo, é o abdome em tábua da peritonite."], ["Como se pesquisam hérnias na parede abdominal?", "Com manobras que aumentam a pressão intra-abdominal, como a de Valsalva (tossir ou fazer força), observando e palpando abaulamentos."], ["Quais são sinais de alarme no abdome agudo?", "Instabilidade hemodinâmica, abdome em tábua, febre com toxemia, vômitos fecaloides, dor desproporcional ao exame e distensão progressiva."], ["O que lembrar em mulher em idade fértil com abdome agudo?", "Sempre excluir gravidez com beta-hCG, pela possibilidade de gravidez ectópica rota."]], "exame-das-mamas": [["Quais são os cinco passos do exame clínico das mamas?", "Inspeção estática, inspeção dinâmica, palpação dos linfonodos, palpação das mamas e expressão papilar (só quando há queixa)."], ["Por que examinar a axila no exame das mamas?", "Porque a maior parte da linfa da mama drena para os linfonodos axilares, primeiro sítio de disseminação do câncer."], ["O que observar na inspeção estática?", "Simetria, volume, contorno, pele (cor, lesões, circulação venosa, edema, retrações) e aréola e mamilo (forma, retração, descamação, ulceração, secreção)."], ["O que é a pele em casca de laranja?", "Pele espessada com poros dilatados, por edema causado pelo bloqueio da drenagem linfática, geralmente por tumor."], ["Como diferenciar mamilo invertido de retraído?", "O invertido congênito ou antigo costuma voltar com estímulo e é estável. A retração recente, unilateral e fixa sugere lesão subjacente."], ["Quais são as manobras da inspeção dinâmica e para que servem?", "Elevar os braços, contrair os peitorais com as mãos na cintura e inclinar o tronco para frente. Todas tensionam os ligamentos de Cooper e revelam retrações."], ["Quais linfonodos devem ser palpados?", "Supraclaviculares, infraclaviculares e axilares."], ["Qual é o segredo para palpar bem a axila?", "Manter a musculatura relaxada: o examinador apoia o braço da paciente e palpa com a mão oposta, deslizando contra a parede torácica."], ["Em que posição se palpam as mamas?", "Com a paciente deitada e a mão do lado examinado atrás da cabeça, o que espalha a mama sobre a parede torácica."], ["Como deve ser a técnica de palpação das mamas?", "Com as polpas dos dedos, em pequenos círculos e três níveis de pressão, percorrendo todo o território em padrão sistemático (linhas verticais, radial ou espiral)."], ["Qual território deve ser palpado?", "Da clavícula ao sulco inframamário e da linha média esternal à linha axilar média, incluindo o prolongamento axilar."], ["Como localizar um nódulo na mama?", "Pelo quadrante ou, de forma mais precisa, pelo sistema de horário e distância do mamilo, como nódulo às 10 horas a 4 cm do mamilo."], ["Por que o mesmo horário corresponde a quadrantes diferentes em cada mama?", "Às 10 horas, o nódulo está no quadrante superior externo da mama direita, mas no quadrante superior interno da mama esquerda."], ["Como descrever um nódulo mamário?", "Localização, tamanho, forma, consistência, contornos, mobilidade, aderência à pele ou ao plano profundo e sensibilidade."], ["Como costuma ser o fibroadenoma?", "Mais comum em jovens, com pico por volta dos 20 anos: nódulo móvel, bem delimitado, fibroelástico e indolor."], ["Como costuma ser o cisto mamário?", "Mais comum entre 35 e 50 anos, pode doer e variar de tamanho com o ciclo menstrual."], ["Como costuma ser o câncer de mama ao exame?", "Nódulo endurecido, irregular, pouco móvel e indolor, com frequência maior após os 40 a 50 anos."], ["O que é o tumor phyllodes?", "Tumor que lembra o fibroadenoma, mas cresce rápido e atinge grandes dimensões, entre 30 e 50 anos."], ["Dor e mobilidade descartam câncer?", "Não. Sugerem benignidade, mas não excluem câncer. Todo achado suspeito deve seguir para exame de imagem e, se indicado, biópsia."], ["Quais secreções mamilares são suspeitas?", "Secreção espontânea, unilateral, de um único ducto, sanguinolenta ou cristalina."]], "exame-ginecologico": [["Quem deve fazer rastreamento do câncer do colo do útero?", "Pessoas com colo do útero de 25 a 64 anos que já iniciaram atividade sexual."], ["O rastreamento é indicado antes dos 25 anos?", "Não em assintomáticas de risco habitual. Imunossuprimidas (HIV, transplantadas) começam mais cedo e com intervalos menores."], ["Qual é o método primário de rastreamento pelas diretrizes de 2025?", "O teste de DNA-HPV oncogênico, em implantação progressiva no SUS."], ["Quem pode sair do rastreamento?", "Mulheres com histerectomia total por doença benigna, sem história de lesão de alto grau e com exames anteriores normais."], ["Que material separar antes do exame especular?", "Espéculo do tamanho adequado, luvas, espátula de Ayre, escova endocervical, lâmina identificada, fixador, pinça de Cheron com gaze e foco de luz."], ["Como escolher o tamanho do espéculo?", "O menor tamanho que permita visualizar bem o colo."], ["Qual a posição para o exame ginecológico?", "Posição ginecológica (litotomia), com nádegas na borda da mesa e pernas apoiadas, sempre com privacidade e acompanhante se a paciente quiser."], ["O que observar na inspeção da genitália externa?", "Distribuição dos pelos, grandes e pequenos lábios, clitóris, meato uretral, introito, glândulas de Bartholin, lesões, corrimento e prolapsos (pedir esforço)."], ["Como introduzir o espéculo?", "Afastando os pequenos lábios, introduzindo o espéculo fechado em posição oblíqua, depois girando para a posição transversa e abrindo até expor o colo."], ["Como se coleta o citopatológico?", "Primeiro a ectocérvice com a espátula de Ayre (giro de 360°), depois a endocérvice com a escova. O material é espalhado na lâmina e fixado na hora."], ["Onde fica a área mais importante a ser amostrada no Papanicolau?", "A junção escamocolunar e a zona de transformação, onde surgem as lesões causadas pelo HPV."], ["O que garante uma amostra satisfatória?", "Presença de células da zona de transformação (escamosas e glandulares ou metaplásicas), boa fixação e ausência de excesso de sangue ou inflamação que encubra as células."], ["O que avaliar no toque bimanual?", "Colo (consistência, mobilidade, dor à mobilização), útero (tamanho, posição, forma, mobilidade) e anexos (massas, dor)."], ["O que significa dor à mobilização do colo?", "Sugere processo inflamatório pélvico, como doença inflamatória pélvica, ou gravidez ectópica."], ["Quando não fazer o toque bimanual?", "Quando não há indicação clínica, quando a paciente recusa e em mulheres que nunca tiveram relação com penetração, salvo necessidade com consentimento."], ["O que se procura na colposcopia com ácido acético?", "Epitélio acetobranco e padrões vasculares em mosaico e pontilhado, sobretudo quando grosseiros."], ["O que é o teste de Schiller?", "Aplicação de lugol: o epitélio escamoso maduro, rico em glicogênio, cora de castanho-escuro. Área amarelo-clara (iodo-negativa) é suspeita."], ["O que é a junção escamocolunar?", "O encontro do epitélio pavimentoso da ectocérvice com o colunar da endocérvice. Sua posição muda com a idade e os hormônios."], ["Qual vacina previne o câncer do colo e para quem ela é oferecida no SUS?", "A vacina contra HPV, para meninas e meninos de 9 a 14 anos e grupos especiais, como imunossuprimidos."], ["O que fazer ao encontrar uma lesão visível no colo?", "Não é caso de rastreamento: encaminhar para colposcopia e biópsia, mesmo com citologia normal."]], "genitalia-masculina": [["Qual o comprimento e as porções da uretra masculina?", "Cerca de 20 cm, com as porções prostática, membranosa e esponjosa."], ["O que avaliar na inspeção do pênis?", "Pele e pelos (distribuição, lesões, parasitas, sinais inflamatórios), prepúcio (retração), glande e posição e aspecto do meato uretral."], ["O que é fimose e o que é parafimose?", "Fimose é a impossibilidade de retrair o prepúcio. Parafimose é o prepúcio retraído que não volta, garroteando a glande, uma urgência."], ["Qual é o volume testicular normal do adulto?", "Maior que 15 mL. Testículos pequenos sugerem hipogonadismo, dano testicular ou atraso puberal."], ["O que palpar na bolsa escrotal?", "Testículos (tamanho, consistência, nódulos), epidídimos (posteriores e superiores) e funículo espermático com o ducto deferente."], ["Como se reconhece o ducto deferente na palpação?", "É um cordão liso e firme dentro do funículo, diferente das veias, palpado entre o polegar e o indicador do epidídimo até o anel inguinal."], ["Como a manobra de Valsalva ajuda no exame escrotal?", "Aumenta o enchimento venoso: veias dilatadas no funículo com aspecto de saco de vermes sugerem varicocele."], ["Para que serve a transiluminação?", "Para diferenciar conteúdo líquido de sólido. Hidrocele transilumina; tumor e hérnia com alça não."], ["Como diferenciar epididimite de torção testicular?", "Na epididimite a elevação do testículo alivia a dor (Prehn positivo) e há febre ou sintomas urinários. Na torção a dor é súbita, o testículo fica alto e horizontal, sem reflexo cremastérico, e a elevação não alivia."], ["Por que a torção testicular é urgência?", "Porque a viabilidade do testículo cai rapidamente após algumas horas de isquemia."], ["Qual o achado sugestivo de tumor testicular?", "Nódulo endurecido, indolor, dentro do testículo, em homem jovem. Fatores de risco: criptorquidia, câncer contralateral e história familiar."], ["Como pesquisar hérnias inguinais?", "Com o dedo invaginando a pele do escroto até o anel inguinal superficial, pedindo para o paciente tossir ou fazer força, de pé."], ["Qual a posição mais usada no toque retal?", "A de Sims: decúbito lateral esquerdo com a coxa direita fletida. A genupeitoral expõe melhor, mas é menos confortável."], ["O que avaliar na inspeção perianal?", "Fissuras, fístulas, hemorroidas externas, plicomas, lesões e sinais inflamatórios, pedindo também esforço evacuatório."], ["Como se introduz o dedo no toque retal?", "Com luva e lubrificante, apoiando a polpa no ânus, pedindo que o paciente faça força como para evacuar e introduzindo devagar quando o esfíncter relaxa."], ["Onde está a próstata no toque retal?", "Na parede anterior do reto, a cerca de 5 cm da borda anal. Avisar que pode dar vontade de urinar."], ["Como é a próstata normal ao toque?", "Do tamanho e forma de uma castanha, consistência fibroelástica, superfície lisa, com dois lobos laterais e um sulco mediano palpável, indolor."], ["O que sugere próstata pétrea e irregular?", "Câncer de próstata. Próstata aumentada, lisa e elástica sugere HPB; muito dolorosa e quente, prostatite."], ["O que fazer ao retirar o dedo no toque retal?", "Inspecionar a luva (sangue, muco, aspecto das fezes) e oferecer papel ou toalha ao paciente."], ["O toque retal e o PSA devem ser feitos em todos os homens?", "Não há rastreamento populacional recomendado. A decisão é compartilhada, considerando idade, risco, expectativa de vida e benefícios e danos."]], "paciente-360": [["Como é organizado o registro no modelo SOAP?", "Subjetivo (queixa, história, fatores de risco, medos), Objetivo (exame físico e exames), Avaliação (hipótese e raciocínio) e Plano (exames, tratamento, orientações e seguimento)."], ["Qual o primeiro componente do Método Clínico Centrado na Pessoa?", "Explorar a saúde, a doença e a experiência da doença: medos, expectativas, significados e impacto na vida."], ["Como o BI-RADS orienta a conduta?", "0: completar avaliação. 1 e 2: rotina. 3: controle em 6 meses. 4 e 5: biópsia. 6: malignidade já comprovada."], ["Um BI-RADS 1 ou 2 encerra a investigação de um nódulo clinicamente suspeito?", "Não. O BI-RADS é a linguagem do laudo e não substitui a avaliação clínica nem o diagnóstico histológico."], ["Qual a idade típica de fibroadenoma, cisto e câncer de mama?", "Fibroadenoma em jovens, cistos entre 35 e 50 anos e câncer com aumento após os 40 a 50 anos."], ["Lesão vegetante e friável no colo vista no especular: qual a conduta?", "Lesão visível não é rastreamento: a prioridade é a confirmação histológica, com colposcopia e biópsia."], ["Lesão restrita ao colo, de 2 a 4 cm, sem linfonodos: qual o estádio FIGO?", "Estádio IB2."], ["Qual protocolo usar para comunicar uma notícia difícil?", "O SPIKES: preparar o ambiente, perceber o que a paciente sabe, pedir permissão, transmitir o conhecimento, acolher as emoções e resumir com um plano."], ["Quais são as queixas típicas da endometriose?", "Dismenorreia progressiva, dor pélvica crônica, dispareunia profunda, sintomas intestinais ou urinários cíclicos e infertilidade."], ["Como os miomas são classificados pela FIGO?", "De 0 a 8 conforme a relação com a cavidade e a parede: 0 a 2 submucosos, 3 a 5 intramurais, 6 e 7 subserosos e 8 em outras localizações."], ["Quais miomas mais causam sangramento uterino anormal?", "Os submucosos (FIGO 0 a 2), que deformam a cavidade endometrial."], ["Como se apresenta a síndrome climatérica na consulta?", "Fogachos, sudorese noturna, insônia, alterações de humor, irregularidade menstrual e sintomas geniturinários, em mulher por volta dos 45 a 55 anos."], ["Como diferenciar cistite de pielonefrite?", "Cistite tem disúria, frequência, urgência e dor suprapúbica sem febre. Pielonefrite acrescenta febre, calafrios, dor lombar, náuseas e Giordano positivo."], ["O sinal de Giordano é específico de pielonefrite?", "Não. É sensível, mas pouco específico, pois também aparece na litíase e em dores musculares."], ["Quando a infecção urinária exige internação?", "Na presença de sepse, vômitos que impeçam a medicação oral, gestação ou obstrução."], ["Bacteriúria assintomática deve ser tratada?", "Fora da gestação, não. Na gestante, sim."], ["Como é a cólica renal e qual o exame padrão?", "Dor súbita e intensa no flanco, em cólica, sem posição de alívio, irradiando para virilha e genitais, com náuseas e hematúria. O exame padrão é a tomografia sem contraste."], ["Quando a litíase urinária exige desobstrução de urgência?", "Quando há febre com obstrução, anúria ou rim único."], ["Como diferenciar uretrite gonocócica de não gonocócica?", "A gonocócica tem início agudo e secreção purulenta abundante. A não gonocócica (clamídia) tem secreção escassa e mucoide."], ["Quem deve ser avaliado e tratado em um caso de uretrite?", "As parcerias sexuais dos últimos 60 dias, além de testar o paciente para HIV, sífilis e hepatites."], ["O que é a doença inflamatória pélvica?", "Infecção ascendente do trato genital superior, geralmente por gonococo, clamídia e anaeróbios, diagnosticada por critérios clínicos (dor pélvica com dor à mobilização do colo e dos anexos)."]], "sondagem-vesical": [["Qual a diferença entre sondagem de alívio e de demora?", "Na de alívio usa-se cateter sem balão (Nelaton), retirado após esvaziar a bexiga. Na de demora usa-se o cateter de Foley, com balão, que fica no lugar."], ["Qual é a principal contraindicação da sondagem uretral?", "A suspeita de lesão uretral: sangue no meato, hematoma escrotal, perineal ou peniano, ou próstata alta ao toque após trauma."], ["O que fazer se houver suspeita de lesão uretral?", "Não passar a sonda, que pode transformar lesão parcial em completa. Pedir avaliação urológica e, se necessário, fazer cistostomia suprapúbica."], ["O câncer de próstata contraindica a sondagem?", "Não, por si só não contraindica."], ["Qual a capacidade da bexiga e a produção diária de urina?", "A bexiga comporta cerca de 350 a 500 mL e os rins produzem em torno de 1.500 mL de urina por dia."], ["Como se mede o calibre do cateter e quais calibres usar?", "Em French (Fr), cada unidade equivale a cerca de 0,33 mm. Adultos: 12 a 24 Fr; crianças: 6 a 12 Fr. Na estação, a referência é 12 a 14 Fr."], ["Quanto mede a uretra feminina e onde fica o meato?", "Cerca de 3,5 a 4 cm. O meato fica no vestíbulo, entre os pequenos lábios, acima do óstio vaginal."], ["Por que a infecção urinária é mais comum na mulher?", "Pela uretra curta e pela proximidade com o ânus."], ["Por que posicionar o pênis a 90 graus na sondagem masculina?", "Para retificar a uretra e facilitar a passagem pela curvatura e pela transição bulbomembranosa, junto ao esfíncter externo."], ["Que material preparar para a sondagem de demora?", "Material de higiene íntima, antisséptico (clorexidina ou PVPI), luvas estéreis, gorro, máscara e óculos, lidocaína gel a 2%, seringa com água destilada para o balão, cateter, bolsa coletora e fita para fixar."], ["Como se prepara o paciente?", "Identificação dupla (nome e data de nascimento), explicação do procedimento, consentimento, privacidade e higiene íntima antes da antissepsia."], ["Com que líquido se insufla o balão e por quê?", "Com água destilada. Soro fisiológico pode cristalizar e impedir o esvaziamento do balão depois."], ["Quando insuflar o balão na sondagem masculina?", "Só depois que a urina refluir e o cateter estiver introduzido quase até o fim, para não insuflar o balão na uretra."], ["O que fazer se a sonda entrar na vagina na sondagem feminina?", "Deixá-la ali como referência e passar uma nova sonda estéril no meato, logo acima."], ["Como se fixa a sonda?", "Na mulher, na face interna da coxa. No homem, no abdome ou na coxa, evitando tração e lesão da uretra. A bolsa fica abaixo do nível da bexiga e fora do chão."], ["O que registrar após a sondagem?", "Data e hora, indicação, tipo e calibre do cateter, volume do balão, volume e aspecto da urina drenada, intercorrências e responsável."], ["Quais são as complicações mecânicas da sondagem?", "Resistência à passagem, falso trajeto, balão inflado na uretra, inserção na vagina, lesão uretral, retirada traumática e parafimose."], ["Qual é a complicação clínica mais comum da sonda vesical?", "A infecção urinária. Também ocorrem hematúria, disúria, espasmos vesicais, obstrução e retenção após a retirada."], ["Como prevenir infecção na sonda de demora?", "Técnica asséptica, sistema fechado, bolsa abaixo da bexiga, higiene diária do meato e retirada assim que a sonda deixar de ser necessária."], ["Como retirar a sonda de demora?", "Explicar o procedimento, esvaziar totalmente o balão aspirando com seringa e tracionar de forma contínua e delicada. Depois, aguardar a diurese espontânea."]]};
function fcShuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function fcEsc(s){ return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function flashRender(host, id, titulo){
  const all = FLASH[id] || [];
  let deck = [], i = 0;
  host.innerHTML = `<div class="fc"><div class="fc-k">Flashcards · ${fcEsc(titulo)}</div>
    <p class="fc-intro" style="margin-top:10px">${all.length} cartões sobre este tema. A cada clique em “Gerar flashcards” eles vêm em uma ordem diferente. Toque no cartão para ver a resposta.</p>
    <button class="fc-gen" type="button">Gerar flashcards</button><div class="fc-run"></div></div>`;
  const run = host.querySelector(".fc-run"), gen = host.querySelector(".fc-gen");
  function draw(){
    if (i >= deck.length){
      run.innerHTML = `<div class="fc-end"><b>Fim do baralho.</b><span class="fc-intro">Você passou pelos ${deck.length} cartões. Gere de novo para embaralhar.</span></div>`;
      gen.textContent = "Gerar flashcards de novo"; return;
    }
    const [q, a] = deck[i];
    run.innerHTML = `<div class="fc-card" tabindex="0" role="button" aria-label="Virar cartão"><div class="fc-in">
        <div class="fc-face fc-front"><span class="lab">Pergunta</span><span class="tx">${fcEsc(q)}</span><span class="hint">Toque para ver a resposta</span></div>
        <div class="fc-face fc-back"><span class="lab">Resposta</span><span class="tx">${fcEsc(a)}</span><span class="hint">Toque para voltar à pergunta</span></div></div></div>
      <div class="fc-bar"><button class="ghost fc-prev" type="button">← Anterior</button><span class="fc-cnt">${i + 1} de ${deck.length}</span><button class="ghost fc-next" type="button">Próximo →</button></div>
      <div class="fc-prog"><i style="width:${(i + 1) / deck.length * 100}%"></i></div>`;
    const card = run.querySelector(".fc-card");
    const flip = ()=>card.classList.toggle("flip");
    card.addEventListener("click", flip);
    card.addEventListener("keydown", e=>{ if (e.key === " " || e.key === "Enter"){ e.preventDefault(); flip(); } });
    run.querySelector(".fc-prev").disabled = i === 0;
    run.querySelector(".fc-prev").addEventListener("click", ()=>{ if (i > 0){ i--; draw(); } });
    run.querySelector(".fc-next").addEventListener("click", ()=>{ i++; draw(); });
    card.focus({preventScroll:true});
  }
  gen.addEventListener("click", ()=>{ deck = fcShuffle(all); i = 0; host.querySelector(".fc-intro").hidden = true; gen.textContent = "Embaralhar de novo"; draw(); });
}
document.addEventListener("keydown", e=>{
  const run = document.querySelector(".fc-run"); if (!run || !run.offsetParent) return;
  if (e.key === "ArrowRight") run.querySelector(".fc-next")?.click();
  if (e.key === "ArrowLeft") run.querySelector(".fc-prev")?.click();
});

let regObs = null, onScrollPill = null;
addEventListener("scroll", ()=>{ if (onScrollPill) onScrollPill(); }, {passive:true});
function openT(id, modo){
  $("regPill").hidden = true; $("regPill").classList.add("off"); onScrollPill = null; if (regObs) { regObs.disconnect(); regObs = null; }
  const t = TEMAS.find(x=>x.id===id); if (!t) return;
  const doc = $("doc"); doc.className = "doc notion";
  doc.innerHTML = `<header class="doc-head"><div class="kicker">Habilidades médicas</div><h1></h1></header>
    <div class="seg" role="group" aria-label="Modelo"><button type="button" data-m="teoria"><span class="lg">Referencial teórico</span><span class="sm">Teoria</span></button><button type="button" data-m="guia"><span class="lg">Passo a passo do atendimento</span><span class="sm">Passo a passo</span></button><button type="button" data-m="flash">Flashcards</button></div>
    <div id="pane"></div>`;
  doc.querySelector("h1").textContent = t.nome;
  doc.querySelectorAll(".seg button").forEach(b=>{ b.setAttribute("aria-pressed", b.dataset.m === modo ? "true" : "false"); b.addEventListener("click", ()=>openT(id, b.dataset.m)); });
  const pane = doc.querySelector("#pane");
  if (modo === "flash"){
    pane.className = "fcpane"; flashRender(pane, t.id, t.nome); toc([]);
  } else if (modo === "teoria"){
    pane.className = "teoria"; pane.innerHTML = t.teoria; renderCaiu(pane, t); placeVideos(pane, t, "teoria");
    toc([...pane.querySelectorAll("h2,h3")].map(h=>[h.textContent, h.tagName.toLowerCase(), h]));
  } else {
    const g = t.guia; const st = ck[t.id] || (ck[t.id] = {});
    const ITEMS = {};
    let html = `<p class="guide-intro">${esc(g.intro)}</p><div class="gprog"><span class="track"><i class="fill"></i></span><span class="txt"></span></div>`;
    g.etapas.forEach((e,i)=>{
      html += `<section class="etapa${e.alerta ? " alerta" : ""}"${e.registro ? ' id="regSec"' : ""}><h2>${e.alerta ? "" : `<span class="n">${String(i+1).padStart(2,"0")}</span>`}${esc(e.registro ? "Registro do atendimento" : e.titulo)}</h2>`;
      e.itens.forEach((it,j)=>{ const k = i + "." + j; if (it[2]) ITEMS[k] = it[2];
        const on = !!st[k];
        html += `<div class="citem"><label class="check${on ? " done" : ""}" data-k="${k}"><input type="checkbox"${on ? " checked" : ""}${e.alerta ? " disabled" : ""}><span><span class="t">${esc(it[0])}</span><span class="d">${esc(it[1])}</span></span></label>${it[2] ? `<div class="rg" data-k="${k}" hidden></div>` : ""}</div>`; });
      if (e.registro) html += `<p class="guide-intro">Marque os itens do roteiro e o registro se monta aqui. Cada item entra como normal; toque em <b>Alterado</b> para escolher ou escrever o achado e complete os campos <span class="reg-legend"><span class="blank">___</span></span>.</p>
        <div class="reg-out" id="regOut"></div>
        <div class="reg-actions"><button class="ghost" id="regCopy" type="button">Copiar texto</button><button class="ghost" id="regEx" type="button" aria-expanded="false">Ver exemplo de exame normal</button></div>
        <div class="registro reg-ex" id="regExBox" hidden>${esc(e.registro)}</div>`;
      html += `</section>`;
    });
    html += `<div class="reset-row"><button class="ghost" id="resetCk" type="button">Recomeçar checklist</button></div><p class="fontes">${esc(g.fontes)}</p>`;
    pane.className = "guia"; pane.innerHTML = html;

    /* estado de cada item: 1 (normal, legado) ou {m:"n"|"a", i:opção, t:texto editado} */
    const optOf = (r,i)=>{ const o = (r.a || [])[i || 0]; return Array.isArray(o) ? {l:o[0], t:o[1]} : {l:o, t:o}; };
    const stOf = k => (st[k] && typeof st[k] === "object") ? st[k] : {m:"n"};
    const textOf = k => { const r = ITEMS[k], s = stOf(k); if (s.t != null) return s.t; return s.m === "a" ? optOf(r, s.i).t : r.n; };
    const grow = ta => { ta.style.height = "auto"; ta.style.height = ta.scrollHeight + "px"; };
    function drawEd(k){
      const box = pane.querySelector(`.rg[data-k="${k}"]`); if (!box) return;
      if (!st[k]){ box.hidden = true; box.innerHTML = ""; return; }
      const r = ITEMS[k], s = stOf(k); box.hidden = false; box.classList.toggle("alt", s.m === "a");
      let h = "";
      if (r.a) h += `<div class="seg" role="group" aria-label="Achado"><button type="button" data-m="n" aria-pressed="${s.m !== "a"}">Normal</button><button type="button" data-m="a" aria-pressed="${s.m === "a"}">Alterado</button></div>`;
      if (r.a && s.m === "a" && r.a.length > 1) h += `<div class="rg-opts">${r.a.map((o,i)=>`<button type="button" data-i="${i}" aria-pressed="${(s.i||0) === i}">${esc(optOf(r,i).l.length > 46 ? optOf(r,i).l.slice(0,44) + "…" : optOf(r,i).l)}</button>`).join("")}</div>`;
      h += `<textarea rows="1" aria-label="Texto do registro"></textarea>`;
      if (!r.a && /___/.test(r.n)) h += `<span class="hint">Complete os campos ___ com os dados do paciente.</span>`;
      box.innerHTML = h;
      const ta = box.querySelector("textarea"); ta.value = textOf(k); requestAnimationFrame(()=>grow(ta));
      ta.addEventListener("input", ()=>{ const s2 = stOf(k); s2.t = ta.value; st[k] = s2; grow(ta); saveCk(); drawReg(); });
      box.querySelectorAll(".seg button").forEach(b=>b.addEventListener("click", ()=>{ st[k] = {m:b.dataset.m, i:0}; saveCk(); drawEd(k); drawReg(); }));
      box.querySelectorAll(".rg-opts button").forEach(b=>b.addEventListener("click", ()=>{ st[k] = {m:"a", i:+b.dataset.i}; saveCk(); drawEd(k); drawReg(); }));
    }
    const lista = a => a.length < 2 ? a.join("") : a.slice(0,-1).join(", ") + " e " + a[a.length-1];
    function compor(){
      const secs = {};
      Object.keys(ITEMS).filter(k=>st[k]).sort((x,y)=>{ const [a1,b1] = x.split(".").map(Number), [a2,b2] = y.split(".").map(Number); return a1-a2 || b1-b2; }).forEach(k=>{
        const r = ITEMS[k], s = stOf(k), txt = textOf(k).trim(); if (!txt) return;
        (secs[r.s] = secs[r.s] || []).push({t:txt, alt:s.m === "a", g:(s.m !== "a" && s.t == null) ? r.g : null});
      });
      const out = [];
      (g.secoes || Object.keys(secs)).forEach(nome=>{
        const es = secs[nome]; if (!es) return;
        const frases = [];
        for (let i = 0; i < es.length; i++){
          const e = es[i];
          if (e.g){ const grp = [e]; while (es[i+1] && es[i+1].g && es[i+1].g[0] === e.g[0]) grp.push(es[++i]);
            if (grp.length > 1){ const nomes = grp.flatMap(x=>x.g[1].split(", "));
              frases.push({t: e.g[0] === "neg" ? `Sinais de ${lista(nomes)} negativos.` : `Reflexos de ${lista(nomes)} adequados para a idade.`}); continue; } }
          frases.push(e);
        }
        out.push({nome, frases});
      });
      return out;
    }
    function drawReg(){
      const el = pane.querySelector("#regOut"); if (!el) return;
      const secs = compor(); const pill = $("regPill");
      const n = secs.reduce((a,s)=>a + s.frases.length, 0);
      pill.textContent = n ? `Ver registro · ${n}` : "Ver registro";
      if (!secs.length){ el.innerHTML = `<p class="empty">O registro aparece aqui conforme você marca os itens do roteiro.</p>`; return; }
      const fmt = s => esc(s).replace(/_{3,}/g, '<span class="blank">___</span>');
      el.innerHTML = secs.map(s=>`<p><b>${esc(s.nome)}:</b> ${s.frases.map(f=>f.alt ? `<span class="alt">${fmt(f.t)}</span>` : fmt(f.t)).join(" ")}</p>`).join("");
    }
    const regTexto = ()=>compor().map(s=>`${s.nome}: ${s.frases.map(f=>f.t).join(" ")}`).join("\n");

    const boxes = [...pane.querySelectorAll(".etapa:not(.alerta) .check")];
    const paint = ()=>{ const n = boxes.filter(b=>st[b.dataset.k]).length; pane.querySelector(".fill").style.width = (boxes.length ? n/boxes.length*100 : 0) + "%"; pane.querySelector(".gprog .txt").textContent = `${n} de ${boxes.length} passos feitos`; };
    boxes.forEach(b=>b.querySelector("input").addEventListener("change", ev=>{ const k = b.dataset.k; if (ev.target.checked) st[k] = 1; else delete st[k]; b.classList.toggle("done", ev.target.checked); saveCk(); paint(); drawEd(k); drawReg(); }));
    Object.keys(ITEMS).forEach(drawEd);
    pane.querySelector("#resetCk").addEventListener("click", ()=>{ ck[t.id] = {}; saveCk(); openT(id, "guia"); });
    const cp = pane.querySelector("#regCopy");
    if (cp) cp.addEventListener("click", async ()=>{ const txt = regTexto(); if (!txt) return; try { await navigator.clipboard.writeText(txt); cp.textContent = "Copiado ✓"; } catch(e){ cp.textContent = "Não foi possível copiar"; } setTimeout(()=>cp.textContent = "Copiar texto", 1600); });
    const ex = pane.querySelector("#regEx");
    if (ex) ex.addEventListener("click", ()=>{ const b = pane.querySelector("#regExBox"); b.hidden = !b.hidden; ex.setAttribute("aria-expanded", String(!b.hidden)); ex.textContent = b.hidden ? "Ver exemplo de exame normal" : "Ocultar exemplo"; });
    placeVideos(pane, t, "guia");
    paint(); drawReg();
    const pill = $("regPill"), sec = pane.querySelector("#regSec");
    if (sec){ pill.hidden = false; pill.onclick = ()=>sec.scrollIntoView({behavior:"smooth", block:"start"});
      onScrollPill = ()=>{ const r = sec.getBoundingClientRect(); pill.classList.toggle("off", scrollY < 200 || r.top < innerHeight * .85); };
      onScrollPill();
    }
    toc([...pane.querySelectorAll(".etapa h2")].map(h=>[h.textContent.replace(/^\d\d/, ""), "h2", h]));
  }
  $("lib").hidden = true; $("reader").hidden = false; window.scrollTo({top:0});
}
$("backLib").addEventListener("click", ()=>{ $("regPill").hidden = true; onScrollPill = null; $("reader").hidden = true; $("lib").hidden = false; window.scrollTo({top:0}); });
$("tocBtn").addEventListener("click", ()=>{ const o = $("toc").classList.toggle("open"); $("tocBtn").setAttribute("aria-expanded", o ? "true" : "false"); });
</script>
</body>
</html>
