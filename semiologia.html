 ___.", "Refere ___ (cefaleia / escotomas / dor epigástrica)."]}]]}, {"titulo": "Exame obstétrico", "itens": [["Altura uterina", "Medir da borda superior da sínfise ao fundo uterino e comparar com a idade gestacional.", {"s": "Exame obstétrico", "n": "Altura uterina de ___ cm, compatível com a idade gestacional.", "a": ["Altura uterina de ___ cm, ___ (acima / abaixo) do esperado para a idade gestacional."]}], ["Manobras de Leopold", "1ª: o que ocupa o fundo uterino. 2ª: palpação dos flancos para localizar o dorso fetal (posição). 3ª: polo que se apresenta e sua mobilidade. 4ª: grau de penetração da apresentação na pelve (insinuação).", {"s": "Exame obstétrico", "n": "Feto em situação longitudinal, apresentação cefálica, dorso à ___.", "a": ["Situação ___ (longitudinal / transversa / oblíqua), apresentação ___ (pélvica / córmica), dorso à ___."]}], ["Batimentos cardíacos fetais", "Auscultar no foco correspondente ao dorso fetal, por 1 minuto, logo após uma contração. Normal: 110 a 160 bpm.", {"s": "Exame obstétrico", "n": "BCF ___ bpm, rítmicos, após a contração.", "a": ["BCF ___ bpm, com ___ (desacelerações tardias / bradicardia / taquicardia)."]}], ["Dinâmica uterina", "Mão espalmada no fundo uterino por 10 minutos: número de contrações, duração e intensidade. Padrão efetivo: 2 ou mais contrações em 10 minutos.", {"s": "Exame obstétrico", "n": "Dinâmica uterina: ___ contrações de ___ segundos em 10 minutos."}]]}, {"titulo": "Toque vaginal", "itens": [["Explicar e pedir consentimento antes do toque", "Fazer com técnica asséptica e somente quando necessário.", null], ["Avaliar o colo", "Dilatação (cm), apagamento, consistência e posição.", {"s": "Toque vaginal", "n": "Colo ___ (posterior / centralizado), ___ (amolecido / firme), apagado ___%, dilatado ___ cm."}], ["Avaliar a apresentação", "Tipo de apresentação, altura pelos planos de De Lee e variedade de posição pelas fontanelas e pela sutura sagital.", {"s": "Toque vaginal", "n": "Apresentação cefálica no plano ___ de De Lee, variedade de posição ___."}], ["Avaliar a bolsa e o líquido", "Bolsa íntegra ou rota; se rota, aspecto do líquido. Na suspeita de rotura sem confirmação, fazer exame especular antes do toque.", {"s": "Toque vaginal", "n": "Bolsa íntegra.", "a": ["Bolsa rota, líquido ___ (claro / meconial ___ / sanguinolento)."]}]]}, {"titulo": "Decisão e registro", "itens": [["Definir a fase do trabalho de parto", "Fase latente: contrações dolorosas com modificações iniciais do colo. Fase ativa: contrações regulares (2 a 3 em 10 minutos) e dilatação de pelo menos 5 cm.", {"s": "Conduta", "n": "Fase ___ (latente / ativa) do trabalho de parto."}], ["Abrir o partograma na fase ativa", "Marcar a dilatação (triângulo), a altura da apresentação (círculo), os BCF e as contrações; traçar as linhas de alerta e de ação a partir da primeira dilatação.", {"s": "Conduta", "n": "Partograma aberto às ___ h."}], ["Programar as reavaliações", "BCF a cada 30 minutos na fase ativa e a cada 5 minutos no período expulsivo; contrações a cada 30 minutos; pulso a cada hora; PA e temperatura a cada 4 horas; toque vaginal a cada 4 horas ou quando houver indicação (diretriz do Ministério da Saúde).", {"s": "Conduta", "n": "Reavaliações programadas conforme as diretrizes do Ministério da Saúde."}]]}, {"titulo": "Sinais de alerta", "alerta": true, "itens": [["BCF fora de 110–160 bpm ou com desacelerações", "Sinal de possível sofrimento fetal: avaliação imediata."], ["Líquido meconial espesso ou sangramento importante", "Investigar sofrimento fetal, descolamento de placenta ou placenta prévia."], ["PA ≥ 140/90 mmHg ou sintomas de pré-eclâmpsia", "Cefaleia, escotomas, dor epigástrica."], ["Febre materna", "Suspeitar de infecção intraparto (corioamnionite)."], ["Curva de dilatação que ultrapassa a linha de ação", "Parada de progressão: reavaliar o caso."], ["Prolapso de cordão ou apresentação anômala", "Situação de urgência obstétrica."]]}, {"titulo": "Registro (exemplo)", "registro": "Gestante de 39 semanas, G2P1 (1 parto vaginal), em bom estado geral. PA 110/70 mmHg, pulso 84 bpm, temperatura 36,6 °C. Altura uterina de 36 cm. Feto em situação longitudinal, apresentação cefálica, dorso à esquerda. BCF 140 bpm, rítmicos, após a contração. Dinâmica uterina: 3 contrações de 45 segundos em 10 minutos. Toque vaginal: colo apagado 80%, dilatado 6 cm, centralizado; apresentação cefálica no plano −1 de De Lee, variedade OEA; bolsa íntegra. Fase ativa do trabalho de parto: partograma aberto.", "itens": []}], "fontes": "Elaborado a partir do seu material de estudo (Rezende Obstetrícia Fundamental), com base nas Diretrizes Nacionais de Assistência ao Parto Normal do Ministério da Saúde e nas recomendações da OMS (2018).", "secoes": ["Identificação", "Anamnese", "Exame geral", "Exame obstétrico", "Toque vaginal", "Conduta"]}, "videos": [{"id": "1mpyA3ha-F_btrziAw7uyVfvI-LCKmjYN", "nome": "Palpação do fundo uterino", "teoria": "Objeto: estática fetal", "guia": "Exame obstétrico"}, {"id": "14SCUPAO5lbS6ErR74NLipNSNpEKDu3rI", "nome": "Altura uterina na gestante", "teoria": "Objeto: estática fetal", "guia": "Exame obstétrico"}, {"id": "1G2BpUx6XQB0_ZKIghus0CyUFBFHaWryC", "nome": "Batimentos cardíacos fetais", "teoria": "Batimentos cardíacos fetais e contrações", "guia": "Exame obstétrico"}]}, {"id": "abdomen-agudo", "nome": "Abdômen agudo", "resumo": "Os cinco tipos de abdômen agudo, inspeção, ausculta, percussão, palpação e as manobras de irritação peritoneal.", "teoria": "<p class=\"\"><em>Referência: Porto 9 ed, capítulo 95 <\/em><\/p><h2 class=\"\">Anamnese<\/h2><p class=\"\">Antes de perguntar a queixa principal, o autor sugere começar entendendo as razões que o levaram a procurar o atendimento médico, em seguida, explorar os encadeamentos dos fatos desde o inicio dos sintomas até o presente, incluindo circunstancias, habitos de vida, e doenças associasdas, medicamentos de uso continuo, consumo de drogas ilicitas ou licitas.<\/p><p class=\"\">Se a dor for realmente a principal queixa - distinguir a forma aguda da crônica <\/p><p class=\"\">Analisar inicio súbito, intensidade, localização nos quadrantes irradiação e associação com náuseas e vômitos  e verificar fatores de piora ou melhora como postura, compressão no local.<\/p><p class=\"\">Os sintomas dolorosos de inicio recente configuram o quadro de <strong>abdômen agudo, <\/strong>que é uma síndrome dolorosa de inicio súbito.<\/p><h3 class=\"\">Sao 5 tipos básicos de sintomas associados a aos tipos: <\/h3><p class=\"block-color-red_background\" data-notion-highlight=\"red_background\"><strong>Inflamatório → irritação peritoneal localizada<\/strong><\/p><ul class=\"bulleted-list\"><li style=\"list-style-type:disc\">Apendicite, colecistite, pancreatite, diverticulite etc.<\/li><\/ul><p class=\"block-color-yellow_background\" data-notion-highlight=\"yellow_background\"><strong>Obstrutivo → dor em cólica, distensão abdominal<\/strong><\/p><ul class=\"bulleted-list\"><li style=\"list-style-type:disc\">Bridas intestinais<\/li><\/ul><ul class=\"bulleted-list\"><li style=\"list-style-type:disc\">Hérnia encarcerada<\/li><\/ul><p class=\"block-color-teal_background\" data-notion-highlight=\"teal_background\"><strong>Perfurativo → dor súbita, intensa e difusa (evolui com peritonite)<\/strong><\/p><ul class=\"bulleted-list\"><li style=\"list-style-type:disc\">Úlcera péptica perfurada<\/li><\/ul><p class=\"block-color-blue_background\" data-notion-highlight=\"blue_background\"><strong>Hemorrágico → sinais de choque hipovolêmico<\/strong><\/p><ul class=\"bulleted-list\"><li style=\"list-style-type:disc\">Gravidez ectópica rota<\/li><\/ul><ul class=\"bulleted-list\"><li style=\"list-style-type:disc\">Traumatismo abdominal<\/li><\/ul><p class=\"block-color-purple_background\" data-notion-highlight=\"purple_background\"><strong>Vascular → dor intensa desproporcional ao exame físico, sem irritação peritoneal inicial<\/strong><\/p><ul class=\"bulleted-list\"><li style=\"list-style-type:disc\">Trombose mesentérica<\/li><\/ul><ul class=\"bulleted-list\"><li style=\"list-style-type:disc\">Aneurisma de aorta abdominal<\/li><\/ul><h2 class=\"\">Inspeção <\/h2><p class=\"\">Examinar sempre em pé, depois deitado, afim de encontrar qualquer abaulamento, cicatrizes, lesões cutâneas. <\/p><p class=\"\">Movimentações de peristaltismo visível ou pulsação anormal. <\/p><p class=\"\">Definir o tipo de abdômen → Globoso, plano, distendido. <\/p><p class=\"\">Algumas manobras intra-Abdominais (PIA) devem ser realizadas para verificação de hernias. <\/p><p class=\"block-color-orange_background\" data-notion-highlight=\"orange_background\">Manobra valsava → soprar o dorso da mão sem deixar o ar escapar <\/p><p class=\"\">Observar: <\/p><ul class=\"bulleted-list\"><li style=\"list-style-type:disc\">Linha mediana supraumbilical <\/li><\/ul><ul class=\"bulleted-list\"><li style=\"list-style-type:disc\">Virília<\/li><\/ul><ul class=\"bulleted-list\"><li style=\"list-style-type:disc\">Base das coxas<\/li><\/ul><ul class=\"bulleted-list\"><li style=\"list-style-type:disc\">Flancos e dorso <\/li><\/ul><p class=\"block-color-blue_background\" data-notion-highlight=\"blue_background\">Flexão cervical → Olhando para a ponta dos pés sem levantar o tronco. <\/p><h2 class=\"\">Ausculta <\/h2><p class=\"\">A ausculta registra a intensidade do peristaltismo na região auscultada. <br/><\/p><p class=\"block-color-brown_background\" data-notion-highlight=\"brown_background\">Obstrutivo → RHA ↑ (metálicos) → depois ↓<\/p><ul class=\"bulleted-list\"><li style=\"list-style-type:disc\"><strong>Início (↑):<\/strong> o intestino tenta <strong>vencer a obstrução<\/strong>, aumentando o peristaltismo → mais ruídos, mais intensos e agudos (“metálicos”).<\/li><\/ul><ul class=\"bulleted-list\"><li style=\"list-style-type:disc\"><strong>Depois (↓):<\/strong> com o tempo, ocorre <strong>fadiga da musculatura intestinal<\/strong> e distensão → o peristaltismo cai → RHA diminuem ou desaparecem.<\/li><\/ul><p class=\"block-color-teal_background\" data-notion-highlight=\"teal_background\">Inflamatório → RHA ↓<\/p><ul class=\"bulleted-list\"><li style=\"list-style-type:disc\">A inflamação causa <strong>irritação do peritônio<\/strong> → desencadeia um <strong>íleo reflexo<\/strong> (inibição do movimento intestinal).<\/li><\/ul><ul class=\"bulleted-list\"><li style=\"list-style-type:disc\">Resultado: redução do peristaltismo → RHA diminuídos.<\/li><\/ul><p class=\"block-color-orange_background\" data-notion-highlight=\"orange_background\">Perfurativo → RHA ausentes<\/p><ul class=\"bulleted-list\"><li style=\"list-style-type:disc\">A perfuração leva rapidamente a Peritonite<\/li><\/ul><ul class=\"bulleted-list\"><li style=\"list-style-type:disc\">Isso provoca <strong>íleo paralítico intenso<\/strong> → o intestino “para” → <strong>abdome silencioso<\/strong>.<\/li><\/ul><p class=\"block-color-blue_background\" data-notion-highlight=\"blue_background\">Hemorrágico → RHA ↓<\/p><ul class=\"bulleted-list\"><li style=\"list-style-type:disc\">O sangramento leva a <strong>hipovolemia e hipoperfusão intestinal<\/strong><\/li><\/ul><ul class=\"bulleted-list\"><li style=\"list-style-type:disc\">Menos fluxo sanguíneo → menor atividade metabólica e motilidade → RHA diminuídos.<\/li><\/ul><p class=\"block-color-purple_background\" data-notion-highlight=\"purple_background\">Vascular → início normal → depois ↓<\/p><ul class=\"bulleted-list\"><li style=\"list-style-type:disc\"><strong>Início:<\/strong> ainda não há comprometimento significativo da motilidade → RHA podem ser normais<\/li><\/ul><ul class=\"bulleted-list\"><li style=\"list-style-type:disc\"><strong>Evolução:<\/strong> a <strong>isquemia intestinal<\/strong> compromete a função → reduz o peristaltismo → RHA diminuem ou desaparecem<\/li><\/ul><h2 class=\"\">Percussão <\/h2><p class=\"\">A percussão distingue basicamente áreas <strong>maciças <\/strong>(substrato sólido) e áreas<strong> timpânicas<\/strong> (indicam ar subjacente) <\/p><p class=\"\">A distribuição das vísceras ocas e maciças na cavidade abdominal, quando percutidas, reflete essas variações. A maciez hepática em geral no hipocôndrio direito contrasta com o timpanismo no hipocôndrio esquerdo onde se aloja o baço. <\/p><p class=\"\">Território das alças intestinais → som timpânico <\/p><p class=\"\">Qualquer variação nesse padrão pode indicar indícios de doenças. <\/p><h2 class=\"\">Palpação <\/h2><p class=\"\">A palpação abdominal deve ser realizada de forma sistemática, iniciando-se pelas áreas indolores e sempre com delicadeza, observando as reações do paciente durante todo o exame. Divide-se em palpação superficial e profunda, cada uma com objetivos distintos.<\/p><p class=\"\">A <strong>palpação superficial<\/strong> é realizada com leve pressão e tem como principal finalidade avaliar dor, sensibilidade e alterações da parede abdominal. Nesse momento, busca-se identificar sinais de <strong>irritação peritoneal<\/strong>, como dor localizada, defesa muscular e rigidez involuntária. A presença de abdome em “tábua” ou dor exacerbada à palpação sugere comprometimento do peritônio e deve alertar para quadros graves no contexto de abdome agudo.<\/p><p class=\"\">A <strong>palpação profunda<\/strong> é feita com compressão progressiva, respeitando o biotipo do paciente, e tem como objetivo a avaliação de estruturas intra-abdominais. Nessa etapa, investigam-se <strong>massas abdominais<\/strong>, suas características (localização, tamanho, consistência, mobilidade e sensibilidade) e a presença de <strong>visceromegalias<\/strong>, como aumento do fígado ou do baço. Esse tipo de palpação também permite identificar dor profunda e delimitar melhor áreas acometidas.<\/p><p class=\"\">Assim, enquanto a palpação superficial está mais relacionada à avaliação de dor e irritação peritoneal, a palpação profunda é fundamental para a identificação de alterações estruturais no abdome.<\/p><p class=\"\">A palpação específica do abdome tem como objetivo avaliar órgãos determinados, principalmente fígado e baço, sendo realizada por meio de manobras que facilitam o contato entre a mão do examinador e as vísceras durante a respiração.<\/p><p class=\"\">A principal técnica utilizada é a <strong>Manobra de Lemos Torres<\/strong>, que consiste na palpação bimanual. Nessa manobra, uma das mãos é posicionada na região posterior do paciente, promovendo uma leve compressão para anteriorizar as vísceras, enquanto a outra mão é colocada na parede abdominal, abaixo do rebordo costal. Durante a inspiração profunda, o examinador realiza um movimento de “escavação” com a mão anterior, buscando sentir a borda do órgão que desce com o movimento respiratório.<\/p><p class=\"\">Na avaliação do fígado, a manobra é realizada no hipocôndrio direito, podendo, em indivíduos magros, ser palpada uma borda hepática fina e regular, o que pode representar um achado dentro da normalidade. Já na avaliação do baço, realizada no hipocôndrio esquerdo, a palpação normalmente não identifica o órgão; sua palpabilidade sugere esplenomegalia e deve ser considerada sempre um achado patológico.<\/p><h2 class=\"\">Manobras e sinais de irritação peritoneal<\/h2><p class=\"\">As manobras semiológicas abdominais são utilizadas para identificar sinais de irritação peritoneal e auxiliar na localização do processo inflamatório. Baseiam-se na provocação de dor por meio da mobilização de estruturas intra-abdominais ou do estiramento do peritônio.<\/p><p class=\"\">O <strong>sinal de Blumberg<\/strong> consiste na compressão lenta e profunda da parede abdominal, seguida de descompressão brusca. O teste é considerado positivo quando há dor mais intensa na retirada súbita da mão do examinador. Seu mecanismo está relacionado ao deslocamento abrupto do peritônio inflamado, sendo um forte indicativo de <strong>irritação peritoneal<\/strong>, frequentemente observado em quadros como apendicite e peritonite.<\/p><p class=\"\">O <strong>sinal de Murphy<\/strong> é pesquisado com a palpação do hipocôndrio direito enquanto se solicita ao paciente uma inspiração profunda. O teste é positivo quando ocorre interrupção súbita da inspiração devido à dor. O mecanismo envolve o contato da vesícula biliar inflamada com a mão do examinador durante a descida inspiratória, sendo sugestivo de <strong>colecistite aguda<\/strong>.<\/p><p class=\"\">O <strong>sinal de Rovsing<\/strong> é obtido pela compressão do quadrante inferior esquerdo do abdome, provocando dor referida no quadrante inferior direito. O mecanismo decorre do deslocamento de gases e conteúdo intestinal, levando à distensão do ceco e irritação do peritônio na região apendicular, sendo sugestivo de <strong>apendicite aguda<\/strong>.<\/p><p class=\"\">O <strong>sinal do psoas<\/strong> é pesquisado pela extensão da coxa direita contra resistência ou pela elevação do membro inferior direito em decúbito lateral esquerdo. A dor provocada resulta do estiramento do músculo psoas, que está em contato com o apêndice quando este se encontra em posição retrocecal, sendo indicativo de <strong>apendicite retrocecal<\/strong>.<\/p><p class=\"\">O <strong>sinal do obturador<\/strong> é avaliado com a flexão do quadril e joelho direitos, seguida de rotação interna da coxa. A dor desencadeada ocorre pelo estiramento do músculo obturador interno, sugerindo irritação peritoneal pélvica, comumente associada à <strong>apendicite em posição pélvica<\/strong>.<\/p><h2 class=\"\">Como fazer:<\/h2><h3 class=\"\">Sinal de Blumberg<\/h3><ul class=\"bulleted-list\"><li style=\"list-style-type:disc\">Posicionar a mão sobre a região a ser examinada (geralmente fossa ilíaca direita)<\/li><\/ul><ul class=\"bulleted-list\"><li style=\"list-style-type:disc\">Realizar compressão lenta e profunda da parede abdominal<\/li><\/ul><ul class=\"bulleted-list\"><li style=\"list-style-type:disc\">Em seguida, promover descompressão brusca<\/li><\/ul><p class=\"\">Achado positivo: dor mais intensa no momento da retirada súbita da mão.<\/p><h3 class=\"\">Sinal de Murphy<\/h3><ul class=\"bulleted-list\"><li style=\"list-style-type:disc\">Posicionar a mão no hipocôndrio direito, na topografia da vesícula biliar<\/li><\/ul><ul class=\"bulleted-list\"><li style=\"list-style-type:disc\">Solicitar ao paciente uma inspiração profunda<\/li><\/ul><ul class=\"bulleted-list\"><li style=\"list-style-type:disc\">Manter a pressão durante a inspiração<\/li><\/ul><p class=\"\">Achado positivo: interrupção súbita da inspiração devido à dor.<\/p><h3 class=\"\">Sinal de Rovsing<\/h3><ul class=\"bulleted-list\"><li style=\"list-style-type:disc\">Realizar compressão profunda no quadrante inferior esquerdo do abdome<\/li><\/ul><ul class=\"bulleted-list\"><li style=\"list-style-type:disc\">Pode-se associar leve deslizamento da mão<\/li><\/ul><p class=\"\">Achado positivo: dor referida na fossa ilíaca direita.<\/p><h3 class=\"\">Sinal do psoas<\/h3><p class=\"\">Pode ser pesquisado de duas formas:<\/p><ol class=\"numbered-list\" start=\"1\" type=\"1\"><li>Contra resistência:<\/li><\/ol><ul class=\"bulleted-list\"><li style=\"list-style-type:disc\">Paciente em decúbito dorsal<\/li><\/ul><ul class=\"bulleted-list\"><li style=\"list-style-type:disc\">Solicitar elevação do membro inferior direito contra resistência<\/li><\/ul><ol class=\"numbered-list\" start=\"1\" type=\"1\"><li>Alongamento:<\/li><\/ol><ul class=\"bulleted-list\"><li style=\"list-style-type:disc\">Paciente em decúbito lateral esquerdo<\/li><\/ul><ul class=\"bulleted-list\"><li style=\"list-style-type:disc\">Realizar extensão da coxa direita<\/li><\/ul><p class=\"\">Achado positivo: dor na fossa ilíaca direita.<\/p><h3 class=\"\">Sinal do obturador<\/h3><ul class=\"bulleted-list\"><li style=\"list-style-type:disc\">Flexionar o quadril e o joelho direitos a aproximadamente 90 graus<\/li><\/ul><ul class=\"bulleted-list\"><li style=\"list-style-type:disc\">Realizar rotação interna da coxa<\/li><\/ul><p class=\"\">Achado positivo: dor em hipogástrio ou fossa ilíaca direita.<\/p>", "guia": {"intro": "Roteiro para a avaliação de um paciente com dor abdominal aguda: primeiro a estabilidade, depois a história dirigida e o exame do abdome na ordem inspeção → ausculta → percussão → palpação.", "etapas": [{"titulo": "Antes de começar", "itens": [["Higienizar as mãos, apresentar-se e identificar o paciente", "Explicar o que vai ser feito e pedir consentimento. Garantir privacidade.", null], ["Avaliar se o paciente está estável", "Sinais vitais (PA, FC, FR, temperatura, SatO₂) e estado geral. Taquicardia, hipotensão, palidez, sudorese fria e enchimento capilar lento sugerem choque: estabilizar antes de prosseguir.", {"s": "Sinais vitais", "n": "PA ___ mmHg, FC ___ bpm, FR ___ irpm, Tax ___ °C, SatO₂ ___%. Hemodinamicamente estável.", "a": [["Sinais de choque", "PA ___ mmHg, FC ___ bpm, FR ___ irpm, Tax ___ °C, SatO₂ ___%. Taquicárdico e hipotenso, com palidez, sudorese fria e enchimento capilar lento (sinais de choque)."], ["Febril", "PA ___ mmHg, FC ___ bpm, FR ___ irpm, Tax ___ °C (febril), SatO₂ ___%."]]}], ["Posicionar e expor o abdome", "Decúbito dorsal, braços ao longo do corpo, abdome exposto do apêndice xifoide à sínfise púbica. Mãos e estetoscópio aquecidos.", null], ["Pedir que o paciente aponte onde dói", "A região dolorosa é examinada por último.", null]]}, {"titulo": "Anamnese direcionada", "itens": [["Entender o motivo da procura", "Antes da queixa principal, entender o que levou o paciente ao atendimento e o encadeamento dos fatos desde o início dos sintomas, incluindo circunstâncias, hábitos de vida, doenças associadas e medicamentos (Porto).", {"s": "Queixa principal", "n": "Dor abdominal há ___."}], ["Diferenciar dor aguda de crônica", "Dor de início recente e súbito configura a síndrome de abdômen agudo.", {"s": "História da doença atual", "n": "Dor de início ___ (súbito / insidioso) há ___ horas, sem episódios semelhantes prévios.", "a": [["Dor recorrente", "Dor de início ___ há ___, com episódios semelhantes prévios: ___."]]}], ["Caracterizar a dor", "Início (súbito ou insidioso), localização nos quadrantes e se mudou de lugar (ex.: periumbilical → fossa ilíaca direita), irradiação, tipo (cólica, contínua, queimação), intensidade (0–10), evolução e fatores de melhora ou piora (postura, compressão, movimento, alimentação).", {"s": "História da doença atual", "n": "Localizada em ___, com irradiação para ___, do tipo ___ (cólica / contínua / queimação), intensidade ___/10, com piora ___ e melhora ___.", "a": [["Dor migratória", "Iniciou em região periumbilical e migrou para fossa ilíaca direita, contínua, intensidade ___/10, com piora à movimentação."]]}], ["Investigar sintomas associados", "Náuseas e vômitos (antes ou depois da dor; aspecto), febre, parada de eliminação de gases e fezes, diarreia, sangramento digestivo, icterícia, colúria, sintomas urinários, tontura ou síncope.", {"s": "História da doença atual", "n": "Nega náuseas, vômitos, febre, alteração do hábito intestinal, sangramento digestivo, icterícia, colúria e sintomas urinários.", "a": ["Associada a ___. Nega ___.", ["Náuseas e vômitos", "Associada a náuseas e ___ episódios de vômitos ___ (alimentares / biliosos / fecaloides), iniciados ___ (antes / depois) da dor."], ["Parada de gases e fezes", "Refere parada de eliminação de gases e fezes há ___, com distensão abdominal."], ["Febre", "Refere febre não aferida / de ___ °C há ___."]]}], ["Em mulheres em idade fértil: data da última menstruação", "Atraso menstrual, sangramento vaginal ou corrimento. Dor com sinais de choque levanta a hipótese de gravidez ectópica rota.", {"s": "História da doença atual", "n": "DUM: ___. Nega atraso menstrual, sangramento vaginal e corrimento.", "a": [["Atraso menstrual", "DUM: ___ (atraso de ___ dias). Refere ___ (sangramento vaginal / corrimento)."]]}], ["Antecedentes", "Cirurgias abdominais prévias (bridas), hérnias, úlcera péptica e uso de anti-inflamatórios, litíase biliar ou renal, etilismo, arritmias e doença vascular (isquemia mesentérica, aneurisma de aorta), anticoagulantes, medicamentos de uso contínuo, drogas lícitas e ilícitas.", {"s": "Antecedentes", "n": "Nega cirurgias abdominais prévias, comorbidades, uso contínuo de medicamentos, anticoagulantes ou anti-inflamatórios, etilismo e tabagismo.", "a": ["Cirurgias prévias: ___. Comorbidades: ___. Medicamentos em uso: ___. Hábitos: ___."]}], ["Já pensar no tipo de abdômen agudo", "Inflamatório (irritação peritoneal localizada), obstrutivo (cólica e distensão), perfurativo (dor súbita, intensa e difusa), hemorrágico (sinais de choque) ou vascular (dor desproporcional ao exame).", {"s": "Hipótese diagnóstica", "n": "Abdômen agudo ___ (inflamatório / obstrutivo / perfurativo / hemorrágico / vascular). Hipótese principal: ___."}]]}, {"titulo": "Exame físico geral", "itens": [["Observar fácies e posição", "Paciente imóvel, evitando se mexer, sugere peritonite; paciente inquieto, mudando de posição, sugere dor em cólica.", {"s": "Exame geral", "n": "Bom estado geral, lúcido e orientado, fácies atípica, em posição livre no leito.", "a": [["Imóvel (peritonite)", "Fácies de dor, imóvel no leito, evitando se movimentar."], ["Inquieto (cólica)", "Fácies de dor, inquieto, mudando de posição no leito."]]}], ["Avaliar hidratação, mucosas e pele", "Desidratação, palidez (perda sanguínea), icterícia.", {"s": "Exame geral", "n": "Corado, hidratado, anictérico, acianótico.", "a": ["___ (descorado ___/4+, desidratado ___/4+, ictérico ___/4+)."]}], ["Reavaliar sinais vitais", "Febre, taquicardia e hipotensão orientam a gravidade e o tipo de quadro.", {"s": "Sinais vitais", "n": "Sinais vitais estáveis na reavaliação.", "a": ["Na reavaliação: ___ (febre / taquicardia / hipotensão)."]}]]}, {"titulo": "Inspeção do abdome", "itens": [["Definir o tipo de abdômen", "Plano, globoso, distendido ou escavado.", {"s": "Abdome", "n": "Abdome plano.", "a": ["Abdome globoso.", "Abdome distendido.", "Abdome escavado."]}], ["Examinar em pé e depois deitado", "Procurar abaulamentos, cicatrizes, lesões de pele, circulação colateral e equimoses.", {"s": "Abdome", "n": "Sem cicatrizes, abaulamentos, lesões de pele, circulação colateral ou equimoses.", "a": ["Presença de ___ (cicatriz ___ em ___ / abaulamento em ___ / circulação colateral / equimose em ___)."]}], ["Observar movimentos", "Peristaltismo visível (obstrução) e pulsações anormais (aneurisma).", {"s": "Abdome", "n": "Sem peristaltismo visível ou pulsações anormais.", "a": ["Peristaltismo visível.", "Pulsação visível em ___."]}], ["Aumentar a pressão intra-abdominal para pesquisar hérnias", "Manobra de Valsalva (soprar o dorso da mão sem deixar o ar escapar) e flexão cervical (olhar a ponta dos pés sem levantar o tronco). Observar linha mediana supraumbilical, virilhas, base das coxas, flancos e dorso.", {"s": "Abdome", "n": "Sem hérnias às manobras de Valsalva e de flexão cervical.", "a": ["Abaulamento em ___ à manobra de ___, sugestivo de hérnia ___."]}]]}, {"titulo": "Ausculta", "itens": [["Auscultar antes de percutir e palpar", "Tocar o abdome antes pode alterar o peristaltismo.", null], ["Avaliar os ruídos hidroaéreos (RHA)", "Auscultar com calma antes de afirmar que estão ausentes.", {"s": "Abdome", "n": "Ruídos hidroaéreos presentes e normoativos.", "a": [["Aumentados", "Ruídos hidroaéreos aumentados, de timbre metálico."], ["Diminuídos", "Ruídos hidroaéreos diminuídos."], ["Ausentes", "Ruídos hidroaéreos ausentes."]]}], ["Interpretar conforme o tipo de quadro", "Obstrutivo: RHA aumentados e metálicos, depois diminuídos (fadiga da musculatura). Inflamatório: diminuídos (íleo reflexo). Perfurativo: ausentes (abdome silencioso). Hemorrágico: diminuídos (hipoperfusão). Vascular: normais no início, depois diminuídos (isquemia).", null], ["Pesquisar sopros", "Aorta e artérias renais.", {"s": "Abdome", "n": "Sem sopros em aorta e artérias renais.", "a": ["Sopro em ___."]}]]}, {"titulo": "Percussão", "itens": [["Percutir os quatro quadrantes", "Distinguir áreas timpânicas (ar) de áreas maciças (sólido ou líquido). Alças intestinais: timpanismo; hipocôndrio direito: macicez hepática; hipocôndrio esquerdo: timpanismo.", {"s": "Abdome", "n": "Timpânico à percussão.", "a": [["Timpanismo aumentado", "Timpanismo aumentado difusamente."], ["Macicez", "Macicez em ___."]]}], ["Pesquisar a perda da macicez hepática", "Timpanismo onde deveria haver macicez hepática (sinal de Jobert) sugere ar livre na cavidade: perfuração.", {"s": "Abdome", "n": "Macicez hepática preservada.", "a": ["Perda da macicez hepática (sinal de Jobert positivo)."]}], ["Pesquisar líquido livre quando houver distensão", "Macicez móvel de decúbito e sinal do piparote.", {"s": "Abdome", "n": "Macicez móvel de decúbito e piparote negativos.", "a": ["Macicez móvel de decúbito presente.", "Sinal do piparote positivo."]}], ["Punho-percussão lombar (sinal de Giordano)", "Dor à percussão da região lombar sugere causa renal (pielonefrite, cólica renal), diagnóstico diferencial importante.", {"s": "Abdome", "n": "Giordano negativo bilateralmente.", "a": ["Giordano positivo à ___."]}]]}, {"titulo": "Palpação", "itens": [["Começar pelas áreas sem dor, com delicadeza", "Observar o rosto do paciente durante todo o exame.", null], ["Palpação superficial", "Leve pressão para avaliar dor, sensibilidade e a parede. Procurar irritação peritoneal: dor localizada, defesa muscular e rigidez involuntária. Abdome em tábua é sinal de gravidade.", {"s": "Abdome", "n": "Flácido, indolor à palpação superficial, sem defesa ou rigidez.", "a": [["Dor localizada", "Doloroso à palpação superficial em ___, com defesa muscular voluntária."], ["Defesa / rigidez", "Doloroso à palpação em ___, com defesa muscular involuntária."], ["Abdome em tábua", "Rigidez generalizada (abdome em tábua)."]]}], ["Palpação profunda", "Compressão progressiva, respeitando o biotipo. Pesquisar massas (localização, tamanho, consistência, mobilidade, sensibilidade) e visceromegalias.", {"s": "Abdome", "n": "Indolor à palpação profunda, sem massas palpáveis.", "a": [["Dor", "Doloroso à palpação profunda em ___."], ["Massa", "Massa palpável em ___, de ___ cm, consistência ___, ___ (móvel / fixa), ___ (dolorosa / indolor)."]]}], ["Fígado e baço (manobra de Lemos-Torres)", "Mão posterior anterioriza a víscera; a mão anterior, abaixo do rebordo costal, faz movimento de escavação na inspiração profunda. Borda hepática fina pode ser normal em magros; baço palpável é sempre patológico.", {"s": "Abdome", "n": "Fígado e baço não palpáveis.", "a": [["Hepatomegalia", "Fígado palpável a ___ cm do rebordo costal direito, borda ___, superfície ___, ___ (doloroso / indolor)."], ["Esplenomegalia", "Baço palpável a ___ cm do rebordo costal esquerdo."]]}], ["Palpar os orifícios herniários", "Hérnia encarcerada é causa de abdômen agudo obstrutivo.", {"s": "Abdome", "n": "Orifícios herniários livres.", "a": ["Hérnia ___ em ___, ___ (redutível / irredutível), ___ (dolorosa / indolor)."]}]]}, {"titulo": "Manobras e sinais de irritação peritoneal", "itens": [["Sinal de Blumberg", "Compressão lenta e profunda (geralmente fossa ilíaca direita) seguida de descompressão brusca. Positivo: dor maior na retirada da mão. Indica irritação peritoneal (apendicite, peritonite).", {"s": "Abdome", "g": ["neg", "Blumberg"], "n": "Sinal de Blumberg negativo.", "a": ["Sinal de Blumberg positivo em ___."]}], ["Sinal de Rovsing", "Compressão profunda do quadrante inferior esquerdo, podendo deslizar a mão. Positivo: dor na fossa ilíaca direita. Sugere apendicite.", {"s": "Abdome", "g": ["neg", "Rovsing"], "n": "Sinal de Rovsing negativo.", "a": ["Sinal de Rovsing positivo."]}], ["Sinal do psoas", "Elevar o membro inferior direito contra resistência (decúbito dorsal) ou estender a coxa direita (decúbito lateral esquerdo). Positivo: dor na fossa ilíaca direita. Sugere apendicite retrocecal.", {"s": "Abdome", "g": ["neg", "psoas"], "n": "Sinal do psoas negativo.", "a": ["Sinal do psoas positivo à direita."]}], ["Sinal do obturador", "Flexionar quadril e joelho direitos a 90° e fazer rotação interna da coxa. Positivo: dor em hipogástrio ou fossa ilíaca direita. Sugere apendicite pélvica.", {"s": "Abdome", "g": ["neg", "obturador"], "n": "Sinal do obturador negativo.", "a": ["Sinal do obturador positivo à direita."]}], ["Sinal de Murphy", "Mão no hipocôndrio direito, na topografia da vesícula, e pedir inspiração profunda. Positivo: interrupção súbita da inspiração pela dor. Sugere colecistite aguda.", {"s": "Abdome", "g": ["neg", "Murphy"], "n": "Sinal de Murphy negativo.", "a": ["Sinal de Murphy positivo."]}], ["Toque retal e exame ginecológico, quando indicados", "Dor no fundo de saco (grito de Douglas) sugere irritação pélvica, sangue ou pus na pelve.", {"s": "Abdome", "n": "Toque retal sem alterações; fundo de saco indolor.", "a": ["Toque retal: ___. Dor à palpação do fundo de saco (grito de Douglas)."]}]]}, {"titulo": "Sinais de alarme", "alerta": true, "itens": [["Instabilidade hemodinâmica", "Taquicardia, hipotensão, palidez, sudorese fria: pensar em hemorragia ou sepse."], ["Abdome em tábua ou dor à descompressão difusa", "Peritonite generalizada."], ["Dor intensa desproporcional ao exame", "Isquemia mesentérica ou aneurisma de aorta."], ["RHA ausentes ou distensão com vômitos persistentes", "Perfuração ou obstrução avançada."], ["Mulher em idade fértil com dor e choque", "Gravidez ectópica rota até prova em contrário."]]}, {"titulo": "Registro (exemplo de exame normal)", "registro": "Abdome plano, sem cicatrizes, abaulamentos ou circulação colateral. Ruídos hidroaéreos presentes e normoativos. Timpânico à percussão, macicez hepática preservada. Flácido, indolor à palpação superficial e profunda, sem massas ou visceromegalias. Sinais de Blumberg, Rovsing, psoas, obturador e Murphy negativos. Giordano negativo bilateralmente.", "itens": []}], "fontes": "Elaborado a partir do seu material de estudo, com base em Porto, Semiologia Médica, 9. ed., cap. 95.", "secoes": ["Queixa principal", "História da doença atual", "Antecedentes", "Sinais vitais", "Exame geral", "Abdome", "Hipótese diagnóstica"]}, "videos": []}, {"id": "exame-das-mamas", "nome": "Exame das mamas", "resumo": "Anamnese focal, inspeção estática e dinâmica, linfonodos axilares e claviculares, palpação, secreção mamilar, descrição do nódulo e rastreamento.", "teoria": "<p>O exame clínico das mamas é a avaliação sistemática das mamas, das axilas e das cadeias linfonodais claviculares. Seu objetivo não é dar um diagnóstico histológico, e sim reconhecer, localizar e descrever com precisão qualquer alteração, para que se decida se a paciente segue no rastreamento habitual ou se precisa de investigação diagnóstica.<\/p>\n<p>Por ser um exame íntimo, a técnica só funciona quando vem junto com comunicação e respeito. O exame das mamas é uma \"invasão consentida\": sem explicação e sem consentimento, não há exame.<\/p>\n<p>Para organizar o raciocínio, o exame segue sempre a mesma lógica:<\/p>\n<ul class=\"bulleted-list\">\n<li><strong>Anamnese focal:<\/strong> a queixa (nódulo, dor ou secreção) e o risco da paciente direcionam o que procurar.<\/li>\n<li><strong>Inspeção:<\/strong> primeiro olhar, depois tocar. A inspeção estática e a dinâmica revelam assimetrias e retrações.<\/li>\n<li><strong>Palpação:<\/strong> linfonodos e mamas, de forma sistemática e comparativa, cobrindo todo o território.<\/li>\n<li><strong>Descrição:<\/strong> o achado é descrito antes de ser interpretado.<\/li>\n<\/ul>\n\n<h2 class=\"block-color-pink_background\">Antes de examinar: a paciente no centro<\/h2>\n<p>Competência técnica inclui segurança, dignidade e comunicação. Antes de qualquer toque, o examinador se apresenta, confirma a identidade da paciente, explica cada etapa e pede permissão. Avisar antes de tocar e antes de passar para uma nova etapa reduz o medo do desconhecido e torna o exame mais confortável e mais confiável.<\/p>\n<ul class=\"bulleted-list\">\n<li><strong>Privacidade:<\/strong> porta ou biombo fechados, boa iluminação e exposição apenas da região examinada (para as mamas, o tórax; o restante permanece coberto).<\/li>\n<li><strong>Autonomia:<\/strong> a paciente pode pedir pausa ou interrupção a qualquer momento. A presença de acompanhante deve ser oferecida conforme o contexto e a preferência dela.<\/li>\n<li><strong>Higiene:<\/strong> higienizar as mãos antes e depois e aquecê-las antes de tocar.<\/li>\n<\/ul>\n<aside class=\"callout block-color-gray_background\"><div><span class=\"icon\">💡<\/span><\/div><div>\n<p><strong>Pegadinha frequente:<\/strong> \"não informar os passos para não aumentar a ansiedade\" é sempre errado. Explicar cada etapa reduz o medo e melhora o relaxamento da paciente.<\/p>\n<\/div><\/aside>\n\n<h2 class=\"block-color-pink_background\">Anatomia que orienta a mão do examinador<\/h2>\n<p>Conhecer a extensão da mama explica por que a palpação precisa ser tão ampla. Clinicamente, a mama vai da clavícula ao sulco inframamário e da linha medioesternal à linha axilar posterior, incluindo o <strong>prolongamento axilar (cauda de Spence)<\/strong>, uma faixa de tecido glandular que se estende em direção à axila. Lesões pequenas podem estar em qualquer ponto desse território, inclusive na periferia e na cauda de Spence.<\/p>\n<p>A mama é formada por pele, tecido adiposo e tecido glandular, em proporções que variam com a genética e a idade. Por isso sua consistência é heterogênea e muda ao longo do ciclo menstrual. O tecido glandular se organiza em 15 a 20 lobos dispostos radialmente, cujos ductos lactíferos convergem para o mamilo.<\/p>\n<p>Duas estruturas merecem atenção especial:<\/p>\n<ul class=\"bulleted-list\">\n<li><strong>Ligamentos de Cooper:<\/strong> conectam o tecido mamário à pele e à fáscia. Quando um tumor traciona ou infiltra esses ligamentos, a pele é puxada para dentro, formando a retração cutânea. É esse o fundamento da inspeção dinâmica.<\/li>\n<li><strong>Aréola:<\/strong> contém os tubérculos de Morgagni (glândulas sebáceas), que ficam mais salientes na gestação e passam a ser chamados de tubérculos de Montgomery.<\/li>\n<\/ul>\n\n<h2 class=\"block-color-pink_background\">Drenagem linfática: por que examinar a axila<\/h2>\n<p>A anatomia linfática explica a ordem e os locais de palpação. A maior parte da linfa da mama, entre 75% e 90%, drena para as <strong>cadeias axilares<\/strong>. Por isso a axila é parte obrigatória do exame. O restante segue para as cadeias paraesternais (mamária interna), supraclaviculares, intercostais e, em menor proporção, subdiafragmáticas.<\/p>\n<figure class=\"image\"><img loading=\"lazy\" alt=\"\" src=\"img/3b41a5febe1a62c3.webp\"><\/figure>\n<p>Os linfonodos axilares são divididos em grupos: central (o mais palpável, profundamente na axila), lateral, anterior ou peitoral, posterior ou subescapular e apical (no ápice da axila, em direção à clavícula). Diante de uma massa suspeita ou de linfonodomegalia axilar, as cadeias supra e infraclaviculares devem ser avaliadas com ainda mais cuidado.<\/p>\n\n<h2 class=\"block-color-pink_background\">Anamnese focal antes do exame<\/h2>\n<p>O exame é direcionado pela queixa e pelo risco da paciente, mas continua sistemático. As três queixas mamárias mais comuns são o nódulo, a dor e a secreção mamilar, e cada uma pede perguntas próprias.<\/p>\n<h3>Nódulo<\/h3>\n<p>Quando surgiu, onde está, se cresceu (rápido, progressivo ou estacionário), se muda com o ciclo menstrual, se dói, se houve trauma e se alterou o contorno ou a pele da mama. O ritmo de crescimento é especialmente importante: um nódulo que aumenta progressivamente chama mais atenção do que um que permanece estável ou que varia com o ciclo.<\/p>\n<h3>Dor (mastalgia)<\/h3>\n<p>A primeira pergunta é se a dor é cíclica ou acíclica. A <strong>dor cíclica<\/strong> é difusa e bilateral, piora na fase pré-menstrual e melhora com a menstruação, e tem origem hormonal. A <strong>dor acíclica<\/strong> não acompanha o ciclo, costuma ser localizada e unilateral e pode ter origem na própria mama ou fora dela, como na parede torácica (relação com exercício e movimentos do tórax ou do membro superior).<\/p>\n<h3>Secreção mamilar<\/h3>\n<p>Investigar se a secreção é espontânea ou só aparece à expressão, se é uni ou bilateral, se sai de um ou de vários ductos, qual é a cor e se há sangue. Também é preciso perguntar sobre gestação, lactação ou aborto recentes, amenorreia e medicamentos que elevam a prolactina, como fenotiazinas, sulpirida, metildopa e reserpina.<\/p>\n<h3>Contexto e fatores de risco<\/h3>\n<p>Idade, menarca e menopausa, gestações e amamentação, uso de hormônios, biópsias prévias e história familiar de câncer de mama ou de ovário. Esses dados mudam a probabilidade de malignidade antes mesmo do exame físico. Uma mulher na transição menopausal, com nódulo em crescimento e mãe com câncer de mama, tem uma probabilidade pré-teste maior do que uma jovem com nódulo estável, ainda que os dois nódulos sejam móveis e pouco dolorosos.<\/p>\n\n<h2 class=\"block-color-pink_background\">A sequência do exame em cinco passos<\/h2>\n<p>O exame segue sempre a mesma ordem, do olhar para o tocar e do geral para o específico:<\/p>\n<ol class=\"numbered-list\">\n<li><strong>Inspeção estática:<\/strong> paciente sentada, braços ao lado do corpo.<\/li>\n<li><strong>Inspeção dinâmica:<\/strong> mãos nos quadris, braços elevados e inclinação do tronco.<\/li>\n<li><strong>Palpação dos linfonodos:<\/strong> supraclaviculares, infraclaviculares e axilares.<\/li>\n<li><strong>Palpação das mamas:<\/strong> paciente em decúbito dorsal, cobrindo todo o território de forma sistemática.<\/li>\n<li><strong>Expressão papilar:<\/strong> somente quando há queixa de secreção.<\/li>\n<\/ol>\n\n<h2 class=\"block-color-pink_background\">Inspeção estática<\/h2>\n<p>Primeiro se observa, sem tocar. A paciente fica sentada, com os braços relaxados ao longo do corpo e o tórax exposto. O examinador olha as mamas de frente e também em oblíquo, porque a luz tangencial torna depressões e retrações mais evidentes.<\/p>\n<figure class=\"image\"><img loading=\"lazy\" alt=\"\" src=\"img/438040f5faceb239.webp\"><\/figure>\n<p>Na inspeção estática, avaliam-se:<\/p>\n<ul class=\"bulleted-list\">\n<li><strong>Tamanho, simetria e contorno:<\/strong> assimetrias discretas são frequentes e podem ser fisiológicas, mas devem ser interpretadas no contexto. O achatamento de uma mama que normalmente é convexa sugere lesão subjacente.<\/li>\n<li><strong>Pele:<\/strong> cor, lesões, circulação venosa proeminente, edema, abaulamentos e retrações. A pele espessada com poros dilatados, chamada de <strong>\"casca de laranja\"<\/strong>, indica edema por bloqueio da drenagem linfática.<\/li>\n<li><strong>Aréola e mamilo:<\/strong> forma, posição, direção, presença de retração, descamação, ulceração e secreção espontânea.<\/li>\n<li><strong>Desenvolvimento:<\/strong> estágio de Tanner (M1 a M5), especialmente em adolescentes.<\/li>\n<\/ul>\n<h3>Mamilo invertido ou retraído?<\/h3>\n<p>Segundo o Bates, o <strong>mamilo invertido<\/strong> é deprimido, mas pode ser exteriorizado, e costuma ser uma variação da normalidade, presente há muitos anos. O <strong>mamilo retraído<\/strong> é repuxado e fixo pelos ductos, aparece de forma recente e sugere câncer. A mudança na direção do mamilo tem o mesmo significado.<\/p>\n<h3>Achados de inspeção que exigem atenção<\/h3>\n<figure class=\"image\"><img loading=\"lazy\" alt=\"\" src=\"img/7e3c7bce2a261290.webp\"><\/figure>\n<ul class=\"bulleted-list\">\n<li><strong>Retração recente ou focal<\/strong> da pele ou do mamilo: descrever o local e em que manobra ela fica mais visível.<\/li>\n<li><strong>Eczema, descamação ou ulceração do mamilo<\/strong> que se estende à aréola, sobretudo unilateral e que não responde a tratamento tópico: sugere doença de Paget e exige investigação.<\/li>\n<li><strong>Pele em casca de laranja:<\/strong> sugere comprometimento linfático.<\/li>\n<li><strong>Vermelhidão e edema da mama:<\/strong> podem ser infecção local ou carcinoma inflamatório. Sem febre ou sinais infecciosos, o carcinoma inflamatório precisa ser lembrado.<\/li>\n<\/ul>\n<figure class=\"image\"><img loading=\"lazy\" alt=\"\" src=\"img/e64ce31fbd5198a6.webp\"><\/figure>\n<p>No exame físico, o objetivo é reconhecer o sinal e descrevê-lo corretamente, não fechar o diagnóstico só pelo que se vê.<\/p>\n\n<h2 class=\"block-color-pink_background\">Inspeção dinâmica: três manobras, um objetivo<\/h2>\n<p>A inspeção dinâmica tem um objetivo único: <strong>tensionar a pele e a fáscia<\/strong>. A contração dos músculos peitorais e a ação dos ligamentos de Cooper fazem aparecer assimetrias e retrações que passam despercebidas com a paciente em repouso. Um câncer que tem feixes fibrosos presos à pele e à fáscia peitoral provoca uma depressão na pele durante a contração.<\/p>\n<figure class=\"image\"><img loading=\"lazy\" alt=\"\" src=\"img/825bf877cd16bc57.webp\"><\/figure>\n<ol class=\"numbered-list\">\n<li><strong>Mãos nos quadris, pressionando-os:<\/strong> contrai o músculo peitoral.<\/li>\n<li><strong>Inclinação do tronco para a frente:<\/strong> as mamas ficam pendentes. É útil principalmente em mamas grandes ou pendulares.<\/li>\n<li><strong>Braços elevados acima da cabeça:<\/strong> eleva e estica o tecido mamário.<\/li>\n<\/ol>\n<p>O que se procura: retração cutânea, desvio ou retração do mamilo, abaulamento focal, assimetria de mobilidade entre as mamas e fixação. A necrose gordurosa e a ectasia ductal também podem causar retração, mas o sinal sempre deve ser investigado.<\/p>\n<div class=\"caiu-slot\" data-i=\"0\"><\/div>\n\n<h2 class=\"block-color-pink_background\">Palpação dos linfonodos<\/h2>\n<p>A palpação das cadeias linfonodais vem antes da palpação das mamas e é feita, de preferência, com a paciente sentada.<\/p>\n<h3>Supraclaviculares e infraclaviculares<\/h3>\n<p>Palpar bilateralmente, com as polpas dos dedos, em movimentos pequenos e comparativos entre os dois lados, com a paciente relaxada.<\/p>\n<h3>Axila: a musculatura relaxada é o segredo<\/h3>\n<p>Se a paciente contrai o braço, os músculos da parede da axila endurecem e escondem os linfonodos. Por isso o examinador sustenta o braço dela, e a técnica segue quatro movimentos:<\/p>\n<figure class=\"image\"><img loading=\"lazy\" alt=\"\" src=\"img/886a1ddc9b49b311.webp\"><\/figure>\n<ol class=\"numbered-list\">\n<li><strong>Apoiar o braço:<\/strong> o membro superior da paciente fica sustentado pelo braço do examinador, sem contração voluntária.<\/li>\n<li><strong>Usar a mão cruzada:<\/strong> para a axila direita, o braço direito da paciente fica apoiado e o examinador palpa com a mão esquerda; para a axila esquerda, o contrário.<\/li>\n<li><strong>Alcançar o ápice:<\/strong> com os dedos juntos e em concha, penetrar o mais alto possível na axila, por trás dos peitorais, apontando para o meio da clavícula.<\/li>\n<li><strong>Deslizar contra a parede torácica:<\/strong> trazer os dedos para baixo pressionando suavemente contra as costelas, explorando toda a gordura axilar.<\/li>\n<\/ol>\n<p>Ao encontrar um linfonodo, descreva número, tamanho, formato, consistência, mobilidade, limites e dor. É comum palpar um ou mais linfonodos pequenos (menores que 1 cm), macios, móveis e indolores, sem significado patológico.<\/p>\n<aside class=\"callout block-color-gray_background\"><div><span class=\"icon\">💡<\/span><\/div><div>\n<p><strong>Linfonodo suspeito:<\/strong> maior que 1 a 2 cm, endurecido, fixo, em conglomerado e indolor. Se não palpar nada, registre \"axilas sem linfonodomegalias palpáveis\".<\/p>\n<\/div><\/aside>\n\n<h2 class=\"block-color-pink_background\">Palpação das mamas<\/h2>\n<h3>Posição<\/h3>\n<p>A palpação é feita com a paciente em <strong>decúbito dorsal<\/strong>, posição que achata e espalha o tecido mamário sobre a parede torácica e facilita encontrar nódulos. Para examinar a mama direita, a paciente eleva o braço direito e coloca a mão atrás da cabeça. Um pequeno coxim sob o ombro desse lado ajuda a espalhar melhor o tecido. Para a porção lateral da mama, o Bates sugere que a paciente gire sobre o quadril oposto com a mão na testa; para a porção medial, ela volta ao decúbito dorsal.<\/p>\n<h3>Técnica<\/h3>\n<p>Usam-se as <strong>polpas dos dedos indicador, médio e anular<\/strong>, discretamente flexionados, em pequenos movimentos circulares. Em cada ponto, a pressão é aplicada em três níveis: <strong>superficial, intermediária e profunda<\/strong>, para alcançar o tecido próximo à pele e o tecido junto à parede torácica.<\/p>\n<figure class=\"image\"><img loading=\"lazy\" alt=\"\" src=\"img/dd9a4bf64b1a808a.webp\"><\/figure>\n<p>O pinçamento com o polegar e o indicador não deve ser usado, porque \"belisca\" o tecido glandular e cria a falsa impressão de nódulos. As técnicas clássicas descritas são a de <strong>Velpeau<\/strong>, com a face palmar dos dedos (mão espalmada), e a de <strong>Bloodgood<\/strong>, com as falanges distais, \"dedilhando\" o tecido.<\/p>\n<h3>Território e padrão de varredura<\/h3>\n<p>A palpação deve cobrir todo o território da mama, da clavícula ao sulco inframamário e da linha medioesternal à linha axilar posterior, incluindo a <strong>região retroareolar e a cauda de Spence<\/strong>. Depois, repete-se o exame na outra mama, comparando os lados.<\/p>\n<figure class=\"image\"><img loading=\"lazy\" alt=\"\" src=\"img/7be31daa60429788.webp\"><\/figure>\n<p>O padrão pode ser em faixas verticais, radial ou circular: o mais importante é não deixar nenhuma área sem palpar. Segundo o Bates, o padrão em faixas verticais é o mais bem validado para detectar massas. Mesmo quando a queixa é focal, o exame continua sistemático e bilateral.<\/p>\n<aside class=\"callout block-color-gray_background\"><div><span class=\"icon\">💡<\/span><\/div><div>\n<p><strong>Não confundir com nódulo:<\/strong> a nodularidade fisiológica pré-menstrual, a crista inframamária firme e uma costela palpada ao pressionar fundo podem simular massa.<\/p>\n<\/div><\/aside>\n<div class=\"caiu-slot\" data-i=\"1\"><\/div>\n\n<h2 class=\"block-color-pink_background\">Expressão papilar e secreção<\/h2>\n<p>A expressão papilar é feita <strong>somente quando há queixa de secreção<\/strong>. Com delicadeza, comprime-se a aréola e o mamilo em várias posições radiais, tentando identificar de qual ducto sai a secreção. A pressão vigorosa, além de dolorosa, faz sair secreção em mais da metade das mulheres, sem relevância clínica, e pode levar a investigações desnecessárias.<\/p>\n<figure class=\"image\"><img loading=\"lazy\" alt=\"\" src=\"img/b08ab9e5ea280c35.webp\"><\/figure>\n<p>As características da secreção ajudam a separar o que costuma ser benigno do que preocupa:<\/p>\n<div class=\"tbl\"><table class=\"simple-table\"><thead><tr><th class=\"simple-table-header-color simple-table-header\">Característica<\/th><th class=\"simple-table-header-color simple-table-header\">Mais frequentemente benigna<\/th><th class=\"simple-table-header-color simple-table-header\">Mais preocupante<\/th><\/tr><\/thead><tbody>\n<tr><td>Ocorrência<\/td><td>Apenas à expressão<\/td><td>Espontânea<\/td><\/tr>\n<tr><td>Lado<\/td><td>Bilateral<\/td><td>Unilateral<\/td><\/tr>\n<tr><td>Ductos<\/td><td>Multiductal<\/td><td>Uniductal<\/td><\/tr>\n<tr><td>Aspecto<\/td><td>Leitosa, esverdeada, amarelada ou marrom, sem sangue<\/td><td>Sanguinolenta, serossanguínea ou cristalina (\"água de rocha\")<\/td><\/tr>\n<tr><td>Massa associada<\/td><td>Ausente<\/td><td>Presente<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<aside class=\"callout block-color-gray_background\"><div><span class=\"icon\">💡<\/span><\/div><div>\n<p><strong>Sempre alerta:<\/strong> derrame unilateral, espontâneo, uniductal e sanguinolento. Sugere lesão intraductal (papiloma, atipia ou carcinoma) e indica exame de imagem e, se necessário, biópsia.<\/p>\n<p><strong>Galactorreia<\/strong> fora da gestação e da lactação exige investigar prolactinoma, doenças da tireoide e medicamentos antagonistas da dopamina.<\/p>\n<\/div><\/aside>\n\n<h2 class=\"block-color-pink_background\">Encontrou um nódulo? Descreva antes de interpretar<\/h2>\n<h3>Como localizar<\/h3>\n<p>A descrição deve permitir que outro examinador encontre exatamente o mesmo ponto. Existem dois sistemas de localização:<\/p>\n<ul class=\"bulleted-list\">\n<li><strong>Quadrantes:<\/strong> superior externo, superior interno, inferior externo e inferior interno, além da região retroareolar e do prolongamento axilar. É útil para uma comunicação rápida.<\/li>\n<li><strong>Relógio e distância do mamilo:<\/strong> por exemplo, \"nódulo às 10 horas, a 4 cm do mamilo\". É mais preciso, sobretudo para lesões pequenas.<\/li>\n<\/ul>\n<figure class=\"image\"><img loading=\"lazy\" alt=\"\" src=\"img/7e0c68e7658dbab3.webp\"><\/figure>\n<p>Atenção: o mesmo horário corresponde a quadrantes diferentes em cada mama. Às 10 horas, o nódulo está no quadrante superior externo da mama direita, mas no quadrante superior interno da mama esquerda.<\/p>\n<h3>Como descrever<\/h3>\n<p>A descrição completa segue uma fórmula: <strong>localização, distância do mamilo, tamanho (em centímetros), forma, consistência, limites, mobilidade, dor e alterações associadas<\/strong> de pele, mamilo e linfonodos.<\/p>\n<div class=\"tbl\"><table class=\"simple-table\"><thead><tr><th class=\"simple-table-header-color simple-table-header\">Sugere benignidade<\/th><th class=\"simple-table-header-color simple-table-header\">Aumenta a suspeita<\/th><\/tr><\/thead><tbody>\n<tr><td>Consistência fibroelástica ou cística<\/td><td>Consistência endurecida (pétrea)<\/td><\/tr>\n<tr><td>Limites regulares e bem delimitados<\/td><td>Limites irregulares ou imprecisos<\/td><\/tr>\n<tr><td>Móvel<\/td><td>Fixo à pele, à fáscia ou à parede torácica<\/td><\/tr>\n<tr><td>Estável ou variando com o ciclo (cisto)<\/td><td>Crescimento progressivo<\/td><\/tr>\n<tr><td>Pele e mamilo sem alterações<\/td><td>Retração, casca de laranja, eczema unilateral do mamilo<\/td><\/tr>\n<tr><td>Axila sem linfonodos ou com linfonodos pequenos e móveis<\/td><td>Linfonodos axilares endurecidos ou em conglomerado<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>Para saber a que plano o nódulo está aderido, o Bates descreve um teste simples: mobilizar o nódulo com o braço da paciente relaxado e, depois, com a mão dela pressionando o quadril. Se o nódulo fica fixo com o braço relaxado, está aderido às costelas e aos músculos intercostais; se fica fixo só com a contração, está aderido à fáscia peitoral.<\/p>\n<p>Exemplo de registro: \"Mama direita: nódulo de 1,8 cm às 10 horas, a 4 cm do mamilo, oval, fibroelástico, de limites regulares, móvel e indolor, sem retração cutânea ou linfonodomegalia axilar\".<\/p>\n<h3>Quem costuma ser quem<\/h3>\n<p>A idade ajuda a pensar nas causas mais prováveis, mas nenhum achado isolado do exame confirma ou exclui câncer.<\/p>\n<div class=\"tbl\"><table class=\"simple-table\"><thead><tr><th class=\"simple-table-header-color simple-table-header\">Lesão<\/th><th class=\"simple-table-header-color simple-table-header\">Idade típica<\/th><th class=\"simple-table-header-color simple-table-header\">Como costuma ser ao exame<\/th><\/tr><\/thead><tbody>\n<tr><td>Fibroadenoma<\/td><td>Jovens, com pico por volta dos 20 anos<\/td><td>Móvel, bem delimitado, fibroelástico e indolor<\/td><\/tr>\n<tr><td>Cisto<\/td><td>35 a 50 anos<\/td><td>Pode doer e variar com o ciclo<\/td><\/tr>\n<tr><td>Tumor phyllodes<\/td><td>30 a 50 anos<\/td><td>Parece um fibroadenoma, mas cresce rápido e atinge grandes dimensões<\/td><\/tr>\n<tr><td>Necrose gordurosa<\/td><td>Após trauma ou cirurgia<\/td><td>Pode simular malignidade, inclusive com retração<\/td><\/tr>\n<tr><td>Câncer<\/td><td>Aumenta após os 40 a 50 anos<\/td><td>Endurecido, irregular, pouco móvel e indolor<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>A dor e a mobilidade sugerem benignidade, mas não excluem câncer. Todo achado suspeito precisa seguir para exame de imagem e para o fluxo de investigação.<\/p>\n<div class=\"caiu-slot\" data-i=\"2\"><\/div>\n\n<h2 class=\"block-color-pink_background\">Rastreamento e quando investigar<\/h2>\n<p>O rastreamento é uma estratégia para mulheres <strong>assintomáticas<\/strong>, com o objetivo de encontrar o câncer antes que ele dê sinais. Uma mulher com nódulo palpável ou outro sinal suspeito não está mais em rastreamento: ela precisa de investigação diagnóstica, qualquer que seja a idade.<\/p>\n<div class=\"tbl\"><table class=\"simple-table\"><thead><tr><th class=\"simple-table-header-color simple-table-header\">Situação<\/th><th class=\"simple-table-header-color simple-table-header\">Conduta<\/th><\/tr><\/thead><tbody>\n<tr><td>50 a 74 anos, assintomática, risco habitual<\/td><td>Mamografia de rastreamento a cada 2 anos (faixa prioritária do SUS)<\/td><\/tr>\n<tr><td>40 a 49 anos<\/td><td>Acesso à mamografia garantido após orientação sobre benefícios e riscos (decisão compartilhada), sem rastreamento populacional organizado<\/td><\/tr>\n<tr><td>Acima de 74 anos<\/td><td>Decisão individualizada, conforme comorbidades e expectativa de vida<\/td><\/tr>\n<tr><td>Alto risco (parente de 1º grau com câncer de mama)<\/td><td>Iniciar o rastreamento 10 anos antes da idade em que o parente mais jovem foi diagnosticado<\/td><\/tr>\n<tr><td>Qualquer idade com nódulo ou sinal suspeito<\/td><td>Investigação diagnóstica imediata, com exame de imagem conforme a idade e, se necessário, biópsia<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>Ensinar a mulher a conhecer as próprias mamas é útil, mas o autoexame não substitui a mamografia, que é o exame que reduz a mortalidade por câncer de mama.<\/p>\n<div class=\"caiu-slot\" data-i=\"3\"><\/div>\n", "guia": {"intro": "Roteiro para o exame clínico das mamas: anamnese focal, inspeção estática e dinâmica, palpação dos linfonodos e das mamas e, se houver queixa, expressão papilar.", "secoes": ["Queixa principal", "História da doença atual", "Antecedentes", "Mamas", "Linfonodos", "Impressão e conduta"], "fontes": "Elaborado a partir do material da Estação 1 de HM4 (slides e conferência), com base em Bickley, Bates: Propedêutica Médica, 13. ed., cap. Mamas e axilas; Porto, Semiologia Médica, 9. ed.; e Nota Técnica nº 626/2025 do Ministério da Saúde.", "etapas": [{"titulo": "Antes de começar", "itens": [["Higienizar as mãos, apresentar-se e identificar a paciente", "Nome completo e mais um dado (data de nascimento, por exemplo). Mãos aquecidas.", null], ["Explicar o exame e pedir consentimento", "Explicar cada etapa antes de realizá-la, avisar antes de tocar e combinar que ela pode pedir pausa. Oferecer acompanhante.", null], ["Garantir privacidade e expor só o tórax", "Porta ou biombo fechados, boa iluminação e o restante do corpo coberto.", null]]}, {"titulo": "Anamnese focal", "itens": [["Identificar a queixa principal", "Nódulo, dor, secreção, alteração de pele ou mamilo, ou consulta de rotina.", {"s": "Queixa principal", "n": "Consulta de rotina, sem queixas mamárias.", "a": [["Nódulo", "Nódulo em mama ___ há ___."], ["Dor", "Dor em mama ___ há ___."], ["Secreção", "Saída de secreção pelo mamilo ___ há ___."]]}], ["Caracterizar o nódulo, se houver", "Quando surgiu, local, crescimento (rápido, progressivo, estacionário), relação com o ciclo, dor, trauma e alteração de pele ou contorno.", {"s": "História da doença atual", "n": "Nega nódulos, alterações de pele ou de contorno mamário.", "a": [["Nódulo", "Percebeu nódulo em ___ da mama ___ há ___, com crescimento ___ (progressivo / estável), ___ (sem / com) relação com o ciclo, ___ (indolor / doloroso)."]]}], ["Caracterizar a dor, se houver", "Cíclica (difusa, bilateral, piora antes da menstruação) ou acíclica (localizada, unilateral, sem relação com o ciclo). Relação com exercício e movimentos.", {"s": "História da doença atual", "n": "Nega mastalgia.", "a": [["Cíclica", "Mastalgia difusa e bilateral, com piora no período pré-menstrual e melhora após a menstruação."], ["Acíclica", "Mastalgia localizada em ___ da mama ___, sem relação com o ciclo menstrual, há ___."]]}], ["Caracterizar a secreção, se houver", "Espontânea ou à expressão, uni ou bilateral, uni ou multiductal, cor e presença de sangue. Gestação, lactação, amenorreia e medicamentos.", {"s": "História da doença atual", "n": "Nega secreção mamilar.", "a": [["Secreção", "Secreção ___ (espontânea / à expressão), ___ (unilateral / bilateral), de aspecto ___ (leitoso / seroso / sanguinolento / esverdeado)."]]}], ["Antecedentes ginecológicos e fatores de risco", "Idade, menarca, menopausa, gestações, amamentação, uso de hormônios, biópsias prévias, história familiar de câncer de mama ou ovário e última mamografia.", {"s": "Antecedentes", "n": "Menarca aos ___ anos, G___P___A___, ___ (sem / com) uso de hormônios. Nega biópsias mamárias prévias e história familiar de câncer de mama ou ovário. Última mamografia em ___.", "a": [["História familiar", "Menarca aos ___ anos, G___P___A___. ___ (mãe / irmã / filha) com câncer de mama aos ___ anos. Última mamografia em ___."]]}]]}, {"titulo": "Inspeção estática", "itens": [["Posicionar a paciente sentada, braços ao lado do corpo", "Observar de frente e em oblíquo; a luz tangencial evidencia retrações.", null], ["Avaliar tamanho, simetria e contorno", "Assimetria discreta pode ser fisiológica. Achatamento de uma mama convexa sugere lesão subjacente.", {"s": "Mamas", "n": "Mamas simétricas, de contornos regulares.", "a": [["Assimetria", "Assimetria mamária, com ___ (aumento / achatamento) em ___ da mama ___."]]}], ["Avaliar a pele", "Cor, lesões, circulação venosa, edema, abaulamentos, retrações e pele em casca de laranja.", {"s": "Mamas", "n": "Pele íntegra, sem abaulamentos, retrações, edema ou alterações de cor.", "a": [["Retração", "Retração cutânea em ___ da mama ___."], ["Casca de laranja", "Pele em casca de laranja em ___ da mama ___."], ["Hiperemia", "Hiperemia e edema em ___ da mama ___."]]}], ["Avaliar aréolas e mamilos", "Forma, direção, retração recente, descamação, ulceração e secreção espontânea.", {"s": "Mamas", "n": "Aréolas e mamilos simétricos, sem retrações, descamação ou secreção espontânea.", "a": [["Mamilo retraído", "Retração do mamilo ___, de aparecimento recente."], ["Eczema do mamilo", "Descamação e eczema em mamilo e aréola ___ (suspeita de doença de Paget)."]]}]]}, {"titulo": "Inspeção dinâmica", "itens": [["Mãos nos quadris, pressionando-os", "Contrai o peitoral e tensiona a pele: procurar retração, abaulamento e desvio do mamilo.", null], ["Inclinação do tronco para a frente", "Mamas pendentes; útil em mamas grandes.", null], ["Braços elevados acima da cabeça", "Comparar a mobilidade das duas mamas.", {"s": "Mamas", "n": "Sem retrações ou abaulamentos à inspeção dinâmica.", "a": ["Retração cutânea em ___ da mama ___, evidente à manobra de ___."]}]]}, {"titulo": "Palpação dos linfonodos", "itens": [["Palpar supra e infraclaviculares bilateralmente", "Polpas dos dedos, movimentos pequenos e comparativos.", {"s": "Linfonodos", "n": "Sem linfonodomegalias supra ou infraclaviculares palpáveis.", "a": ["Linfonodo ___ (supraclavicular / infraclavicular) à ___, de ___ cm, ___ (móvel / fixo), consistência ___."]}], ["Axila direita: braço direito apoiado, palpar com a mão esquerda", "Dedos em concha até o ápice, deslizando contra a parede torácica.", {"s": "Linfonodos", "n": "Axila direita sem linfonodomegalias palpáveis.", "a": ["Linfonodo axilar direito de ___ cm, ___ (móvel / fixo), ___ (fibroelástico / endurecido), ___ (doloroso / indolor)."]}], ["Axila esquerda: braço esquerdo apoiado, palpar com a mão direita", "Mesma técnica do outro lado.", {"s": "Linfonodos", "n": "Axila esquerda sem linfonodomegalias palpáveis.", "a": ["Linfonodo axilar esquerdo de ___ cm, ___ (móvel / fixo), ___ (fibroelástico / endurecido), ___ (doloroso / indolor)."]}]]}, {"titulo": "Palpação das mamas", "itens": [["Decúbito dorsal, mão homolateral atrás da cabeça", "Coxim sob o ombro, se necessário. Para a porção lateral, a paciente gira sobre o quadril oposto.", null], ["Polpas de três dedos, movimentos circulares, três níveis de pressão", "Superficial, intermediária e profunda em cada ponto. Sem pinçar o tecido.", null], ["Cobrir todo o território", "Clavícula ao sulco inframamário, linha medioesternal à axilar posterior, incluindo retroareolar e cauda de Spence.", {"s": "Mamas", "n": "À palpação, mamas de consistência habitual, sem nódulos palpáveis.", "a": [["Nódulo", "Nódulo em mama ___, às ___ horas, a ___ cm do mamilo, de ___ cm, ___ (oval / irregular), ___ (fibroelástico / endurecido), de limites ___ (regulares / irregulares), ___ (móvel / fixo), ___ (indolor / doloroso)."], ["Adensamento", "Adensamento em ___ da mama ___, sem nódulo dominante."]]}], ["Repetir na outra mama e comparar", "Mesmo padrão de varredura dos dois lados.", null]]}, {"titulo": "Expressão papilar (só se houver queixa)", "itens": [["Comprimir suavemente aréola e mamilo em posições radiais", "Identificar o ducto de origem, a cor e a presença de sangue. Pressão vigorosa gera falsos achados.", {"s": "Mamas", "n": "Expressão papilar sem saída de secreção.", "a": ["Expressão papilar com saída de secreção ___ (serosa / leitosa / sanguinolenta), ___ (uniductal / multiductal), em mamilo ___."]}]]}, {"titulo": "Fechamento", "itens": [["Ajudar a paciente a se recompor e explicar os achados", "Linguagem simples, dizendo o que foi encontrado e o que acontece a seguir.", null], ["Definir a conduta", "Sem achados: orientar o rastreamento conforme a idade. Com sinal suspeito: investigação diagnóstica, não rastreamento.", {"s": "Impressão e conduta", "n": "Exame clínico das mamas sem alterações. Orientado rastreamento conforme a faixa etária.", "a": [["Achado suspeito", "Achado suspeito em mama ___ (___). Solicitada investigação diagnóstica com exame de imagem e encaminhamento conforme o fluxo."]]}]]}, {"titulo": "Sinais de alerta", "alerta": true, "itens": [["Nódulo endurecido, fixo, de limites irregulares ou em crescimento", "Investigação diagnóstica em qualquer idade."], ["Retração recente da pele ou do mamilo", "Tração dos ligamentos de Cooper ou dos ductos por lesão subjacente."], ["Pele em casca de laranja ou mama vermelha e edemaciada sem febre", "Bloqueio linfático; lembrar do carcinoma inflamatório."], ["Eczema unilateral do mamilo que não melhora", "Suspeita de doença de Paget."], ["Secreção espontânea, unilateral, uniductal e sanguinolenta", "Suspeita de lesão intraductal."], ["Linfonodo axilar ou supraclavicular endurecido, fixo ou em conglomerado", "Sugere comprometimento linfonodal."]]}, {"titulo": "Registro (exemplo de exame normal)", "registro": "Inspeção estática: mamas simétricas, de contornos regulares, pele íntegra, aréolas e mamilos sem retrações ou secreção. Inspeção dinâmica sem retrações ou abaulamentos. Linfonodos supra e infraclaviculares e axilares não palpáveis bilateralmente. Palpação: mamas de consistência habitual, sem nódulos palpáveis. Expressão papilar não realizada (sem queixa de secreção).", "itens": []}]}, "caiu": [{"tag": "UNP Salgado Filho · 2026.2 · Questão 9", "s": "Uma mulher de 52 anos apresenta discreta assimetria do contorno mamário, sem retração evidente durante a inspeção inicial com os braços relaxados. Durante a inspeção dinâmica em que ocorre a contração dos músculos peitorais, surge uma pequena depressão focal na pele da mama esquerda. Qual é o principal fundamento semiológico dessas manobras?", "o": ["Tensionar pele e estruturas de sustentação da mama, podendo tornar retrações ou fixações mais evidentes.", "Facilitar a drenagem linfática da mama para determinar se um edema é inflamatório ou neoplásico.", "Deslocar o tecido glandular superficialmente para diferenciar nódulos sólidos de lesões císticas.", "Aumentar a pressão intraductal para identificar secreções mamilares ocultas."], "c": 0, "why": "As manobras de inspeção dinâmica contraem o peitoral e tensionam a pele, a fáscia e os ligamentos de Cooper. Uma lesão que traciona essas estruturas aparece como depressão ou retração que não se via em repouso. Elas não atuam sobre os ductos nem sobre a drenagem linfática, e a inspeção não diferencia nódulo sólido de cisto."}, {"tag": "UNP Salgado Filho · 2026.2 · Questão 19", "s": "Durante uma aula prática de exame físico das mamas, uma estudante prepara-se para realizar a palpação mamária de uma paciente. Considerando a técnica semiológica adequada, qual conduta está correta?", "o": ["Realizar a palpação apenas nos quadrantes em que a paciente refere sintomas, pois a exploração das demais áreas reduz a especificidade do exame.", "Colocar a paciente em decúbito dorsal e realizar palpação sistemática utilizando as polpas dos dedos indicador, médio e anular, avaliando diferentes planos de profundidade.", "Utilizar predominantemente o polegar e o indicador em movimento de pinçamento, facilitando a identificação de pequenos nódulos.", "Realizar a palpação preferencialmente com a paciente sentada, utilizando as pontas dos dedos em movimentos rápidos e profundos."], "c": 1, "why": "A palpação é feita em decúbito dorsal, posição que espalha o tecido mamário, com as polpas de três dedos e pressão em três níveis, cobrindo toda a mama. Palpar só onde dói, pinçar com polegar e indicador ou palpar sentada com movimentos rápidos são os erros clássicos que a prova cobra."}, {"tag": "UNIFG São Sebastião · 2025.2 · Questão 5", "s": "Durante a palpação da mama em decúbito dorsal, o profissional encontra um nódulo firme no quadrante superolateral esquerdo. Para avaliação adequada desse achado, a técnica correta consiste em:", "o": ["Utilizar somente a ponta dos dedos para não deslocar a lesão.", "Suspender a palpação e encaminhar para ultrassonografia antes de prosseguir.", "Descrever suas características, incluindo tamanho, consistência, mobilidade e aderência a planos profundos.", "Reexaminar o nódulo apenas com a paciente sentada, pois massas podem ser posicionais."], "c": 2, "why": "Diante de um nódulo, o papel do exame físico é descrevê-lo com precisão: localização, distância do mamilo, tamanho, forma, consistência, limites, mobilidade, dor e aderência aos planos. É essa descrição que orienta a investigação. Interromper o exame ou mudar a técnica não acrescenta informação."}, {"tag": "FASEH · 2026.2 · Questão 6", "s": "Uma mulher de 52 anos, sem história pessoal ou familiar relevante para câncer de mama, procura uma unidade de saúde acreditando estar no momento de realizar sua mamografia periódica. Durante a consulta, relata que, há cerca de dois meses, percebeu retração recente do mamilo direito. Ao exame, identifica-se nódulo endurecido e pouco móvel no quadrante superior externo da mama direita, sem hiperemia, aumento da temperatura local ou febre. Considerando as estratégias de detecção precoce do câncer de mama e a situação clínica apresentada, assinale a alternativa CORRETA:", "o": ["Por estar na faixa etária recomendada para rastreamento populacional, deve ser solicitada mamografia bilateral de rastreamento; na ausência de alterações radiológicas, a paciente poderá retornar ao intervalo bienal habitual.", "Embora esteja na faixa etária recomendada para rastreamento mamográfico, a presença de nódulo palpável associado à retração recente do mamilo caracteriza uma situação clínica que requer investigação diagnóstica, não devendo a paciente ser conduzida pelo fluxo habitual de rastreamento.", "Como a mamografia apresenta maior desempenho diagnóstico após os 50 anos, sua realização com resultado negativo é suficiente para afastar malignidade e permitir o retorno da paciente ao rastreamento periódico.", "A presença de nódulo palpável modifica o método de escolha, devendo-se realizar inicialmente ultrassonografia mamária e reservar a mamografia para os casos em que o ultrassom demonstrar características suspeitas.", "A investigação imediata estaria indicada apenas se o nódulo apresentasse crescimento progressivo, linfonodomegalia axilar ou descarga papilar sanguinolenta, pois a retração do mamilo isoladamente não modifica a estratégia de rastreamento."], "c": 1, "why": "Rastreamento é para mulheres assintomáticas. Nódulo endurecido e pouco móvel com retração recente do mamilo são sinais suspeitos e tiram a paciente do rastreamento: ela precisa de investigação diagnóstica, mesmo estando na faixa dos 50 aos 74 anos. Um exame de imagem negativo, isoladamente, não encerra essa investigação."}], "videos": [{"id": "18NrBJeN4-w6rhx7yMnO9_1mtBA35kvLQ", "nome": "Exame físico das mamas", "teoria": "A sequência do exame em cinco passos", "guia": "Inspeção estática"}, {"id": "1ht78BM6VTMymPbtYy8eOLzJfooVoHtu1", "nome": "Palpação das mamas na gestante", "teoria": "Palpação das mamas", "guia": "Palpação das mamas"}]}, {"id": "exame-ginecologico", "nome": "Exame ginecológico e Papanicolau", "resumo": "Anatomia da vulva e do colo, inspeção, exame especular, coleta do citopatológico, toque bimanual e rastreamento do câncer do colo com DNA-HPV.", "teoria": "<p>O exame ginecológico é o conjunto de procedimentos que avalia a genitália externa, a vagina, o colo do útero e os órgãos pélvicos: inspeção da vulva, exame especular, coleta do material cervical quando indicada e toque bimanual. Ele é feito quando há indicação, e cada etapa tem um objetivo próprio.<\/p>\n<p>Antes de qualquer técnica, é preciso separar três conceitos que a prova costuma misturar:<\/p>\n<ul class=\"bulleted-list\">\n<li><strong>Consulta ginecológica:<\/strong> o encontro clínico para escuta, avaliação, aconselhamento, prevenção e manejo de queixas. Nem toda consulta exige exame ginecológico.<\/li>\n<li><strong>Exame ginecológico:<\/strong> o conjunto de procedimentos físicos, feito quando há queixa, alteração ou necessidade de coleta.<\/li>\n<li><strong>Rastreamento:<\/strong> a estratégia preventiva para pessoas <strong>assintomáticas<\/strong>, com faixa etária e periodicidade definidas. Quem tem sintoma ou lesão visível não está em rastreamento, e sim em investigação diagnóstica.<\/li>\n<\/ul>\n<p>Da mesma forma, o exame especular (visualizar vagina e colo) não é sinônimo de \"preventivo\" (coletar material do colo para rastreamento). Pode haver exame especular sem coleta, e não se coleta citologia só porque o espéculo foi introduzido.<\/p>\n\n<h2 class=\"block-color-purple_background\">Quando o exame está indicado<\/h2>\n<p>O exame especular está indicado quando o resultado muda a conduta: corrimento vaginal ou cervical, sangramento vaginal ou pós-coital, dispareunia, suspeita de corpo estranho ou de cervicite, lesões vaginais ou cervicais, avaliação antes de alguns procedimentos e coleta de rastreamento quando indicada.<\/p>\n<p>Também é importante saber o que <strong>não<\/strong> precisa ser feito automaticamente: exame especular em toda consulta, toque bimanual em toda mulher assintomática, citologia anual para todas, exame pélvico como pré-requisito para prescrever anticoncepcional hormonal (exceto na inserção de DIU) e \"preventivo\" para investigar corrimento, já que a citologia não diagnostica a maioria das causas.<\/p>\n\n<h2 class=\"block-color-purple_background\">Anatomia que orienta o exame<\/h2>\n<h3>Genitália externa: o mapa da inspeção<\/h3>\n<p>Vulva é a genitália externa; vagina não é sinônimo de vulva. A inspeção segue a ordem monte do púbis, grandes lábios, pequenos lábios, clitóris, vestíbulo, introito vaginal e períneo.<\/p>\n<figure class=\"image\"><img loading=\"lazy\" alt=\"\" src=\"img/2ebe656f19307840.webp\"><\/figure>\n<ul class=\"bulleted-list\">\n<li><strong>Vestíbulo:<\/strong> área entre os pequenos lábios, onde ficam o meato uretral, o óstio vaginal e os orifícios das glândulas de Skene e de Bartholin.<\/li>\n<li><strong>Meato uretral:<\/strong> entre o clitóris e o óstio vaginal. É também a referência da sondagem vesical feminina.<\/li>\n<li><strong>Glândulas de Skene (parauretrais):<\/strong> próximas ao meato. Observa-se hiperemia, secreção e lesões.<\/li>\n<li><strong>Glândulas de Bartholin (vestibulares maiores):<\/strong> posterolaterais ao introito, aproximadamente às 4 e às 8 horas. Não são visíveis normalmente; um abaulamento nessa região sugere cisto ou abscesso.<\/li>\n<li><strong>Comissura posterior (fúrcula):<\/strong> é o ponto de apoio do espéculo.<\/li>\n<\/ul>\n<p>Na menacme, o esperado é encontrar grandes lábios simétricos e de superfície rugosa. Pele atrófica e mucosa ressecada sugerem hipoestrogenismo, e orifícios de Skene ou de Bartholin salientes não são achado normal.<\/p>\n<h3>Genitália interna e colo do útero<\/h3>\n<p>A vagina é um tubo musculomembranoso de direção posterossuperior, com mucosa pregueada. O útero fica entre a bexiga (anterior) e o reto (posterior), na maioria das vezes em anteversoflexão. O colo se projeta na vagina e forma os fórnices; o posterior costuma ser o mais profundo. Saber essa direção explica por que o espéculo é introduzido com inclinação posterior.<\/p>\n<figure class=\"image\"><img loading=\"lazy\" alt=\"\" src=\"img/4f8b21245d9eab7d.webp\"><\/figure>\n<p>O colo tem dois epitélios: a <strong>ectocérvice<\/strong>, com epitélio escamoso estratificado, e a <strong>endocérvice<\/strong> (canal), com epitélio colunar mucossecretor. O ponto de encontro entre eles é a <strong>junção escamocolunar (JEC)<\/strong>, que muda de lugar ao longo da vida: fica exposta na ectocérvice em jovens e migra para dentro do canal após a menopausa.<\/p>\n<p>O epitélio colunar exposto sofre metaplasia escamosa, um processo fisiológico. Essa região é a <strong>zona de transformação<\/strong>, o local onde nascem as lesões precursoras do câncer do colo e, por isso, o alvo da coleta.<\/p>\n<aside class=\"callout block-color-gray_background\"><div><span class=\"icon\">💡<\/span><\/div><div>\n<p><strong>Ectopia não é lesão:<\/strong> é o epitélio colunar exteriorizado, visto como uma área avermelhada e delicada ao redor do orifício externo. É comum em adolescentes, gestantes e usuárias de alguns contraceptivos, pode aumentar o muco e sangrar ao contato, mas não é lesão pré-maligna.<\/p>\n<\/div><\/aside>\n<figure class=\"image\"><img loading=\"lazy\" alt=\"\" src=\"img/d56389851e6c6712.webp\"><\/figure>\n\n<h2 class=\"block-color-purple_background\">Anamnese ginecológica focal<\/h2>\n<p>A história orienta o que procurar e prepara a paciente para o exame. Ela percorre alguns eixos:<\/p>\n<ul class=\"bulleted-list\">\n<li><strong>Ciclo e sangramento:<\/strong> data da última menstruação (DUM), regularidade, fluxo, sangramento intermenstrual ou pós-coital, menopausa.<\/li>\n<li><strong>Dor:<\/strong> dor pélvica aguda ou crônica, dismenorreia, dispareunia e relação com o ciclo.<\/li>\n<li><strong>Sintomas vulvovaginais:<\/strong> prurido, ardor, corrimento, odor, lesões e tumefação.<\/li>\n<li><strong>História sexual:<\/strong> parcerias, práticas, prevenção, IST prévias e violência, quando pertinente.<\/li>\n<li><strong>Gravidez e contracepção:<\/strong> possibilidade de gestação, gestações anteriores e método em uso.<\/li>\n<li><strong>Coleta prévia:<\/strong> data do último exame, resultados alterados e procedimentos anteriores.<\/li>\n<\/ul>\n<p>Nas provas discursivas, o barema típico de anamnese ginecológica inclui menarca, sexarca, DUM, características do ciclo, atividade sexual, método contraceptivo, uso de preservativo, corrimento, dispareunia, gestações, partos e abortos, último preventivo e última mamografia.<\/p>\n\n<h2 class=\"block-color-purple_background\">Preparo: material, espéculo e posição<\/h2>\n<p>Todo o material é separado antes de posicionar a paciente: espéculo de tamanho adequado, luvas, espátula de Ayre, escova endocervical, lâmina com extremidade fosca e lápis, fixador, pinça de Cheron com algodão ou gaze, foco de luz e campo.<\/p>\n<p>O espéculo deve ser o <strong>menor tamanho que permita um exame adequado<\/strong>, escolhido pela anatomia, idade, paridade e conforto. Os de Pedersen têm lâminas estreitas e servem para introito pequeno, nulíparas e idosas; os de
