<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Biblioteca</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f5f7;--card:#fff;--ink:#1d1d1f;--muted:#6e6e73;--line:#d2d2d7;--accent:#0066cc;--solid:#0071e3;--nav:rgba(245,245,247,.86);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--cond:"Barlow Condensed",Impact,sans-serif;
  --sw:52px;--cw:212px;--bh:292px;--ease:cubic-bezier(.2,.75,.25,1);color-scheme:light}
:root[data-theme=dark]{--bg:#000;--card:#1d1d1f;--ink:#f5f5f7;--muted:#a1a1a6;--line:#38383a;--accent:#2997ff;--nav:rgba(22,22,23,.82);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--font);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 22px}
.kicker{font-size:11px;letter-spacing:.13em;font-weight:700;color:var(--muted);text-transform:uppercase}

/* Navegação e abertura (mesmo padrão do index.html) */
.top{position:sticky;top:0;z-index:10;background:var(--nav);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);border-bottom:1px solid var(--line)}
.top .wrap{height:52px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{font-size:14px;font-weight:650;letter-spacing:-.02em;color:var(--ink);text-decoration:none}
.links{display:flex;align-items:center;gap:30px}
.links a{font-size:12px;color:var(--ink);opacity:.8;text-decoration:none}
.links a:hover,.links a[aria-current]{opacity:1;color:var(--accent)}
.icon{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:14px}
.hero{padding-top:72px;display:flex;align-items:flex-end;justify-content:space-between;gap:40px}
h1{font-size:clamp(48px,7vw,86px);line-height:1;letter-spacing:-.065em;margin:14px 0 0;font-weight:750}
.hero p{font-size:22px;line-height:1.25;letter-spacing:-.02em;font-weight:600;color:var(--muted);max-width:380px;margin:0 0 8px;text-align:right}
.hero p b{color:var(--ink);font-weight:600}
.seg{display:inline-flex;gap:2px;padding:3px;margin-top:40px;background:var(--card);border-radius:999px;box-shadow:0 0 0 1px var(--line);max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg button{flex:none;border:0;background:none;color:var(--muted);font-size:14px;font-weight:600;padding:8px 16px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}

/* Estante */
.shelf{margin-top:24px;padding-top:34px;overflow-x:auto;scrollbar-width:none;-webkit-mask:linear-gradient(90deg,transparent,#000 32px,#000 calc(100% - 32px),transparent)}
.shelf::-webkit-scrollbar,.seg::-webkit-scrollbar{display:none}
.track{position:relative;display:flex;align-items:flex-end;gap:6px;width:max-content;margin:0 auto;padding:0 32px 26px}
.track::after{content:"";position:absolute;left:12px;right:12px;bottom:16px;height:10px;border-radius:3px;background:var(--card);box-shadow:0 1px 0 var(--line),0 12px 26px rgba(0,0,0,.08)}
.b{position:relative;z-index:1;flex:none;width:var(--sw);height:var(--bh);padding:0;border:0;background:none;cursor:pointer;transition:width .45s var(--ease)}
.b.on{width:var(--cw);z-index:2}
.b:focus-visible{outline:3px solid var(--accent);outline-offset:5px;border-radius:4px}
.sp,.cv{position:absolute;top:0;left:0;height:100%;display:flex;flex-direction:column;align-items:center;border-radius:2px 4px 4px 2px;
  box-shadow:6px 8px 16px rgba(0,0,0,.22),inset -4px 0 6px rgba(0,0,0,.18),inset 1px 0 rgba(255,255,255,.15);transition:opacity .25s,transform .45s var(--ease)}
.sp{width:var(--sw);padding:9px 0 9px;color:var(--si);background:linear-gradient(90deg,rgba(0,0,0,.22),transparent 18%,rgba(255,255,255,.08) 45%,transparent 75%,rgba(0,0,0,.24)),var(--sp)}
.thumb{width:calc(var(--sw) - 14px);height:54px;flex:none;border-radius:1px;background:var(--img) center/cover;box-shadow:0 1px 4px rgba(0,0,0,.45)}
.cv.img{padding:0;background:var(--img) center/cover,var(--sp)}
.cv.img::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(90deg,rgba(0,0,0,.3),rgba(255,255,255,.2) 1.6%,rgba(0,0,0,.1) 3.2%,transparent 7%),linear-gradient(155deg,rgba(255,255,255,.14),transparent 38%)}
.b:not(.on):hover .sp{transform:translateY(-6px)}
.b.on .sp{opacity:0}
.sp .art{width:calc(var(--sw) - 16px);height:44px;flex:none;border:2px solid rgba(0,0,0,.35)}
.sp b{flex:1;min-height:0;margin:10px 0;overflow:hidden;writing-mode:vertical-rl;text-align:center;font:600 14px/.95 var(--cond);letter-spacing:.03em;text-transform:uppercase}
.sp small,.ft span:first-child{border:1px solid currentColor;padding:1px 3px;font-size:7px;font-weight:700;letter-spacing:.12em;opacity:.8}
.cv{width:var(--cw);padding:14px 13px 11px;text-align:center;background:var(--cv);color:var(--ci);opacity:0;pointer-events:none;transform:translateY(8px)}
.b.on .cv{opacity:1;transform:none;transition-delay:.08s;box-shadow:12px 16px 30px rgba(0,0,0,.28),inset 0 0 0 1px rgba(255,255,255,.08)}
.cv small{font-size:7px;letter-spacing:.26em;text-transform:uppercase;opacity:.75}
.cv b{margin:6px 0 9px;font:800 23px/.92 var(--cond);text-transform:uppercase;text-wrap:balance}
.cv .art{flex:1;width:100%;border:1px solid rgba(0,0,0,.4)}
.ft{width:100%;display:flex;justify-content:space-between;align-items:center;margin-top:9px;font-size:7px;letter-spacing:.12em;opacity:.85}

/* Tons do livro: lombada (sp/si) e capa (cv/ci) */
.cream{--sp:#e4ddcf;--si:#171411;--cv:#d8cebb;--ci:#241b16}
.orange{--sp:#e14a1d;--si:#17110e;--cv:#c94a25;--ci:#1b120e}
.rust{--sp:#86341f;--si:#f0e7d6;--cv:#71301f;--ci:#f1e4d3}
.dark{--sp:#25211f;--si:#e9e1d3;--cv:#211d1a;--ci:#eee5d6}
.olive{--sp:#4c5140;--si:#eee6d4;--cv:#41463a;--ci:#eee6d4}
.teal{--sp:#1f4d52;--si:#e6efe9;--cv:#1b4247;--ci:#e9f1ec}

/* Ilustrações abstratas, só com gradientes */
.art{position:relative;overflow:hidden;background:var(--a)}
.art::after{content:"";position:absolute;inset:0;opacity:.5;mix-blend-mode:multiply;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(0,0,0,.18) 4px,transparent 5px)}
.a-orbit{--a:radial-gradient(ellipse at 51% 52%,#e0ba83 0 5%,transparent 6%),radial-gradient(ellipse at 51% 52%,transparent 0 15%,#b46b45 16% 18%,transparent 19%),repeating-radial-gradient(ellipse at 51% 52%,transparent 0 12px,rgba(226,190,141,.55) 13px 14px,transparent 15px 23px),linear-gradient(145deg,#110f0e,#7d4430 50%,#171412)}
.a-night{--a:radial-gradient(circle at 50% 28%,#d8c0a0 0 10%,transparent 11%),radial-gradient(ellipse at 50% 91%,#b65a35 0 22%,transparent 23%),linear-gradient(180deg,#070b12,#1f2d32 52%,#a0492b)}
.a-sun{--a:radial-gradient(circle at 50% 35%,#f1d4a7 0 22%,transparent 23%),linear-gradient(180deg,transparent 0 55%,#542e25 56% 63%,transparent 64%),repeating-linear-gradient(170deg,transparent 0 14px,rgba(48,28,22,.55) 15px 17px,transparent 18px 29px),linear-gradient(180deg,#df8b4c,#862f25)}
.a-eye{--a:radial-gradient(ellipse at 50% 50%,#e7bd84 0 4%,#281b16 5% 11%,#bd8052 12% 14%,transparent 15%),repeating-radial-gradient(ellipse at 50% 50%,transparent 0 9px,rgba(224,184,135,.55) 10px 11px,transparent 12px 18px),linear-gradient(130deg,#111719,#785039)}
.a-forest{--a:radial-gradient(ellipse at 50% 75%,#e3c59b 0 4%,transparent 5%),linear-gradient(110deg,transparent 0 35%,#101713 36% 45%,transparent 46%),linear-gradient(250deg,transparent 0 35%,#111712 36% 45%,transparent 46%),radial-gradient(ellipse at 50% 40%,#bf7046,transparent 55%),linear-gradient(180deg,#111917,#6b3d2b)}
.a-arch{--a:linear-gradient(90deg,transparent 0 15%,rgba(41,35,31,.65) 16% 18%,transparent 19% 80%,rgba(41,35,31,.65) 81% 83%,transparent 84%),repeating-linear-gradient(0deg,transparent 0 21px,rgba(54,45,38,.46) 22px 24px),linear-gradient(130deg,#eee4d2,#9b8a76)}
.a-ember{--a:radial-gradient(ellipse at 50% 75%,#e6a66a 0 5%,transparent 6%),radial-gradient(ellipse at 50% 85%,#b44c24 0 22%,transparent 23%),radial-gradient(ellipse at 50% 50%,#e5c18b 0 2%,transparent 3%),linear-gradient(180deg,#101113,#5e281d 60%,#100e0c)}
.a-coast{--a:radial-gradient(circle at 72% 23%,#ead5ad 0 13%,transparent 14%),linear-gradient(160deg,transparent 0 52%,#d7a36b 53% 57%,transparent 58%),repeating-linear-gradient(175deg,transparent 0 12px,rgba(224,205,169,.35) 13px 14px),linear-gradient(180deg,#253941,#b96a42)}
.a-flower{--a:radial-gradient(ellipse at 50% 50%,#d6b58a 0 7%,transparent 8%),radial-gradient(ellipse at 50% 28%,#a45b45 0 15%,transparent 16%),radial-gradient(ellipse at 72% 50%,#bd7852 0 14%,transparent 15%),radial-gradient(ellipse at 50% 73%,#a45b45 0 15%,transparent 16%),radial-gradient(ellipse at 28% 50%,#c18a60 0 14%,transparent 15%),linear-gradient(135deg,#171918,#77604d)}
.a-storm{--a:linear-gradient(130deg,transparent 0 46%,#ddc3a0 47% 49%,transparent 50%),radial-gradient(ellipse at 68% 32%,#c07c51 0 12%,transparent 13%),repeating-linear-gradient(165deg,transparent 0 18px,rgba(230,218,198,.18) 19px 20px),linear-gradient(180deg,#101719,#39494a 60%,#1c2020)}
.a-red{--a:radial-gradient(circle at 50% 42%,#f3d6ad 0 20%,transparent 21%),linear-gradient(180deg,transparent 0 60%,#41251d 61% 65%,transparent 66%),repeating-linear-gradient(90deg,transparent 0 18px,rgba(65,31,23,.35) 19px 20px),linear-gradient(135deg,#e06b35,#7b291c)}
.a-moon{--a:radial-gradient(circle at 50% 39%,#e3d7be 0 19%,transparent 20%),radial-gradient(circle at 58% 34%,#171a1e 0 18%,transparent 19%),linear-gradient(180deg,#090d13,#3b3030 75%,#111114)}

/* Legenda do livro em destaque */
.cap{text-align:center;padding:8px 22px 80px}
.cap .kicker{color:var(--accent)}
.cap h2{max-width:720px;margin:6px auto;font-size:clamp(28px,3.4vw,40px);line-height:1.08;letter-spacing:-.045em;font-weight:700;text-wrap:balance}
.cap p{margin:0;color:var(--muted);font-size:15px}
.btn{display:inline-flex;align-items:center;gap:6px;margin-top:18px;padding:11px 22px;border:0;border-radius:999px;background:var(--solid);color:#fff;font-size:15px;font-weight:600;text-decoration:none;cursor:pointer}
.hint{display:block;margin-top:14px;font-size:12px;color:var(--muted)}
.touch-only{display:none}
.framed .top{display:none}
.framed .hero{padding-top:44px}

/* Leitor de PDF */
.vw{width:100vw;max-width:none;height:100dvh;max-height:none;margin:0;padding:0;border:0;background:var(--bg);color:var(--ink)}
.vw[open]{display:flex;flex-direction:column;animation:up .35s var(--ease)}
.vw::backdrop{background:rgba(0,0,0,.4)}
.vw header{display:flex;align-items:center;gap:14px;height:56px;padding:0 22px;background:var(--nav);border-bottom:1px solid var(--line)}
.vw header b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px;letter-spacing:-.01em}
.vw header a{font-size:14px;font-weight:600;color:var(--accent);text-decoration:none;white-space:nowrap}
.vw iframe{flex:1;width:100%;border:0;background:#525659}
.demo{flex:1;display:flex;align-items:center;justify-content:center;gap:48px;padding:32px;flex-wrap:wrap}
.demo .b{pointer-events:none}
.demo p{max-width:360px;margin:0;color:var(--muted);font-size:15px}
.demo p b{display:block;margin-bottom:6px;color:var(--ink);font-size:24px;letter-spacing:-.03em}
.demo code{font-size:13px;color:var(--ink)}
@keyframes up{from{opacity:0;transform:translateY(24px)}}

/* Celular e tablet: carrossel de capas, puxando para o lado */
@media (hover:none),(pointer:coarse){
  :root{--cw:224px;--bh:308px}
  .hero{flex-direction:column;align-items:flex-start;gap:12px;padding-top:44px}
  .hero p{text-align:left;font-size:19px}
  .links a:not([aria-current]){display:none}
  .seg{margin-top:28px}
  .shelf{padding-top:16px;scroll-snap-type:x mandatory;-webkit-mask:none}
  .track{gap:14px;padding-inline:calc(50vw - var(--cw)/2)}
  .track::after{display:none}
  .b,.b.on{width:var(--cw);scroll-snap-align:center;transition:transform .35s var(--ease),opacity .35s}
  .b:not(.on){transform:scale(.86);opacity:.45}
  .sp{display:none}
  .cv{opacity:1;pointer-events:auto;transform:none}
  .cap{padding-top:18px}
  .mouse-only{display:none}.touch-only{display:inline}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation:none!important}}
</style>
</head>
<body>
<nav class="top"><div class="wrap">
  <a class="brand" href="index.html">Ambiente de estudos</a>
  <div class="links">
    <a href="index.html#novidades">Bancos</a><a href="index.html#conteudo">Conteúdo</a><a href="#" aria-current="page">Materiais</a>
    <button class="icon" id="theme" type="button" aria-label="Alternar tema">◐</button>
  </div>
</div></nav>

<main>
  <div class="wrap">
    <header class="hero">
      <div><div class="kicker">Materiais</div><h1>Biblioteca.</h1></div>
      <p>Os PDFs da turma, organizados por área. <b class="mouse-only">Passe o mouse para ver a capa.</b><b class="touch-only">Deslize para ver cada livro.</b></p>
    </header>
    <div class="seg" id="seg" role="group" aria-label="Filtrar por área"></div>
  </div>

  <div class="shelf" id="shelf"><div class="track" id="track" role="list"></div></div>

  <section class="cap" aria-live="polite">
    <div class="kicker" id="capA"></div>
    <h2 id="capT"></h2>
    <p id="capM"></p>
    <button class="btn" id="capBtn" type="button">Abrir livro</button>
    <span class="hint"><span class="mouse-only">Clique no livro para abrir · setas ← → também navegam</span><span class="touch-only">Toque na capa para abrir</span></span>
  </section>
</main>

<dialog class="vw" id="vw" aria-labelledby="vwT">
  <header><b id="vwT"></b><a id="vwA" href="#" target="_blank" rel="noopener">Abrir em nova aba ↗</a>
    <form method="dialog"><button class="icon" aria-label="Fechar">✕</button></form></header>
  <div id="vwBody" style="flex:1;display:flex;min-height:0"></div>
</dialog>

function drive(u){ const m = u && u.match(/drive\.google\.com\/file\/d\/([^/]+)/); return m ? `https://drive.google.com/file/d/${m[1]}/preview` : u; }
const embeddable = u => /\.pdf($|[?#])|drive\.google\.com\/file/.test(u);

function filter(f){

function select(i){
  if (i === cur || !list[i]) return;

  $('vwT').textContent = b.t; $('vwA').hidden = !b.url; $('vwA').href = b.url || '#';
  $('vwBody').innerHTML = b.url ? `<iframe src="${b.url}" title="${b.t}"></iframe>`
    : `<div class="demo"><div class="b on" style="${vars(b)}">${cover(b)}</div><p><b>Destino a definir.</b>${b.au}${b.ed ? ' · ' + (/^\d{4}$/.test(b.ed) ? 'edição ' + b.ed : b.ed + ' edição') : ''}</p></div>`;
  vw.showModal();
}
vw.addEventListener('close', () => $('vwBody').innerHTML = '');

// Computador: o livro sob o ponteiro abre em capa. A largura total da fileira não muda, então nada "pula" sob o mouse.
track.addEventListener('pointerover', e => {
  const el = e.target.closest('.b');
  if (!el || e.pointerType === 'touch' || touch.matches) return;
  clearTimeout(timer); timer = setTimeout(() => select(+el.dataset.i), 50);
});
track.addEventListener('pointerleave', () => clearTimeout(timer));
track.addEventListener('focusin', e => { const el = e.target.closest('.b'); if (el && !touch.matches) select(+el.dataset.i); });
track.addEventListener('click', e => {
  const el = e.target.closest('.b'); if (!el) return;
  const i = +el.dataset.i;
  if (touch.matches && i !== cur) { el.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'}); return; }
  select(i); openBook(list[i]);
});
$('capBtn').addEventListener('click', () => openBook(list[cur]));

// Teclado: setas mudam de livro.
document.addEventListener('keydown', e => {
  if (vw.open || !/^Arrow(Left|Right)$/.test(e.key)) return;
  const n = Math.max(0, Math.min(list.length - 1, cur + (e.key === 'ArrowRight' ? 1 : -1)));
  const el = track.children[n]; select(n);
  el.scrollIntoView({behavior:'smooth', inline: touch.matches ? 'center' : 'nearest', block:'nearest'});
});

// Roda do mouse rola a estante na horizontal só quando ela não cabe na tela.
shelf.addEventListener('wheel', e => {
  const max = shelf.scrollWidth - shelf.clientWidth, l = shelf.scrollLeft;
  if (touch.matches || !max || Math.abs(e.deltaX) > Math.abs(e.deltaY) || (e.deltaY < 0 ? l <= 0 : l >= max - 1)) return;
  e.preventDefault(); shelf.scrollLeft += e.deltaY;
}, {passive:false});

// Celular: o livro no centro da tela fica em destaque.
shelf.addEventListener('scroll', () => {
  if (!touch.matches) return;
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(() => {
    const c = shelf.scrollLeft + shelf.clientWidth / 2; let best = 0, d = Infinity;
    [...track.children].forEach((el,j) => { const x = Math.abs(track.offsetLeft + el.offsetLeft + el.offsetWidth / 2 - c); if (x < d) { d = x; best = j; } });
    select(best);
  });
}, {passive:true});

// Filtros por área.
$('seg').innerHTML = [['all','Todos'], ...Object.entries(AREAS).filter(([k]) => BOOKS.some(b => b.a === k))].map(([k,v],i) => `<button type="button" data-f="${k}" aria-pressed="${!i}">${v}</button>`).join('');
$('seg').addEventListener('click', e => {
  const btn = e.target.closest('button'); if (!btn) return;
  $('seg').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === btn));
  filter(btn.dataset.f);
});

// Tema: sozinha, usa a mesma preferência do site; dentro do index, segue o aviso dele.
const root = document.documentElement, TKEY = 'bancos-tema';
const setT = m => { if (m === 'escuro') root.dataset.theme = 'dark'; else delete root.dataset.theme; };
try { setT(localStorage.getItem(TKEY)); } catch {}
if (self !== top) root.classList.add('framed');
addEventListener('message', e => { const m = e.data && e.data.bancosTema; if (m === 'claro' || m === 'escuro') setT(m); });
$('theme').addEventListener('click', () => { const m = root.dataset.theme === 'dark' ? 'claro' : 'escuro'; setT(m); try { localStorage.setItem(TKEY, m); } catch {} });

filter('all');
</script>
</body>
