strong>sinais ou sintomas suspeitos<\/strong>. A investigação pode envolver <strong>avaliação clínica, toque retal e PSA<\/strong>, seguida, quando indicada, de ressonância magnética e <strong>biópsia prostática<\/strong>, que estabelece o diagnóstico histológico. (<span class=\"cc\" style=\"--c:#1155cc\"><a href=\"https://www.gov.br/inca/pt-br/assuntos/cancer/tipos/prostata/versao-para-populacao?utm_source=chatgpt.com\" target=\"_blank\" rel=\"noopener\">Serviços e Informações do Brasil<\/a><\/span>)<\/p>\n<h3 class=\"hb\" style=\"--c:#3c78d8;--hb:#c9daf8;\">Rastreamento<\/h3>\n<p>É diferente do diagnóstico precoce porque se dirige a indivíduos <strong>assintomáticos<\/strong>. O <strong>Ministério da Saúde e o INCA não recomendam rastreamento populacional sistemático do câncer de próstata<\/strong>, devido ao balanço desfavorável entre benefícios e danos, especialmente em razão de falso-positivos, sobrediagnóstico, sobretratamento e suas repercussões. Quando o homem assintomático solicita o rastreamento, recomenda-se <strong>decisão compartilhada e individualizada<\/strong>. (<span class=\"cc\" style=\"--c:#1155cc\"><a href=\"https://www.gov.br/inca/pt-br/assuntos/noticias/2023/ministerio-da-saude-recomenda-o-nao-rastreamento-populacional-do-cancer-de-proposta?utm_source=chatgpt.com\" target=\"_blank\" rel=\"noopener\">Serviços e Informações do Brasil<\/a><\/span>)<\/p>\n<p>Assim, a ideia central para a Tutoria é:<\/p>\n<p><strong>No SUS, a prevenção do câncer de próstata baseia-se principalmente na redução de fatores de risco e na promoção da saúde, enquanto a detecção precoce prioriza o diagnóstico oportuno de homens com sinais ou sintomas suspeitos; não se recomenda o rastreamento populacional sistemático de homens assintomáticos. <\/strong><\/p>\n<p>Essa distinção é fundamental porque evita uma confusão frequente na prática médica: <strong>“detecção precoce” não é sinônimo de “rastreamento”<\/strong>. No câncer de próstata, justamente porque existe sobrediagnóstico e sobretratamento importantes, detectar mais tumores não significa necessariamente produzir melhor desfecho populacional.<\/p>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#a4c2f4;\">Referências<\/h3>\n<ul>\n<li>BRASIL. Ministério da Saúde. <strong>Câncer de próstata<\/strong>. Brasília, DF: Ministério da Saúde, [2026]. Disponível em: <span class=\"cc\" style=\"--c:#1155cc\"><a href=\"https://www.gov.br/saude/pt-br/assuntos/saude-de-a-a-z/c/cancer-de-prostata\" target=\"_blank\" rel=\"noopener\">https://www.gov.br/saude/pt-br/assuntos/saude-de-a-a-z/c/cancer-de-prostata<\/a><\/span>. Acesso em: 24 ago. 2026. (<span class=\"cc\" style=\"--c:#1155cc\"><a href=\"https://www.gov.br/saude/pt-br/assuntos/saude-de-a-a-z/c/cancer-de-prostata?utm_source=chatgpt.com\" target=\"_blank\" rel=\"noopener\">Serviços e Informações do Brasil<\/a><\/span>)<\/li>\n<li>BRASIL. Ministério da Saúde. Secretaria de Atenção Primária à Saúde. <strong>Nota Técnica de Recomendação pelo não rastreamento populacional do câncer de próstata<\/strong>. Brasília, DF: Ministério da Saúde, 2023. (<span class=\"cc\" style=\"--c:#1155cc\"><a href=\"https://www.gov.br/saude/pt-br/composicao/saps/publicacoes/notas-tecnicas/notatecnican9_rastreio.pdf?utm_source=chatgpt.com\" target=\"_blank\" rel=\"noopener\">Serviços e Informações do Brasil<\/a><\/span>)<\/li>\n<li>INSTITUTO NACIONAL DE CÂNCER (INCA). <strong>Câncer de próstata: versão para população<\/strong>. Rio de Janeiro: INCA, atualização em 27 jun. 2025. Disponível em: <span class=\"cc\" style=\"--c:#1155cc\"><a href=\"https://www.gov.br/inca/pt-br/assuntos/cancer/tipos/prostata/versao-para-populacao\" target=\"_blank\" rel=\"noopener\">https://www.gov.br/inca/pt-br/assuntos/cancer/tipos/prostata/versao-para-populacao<\/a><\/span>. Acesso em: 24 ago. 2026. (<span class=\"cc\" style=\"--c:#1155cc\"><a href=\"https://www.gov.br/inca/pt-br/assuntos/cancer/tipos/prostata/versao-para-populacao?utm_source=chatgpt.com\" target=\"_blank\" rel=\"noopener\">Serviços e Informações do Brasil<\/a><\/span>)<\/li>\n<li>INSTITUTO NACIONAL DE CÂNCER (INCA). <strong>Câncer de próstata: versão para profissionais de saúde<\/strong>. Rio de Janeiro: INCA. Disponível em: <span class=\"cc\" style=\"--c:#1155cc\"><a href=\"https://www.gov.br/inca/pt-br/assuntos/cancer/tipos/prostata/versao-para-profissionais-de-saude/\" target=\"_blank\" rel=\"noopener\">https://www.gov.br/inca/pt-br/assuntos/cancer/tipos/prostata/versao-para-profissionai<\/a><\/span> <span class=\"cc\" style=\"--c:#1155cc\"><a href=\"https://www.gov.br/inca/pt-br/assuntos/cancer/tipos/prostata/versao-para-profissionais-de-saude/\" target=\"_blank\" rel=\"noopener\">s-de-saude/<\/a><\/span>. Acesso em: 24 ago. 2026. (<span class=\"cc\" style=\"--c:#1155cc\"><a href=\"https://www.gov.br/inca/pt-br/assuntos/cancer/tipos/prostata/versao-para-profissionais-de-saude/?utm_source=chatgpt.com\" target=\"_blank\" rel=\"noopener\">Serviços e Informações do Brasil<\/a><\/span>)<\/li>\n<li>INSTITUTO NACIONAL DE CÂNCER (INCA). <strong>Alimentação e prevenção do câncer<\/strong>. Rio de Janeiro: INCA, atualização em 23 jan. 2026. Disponível em: <span class=\"cc\" style=\"--c:#1155cc\"><a href=\"https://www.gov.br/inca/pt-br/assuntos/causas-e-prevencao-do-cancer/alimentacao\" target=\"_blank\" rel=\"noopener\">https://www.gov.br/inca/pt-br/assuntos/causas-e-prevencao-do-cancer/alimentacao<\/a><\/span>. Acesso em: 24 ago. 2026. (<span class=\"cc\" style=\"--c:#1155cc\"><a href=\"https://www.gov.br/inca/pt-br/assuntos/causas-e-prevencao-do-cancer/alimentacao?utm_source=chatgpt.com\" target=\"_blank\" rel=\"noopener\">Serviços e Informações do Brasil<\/a><\/span>)<\/li>\n<li>INSTITUTO NACIONAL DE CÂNCER (INCA). <strong>Atividade física e prevenção do câncer<\/strong>. Rio de Janeiro: INCA, atualização em 23 jan. 2026. Disponível em: <span class=\"cc\" style=\"--c:#1155cc\"><a href=\"https://www.gov.br/inca/pt-br/assuntos/causas-e-prevencao-do-cancer/atividade-fisica/\" target=\"_blank\" rel=\"noopener\">https://www.gov.br/inca/pt-br/assuntos/causas-e-prevencao-do-cancer/atividade-fisic<\/a><\/span> <span class=\"cc\" style=\"--c:#1155cc\"><a href=\"https://www.gov.br/inca/pt-br/assuntos/causas-e-prevencao-do-cancer/atividade-fisica/\" target=\"_blank\" rel=\"noopener\">a/<\/a><\/span>. Acesso em: 24 ago. 2026. (<span class=\"cc\" style=\"--c:#1155cc\"><a href=\"https://www.gov.br/inca/pt-br/assuntos/causas-e-prevencao-do-cancer/atividade-fisica/?utm_source=chatgpt.com\" target=\"_blank\" rel=\"noopener\">Serviços e Informações do Brasil<\/a><\/span>)<\/li>\n<li>INSTITUTO NACIONAL DE CÂNCER (INCA). <strong>Ministério da Saúde recomenda o não rastreamento populacional do câncer de próstata<\/strong>. Rio de Janeiro: INCA, 26 out. 2023. (<span class=\"cc\" style=\"--c:#1155cc\"><a href=\"https://www.gov.br/inca/pt-br/assuntos/noticias/2023/ministerio-da-saude-recomenda-o-nao-rastreamento-populacional-do-cancer-de-proposta?utm_source=chatgpt.com\" target=\"_blank\" rel=\"noopener\">Serviços e Informações do Brasil<\/a><\/span>)<\/li>\n<li>WORLD HEALTH ORGANIZATION. <strong>Guide to cancer early diagnosis<\/strong>. Geneva: World Health Organization, 2017.<\/li>\n<li>BRASIL. Ministério da Saúde. <strong>Câncer: diagnóstico precoce e rastreamento<\/strong>. Brasília, DF: Ministério da Saúde. (<span class=\"cc\" style=\"--c:#1155cc\"><a href=\"https://www.gov.br/saude/pt-br/assuntos/saude-de-a-a-z/saude-de-a-a-z/c/cancer?utm_source=chatgpt.com\" target=\"_blank\" rel=\"noopener\">Serviços e Informações do Brasil<\/a><\/span>)<\/li><\/ul>\n<h2 class=\"hb\" style=\"--c:#1c4587;--hb:#6d9eeb;\">6- Discuta sobre os métodos terapêuticos disponíveis no SUS.<\/h2>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#a4c2f4;\">Introdução conceitual<\/h3>\n<p>O tratamento do <strong>adenocarcinoma de próstata<\/strong> não é determinado pelo diagnóstico isoladamente. A escolha terapêutica depende principalmente do <strong>estadiamento TNM<\/strong>, do <strong>PSA<\/strong>, do <strong>Grade Group/Gleason<\/strong>, da extensão tumoral, da presença ou ausência de metástases, da expectativa de vida, das comorbidades, do estado funcional e das preferências do paciente. O Ministério da Saúde destaca que as modalidades podem ser empregadas isoladamente ou combinadas e que a decisão deve ser individualizada. (<span class=\"cc\" style=\"--c:#1155cc\"><a href=\"https://www.gov.br/saude/pt-br/assuntos/saude-de-a-a-z/c/cancer-de-prostata?utm_source=chatgpt.com\" target=\"_blank\" rel=\"noopener\">Serviços e Informações do Brasil<\/a><\/span>)<\/p>\n<p>Dentro do SUS, as principais modalidades são:<\/p>\n<p><strong>vigilância ativa/observação → cirurgia → radioterapia → terapia de privação androgênica → quimioterapia → terapias sistêmicas hormonais mais modernas → cuidados paliativos e controle de complicações. <\/strong><\/p>\n<p>A escolha depende fundamentalmente de <strong>onde está a doença e qual é sua agressividade biológica<\/strong>. Assim, é útil dividir a abordagem em doença localizada, localmente avançada e metastática.<\/p>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#a4c2f4;\">Vigilância ativa e observação<\/h3>\n<p>Antes de discutir tratamentos invasivos, é necessário compreender que <strong>nem todo câncer de próstata diagnosticado precisa de tratamento imediato<\/strong>.<\/p>\n<p>Isso ocorre porque uma parcela dos adenocarcinomas prostáticos apresenta evolução muito lenta. Em indivíduos cuidadosamente selecionados, particularmente com <strong>doença de baixo risco<\/strong>, o tratamento imediato pode produzir mais danos que benefícios, sobretudo em razão de disfunção erétil, incontinência urinária e outros efeitos adversos.<\/p>\n<p>A <strong>vigilância ativa<\/strong> consiste em acompanhar sistematicamente o paciente, em vez de tratar imediatamente o tumor. O acompanhamento pode envolver:<\/p>\n<ul>\n<li>dosagens seriadas de PSA;<\/li>\n<li>avaliação clínica e toque retal;<\/li>\n<li>ressonância magnética em situações apropriadas;<\/li>\n<li>novas biópsias conforme protocolo e evolução dos achados.<\/li><\/ul>\n<p>O objetivo <strong>não é deixar o câncer sem cuidado<\/strong>, mas identificar precocemente sinais de progressão e instituir tratamento curativo enquanto ele ainda é apropriado. O INCA reconhece essa estratégia para determinados pacientes com doença de baixo risco. (<span class=\"cc\" style=\"--c:#1155cc\"><a href=\"https://www.gov.br/inca/pt-br/assuntos/cancer/tipos/prostata/versao-para-profissionais-de-saude/?utm_source=chatgpt.com\" target=\"_blank\" rel=\"noopener\">Serviços e Informações do Brasil<\/a><\/span>)<\/p>\n<p>É importante diferenciá-la da <strong>observação vigilante (watchful waiting)<\/strong>. Na vigilância ativa, o objetivo é monitorar o tumor com intenção curativa caso haja progressão. Na observação vigilante, geralmente utilizada em pacientes com menor expectativa de vida ou comorbidades importantes, o objetivo principal é <strong>evitar tratamento curativo desnecessário e tratar sintomas quando eles surgirem<\/strong>. As diretrizes contemporâneas fazem essa distinção de maneira explícita. (<span class=\"cc\" style=\"--c:#1155cc\"><a href=\"https://uroweb.org/guidelines/prostate-cancer/chapter/treatment?utm_source=chatgpt.com\" target=\"_blank\" rel=\"noopener\">Uroweb<\/a><\/span>)<\/p>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#a4c2f4;\">Tratamento cirúrgico<\/h3>\n<h3 class=\"hb\" style=\"--c:#3c78d8;--hb:#c9daf8;\">Prostatectomia radical<\/h3>\n<p>A principal modalidade cirúrgica com intenção curativa é a <strong>prostatectomia radical<\/strong>, que consiste na retirada da próstata juntamente com as vesículas seminais, podendo ser associada à avaliação/dissecção dos linfonodos pélvicos conforme o risco.<\/p>\n<p>Seu princípio oncológico é simples:<\/p>\n<p><strong>doença localizada → remoção completa do órgão contendo o tumor → possibilidade de cura. <\/strong><\/p>\n<p>É uma opção especialmente relevante para pacientes com doença localizada e expectativa de vida suficientemente longa para que o benefício de um tratamento definitivo supere seus riscos.<\/p>\n<p>Entretanto, a cirurgia pode produzir sequelas funcionais importantes, principalmente:<\/p>\n<ul>\n<li><strong>incontinência urinária<\/strong>;<\/li>\n<li><strong>disfunção erétil<\/strong>;<\/li>\n<li>alterações ejaculatórias e infertilidade;<\/li>\n<li>complicações perioperatórias.<\/li><\/ul>\n<p>O INCA reconhece a prostatovesiculectomia radical como uma das principais alternativas terapêuticas e ressalta a possibilidade dessas complicações. (<span class=\"cc\" style=\"--c:#1155cc\"><a href=\"https://www.gov.br/inca/pt-br/assuntos/cancer/tipos/prostata/versao-para-profissionais-de-saude/?utm_source=chatgpt.com\" target=\"_blank\" rel=\"noopener\">Serviços e <\/a><\/span> <span class=\"cc\" style=\"--c:#1155cc\"><a href=\"https://www.gov.br/inca/pt-br/assuntos/cancer/tipos/prostata/versao-para-profissionais-de-saude/?utm_source=chatgpt.com\" target=\"_blank\" rel=\"noopener\">Informações do Brasil<\/a><\/span>)<\/p>\n<h3 class=\"hb\" style=\"--c:#3c78d8;--hb:#c9daf8;\">Cirurgia aberta, laparoscópica e robótica<\/h3>\n<p>A prostatectomia pode ser realizada por diferentes abordagens técnicas. A cirurgia robótica oferece algumas vantagens técnicas em centros experientes, mas isso não significa que seja obrigatoriamente superior para todos os pacientes.<\/p>\n<p>No SUS, a disponibilidade da cirurgia robótica é <strong>desigual e concentrada em determinados centros<\/strong>, devido ao custo de implantação, manutenção e necessidade de treinamento especializado. O próprio INCA descreve essa limitação. (<span class=\"cc\" style=\"--c:#1155cc\"><a href=\"https://www.gov.br/inca/pt-br/assuntos/cancer/tipos/prostata/versao-para-profissionais-de-saude/?utm_source=chatgpt.com\" target=\"_blank\" rel=\"noopener\">Serviços e <\/a><\/span> <span class=\"cc\" style=\"--c:#1155cc\"><a href=\"https://www.gov.br/inca/pt-br/assuntos/cancer/tipos/prostata/versao-para-profissionais-de-saude/?utm_source=chatgpt.com\" target=\"_blank\" rel=\"noopener\">Informações do Brasil<\/a><\/span>)<\/p>\n<p>Portanto, para a questão “métodos disponíveis no SUS”, o mais correto é pensar na <strong>prostatectomia radical como modalidade terapêutica<\/strong>, e não limitar a resposta à plataforma tecnológica empregada.<\/p>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#a4c2f4;\">Radioterapia<\/h3>\n<p>A radioterapia utiliza <strong>radiação ionizante para provocar dano ao DNA das células tumorais<\/strong>, levando à perda da capacidade proliferativa e à morte celular. Pode exercer papel <strong>curativo ou paliativo<\/strong>, dependendo do cenário clínico. (<span class=\"cc\" style=\"--c:#1155cc\"><a href=\"https://www.gov.br/inca/pt-br/assuntos/cancer/tratamento/radioterapia?utm_source=chatgpt.com\" target=\"_blank\" rel=\"noopener\">Serviços e Informações do <\/a><\/span> <span class=\"cc\" style=\"--c:#1155cc\"><a href=\"https://www.gov.br/inca/pt-br/assuntos/cancer/tratamento/radioterapia?utm_source=chatgpt.com\" target=\"_blank\" rel=\"noopener\">Brasil<\/a><\/span>)<\/p>\n<p>No câncer de próstata, as principais modalidades são a <strong>radioterapia externa (teleterapia)<\/strong>  e a <strong>braquiterapia<\/strong>.<\/p>\n<h3 class=\"hb\" style=\"--c:#3c78d8;--hb:#c9daf8;\">Radioterapia externa<\/h3>\n<p>Na teleterapia, a radiação é produzida externamente e direcionada à próstata e, conforme o risco e o estadiamento, às regiões adjacentes ou linfonodos.<\/p>\n<p>Ela pode ser utilizada como tratamento definitivo da doença localizada e, em pacientes de maior risco, pode ser combinada à <strong>terapia de privação androgênica (TPA)<\/strong>.<\/p>\n<p>A lógica é importante:<\/p>\n<p><strong>radioterapia → controle local do tumor <\/strong><\/p>\n<p><strong>TPA → redução do estímulo androgênico sistêmico <\/strong><\/p>\n<p>A associação potencializa o controle da doença em determinados grupos de risco. As diretrizes atuais recomendam essa combinação particularmente em doença intermediária desfavorável e de alto risco, com duração da TPA ajustada ao risco. (<span class=\"cc\" style=\"--c:#1155cc\"><a href=\"https://uroweb.org/guidelines/prostate-cancer/chapter/treatment?utm_source=chatgpt.com\" target=\"_blank\" rel=\"noopener\">Uroweb<\/a><\/span>)<\/p>\n<p>Os efeitos adversos da radioterapia podem envolver <strong>toxicidade urinária, intestinal e sexual<\/strong>, embora os perfis de toxicidade sejam diferentes daqueles observados após prostatectomia. O INCA cita sintomas como aumento da frequência urinária, ardor ao urinar, diarreia e hematúria entre os possíveis efeitos. (<span class=\"cc\" style=\"--c:#1155cc\"><a href=\"https://www.gov.br/inca/pt-br/assuntos/cancer/tipos/prostata/versao-para-profissionais-de-saude/?utm_source=chatgpt.com\" target=\"_blank\" rel=\"noopener\">Serviços e Informações do Brasil<\/a><\/span>)<\/p>\n<h3 class=\"hb\" style=\"--c:#3c78d8;--hb:#c9daf8;\">Braquiterapia<\/h3>\n<p>Na <strong>braquiterapia<\/strong>, fontes radioativas são posicionadas diretamente na próstata. A vantagem conceitual é permitir uma elevada dose de radiação no tecido-alvo, reduzindo a exposição relativa de tecidos adjacentes.<\/p>\n<p>Pode ser utilizada em pacientes cuidadosamente selecionados com doença localizada, isoladamente ou como reforço associado à radioterapia externa em situações específicas. (<span class=\"cc\" style=\"--c:#1155cc\"><a href=\"https://www.gov.br/inca/pt-br/assuntos/cancer/tipos/prostata/versao-para-profissionais-de-saude/?utm_source=chatgpt.com\" target=\"_blank\" rel=\"noopener\">Serviços e Informações do Brasil<\/a><\/span>)<\/p>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#a4c2f4;\">4. Terapia de privação androgênica<\/h3>\n<h3 class=\"hb\" style=\"--c:#3c78d8;--hb:#c9daf8;\">Fundamentação fisiopatológica<\/h3>\n<p>A terapia hormonal é particularmente importante porque o adenocarcinoma prostático é, em grande parte, <strong>dependente do eixo de sinalização do receptor de andrógeno<\/strong>.<\/p>\n<p>A testosterona é produzida predominantemente pelas células de Leydig testiculares. Parte dela é convertida em <strong>di-hidrotestosterona (DHT)<\/strong> pela 5α-redutase. A testosterona e a DHT ativam o <strong>receptor de andrógeno<\/strong>, um fator de transcrição nuclear fundamental para a biologia das células prostáticas.<\/p>\n<p>No câncer de próstata, a sinalização androgênica estimula:<\/p>\n<p><strong>ativação do receptor androgênico → expressão de genes proliferativos e de sobrevivência → crescimento tumoral. <\/strong><\/p>\n<p>Assim, reduzir a atividade androgênica pode produzir regressão tumoral e diminuição importante do PSA.<\/p>\n<h3 class=\"hb\" style=\"--c:#3c78d8;--hb:#c9daf8;\">Como produzir a privação androgênica?<\/h3>\n<p>A chamada “castração” pode ser obtida por:<\/p>\n<h3 class=\"hb\" style=\"--c:#bf9000;--hb:#ffe599;\">Orquiectomia bilateral<\/h3>\n<p>É a <strong>castração cirúrgica<\/strong>, na qual os testículos são removidos.<\/p>\n<p>Tem como vantagem produzir supressão androgênica definitiva, sem necessidade de aplicações periódicas. Entretanto, possui caráter irreversível e pode apresentar grande impacto psicológico e funcional.<\/p>\n<h3 class=\"hb\" style=\"--c:#bf9000;--hb:#ffe599;\">Castração medicamentosa<\/h3>\n<p>Pode ser realizada com fármacos que suprimem a produção testicular de testosterona, principalmente por meio da modulação do eixo hipotálamo–hipófise–gônada.<\/p>\n<p>O INCA cita o uso de <strong>análogos de LHRH/GnRH<\/strong> como uma das formas de obtenção da castração química. (<span class=\"cc\" style=\"--c:#1155cc\"><a href=\"https://www.gov.br/inca/pt-br/assuntos/cancer/tipos/prostata/versao-para-profissionais-de-saude/?utm_source=chatgpt.com\" target=\"_blank\" rel=\"noopener\">Serviços e Informações do Brasil<\/a><\/span>)<\/p>\n<p>A TPA possui papel especialmente importante em:<\/p>\n<ul>\n<li>doença localmente avançada;<\/li>\n<li>doença de alto risco em associação à radioterapia;<\/li>\n<li>doença metastática;<\/li>\n<li>determinadas situações de recorrência.<\/li><\/ul>\n<p>Porém, <strong>TPA isolada não deve ser utilizada indiscriminadamente para todos os cânceres localizados<\/strong>. Nas doenças localizadas de baixo risco, por exemplo, não oferece o mesmo benefício de uma abordagem local ou vigilância adequadamente selecionada. (<span class=\"cc\" style=\"--c:#1155cc\"><a href=\"https://uroweb.org/guidelines/prostate-cancer/chapter/treatment?utm_source=chatgpt.com\" target=\"_blank\" rel=\"noopener\">Uroweb<\/a><\/span>)<\/p>\n<h3 class=\"hb\" style=\"--c:#3c78d8;--hb:#c9daf8;\">Efeitos adversos<\/h3>\n<p>Como os andrógenos desempenham funções fisiológicas sistêmicas, sua supressão provoca consequências importantes:<\/p>\n<p><strong>↓ testosterona → ↓ libido, disfunção sexual, ondas de calor, perda de massa muscular, aumento da gordura corporal, perda óssea e alterações metabólicas. <\/strong><\/p>\n<p>Podem ocorrer também alterações do humor e aumento do risco de eventos metabólicos e cardiovasculares em determinados pacientes. O INCA destaca diversos desses efeitos adversos. (<span class=\"cc\" style=\"--c:#1155cc\"><a href=\"https://www.gov.br/inca/pt-br/assuntos/cancer/tipos/prostata/versao-para-profissionais-de-saude/?utm_source=chatgpt.com\" target=\"_blank\" rel=\"noopener\">Serviços e Informações do Brasil<\/a><\/span>)<\/p>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#a4c2f4;\">Quimioterapia<\/h3>\n<p>A quimioterapia possui papel principalmente na <strong>doença avançada<\/strong>, particularmente quando há doença metastática e quando o tratamento exclusivamente hormonal não é suficiente.<\/p>\n<p>O principal agente quimioterápico tradicionalmente empregado é o <strong>docetaxel<\/strong>, um taxano que interfere na dinâmica dos microtúbulos e, consequentemente, na divisão celular.<\/p>\n<p>Historicamente, a quimioterapia era mais utilizada após desenvolvimento de resistência à castração. Atualmente, a estratégia terapêutica evoluiu: em determinados pacientes com <strong>câncer metastático sensível à castração<\/strong>, o docetaxel pode ser utilizado precocemente em associação à TPA, especialmente em pacientes selecionados conforme volume e características da doença.<\/p>\n<p>O próprio Ministério da Saúde reconhece o uso do docetaxel no contexto terapêutico do câncer metastático, e a Conitec incorporou a <strong>abiraterona isolada ou associada ao docetaxel em pacientes com câncer de próstata metastático sensível à castração<\/strong>, conforme protocolo. (<span class=\"cc\" style=\"--c:#1155cc\"><a href=\"https://www.gov.br/conitec/pt-br/midias/relatorios/2024/abiraterona-em-monoterapia-ou-associada-ao-docetaxel-para-o-tratamento-de-pacientes-com-cancer-de-prostata-sensivel-a-castracao-e-metastatico-cpscm?utm_source=chatgpt.com\" target=\"_blank\" rel=\"noopener\">Serviços e Informações do Brasil<\/a><\/span>)<\/p>\n<p>Os efeitos tóxicos do docetaxel incluem <strong>mielossupressão, neutropenia, alopecia, náuseas, alterações gastrointestinais e neuropatia periférica<\/strong>, entre outros.<\/p>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#a4c2f4;\">Terapias hormonais de nova geração<\/h3>\n<p>Esse é um ponto importante porque a terapêutica contemporânea do câncer de próstata ultrapassou a simples supressão da testosterona.<\/p>\n<p>Mesmo com níveis muito baixos de testosterona circulante, algumas células tumorais conseguem manter a ativação do receptor de andrógeno. Isso contribui para o desenvolvimento do <strong>câncer de próstata resistente à castração (CPRC)<\/strong>.<\/p>\n<p>Surgem então medicamentos que atuam em diferentes pontos da via androgênica.<\/p>\n<h3 class=\"hb\" style=\"--c:#3c78d8;--hb:#c9daf8;\">Abiraterona<\/h3>\n<p>A <strong>abiraterona<\/strong> inibe a enzima CYP17, reduzindo a síntese de andrógenos nos testículos, nas adrenais e no próprio microambiente tumoral.<\/p>\n<p>Ela representa um avanço importante no tratamento da doença metastática.<\/p>\n<p>No SUS, existe incorporação específica de <strong>abiraterona associada à TPA para câncer de próstata resistente à castração, metastático e virgem de quimioterapia<\/strong>. Em 2024, também foi incorporada <strong>abiraterona isoladamente ou associada ao docetaxel para câncer de próstata metastático sensível à castração<\/strong>, conforme protocolo. (<span class=\"cc\" style=\"--c:#1155cc\"><a href=\"https://www.gov.br/conitec/pt-br/midias/relatorios/portaria/2024/portaria-sectics-ms-no-33-de-22-de-agosto-de-2024?utm_source=chatgpt.com\" target=\"_blank\" rel=\"noopener\">Serviços e <\/a><\/span> <span class=\"cc\" style=\"--c:#1155cc\"><a href=\"https://www.gov.br/conitec/pt-br/midias/relatorios/portaria/2024/portaria-sectics-ms-no-33-de-22-de-agosto-de-2024?utm_source=chatgpt.com\" target=\"_blank\" rel=\"noopener\">Informações do Brasil<\/a><\/span>)<\/p>\n<h3 class=\"hb\" style=\"--c:#3c78d8;--hb:#c9daf8;\">Antiandrogênicos de nova geração<\/h3>\n<p>Fármacos como <strong>enzalutamida, apalutamida e darolutamida<\/strong> atuam predominantemente bloqueando o receptor de andrógeno ou sua sinalização.<\/p>\n<p>Contudo, existe uma distinção fundamental para esta questão:<\/p>\n<p><strong>Uma droga existir na prática oncológica mundial não significa que ela esteja incorporada pelo SUS para todas as suas indicações. <\/strong><\/p>\n<p>Em agosto de 2024, a Conitec incorporou determinados usos de <strong>abiraterona<\/strong>, mas não incorporou enzalutamida, apalutamida e darolutamida para algumas indicações avaliadas naquele processo. Portanto, a disponibilidade dessas tecnologias depende da <strong>indicação clínica e das incorporações específicas vigentes<\/strong>, e não apenas do fato de serem medicamentos utilizados internacionalmente. (<span class=\"cc\" style=\"--c:#1155cc\"><a href=\"https://www.gov.br/conitec/pt-br/midias/relatorios/portaria/2024/portaria-sectics-ms-no-32-de-22-de-agosto-de-2024?utm_source=chatgpt.com\" target=\"_blank\" rel=\"noopener\">Serviços e Informações do Brasil<\/a><\/span>)<\/p>\n<p>Esse é um excelente exemplo de como <strong>evidência científica, avaliação de tecnologia em saúde, custo-efetividade e política pública<\/strong> interagem na construção do tratamento oferecido pelo SUS.<\/p>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#a4c2f4;\">Tratamento conforme o estágio da doença<\/h3>\n<p>A melhor maneira de integrar as modalidades é relacioná-las ao estágio clínico.<\/p>\n<div class=\"tbl\"><table><tr><th><strong>Situação<\/strong><\/th><th><strong>Estratégias terapêuticas principais<\/strong><\/th><\/tr><tr><td><strong>Baixo <\/strong> <strong>risco/localizado<\/strong><\/td><td>Vigilância ativa; cirurgia ou radioterapia em pacientes selecionados<\/td><\/tr><tr><td><strong>Risco intermediário<\/strong><\/td><td>Prostatectomia radical ou radioterapia; TPA pode ser associada em determinadas categorias<\/td><\/tr><tr><td><strong>Alto <\/strong> <strong>risco/localmente <\/strong> <strong>avançado<\/strong><\/td><td>Radioterapia + TPA de longo prazo; cirurgia em pacientes selecionados como parte de estratégia multimodal<\/td><\/tr><tr><td><strong>Metastático <\/strong> <strong>hormônio-sensível<\/strong><\/td><td>TPA + intensificação sistêmica selecionada, incluindo docetaxel e/ou abiraterona conforme critérios<\/td><\/tr><tr><td><strong>Resistente <\/strong> <strong>à <\/strong> <strong>castração<\/strong><\/td><td>Manutenção da supressão androgênica + terapias sistêmicas conforme situação clínica e incorporações vigentes<\/td><\/tr><tr><td><strong>Doença sintomática <\/strong> <strong>avançada<\/strong><\/td><td>Tratamento sistêmico + radioterapia/medidas paliativas conforme sintomas e sítios de doença<\/td><\/tr><\/table><\/div>\n<p>Essa tabela deve ser entendida como <strong>estrutura de raciocínio<\/strong>, não como algoritmo absoluto. As diretrizes atuais enfatizam que a decisão deve ser individualizada. (<span class=\"cc\" style=\"--c:#1155cc\"><a href=\"https://www.gov.br/inca/pt-br/assuntos/cancer/tipos/prostata/versao-para-profissionais-de-saude/?utm_source=chatgpt.com\" target=\"_blank\" rel=\"noopener\">Serviços e <\/a><\/span> <span class=\"cc\" style=\"--c:#1155cc\"><a href=\"https://www.gov.br/inca/pt-br/assuntos/cancer/tipos/prostata/versao-para-profissionais-de-saude/?utm_source=chatgpt.com\" target=\"_blank\" rel=\"noopener\">Informações do Brasil<\/a><\/span>)<\/p>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#a4c2f4;\">Tratamento das metástases e cuidados paliativos<\/h3>\n<p>O câncer de próstata apresenta predileção importante pelo <strong>esqueleto<\/strong>, e as metástases ósseas podem produzir dor, fraturas patológicas, compressão medular e outros eventos relacionados ao esqueleto.<\/p>\n<p>Nesse contexto, o objetivo do tratamento deixa de ser exclusivamente a erradicação do tumor primário e passa a incluir:<\/p>\n<p><strong>controle da doença + prevenção de complicações + controle da dor + manutenção da funcionalidade + qualidade de vida. <\/strong><\/p>\n<p>A <strong>radioterapia paliativa<\/strong> possui papel importante para lesões ósseas dolorosas e pode reduzir dor e outros sintomas decorrentes de massas tumorais. O INCA também destaca o emprego de medidas farmacológicas, incluindo analgésicos e, em situações específicas, agentes voltados à saúde óssea. (<span class=\"cc\" style=\"--c:#1155cc\"><a href=\"https://www.gov.br/inca/pt-br/assuntos/cancer/tipos/prostata/versao-para-profissionais-de-saude/?utm_source=chatgpt.com\" target=\"_blank\" rel=\"noopener\">Serviços e Informações do Brasil<\/a><\/span>)<\/p>\n<p>Os <strong>cuidados paliativos<\/strong> não significam abandono terapêutico. São cuidados ativos destinados a pacientes com doença grave e progressiva, podendo coexistir com tratamento antineoplásico. O objetivo é tratar sofrimento físico, psicológico, social e espiritual e preservar a qualidade de vida. (<span class=\"cc\" style=\"--c:#1155cc\"><a href=\"https://www.gov.br/inca/pt-br/assuntos/cancer/tratamento?utm_source=chatgpt.com\" target=\"_blank\" rel=\"noopener\">Serviços e Informações do Brasil<\/a><\/span>)<\/p>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#a4c2f4;\">Tratamentos sintomáticos e procedimentos paliativos<\/h3>\n<p>Um exemplo clássico é a <strong>ressecção transuretral da próstata (RTU de próstata)<\/strong>.<\/p>\n<p>Ela <strong>não é tratamento curativo do câncer de próstata<\/strong>. Pode ser empregada para aliviar obstrução urinária importante decorrente da doença ou de condições prostáticas associadas.<\/p>\n<p>Portanto:<\/p>\n<p><strong>prostatectomia radical → tratamento oncológico potencialmente curativo <\/strong><\/p>\n<p><strong>RTU de próstata → tratamento predominantemente sintomático/paliativo da obstrução <\/strong><\/p>\n<p>O INCA faz essa distinção explicitamente. (<span class=\"cc\" style=\"--c:#1155cc\"><a href=\"https://www.gov.br/inca/pt-br/assuntos/cancer/tipos/prostata/versao-para-profissionais-de-saude/?utm_source=chatgpt.com\" target=\"_blank\" rel=\"noopener\">Serviços e Informações do Brasil<\/a><\/span>)<\/p>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#a4c2f4;\">Organização da assistência dentro do SUS<\/h3>\n<p>O tratamento oncológico no SUS ocorre dentro de uma rede regionalizada. Os pacientes são encaminhados para unidades especializadas de alta complexidade, principalmente as <strong>UNACONs (Unidades de Assistência de Alta Complexidade em Oncologia)<\/strong> e os <strong>CACONs (Centros de Assistência de Alta Complexidade em Oncologia)<\/strong>.<\/p>\n<p>Essas unidades oferecem assistência oncológica integral, incluindo diagnóstico, estadiamento, cirurgia, radioterapia e tratamentos sistêmicos conforme a estrutura e habilitação do serviço. Atualmente, o INCA informa a existência de <strong>317 unidades e centros de assistência habilitados em oncologia<\/strong>, distribuídos pelos estados brasileiros. (<span class=\"cc\" style=\"--c:#1155cc\"><a href=\"https://www.gov.br/inca/pt-br/assuntos/cancer/tratamento/onde-tratar-pelo-sus?utm_source=chatgpt.com\" target=\"_blank\" rel=\"noopener\">Serviços <\/a><\/span> <span class=\"cc\" style=\"--c:#1155cc\"><a href=\"https://www.gov.br/inca/pt-br/assuntos/cancer/tratamento/onde-tratar-pelo-sus?utm_source=chatgpt.com\" target=\"_blank\" rel=\"noopener\">e Informações do Brasil<\/a><\/span>)<\/p>\n<p>Esse aspecto é relevante dentro do conceito de <strong>integralidade do SUS<\/strong>: o tratamento não deve ser interpretado simplesmente como fornecimento de um medicamento, mas como uma linha de cuidado que compreende:<\/p>\n<p><strong>diagnóstico → estadiamento → tratamento → controle de toxicidades → acompanhamento → manejo da recorrência → cuidados paliativos quando necessários. <\/strong><\/p>\n<p>As DDTs oncológicas do Ministério da Saúde são instrumentos que orientam as condutas baseadas em evidências, mas possuem uma particularidade: devido à forma de financiamento da oncologia no SUS, elas não se limitam estritamente às tecnologias formalmente incorporadas como ocorre em alguns PCDTs. (<span class=\"cc\" style=\"--c:#1155cc\"><a href=\"https://www.gov.br/conitec/pt-br/assuntos/avaliacao-de-tecnologias-em-saude/protocolos-clinicos-e-diretrizes-terapeuticas/ddt?utm_source=chatgpt.com\" target=\"_blank\" rel=\"noopener\">Serviços e Informações do <\/a><\/span> <span class=\"cc\" style=\"--c:#1155cc\"><a href=\"https://www.gov.br/conitec/pt-br/assuntos/avaliacao-de-tecnologias-em-saude/protocolos-clinicos-e-diretrizes-terapeuticas/ddt?utm_source=chatgpt.com\" target=\"_blank\" rel=\"noopener\">Brasil<\/a><\/span>)<\/p>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#a4c2f4;\">Relação com o Gleason estudado anteriormente<\/h3>\n<p>A questão anterior sobre <strong>Gleason/Grade Group<\/strong> é diretamente necessária para compreender esta.<\/p>\n<p>O Gleason não escolhe sozinho o tratamento, mas contribui para estabelecer o <strong>risco biológico do tumor<\/strong>.<\/p>\n<p>Podemos construir o raciocínio:<\/p>\n<p><strong>Biópsia → Gleason/Grade Group → agressividade histológica <\/strong><\/p>\n<p><strong>PSA + Gleason + TNM → estratificação de risco <\/strong><\/p>\n<p><strong>Estratificação de risco + expectativa de vida + comorbidades → escolha terapêutica <\/strong><\/p>\n<p>Por exemplo, um <strong>Gleason 3+3=6 / ISUP Grade Group 1<\/strong>, localizado e em paciente com expectativa de vida significativa, pode ser manejado com vigilância ativa em situação apropriada. Já um <strong>Gleason 9–10 / Grade Group 5<\/strong>, mesmo sem metástases detectáveis, representa doença de alto risco, frequentemente exigindo uma abordagem multimodal mais agressiva.<\/p>\n<p>Assim, os conceitos das questões anteriores formam uma sequência clínica:<\/p>\n<p><strong>prevenção → detecção precoce → diagnóstico histológico → Gleason/ISUP → estadiamento → estratificação de risco → tratamento.<\/strong><\/p>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#a4c2f4;\">Síntese integradora<\/h3>\n<p>O tratamento do câncer de próstata no SUS é <strong>multimodal e individualizado<\/strong>. Não existe uma terapêutica única aplicável a todos os pacientes.<\/p>\n<p>Na <strong>doença localizada de baixo risco<\/strong>, pode-se evitar o tratamento imediato por meio da <strong>vigilância ativa<\/strong>, reduzindo o risco de sobretratamento. Quando há indicação de tratamento definitivo, as principais modalidades locais são a <strong>prostatectomia radical<\/strong> e a <strong>radioterapia<\/strong>, incluindo técnicas de braquiterapia.<\/p>\n<p>Na <strong>doença intermediária, de alto risco e localmente avançada<\/strong>, pode ser necessária uma estratégia multimodal, especialmente a combinação de <strong>radioterapia e terapia de privação androgênica<\/strong>, enquanto a cirurgia pode ser empregada em pacientes selecionados.<\/p>\n<p>Na <strong>doença metastática<\/strong>, o eixo central passa a ser o <strong>tratamento sistêmico<\/strong>, especialmente a supressão androgênica, que pode ser intensificada em pacientes elegíveis com medicamentos como <strong>docetaxel ou abiraterona<\/strong>, conforme o cenário clínico e as regras de incorporação do SUS. (<span class=\"cc\" style=\"--c:#1155cc\"><a href=\"https://www.gov.br/conitec/pt-br/midias/relatorios/2024/abiraterona-em-monoterapia-ou-associada-ao-docetaxel-para-o-tratamento-de-pacientes-com-cancer-de-prostata-sensivel-a-castracao-e-metastatico-cpscm?utm_source=chatgpt.com\" target=\"_blank\" rel=\"noopener\">Serviços e Informações do Brasil<\/a><\/span>)<\/p>\n<p>Quando surge <strong>resistência à castração<\/strong>, a biologia tumoral muda de importância: o câncer consegue continuar proliferando apesar dos baixos níveis de testosterona, justificando o emprego de estratégias sistêmicas adicionais. Algumas dessas tecnologias estão incorporadas ao SUS apenas para <strong>indicações específicas<\/strong>, o que demonstra a importância de diferenciar “tratamento disponível na literatura” de “tratamento efetivamente incorporado à política pública brasileira”. (<span class=\"cc\" style=\"--c:#1155cc\"><a href=\"https://www.gov.br/conitec/pt-br/midias/relatorios/portaria/2024/portaria-sectics-ms-no-33-de-22-de-agosto-de-2024?utm_source=chatgpt.com\" target=\"_blank\" rel=\"noopener\">Serviços e Informações do Brasil<\/a><\/span>)<\/p>\n<p>Por fim, em doença avançada, o tratamento deve incorporar <strong>controle da dor, prevenção de complicações ósseas, radioterapia paliativa, manejo dos sintomas urinários e cuidados paliativos<\/strong>, de modo que a finalidade terapêutica seja não apenas prolongar a sobrevida, mas também preservar <strong>funcionalidade e qualidade de vida<\/strong>.<\/p>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#a4c2f4;\">Referências<\/h3>\n<ul>\n<li>BRASIL. Ministério da Saúde. <strong>Câncer de próstata<\/strong>. Brasília, DF: Ministério da Saúde. Disponível em: <span class=\"cc\" style=\"--c:#1155cc\"><a href=\"https://www.gov.br/saude/pt-br/assuntos/saude-de-a-a-z/c/cancer-de-prostata\" target=\"_blank\" rel=\"noopener\">https://www.gov.br/saude/pt-br/assuntos/saude-de-a-a-z/c/cancer-de-prostata<\/a><\/span>. Acesso em: 24 ago. 2026. (<span class=\"cc\" style=\"--c:#1155cc\"><a href=\"https://www.gov.br/saude/pt-br/assuntos/saude-de-a-a-z/c/cancer-de-prostata?utm_source=chatgpt.com\" target=\"_blank\" rel=\"noopener\">Serviços e Informações do Brasil<\/a><\/span>)<\/li>\n<li>BRASIL. Ministério da Saúde. Secretaria de Atenção à Saúde. <strong>Diretrizes Diagnósticas e Terapêuticas do Adenocarcinoma de Próstata<\/strong>. Brasília, DF: Ministério da Saúde, 2016. Portaria SAS/MS nº 498, de 11 de maio de 2016. (<span class=\"cc\" style=\"--c:#1155cc\"><a href=\"https://www.gov.br/conitec/pt-br/midias/protocolos/ddt/ddt_adenocarcinoma_prostata.pdf?utm_source=chatgpt.com\" target=\"_blank\" rel=\"noopener\">Serviços e Informações do Brasil<\/a><\/span>)<\/li>\n<li>BRASIL. Ministério da Saúde. Comissão Nacional de Incorporação de Tecnologias no Sistema Único de Saúde. <strong>Diretrizes Diagnósticas e Terapêuticas – DDT<\/strong>. Brasília, DF: CONITEC. Atualizado em 17 jul. 2026. (<span class=\"cc\" style=\"--c:#1155cc\"><a href=\"https://www.gov.br/conitec/pt-br/assuntos/avaliacao-de-tecnologias-em-saude/protocolos-clinicos-e-diretrizes-terapeuticas/ddt?utm_source=chatgpt.com\" target=\"_blank\" rel=\"noopener\">Serviços e Informações do <\/a><\/span> <span class=\"cc\" style=\"--c:#1155cc\"><a href=\"https://www.gov.br/conitec/pt-br/assuntos/avaliacao-de-tecnologias-em-saude/protocolos-clinicos-e-diretrizes-terapeuticas/ddt?utm_source=chatgpt.com\" target=\"_blank\" rel=\"noopener\">Brasil<\/a><\/span>)<\/li>\n<li>BRASIL. Ministério da Saúde. Comissão Nacional de Incorporação de Tecnologias no Sistema Único de Saúde. <strong>Portaria SECTICS/MS nº 32, de 22 de agosto de 2024<\/strong>. Incorpora abiraterona para câncer de próstata metastático sensível à castração e estabelece decisões sobre enzalutamida, darolutamida e apalutamida. Brasília, DF, 2024. (<span class=\"cc\" style=\"--c:#1155cc\"><a href=\"https://www.gov.br/conitec/pt-br/midias/relatorios/portaria/2024/portaria-sectics-ms-no-32-de-22-de-agosto-de-2024?utm_source=chatgpt.com\" target=\"_blank\" rel=\"noopener\">Serviços e Informações do Brasil<\/a><\/span>)<\/li>\n<li>BRASIL. Ministério da Saúde. Comissão Nacional de Incorporação de Tecnologias no Sistema Único de Saúde. <strong>Portaria SECTICS/MS nº 33, de 22 de agosto de 2024<\/strong>. Brasília, DF, 2024. (<span class=\"cc\" style=\"--c:#1155cc\"><a href=\"https://www.gov.br/conitec/pt-br/midias/relatorios/portaria/2024/portaria-sectics-ms-no-33-de-22-de-agosto-de-2024?utm_source=chatgpt.com\" target=\"_blank\" rel=\"noopener\">Serviços e Informações do Brasil<\/a><\/span>)<\/li>\n<li>INSTITUTO NACIONAL DE CÂNCER (INCA). <strong>Câncer de próstata: versão para profissionais de saúde<\/strong>. Rio de Janeiro: INCA. Disponível em: <span class=\"cc\" style=\"--c:#1155cc\"><a href=\"https://www.gov.br/inca/pt-br/assuntos/cancer/tipos/prostata/versao-para-profissionais-de-saude/\" target=\"_blank\" rel=\"noopener\">https://www.gov.br/inca/pt-br/assuntos/cancer/tipos/prostata/versao-para-profissionai<\/a><\/span> <span class=\"cc\" style=\"--c:#1155cc\"><a href=\"https://www.gov.br/inca/pt-br/assuntos/cancer/tipos/prostata/versao-para-profissionais-de-saude/\" target=\"_blank\" rel=\"noopener\">s-de-saude/<\/a><\/span>. Acesso em: 24 ago. 2026. (<span class=\"cc\" style=\"--c:#1155cc\"><a href=\"https://www.gov.br/inca/pt-br/assuntos/cancer/tipos/prostata/versao-para-profissionais-de-saude/?utm_source=chatgpt.com\" target=\"_blank\" rel=\"noopener\">Serviços e Informações do Brasil<\/a><\/span>)<\/li>\n<li>INSTITUTO NACIONAL DE CÂNCER (INCA). <strong>Câncer de próstata: versão para população<\/strong>. Rio de Janeiro: INCA. Disponível em: <span class=\"cc\" style=\"--c:#1155cc\"><a href=\"https://www.gov.br/inca/pt-br/assuntos/cancer/tipos/prostata/versao-para-populacao\" target=\"_blank\" rel=\"noopener\">https://www.gov.br/inca/pt-br/assuntos/cancer/tipos/prostata/versao-para-populacao<\/a><\/span>. Acesso em: 24 ago. 2026. (<span class=\"cc\" style=\"--c:#1155cc\"><a href=\"https://www.gov.br/inca/pt-br/assuntos/cancer/tipos/prostata/versao-para-populacao?utm_source=chatgpt.com\" target=\"_blank\" rel=\"noopener\">Serviços e Informações do Brasil<\/a><\/span>)<\/li>\n<li>INSTITUTO NACIONAL DE CÂNCER (INCA). <strong>Onde tratar pelo SUS<\/strong>. Rio de Janeiro: INCA, atualização em 13 ago. 2026. (<span class=\"cc\" style=\"--c:#1155cc\"><a href=\"https://www.gov.br/inca/pt-br/assuntos/cancer/tratamento/onde-tratar-pelo-sus?utm_source=chatgpt.com\" target=\"_blank\" rel=\"noopener\">Serviços e Informações do Brasil<\/a><\/span>)<\/li>\n<li>EUROPEAN ASSOCIATION OF UROLOGY. <strong>EAU Guidelines on Prostate Cancer: Treatment<\/strong>. Arnhem: EAU, 2026. Cap. 6. (<span class=\"cc\" style=\"--c:#1155cc\"><a href=\"https://uroweb.org/guidelines/prostate-cancer/chapter/treatment?utm_source=chatgpt.com\" target=\"_blank\" rel=\"noopener\">Uroweb<\/a><\/span>)<\/li>\n<li>NATIONAL COMPREHENSIVE CANCER NETWORK. <strong>NCCN Clinical Practice Guidelines in Oncology: Prostate Cancer<\/strong>. Plymouth Meeting, PA: NCCN, 2026.<\/li>\n<li>BRUNTON, L. L.; HILAL-DANDAN, R.; KNOLLMANN, B. C. <strong>Goodman &amp; Gilman's The Pharmacological Basis of Therapeutics<\/strong>. 14. ed. New York: McGraw Hill, 2023. Capítulos relativos à farmacologia dos andrógenos e terapia antineoplásica.<\/li>\n<li>KUMAR, V.; ABBAS, A. K.; ASTER, J. C. <strong>Robbins &amp; Cotran Pathologic Basis of Disease<\/strong>. 10. ed. Philadelphia: Elsevier, 2021. Capítulo sobre o sistema genital masculino e neoplasias prostáticas.<\/li>\n<li>WEIN, A. J. et al. <strong>Campbell-Walsh-Wein Urology<\/strong>. 13. ed. Philadelphia: Elsevier, 2020. Capítulo sobre câncer de próstata.<\/li><\/ul>\n<h2 class=\"hb\" style=\"--c:#1c4587;--hb:#6d9eeb;\">7- Aborde a definição de metástase, como ela ocorre e indique os sítios metastáticos do câncer de próstata.<\/h2>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#a4c2f4;\">Introdução conceitual<\/h3>\n<p><strong>Metástase<\/strong> é a formação de um foco neoplásico <strong>secundário, distinto do tumor primário, em um órgão ou tecido anatomicamente separado<\/strong>, após a disseminação de células malignas a partir do tumor de origem. Ela constitui uma das principais características da malignidade e representa um processo biológico ativo e altamente seletivo, no qual apenas uma pequena fração das células tumorais consegue completar todas as etapas necessárias para estabelecer uma nova colônia tumoral.<\/p>\n<p>No câncer de próstata, a disseminação metastática possui grande relevância clínica porque determina o <strong>estadiamento<\/strong>, modifica o objetivo terapêutico e está diretamente associada à morbimortalidade. O <strong>osso é, de longe, o principal sítio metastático<\/strong>, seguido pelos linfonodos e, em menor frequência, pulmões, fígado e outros órgãos. A forte predileção do adenocarcinoma prostático pelo esqueleto não é explicada simplesmente pelo fato de o sangue venoso da próstata alcançar a circulação sistêmica; ela depende de uma complexa interação entre células tumorais, vasos, matriz extracelular e o <strong>microambiente ósseo<\/strong>, fenômeno frequentemente descrito como <em>seed and soil<\/em>.<\/p>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#a4c2f4;\">1. O que caracteriza uma metástase?<\/h3>\n<p>Para que uma lesão seja considerada metastática, é necessário que células do tumor primário:<\/p>\n<p><strong>se desprendam do tumor → invadam o tecido adjacente → alcancem vasos linfáticos ou sanguíneos → sobrevivam à circulação → deixem o vaso → colonizem um novo tecido → proliferem e estabeleçam um foco secundário clinicamente detectável. <\/strong><\/p>\n<p>Portanto, metástase não é simplesmente “uma célula de câncer que circulou”. O fenômeno envolve uma sequência complexa de eventos denominada <strong>cascata metastática<\/strong>.<\/p>\n<p>Essa distinção é importante porque muitas células tumorais podem entrar na circulação e morrer. Assim, <strong>disseminação sistêmica e metástase estabelecida não são sinônimos<\/strong>.<\/p>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#a4c2f4;\">2. Como ocorre a disseminação metastática?<\/h3>\n<h3 class=\"hb\" style=\"--c:#3c78d8;--hb:#c9daf8;\">2.1. Progressão e seleção clonal<\/h3>\n<p>O processo geralmente começa dentro do próprio tumor primário.<\/p>\n<p>As neoplasias malignas são constituídas por populações celulares geneticamente e epigeneticamente heterogêneas. Durante a evolução tumoral, determinados clones adquirem características que aumentam sua capacidade de:<\/p>\n<ul>\n<li>proliferar;<\/li>\n<li>sobreviver em condições adversas;<\/li>\n<li>invadir tecidos;<\/li>\n<li>migrar;<\/li>\n<li>resistir à resposta imune;<\/li>\n<li>sobreviver na circulação;<\/li>\n<li>adaptar-se a um novo microambiente.<\/li><\/ul>\n<p>Assim, a capacidade metastática não surge simplesmente porque “o tumor ficou grande”, mas resulta da <strong>seleção de clones com fenótipo invasivo e metastático<\/strong>.<\/p>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#a4c2f4;\">3. Invasão local<\/h3>\n<p>O primeiro passo da cascata metastática é a capacidade de as células tumorais <strong>ultrapassarem seus limites anatômicos normais<\/strong>.<\/p>\n<p>Normalmente, as células epiteliais permanecem unidas por complexas estruturas de adesão e separadas do estroma pela <strong>membrana basal<\/strong>. Nas células neoplásicas, alterações na adesão celular e na interação com a matriz extracelular favorecem a perda da coesão e a aquisição de propriedades migratórias.<\/p>\n<p>Nesse processo podem ocorrer fenômenos relacionados à <strong>transição epitélio-mesenquimal (EMT)<\/strong>, nos quais células de características epiteliais passam a apresentar maior plasticidade, motilidade e capacidade invasiva. Entre as alterações frequentemente discutidas estão:<\/p>\n<p><strong>↓ E-caderina → ↓ adesão celular <\/strong><\/p>\n<p><strong>↑ fatores de transcrição como SNAIL, SLUG e TWIST → aquisição de fenótipo migratório <\/strong><\/p>\n<p>Embora a EMT não seja um processo binário obrigatório em todos os tumores, ela representa um importante modelo conceitual para compreender a aquisição de características invasivas.<\/p>\n<h3 class=\"hb\" style=\"--c:#3c78d8;--hb:#c9daf8;\">Degradação da matriz extracelular<\/h3>\n<p>Para atravessar o estroma, as células neoplásicas precisam modificar a matriz extracelular e a membrana basal.<\/p>\n<p>Participam desse processo enzimas proteolíticas, especialmente as <strong>metaloproteinases de matriz (MMPs)<\/strong>, além de outras proteases.<\/p>\n<p>O resultado é:<\/p>\n<p><strong>degradação da membrana basal + remodelamento da matriz extracelular → criação de uma via para migração celular. <\/strong><\/p>\n<p>A célula tumoral também altera o microambiente por meio de fatores de crescimento, citocinas e quimiocinas, recrutando fibroblastos, células inflamatórias e células endoteliais.<\/p>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#a4c2f4;\">4. Intravasamento<\/h3>\n<p>Depois de invadir o estroma, algumas células alcançam os vasos e penetram em seu interior, fenômeno denominado <strong>intravasamento<\/strong>.<\/p>\n<p>A entrada pode ocorrer na circulação:<\/p>\n<ul>\n<li><strong>linfática<\/strong>;<\/li>\n<li><strong>sanguínea<\/strong>.<\/li><\/ul>\n<p>No câncer de próstata, ambas são importantes.<\/p>\n<p>A disseminação <strong>linfática<\/strong> é particularmente relevante para o acometimento dos linfonodos pélvicos.<\/p>\n<p>A disseminação <strong>hematogênica<\/strong> tem papel central na formação de metástases ósseas e viscerais.<\/p>\n<p>É importante perceber que os linfonodos podem funcionar como um <strong>primeiro território de disseminação<\/strong>, mas a presença de metástase linfonodal não significa que necessariamente ficará restrita ao sistema linfático.<\/p>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#a4c2f4;\">5. Sobrevivência na circulação<\/h3>\n<p>A circulação sanguínea é um ambiente extremamente hostil para uma célula tumoral.<\/p>\n<p>Ela sofre:<\/p>\n<ul>\n<li>estresse mecânico;<\/li>\n<li>ausência das condições do microambiente original;<\/li>\n<li>ataque imunológico;<\/li>\n<li>perda de sinais de sobrevivência provenientes da matriz extracelular.<\/li><\/ul>\n<p>Apesar disso, algumas células conseguem sobreviver, frequentemente formando agregados com <strong>plaquetas e outras células circulantes<\/strong>.<\/p>\n<p>As plaquetas podem funcionar como uma espécie de proteção física e molecular, dificultando o reconhecimento imunológico e favorecendo a adesão das células tumorais ao endotélio.<\/p>\n<p>Essas células tumorais circulantes são chamadas de <strong>CTCs (<\/strong><em><strong>circulating tumor cells<\/strong><\/em><strong>)<\/strong> e constituem um marcador de disseminação sistêmica potencial, embora a presença de CTCs isoladamente não seja equivalente à existência de uma metástase clinicamente estabelecida.<\/p>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#a4c2f4;\">6. Extravasamento e colonização<\/h3>\n<p>Depois de chegar à microcirculação de um órgão, a célula tumoral precisa:<\/p>\n<p><strong>aderir ao endotélio → atravessar a parede vascular → entrar no parênquima → sobreviver e proliferar. <\/strong><\/p>\n<p>Esse processo é chamado de <strong>extravasamento<\/strong>.<\/p>\n<p>Porém, mesmo depois de extravasar, a célula ainda pode morrer.<\/p>\n<p>Essa é uma das razões pelas quais a metástase é considerada um processo extremamente ineficiente: muitas células disseminam-se, mas poucas conseguem completar a chamada <strong>colonização metastática<\/strong>.<\/p>\n<p>O último passo é justamente aquele que determina o estabelecimento do tumor secundário:<\/p>\n<p><strong>sobrevivência → adaptação ao microambiente → proliferação → angiogênese → formação de metástase clinicamente relevante. <\/strong><\/p>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#a4c2f4;\">7. O conceito de “seed and soil”<\/h3>\n<p>O padrão metastático dos diferentes cânceres não é aleatório.<\/p>\n<p>A hipótese de <strong>“seed and soil”<\/strong>, proposta por Stephen Paget, estabelece que as células tumorais seriam a <strong>“semente” (<\/strong><em><strong>seed<\/strong><\/em><strong>)<\/strong>, enquanto determinados órgãos forneceriam o <strong>“solo” (<\/strong><em><strong>soil<\/strong><\/em><strong>)<\/strong> adequado para sua implantação e crescimento.<\/p>\n<p>Hoje sabemos que esse conceito é sustentado por complexas interações entre:<\/p>\n<ul>\n<li>receptores e ligantes;<\/li>\n<li>quimiocinas;<\/li>\n<li>fatores de crescimento;<\/li>\n<li>células estromais;<\/li>\n<li>matriz extracelular;<\/li>\n<li>vasos sanguíneos;<\/li>\n<li>sistema imune;<\/li>\n<li>metabolismo do tecido hospedeiro.<\/li><\/ul>\n<p>No câncer de próstata, essa teoria ajuda a explicar a enorme afinidade das células tumorais pelo <strong>microambiente ósseo<\/strong>.<\/p>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#a4c2f4;\">8. Por que o câncer de próstata metastatiza para o osso?<\/h3>\n<p>Essa é uma das questões mais importantes da Tutoria.<\/p>\n<p>O carcinoma prostático apresenta marcada <strong>tropismo ósseo<\/strong>, especialmente para o esqueleto axial.<\/p>\n<p>A próstata e o osso compartilham mecanismos de comunicação molecular que favorecem a migração, sobrevivência e proliferação de células tumorais.<\/p>\n<p>Um dos mecanismos estudados envolve o eixo:<\/p>\n<p><strong>CXCL12 — CXCR4 <\/strong><\/p>\n<p>O estroma da medula óssea produz <strong>CXCL12<\/strong>, enquanto células tumorais prostáticas podem expressar <strong>CXCR4<\/strong>. A interação favorece quimiotaxia e retenção das células tumorais no ambiente medular.<\/p>\n<p>Outros mecanismos envolvendo integrinas, fatores de crescimento e moléculas de adesão também contribuem para esse tropismo.<\/p>\n<p>Portanto:<\/p>\n<p><strong>célula tumoral prostática → circulação → microvasculatura óssea → interação com o nicho medular → colonização óssea. <\/strong><\/p>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#a4c2f4;\">9. O microambiente ósseo e o ciclo vicioso metastático<\/h3>\n<p>A metástase óssea do câncer de próstata apresenta uma característica peculiar.<\/p>\n<p>Enquanto cânceres como mama e pulmão frequentemente produzem lesões <strong>predominantemente osteolíticas<\/strong>, o câncer de próstata tipicamente produz metástases <strong>predominantemente osteoblásticas ou escleróticas<\/strong>, embora exista componente osteoclástico e formas mistas.<\/p>\n<p>Isso não significa que o osteoblasto seja simplesmente “ativado pelo tumor” de maneira isolada.<\/p>\n<p>O câncer estabelece uma interação recíproca com o tecido ósseo:<\/p>\n<p><strong>célula tumoral → fatores de crescimento/citocinas → ativação de osteoblastos e remodelação óssea → liberação de fatores do microambiente → estímulo adicional às células tumorais. <\/strong><\/p>\n<p>Esse processo pode criar um <strong>ciclo vicioso tumor–osso<\/strong>.<\/p>\n<p>Entre os mediadores envolvidos estão fatores como:<\/p>\n<ul>\n<li>endotelina-1;<\/li>\n<li>TGF-β;<\/li>\n<li>IGF;<\/li>\n<li>proteínas da família Wnt;<\/li>\n<li>RANK/RANKL/OPG;<\/li>\n<li>diversas citocinas e quimiocinas.<\/li><\/ul>\n<p>O resultado é remodelamento ósseo patológico e formação de lesões predominantemente escleróticas.<\/p>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#a4c2f4;\">10. Principais sítios metastáticos no câncer de próstata<\/h3>\n<h3 class=\"hb\" style=\"--c:#3c78d8;--hb:#c9daf8;\">10.1. Ossos — principal sítio<\/h3>\n<p>O <strong>osso é o principal local de metástase do câncer de próstata<\/strong>.<\/p>\n<p>Existe predileção pelo <strong>esqueleto axial<\/strong>, especialmente:<\/p>\n<ul>\n<li>coluna vertebral;<\/li>\n<li>pelve;<\/li>\n<li>costelas;<\/li>\n<li>vértebras lombares;<\/li>\n<li>fêmur proximal;<\/li>\n<li>outras estruturas ósseas próximas ao eixo axial.<\/li><\/ul>\n<p>Essa distribuição está relacionada tanto ao padrão de drenagem venosa quanto à fisiologia e ao microambiente da medula óssea.<\/p>\n<p>Clinicamente, as metástases ósseas podem produzir:<\/p>\n<p><strong>dor óssea + fraturas patológicas + compressão medular + hipercalcemia em casos específicos + redução da mobilidade e qualidade de vida. <\/strong><\/p>\n<p>A <strong>coluna vertebral<\/strong> possui particular importância porque uma lesão epidural pode produzir compressão da medula ou das raízes nervosas, constituindo uma emergência oncológica.<\/p>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#a4c2f4;\">11. Plexo venoso de Batson e disseminação vertebral<\/h3>\n<p>Um aspecto anatômico particularmente relevante é o <strong>plexo venoso vertebral de Batson<\/strong>.<\/p>\n<p>O plexo venoso vertebral interno é um sistema venoso <strong>avalvular<\/strong>, conectado às veias pélvicas e às estruturas venosas da região vertebral.<\/p>\n<p>Isso permite fluxo sanguíneo bidirecional relacionado às mudanças de pressão intra-abdominal.<\/p>\n<p>A próstata possui conexões com o plexo venoso vertebral por meio dos plexos venosos prostáticos e pélvicos.<\/p>\n<p>Consequentemente:<\/p>\n<p><strong>próstata → plexos venosos pélvicos → plexo vertebral de Batson → coluna vertebral <\/strong><\/p>\n<p>é uma das explicações anatômicas clássicas para a frequência das metástases vertebrais no câncer de próstata.<\/p>\n<p>Entretanto, deve-se evitar uma simplificação excessiva: o tropismo ósseo não decorre somente dessa anatomia venosa. O <strong>microambiente ósseo favorável à colonização tumoral<\/strong> é igualmente fundamental.<\/p>\n<p>Esse é justamente um exemplo da integração entre <strong>anatomia + fisiologia vascular + biologia molecular + oncologia<\/strong>.<\/p>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#a4c2f4;\">12. Linfonodos<\/h3>\n<p>O segundo grande território de disseminação é o <strong>sistema linfático<\/strong>.<\/p>\n<p>O câncer de próstata pode metastatizar inicialmente para os <strong>linfonodos pélvicos<\/strong>, sobretudo:<\/p>\n<ul>\n<li>obturatórios;<\/li>\n<li>ilíacos internos;<\/li>\n<li>ilíacos externos;<\/li>\n<li>posteriormente, cadeias ilíacas comuns e outros territórios.<\/li><\/ul>\n<p>A extensão linfonodal possui grande importância para o <strong>estadiamento<\/strong> e para o prognóstico.<\/p>\n<p>No sistema TNM, a presença de metástase linfonodal regional corresponde à categoria <strong>N1<\/strong>.<\/p>\n<p>Clinicamente, o acometimento linfonodal pode coexistir com doença óssea ou precedê-la.<\/p>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#a4c2f4;\">13. Pulmões<\/h3>\n<p>O <strong>pulmão<\/strong> é um sítio metastático visceral reconhecido do câncer de próstata.<\/p>\n<p>Entretanto, sua frequência é muito inferior à do osso e dos linfonodos.<\/p>\n<p>As metástases pulmonares podem manifestar-se como:<\/p>\n<ul>\n<li>múltiplos nódulos;<\/li>\n<li>massas;<\/li>\n<li>padrão linfangítico;<\/li>\n<li>mais raramente, acometimento pulmonar difuso.<\/li><\/ul>\n<p>Metástase pulmonar isolada é relativamente incomum, especialmente quando comparada à doença óssea.<\/p>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#a4c2f4;\">14. Fígado<\/h3>\n<p>O <strong>fígado<\/strong> também pode ser acometido, principalmente em doença avançada e biologicamente mais agressiva.<\/p>\n<p>A presença de metástases hepáticas costuma estar associada a <strong>doença visceral disseminada e prognóstico desfavorável<\/strong>.<\/p>\n<p>Assim como no pulmão, o acometimento hepático é menos frequente que o ósseo e linfonodal.<\/p>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#a4c2f4;\">15. Outros sítios<\/h3>\n<p>Em doença avançada, podem ocorrer metástases para:<\/p>\n<ul>\n<li>pleura;<\/li>\n<li>glândulas suprarrenais;<\/li>\n<li>sistema nervoso central;<\/li>\n<li>partes moles;<\/li>\n<li>outros órgãos viscerais.<\/li><\/ul>\n<p>Esses locais são menos frequentes.<\/p>\n<p>Um conceito importante é que o padrão anatômico pode mudar conforme a biologia tumoral. Tumores de maior grau, especialmente aqueles com <strong>Grade Group elevado<\/strong>, variantes agressivas ou fenótipo resistente à castração, possuem maior probabilidade de apresentar doença visceral.<\/p>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#a4c2f4;\">16. Resumindo o padrão metastático<\/h3>\n<p>Uma forma didática de organizar os sítios é:<\/p>\n<p><strong>1º — Osso:<\/strong> principal sítio, especialmente coluna e pelve.<\/p>\n<p><strong>2º — Linfonodos:<\/strong> principalmente cadeias pélvicas.<\/p>\n<p><strong>3º — Pulmões e fígado:<\/strong> principais sítios viscerais.<\/p>\n<p><strong>4º — Outros:<\/strong> pleura, suprarrenais, SNC e partes moles, geralmente em doença avançada.<\/p>\n<p>O padrão exato pode variar de acordo com o estágio e a biologia tumoral.<\/p>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#a4c2f4;\">17. Relação entre metástase e estadiamento TNM<\/h3>\n<p>A presença de metástase altera profundamente o estadiamento.<\/p>\n<p>No sistema TNM:<\/p>\n<p><strong>M0<\/strong> → não há metástases à distância detectadas.<\/p>\n<p><strong>M1<\/strong> → existem metástases à distância.<\/p>\n<p>No câncer de próstata, a categoria M é subdividida em:<\/p>\n<ul>\n<li><strong>M1a:<\/strong> linfonodos não regionais;<\/li>\n<li><strong>M1b:<\/strong> metástases ósseas;<\/li>\n<li><strong>M1c:<\/strong> outras metástases à distância.<\/li><\/ul>\n<p>Essa classificação possui relevância terapêutica porque a presença de <strong>M1<\/strong> geralmente desloca o foco do tratamento exclusivamente local para uma abordagem predominantemente <strong>sistêmica<\/strong>, frequentemente combinada a estratégias direcionadas ao tumor primário ou a sítios metastáticos selecionados.<\/p>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#a4c2f4;\">18. Repercussões clínicas das metástases ósseas<\/h3>\n<p>O osso não é apenas um local anatômico de disseminação; suas metástases são responsáveis por grande parte da morbidade do câncer de próstata avançado.<\/p>\n<h3 class=\"hb\" style=\"--c:#3c78d8;--hb:#c9daf8;\">Dor óssea<\/h3>\n<p>É uma das manifestações mais frequentes e resulta da expansão tumoral, remodelamento ósseo e estímulo de estruturas periosteais e nervosas.<\/p>\n<h3 class=\"hb\" style=\"--c:#3c78d8;--hb:#c9daf8;\">Fraturas patológicas<\/h3>\n<p>A remodelação anormal pode comprometer a resistência estrutural do osso, aumentando o risco de fratura.<\/p>\n<h3 class=\"hb\" style=\"--c:#3c78d8;--hb:#c9daf8;\">Compressão medular<\/h3>\n<p>As metástases vertebrais podem causar:<\/p>\n<p><strong>dor dorsal/lombar → invasão epidural → compressão medular → déficit motor/sensitivo → alteração esfincteriana. <\/strong><\/p>\n<p>Trata-se de uma situação potencialmente emergencial, que exige reconhecimento rápido.<\/p>\n<h3 class=\"hb\" style=\"--c:#3c78d8;--hb:#c9daf8;\">Distúrbios do metabolismo ósseo<\/h3>\n<p>O intenso remodelamento produzido pelas metástases pode alterar o equilíbrio entre formação e reabsorção óssea e contribuir para complicações metabólicas.<\/p>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#a4c2f4;\">19. Um ponto fundamental: metástase não é simplesmente “célula que se espalhou”<\/h3>\n<p>Para compreender profundamente a fisiopatologia, é útil visualizar o processo completo:<\/p>\n<ul>\n<li><strong>Tumor primário<\/strong><\/li>\n<li><strong>Heterogeneidade e seleção clonal <\/strong><\/li>\n<li><strong>Perda de adesão + invasão local <\/strong><\/li>\n<li><strong>Degradação da matriz extracelular <\/strong><\/li>\n<li><strong>Intravasamento <\/strong><\/li>\n<li><strong>Sobrevivência na circulação <\/strong><\/li>\n<li><strong>Extravasamento <\/strong><\/li>\n<li><strong>Adaptação ao novo microambiente <\/strong><\/li>\n<li><strong>Colonização <\/strong><\/li>\n<li><strong>Angiogênese e crescimento <\/strong><\/li>\n<li><strong>Metástase clinicamente estabelecida <\/strong><\/li><\/ul>\n<p>Esse modelo explica por que <strong>metástase é um processo extremamente complexo e ineficiente<\/strong>: a maioria das células que se desprendem do tumor não consegue completar toda essa sequência.<\/p>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#a4c2f4;\">Síntese integradora<\/h3>\n<p>A <strong>metástase<\/strong> é a formação de um tumor secundário em local anatomicamente distante do tumor primário e representa uma manifestação de disseminação sistêmica da neoplasia.<\/p>\n<p>No câncer de próstata, a cascata metastática envolve <strong>invasão local, intravasamento, sobrevivência circulatória, extravasamento e colonização de um novo tecido<\/strong>, sendo profundamente influenciada pela interação entre o clone tumoral e o microambiente do órgão-alvo.<\/p>\n<p>O padrão metastático caracteriza-se por forte <strong>tropismo pelo osso<\/strong>, especialmente <strong>coluna vertebral e pelve<\/strong>, além de acometimento dos <strong>linfonodos pélvicos<\/strong> e, em doença avançada, de órgãos viscerais como <strong>pulmões e fígado<\/strong>.<\/p>\n<p>A preferência pelo esqueleto resulta da combinação de fatores anatômicos e biológicos. A conexão venosa entre a pelve e a coluna por meio do <strong>plexo de Batson<\/strong>  favorece a chegada de células tumorais ao esqueleto axial, enquanto mecanismos moleculares — como interações quimiocina-receptor e o conceito de <strong>“seed and soil”<\/strong> — favorecem sua retenção e crescimento no microambiente ósseo.<\/p>\n<p>No câncer de próstata, as metástases ósseas são tipicamente <strong>osteoblásticas/escleróticas<\/strong>, embora apresentem intensa interação com a atividade osteoclástica. Essa relação cria um <strong>ciclo tumor–osso<\/strong>, no qual a célula tumoral modifica o microambiente ósseo e, em contrapartida, recebe sinais que favorecem sua própria sobrevivência e expansão.<\/p>\n<p>Assim, a sequência conceitual que conecta esta questão às anteriores é:<\/p>\n<p><strong>adenocarcinoma prostático → Gleason/ISUP define agressividade → progressão local e disseminação → metástase → TNM determina extensão → presença de M1 modifica profundamente a estratégia terapêutica. <\/strong><\/p>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#a4c2f4;\">Referências<\/h3>\n<ul>\n<li>HANAHAN, D. Hallmarks of cancer: new dimensions. <em>Cancer Discovery<\/em>, v. 12, n. 1, p. 31-46, 2022.<\/li>\n<li>KUMAR, V.; ABBAS, A. K.; ASTER, J. C. <em>Robbins &amp; Cotran Pathologic Basis of Disease<\/em>. 10. ed. Philadelphia: Elsevier, 2021. Capítulo 7: Neoplasia; capítulo sobre sistema genital masculino.<\/li>\n<li>WEIN, A. J. et al. <em>Campbell-Walsh-Wein Urology<\/em>. 13. ed. Philadelphia: Elsevier, 2020. Capítulo sobre carcinoma da próstata.<\/li>\n<li>BRUNTON, L. L.; HILAL-DANDAN, R.; KNOLLMANN, B. C. <em>Goodman &amp; Gilman's The Pharmacological Basis of Therapeutics<\/em>. 14. ed. New York: McGraw Hill, 2023. Seção de farmacologia dos andrógenos e tratamento do câncer de próstata.<\/li>\n<li>INSTITUTO NACIONAL DE CÂNCER (INCA). <strong>Câncer de próstata: versão para profissionais de saúde<\/strong>. Rio de Janeiro: INCA. Disponível em: <span class=\"cc\" style=\"--c:#1155cc\"><a href=\"https://www.gov.br/inca/pt-br/assuntos/cancer/tipos/prostata/versao-para-profissionais-de-saude\" target=\"_blank\" rel=\"noopener\">https://www.gov.br/inca/pt-br/assuntos/cancer/tipos/prostata/versao-para-profissionai<\/a><\/span> <span class=\"cc\" style=\"--c:#1155cc\"><a href=\"https://www.gov.br/inca/pt-br/assuntos/cancer/tipos/prostata/versao-para-profissionais-de-saude\" target=\"_blank\" rel=\"noopener\">s-de-saude<\/a><\/span>. Acesso em: 24 ago. 2026.<\/li>\n<li>EUROPEAN ASSOCIATION OF UROLOGY. <strong>EAU Guidelines on Prostate Cancer<\/strong>. Arnhem: EAU, 2026. Seções sobre estadiamento, doença metastática e tratamento. Disponível em: <span class=\"cc\" style=\"--c:#1155cc\"><a href=\"https://uroweb.org/guidelines/prostate-cancer\" target=\"_blank\" rel=\"noopener\">https://uroweb.org/guidelines/prostate-cancer<\/a><\/span>. Acesso em: 24 ago. 2026.<\/li>\n<li>PAGET, S. The distribution of secondary growths in cancer of the breast. <em>The Lancet<\/em>, v. 133, n. 3421, p. 571-573, 1889.<\/li>\n<li>JOYCE, J. A.; POLLARD, J. W. Microenvironmental regulation of metastasis. <em>Nature Reviews Cancer<\/em>, v. 9, n. 4, p. 239-252, 2009.<\/li>\n<li>MASSAGUÉ, J.; OBENAUF, A. C. Metastatic colonization by circulating tumour cells. <em>Nature<\/em>, v. 529, p. 298-306, 2016.<\/li><\/ul>"}, {"id": "tutoria-1-3", "num": "1.3", "sp": "Tutoria 1.3", "titulo": "Câncer colorretal", "subtitulo": "Tutoria 1.3 · objetivos de aprendizagem respondidos", "resumo": "Fisiopatologia, fatores de risco, sinais e sintomas, rastreamento e estadiamento, tratamento e metástases.", "html": "<p>Palavras desconhecidas/Termos técnicos:<\/p>\n<h3 class=\"hb\" style=\"--c:#cc0000;--hb:#f4cccc;\">Antígeno Carcinoembrionário (CEA)<\/h3>\n<p>O Antígeno Carcinoembrionário (CEA) é uma glicoproteína de alto peso molecular pertencente à superfamília das imunoglobulinas, expressa fisiologicamente nos tecidos endodérmicos durante o desenvolvimento embrionário e fetal. No adulto hígido, sua síntese pelo epitélio gastrointestinal é residual, mantendo concentrações séricas basais mínimas. Contudo, em virtude da desdiferenciação celular e perda de polaridade tecidual associadas à carcinogênese, ocorre uma superexpressão e liberação anômala dessa molécula na circulação sistêmica.<\/p>\n<p>Do ponto de vista clínico-oncológico, o CEA não possui sensibilidade ou especificidade adequadas para triagem populacional ou diagnóstico primário, visto que pode elevar-se em neoplasias não colorretais e em condições inflamatórias benignas (como doença inflamatória intestinal, cirrose e tabagismo). Seu valor primordial reside na avaliação prognóstica pré-operatória, na predição de resposta terapêutica e, fundamentalmente, no monitoramento pós-operatório para detecção precoce de recidiva locorregional ou metastática oculta.<\/p>\n<p>Em síntese, o CEA atua como um biomarcador dinâmico de carga tumoral residual e progressão de doença, integrando o algoritmo de vigilância ativa de pacientes com câncer colorretal após o tratamento definitivo.<\/p>\n<h3 class=\"hb\" style=\"--c:#cc0000;--hb:#f4cccc;\">Colectomia Segmentar<\/h3>\n<p>A colectomia segmentar consiste na ressecção cirúrgica de um segmento anatômico específico do cólon (como a colectomia direita, esquerda ou sigmoidectomia), preservando a continuidade do trato gastrointestinal por meio de anastomose primária sempre que as condições locais e sistêmicas permitirem. Trata-se do procedimento padrão-ouro para o manejo curativo de neoplasias malignas confinadas ao cólon, bem como para complicações de doenças benignas, a exemplo da diverticulite recorrente ou estenosante.<\/p>\n<p>No contexto oncológico, a intervenção fundamenta-se nos princípios da linfadenectomia radical e da excisão mesocólica completa. A extensão do segmento ressecado é estritamente determinada pela vascularização arterial e pela drenagem linfática correspondente, assegurando margens cirúrgicas microscopicamente livres (R0) e a recuperação de um número mínimo de linfonodos para um estadiamento anatomopatológico fidedigno.<\/p>\n<p>Assim, a técnica alia a eficácia oncológica à preservação funcional do trânsito intestinal, minimizando sequelas absortivas e metabólicas no período pós-operatório.<\/p>\n<h3 class=\"hb\" style=\"--c:#cc0000;--hb:#f4cccc;\">Lesão Vegetante Friável<\/h3>\n<p>A expressão \"lesão vegetante friável\" descreve um padrão morfológico e macroscópico caracterizado por um crescimento tecidual exofítico e irregular, que se projeta além da superfície mucosa ou cutânea nativa, associado a uma consistência quebradiça e extrema fragilidade estrutural. Esse aspecto decorre de uma proliferação celular acelerada e desorganizada, frequentemente acompanhada de neoangiogênese aberrante com vasos imaturos e estroma de sustentação escasso.<\/p>\n<p>Na prática semiológica e endoscópica, a friabilidade manifesta-se pelo sangramento espontâneo ou induzido por mínimos traumas mecânicos (como o simples toque do aparelho de biópsia). Essa morfologia é altamente suspeita de malignidade invasiva — embora possa ocorrer em processos infecciosos crônicos ou inflamatórios granulomatosos exuberantes —, exigindo amostragem histopatológica representativa e cuidadosa para evitar necrose superficial.<\/p>\n<p>Dessa forma, trata-se de um sinal de alerta cardinal que orienta a propedêutica armada na diferenciação entre lesões inflamatórias exuberantes e carcinomas invasivos.<\/p>\n<h3 class=\"hb\" style=\"--c:#cc0000;--hb:#f4cccc;\">Inapetência<\/h3>\n<p>A inapetência (ou anorexia clínica) define-se como a redução acentuada ou perda voluntária do apetite e do desejo fisiológico de ingestão alimentar. Diferencia-se da disfagia ou saciedade precoce mecânica por decorrer de uma desregulação neuroendócrina central nos circuitos hipotalâmicos de homeostase energética, com supressão de vias orexígenas (Neuropeptídeo Y) e hiperestimulação de eixos anorexígenos (POMC/CART).<\/p>\n<p>O fenômeno é frequentemente mediado por cascatas pró-inflamatórias sistêmicas deflagradas por citocinas como TNF-alfa, IL-1 e IL-6, que atuam no sistema nervoso central em vigência de infecções graves, insuficiências orgânicas crônicas ou neoplasias avançadas. Nesses cenários, a inapetência crônica constitui o motor primário da síndrome de caquexia, induzindo proteólise muscular, lipólise e desnutrição calórico-proteica refratária.<\/p>\n<p>Portanto, sua abordagem clínica demanda intervenção multidisciplinar precoce, pois o declínio nutricional progressivo eleva a morbimortalidade e compromete a tolerância aos tratamentos instituídos.<\/p>\n<h3 class=\"hb\" style=\"--c:#cc0000;--hb:#f4cccc;\">Protocolo FOLFOX<\/h3>\n<p>O FOLFOX é um regime de quimioterapia combinada amplamente empregado na oncologia gastrointestinal, composto por três agentes sinérgicos: <strong>Leucovorina<\/strong> (ácido folínico), <strong>5-Fluorouracil<\/strong> (5-FU, administrado em bólus seguido por infusão contínua) e <strong>Oxaliplatina<\/strong>. O racional farmacológico baseia-se na inibição da síntese de DNA pelo 5-FU (potencializada pelo ácido folínico) associada à formação de adutos e pontes cruzadas no DNA mediadas pelo composto de platina.<\/p>\n<p>O esquema é formalmente indicado como terapia adjuvante após ressecção cirúrgica de tumores colorretais de alto risco (estádio III ou II selecionados) para erradicação de micrometástases, bem como linha de frente no cenário paliativo ou neoadjuvante de doença metastática irressecável. Sua administração requer monitoramento hematológico rigoroso e vigilância de neurotoxicidade periférica cumulativa induzida pela oxaliplatina.<\/p>\n<p>Em suma, o FOLFOX representa um dos pilares da oncologia moderna, consolidando ganhos expressivos em sobrevida livre de doença e sobrevida global na patologia colorretal.<\/p>\n<h3 class=\"hb\" style=\"--c:#cc0000;--hb:#f4cccc;\">T3N1M0<\/h3>\n<p>A notação T3N1M0 refere-se a um estágio anatômico específico derivado do sistema de classificação TNM (AJCC/UICC) para neoplasias sólidas, indicando doença locorregionalmente avançada (frequentemente categorizada como Estádio III no adenocarcinoma colorretal):<\/p>\n<ul>\n<li><strong>T3:<\/strong> O tumor primário invadiu através da camada muscular própria, alcançando os tecidos subserosos ou a gordura pericolônica/perirretal não peritonealizada.<\/li>\n<li><strong>N1:<\/strong> Há metástase regional comprovada em 1 a 3 linfonodos pericólicos ou regionais.<\/li>\n<li><strong>M0:<\/strong> Ausência de metástases hematogênicas ou peritoneais à distância identificadas aos exames de estadiamento.<\/li><\/ul>\n<p>Clinicamente, essa categorização sinaliza que o tumor rompeu a barreira muscular e obteve acesso à circulação linfática locorregional, elevando substancialmente o risco de disseminação sistêmica oculta, mesmo após ressecção cirúrgica radical bem-sucedida.<\/p>\n<p>Por conseguinte, pacientes com tumores T3N1M0 constituem indicação clássica para terapia sistêmica adjuvante pós-operatória, visando à redução das taxas de recidiva e ampliação da sobrevida global.<\/p>\n<h3 class=\"hb\" style=\"--c:#cc0000;--hb:#f4cccc;\">Odinofagia<\/h3>\n<p>A odinofagia é definida semiologicamente como a dor à deglutição, localizada na região faríngea ou retroesternal, frequentemente descrita como queimação, pontada ou constrição durante a passagem do bolo alimentar. Diferencia-se fundamentalmente da disfagia — que denota a sensação mecânica de engasgo ou dificuldade de progressão —, embora ambas possam coexistir em patologias inflamatórias transmurais.<\/p>\n<p>O substrato fisiopatológico reside no acometimento e na perda de integridade da mucosa e das camadas submucosas da orofaringe ou do esôfago, com sensibilização de terminações nervosas nociceptivas viscerais. É causada comumente por esofagites infecciosas (como candidíase, herpes-vírus ou citomegalovírus em pacientes imunocomprometidos), esofagites cáusticas, induzidas por pílulas, por refluxo severo ou secundárias à radioterapia/quimioterapia.<\/p>\n<p>Trata-se de um sintoma de impacto imediato na qualidade de vida, pois a evitação álgica alimentar predispõe à desidratação aguda e ao rápido declínio ponderal se não controlada.<\/p>\n<h3 class=\"hb\" style=\"--c:#cc0000;--hb:#f4cccc;\">Mucosite Oral Grau II<\/h3>\n<p>A mucosite oral grau II (segundo a escala da Organização Mundial da Saúde - OMS) é uma complicação inflamatória e ulcerativa moderada do trato gastrointestinal superior, induzida pela citotoxicidade direta de regimes quimioterápicos ou pela radiação ionizante em cabeça e pescoço sobre as células basais do epitélio mucoso.<\/p>\n<p>Pela classificação padronizada da OMS, o grau II caracteriza-se pela presença de eritema evidente e ulcerações dolorosas bem delimitadas, mas em que o paciente <strong>ainda mantém a capacidade de tolerar e deglutir alimentos sólidos<\/strong>. Fisiopatologicamente, corresponde à fase de amplificação do dano tecidual, com apoptose epitelial e liberação de mediadores pró-inflamatórios que culminam na perda de continuidade da barreira mecânica.<\/p>\n<p>Clinicamente, requer intervenção proativa com analgesia tópica/sistêmica, ajuste na consistência da dieta e cuidados intensivos de higiene oral para prevenir sobreinfecção secundária e progressão para graus mais severos com afagia.<\/p>\n<h3 class=\"hb\" style=\"--c:#cc0000;--hb:#f4cccc;\">Parestesia<\/h3>\n<p>A parestesia é um distúrbio sensitivo neurológico caracterizado por sensações anormais, espontâneas ou induzidas, de natureza não dolorosa ou desconfortável, tipicamente descritas pelo paciente como formigamento, dormência, picadas de agulha ou sensação de \"membro adormecido\". Ocorre sem que haja um estímulo tátil mecânico externo correspondente.<\/p>\n<p>O mecanismo subjacente decorre da disfunção, desmielinização ou hiperexcitabilidade de fibras nervosas sensitivas periféricas ou das vias proprioceptivas ascendentes do sistema nervoso central (cordões posteriores da medula). Suas etiologias são vastas, abrangendo neuropatias compressivas periféricas, déficits nutricionais (como a deficiência de cianocobalamina/B12), distúrbios hidroeletrolíticos (hipocalcemia), neuropatia diabética e toxicidade iatrogênica por quimioterápicos (como platinas e taxanos).<\/p>\n<p>Na prática clínica, a caracterização de sua distribuição anatômica (simétrica em \"bota e luva\" versus dermatomal) é crucial para distinguir patologias periféricas sistêmicas de lesões radiculares ou centrais focais.<\/p>\n<p>Questões de Aprendizagem:<\/p>\n<h2 class=\"hb\" style=\"--c:#660000;--hb:#e06666;\">1- Defina o que é câncer de colorretal e descreva o mecanismo fisiopatológico.<\/h2>\n<h3 class=\"hb\" style=\"--c:#990000;--hb:#ea9999;\">Introdução Conceitual e Definição<\/h3>\n<p>O câncer colorretal (CCR) compreende um grupo heterogêneo de neoplasias malignas que se originam no revestimento epitelial do intestino g
