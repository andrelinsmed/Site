ular ou quebra da integridade tecidual. <\/mark><\/p>\n<ul>\n<li><strong>P - Pólipo (SUA-P):<\/strong> Pólipos endometriais (e, com menor relevância volumétrica, endocervicais) são proliferações exofíticas focais de glândulas e estroma endometriais sustentadas por um pedículo vascular central. Fisiopatologicamente, apresentam expressão alterada de receptores estrogênicos e progestagênicos e <mark style=\"--m:#ffe599\">aumento local da angiogênese. Manifestam-se clinicamente com frequência por <\/mark> <mark style=\"--m:#ffe599\">sangramento intermenstrual, perdas em pequena quantidade (spotting) ou aumento <\/mark> <mark style=\"--m:#ffe599\">do fluxo menstrual regular, decorrente de microerosões superficiais e fragilidade da <\/mark> <mark style=\"--m:#ffe599\">microvasculatura do ápice do pólipo. Embora a maioria seja benigna, a avaliação <\/mark> <mark style=\"--m:#ffe599\">histopatológica é obrigatória, sobretudo em pacientes na pós-menopausa ou com <\/mark> <mark style=\"--m:#ffe599\">fatores de risco para hiperplasia. <\/mark><\/li>\n<li><strong>A - Adenomiose (SUA-A):<\/strong> Caracteriza-se pela presença ectópica de ilhotas de glândulas e estroma endometriais funcionantes no interior do miométrio, associada à hiperplasia e hipertrofia reacional do músculo liso adjacente. Essa invasão da zona juncional interrompe a arquitetura concêntrica do miométrio, gerando dois mecanismos centrais para o SUA: perda da capacidade de contração miometrial fisiológica (prejudicando a hemostasia mecânica por vasoconstrição ao término da descamação menstrual) e aumento substancial da rede vascular intramiometrial associada à sobre-expressão local de mediadores inflamatórios, estrogênio e prostaglandinas. Clinicamente, associa-se de modo clássico a sangramento menstrual volumoso associado a dismenorreia secundária progressiva e útero aumentado globalmente de forma difusa.<\/li>\n<li><strong>L - Leiomioma (SUA-L):<\/strong> Neoplasias mesenquimais benignas originadas de células do músculo liso miometrial. No sistema da FIGO, os miomas são subestratificados conforme sua localização mural e relação com o endométrio (classificação terciária de 0 a 8). Os miomas submucosos (subtipos 0, 1 e 2) apresentam a relação causal mais direta e potente com o SUA. Eles provocam o aumento substancial da área de superfície endometrial, angiogênese desregulada com vasos frágeis na superfície sobrejacente ao nódulo, congestão venosa local por compressão e prejuízo focal da contratilidade miometrial. Miomas intramurais (subtipos 3, 4 e 5) também podem induzir SUA por congestão venosa miometrial e disfunção vasomotora parácrina, enquanto os estritamente subserosos (subtipos 6 e 7) raramente justificam queixas hemorrágicas isoladas.<\/li>\n<li><strong>M - Malignidade e Hiperplasia (SUA-M):<\/strong> Representa o espectro de alterações pré-neoplásicas e neoplásicas do endométrio, com destaque para a hiperplasia endometrial atípica (neoplasia intraepitelial endometrial - NIE) e o adenocarcinoma de endométrio. A fisiopatologia decorre do estímulo estrogênico crônico não balanceado pela progesterona (anovulação persistente, obesidade periférica, síndrome dos ovários policísticos, uso inadequado de terapia hormonal), levando à proliferação celular desordenada, arquitetura glandular densa, fragilidade estromal e neovascularização irregular com vasos de paredes delgadas propensos à rotura espontânea contínua. É a principal causa de investigação obrigatória na pós-menopausa e em mulheres com sangramento persistente e fatores de risco metabólicos.<\/li><\/ul>\n<h3 class=\"hb\" style=\"--c:#990000;--hb:#ea9999;\">Etiologias Não Estruturais: O Grupo COEIN<\/h3>\n<p>As alterações não estruturais englobam fatores funcionais, coagulopatias e intervenções médicas que interferem nos ciclos normais de produção hormonal, na homeostase de fatores de coagulação ou nas vias inflamatórias e vasomotoras locais do endométrio.<\/p>\n<ul>\n<li><strong>C - Coagulopatia (SUA-C):<\/strong> Abrange distúrbios sistêmicos da hemostasia primária e secundária. A causa congênita mais comum é a Doença de von Willebrand, seguida por trombocitopenias imunes e disfunções plaquetárias, além do uso de anticoagulantes sistêmicos. Fisiopatologicamente, a interrupção da agregação plaquetária ou da formação da rede de fibrina impede a formação adequada do tampão hemostático nas arteríolas espiraladas expostas no leito endometrial descamativo. O SUA de padrão grave desde a menarca, acompanhado de histórico pessoal ou familiar de epistaxe recorrente, gengivorragias ou hematomas fáceis, aponta fortemente para essa etiologia.<\/li>\n<li><strong>O - Disfunção Ovulatória (SUA-O):<\/strong> Decorre da ausência de ovulação regular ou de luteólise inadequada, comum nos extremos da vida reprodutiva (adolescência e transição para a menopausa) e em desordens endócrinas como a Síndrome dos Ovários Policísticos (SOP), hiperprolactinemia, disfunções tireoidianas (hipo ou hipertireoidismo) e obesidade mórbida. Na ausência de ovulação, não há formação de corpo lúteo e, portanto, há ausência de progesterona. O endométrio permanece exposto à proliferação contínua induzida pelo estrogênio até ultrapassar sua capacidade vascular de suporte estromal; isso desencadeia episódios de necrose focal assincrônica e descamação irregular por \"escape\" (<em>estrogen breakthrough bleeding<\/em>), manifestando-se clinicamente por ciclos menstruais erráticos, intervalos variáveis de amenorreia seguidos de sangramentos volumosos e imprevisíveis.<\/li>\n<li><strong>E - Causa Endometrial (SUA-E):<\/strong> Diagnóstico primariamente firmado após a exclusão de outras etiologias em mulheres que mantêm ciclos ovulatórios regulares, mas apresentam sangramento menstrual excessivo ou intermenstrual. O mecanismo fisiopatológico reside na disfunção molecular intrínseca do microambiente endometrial: há desequilíbrio na produção parácrina de prostaglandinas (com elevação de prostaglandinas vasodilatadoras como a 𝑃𝐺𝐸2 e 𝑃𝐺𝐼2 em detrimento da vasoconstritora 𝑃𝐺𝐹2α), deficiência na síntese local de endotelina-1 (potente vasoconstritor) e hiperativação local da fibrinólise via aumento do ativador tecidual do plasminogênio (t-PA). Essas alterações impedem a vasoconstrição coordenada e a estabilização do coágulo nos vasos basais após a menstruação.<\/li>\n<li><strong>I - Iatrogênica (SUA-I):<\/strong> Refere-se a sangramentos decorrentes de intervenções médicas ou farmacológicas. Inclui o uso de dispositivos intrauterinos (tanto o DIU de cobre, que induz reação inflamatória focal com aumento da permeabilidade vascular e fibrinólise endometrial, quanto o DIU liberador de levonorgestrel, que causa atrofia glandular associada a fragilidade capilar superficial nos primeiros meses de inserção), contraceptivos orais combinados, progestagênios contínuos, moduladores de receptores estrogênicos (como o tamoxifeno), psicotrópicos que alteram a dopamina/prolactina e fármacos que interferem no eixo hipotálamo-hipófise-ovariano.<\/li>\n<li><strong>N - Não Classificado nos Demais (SUA-N):<\/strong> Categoria residual que engloba entidades clínicas raras, mal caracterizadas ou que ainda carecem de evidências biológicas para justificar uma classe própria isolada. Entre elas figuram as malformações arteriovenosas (MAVs) uterinas, istmoceles (defeitos de cicatrização de cesárea anterior com acúmulo de sangue retido que goteja no pós-menstruo), miometrites e endometrites crônicas isoladas.<\/li><\/ul>\n<h3 class=\"hb\" style=\"--c:#990000;--hb:#ea9999;\">Quadro Comparativo: Síntese Estrutural vs. Não Estrutural (FIGO)<\/h3>\n<div class=\"tbl\"><table><tr><th><strong>Categoria<\/strong><\/th><th><strong>Etiologia FIGO<\/strong><\/th><th><strong>Principais <\/strong> <strong>Mecanismos <\/strong> <strong>Fisiopatológicos<\/strong><\/th><th><strong>Apresentação Clínica Típica<\/strong><\/th><\/tr><tr><td><strong>Estrutural <\/strong> <strong>(PALM)<\/strong><\/td><td><strong>P<\/strong>ólipo<\/td><td>Fragilidade da microvasculatura apical; neoangiogênese focal.<\/td><td>Sangramento intermenstrual; <em>spotting<\/em>; perdas pós-coito.<\/td><\/tr><tr><td><\/td><td><strong>A<\/strong>denomiose<\/td><td>Infiltração juncional; falha da contração miometrial; hiperprostaglandinemia.<\/td><td>Sangramento volumoso cíclico associado a dismenorreia secundária severa.<\/td><\/tr><tr><td><\/td><td><strong>L<\/strong>eiomioma<\/td><td>Distorção cavitária; perda de hemostasia focal; congestão vascular miometrial.<\/td><td>Sangramento aumentado cíclico; sensação de peso e compressão pélvica.<\/td><\/tr><tr><td><\/td><td><strong>M<\/strong>alignidade<\/td><td>Proliferação atípica estrógeno-dependente; necrose e fragilidade capilar.<\/td><td>Sangramento na pós-menopausa ou irregularidades refratárias em obesas/SOP.<\/td><\/tr><tr><td><strong>Não Estrutural <\/strong> <strong>(COEIN)<\/strong><\/td><td><strong>C<\/strong>oagulopatia<\/td><td>Defeito na agregação plaquetária ou na via de coagulação sanguínea.<\/td><td>Sangramento volumoso desde a menarca; equimoses e gengivorragia.<\/td><\/tr><tr><td><\/td><td>Disfunção <strong>O<\/strong>vulatória<\/td><td>Anovulação crônica; ausência de corpo lúteo/progesterona; descamação por escape.<\/td><td>Ciclos erráticos, períodos de amenorreia seguidos de hemorragia copiosa.<\/td><\/tr><tr><td><\/td><td><strong>E<\/strong>ndometrial<\/td><td>Desbalanço local de prostaglandinas ( ) 𝑃𝐺𝐸2 &gt; 𝑃𝐺𝐹2α e fibrinólise excessiva.<\/td><td>Sangramento volumoso com intervalos perfeitamente regulares e ovulatórios.<\/td><\/tr><tr><td><\/td><td><strong>I<\/strong>atrogênica<\/td><td>Ação de DIUs, esteroides exógenos, anticoagulantes ou psicotrópicos.<\/td><td><em>Spotting<\/em> errático, sangramentos de escape após introdução de nova droga.<\/td><\/tr><tr><td><\/td><td><strong>N<\/strong>ão classificado<\/td><td>Anomalias anatômicas raras (istmocele, MAVs) ou processos cicatriciais anômalos.<\/td><td>Sangramento tardio pós-menstrual persistente; sangramentos pulsáteis raros.<\/td><\/tr><\/table><\/div>\n<p>A definição precisa do Sangramento Uterino Anormal e sua subsequente estratificação por meio da classificação PALM-COEIN da FIGO transformaram a abordagem da ginecologia moderna, substituindo diagnósticos descritivos vagos por uma investigação orientada pela fisiopatologia. Essa sistemática permite ao médico correlacionar a semiologia menstrual com exames de imagem direcionados e perfis laboratoriais específicos, permitindo que a conduta seja direcionada à causa de base — seja ela uma intervenção cirúrgica minimamente invasiva para exérese de uma lesão estrutural endocavitária, o controle neuroendócrino de um ciclo anovulatório ou a correção clínica e farmacológica de um distúrbio da hemostasia primária.<\/p>\n<h3 class=\"hb\" style=\"--c:#990000;--hb:#ea9999;\">Referências Bibliográficas<\/h3>\n<ul>\n<li>BEREK, J. S. <strong>Berek &amp; Novak: Tratado de Ginecologia<\/strong>. 16. ed. Rio de Janeiro: Guanabara Koogan, 2021. Cap. 13: Sangramento Uterino Anormal, p. 385-412.<\/li>\n<li>FEDERAÇÃO BRASILEIRA DAS ASSOCIAÇÕES DE GINECOLOGIA E OBSTETRÍCIA (FEBRASGO). <strong>Sangramento Uterino Anormal<\/strong>. Protocolos Febrasgo de Ginecologia, n. 42. São Paulo: FEBRASGO, 2021.<\/li>\n<li>HOFFMAN, B. L.; SCHORGE, J. O.; BRADSHAW, K. D.; HALVORSON, L. M.; SCHAFFER, J. I.; CORTON, M. M. <strong>Ginecologia de Williams<\/strong>. 3. ed. Porto Alegre: Artmed, 2019. Cap. 8: Sangramento Uterino Anormal, p. 182-205.<\/li>\n<li>MUNRO, M. G.; CRITCHLEY, H. O. D.; FRASER, I. S.; FIGO MENSTRUAL DISORDERS COMMITTEE. The two FIGO systems for normal and abnormal uterine bleeding symptoms and classification of causes of abnormal uterine bleeding in the reproductive years: 2018 revisions. <strong>International Journal of Gynecology &amp; Obstetrics<\/strong>, v. 143, n. 3, p. 393-408, 2018.<\/li><\/ul>\n<h2 class=\"hb\" style=\"--c:#660000;--hb:#e06666;\">2- Caracterize o manejo do SUA agudo com estabilidade hemodinâmica preservada, SUA agudo causando instabilidade hemodinâmica, SUA crônico e acompanhamento ambulatorial após a alta da emergência por SUA agudo.<\/h2>\n<p>O manejo terapêutico do sangramento uterino anormal (SUA) exige do médico assistente uma distinção imediata entre a gravidade hemodinâmica do episódio e a cronologia do distúrbio. Enquanto o SUA crônico permite uma propedêutica armada ambulatorial escalonada e terapias direcionadas à causa de base conforme o sistema PALM-COEIN, o SUA agudo representa uma urgência ou emergência ginecológica. Na urgência hemorrágica, o objetivo primordial não reside na elucidação etiológica microscópica imediata, mas no suporte à vida, na estagnação rápida da perda volêmica e na prevenção do choque hemorrágico e da coagulopatia tensional. Assim, a abordagem clínica divide-se pragmaticamente em quatro cenários integrados: a estabilização da paciente hemodinamicamente instável, o controle hormonal e hemostático da paciente aguda clinicamente estável, o plano de manejo a longo prazo do SUA crônico e a transição segura da alta hospitalar para o seguimento ambulatorial.<\/p>\n<h3 class=\"hb\" style=\"--c:#990000;--hb:#ea9999;\">Manejo do SUA Agudo com Instabilidade Hemodinâmica<\/h3>\n<p>A presença de instabilidade hemodinâmica — traduzida por hipotensão arterial (pressão arterial sistólica inferior a 90 mmHg ou queda média superior a 30 mmHg), taquicardia compensatória (frequência cardíaca superior a 100-120 bpm), palidez mucocutânea severa, sudorese fria, tempo de enchimento capilar lentificado (&gt; 2 segundos), oligúria e alteração do nível de consciência — impõe prioridade máxima de suporte intensivo segundo os preceitos de reanimação volêmica avançada. A gravidade reside na rápida depleção do volume circulante efetivo, que culmina em hipoperfusão tecidual, acidose metabólica lática e consumo secundário de fatores de coagulação, retroalimentando o sangramento uterino.<\/p>\n<p>O atendimento inicial deve ser simultâneo à avaliação clínica, estruturado nos seguintes passos de suporte imediato:<\/p>\n<ul>\n<li><strong>Ressuscitação Hemodinâmica:<\/strong> Garantir dois acessos venosos periféricos de grosso calibre (cateteres 14G ou 16G) e infusão imediata e aquecida de cristaloides isotônicos balanceados (Ringer Lactato ou SF 0,9%), limitando o volume inicial a alíquotas de 1.000 a 1.500 mL para evitar hemodiluição precoce e hipotermia induzida.<\/li>\n<li><strong>Provas Laboratoriais Imediatas:<\/strong> Coleta emergencial de tipagem sanguínea com prova cruzada (reserva de hemocomponentes), hemograma completo, coagulograma (TAP, TTPA, INR, fibrinogênio), função renal e dosagem mandatória de fração beta da gonadotrofina coriônica humana (β -hCG) quantitativa para excluir peremptoriamente hemorragia relacionada à prenhez (abortamento hemorrágico, gravidez ectópica ou mola hidatiforme).<\/li>\n<li><strong>Protocolo de Hemotransfusão:<\/strong> Indicação criteriosa de concentrado de hemácias guiada por parâmetros de perda maciça ou níveis de hemoglobina inferiores a 7,0 g/dL (ou abaixo de 8,0 a 9,0 g/dL em pacientes sintomáticas ou com comorbidades cardiovasculares), com reposição de plasma fresco congelado, plaquetas e crioprecipitado se houver coagulopatia de consumo estabelecida ou fibrinogênio sérico inferior a 150-200 mg/dL.<\/li>\n<li><strong>Terapia Hemostática Adjuvante:<\/strong> Administração intravenosa precoce de Ácido Tranexâmico na dose de ataque de 1 g diluído em 100 mL de soro fisiológico a correr em 10 minutos, seguido por manutenção de 1 g a cada 8 horas (ou infusão contínua), atuando como inibidor competitivo da ativação do plasminogênio e bloqueador da fibrinólise acelerada no leito endometrial.<\/li><\/ul>\n<p>Caso a reposição volêmica e o manejo farmacológico inicial não contenham o sangramento de imediato, medidas intervencionistas de contenção mecânica e cirúrgica devem ser adotadas sem retardo. A inserção intrauterina de sonda de Folley de grosso calibre (número 18 ou 20 Fr), com insuflação estéril do balão com 30 a 50 mL de soro fisiológico (podendo atingir até 60-80 mL sob controle tátil e visual), funciona como um tamponamento hidrostático temporário compressing mechanical bed, interrompendo mecanicamente o influxo arterial no leito endometrial enquanto a equipe prepara o centro cirúrgico. Se o sangramento refratário persistir, impõe-se a abordagem cirúrgica: curetagem uterina hemostática (que remove o tecido desvitalizado e estimula a contração miometrial basal), ablação endometrial por histeroscopia em centros capacitados, embolização seletiva das artérias uterinas via radiologia intervencionista ou, em última instância, laparotomia com histerectomia subtotal ou total de emergência como intervenção salvadora de vida (<em>life-saving<\/em>).<\/p>\n<h3 class=\"hb\" style=\"--c:#990000;--hb:#ea9999;\">Manejo do SUA Agudo com Estabilidade Hemodinâmica Preservada<\/h3>\n<p>Na paciente com SUA agudo clinicamente estável — isto é, sem hipotensão postural, taquicardia descompensada ou sinais clínicos de hipoperfusão sistêmica —, a perda sanguínea é copiosa o bastante para motivar ida à urgência, mas permite o controle primariamente medicamentoso por vias hormonais e antifibrinolíticas. O objetivo fisiopatológico fundamental neste cenário é induzir a hemostasia rápida da vasculatura endometrial por meio de decidualização acelerada, vasoconstrição e reepitelização funcional das arteríolas espiraladas expostas.<\/p>\n<p>A conduta hormonal de primeira linha fundamenta-se no emprego de progestagênios em doses elevadas ou na associação estroprogestativa em regime de ataque (\"esquema em escadinha\"):<\/p>\n<ul>\n<li><strong>Progestagênios Orais em Doses Elevadas:<\/strong> Representam a conduta de escolha primordial, principalmente quando há contraindicações relativas ao estrogênio (como tabagismo em mulheres acima de 35 anos, obesidade associada a risco tromboembólico ou hipertensão arterial). Utiliza-se Acetato de Medroxiprogesterona (10 a 20 mg a cada 8 horas por via oral) ou Noretisterona (5 mg a cada 6 a 8 horas). Os progestagênios bloqueiam os receptores estrogênicos endometriais, cessam a mitose desordenada e provocam a decidualização e atrofia do endométrio frágil, permitindo a hemostasia em 24 a 48 horas.<\/li>\n<li><strong>Contraceptivos Orais Combinados Monofásicos (ACO):<\/strong> Esquema baseado em etinilestradiol (30 a 35 mcg) associado a progestagênio de alta potência (levonorgestrel 150 mcg). Prescreve-se classicamente 1 comprimido a cada 8 horas por 48 a 72 horas (ou até a cessação macroscópica do fluxo copioso), seguido de redução escalonada: 1 comprimido a cada 12 horas por 2 a 3 dias e, subsequentemente, 1 comprimido ao dia até completar 21 a 28 dias de tratamento contínuo. O componente estrogênico promove proliferação e regeneração epitelial rápida sobre o estroma denudado, enquanto o progestagênio estabiliza a arquitetura vascular local.<\/li>\n<li><strong>Antifibrinolíticos Sistêmicos:<\/strong> O Ácido Tranexâmico por via oral (1.000 mg a 1.500 mg a cada 8 horas por 3 a 5 dias durante a vigência do fluxo volumoso) atua sinergicamente à terapia hormonal, reduzindo a degradação local do coágulo de fibrina sem interferir no equilíbrio hemostático da circulação sistêmica global.<\/li>\n<li><strong>Anti-inflamatórios Não Esteroidais (AINEs):<\/strong> Como o Ácido Mefenâmico (500 mg a cada 8 horas) ou Ibuprofeno (600 mg a cada 8 horas), úteis como coadjuvantes ao diminuir a síntese endometrial excessiva de prostaglandinas vasodilatadoras (𝑃𝐺𝐸2 e prostaciclina 𝑃𝐺𝐼2) e restaurar o tônus vasoconstritor dependente de endotelina e tromboxano, promovendo redução estimada de 20 a 40% do fluxo sanguíneo menstrual.<\/li><\/ul>\n<h3 class=\"hb\" style=\"--c:#990000;--hb:#ea9999;\">Manejo do Sangramento Uterino Anormal Crônico<\/h3>\n<p>O SUA crônico é conduzido no âmbito ambulatorial e fundamenta-se estritamente na identificação etiológica do sistema PALM-COEIN, no desejo reprodutivo da paciente e na intensidade do impacto sobre o hemograma e a qualidade de vida. As metas terapêuticas a longo prazo consistem em corrigir a anemia ferropriva instalada, restaurar a regularidade cíclica ou induzir amenorreia terapêutica e prevenir recidivas graves ou degenerações neoplásicas endometriais induzidas por anovulação crônica.<\/p>\n<p>O espectro terapêutico no SUA crônico divide-se em abordagens clínicas e cirúrgicas direcionadas:<\/p>\n<ul>\n<li><strong>Sistema Intrauterino Liberador de Levonorgestrel (SIU-LNG 52 mg):<\/strong>  Considerado pela FIGO e pela FEBRASGO o padrão-ouro médico para o SUA de causas não estruturais (SUA-E, SUA-C, SUA-O) e estruturais selecionadas (SUA-A e SUA-L com miomas intramurais sem distorção importante da cavidade endometrial). O SIU-LNG promove liberação local e sustentada do progestagênio, induzindo atrofia glandular marcante, decidualização estromal, redução da neovascularização endometrial e queda de até 90% no volume de sangramento menstrual após 3 a 6 meses de inserção.<\/li>\n<li><strong>Contraceptivos Orais e Progestagênios Cíclicos ou Contínuos:<\/strong> Para causas anovulatórias (SUA-O, como na Síndrome dos Ovários Policísticos), a administração de anticoncepcionais hormonais combinados ou progestagênio em regime cíclico (ex.: Acetato de Medroxiprogesterona 10 mg/dia do 14º ao 25º dia do ciclo) antagoniza o estímulo proliferativo desordenado do estrogênio, garantindo descamação secretora organizada e prevenindo o risco cumulativo de hiperplasia endometrial atípica.<\/li>\n<li><strong>Reposição e Tratamento da Anemia Ferropriva:<\/strong> Correção mandatória das reservas de ferro corporais por via oral (Sulfato Ferroso 200 mg, 1 a 2 vezes ao dia longe das refeições, associado a ácido ascórbico) ou por via intravenosa (Carboximaltose Férrica ou Sacarato de Hidróxido de Ferro) quando há intolerância gastrointestinal, má absorção ou níveis de hemoglobina inferiores a 8-9 g/dL com cinética de ferro severamente exaurida.<\/li>\n<li><strong>Intervenções Cirúrgicas Eletivas Baseadas na Causa PALM: <\/strong>\n<ul>\n<li><em>Polipectomia Histeroscópica (SUA-P):<\/em> Ressecção mecânica ou eletrocirúrgica do pólipo com preservação tecidual sob visão direta, enviando a peça integralmente para anatomopatológico.<\/li>\n<li><em>Mioectomia Histeroscópica ou Laparoscópica (SUA-L):<\/em> Indicada para miomas submucosos (G0, G1 e G2 selecionados) em pacientes sintomáticas que desejam gestar ou preservar o útero.<\/li>\n<li><em>Ablação Endometrial:<\/em> Procedimento destrutivo histeroscópico ou térmico da camada basal do endométrio para mulheres com prole constituída e refratárias ao manejo farmacológico do SUA-E ou SUA-A leve.<\/li>\n<li><em>Histerectomia Eletiva:<\/em> Opção definitiva nos casos de adenomiose severa, leiomiomatose sintomática extensa volumosa ou falha de todas as abordagens conservadoras em pacientes sem anseio gestacional futuro.<\/li>\n<li><em>Tratamento Oncológico/Cirúrgico Guiado (SUA-M):<\/em> Estadiamento e tratamento cirúrgico oncológico (laparotomia/laparoscopia com histerectomia total, salpingo-ooforectomia bilateral e avaliação linfonodal) no carcinoma de endométrio, ou progestagenoterapia em altas doses em casos ultra-selecionados de hiperplasia atípica em pacientes jovens candidatas a protocolo rigoroso de preservação de fertilidade.<\/li><\/ul><\/li><\/ul>\n<h3 class=\"hb\" style=\"--c:#990000;--hb:#ea9999;\">Acompanhamento Ambulatorial após a Alta da Emergência por SUA Agudo<\/h3>\n<p>A alta da paciente que buscou o pronto-atendimento por SUA agudo não encerra o plano terapêutico; pelo contrário, representa um ponto de transição crítico no qual a descontinuidade do cuidado frequentemente precipita recidiva hemorrágica volumosa e readmissão hospitalar. O planejamento da desospitalização deve ser articulado de forma a manter a hemostasia alcançada, monitorar a recuperação hematológica e fechar o diagnóstico etiológico definitivo.<\/p>\n<p>No momento da alta, a paciente deve portar prescrição clara da terapia de manutenção transitória. Pacientes estabilizadas com esquemas de ataque de progestagênios ou anticoncepcionais combinados devem manter a dose de suporte (1 comprimido diário de ACO ou progestagênio oral em dose padrão, ex.: medroxiprogesterona 10 mg/dia) de forma contínua ou programada pelos próximos 30 a 60 dias, instruindo-a expressamente a jamais interromper a medicação de forma abrupta, sob risco de sangramento catastrófico por privação hormonal imediata. Deve ser mantida a reposição suplementar de ferro elementar, ajustada aos exames admissionais.<\/p>\n<p>A consulta de retorno ambulatorial deve ser garantida no prazo de 14 a 30 dias após a alta da emergência. Nessa reavaliação clínica, três pilares essenciais devem ser cumpridos:<\/p>\n<ul>\n<li><strong>Auditoria da Eficácia Terapêutica:<\/strong> Verificação de episódios residuais de sangramento, tolerabilidade gastrointestinal ou vascular à terapia hormonal instituída e adesão posológica ao tratamento prescrito.<\/li>\n<li><strong>Reavaliação Laboratorial:<\/strong> Aferição do hemograma de controle para documentar ascensão sustentada da hemoglobina e do hematócrito, além da cinética do ferro sérico e ferritina.<\/li>\n<li><strong>Propedêutica Armada e Decisão Definitiva:<\/strong> Realização ou revisão de exames de imagem eletivos (ultrassonografia transvaginal pélvica de alta resolução com estudo Doppler ou histerorressonância), agendamento de histeroscopia diagnóstica ambulatorial com biópsia endometrial se indicada (mulheres ≥ 45 anos ou &lt; 45 anos com fatores de risco para SUA-M), e discussão conjunta para transição do tratamento transitório para um método de longa duração (como a inserção programada do SIU-LNG) ou programação de conduta cirúrgica eletiva definitiva.<\/li><\/ul>\n<h3 class=\"hb\" style=\"--c:#990000;--hb:#ea9999;\">Quadro-Resumo: Estratificação e Manejo Integrado do SUA<\/h3>\n<div class=\"tbl\"><table><tr><th><strong>Cenário Clínico<\/strong><\/th><th><strong>Metas Principais<\/strong><\/th><th><strong>Terapia Medicamentosa / <\/strong> <strong>Suporte<\/strong><\/th><th><strong>Intervenção Mecânica / <\/strong> <strong>Cirúrgica<\/strong><\/th><\/tr><tr><td><strong>SUA Agudo com <\/strong> <strong>Instabilidade<\/strong><\/td><td>Estabilização hemodinâmica imediata; conter hemorragia em curso; prevenção do choque.<\/td><td>Cristaloides balanceados (1-1,5 L); Ácido Tranexâmico 1 g IV; hemotransfusão<\/td><td>Tamponamento por balão intrauterino (Foley); curetagem hemostática; histerectomia de emergência.<\/td><\/tr><tr><td><\/td><td><\/td><td>direcionada ( ). 𝐻𝑏&lt; 7 −8𝑔/𝑑𝐿<\/td><td><\/td><\/tr><tr><td><strong>SUA Agudo com <\/strong> <strong>Estabilidade<\/strong><\/td><td>Cessar o sangramento ativo nas primeiras 24-48 horas; regeneração endometrial.<\/td><td>Progestagênios orais em altas doses (Medroxiprogesterona 10-20 mg 8/8h) OU ACO combinado em escadinha; Ácido Tranexâmico VO; AINEs.<\/td><td>Geralmente dispensada no primeiro momento; curetagem ou histeroscopia se falha medicamentosa em 48h.<\/td><\/tr><tr><td><strong>SUA Crônico<\/strong><\/td><td>Regularizar ciclo menstrual; corrigir anemia crônica; tratar a causa PALM-COEIN; prevenir hiperplasia.<\/td><td>SIU de Levonorgestrel (padrão-ouro); ACO contínuo/cíclico; Progestagênios na fase lútea; reposição oral ou IV de ferro.<\/td><td>Conforme etiologia estrutural: polipectomia, miomectomia, ablação endometrial ou histerectomia eletiva.<\/td><\/tr><tr><td><strong>Seguimento <\/strong> <strong>Pós-Alta <\/strong> <strong>da <\/strong> <strong>Emergência<\/strong><\/td><td>Manter hemostasia farmacológica; evitar sangramento por privação; elucidação etiológica.<\/td><td>Manutenção de ACO monofásico diário ou progestagênio oral contínuo por 30-60 dias; suplementação de ferro elementar.<\/td><td>Solicitação ambulatorial de USG transvaginal com Doppler, histeroscopia ambulatorial com biópsia e planejamento terapêutico definitivo.<\/td><\/tr><\/table><\/div>\n<p>O manejo racional do sangramento uterino anormal exige um raciocínio médico estruturado que priorize a estabilidade hemodinâmica antes de mergulhar na minúcia causal. Na urgência descompensada, o foco reside no controle mecânico e na reposição volêmica estrita; na estabilidade clínica, os esteroides sexuais e antifibrinolíticos oferecem o suporte hemostático necessário para cessar a descamação aguda. Por fim, a garantia de um seguimento ambulatorial estruturado conecta a intervenção emergencial ao planejamento crônico definitivo, permitindo a erradicação de lesões estruturais, o controle neuroendócrino de disfunções ovulatórias e a prevenção sustentada da morbimortalidade associada à anemia crônica.<\/p>\n<h3 class=\"hb\" style=\"--c:#990000;--hb:#ea9999;\">Referências Bibliográficas<\/h3>\n<ul>\n<li>AMERICAN COLLEGE OF OBSTETRICIANS AND GYNECOLOGISTS (ACOG). Management of Acute Abnormal Uterine Bleeding in Nonpregnant Reproductive-Aged Women. <strong>Obstetrics &amp; Gynecology<\/strong>, Committee Opinion No. 557 (Reaffirmed 2020), v. 121, n. 4, p. 891-896, 2013.<\/li>\n<li>BEREK, J. S. <strong>Berek &amp; Novak: Tratado de Ginecologia<\/strong>. 16. ed. Rio de Janeiro: Guanabara Koogan, 2021. Cap. 13: Sangramento Uterino Anormal, p. 385-412.<\/li>\n<li>FEDERAÇÃO BRASILEIRA DAS ASSOCIAÇÕES DE GINECOLOGIA E OBSTETRÍCIA (FEBRASGO). <strong>Sangramento Uterino Anormal Agudo<\/strong>. Protocolos Febrasgo de Ginecologia, n. 43. São Paulo: FEBRASGO, 2021.<\/li>\n<li>HOFFMAN, B. L.; SCHORGE, J. O.; BRADSHAW, K. D.; HALVORSON, L. M.; SCHAFFER, J. I.; CORTON, M. M. <strong>Ginecologia de Williams<\/strong>. 3. ed. Porto Alegre: Artmed, 2019. Cap. 8: Sangramento Uterino Anormal, p. 182-205.<\/li>\n<li>NATIONAL INSTITUTE FOR HEALTH AND CARE EXCELLENCE (NICE). <strong>Heavy menstrual bleeding: assessment and management<\/strong>. NICE guideline [NG88]. London: NICE, 2018 (Updated 2021). Disponível em: <a href=\"https://www.nice.org.uk/guidance/ng88\" target=\"_blank\" rel=\"noopener\">https://www.nice.org.uk/guidance/ng88<\/a>.<\/li><\/ul>\n<h2 class=\"hb\" style=\"--c:#660000;--hb:#e06666;\">3- Estabeleça os critérios diagnósticos do Sangramento Uterino Anormal<\/h2>\n<p>O diagnóstico do sangramento uterino anormal (SUA) fundamenta-se na avaliação criteriosa e objetiva dos desvios dos padrões fisiológicos do ciclo menstrual em mulheres em idade fértil, não grávidas. Do ponto de vista conceitual e fisiopatológico, o ciclo menstrual normal reflete o funcionamento íntegro e sincrônico do eixo hipotálamo-hipófise-ovariano (HHO), que promove a proliferação tecidual endometrial estrogênio-dependente, a subsequente diferenciação secretora mediada pela progesterona após a ovulação e a descamação tecidual uniforme decorrente da lise do corpo lúteo. A Federação Internacional de Ginecologia e Obstetrícia (FIGO), em consonância com a Federação Brasileira das Associações de Ginecologia e Obstetrícia (FEBRASGO) e o American College of Obstetricians and Gynecologists (ACOG), estabeleceu parâmetros clínicos estritos para delimitar a normalidade menstrual e, por exclusão ou extrapolação desses limites, fixar os critérios diagnósticos objetivos do SUA. Estabelecer o diagnóstico de SUA exige, portanto, a confirmação clínica de que a perda sanguínea provém da cavidade uterina, a mensuração quantitativa e qualitativa dos quatro eixos do padrão menstrual (frequência, duração, regularidade e volume), e a exclusão obrigatória de afecções gestacionais e de sangramentos extragenitais ou originados em sítios anatômicos adjacentes.<\/p>\n<h3 class=\"hb\" style=\"--c:#990000;--hb:#ea9999;\">Critérios Objetivos dos Quatro Parâmetros Menstruais (FIGO)<\/h3>\n<p>A formalização do diagnóstico de SUA assenta-se na análise discriminativa de quatro eixos fundamentais colhidos na anamnese dirigida, comparados aos limites de referência populacionais (compreendidos entre os percentis 5 e 95):<\/p>\n<ul>\n<li><strong>Frequência Menstrual:<\/strong> Avalia o intervalo de tempo decorrido entre o primeiro dia de uma menstruação e o primeiro dia da menstruação subsequente. O padrão normal situa-se entre 24 e 38 dias. Configura-se critério diagnóstico para SUA por alteração de frequência a presença de episódios frequentes (intervalos intermenstruais estritamente inferiores a 24 dias) ou de episódios infrequentes (intervalos superiores a 38 dias, historicamente referidos como oligomenorreia). A ausência total de sangramento por 90 dias ou mais define formalmente o critério de amenorreia secundária em mulheres com ciclos previamente estabelecidos.<\/li>\n<li><strong>Duração do Fluxo:<\/strong> Mensura a quantidade de dias consecutivos em que a perda sanguínea uterina está presente em um mesmo episódio cíclico. O limite fisiológico aceito é de até 8 dias de fluxo. Considera-se critério para sangramento prolongado quando a duração ultrapassa a marca de 8 dias contínuos. A duração excessiva correlaciona-se comumente a falhas nos mecanismos de vasoconstrição tecidual primária, regeneração epitelial lentificada ou presença de lesões estruturais intrauterinas com neoangiogênese frágil.<\/li>\n<li><strong>Regularidade Cíclica:<\/strong> Diz respeito à previsibilidade dos ciclos e à variação de extensão entre o ciclo mais curto e o mais longo ao longo de um período mínimo de 6 a 12 meses. Em mulheres na menacme consolidada (entre 26 e 41 anos), a variação fisiológica aceitável de ciclo para ciclo é de até 7 a 9 dias. Quando a discrepância temporal entre o menor e o maior ciclo do ano atinge ou ultrapassa 10 dias (ou &gt; 20 dias em extremos reprodutivos), diagnostica-se irregularidade menstrual crônica, manifestação clínica cardinal de desordens anovulatórias.<\/li>\n<li><strong>Volume do Fluxo Sanguíneo (Sangramento Menstrual Volumoso - SMV):<\/strong>  Embora historicamente definido pelo limiar quantitativo estrito acima de 80 mL por ciclo, a prática médica contemporânea adota um critério centrado no impacto funcional e biopsicossocial da paciente. Diagnostica-se SMV quando a intensidade do sangramento interfere negativamente nas atividades de vida diária da mulher (físicas, sociais, emocionais ou laborais), requer troca frequente de absorventes (a cada 1 a 2 horas), exige o uso combinado e simultâneo de diferentes tipos de protetores (como absorvente interno somado ao externo), acarreta o despertar noturno para troca de roupas ou roupas de cama, cursa com a eliminação rotineira de coágulos sanguíneos macroscópicos com dimensão superior a 2,5 cm (tamanho aproximado de uma moeda de 1 real) ou gera repercussão hematológica documentada, como anemia ferropriva ou estoques deprimidos de ferritina.<\/li><\/ul>\n<h3 class=\"hb\" style=\"--c:#990000;--hb:#ea9999;\">Critérios Baseados no Padrão Cronológico e Eventos Intermenstruais<\/h3>\n<p>Além das variações no ciclo regular, o diagnóstico de SUA envolve padrões de descontinuidade temporal e apresentação aguda:<\/p>\n<ul>\n<li><strong>Sangramento Intermenstrual (SIM):<\/strong> Critério diagnosticado pela ocorrência de perda sanguínea espontânea que se manifesta entre menstruações regulares e previsíveis. O SIM pode apresentar-se sob a forma de escapes escassos (<em>spotting<\/em>) ou episódios de fluxo francamente perceptível, ocorrendo de maneira aleatória ou sistemática (por exemplo, na fase peri-ovulatória ou na fase lútea tardia). É um indicador altamente sensível para lesões estruturais endocavitárias focais, como pólipos endometriais e lesões cervicais.<\/li>\n<li><strong>Sangramento Não Previsto / Sangramento Pós-Coito (Sinusorragia):<\/strong> Critério caracterizado pela perda sanguínea desencadeada imediatamente após o coito ou exame ginecológico com espéculo. Exige diferenciação mandatória entre a fonte uterina e lesões do colo uterino, da mucosa vaginal ou de ectopias volumosas com friabilidade tecidual.<\/li>\n<li><strong>Classificação em SUA Agudo versus Crônico:<\/strong> O critério de temporalidade define a conduta terapêutica imediata. Diagnostica-se <strong>SUA crônico<\/strong> quando os desvios nos parâmetros de volume, regularidade, frequência ou duração estão presentes na maior parte dos últimos 6 meses. Em contrapartida, diagnostica-se <strong>SUA agudo<\/strong>  diante de um episódio súbito de sangramento copioso de magnitude expressiva que, na avaliação do médico assistente, requer intervenção imediata para prevenir ou reverter perda volêmica grave, mesmo na ausência de história pregressa de irregularidades menstruais.<\/li><\/ul>\n<h3 class=\"hb\" style=\"--c:#990000;--hb:#ea9999;\">Critérios de Exclusão e Diagnóstico Diferencial Mandatório<\/h3>\n<p>O diagnóstico definitivo de SUA exige uma rotina de exclusão sistemática para evitar falhas terapêuticas ou condutas invasivas iatrogênicas:<\/p>\n<ul>\n<li><strong>Exclusão de Gravidez:<\/strong> O teste confirmatório da fração beta da gonadotrofina coriônica humana (β -hCG), preferencialmente quantitativo, é etapa mandatória e inegociável na abordagem diagnóstica do SUA. Devem ser descartadas ameaças de abortamento, abortamento retido ou incompleto, gravidez ectópica e doença trofoblástica gestacional, que podem mimetizar exatamente os achados de um episódio de SUA agudo ou crônico.<\/li>\n<li><strong>Exclusão de Sítios Extragenitais e Não Uterinos:<\/strong> A anamnese e o exame físico minucioso com inspeção vulvovaginal e exame especular sob iluminação direta são obrigatórios para comprovar que o sangramento exterioriza-se pelo orifício externo do colo uterino (cavidade endometrial). Devem ser ativamente excluídas fontes do trato urinário inferior (hematúria por cistite hemorrágica ou cálculos vesicais), do trato gastrointestinal (sangramento anorretal por doença hemorroidária, fissuras ou proctite) e lesões do trato genital inferior (lacerações vaginais traumáticas, vaginites severas atróficas ou infecciosas, e carcinomas invasores de vulva, vagina ou ectocérvice).<\/li><\/ul>\n<h3 class=\"hb\" style=\"--c:#990000;--hb:#ea9999;\">Critérios de Estratificação Etiológica Complementar<\/h3>\n<p>Uma vez firmado o diagnóstico sindrômico de SUA pelas alterações nos parâmetros menstruais, o diagnóstico nosológico definitivo demanda a aplicação da estratificação diagnóstica baseada nos métodos complementares integrados à classificação PALM-COEIN:<\/p>\n<ul>\n<li><strong>Critérios para Causas Estruturais (PALM):<\/strong> Fechados por meio de exames de imagem e histopatologia. O diagnóstico de pólipo (SUA-P), leiomioma (SUA-L) e adenomiose (SUA-A) requer demonstração por ultrassonografia transvaginal de alta resolução, histerossonografia ou ressonância magnética pélvica, complementados por histeroscopia com biópsia direta. O diagnóstico de malignidade ou hiperplasia atípica (SUA-M) exige análise histopatológica conclusiva do tecido endometrial, obtida preferencialmente por amostragem dirigida ambulatorial ou biópsia endometrial guiada por histeroscopia.<\/li>\n<li><strong>Critérios para Causas Não Estruturais (COEIN):<\/strong> O diagnóstico de coagulopatia (SUA-C) é firmado por triagem clínica positiva e testes hemostáticos laboratoriais anormais (tempo de protrombina, tempo de tromboplastina parcial ativada, quantificação plaquetária, dosagem de fator de von Willebrand e ensaios de cofator de ristocetina). A disfunção ovulatória (SUA-O) diagnostica-se pela combinação de imprevisibilidade dos ciclos com ausência de pico de progesterona na fase lútea média (&lt; 3 ng/mL) ou comorbidades endócrinas associadas (critérios de Rotterdam para SOP, disfunções de TSH e prolactina). A etiologia endometrial (SUA-E) é um diagnóstico de exclusão em mulheres com fluxos aumentados, ciclos perfeitamente regulares e investigação normal para causas anatômicas ou hemostáticas. A causa iatrogênica (SUA-I) diagnostica-se pela correlação temporal direta com introdução de fármacos interferentes (anticoncepcionais, implantes, DIU de cobre ou LNG, anticoagulantes e psicotrópicos).<\/li><\/ul>\n<h3 class=\"hb\" style=\"--c:#990000;--hb:#ea9999;\">Quadro Sinóptico: Parâmetros Fisiológicos vs. Critérios de Anormalidade Menstrual (FIGO)<\/h3>\n<div class=\"tbl\"><table><tr><th><strong>Parâmetro <\/strong> <strong>Menstrual<\/strong><\/th><th><strong>Intervalo de Referência <\/strong> <strong>Normal<\/strong><\/th><th><strong>Critério Diagnóstico de <\/strong> <strong>SUA<\/strong><\/th><th><strong>Implicações <\/strong> <strong>Clínicas <\/strong> <strong>Típicas<\/strong><\/th><\/tr><tr><td><strong>Frequência<\/strong><\/td><td>24 a 38 dias entre o início de dois ciclos.<\/td><td><strong>&lt; 24 dias<\/strong> (frequente) ou <strong>&gt; <\/strong> <strong>38 <\/strong> <strong>dias<\/strong> (infrequente / amenorreia).<\/td><td>Disfunção do eixo HHO; anovulação crônica; falência ovariana.<\/td><\/tr><tr><td><strong>Duração<\/strong><\/td><td>Até 8 dias consecutivos de sangramento.<\/td><td><strong>&gt; 8 dias<\/strong> (sangramento menstrual prolongado).<\/td><td>Falha de hemostasia endometrial primária; miomas submucosos; pólipos.<\/td><\/tr><tr><td><strong>Regularidade<\/strong><\/td><td>Variação 7 a 9 dias entre ≤ o ciclo mais curto e o mais longo.<\/td><td>Variação <strong>10 <\/strong> <strong>dias<\/strong> ≥ (irregularidade menstrual).<\/td><td>Síndrome dos ovários policísticos; hiperprolactinemia; climatério.<\/td><\/tr><tr><td><strong>Volume <\/strong> <strong>do <\/strong> <strong>Fluxo<\/strong><\/td><td>Não interfere na vida diária; trocas a cada 3-4 horas; sem anemia.<\/td><td><strong>Sangramento <\/strong> <strong>Menstrual <\/strong> <strong>Volumoso (SMV):<\/strong> trocas horárias, coágulos &gt; 2,5 cm, queda de hemoglobina.<\/td><td>Adenomiose, leiomiomatose uterina, coagulopatias e disfunção endometrial.<\/td><\/tr><tr><td><strong>Eventos <\/strong> <strong>Intermenstruais<\/strong><\/td><td>Ausentes.<\/td><td>Presença de escapes (<em>spotting<\/em>), sangramento entre ciclos ou pós-coito.<\/td><td>Lesões focais cavitárias (pólipos), ectopias friáveis ou neoplasia cervical.<\/td><\/tr><\/table><\/div>\n<p>Os critérios diagnósticos do Sangramento Uterino Anormal foram refinados para substituir termos subjetivos por balizadores clínicos funcionais e cronológicos reprodutíveis. Ao confrontar o padrão menstrual da paciente com os limites normativos de frequência, duração, regularidade e volume, o médico diagnostica a síndrome com acurácia, estabelece a cronologia (aguda ou crônica) e afasta rapidamente causas obstétricas ou extragenitais. Essa sistematização permite encadear os exames de imagem e laboratoriais necessários para identificar a etiologia dentro da classificação PALM-COEIN e instituir a abordagem terapêutica direcionada.<\/p>\n<h3 class=\"hb\" style=\"--c:#990000;--hb:#ea9999;\">Referências Bibliográficas<\/h3>\n<ul>\n<li>AMERICAN COLLEGE OF OBSTETRICIANS AND GYNECOLOGISTS (ACOG). Diagnosis of abnormal uterine bleeding in reproductive-aged women. <strong>Practice Bulletin No. 128<\/strong>. Obstetrics &amp; Gynecology, v. 120, n. 1, p. 197-206, 2012 (Reaffirmed 2021).<\/li>\n<li>BEREK, J. S. <strong>Berek &amp; Novak: Tratado de Ginecologia<\/strong>. 16. ed. Rio de Janeiro: Guanabara Koogan, 2021. Cap. 13: Sangramento Uterino Anormal, p. 385-412.<\/li>\n<li>FEDERAÇÃO BRASILEIRA DAS ASSOCIAÇÕES DE GINECOLOGIA E OBSTETRÍCIA (FEBRASGO). <strong>Sangramento Uterino Anormal<\/strong>. Protocolos Febrasgo de Ginecologia, n. 42. São Paulo: FEBRASGO, 2021.<\/li>\n<li>HOFFMAN, B. L.; SCHORGE, J. O.; BRADSHAW, K. D.; HALVORSON, L. M.; SCHAFFER, J. I.; CORTON, M. M. <strong>Ginecologia de Williams<\/strong>. 3. ed. Porto Alegre: Artmed, 2019. Cap. 8: Sangramento Uterino Anormal, p. 182-205.<\/li>\n<li>MUNRO, M. G.; CRITCHLEY, H. O. D.; FRASER, I. S.; FIGO MENSTRUAL DISORDERS COMMITTEE. The two FIGO systems for normal and abnormal uterine bleeding symptoms and classification of causes of abnormal uterine bleeding in the reproductive years: 2018 revisions. <strong>International Journal of Gynecology &amp; Obstetrics<\/strong>, v. 143, n. 3, p. 393-408, 2018.<\/li><\/ul>\n<h2 class=\"hb\" style=\"--c:#660000;--hb:#e06666;\">4- Aborde o tratamento do Sangramento Uterino Anormal<\/h2>\n<p>O <strong>manejo <\/strong>é uma estratégia global e ampla que engloba a condução imediata do quadro (incluindo o suporte clínico, a estabilização hemodinâmica e a correção de comorbidades), enquanto o <strong>tratamento <\/strong>refere-se às intervenções específicas (medicamentosas ou cirúrgicas) direcionadas a cessar o sangramento e tratar a sua causa de base.<\/p>\n<p>O tratamento do Sangramento Uterino Anormal (SUA) fundamenta-se no restabelecimento do equilíbrio hemostático tecidual, na interrupção sustentada da perda volêmica excessiva, na prevenção de recidivas graves e na correção das repercussões sistêmicas, como a anemia ferropriva crônica. Longe de constituir uma abordagem empírica uniforme, a escolha terapêutica exige uma análise individualizada que considere a gravidade clínica do episódio (agudo versus crônico), a etiopatogenia definida pelo sistema PALM-COEIN, a idade da paciente, as comorbidades metabólicas ou cardiovasculares associadas e, primordialmente, o desejo reprodutivo a curto e longo prazo. Fisiopatologicamente, as opções terapêuticas atuam em diferentes níveis da cascata hemostática endometrial: estabilizando a vasculatura estromal frágil, promovendo a proliferação epitelial coordenada sobre leitos vasculares denudados, modulando a síntese de mediadores inflamatórios e prostaglandinas locais, inibindo a fibrinólise acelerada no microambiente uterino ou extirpando mecanicamente lesões expansivas que distorcem a cavidade ou a arquitetura juncional miometrial.<\/p>\n<h3 class=\"hb\" style=\"--c:#990000;--hb:#ea9999;\">Tratamento Farmacológico Não Hormonal<\/h3>\n<p>A farmacoterapia não hormonal constitui uma linha terapêutica de extrema relevância, especialmente indicada para mulheres que buscam engravidar imediatamente, pacientes com contraindicações formais ao uso de esteroides sexuais (como histórico de tromboembolismo venoso não anticoagulado, câncer de mama hormônio-dependente ou doença hepática ativa grave) ou como terapia adjuvante durante episódios agudos de fluxo copioso:<\/p>\n<ul>\n<li><strong>Antifibrinolíticos (Ácido Tranexâmico):<\/strong> Atua como inibidor competitivo reversível da ativação do plasminogênio tecidual, bloqueando sua conversão em plasmina no endotélio endometrial. Esse mecanismo estabiliza o coágulo de fibrina recém-formado nas arteríolas espiraladas expostas pela descamação menstrual, sem induzir estado de hipercoagulabilidade na circulação sistêmica periférica. Administra-se por via oral na dose de 1.000 mg a 1.500 mg a cada 8 horas (ou 1 g intravenoso em diluição lenta na vigência de urgência hemorrágica), restrito aos dias de sangramento mais intenso (tipicamente do 1º ao 4º dia do ciclo). Proporciona uma redução substancial de 40% a 60% no volume menstrual, sendo particularmente efetivo no SUA-E (endometrial) e no SUA-C (coagulopatias).<\/li>\n<li><strong>Anti-inflamatórios Não Esteroidais (AINEs):<\/strong> O endométrio de mulheres acometidas por sangramento menstrual volumoso frequentemente superexpressa a ciclo-oxigenase (COX-2), resultando em um desequilíbrio parácrino acentuado: excesso de prostaglandina E2 (PGE2) e prostaciclina (PGI2), que promovem vasodilatação potente e inibição da agregação plaquetária, em detrimento do tromboxano A2 (TXA2) e da prostaglandina F2-alfa (PGF2-alfa), mediadores responsáveis pela vasoconstrição arteriolar e agregação hemostática. O emprego de inibidores da COX, como o Ácido Mefenâmico (500 mg a cada 8 horas) ou o Ibuprofeno (600 mg a cada 8 horas), iniciado no primeiro dia do fluxo ou na véspera e mantido por até 5 dias, reverte esse desbalanço e reduz a perda sanguínea em 20% a 40%, oferecendo ainda alívio pronunciado da dismenorreia associada.<\/li><\/ul>\n<h3 class=\"hb\" style=\"--c:#990000;--hb:#ea9999;\">Tratamento Farmacológico Hormonal<\/h3>\n<p>O controle hormonal é a base do manejo clínico do SUA de origem não estrutural (especialmente SUA-O e SUA-E) e de causas estruturais selecionadas (SUA-A e SUA-L sem distorção importante da cavidade endometrial):<\/p>\n<ul>\n<li><strong>Sistema Intrauterino Liberador de Levonorgestrel (SIU-LNG 52 mg):<\/strong>  Considerado pela FEBRASGO e pelas diretrizes internacionais (NICE e FIGO) como a intervenção clínica de primeira linha mais eficaz para o sangramento crônico volumoso. Ao liberar continuamente 20 mcg diários de levonorgestrel diretamente na cavidade uterina, induz atrofia glandular endometrial extensa, decidualização estromal, redução expressiva do número de receptores de estrogênio e inibição da neoangiogênese local. Esse efeito predominantemente parácrino resulta em redução do volume de sangramento superior a 80% nos primeiros 3 meses e de até 95% em um ano, com taxas elevadas de amenorreia terapêutica e mínima absorção sistêmica, permitindo seu uso em pacientes com risco metabólico.<\/li>\n<li><strong>Anticoncepcionais Orais Combinados (ACO):<\/strong> Esquemas monofásicos baseados na combinação de etinilestradiol (20 a 30 mcg) com um progestagênio (como levonorgestrel, gestodeno ou drospirenona) promovem supressão eficiente do eixo hipotálamo-hipófise-ovariano e decidualização progressiva, convertendo o endométrio em um tecido delgado, hipoplásico e sincrônico. Podem ser utilizados em regime cíclico tradicional ou, idealmente, em regime estendido/contínuo para indução deliberada de amenorreia, eliminando completamente os episódios de sangramento de privação.<\/li>\n<li><strong>Progestagênios Orais Contínuos ou Cíclicos:<\/strong> Nas pacientes anovulatórias crônicas (SUA-O, como na SOP), a progesterona cíclica (ex.: Acetato de Medroxiprogesterona 10 mg/dia por 12 a 14 dias ao mês) mimetiza a fase lútea, promovendo a transformação secretora do endométrio estimulado pelo estrogênio e sua posterior descamação organizada, o que afasta o risco cumulativo de hiperplasia endometrial. Já o uso de progestagênios contínuos em doses médias a altas (ex.: Acetato de Noretisterona 5 a 10 mg/dia ou Desogestrel 75 mcg/dia) é alternativa de excelência quando há contraindicação absoluta aos estrogênios exógenos (como hipertensas descompensadas, tabagistas acima de 35 anos ou enxaqueca com aura).<\/li>\n<li><strong>Agonistas e Antagonistas do Hormônio Liberador de Gonadotrofina (GnRH):<\/strong>  Promovem bloqueio profundo do eixo reprodutivo, gerando um estado de hipoestrogenismo similar à menopausa e induzindo atrofia endometrial acentuada e redução volumétrica temporária de miomas uterinos. Seu uso primário restringe-se a tratamentos de curto prazo (3 a 6 meses), sobretudo como preparo pré-operatório de pacientes com leiomiomas submucosos gigantes e anemia severa refratária, visando viabilizar cirurgias minimamente invasivas e recuperar os estoques hematológicos antes da intervenção.<\/li><\/ul>\n<h3 class=\"hb\" style=\"--c:#990000;--hb:#ea9999;\">Reposição Férrica e Reabilitação Hematológica<\/h3>\n<p>O sangramento menstrual crônico volumoso é uma das causas mais prevalentes de anemia microcítica e hipocrômica no mundo, e seu tratamento exige necessariamente a recomposição das reservas corporais de ferro, sob pena de persistência da fadiga incapacitante, redução do rendimento cognitivo e piora da qualidade de vida:<\/p>\n<ul>\n<li><strong>Via Oral:<\/strong> Indicada em pacientes hemodinamicamente estáveis, com anemia leve a moderada (hemoglobina superior a 9-10 g/dL) e sem distúrbios de absorção gastrointestinal. Prescreve-se Sulfato Ferroso (200 mg, contendo cerca de 40 mg de ferro elementar por drágea), 1 a 2 vezes ao dia, preferencialmente em jejum ou associado a fontes de ácido ascórbico (vitamina C) para facilitar a conversão de íons férricos em ferrosos, mantendo o tratamento por no mínimo 3 a 6 meses após a normalização da hemoglobina para reconstituição do estoque medular (ferritina sérica).<\/li>\n<li><strong>Via Parenteral (Intravenosa):<\/strong> Reservada para anemias graves (hemoglobina inferior a 8 g/dL), falha documentada ou intolerância gástrica severa à via oral, má absorção intestinal ou urgência pré-operatória em que a recuperação hematimétrica precisa ocorrer em curto intervalo de tempo. Utiliza-se a Carboximaltose Férrica ou o Sacarato de Hidróxido de Ferro, cuja dose total é calculada com base no peso corporal e no déficit de hemoglobina da paciente, promovendo restauração célere dos índices hematimétricos e da ferritina sérica com mínima toxicidade imune.<\/li><\/ul>\n<h3 class=\"hb\" style=\"--c:#990000;--hb:#ea9999;\">Tratamento Cirúrgico Conservador e Minimamente Invasivo<\/h3>\n<p>Quando a terapia clínica é ineficaz, contraindicada ou quando há lesões estruturais causais bem delimitadas do grupo PALM, a cirurgia conservadora visa erradicar a alteração anatômica com preservação do órgão uterino:<\/p>\n<ul>\n<li><strong>Polipectomia Histeroscópica (SUA-P):<\/strong> Padrão-ouro cirúrgico para remoção sob visualização direta de pólipos endometriais e endocervicais, utilizando alça diatérmica de ressectoscópio ou <em>shavers<\/em> mecânicos intrauterinos. Esse método garante ressecção completa da base de implantação da lesão com preservação do endométrio sadio adjacente e encaminhamento mandatório do fragmento para confirmação anatomopatológica.<\/li>\n<li><strong>Miomectomia Histeroscópica e Laparoscópica (SUA-L):<\/strong> Nos miomas submucosos (classificação FIGO 0, 1 e 2 com diâmetro inferior a 4-5 cm), a ressecção histeroscópica ambulatorial ou hospitalar restaura a arquitetura interna da cavidade endometrial, cessando o estímulo à angiogênese desregulada com impacto altamente favorável na fertilidade subsequente. Para nódulos intramurais volumosos em mulheres nulíparas sintomáticas, a miomectomia laparoscópica ou por laparotomia com enucleação das lesões e sutura miometrial em planos anatômicos firmes constitui a abordagem de escolha.<\/li>\n<li><strong>Ablação Endometrial:<\/strong> Destruição ou ressecção térmica/mecânica da camada basal do endométrio associada a radiofrequência, balão térmico ou histeroscopia com ressectoscópio. Indicada estritamente para mulheres com prole constituída, que apresentam SUA refratário a medicamentos (especialmente SUA-E e SUA-A leve) e que recusam ou possuem contraindicações clínicas à cirurgia de grande porte. Induz amenorreia ou hipomenorreia em até 80% das pacientes, exigindo a manutenção de método contraceptivo definitivo concomitante devido ao alto risco de gestação ectópica caso ocorra falha.<\/li>\n<li><strong>Embolização das Artérias Uterinas (EAU):<\/strong> Procedimento da radiologia intervencionista minimamente invasivo que envolve o cateterismo superseletivo das artérias uterinas com oclusão microvascular utilizando partículas de álcool polivinílico (PVA) ou microesferas gelatinosas. Promove isquemia e hialinização de leiomiomas múltiplos e focos adenomiose, reduzindo a vascularização do miométrio e o sangramento volumoso em pacientes que desejam preservar o útero, mas não são candidatas ideais à cirurgia aberta.<\/li><\/ul>\n<h3 class=\"hb\" style=\"--c:#990000;--hb:#ea9999;\">Tratamento Cirúrgico Radical (Histerectomia)<\/h3>\n<p>A histerectomia permanece como a opção terapêutica definitiva e curativa para o sangramento uterino anormal, assegurando cessação absoluta da perda menstrual e erradicação de qualquer risco futuro de degeneração maligna do corpo uterino:<\/p>\n<ul>\n<li><strong>Indicações Formais:<\/strong> Reservada para pacientes com falha documentada de todas as abordagens farmacológicas bem conduzidas e de procedimentos minimamente invasivos prévios, presença de adenomiose difusa e incapacitante (SUA-A severo), volumosa leiomiomatose sintomática com compressão de órgãos adjacentes, ou na vigência de hiperplasia endometrial com atipias / adenocarcinoma de endométrio (SUA-M).<\/li>\n<li><strong>Vias de Acesso Cirúrgico:<\/strong> A indicação da via deve sempre priorizar a abordagem menos invasiva. A histerectomia vaginal e a histerectomia por laparoscopia (ou robótica) são as opções preferenciais pelas diretrizes modernas em razão do menor tempo de internação, menor dor pós-operatória, menor perda sanguínea intraoperatória e recuperação funcional acelerada quando comparadas à histerectomia laparotômica (abdominal aberta), que fica restrita a úteros excessivamente volumosos ou anatomia pélvica distorcida por aderências severas.<\/li><\/ul>\n<h3 class=\"hb\" style=\"--c:#990000;--hb:#ea9999;\">Quadro-Resumo: Abordagens Terapêuticas no SUA por Cenário e Etiologia<\/h3>\n<div class=\"tbl\"><table><tr><th><strong>Modalidade <\/strong> <strong>Terapêutica<\/strong><\/th><th><strong>Principais <\/strong> <strong>Fármacos <\/strong> <strong>/ <\/strong> <strong>Procedimentos<\/strong><\/th><th><strong>Mecanismo <\/strong> <strong>de <\/strong> <strong>Ação <\/strong> <strong>Central<\/strong><\/th><th><strong>Principais Indicações<\/strong><\/th><\/tr><tr><td><strong>Não Hormonal<\/strong><\/td><td>Ácido Tranexâmico; AINEs (Mefenâmico, Ibuprofeno).<\/td><td>Inibição da fibrinólise local e bloqueio da síntese excessiva de prostaglandinas vasodilatadoras (PGE2).<\/td><td>Pacientes que desejam gestar imediatamente, contraindicação aos hormônios, SUA-E e SUA-C.<\/td><\/tr><tr><td><strong>Hormonal <\/strong> <strong>Local <\/strong> <strong>(Padrão-Ouro)<\/strong><\/td><td>SIU Liberador de Levonorgestrel (52 mg).<\/td><td>Atrofia endometrial direta contínua e decidualização estromal profunda com mínima absorção sistêmica.<\/td><td>SUA crônico de causas não estruturais (SUA-E, O, C) e estruturais selecionadas (SUA-A e mioma intramural).<\/td><\/tr><tr><td><strong>Hormonal <\/strong> <strong>Sistêmico<\/strong><\/td><td>ACO monofásicos contínuos; Progestagênios orais (Noretisterona, Medroxiprogesterona).<\/td><td>Supressão ovulatória do eixo HHO, atrofia glandular e estabilização arquitetural do endométrio.<\/td><td>SUA anovulatório (SUA-O / SOP), falha ou recusa ao DIU, opções de transição após urgências.<\/td><\/tr><tr><td><strong>Suporte <\/strong> <strong>Hematológico<\/strong><\/td><td>Sulfato Ferroso (VO) ou Carboximaltose Férrica (IV).<\/td><td>Restauração dos estoques medulares de ferritina e reposição da síntese de hemoglobina.<\/td><td>Obrigatório em toda paciente com anemia ferropriva instalada associada ao sangramento crônico.<\/td><\/tr><tr><td><strong>Cirúrgico <\/strong> <strong>Conservador<\/strong><\/td><td>Polipectomia e Miomectomia histeroscópicas; Ablação endometrial.<\/td><td>Remoção direta de lesões intracavitárias obstrutivas ou destruição focal da camada basal endometrial.<\/td><td>SUA-P, miomas submucosos (FIGO 0-2), pacientes refratárias ao tratamento clínico que desejam preservar o útero.<\/td><\/tr><tr><td><strong>Cirúrgico <\/strong> <strong>Definitivo<\/strong><\/td><td>Histerectomia (preferencialmente por via vaginal ou laparoscópica).<\/td><td>Extirpação completa do órgão-alvo; erradicação irreversível da perda sanguínea uterina.<\/td><td>Prole constituída, falha das opções conservadoras, adenomiose severa, lesões atípicas/câncer (SUA-M).<\/td><\/tr><\/table><\/div>\n<p>O tratamento do sangramento uterino anormal consolidou-se na literatura médica moderna como um continuum multidisciplinar e individualizado, transitando de terapias hemostáticas e hormonais altamente direcionadas às intervenções cirúrgicas conservadoras ou definitivas. A priorização de métodos clínicos como o SIU-LNG e os procedimentos histeroscópicos ambulatoriais minimamente invasivos permitiu que a histerectomia deixasse de ser a conduta inicial rotineira, sendo hoje reservada para casos estritamente refratários, doenças miometriais volumosas e afecções oncológicas. Assim, ao integrar o controle da perda volêmica, a correção rigorosa da anemia e a resolução da causa anatômica ou hormonal sob o arcabouço PALM-COEIN, assegura-se a preservação da saúde reprodutiva e a restauração da integridade hematológica e funcional da mulher.<\/p>\n<h3 class=\"hb\" style=\"--c:#990000;--hb:#ea9999;\">Referências Bibliográficas<\/h3>\n<ul>\n<li>AMERICAN COLLEGE OF OBSTETRICIANS AND GYNECOLOGISTS (ACOG). Management of Abnormal Uterine Bleeding Associated With Ovulatory Dysfunction. <strong>Practice Bulletin No. 136<\/strong>. Obstetrics &amp; Gynecology, v. 122, n. 1, p. 176-185, 2013 (Reaffirmed 2021).<\/li>\n<li>BEREK, J. S. <strong>Berek &amp; Novak: Tratado de Ginecologia<\/strong>. 16. ed. Rio de Janeiro: Guanabara Koogan, 2021. Cap. 13: Sangramento Uterino Anormal, p. 385-412.<\/li>\n<li>FEDERAÇÃO BRASILEIRA DAS ASSOCIAÇÕES DE GINECOLOGIA E OBSTETRÍCIA (FEBRASGO). <strong>Tratamento Clínico do Sangramento Uterino Anormal<\/strong>. Protocolos Febrasgo de Ginecologia, n. 44. São Paulo: FEBRASGO, 2021.<\/li>\n<li>HOFFMAN, B. L.; SCHORGE, J. O.; BRADSHAW, K. D.; HALVORSON, L. M.; SCHAFFER, J. I.; CORTON, M. M. <strong>Ginecologia de Williams<\/strong>. 3. ed. Porto Alegre: Artmed, 2019. Cap. 8: Sangramento Uterino Anormal, p. 182-205.<\/li>\n<li>NATIONAL INSTITUTE FOR HEALTH AND CARE EXCELLENCE (NICE). <strong>Heavy menstrual bleeding: assessment and management<\/strong>. NICE guideline [NG88]. London: NICE, 2018 (Updated 2021). Disponível em: <a href=\"https://www.nice.org.uk/guidance/ng88\" target=\"_blank\" rel=\"noopener\">https://www.nice.org.uk/guidance/ng88<\/a>.<\/li><\/ul>\n<h2 class=\"hb\" style=\"--c:#660000;--hb:#e06666;\">5- Disserte sobre a importância e o papel da equipe multiprofissional no cuidado com a paciente com Sangramento Uterino Anormal<\/h2>\n<p>O sangramento uterino anormal (SUA) transcende a esfera de uma disfunção ginecológica estritamente orgânica ou neuroendócrina, configurando-se como uma condição clínica crônica e recidivante com profundas repercussões biopsicossociais. Na prática ambulatorial e hospitalar, a perda sanguínea crônica e excessiva culmina invariavelmente em esgotamento das reservas férricas, astenia incapacitante, absenteísmo laboral, prejuízos nas relações interpessoais e conjugais, além de desencadear ou agravar quadros de ansiedade e depressão reativa. Diante dessa complexidade multifacetada, o modelo biomédico tradicional — centrado unicamente no médico ginecologista e na prescrição isolada de hemostáticos ou intervenções cirúrgicas — mostra-se insuficiente para abarcar a integralidade das demandas da mulher. A atuação articulada de uma equipe multiprofissional surge, portanto, como uma diretriz assistencial mandatória, garantindo a coordenação do cuidado, a vigilância clínica contínua, a adesão terapêutica a longo prazo e a reabilitação funcional integral da paciente nos diversos níveis de atenção à saúde.<\/p>\n<h3 class=\"hb\" style=\"--c:#990000;--hb:#ea9999;\">A Atenção Primária como Ordenadora e a Enfermagem na Linha de Frente<\/h3>\n<p>Na Atenção Primária à Saúde (APS), a equipe de Saúde da Família atua como a principal porta de entrada e ordenadora do fluxo assistencial da paciente com queixas de sangramento menstrual volumoso ou irregularidades cíclicas. O profissional de enfermagem desempenha um papel determinante na identificação precoce, triagem de risco e estratificação sindrômica por meio da consulta de enfermagem ginecológica. Cabe à enfermagem a aplicação de instrumentos clínicos estruturados para mensuração do impacto do fluxo — como gráficos pictóricos de perda sanguínea (PBAC) ou escalas validadas de qualidade de vida —, a investigação ativa de sinais de alarme para instabilidade hemodinâmica e a exclusão inicial de causas gestacionais mediante a realização de testes rápidos de gravidez.<\/p>\n<p>Além da abordagem diagnóstica inicial, a enfermagem exerce papel fulcral na educação em saúde e na sustentação da adesão farmacológica. Muitas pacientes interrompem precocemente regimes hormonais ou terapias com progestagênios contínuos devido aos sangramentos de escape (<em>spotting<\/em>) esperados nos primeiros meses de adaptação; a intervenção educativa da enfermagem desmistifica esses efeitos adversos fisiológicos transitórios, previne a suspensão inadvertida da medicação e orienta sobre o uso correto do Sistema Intrauterino Liberador de Levonorgestrel (SIU-LNG) ou métodos de barreira associados. No contexto hospitalar de urgência, a equipe de enfermagem assegura o monitoramento hemodinâmico rigoroso, a administração segura de hemoderivados e hemostáticos parenterais e a pronta identificação de sinais incipientes de choque hipovolêmico.<\/p>\n<h3 class=\"hb\" style=\"--c:#990000;--hb:#ea9999;\">O Suporte Nutricional e a Reabilitação da Anemia Ferropriva<\/h3>\n<p>A intersecção fisiopatológica entre a perda menstrual copiosa e a depleção dos estoques sistêmicos de ferro torna a atuação do nutricionista indispensável no plano de cuidado. A anemia ferropriva crônica decorrente do SUA não apenas deprime os níveis de hemoglobina circulante, mas esgota os depósitos teciduais de ferritina, prejudicando enzimas dependentes de ferro essenciais para a fosforilação oxidativa mitocondrial e o transporte celular de oxigênio, o que perpetua a fadiga crônica, a queda de rendimento cognitivo e a intolerância ao esforço físico.<\/p>\n<p>O nutricionista elabora estratégias dietoterápicas individualizadas que potencializam a biodisponibilidade do ferro dietético, promovendo a ingestão de ferro heme (de alta absorção) e associando facilitadores da absorção do ferro não heme, como o ácido ascórbico (vitamina C), enquanto mitiga o consumo concomitante de quelantes e inibidores luminais (fitatos, taninos, polifenóis de chás e cafés, e excesso de cálcio junto às principais refeições). Além disso, em pacientes cujo SUA decorre de disfunções ovulatórias ligadas à síndrome dos ovários policísticos (SOP) ou obesidade visceral, a intervenção nutricional no manejo da resistência à insulina e na perda ponderal sustentada atua diretamente na etiopatogenia de base (SUA-O), restaurando a ciclicidade ovulatória fisiológica e reduzindo a hiperplasia endometrial estrogênio-dependente.<\/p>\n<h3 class=\"hb\" style=\"--c:#990000;--hb:#ea9999;\">A Assistência Farmacêutica na Segurança e Conciliação Terapêutica<\/h3>\n<p>O farmacêutico clínico desempenha uma função de barreira contra a iatrogenia e de garantia da eficácia terapêutica no manejo do SUA, especialmente em cenários complexos onde coexistem múltiplas comorbidades. Mulheres com sangramento anormal frequentemente fazem uso crônico de anti-inflamatórios não esteroidais (AINEs), antifibrinolíticos (como o ácido tranexâmico), terapias hormonais combinadas ou progestagênios isolados, demandando rigorosa vigilância quanto a interações medicamentosas, contraindicações formais e toxicidades acumuladas.<\/p>\n<p>Compete ao farmacêutico realizar a conciliação medicamentosa minuciosa para rastrear o uso de anticoagulantes, antiagregantes plaquetários, moduladores seletivos de receptores estrogênicos ou psicotrópicos que alteram os níveis basais de prolactina (causas iatrogênicas de sangramento — SUA-I). O profissional orienta a paciente quanto à posologia correta dos sais de ferro oral, esclarecendo estratégias para contornar os paraefeitos gastrointestinais comuns (como epigastralgia, constipação e náuseas) que historicamente motivam o abandono do tratamento antianêmico. Na dispensação do ácido tranexâmico ou de esquemas hormonais de alta dosagem, o farmacêutico estratifica fatores de risco tromboembólico, alinhando a conduta com a equipe médica para garantir máxima segurança clínica.<\/p>\n<h3 class=\"hb\" style=\"--c:#990000;--hb:#ea9999;\">O Suporte Psicológico, Serviço Social e Fisioterapia na Integralidade do Cuidado<\/h3>\n<p>O impacto psicossocial do SUA é frequentemente subestimado, embora seus sintomas crônicos afetem diretamente a autoestima feminina, a vivência da sexualidade e o bem-estar mental. O psicólogo atua no acolhimento do sofrimento psíquico decorrente da perda do controle sobre o próprio corpo, do medo constante de episódios súbitos de hemorragia em ambientes públicos e do estresse associado a sangramentos imprevisíveis ou dor pélvica crônica associada (como na adenomiose). A psicoterapia auxilia no desenvolvimento de mecanismos de enfrentamento adaptativos, reduzindo o impacto de transtornos de ansiedade e depressão que frequentemente acompanham as afecções ginecológicas crônicas.<\/p>\n<p>De forma complementar, o assistente social avalia os determinantes sociais da saúde que condicionam a trajetória da paciente, identificando barreiras socioeconômicas no acesso regular aos medicamentos prescritos, nas faltas a consultas especializadas e nas dificuldades de deslocamento para a realização de métodos diagnósticos como histeroscopia ou ressonância magnética. O assistente social viabiliza a inserção da usuária em programas de fornecimento gratuito de insumos pelo Sistema Único de Saúde (SUS) e atua na articulação de direitos trabalhistas em casos de incapacidade temporária severa por anemia e astenia. Ademais, a fisioterapia pélvica entra como aliada expressiva nos casos de SUA associado à adenomiose ou leiomiomatose, onde a presença de dor pélvica crônica e dismenorreia gera hipertonia reflexa da musculatura do assoalho pélvico e disfunções miofasciais secundárias, atuando na dessensibilização dolorosa e na recuperação cinesiológica funcional.<\/p>\n<h3 class=\"hb\" style=\"--c:#990000;--hb:#ea9999;\">Quadro Integrador: Matriz de Atribuições da Equipe Multiprofissional no SUA<\/h3>\n<div class=\"tbl\"><table><tr><th><strong>Categoria <\/strong> <strong>Profissional<\/strong><\/th><th><strong>Núcleo de Intervenção Principal<\/strong><\/th><th><strong>Ações Clínicas e Fisiopatológicas Específicas<\/strong><\/th><\/tr><tr><td><strong>Medicina <\/strong> <strong>(Ginecologia/<\/strong> <strong>MFC)<\/strong><\/td><td>Diagnóstico nosológico e coordenação terapêutica.<\/td><td>Estratificação etiológica pelo PALM-COEIN; prescrição hormonal e hemostática; realização de biópsias, cirurgias conservadoras ou radicais; exclusão de causas gestacionais e neoplásicas.<\/td><\/tr><tr><td><strong>Enfermagem<\/strong><\/td><td>Triagem, acolhimento e vigilância ambulatorial/hospitalar.<\/td><td>Aplicação de escores pictóricos de perda sanguínea (PBAC); orientação sobre adaptação ao DIU/SIU e<\/td><\/tr><tr><td><\/td><td><\/td><td>contracepção; monitorização de sinais vitais e hemostasia na urgência hemorrágica.<\/td><\/tr><tr><td><strong>Nutrição<\/strong><\/td><td>Reabilitação hematimétrica e modulação metabólica.<\/td><td>Prescrição dietética com foco na biodisponibilidade de ferro heme e cofatores absortivos; manejo nutricional da obesidade e resistência insulínica associadas a ciclos anovulatórios (SOP/SUA-O).<\/td><\/tr><tr><td><strong>Farmácia <\/strong> <strong>Clínica<\/strong><\/td><td>Segurança medicamentosa e adesão farmacológica.<\/td><td>Rastreio de interações com drogas hemostáticas/hormonais; conciliação de anticoagulantes (SUA-I); estratégias de mitigação de efeitos adversos de sulfato ferroso e antifibrinolíticos.<\/td><\/tr><tr><td><strong>Psicologia<\/strong><\/td><td>Saúde mental e ressignificação da dor/cronicidade.<\/td><td>Abordagem do sofrimento emocional, ansiedade social decorrente de episódios de vazamento, impacto na vida conjugal e sexual; intervenções em dor crônica associada à adenomiose.<\/td><\/tr><tr><td><strong>Serviço <\/strong> <strong>Social<\/strong><\/td><td>Determinantes sociais e viabilização de acesso.<\/td><td>Identificação de vulnerabilidades socioeconômicas; garantia de acesso a fármacos e insumos pelo SUS; suporte em direitos previdenciários e trabalhistas ligados ao absenteísmo por anemia grave.<\/td><\/tr><tr><td><strong>Fisioterapia <\/strong> <strong>Pélvica<\/strong><\/td><td>Reabilitação miofascial e manejo álgico pélvico.<\/td><td>Tratamento de espasmos reflexos e hipertonia do assoalho pélvico secundários à dismenorreia severa (SUA-A); terapias de neuromodulação e cinesioterapia perineal para alívio da dor pélvica.<\/td><\/tr><\/table><\/div>\n<p>A abordagem contemporânea do Sangramento Uterino Anormal exige o abandono de condutas fragmentadas em favor de uma prática interdisciplinar horizontal e colaborativa. Ao articular a precisão diagnóstica médica, a vigilância e educação contínua da enfermagem, a recomposição metabólica pela nutrição, a segurança farmacológica, o suporte psicossocial e a reabilitação física, a equipe multiprofissional assegura que o plano terapêutico não se limite apenas à interrupção do fluxo sanguíneo uterino. Esse modelo integrador restaura a capacidade funcional da mulher, devolve-lhe a autonomia e reduz significativamente as reinternações hospitalares por episódios agudos descompensados, consolidando os preceitos de integralidade e resolubilidade preconizados pela boa prática médica e pelas diretrizes de saúde pública.<\/p>\n<h3 class=\"hb\" style=\"--c:#990000;--hb:#ea9999;\">Referências Bibliográficas<\/h3>\n<ul>\n<li>AMERICAN COLLEGE OF OBSTETRICIANS AND GYNECOLOGISTS (ACOG). Management of Abnormal Uterine Bleeding Associated With Ovulatory Dysfunction. <strong>Practice Bulletin No. 136<\/strong>. Obstetrics &amp; Gynecology, v. 122, n. 1, p. 176-185, 2013 (Reaffirmed 2021).<\/li>\n<li>BEREK, J. S. <strong>Berek &amp; Novak: Tratado de Ginecologia<\/strong>. 16. ed. Rio de Janeiro: Guanabara Koogan, 2021. Cap. 13: Sangramento Uterino Anormal, p. 385-412.<\/li>\n<li>BRASIL. Ministério da Saúde. Secretaria de Atenção à Saúde. Departamento de Atenção Básica. <strong>Saúde das Mulheres<\/strong>. Cadernos de Atenção Básica, n. 32. Brasília: Ministério da Saúde, 2013.<\/li>\n<li>FEDERAÇÃO BRASILEIRA DAS ASSOCIAÇÕES DE GINECOLOGIA E OBSTETRÍCIA (FEBRASGO). <strong>Sangramento Uterino Anormal<\/strong>. Protocolos Febrasgo de Ginecologia, n. 42. São Paulo: FEBRASGO, 2021.<\/li>\n<li>NATIONAL INSTITUTE FOR HEALTH AND CARE EXCELLENCE (NICE). <strong>Heavy menstrual bleeding: assessment and management<\/strong>. NICE guideline [NG88]. London: NICE, 2018 (Updated 2021). Disponível em:<\/li><\/ul>\n<p><a href=\"https://www.nice.org.uk/guidance/ng88\" target=\"_blank\" rel=\"noopener\">https://www.nice.org.uk/guidance/ng88<\/a>.<\/p>\n<h2 class=\"hb\" style=\"--c:#660000;--hb:#e06666;\">Resumo<\/h2>\n<h3 class=\"hc\" style=\"--c:#1f1f1f;\">1. Definição e Classificação pelo Sistema PALM-COEIN<\/h3>\n<p>O <strong>Sangramento Uterino Anormal (SUA)<\/strong> é definido como qualquer alteração no padrão menstrual normal, seja em frequência, duração, regularidade ou volume sanguíneo perdido, fora do período gestacional. Pode manifestar-se de forma aguda (episódio de sangramento volumoso com necessidade de intervenção imediata para prevenir perdas adicionais) ou crônica (alterações presentes na maioria dos últimos 6 meses).<\/p>\n<p>A Federação Internacional de Ginecologia e Obstetrícia (FIGO) desenvolveu o sistema de classificação <strong>PALM-COEIN<\/strong>, que divide as etiologias em causas estruturais (mensuráveis por métodos de imagem ou histopatologia) e não estruturais:<\/p>\n<div class=\"tbl\"><table><tr><th><strong>Grupo<\/strong><\/th><th><strong>Letra<\/strong><\/th><th><strong>Causa<\/strong><\/th><th><strong>Características Clínicas<\/strong><\/th><\/tr><tr><td><strong>Estruturais <\/strong> <strong>(PALM)<\/strong><\/td><td><strong>P<\/strong><\/td><td>Pólipo<\/td><td>Projeções epiteliais benignas da mucosa endometrial ou endocervical; comum sangramento intermenstrual.<\/td><\/tr><tr><td><\/td><td><strong>A<\/strong><\/td><td>Adenomiose<\/td><td>Presença de glândulas e estroma endometriais no miométrio; frequentemente associada a dismenorreia e útero aumentado/doloroso.<\/td><\/tr><tr><td><\/td><td><strong>L<\/strong><\/td><td>Leiomioma<\/td><td>Neoplasias benignas de células musculares lisas (submucosos causam maior impacto direto no sangramento).<\/td><\/tr><tr><td><\/td><td><strong>M<\/strong><\/td><td>Malignidade e hiperplasia<\/td><td>Neoplasia endometrial ou lesões pré-malignas (hiperplasia com atipia); principal suspeita em mulheres na pós-menopausa.<\/td><\/tr><tr><td><strong>Não Estruturais <\/strong> <strong>(COEIN)<\/strong><\/td><td><strong>C<\/strong><\/td><td>Coagulopatia<\/td><td>Distúrbios da hemostasia (ex.: Doença de von Willebrand, trombocitopenias, uso de anticoagulantes).<\/td><\/tr><tr><td><\/td><td><strong>O<\/strong><\/td><td>Disfunção Ovulatória<\/td><td>Anovulação ou ovulação irregular (ex.: Síndrome dos Ovários Policísticos, hipotireoidismo, estresse extremo).<\/td><\/tr><tr><td><\/td><td><strong>E<\/strong><\/td><td>Disfunção Endometrial<\/td><td>Falha primária dos mecanismos hemostáticos endometriais locais (vasoconstrição deficiente, lise precoce de coágulos).<\/td><\/tr><tr><td><\/td><td><strong>I<\/strong><\/td><td>Iatrogênica<\/td><td>Uso de DIU (cobre ou levonorgestrel), implantes, esteroides sexuais exógenos ou fármacos psicotrópicos.<\/td><\/tr><tr><td><\/td><td><strong>N<\/strong><\/td><td>Não classificada<\/td><td>Entidades raras ou ainda não completamente elucidadas (ex.: malformações arteriovenosas, nichos de cesárea/ístmocele).<\/td><\/tr><\/table><\/div>\n<h3 class=\"hc\" style=\"--c:#1f1f1f;\">2. Manejo Clínico Conforme Apresentação e Gravidade<\/h3>\n<p>O manejo divide-se em cenários de emergência e seguimento de longo prazo:<\/p>\n<p><strong>A. SUA Agudo com Instabilidade Hemodinâmica <\/strong><\/p>\n<ol>\n<li>1. <strong>Estabilização imediata (Protocolo ABCDE):<\/strong> Acesso venoso calibroso duplo (14G ou 16G), monitorização contínua e ressuscitação com cristaloides aquecidos.<\/li>\n<li>2. <strong>Avaliação laboratorial emergencial:<\/strong> Hemograma completo, coagulograma, tipagem sanguínea com prova cruzada e beta-hCG.<\/li>\n<li>3. <strong>Hemotransfusão:<\/strong> Indicar concentrado de hemácias conforme perda volêmica, choque persistente ou níveis críticos de hemoglobina (𝐻𝑏&lt; 7𝑔/𝑑𝐿 em jovens sem comorbidades, ou alvo maior em cardiopatas).<\/li>\n<li>4. <strong>Controle farmacológico de urgência: <\/strong>\n<ul>\n<li><strong>Ácido Tranexâmico:<\/strong> 1𝑔 IV a cada 8 horas (ou diluído em infusão lenta).<\/li>\n<li><strong>Estrogênios conjugados equinos IV:<\/strong> 25𝑚𝑔 IV a cada 4 a 6 horas (reepitelização rápida do endométrio), até cessar ou por 24 horas <em>(onde disponível)<\/em>. Alternativamente, doses elevadas de progestagênios orais ou estrogênio + progestagênio combinados se houver tolerância oral.<\/li><\/ul><\/li>\n<li>5. <strong>Medidas invasivas/cirúrgicas imediatas (se falha clínica): <\/strong>\n<ul>\n<li>Tamponamento intrauterino com balão (ex.: sonda de Foley com 30 a 50 mL de soro estéril no canal uterino).<\/li>\n<li>Curetagem uterina hemostática.<\/li>\n<li>Embolização de artérias uterinas (se estabilidade limítrofe e estrutura de hemodinâmica disponível).<\/li>\n<li>Histerectomia de emergência como última linha de salvamento.<\/li><\/ul><\/li><\/ol>\n<p><strong>B. SUA Agudo com Estabilidade Hemodinâmica Preservada <\/strong><\/p>\n<ul>\n<li>Foco em estancar o sangramento e evitar progressão para anemia grave.<\/li>\n<li><strong>Ácido Tranexâmico:<\/strong> 1𝑎1, 5𝑔 VO de 8/8h nos dias de sangramento intenso.<\/li>\n<li><strong>Terapia hormonal oral intensiva (um dos esquemas): <\/strong>\n<ul>\n<li>Acetato de Medroxiprogesterona (20𝑚𝑔 VO 3 vezes ao dia) ou outro progestagênio em dose de ataque.<\/li>\n<li>Anticoncepcional oral combinado monofásico (30 a 35 mcg de etinilestradiol): 1 comprimido de 8/8h por 48 horas ou até cessar, seguido de descalonamento progressivo (12/12h por 48h, depois 1x ao dia até completar a cartela).<\/li><\/ul><\/li><\/ul>\n<p><strong>C. SUA Crônico <\/strong><\/p>\n<ul>\n<li>Foco na etiologia de base (PALM-COEIN) e na qualidade de vida:\n<ul>\n<li>Reposição de ferro (oral ou parenteral) para correção da ferropenia/anemia.<\/li>\n<li>Supressão ou controle cíclico do sangramento via hormonal (SIU-Levonorgestrel, ACOs, progestagênios contínuos ou implantes).<\/li>\n<li>Programação cirúrgica eletiva quando indicada (miomectomia, polipectomia, ablação endometrial ou histerectomia).<\/li><\/ul><\/li><\/u
