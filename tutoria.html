<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tutoria · Situações-problema</title>
<style>
/* Tutoria — objetivos de aprendizagem respondidos por situação-problema, na roupagem vitrine do site */
:root{
  --bg:#f5f5f7; --card:#ffffff; --ink:#1d1d1f; --muted:#6e6e73; --line:#d2d2d7; --soft:#f5f5f7; --hover:#ebebef;
  --accent:#0066cc; --accent-soft:#e8f2fd; --tip:#fff8e1; --tipline:#f0d78c;
  --shadow:0 1px 3px rgba(0,0,0,.04),0 10px 30px rgba(0,0,0,.045); --bar:rgba(245,245,247,.86);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1d1d1f; --ink:#f5f5f7; --muted:#a1a1a6; --line:#38383a; --soft:#2c2c2e; --hover:#2c2c2e;
  --accent:#2997ff; --accent-soft:#0b2a4a; --tip:#2b2610; --tipline:#5c4f1c;
  --shadow:0 1px 2px rgba(0,0,0,.4); --bar:rgba(22,22,23,.82);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;
  padding:0 max(22px,env(safe-area-inset-right,0px)) 60px max(22px,env(safe-area-inset-left,0px))}
button{font-family:var(--font)}
.kicker{font-size:11px;letter-spacing:.13em;font-weight:700;color:var(--muted);text-transform:uppercase}
.ghost{font:600 13px var(--font);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer}
.ghost:hover{background:var(--hover)}

/* Biblioteca */
.lib{max-width:1080px;margin:0 auto;padding-top:64px}
.lib h1{font-size:clamp(44px,7vw,76px);line-height:1.02;letter-spacing:-.06em;margin:14px 0 12px;font-weight:750}
.lib .lead{font-size:19px;color:var(--muted);max-width:620px;margin:0 0 40px}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:20px}
.rcard{display:flex;flex-direction:column;text-align:left;border:0;border-radius:24px;background:var(--card);box-shadow:var(--shadow);padding:0;overflow:hidden;cursor:pointer;color:var(--ink);
  transition:transform .4s cubic-bezier(.2,.75,.25,1),box-shadow .4s}
.rcard:hover{transform:translateY(-4px);box-shadow:0 16px 40px rgba(0,0,0,.11)}
.rcard:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
.rcard .tcv{position:relative;height:170px;background:#dcecff;color:#1d1d1f;padding:22px 24px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.tcv .tk{font-size:11px;letter-spacing:.13em;font-weight:700;text-transform:uppercase;opacity:.65}
.tcv .tn{font-size:64px;font-weight:750;letter-spacing:-.06em;line-height:1}
.tcv strong{position:absolute;right:18px;top:-18px;font-size:120px;line-height:1;opacity:.12}
:root[data-theme="dark"] .rcard .tcv{filter:brightness(.82)}
/* conteúdo vindo do Google Docs: títulos com fundo colorido, cores e marca-texto do original */
.doc h2.hb,.doc h3.hb{background:var(--hb);color:var(--c);padding:8px 14px;border-radius:12px;border-top:0;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.doc h2.hb{margin-top:52px}.doc h3.hb{display:inline-block;margin:28px 0 10px}
.doc h2.hc,.doc h3.hc{color:var(--c)}
.doc .cc{color:var(--c)}
.doc mark{background:var(--m);color:#1d1d1f;border-radius:3px;padding:0 2px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.doc mark .cc{color:inherit}
:root[data-theme="dark"] .doc .cc,:root[data-theme="dark"] .doc h2.hc,:root[data-theme="dark"] .doc h3.hc{color:color-mix(in srgb,var(--c) 40%,#ffffff)}
.doc figure{margin:14px 0}.doc figure img{margin:0;border-radius:10px}
.doc td p,.doc th p{margin:0}
.doc a{color:var(--accent);overflow-wrap:anywhere}
.doc p,.doc li{text-align:justify;hyphens:auto;-webkit-hyphens:auto}
.doc td,.doc th{text-align:left;hyphens:manual}
.rcard .bd{padding:20px 22px 22px;display:flex;flex-direction:column;gap:6px}
.rcard .sp{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.rcard .tt{font-size:24px;font-weight:700;letter-spacing:-.04em;line-height:1.12}
.rcard .ds{font-size:14px;color:var(--muted)}
.rcard .go{font-size:15px;font-weight:600;color:var(--accent);margin-top:6px}
.soon{border:2px dashed var(--line);border-radius:24px;padding:28px;color:var(--muted);font-size:15px;display:flex;flex-direction:column;justify-content:center;gap:6px;min-height:200px}
.soon b{color:var(--ink);font-size:18px;letter-spacing:-.02em}

/* Leitura */
.reader{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:250px minmax(0,1fr);gap:40px;padding-top:24px}
.toc{position:sticky;top:20px;align-self:start;max-height:calc(100vh - 40px);overflow-y:auto;padding:8px 0 20px}
.toc .back{margin-bottom:18px}
.toc ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px}
.toc a{display:block;color:var(--ink);text-decoration:none;font-size:13.5px;line-height:1.35;padding:6px 10px;border-radius:10px}
.toc a:hover{background:var(--hover)}
.toc a.h3{padding-left:22px;color:var(--muted);font-size:13px}
.toc a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.toc-btn{display:none}
.doc{background:var(--card);border-radius:28px;box-shadow:var(--shadow);padding:48px clamp(22px,5vw,64px) 56px;min-width:0}
.doc-head{margin-bottom:28px}
.doc-banner{display:block;width:100%;height:auto;margin:0 0 22px}
.doc.pages{padding:18px;background:var(--card)}
.pg{display:block;width:100%;height:auto;border-radius:12px;background:#fff;margin:0 0 14px;cursor:zoom-in;box-shadow:0 0 0 1px var(--line)}
.zoom{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.88);overflow:auto;-webkit-overflow-scrolling:touch;cursor:zoom-out}
.zoom img{display:block;width:min(1600px,200vw);max-width:none;margin:0 auto}
.zoom-x{position:fixed;top:12px;right:12px;z-index:51;font:600 14px var(--font);color:#fff;background:rgba(255,255,255,.18);border:0;border-radius:999px;padding:9px 16px;cursor:pointer}
.doc-head h1{font-size:clamp(34px,5vw,52px);line-height:1.04;letter-spacing:-.055em;margin:12px 0 8px}
.doc-head p{color:var(--muted);margin:0}
.doc h2{font-size:clamp(24px,3vw,30px);letter-spacing:-.04em;line-height:1.15;margin:48px 0 14px;padding-top:24px;border-top:1px solid var(--line);scroll-margin-top:24px}
.doc h3{font-size:19px;letter-spacing:-.02em;margin:30px 0 8px;scroll-margin-top:24px}
.doc p,.doc li{font-size:16.5px}
.doc p{margin:0 0 12px}
.doc ol,.doc ul{padding-left:22px;margin:0 0 14px}
.doc li p{margin:0 0 4px}
.doc strong{font-weight:650}
.doc img{max-width:100%;height:auto;display:block;border-radius:14px;margin:8px auto}
.doc blockquote{margin:16px 0;padding:14px 18px;background:var(--tip);border:1px solid var(--tipline);border-radius:16px}
.doc blockquote p:last-child{margin:0}
.tbl{overflow-x:auto;margin:14px 0 20px;border-radius:16px;border:1px solid var(--line)}
.doc table{border-collapse:collapse;width:100%;font-size:14.5px;line-height:1.45}
.doc th,.doc td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.doc th{background:var(--soft);font-weight:650}
.doc tr:last-child td{border-bottom:0}
.tbl.figs{border:0;border-radius:0}
.tbl.figs td{border:0;padding:6px;width:50%;font-size:13.5px;color:var(--muted)}
.doc .fig-cap{font-size:13.5px;color:var(--muted)}

@media (max-width:900px){
  body{padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
  .reader{grid-template-columns:minmax(0,1fr);gap:14px;padding-top:14px}
  .toc{position:static;max-height:none;padding:0}
  .toc-btn{display:inline-block;margin-left:8px}
  .toc ol{display:none;margin-top:10px;background:var(--card);border-radius:18px;padding:8px;box-shadow:var(--shadow)}
  .toc.open ol{display:flex}
  .toc .back{margin-bottom:0}
  .doc{border-radius:22px;padding:32px 18px 40px}
  .doc.pages{padding:6px;border-radius:16px}
  .pg{margin-bottom:6px;border-radius:10px}
  .lib{padding-top:36px}
}
/* ---------- Flashcards ---------- */
.fc-seg{display:inline-flex;gap:2px;padding:3px;margin:0 0 22px;background:var(--hover);border-radius:999px}
.fc-seg button{font:600 14px var(--font);color:var(--muted);background:none;border:0;border-radius:999px;padding:8px 16px;cursor:pointer}
.fc-seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.doc.pages .fc-seg{margin:10px 10px 16px}
.reader.fc-mode .toc ol,.reader.fc-mode .toc .toc-btn{display:none!important}
.fc{max-width:680px;margin:6px auto 10px;text-align:center}
.fc .fc-intro{color:var(--muted);font-size:15.5px;margin:0 auto 22px;max-width:460px;text-align:center}
.fc .fc-k{font-size:11px;letter-spacing:.13em;font-weight:700;text-transform:uppercase;color:var(--muted)}
.fc .fc-gen{font:600 15px var(--font);color:#fff;background:var(--accent-solid,#0071e3);border:0;border-radius:999px;padding:12px 24px;cursor:pointer;margin-top:4px}
.fc .fc-gen:hover{filter:brightness(1.07)}
.fc-card{perspective:1400px;margin:22px 0 16px;cursor:pointer;outline:none}
.fc-in{position:relative;min-height:300px;transition:transform .55s cubic-bezier(.2,.75,.25,1);transform-style:preserve-3d}
.fc-card.flip .fc-in{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:24px;padding:34px 34px 28px;display:flex;flex-direction:column;justify-content:center;gap:14px;text-align:left}
.fc-front{background:var(--card);box-shadow:var(--shadow),0 0 0 1px var(--line)}
.fc-back{background:var(--ink);color:var(--card);transform:rotateY(180deg)}
.fc-face .lab{font-size:11px;letter-spacing:.13em;font-weight:700;text-transform:uppercase;color:var(--muted)}
.fc-back .lab{color:inherit;opacity:.62}
.fc-face .tx{font-size:clamp(19px,2.4vw,23px);line-height:1.38;letter-spacing:-.02em;font-weight:600;text-align:left;hyphens:manual}
.fc-back .tx{font-size:clamp(16.5px,2vw,19px);font-weight:500;line-height:1.5}
.fc-face .hint{margin-top:auto;font-size:12.5px;color:var(--muted)}
.fc-back .hint{color:inherit;opacity:.55}
.fc-bar{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.fc-bar .ghost{font-size:14px;padding:9px 16px}
.fc-cnt{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:70px}
.fc-prog{height:4px;border-radius:2px;background:var(--hover);overflow:hidden;max-width:300px;margin:14px auto 0}
.fc-prog i{display:block;height:100%;background:var(--accent);transition:width .3s}
.fc-end{padding:30px 10px}
.fc-end b{display:block;font-size:24px;letter-spacing:-.03em;margin-bottom:6px}
@media (max-width:600px){.fc-in{min-height:340px}.fc-face{padding:26px 22px 20px}}
</style>
</head>
<body>

<section class="lib" id="lib">
  <div class="kicker">01 · Aprendizagem</div>
  <h1>Tutoria.</h1>
  <p class="lead">Os objetivos de aprendizagem de cada situação-problema, respondidos e organizados por tutoria.</p>
  <div class="shelf" id="shelf"></div>
</section>

<section class="reader" id="reader" hidden>
  <nav class="toc" id="toc" aria-label="Sumário">
    <button class="ghost back" id="backLib" type="button">← Tutorias</button><button class="ghost toc-btn" id="tocBtn" type="button" aria-expanded="false">Sumário</button>
    <ol id="tocList"></ol>
  </nav>
  <article class="doc" id="doc"></article>
</section>
<div class="zoom" id="zoom" hidden><img id="zoomImg" alt=""></div><button class="zoom-x" id="zoomX" type="button" hidden>Fechar ✕</button>

<script>
const ROTEIROS = [{"id": "tutoria-1-1", "num": "1.1", "sp": "Tutoria 1.1", "titulo": "Câncer de pele", "subtitulo": "Tutoria 1.1 · objetivos de aprendizagem respondidos", "resumo": "Tipos, manifestações, diagnóstico e tratamento no SUS, fatores de risco e o papel da APS.", "html": "<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#c9daf8;\">Palavras desconhecidas/Termos técnicos:<\/h3>\n<ul>\n<li><strong>Pápula com aspecto perolado:<\/strong> Lesão cutânea sólida, elevada e menor que 1 cm, com brilho translúcido característico; é o sinal clínico clássico do carcinoma basocelular (CBC).<\/li>\n<li><strong>Fototipo II:<\/strong> Classificação de Fitzpatrick para pele clara que queima com facilidade e bronzeia muito pouco ou raramente após exposição solar.\n<ul>\n<li><strong>Tipo I:<\/strong> Pele muito branca; olhos claros; cabelos loiros ou ruivos; sardas comuns. Sempre queima e nunca bronzeia. Sensibilidade extrema.<\/li>\n<li><strong>Tipo II:<\/strong> Pele clara. Sempre queima e bronzeia muito pouco. Alta sensibilidade ao sol.<\/li>\n<li><strong>Tipo III:<\/strong> Pele morena clara. Queima moderadamente e bronzeia moderadamente. Sensibilidade normal ao sol.<\/li>\n<li><strong>Tipo IV:<\/strong> Pele morena moderada (marrom-claro). Queima pouco e bronzeia com facilidade.<\/li>\n<li><strong>Tipo V:<\/strong> Pele morena escura (marrom). Queima raramente e bronzeia muito.<\/li>\n<li><strong>Tipo VI:<\/strong> Pele negra (marrom-escuro a negro). Nunca queima e é totalmente pigmentada.<\/li><\/ul><\/li><\/ul>\n<figure><img loading=\"lazy\" src=\"img/f894c98adc9ba1b0.webp\" style=\"max-width:646px\" loading=\"lazy\" alt=\"\"><\/figure>\n<ul>\n<li>\n<ul>\n\n<li>The Efficacy of the Fitzpatrick Scale in Clinical Practice - <span class=\"cc\" style=\"--c:#1155cc\"><a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC12971093/\" target=\"_blank\" rel=\"noopener\">https://pmc.ncbi.nlm.nih.gov/articles/PMC12971093/<\/a><\/span><\/li><\/ul><\/li>\n<li><strong>Dermatoscopia:<\/strong> Exame não invasivo realizado com aparelho óptico de aumento e luz polarizada/líquido de interface, permitindo visualizar estruturas e padrões pigmentares abaixo do estrato córneo.<\/li>\n<li><strong>Vasos arboriformes:<\/strong> Padrão vascular dermatoscópico caracterizado por telangiectasias calibrosas e bem focadas que se ramificam como galhos de árvore; altamente sugestivo de carcinoma basocelular.<\/li>\n<li><strong>Biópsias (excisional vs. incisional): <\/strong>\n<ul>\n<li><strong>Excisional:<\/strong> Remoção completa de toda a lesão com margem de segurança diagnóstica.<\/li>\n<li><strong>Incisional:<\/strong> Retirada de apenas um fragmento ou amostra representativa da lesão.<\/li><\/ul><\/li>\n<li><strong>Espessura de Breslow:<\/strong> Medida microscópica vertical (em milímetros) da profundidade de invasão de um melanoma, medida da camada granulosa da epiderme até a célula neoplásica mais profunda.<\/li>\n<li><strong>Estadiamento clínico T1b:<\/strong> Subcategoria tumoral inicial em oncologia cutânea (como no melanoma), indicando espessura fina com presença de fatores de risco associados (por exemplo, ulceração ou espessura entre 0,8 mm e 1,0 mm).<\/li>\n<li><strong>Índice mitótico:<\/strong> Contagem histopatológica do número de mitoses (células em divisão ativa) por milímetro quadrado (mm2), indicativo da velocidade de proliferação do tumor.<\/li>\n<li><strong>Biópsia do Linfonodo Sentinela:<\/strong> Procedimento cirúrgico para identificar e remover o primeiro linfonodo da cadeia de drenagem linfática do tumor, avaliando a presença de micrometástases.<\/li>\n<li><strong>Cirurgia de Mohs:<\/strong> Técnica cirúrgica especializada para retirada de cânceres de pele com exame microscópico imediato e completo de todas as margens cirúrgicas durante o ato operatório, maximizando a preservação de tecido saudável.<\/li>\n<li><strong>Queratoses actínicas:<\/strong> Lesões cutâneas pré-malignas ásperas, escamosas ou crostosas, causadas pelo dano cumulativo da radiação ultravioleta, com potencial de evolução para carcinoma espinocelular.<\/li><\/ul>\n<p>Questões de Aprendizagem:<\/p>\n<ol>\n<li>1. Definir e diferenciar tipos de câncer de pele. (melanoma, carcinoma basocelular, carcinoma espinocelular)<\/li>\n<li>2. Descreva as principais manifestações clínicas iniciais e avançadas, incluindo sinais e sintomas relacionados aos cânceres de pele. (regra do ABCDE para melanoma)<\/li>\n<li>3. Elenque os métodos diagnósticos ofertados pelo SUS utilizados para examinar e diagnosticar as lesões de câncer de pele. (exame clínico, dermatoscopia, biópsias e exames complementares de estadiamento)<\/li>\n<li>4. Discuta as estratégias terapêuticas existentes no tratamento do câncer de pele no SUS. (cirurgia, imunoterapia e terapia alvo)<\/li>\n<li>5. Descreva os fatores de risco associados ao surgimento de câncer de pele. (exposição solar, predisposição genética, fototipo e imunossupressão)<\/li>\n<li>6. Disserte sobre o papel da APS nas prevenções primária e secundária do câncer de pele.<\/li><\/ol>\n<h2 class=\"hb\" style=\"--c:#1c4587;--hb:#6d9eeb;\">1- Definir e diferenciar tipos de câncer de pele. (melanoma, carcinoma basocelular, carcinoma espinocelular)<\/h2>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#c9daf8;\">Introdução Conceitual<\/h3>\n<p>As neoplasias malignas cutâneas constituem o grupo de cânceres de maior incidência na população humana, com repercussão expressiva na saúde pública global e brasileira. Didaticamente, dividem-se em <strong>câncer de pele não melanoma (CPNM)<\/strong> — majoritariamente representado pelo carcinoma basocelular (CBC) e pelo carcinoma espinocelular (CEC) — e <strong>melanoma cutâneo<\/strong>.<\/p>\n<p>Enquanto o CBC e o CEC derivam da linhagem de queratinócitos da epiderme, o melanoma tem origem nos melanócitos, células produtoras de melanina derivadas da crista neural. Essa divergência de linhagem celular determina comportamentos biológicos marcadamente distintos: enquanto os não melanomas exibem predomínio de invasão local com potencial metastático variável (baixo no CBC e moderado no CEC), o melanoma caracteriza-se por alta agressividade biológica, invasividade precoce e expressiva capacidade de disseminação linfática e hematogênica.<\/p>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#c9daf8;\">Mecanismos Fisiopatológicos e Oncogênese Integrada<\/h3>\n<p>A radiação ultravioleta (RUV) atua como o principal fator etiológico compartilhado, porém com padrões de exposição e vias moleculares divergentes entre os tipos histológicos:<\/p>\n<ul>\n<li><strong>Carcinoma Basocelular (CBC):<\/strong> Decorre predominantemente da exposição solar intermitente e intensa, associada a episódios de queimadura solar na infância e juventude. A via molecular central envolve a desregulação da cascata <em>Sonic Hedgehog<\/em> (PTCH1/SMO), levando à proliferação autônoma de células da camada basal epidérmica ou do folículo pilossebáceo.<\/li>\n<li><strong>Carcinoma Espinocelular (CEC):<\/strong> Relaciona-se com a exposição cumulativa crônica ao sol ao longo da vida e com estados de imunossupressão. Ocorre acúmulo de mutações induzidas por UV no gene supressor tumoral <em>TP53<\/em>, provocando perda do controle do ciclo celular e diferenciação anômala dos queratinócitos da camada espinhosa. Frequentemente surge a partir de lesões precursoras, sobretudo ceratoses actínicas.<\/li>\n<li><strong>Melanoma Cutâneo:<\/strong> Associa-se tanto à exposição solar intermitente e intensa quanto a fatores genéticos intrínsecos (mutações em <em>CDKN2A<\/em>, <em>BRAF V600E<\/em>, <em>NRAS<\/em>  e <em>KIT<\/em>). A transformação maligna dos melanócitos da junção dermoepidérmica inicia-se por proliferação desordenada, progredindo de uma fase de crescimento radial (intraepidérmica/microinvasiva) para uma fase de crescimento vertical, marcando o início da invasão dérmica profunda e o ganho de competência metastática.<\/li><\/ul>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#c9daf8;\">Diferenciação Clínica e Histopatológica<\/h3>\n<div class=\"tbl\"><table><tr><th><\/th><th><\/th><\/tr><tr><td><strong>Parâmetro<\/strong><\/td><td><strong>Carcinoma Basocelular <\/strong> <strong>(CBC)<\/strong><\/td><td><strong>Carcinoma <\/strong> <strong>Espinocelular (CEC)<\/strong><\/td><td><strong>Melanoma Cutâneo<\/strong><\/td><\/tr><tr><td><strong>Origem Celular<\/strong><\/td><td>Células basais da epiderme e anexos<\/td><td>Queratinócitos da camada espinhosa<\/td><td>Melanócitos (crista neural)<\/td><\/tr><tr><td><strong>Padrão <\/strong> <strong>de <\/strong> <strong>Exposição UV<\/strong><\/td><td>Intermitente e intensa / Queimaduras<\/td><td>Cumulativa crônica / Ocupacional<\/td><td>Intermitente intensa / Queimaduras e genética<\/td><\/tr><tr><td><strong>Lesão Precursora<\/strong><\/td><td>Rara (de novo)<\/td><td>Ceratose actínica, doença de Bowen<\/td><td>Nevos displásicos / Melanose de Dubreuilh (de novo em ~70%)<\/td><\/tr><tr><td><strong>Morfologia Típica<\/strong><\/td><td>Pápula/nódulo perláceo com telangiectasias, bordos elevados e ulceração central<\/td><td>Placa ou nódulo hiperceratósico, crostoso, infiltrado, com base endurecida<\/td><td>Mácula ou placa assimétrica, bordos irregulares, policromática (critérios ABCDE)<\/td><\/tr><tr><td><strong>Comportamento <\/strong> <strong>Biológico<\/strong><\/td><td>Destruição tecidual local; metástase excepcional (&lt; 0,1%)<\/td><td>Invasão tecidual; metástase linfonodal moderada (~2% a 5%)<\/td><td>Rápida progressão vertical; alta taxa de metástase linfática e hematogênica<\/td><\/tr><tr><td><strong>Histopatologia <\/strong> <strong>Típica<\/strong><\/td><td>Ninhos de células basaloides com paliçada periférica e retração do estroma<\/td><td>Proliferação atípica de ceratinócitos com pérolas córneas e pontes intercelulares<\/td><td>Ninhos atípicos de melanócitos, atipia citológica, invasão pagetoide e mitoses dérmicas<\/td><\/tr><\/table><\/div>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#c9daf8;\">Repercussões Clínicas e Estratificação Prognóstica<\/h3>\n<p>O manejo clínico depende diretamente da diferenciação precisa entre essas entidades:<\/p>\n<ul>\n<li><strong>No CBC:<\/strong> O foco reside no controle local da lesão para evitar a invasão de estruturas nobres (como cartilagem, osso e fáscia na face). A excisão cirúrgica com margens de segurança adequadas ou a cirurgia micrográfica de Mohs em áreas de alto risco oferecem elevadas taxas de cura.<\/li>\n<li><strong>No CEC:<\/strong> É mandatória a palpação sistemática de linfonodos regionais e a avaliação de fatores de alto risco (diâmetro &gt; 2 cm, invasão perineural, profundidade &gt; 6 mm e imunossupressão), que aumentam significativamente a chance de recidiva e disseminação metastática.<\/li>\n<li><strong>No Melanoma:<\/strong> O prognóstico é guiado estritamente pela histopatologia da biópsia excisional. O principal fator prognóstico em doença localizada é o <strong>Índice de Breslow<\/strong> (espessura tumoral em milímetros), que dita a ampliação das margens cirúrgicas (1 a 2 cm) e a indicação de biópsia do linfonodo sentinela para lesões com espessura ≥ 0,8 mm (ou &lt; 0,8 mm ulceradas).<\/li><\/ul>\n<p>Do ponto de vista de saúde pública e semiologia, a aplicação da regra do <strong>ABCDE<\/strong>  (Assimetria, Bordas irregulares, Cores múltiplas, Diâmetro &gt; 6 mm e Evolução) e o reconhecimento do sinal do \"patinho feio\" na atenção primária são as ferramentas de maior custo-efetividade para o diagnóstico em fases curáveis.<\/p>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#c9daf8;\">Síntese Integradora<\/h3>\n<p>A diferenciação das neoplasias malignas cutâneas apoia-se na correlação entre a linhagem celular de origem, a dinâmica da carcinogênese induzida por UV e o padrão de invasão tecidual. Enquanto o carcinoma basocelular representa uma doença de agressividade essencialmente local e o carcinoma espinocelular expressa um espectro intermediário com potencial metastático atrelado à invasão cumulativa, o melanoma figura como a forma de maior letalidade devido à sua precocidade de disseminação sistêmica. A abordagem precoce na atenção primária — aliada ao exame dermatológico completo e à dermatoscopia — permanece como o pilar determinante para mitigar morbimortalidade e sequelas funcionais.<\/p>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#c9daf8;\">Referências<\/h3>\n<ol>\n<li>1. AZULAY, Rubem David; AZULAY, David Rubem; AZULAY-ABULAFIA, Luna. <strong>Dermatologia<\/strong>. 7. ed. Rio de Janeiro: Guanabara Koogan, 2017. cap. 38 (Tumores Epiteliais Malignos), p. 645-660; cap. 40 (Melanoma Cutâneo), p. 675-690.<\/li>\n<li>2. BRASIL. Ministério da Saúde. Instituto Nacional de Câncer José Alencar Gomes da Silva (INCA). <strong>Estimativa 2023: incidência de câncer no Brasil<\/strong>. Rio de Janeiro: INCA, 2022. Disponível em: <a href=\"https://www.inca.gov.br/\" target=\"_blank\" rel=\"noopener\">https://www.inca.gov.br<\/a>. Acesso em: 17 ago. 2026.<\/li>\n<li>3. BRASIL. Ministério da Saúde. Instituto Nacional de Câncer (INCA). <strong>Diretrizes diagnósticas e terapêuticas do melanoma cutâneo<\/strong>. Rio de Janeiro: INCA, 2020.<\/li>\n<li>4. KUMAR, Vinay; ABBAS, Abul K.; ASTER, Jon C. <strong>Robbins &amp; Cotran - Patologia: Bases Patológicas das Doenças<\/strong>. 10. ed. Rio de Janeiro: Elsevier, 2021. cap. 25 (A Pele), p. 1145-1158.<\/li>\n<li>5. PORTO, Celmo Celeno; PORTO, Arnaldo Lemos. <strong>Semiologia Médica<\/strong>. 8. ed. Rio de Janeiro: Guanabara Koogan, 2019. cap. 15 (Exame da Pele e Anexos), p. 192-205.<\/li>\n<li>6. SWETTER, Susan M. et al. Guidelines of care for the management of primary cutaneous melanoma. <strong>Journal of the American Academy of Dermatology<\/strong>, v. 80, n. 1, p. 208-250, 2019.<\/li><\/ol>\n<h2 class=\"hb\" style=\"--c:#1c4587;--hb:#6d9eeb;\">2- Descreva as principais manifestações clínicas iniciais e avançadas, incluindo sinais e sintomas relacionados aos cânceres de pele. (regra do ABCDE para melanoma)<\/h2>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#c9daf8;\">Introdução Conceitual e Semiogênese Cutânea<\/h3>\n<p>A identificação semiológica das neoplasias malignas cutâneas baseia-se na correlação estrita entre a proliferação celular atípica, a perda da arquitetura tecidual normal e a resposta estromal e vascular subjacente. As manifestações clínicas variam ao longo de um espectro contínuo: iniciam-se como alterações discretas na espessura, pigmentação ou textura da epiderme e evoluem para lesões destrutivas, infiltrativas, exofíticas e ulceradas à medida que a neoplasia ultrapassa as barreiras anatômicas dérmicas e atinge planos profundos ou a circulação sistêmica.<\/p>\n<p>A compreensão do estágio de apresentação — inicial versus avançado — é o principal determinante do planejamento cirúrgico, da estratificação prognóstica e da sobrevida global do paciente.<\/p>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#c9daf8;\">Manifestações Clínicas do Carcinoma Basocelular (CBC)<\/h3>\n<p>O carcinoma basocelular é uma neoplasia de crescimento tipicamente indolente, com agressividade restrita quase que exclusivamente à destruição tecidual contígua.<\/p>\n<h3 class=\"hb\" style=\"--c:#3c78d8;--hb:#c9daf8;\">Manifestações Iniciais:<\/h3>\n<ul>\n<li>\n<ul>\n<li>Apresenta-se comumente como uma pápula ou nódulo de aspecto perláceo ou translúcido, com fina rede de telangiectasias superficiais visíveis à ectoscopia e dermatoscopia.<\/li>\n<li>Na variante superficial, manifesta-se como uma placa eritemato-descamativa bem delimitada, frequentemente confundida com lesões de eczema ou psoríase.<\/li>\n<li>Pode surgir como uma pequena erosão central recorrente que cicatriza de maneira imperfeita e volta a sangrar a traumatismos mínimos (o chamado \"sinal do sangramento ao barbear ou ao enxugar o rosto\").<\/li><\/ul><\/li><\/ul>\n<h3 class=\"hb\" style=\"--c:#3c78d8;--hb:#c9daf8;\">Manifestações Avançadas:<\/h3>\n<ul>\n<li>\n<ul>\n<li><strong>Ulceração Infiltrativa (<\/strong><em><strong>Ulcus Rodens<\/strong><\/em><strong>):<\/strong> Caracteriza-se por uma úlcera com bordos elevados, endurecidos e perláceos, que invade e destrói progressivamente estruturas nobres subjacentes, como cartilagem nasal, pavilhão auricular, fáscias musculares e tábua óssea facial.<\/li>\n<li><strong>Variante Esclerodermiforme / Morfeiforme:<\/strong> Placa endurecida, amarelada ou branco-nacarada, com limites imprecisos e retração tecidual, assemelhando-se a uma cicatriz ou morfeia. Essa apresentação tem caráter infiltrativo agressivo subclínico, estendendo-se muito além das margens visíveis a olho nu.<\/li>\n<li><strong>Sintomas Funcionais:<\/strong> Dor profunda, parestesias por invasão perineural (mais raras, porém de pior prognóstico) e deformidades estéticas e funcionais severas com destruição de orbitas ou vias aéreas.<\/li><\/ul><\/li><\/ul>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#c9daf8;\">Manifestações Clínicas do Carcinoma Espinocelular (CEC)<\/h3>\n<p>O CEC desenvolve-se predominantemente sobre uma pele com dano actínico difuso (elastose solar, telangiectasias e efélides), refletindo o acúmulo de mutações e a proliferação desordenada de queratinócitos diferenciados.<\/p>\n<h3 class=\"hb\" style=\"--c:#1f1f1f;--hb:#c9daf8;\">Manifestações Iniciais:<\/h3>\n<ul>\n<li>\n<ul>\n<li>Surge comumente a partir de uma ceratose actínica que passa por transformação maligna, caracterizada por eritema na base, infiltração palpável à digitopressão e hiperqueratose aderente.<\/li>\n<li>Pápula ou placa eritematosa de superfície áspera, ceratósica ou discretamente verrucosa, que pode descamar e apresentar sangramento quando a crosta é manipulada.<\/li>\n<li>Na doença de Bowen (CEC <em>in situ<\/em>), exibe-se como placa eritemato-escamosa bem demarcada, de crescimento centrífugo lento e contornos policíclicos.<\/li><\/ul><\/li><\/ul>\n<h3 class=\"hb\" style=\"--c:#1f1f1f;--hb:#c9daf8;\">Manifestações Avançadas:<\/h3>\n<ul>\n<li>\n<ul>\n<li><strong>Lesões Vegetantes e Ulcerovegetantes:<\/strong> Massas tumorais exofíticas volumosas, de consistência pétrea, com áreas centrais necróticas, crostas espessas e odor fétido decorrente de sobreinfecção bacteriana secundária.<\/li>\n<li><strong>Ulceração Infiltrante (<\/strong><em><strong>Úlcera de Marjolin<\/strong><\/em><strong>):<\/strong> Desenvolvimento de lesão ulcerada profunda com bordos evertidos e base endurecida sobre cicatrizes crônicas de queimadura, fístulas ou úlceras de estase de longa data, com comportamento biológico de alta agressividade.<\/li>\n<li><strong>Disseminação Linfonodal e Sintomas Locorregionais:<\/strong> Linfoadenomegalia regional palpável, endurecida e indolor (ou coalescente e fixada aos planos profundos), acompanhada de dor somática por invasão de periósteo ou dor neuropática por invasão perineural e compressão de troncos nervosos.<\/li><\/ul><\/li><\/ul>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#c9daf8;\">Manifestações Clínicas do Melanoma Cutâneo e a Regra do ABCDE<\/h3>\n<p>O melanoma cutâneo pode surgir <em>de novo<\/em> em pele sã (cerca de 70% dos casos) ou a partir da transformação maligna de um nevo melanocítico pré-existente (30%). A identificação clínica fundamenta-se no reconhecimento precoce da desordem arquitetural e da proliferação melanocítica assimétrica.<\/p>\n<h3 class=\"hb\" style=\"--c:#3c78d8;--hb:#c9daf8;\">A Regra Semiogênica do ABCDE<\/h3>\n<p>A mnemônica do ABCDE sistematiza as características morfológicas suspeitas durante o exame físico dermatológico:<\/p>\n<ul>\n<li><strong>A (Assimetria):<\/strong> Dividindo-se imaginariamente a lesão em dois eixos (vertical e horizontal), as metades não coincidem em forma, relevo ou padrão de pigmentação.<\/li>\n<li><strong>B (Bordas Irregulares):<\/strong> Margens geográficas, entalhadas, serrilhadas, mal delimitadas ou com projeções digitiformes, refletindo invasão celular assimétrica na periferia.<\/li>\n<li><strong>C (Cores Múltiplas / Variação de Cor):<\/strong> Presença de dois ou mais tons na mesma lesão (preto, marrom-escuro, castanho-claro, azul-ardósia, cinza, vermelho decorrente de inflamação e branco devido a áreas de regressão tumoral imunológica espontânea).<\/li>\n<li><strong>D (Diâmetro Superior a 6 mm):<\/strong> A maioria dos melanomas invasivos mede mais de 6 milímetros no maior diâmetro no momento do diagnóstico (embora variantes iniciais possam ser menores).<\/li>\n<li><strong>E (Evolução / Mudança):<\/strong> O parâmetro clínico isolado de maior sensibilidade. Compreende modificações dinâmicas ao longo de semanas ou meses no tamanho, formato, coloração, espessura (elevação) ou o surgimento de prurido, dor, exsudação ou sangramento espontâneo.<\/li><\/ul>\n<div class=\"tbl\"><table><tr><th><strong>Espectro Clínico do Melanoma <\/strong><\/th><\/tr><tr><td><strong>Inicial / Horizontal <\/strong><\/td><td><strong>Avançado / Vertical <\/strong><\/td><\/tr><tr><td>Mácula plana asimétrica<\/td><td>Nódulo escuro/amelanótico<\/td><\/tr><tr><td>Pigmentação heterogênea<\/td><td>Ulceração e sangramento fácil<\/td><\/tr><tr><td>Critérios ABCDE positivos<\/td><td>Lesões-satélite e metástases<\/td><\/tr><tr><td>Assintomático<\/td><td>Linfadenopatia regional<\/td><\/tr><\/table><\/div>\n<h3 class=\"hb\" style=\"--c:#1f1f1f;--hb:#c9daf8;\">Manifestações Avançadas do Melanoma:<\/h3>\n<ul>\n<li>\n<ul>\n<li><strong>Surgimento de Nódulos e Fase de Crescimento Vertical:<\/strong> Elevação rápida da lesão com perda da superfície plana, denotando invasão celular ativa na derme reticular e hipoderme.<\/li>\n<li><strong>Ulceração e Friabilidade:<\/strong> Sangramento espontâneo, formação de crostas e exsudação contínua. A ulceração histológica e clínica constitui fator prognóstico desfavorável independente no estadiamento TNM/AJCC.<\/li>\n<li><strong>Lesões-Satélite e Metástases em Trânsito:<\/strong> Pequenos nódulos pigmentados ou violáceos localizados a menos de 2 cm da borda da lesão primária (satelitose) ou entre a lesão primária e a cadeia de drenagem linfática regional (metástase em trânsito).<\/li>\n<li><strong>Envolvimento Sistêmico:<\/strong> Linfonodomegalias maciças regionais (axilares, inguinais, cervicais), hepatomegalia dolorosa, tosse e dispneia (metástases pulmonares), déficits focais ou crises convulsivas (metástases no sistema nervoso central) e síndrome consuntiva (caquexia neoplásica).<\/li><\/ul><\/li><\/ul>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#c9daf8;\">Repercussões Clínicas e Implicações na Atenção à Saúde<\/h3>\n<p>O reconhecimento precoce dessas manifestações transforma radicalmente o desfecho clínico do paciente:<\/p>\n<ul>\n<li><strong>Morbidade Cirúrgica e Funcional:<\/strong> A detecção de carcinomas em fases iniciais permite excisões simples sob anestesia local, preservando estruturas estéticas e funcionais da face. Por outro lado, apresentações avançadas exigem reconstruções complexas com retalhos miocutâneos, enxertias, exenteração orbitária ou amputações parciais (auriculares, nasais ou de extremidades).<\/li>\n<li><strong>Curabilidade do Melanoma:<\/strong> O diagnóstico de melanomas <em>in situ<\/em> ou de espessura fina (Breslow &lt; 0,8 mm) atinge taxas de cura cirúrgica superiores a 95% em 5 anos. Em contraste, a detecção tardia em fase de crescimento vertical avançado ou doença metastática requer abordagens oncológicas sistêmicas de alta complexidade (imunoterapia com inibidores de <em>checkpoints<\/em> como anti-PD-1/anti-CTLA-4 e terapia-alvo anti-BRAF/MEK).<\/li>\n<li><strong>Estratégias de Rastreio na Atenção Primária:<\/strong> O método semiológico do \"sinal do patinho feio\" (<em>ugly duckling sign<\/em>) — lesão que se destaca morfologicamente do padrão nevoide habitual do paciente — associado ao ABCDE, representa a abordagem de maior impacto na triagem ambulatorial e redução da mortalidade associada às neoplasias cutâneas.<\/li><\/ul>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#c9daf8;\">Síntese Integradora<\/h3>\n<p>A semiologia do câncer de pele transita de alterações subclínicas ou discretas na barreira cutânea até massas infiltrativas e destrutivas com repercussão sistêmica. No carcinoma basocelular, a perolização e as telangiectasias evoluem para úlceras de invasão local contígua. No carcinoma espinocelular, a hiperqueratose e a infiltração eritematosa culminam em massas vegetantes e invasão locorregional linfonodal. No melanoma, a disrupção precoce da simetria e da homogeneidade cromática (capturada pela regra do ABCDE) alerta para a fase de disseminação horizontal, cuja perda de controle deflagra a fase de crescimento vertical, metastatização e letalidade. O domínio desse espectro clínico pelo médico generalista e especialista é o elo indispensável para a intervenção em janelas terapêuticas curativas.<\/p>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#c9daf8;\">Referências (Padrão ABNT)<\/h3>\n<ol>\n<li>1. AZULAY, Rubem David; AZULAY, David Rubem; AZULAY-ABULAFIA, Luna. <strong>Dermatologia<\/strong>. 7. ed. Rio de Janeiro: Guanabara Koogan, 2017. cap. 38 (Tumores Epiteliais Malignos), p. 645-660; cap. 40 (Melanoma Cutâneo), p. 675-690.<\/li>\n<li>2. BOLOGNIA, Jean L.; SCHAFFER, Julie V.; CERRONI, Lorenzo. <strong>Dermatologia<\/strong>. 4. ed. Rio de Janeiro: Elsevier, 2018. v. 2, cap. 108 (Carcinoma Basocelular e Carcinoma Espinocelular), p. 1872-1900; cap. 113 (Melanoma), p. 1978-2015.<\/li>\n<li>3. BRASIL. Ministério da Saúde. Instituto Nacional de Câncer (INCA). <strong>Diretrizes diagnósticas e terapêuticas do melanoma cutâneo<\/strong>. Rio de Janeiro: INCA, 2020. Disponível em: <a href=\"https://www.gov.br/inca\" target=\"_blank\" rel=\"noopener\">https://www.gov.br/inca<\/a>. Acesso em: 17 ago. 2026.<\/li>\n<li>4. GERSHENWALD, Jeffrey E. et al. Melanoma staging: Evidence-based changes in the American Joint Committee on Cancer eighth edition cancer staging manual. <strong>CA: A Cancer Journal for Clinicians<\/strong>, v. 67, n. 6, p. 472-492, 2017.<\/li>\n<li>5. PORTO, Celmo Celeno; PORTO, Arnaldo Lemos. <strong>Semiologia Médica<\/strong>. 8. ed. Rio de Janeiro: Guanabara Koogan, 2019. cap. 15 (Exame da Pele e Anexos), p. 192-205.<\/li>\n<li>6. SWETTER, Susan M. et al. Guidelines of care for the management of primary cutaneous melanoma. <strong>Journal of the American Academy of Dermatology<\/strong>, v. 80, n. 1, p. 208-250, 2019.<\/li><\/ol>\n<h2 class=\"hb\" style=\"--c:#1c4587;--hb:#6d9eeb;\">3- Elenque os métodos diagnósticos ofertados pelo SUS utilizados para examinar e diagnosticar as lesões de câncer de pele. (exame clínico, dermatoscopia, biópsias e exames complementares de estadiamento)<\/h2>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#c9daf8;\">Introdução Conceitual e a Linha de Cuidado no SUS<\/h3>\n<p>O diagnóstico das neoplasias malignas cutâneas no âmbito do Sistema Único de Saúde (SUS) estrutura-se sob os princípios da integralidade, descentralização e hierarquização do cuidado. A jornada diagnóstica organiza-se de forma escalonada: inicia-se na Atenção Primária à Saúde (APS) com a identificação e triagem de lesões suspeitas, transita pela Atenção Especializada (Ambulatórios de Dermatologia e Cirurgia Geral) para investigação invasiva e definição tecidual, e culmina nos Centros de Assistência de Alta Complexidade em Oncologia (CACON) e Unidades de Assistência de Alta Complexidade em Oncologia (UNACON) para estadiamento avançado e tratamento multidisciplinar.<\/p>\n<p>O arsenal diagnóstico disponibilizado pelo SUS abrange desde a propedêutica clínica e recursos ópticos não invasivos até o padrão-ouro anatomopatológico e técnicas de imagem seletivas para avaliação sistêmica.<\/p>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#c9daf8;\">Exame Clínico Dermatológico e Triagem na Atenção Primária<\/h3>\n<p>O exame clínico minucioso constitui a base diagnóstica mais acessível e custo-efetiva na rede pública. Na APS, a abordagem deve contemplar:<\/p>\n<ul>\n<li><strong>Inspeção Cutânea Total:<\/strong> Exame de todo o tegumento sob iluminação adequada (luz natural ou branca artificial), incluindo couro cabeludo, mucosas, regiões retroauriculares, palmas, plantas, espaços interdigitais e área genital.<\/li>\n<li><strong>Aplicação de Critérios Morfológicos:<\/strong> Utilização sistemática da mnemônica do ABCDE (Assimetria, Bordas irregulares, Cores múltiplas, Diâmetro &gt; 6 mm e Evolução) para lesões pigmentadas e identificação do \"sinal do patinho feio\" (<em>ugly duckling sign<\/em>).<\/li>\n<li><strong>Palpação e Exame de Anexos:<\/strong> Avaliação da consistência (infiltração ou aspecto perláceo), fixação aos planos profundos e delimitação de bordos de lesões não melanocíticas.<\/li>\n<li><strong>Palpação Sistemática de Cadeias Linfonodais Regionais:<\/strong> Avaliação obrigatória das bacias cervicais, axilares e inguino-femorais correspondentes à drenagem anatômica da lesão suspeita para rastrear adenomegalias de consistência pétrea ou fixas, sugestivas de disseminação locorregional.<\/li><\/ul>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#c9daf8;\">Dermatoscopia (Microscopia de Superfície)<\/h3>\n<p>A dermatoscopia é um exame não invasivo <em>in vivo<\/em> que atua como ponte propedêutica entre o exame clínico a olho nu e o estudo histopatológico, sendo disponibilizada na atenção secundária especializada do SUS e por projetos de teledermatologia.<\/p>\n<p>O método baseia-se na transiluminação e magnificação óptica (10x a 20x) com uso de luz polarizada ou interface líquida (imersão), permitindo a visualização de estruturas e arranjos pigmentares até a derme reticular superficial:<\/p>\n<ul>\n<li><strong>Nos Carcinomas Basocelulares (CBC):<\/strong> Identificação de critérios diagnósticos como vasos em raiz de árvore (telangiectasias arboriformes), ninhos ovoides azul-acinzentados, glóbulos múltiplos, estruturas em folha de bordo (<em>leaf-like areas<\/em>) e ulcerações focais.<\/li>\n<li><strong>Nos Carcinomas Espinocelulares (CEC):<\/strong> Detecção de círculos brancos, tampões de ceratina, vasos em grampo ou glomerulares com halo branco perivascular e áreas de descamação central.<\/li>\n<li><strong>No Melanoma:<\/strong> Análise baseada em algoritmos (regra dos 2 passos, método de Menzies, algoritmo de cores e estruturas). São critérios cardinais a presença de rede pigmentar atípica (linhas espessas e malhas irregulares), estrias radiadas, pseudópodes periféricos, véu azul-esbranquiçado, estruturas de regressão (grânulos em \"pimenta\") e padrão vascular polimórfico atípico.<\/li><\/ul>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#c9daf8;\">Biópsias Cutâneas e Confirmação Anatomopatológica<\/h3>\n<p>A biópsia tecidual com análise anatomopatológica representa o <strong>padrão-ouro indispensável<\/strong> para o diagnóstico definitivo, subclassificação histológica e definição dos fatores prognósticos. No SUS, a Lei Federal nº 13.896/2019 estabelece a garantia de realização do exame anatomopatológico em até 30 dias para casos suspeitos de neoplasia maligna.<\/p>\n<p>A escolha da técnica cirúrgica deve obedecer estritamente à principal hipótese diagnóstica:<\/p>\n<ul>\n<li><strong>Biópsia Excisional (Margens Estreitas de 1 a 3 mm):<\/strong> Técnica prioritária e mandatória diante de lesões pigmentadas suspeitas de <strong>melanoma<\/strong>. Deve abranger toda a lesão com tecido celular subcutâneo subjacente, permitindo ao patologista avaliar a integridade da arquitetura tumoral, mensurar com precisão a espessura vertical do tumor (Índice de Breslow), verificar a presença de ulceração histológica, contagem mitótica e calcular os Níveis de Clark.<\/li>\n<li><strong>Biópsia Incisional:<\/strong> Reservada para lesões extensas, localizadas em áreas nobres da face ou de difícil fechamento primário, onde a ressecção completa inicial acarretaria deformidade estética ou funcional substancial antes da confirmação diagnóstica.<\/li>\n<li><strong>Biópsia por <\/strong><em><strong>Punch<\/strong><\/em><strong> (Punção Cilindrica):<\/strong> Utilizada frequentemente em carcinomas (CBC e CEC), obtendo um cilindro de tecido de espessura total (epiderme, derme e hipoderme). Se aplicada a suspeitas de melanoma, deve capturar a área mais espessa ou nodular da lesão.<\/li>\n<li><strong>Biópsia por <\/strong><em><strong>Shaving<\/strong><\/em><strong> (Tangencial Profunda):<\/strong> Indicada pontualmente para lesões exofíticas e ceratósicas suspeitas de CEC ou pápulas perláceas de CBC. É formalmente contraindicada em lesões melanocíticas suspeitas por seccionar a base da neoplasia e comprometer a medida correta do Índice de Breslow.<\/li>\n<li><strong>Laudo Anatomopatológico e Imuno-histoquímica:<\/strong> O laudo deve obrigatoriamente fornecer tipo histológico, padrão de crescimento, margens cirúrgicas e estadiamento microestutural. Em casos indiferenciados ou melanomas amelanóticos, a rede do SUS disponibiliza painéis de imuno-histoquímica (proteína S-100, SOX10, Melan-A/MART-1, HMB-45 e citoqueratinas).<\/li><\/ul>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#c9daf8;\">Métodos Complementares de Estadiamento e Avaliação Sistêmica<\/h3>\n<p>De acordo com as <em>Diretrizes Diagnósticas e Terapêuticas do Melanoma Cutâneo<\/em> do Ministério da Saúde/CONITEC e os protocolos de CPNM de alto risco, os exames complementares de imagem e laboratoriais são indicados de maneira criteriosa, evitando solicitações fúteis em lesões iniciais:<\/p>\n<ul>\n<li><strong>Tumores Não Melanoma (CBC e CEC):<\/strong> A imensa maioria dos casos de CBC e CEC restringe-se ao estadiamento clínico e cirúrgico local. Tomografia Computadorizada (TC) ou Ressonância Magnética (RM) são indicadas apenas em tumores localmente avançados para avaliar erosão óssea, invasão orbitária, extensão à base do crânio ou invasão perineural profunda.<\/li>\n<li><strong>Melanomas de Baixo Risco (Estádios I e IIA - Breslow &lt; 0,8 mm sem ulceração):<\/strong> Não há indicação rotineira de exames de imagem ou laboratoriais sistêmicos na ausência de queixas clínicas ou alterações ao exame físico, visto o baixíssimo rendimento diagnóstico.<\/li>\n<li><strong>Biópsia do Linfonodo Sentinela (BLS):<\/strong> Procedimento cirúrgico de estadiamento micrometastático linfonodal ofertado nos centros de referência (CACON/UNACON) para pacientes com melanoma clinicamente sem adenopatia (cN0), mas com fatores de risco histológico: Breslow ≥ 0,8 mm ou &lt; 0,8 mm com ulceração presente. Utiliza mapeamento linfático pré-operatório por linfocintilografia associado a injeção perilesional intraoperatória de azul patente ou sonda gama (<em>gamma probe<\/em>).<\/li>\n<li><strong>Melanomas de Alto Risco / Avançados (Estádios IIB, IIC, III e IV): <\/strong>\n<ul>\n<li><strong>Ultrassonografia (USG) de Bacias Linfonodais:<\/strong> Avaliação detalhada de linfonodos suspeitos com possibilidade de punção aspirativa por agulha fina (PAAF) guiada por imagem.<\/li>\n<li><strong>Tomografia Computadorizada (Tórax, Abdome e Pelve):<\/strong> Protocolada para rastreio de metástases parenquimatosas em órgãos-alvo (pulmão, fígado e retroperitônio).<\/li>\n<li><strong>Ressonância Magnética de Encéfalo:<\/strong> Indicada preferencialmente nos estádios IIIB, IIIC e IV para detecção de acometimento secundário do sistema nervoso central, inclusive subclínico.<\/li>\n<li><strong>PET-CT (<\/strong><em><strong>Positron Emission Tomography<\/strong><\/em><strong>):<\/strong> Incorporado no SUS para situações oncológicas específicas de melanoma estágio III irressecável ou estágio IV, auxiliando no planejamento terapêutico sistêmico e cirúrgico de metástases ressecáveis.<\/li>\n<li><strong>Desidrogenase Lática (DHL) Sérica:<\/strong> Marcador sérico tumoral utilizado formalmente no estadiamento M do melanoma pela classificação AJCC/UICC.<\/li><\/ul><\/li><\/ul>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#c9daf8;\">Síntese Integradora<\/h3>\n<p>O fluxo diagnóstico do câncer de pele no SUS opera em um <em>continuum<\/em> que vai da triagem visual à biologia molecular tecidual. Na atenção primária, o exame clínico criterioso e a aplicação das regras semiológicas (ABCDE) filtram os casos de risco. Na atenção secundária, a dermatoscopia refina a indicação da biópsia, cujo planejamento técnico (predominantemente excisional com margem mínima no melanoma) garante a integridade da amostra para o cálculo do Índice de Breslow. Por fim, a atenção terciária aplica os métodos de imagem e a biópsia de linfonodo sentinela restritos aos tumores de maior agressividade biológica, otimizando os recursos públicos e viabilizando o tratamento oncológico em tempo hábil.<\/p>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#c9daf8;\">Referências (Padrão ABNT)<\/h3>\n<ol>\n<li>1. AZULAY, Rubem David; AZULAY, David Rubem; AZULAY-ABULAFIA, Luna. <strong>Dermatologia<\/strong>. 7. ed. Rio de Janeiro: Guanabara Koogan, 2017. cap. 38 (Tumores Epiteliais Malignos), p. 645-660; cap. 40 (Melanoma Cutâneo), p. 675-690.<\/li>\n<li>2. BOLOGNIA, Jean L.; SCHAFFER, Julie V.; CERRONI, Lorenzo. <strong>Dermatologia<\/strong>. 4. ed. Rio de Janeiro: Elsevier, 2018. v. 2, cap. 108 (Carcinoma Basocelular e Carcinoma Espinocelular), p. 1872-1900; cap. 113 (Melanoma), p. 1978-2015.<\/li>\n<li>3. BRASIL. Ministério da Saúde. Secretaria de Atenção Especializada à Saúde; Secretaria de Ciência, Tecnologia, Inovação e Insumos Estratégicos em Saúde. <strong>Portaria Conjunta nº 19, de 25 de outubro de 2022<\/strong>. Aprova as Diretrizes Diagnósticas e Terapêuticas do Melanoma Cutâneo. Brasília: Ministério da Saúde, 2022. Disponível em: <a href=\"https://www.gov.br/conitec/pt-br/midias/relatorios/2022/20221116_ddt-melanoma_cutaneo.pdf\" target=\"_blank\" rel=\"noopener\">https://www.gov.br/conitec/pt-br/midias/relatorios/2022/20221116_ddt-melanoma_cut<\/a> <a href=\"https://www.gov.br/conitec/pt-br/midias/relatorios/2022/20221116_ddt-melanoma_cutaneo.pdf\" target=\"_blank\" rel=\"noopener\">aneo.pdf<\/a>. Acesso em: 17 ago. 2026.<\/li>\n<li>4. BRASIL. Presidência da República. <strong>Lei nº 13.896, de 30 de outubro de 2019<\/strong>. Altera a Lei nº 12.732, de 22 de novembro de 2012, para que os exames relacionados ao diagnóstico de neoplasia maligna sejam realizados no prazo de 30 dias. Diário Oficial da União: seção 1, Brasília, DF, p. 1, 31 out. 2019.<\/li>\n<li>5. GERSHENWALD, Jeffrey E. et al. Melanoma staging: Evidence-based changes in the American Joint Committee on Cancer eighth edition cancer staging manual. <strong>CA: A Cancer Journal for Clinicians<\/strong>, v. 67, n. 6, p. 472-492, 2017.<\/li>\n<li>6. PORTO, Celmo Celeno; PORTO, Arnaldo Lemos. <strong>Semiologia Médica<\/strong>. 8. ed. Rio de Janeiro: Guanabara Koogan, 2019. cap. 15 (Exame da Pele e Anexos), p. 192-205.<\/li>\n<li>7. SWETTER, Susan M. et al. Guidelines of care for the management of primary cutaneous melanoma. <strong>Journal of the American Academy of Dermatology<\/strong>, v. 80, n. 1, p. 208-250, 2019.<\/li><\/ol>\n<h2 class=\"hb\" style=\"--c:#1c4587;--hb:#6d9eeb;\">4- Discuta as estratégias terapêuticas existentes no tratamento do câncer de pele no SUS. (cirurgia, imunoterapia e terapia alvo)<\/h2>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#c9daf8;\">Introdução Conceitual e Panorama Terapêutico no SUS<\/h3>\n<p>A abordagem terapêutica das neoplasias malignas cutâneas no Sistema Único de Saúde (SUS) reflete a heterogeneidade biológica existente entre os carcinomas não melanoma e o melanoma cutâneo. O objetivo do tratamento varia desde o controle locorregional definitivo com preservação funcional e estética — típico dos carcinomas basocelular (CBC) e espinocelular (CEC) — até intervenções sistêmicas complexas destinadas a prolongar a sobrevida global e controlar a disseminação metastática no melanoma avançado.<\/p>\n<p>Nos últimos anos, a incorporação de biotecnologias e fármacos imunobiológicos transformou substancialmente a linha de cuidado oncológica no SUS. A cirurgia oncológica permanece como a modalidade curativa primária e indispensável para lesões ressecáveis. Paralelamente, os avanços na compreensão da imunologia tumoral e dos <em>drivers<\/em>  moleculares de proliferação viabilizaram a consolidação da imunoterapia e da terapia-alvo, redefinindo o prognóstico de pacientes com doença irressecável ou metastática no âmbito das Unidades e Centros de Assistência de Alta Complexidade em Oncologia (UNACON/CACON).<\/p>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#c9daf8;\">Cirurgia Oncológica: O Pilar Central de Controle Locorregional<\/h3>\n<p>O tratamento cirúrgico fundamenta-se na exérese completa da neoplasia com margens tridimensionais livres de células tumorais, minimizando as taxas de recidiva local. A técnica e as dimensões da ressecção dependem estritamente do tipo histológico, da localização anatômica e da estratificação de risco anatomopatológico.<\/p>\n<h3 class=\"hb\" style=\"--c:#3c78d8;--hb:#c9daf8;\">Ampliação de Margens no Melanoma Cutâneo<\/h3>\n<p>Após o diagnóstico histológico obtido por biópsia excisional com margem mínima, o tratamento cirúrgico definitivo do melanoma exige a ampliação tridimensional de margens periféricas e profundas (atingindo o tecido subcutâneo até a fáscia muscular subjacente, sem necessidade de ressecá-la por rotina). A extensão da margem é orientada pela profundidade de invasão tumoral (Índice de Breslow):<\/p>\n<ul>\n<li><strong>Melanoma <\/strong><em><strong>in situ<\/strong><\/em><strong>:<\/strong> Margem de 0,5 cm a 1,0 cm.<\/li>\n<li><strong>Breslow ≤ 1,0 mm:<\/strong> Margem de segurança de 1,0 cm.<\/li>\n<li><strong>Breslow de 1,01 mm a 2,0 mm:<\/strong> Margem de segurança de 1,0 cm a 2,0 cm.<\/li>\n<li><strong>Breslow &gt; 2,0 mm:<\/strong> Margem de segurança de 2,0 cm.<\/li><\/ul>\n<p>A avaliação da cadeia de drenagem linfática é parte integrante do estadiamento e do planejamento cirúrgico. A biópsia do linfonodo sentinela (BLS) é protocolada no SUS para pacientes clinicamente cN0 com Breslow ≥ 0,8 mm (ou &lt; 0,8 mm com ulceração histológica presente). A linfadenectomia terapêutica radical fica reservada para casos com acometimento linfonodal macroscópico clinicamente evidente ou comprovado por biópsia aspirativa pré-operatória.<\/p>\n<h3 class=\"hb\" style=\"--c:#3c78d8;--hb:#c9daf8;\">Manejo Cirúrgico dos Carcinomas Não Melanoma (CBC e CEC)<\/h3>\n<p>Nos tumores não melanoma, a excisão convencional com margens cirúrgicas predefinidas é o padrão resolutivo na grande maioria dos centros de atenção secundária e terciária do SUS:<\/p>\n<ul>\n<li><strong>Carcinoma Basocelular:<\/strong> Lesões primárias de baixo risco e menores de 2 cm demandam margens de 3 a 4 mm. Em tumores de alto risco (variantes esclerodermiforme/infiltrativa, margens clínicas mal delimitadas ou localizados na \"zona H\" da face), preconizam-se margens de 5 a 6 mm ou técnicas cirúrgicas especializadas de controle microscópico de margens quando disponíveis.<\/li>\n<li><strong>Carcinoma Espinocelular:<\/strong> Lesões de baixo risco requerem margens mínimas de 4 a 5 mm. Para lesões de alto risco (diâmetro &gt; 2 cm, espessura &gt; 6 mm, invasão perineural ou recidivadas), as margens devem atingir pelo menos 6 a 10 mm, associadas ao estadiamento e à abordagem cirúrgica das cadeias linfonodais regionais em caso de suspeita clínica ou radiológica de metástase.<\/li><\/ul>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#c9daf8;\">Imunoterapia: Reativação da Resposta Imune Antitumoral<\/h3>\n<p>A imunoterapia moderna revolucionou o tratamento do melanoma cutâneo avançado ao explorar o conceito de inibição de pontos de checagem imunológica (<em>immune checkpoint inhibitors<\/em>). Células tumorais utilizam vias inibitórias fisiológicas para evadir do reconhecimento e da citotoxicidade exercida pelos linfócitos T CD8+.<\/p>\n<h3 class=\"hb\" style=\"--c:#3c78d8;--hb:#c9daf8;\">Mecanismo dos Inibidores de Checkpoint:<\/h3>\n<ul>\n<li>Via Fisiológica de Evasão Tumoral:\n<ul>\n<li>Célula Tumoral (PD-L1) ----[ Inibição ]----&gt; Receptor PD-1 (Linfócito T)<\/li>\n<li>Resultado: Anergia e exaustão imune do Linfócito T -&gt; Proliferação Tumoral<\/li><\/ul><\/li>\n<li>Ação Terapêutica dos Anticorpos Monoclonais (Anti-PD-1 / Anti-CTLA-4):\n<ul>\n<li>Nivolumabe / Pembrolizumabe ----[ Bloqueio ]----&gt; Bloqueia ligação PD-1/PD-L1<\/li>\n<li>Resultado: Reativação citotóxica do Linfócito T CD8+ -&gt; Morte da Célula<\/li><\/ul><\/li><\/ul>\n<h3 class=\"hb\" style=\"--c:#3c78d8;--hb:#c9daf8;\">Aplicação Clínica e Incorporações no SUS<\/h3>\n<p>No âmbito do Ministério da Saúde e da Comissão Nacional de Incorporação de Tecnologias no Sistema Único de Saúde (CONITEC), as principais modalidades imunoterápicas compreendem:<\/p>\n<ul>\n<li><strong>Inibidores de PD-1 (Nivolumabe e Pembrolizumabe):<\/strong> Indicados para melanoma cutâneo irressecável ou metastático (Estádios III irressecável e IV) em primeira linha sistêmica, independentemente do status mutacional de <em>BRAF<\/em>. Esses fármacos ligam-se ao receptor PD-1 nos linfócitos T, impedindo sua interação com os ligantes PD-L1 e PD-L2 expressos pelo tumor ou pelo microambiente tumoral, restabelecendo a capacidade citolítica celular.<\/li>\n<li><strong>Inibidores de CTLA-4 (Ipilimumabe):<\/strong> Atuam na fase inicial de ativação linfonodal do linfócito T (<em>priming<\/em>), bloqueando a molécula inibitória CTLA-4 e favorecendo a expansão clonal de células T antígeno-específicas. Pode ser utilizado em estratégias combinadas ou em linhas subsequentes de tratamento.<\/li>\n<li><strong>Terapia Adjuvante:<\/strong> A utilização de inibidores de PD-1 em adjuvância cirúrgica para pacientes com melanoma estádio III ressecado com alto risco de recidiva visa erradicar micrometástases residuais, prolongando de forma consistente a sobrevida livre de recidiva.<\/li><\/ul>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#c9daf8;\">Terapia-Alvo: Inibição de Vias Oncogenéticas Específicas<\/h3>\n<p>A terapia-alvo atua especificamente sobre alterações moleculares que sustentam a proliferação, sobrevivência e angiogênese tumoral. Diferencia-se da quimioterapia citotóxica clássica por sua alta especificidade e por sua dependência de testes moleculares prévios que comprovem a presença da alteração genética no tecido tumoral.<\/p>\n<h3 class=\"hb\" style=\"--c:#3c78d8;--hb:#c9daf8;\">A Via das Mitogen-Activated Protein Kinases (MAPK) e a Mutação <em>BRAF <\/em><\/h3>\n<p>Aproximadamente 40% a 50% dos melanomas cutâneos abrigam mutações ativadoras no oncogene <em>BRAF<\/em>, predominantemente a substituição <em>V600E<\/em> (e, em menor frequência, <em>V600K<\/em>). Essa mutação acarreta a ativação constitutiva da via MAPK/ERK, promovendo transcrição de genes pró-mitóticos e bloqueio da apoptose celular:<\/p>\n<ul>\n<li>RAS -&gt; <strong>BRAFmutado<\/strong> -&gt; MEK -&gt; ERK -&gt; Proliferação Celular Descontrolada<\/li><\/ul>\n<h3 class=\"hb\" style=\"--c:#3c78d8;--hb:#c9daf8;\">Protocolos Farmacológicos Disponibilizados no SUS<\/h3>\n<p>Para pacientes portadores de melanoma avançado ou metastático com mutação de <em>BRAF V600<\/em> documentada por exame de patologia molecular, o SUS contempla o uso de inibidores de tirosina quinase por via oral em terapia combinada:<\/p>\n<ul>\n<li><strong>Bloqueio Duplo da Via MAPK (Inibidor de BRAF + Inibidor de MEK): <\/strong>\n<ul>\n<li>Exemplos de esquemas: <strong>Dabrafenibe associado a Trametinibe<\/strong> ou <strong>Vemurafenibe associado a Cobimetinibe<\/strong>.<\/li>\n<li>A inibição isolada de <em>BRAF<\/em> induzia respostas rápidas, porém frequentemente transitórias devido ao desenvolvimento precoce de mecanismos de resistência molecular (reativação paradoxal da via através de <em>MEK<\/em>). A combinação de um inibidor de BRAF a um inibidor de MEK bloqueia dois nós críticos consecutivos da cascata, prevenindo vias alternativas de escape, aumentando a taxa de resposta objetiva para índices superiores a 60-70% e reduzindo a toxicidade cutânea hiperqueratósica.<\/li>\n<li>O perfil de resposta é marcado por regressão tumoral volumétrica rápida, tornando a combinação valiosa em pacientes com alta carga tumoral, crise visceral iminente ou sintomas constitucionais graves.<\/li><\/ul><\/li><\/ul>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#c9daf8;\">Repercussões Clínicas, Manejo de Toxicidades e Equidade em Saúde Pública<\/h3>\n<p>A implementação dessas terapias no sistema público de saúde impõe desafios de gestão clínica, farmacovigilância e infraestrutura:<\/p>\n<ul>\n<li><strong>Manejo de Eventos Adversos Imunomediados:<\/strong> A imunoterapia pode desencadear reações autoimunes decorrentes da perda de tolerância periférica (hipofisite, tireoidite, colite inflamatória, hepatite e pneumonite autoimune). O diagnóstico precoce e a instituição de corticoterapia em doses imunossupressoras são determinantes para a segurança do paciente.<\/li>\n<li><strong>Toxicidade da Terapia-Alvo:<\/strong> O bloqueio duplo de BRAF/MEK apresenta efeitos adversos característicos, destacando-se febre/pirexia recorrente (comum com dabrafenibe/trametinibe), fadiga, hipertensão, erupções acneiformes e distúrbios da fração de ejeção ventricular esquerda, demandando monitoramento clínico e ecocardiográfico periódico.<\/li>\n<li><strong>Impacto no Sistema Único de Saúde:<\/strong> A incorporação desses medicamentos no Componente Especializado da Assistência Farmacêutica e por meio de repasses aos centros credenciados (APAC de oncologia) representou uma transição fundamental de uma era de quimioterapia ineficaz (ex.: dacarbazina) para um patamar de sobrevida prolongada e controle sustentado de doença em pacientes com câncer cutâneo avançado no Brasil.<\/li><\/ul>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#c9daf8;\">Síntese Integradora<\/h3>\n<p>A terapêutica contemporânea do câncer de pele no SUS organiza-se em um modelo multidisciplinar e estratificado pelo risco oncológico. A intervenção cirúrgica clássica sustenta o controle curativo do carcinoma basocelular, do carcinoma espinocelular e dos melanomas restritos à pele e aos linfonodos regionais, operando com critérios anatômicos rigorosos de margem tridimensional. Quando a doença atinge estágios locorregionalmente avançados ou metastáticos, o manejo migra para a oncologia clínica de alta precisão.<\/p>\n<p>A imunoterapia com inibidores de <em>checkpoints<\/em> (anti-PD-1 e anti-CTLA-4) e a terapia-alvo anti-BRAF/MEK consolidam-se como pilares sistêmicos integrados no SUS: a primeira restabelece a vigilância imunológica citotóxica endógena com durabilidade de resposta em longo prazo, enquanto a segunda intercepta vias de transdução de sinal intracelular hiperativas, proporcionando rápido alívio sintomático e regressão da massa neoplásica. O domínio desses mecanismos pela equipe assistencial é o núcleo que conecta a biologia molecular à melhoria da sobrevida e qualidade de vida na rede pública de saúde.<\/p>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#c9daf8;\">Referências (Padrão ABNT)<\/h3>\n<ol>\n<li>1. AZULAY, Rubem David; AZULAY, David Rubem; AZULAY-ABULAFIA, Luna. <strong>Dermatologia<\/strong>. 7. ed. Rio de Janeiro: Guanabara Koogan, 2017. cap. 38 (Tumores Epiteliais Malignos), p. 645-660; cap. 40 (Melanoma Cutâneo), p. 675-690.<\/li>\n<li>2. BOLOGNIA, Jean L.; SCHAFFER, Julie V.; CERRONI, Lorenzo. <strong>Dermatologia<\/strong>. 4. ed. Rio de Janeiro: Elsevier, 2018. v. 2, cap. 108 (Carcinoma Basocelular e Carcinoma Espinocelular), p. 1872-1900; cap. 113 (Melanoma), p. 1978-2015.<\/li>\n<li>3. BRASIL. Ministério da Saúde. Secretaria de Ciência, Tecnologia, Inovação e Complexo da Saúde. <strong>Relatório de Recomendação nº 574 - Dabrafenibe em combinação com trametinibe para o tratamento adjuvante de pacientes com melanoma com mutação BRAF V600<\/strong>. Brasília: CONITEC, 2020. Disponível em: <a href=\"https://www.gov.br/conitec\" target=\"_blank\" rel=\"noopener\">https://www.gov.br/conitec<\/a>. Acesso em: 17 ago. 2026.<\/li>\n<li>4. BRASIL. Ministério da Saúde. Secretaria de Atenção Especializada à Saúde; Secretaria de Ciência, Tecnologia, Inovação e Insumos Estratégicos em Saúde. <strong>Portaria Conjunta nº 19, de 25 de outubro de 2022<\/strong>. Aprova as Diretrizes Diagnósticas e Terapêuticas do Melanoma Cutâneo. Brasília: Ministério da Saúde, 2022. Disponível em: <a href=\"https://www.gov.br/conitec/pt-br/midias/relatorios/2022/20221116_ddt-melanoma_cutaneo.pdf\" target=\"_blank\" rel=\"noopener\">https://www.gov.br/conitec/pt-br/midias/relatorios/2022/20221116_ddt-melanoma_cut<\/a> <a href=\"https://www.gov.br/conitec/pt-br/midias/relatorios/2022/20221116_ddt-melanoma_cutaneo.pdf\" target=\"_blank\" rel=\"noopener\">aneo.pdf<\/a>. Acesso em: 17 ago. 2026.<\/li>\n<li>5. DEVITA, Vincent T.; LAWRENCE, Theodore S.; ROSENBERG, Steven A. <strong>DeVita, Hellman, and Rosenberg's Cancer: Principles &amp; Practice of Oncology<\/strong>. 11. ed. Philadelphia: Wolters Kluwer, 2019. cap. 104 (Melanoma), p. 1845-1888; cap. 105 (Nonmelanoma Skin Cancers), p. 1889-1910.<\/li>\n<li>6. ROBERT, Caroline et al. Five-Year Outcomes with Dabrafenib plus Trametinib in Metastatic Melanoma. <strong>The New England Journal of Medicine<\/strong>, v. 381, n. 7, p. 626-636, 2019.<\/li>\n<li>7. SCHADENDORF, Dirk et al. Melanoma. <strong>The Lancet<\/strong>, v. 392, n. 10151, p. 971-984, 2018.<\/li>\n<li>8. SWETTER, Susan M. et al. Guidelines of care for the management of primary cutaneous melanoma. <strong>Journal of the American Academy of Dermatology<\/strong>, v. 80, n. 1, p. 208-250, 2019.<\/li><\/ol>\n<h2 class=\"hb\" style=\"--c:#1c4587;--hb:#6d9eeb;\">5- Descreva os fatores de risco associados ao surgimento de câncer de pele. (exposição solar, predisposição genética, fototipo e imunossupressão)<\/h2>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#c9daf8;\">Introdução Conceitual e Multifatorialidade da Carcinogênese Cutânea<\/h3>\n<p>O desenvolvimento das neoplasias malignas cutâneas decorre de uma complexa e dinâmica interação entre fatores exógenos (ambientais) e endógenos (genéticos, fenotípicos e imunológicos). A homeostase do tegumento é mantida por um equilíbrio rigoroso entre mecanismos de proliferação celular, diferenciação queratinocítica, reparo de DNA e imunovigilância tecidual. Quando esse equilíbrio é rompido pelo acúmulo de mutações oncogênicas e falência dos sistemas de contenção, deflagra-se o processo de carcinogênese cutânea.<\/p>\n<p>A compreensão integrada dos quatro principais pilares etiopatogênicos — radiação solar, fototipo, predisposição genética e imunossupressão — é indispensável para identificar perfis populacionais de risco, orientar intervenções preventivas primárias e estratificar o rastreio na prática clínica.<\/p>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#c9daf8;\">Exposição à Radiação Ultravioleta (RUV): Mecanismos Fisiopatológicos<\/h3>\n<p>A radiação ultravioleta é o carcinógeno ambiental mais relevante e prevalente na oncogênese cutânea. O espectro carcinogênico divide-se principalmente em duas faixas com mecanismos biológicos distintos:<\/p>\n<figure><img loading=\"lazy\" src=\"img/c238ea03bdac6f2e.webp\" style=\"max-width:677px\" loading=\"lazy\" alt=\"\"><\/figure>\n<ul>\n<li><strong>Radiação UVB (290 a 320 nm):<\/strong> Possui alta energia e atinge a epiderme e a derme superficial. É diretamente absorvida pelos ácidos nucleicos, promovendo a quebra de ligações e a formação de dímeros de pirimidina em ciclobutano (CPDs) e fotoprodutos 6-4 pirimidina-pirimidona. A assinatura mutagênica típica do UVB consiste em transições de citosina para timina (C-&gt;T ou CC-&gt;TT), as quais inativam genes supressores de tumor essenciais, sobretudo o <em>TP53<\/em>.<\/li><\/ul>\n<figure><img loading=\"lazy\" src=\"img/4614eeadb62bb664.webp\" style=\"max-width:619px\" loading=\"lazy\" alt=\"\"><\/figure>\n<ul>\n<li><strong>Radiação UVA (320 a 400 nm):<\/strong> Apresenta maior comprimento de onda e penetração dérmica profunda. A carcinogênese induzida por UVA ocorre predominantemente por via indireta, através da excitação de cromóforos endógenos e geração maciça de espécies reativas de oxigênio (EROs), gerando a lesão oxidativa 8-hidroxi-2'-desoxiguanosina (8-OHdG), que acarreta mutações transversas (G-&gt;T) e danifica membranas lipídicas e proteínas estruturais.<\/li><\/ul>\n<p>O padrão temporal e a intensidade da exposição solar determinam o fenótipo neoplásico resultante:<\/p>\n<ul>\n<li><strong>Padrão Intermitente e Intenso:<\/strong> Caracterizado por episódios agudos de alta radiação que culminam em queimaduras solares com formação de bolhas (<em>sunburns<\/em>), sobretudo na infância e adolescência. Este padrão está fortemente correlacionado com a gênese do <strong>Melanoma Cutâneo<\/strong> e do <strong>Carcinoma Basocelular (CBC)<\/strong> em áreas corporais cobertas e expostas esporadicamente (tronco e dorso).<\/li>\n<li><strong>Padrão Cumulativo Crônico:<\/strong> Decorre da exposição continuada e ocupacional ao longo de décadas (trabalhadores rurais, pescadores e operários da construção civil). Promove dano actínico difuso (elastose solar, poiquilodermia) e relaciona-se diretamente com o surgimento do <strong>Carcinoma Espinocelular (CEC)<\/strong> e suas lesões precursoras (ceratoses actínicas) em áreas fotoexpostas crônicas (face, couro cabeludo calvo, dorso das mãos e antebraços).<\/li><\/ul>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#c9daf8;\">Fototipo Cutâneo e a Biologia da Melanina<\/h3>\n<p>A classificação de Fitzpatrick divide a pele humana em seis fototipos (I a VI) com base na reatividade à exposição solar (tendência a queimar versus capacidade de bronzear). A susceptibilidade ao câncer de pele varia inversamente com o fototipo devido ao tipo e à concentração de pigmento produzido pelos melanócitos:<\/p>\n<ul>\n<li><strong>Fototipos Claros (I e II - Escala de Fitzpatrick):<\/strong> Indivíduos com pele muito clara, cabelos ruivos ou louros, olhos claros e efélides (sardas). Esses indivíduos queimam-se com extrema facilidade e nunca se bronzeiam ou bronzeiam-se minimamente. Apresentam predomínio da síntese de <strong>feomelanina<\/strong> (pigmento amarelo-avermelhado rico em cisteína), que é quimicamente instável e atua como molécula pró-oxidante sob irradiação solar, amplificando o dano ao DNA celular.<\/li>\n<li><strong>Fototipos Escuros (IV a VI):<\/strong> Apresentam predomínio de <strong>eumelanina<\/strong> (pigmento marrom-escuro), molécula altamente polimerizada e estável que funciona como um filtro físico superior contra a penetração de fótons UV e como varredora (<em>scavenger<\/em>) eficaz de radicais livres, conferindo risco de neoplasias cutâneas de 20 a 50 vezes menor.<\/li>\n<li><strong>Fenótipo Nevoide:<\/strong> A presença de elevado número de nevos melanocíticos comuns (&gt; 50 a 100 lesões) ou a presença de múltiplos nevos atípicos/displásicos (síndrome do nevo displásico) reflete hiper-reatividade e instabilidade do compartimento melanocítico, constituindo um dos fatores de risco clínicos isolados mais fortes para melanoma.<\/li><\/ul>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#c9daf8;\">Predisposição Genética e Vias Moleculares Hereditárias<\/h3>\n<p>A suscetibilidade ao câncer de pele pode ser herdada de forma mendeliana (síndromes raras de alta penetrância) ou poligênica (variantes comuns de penetrância moderada a baixa):<\/p>\n<ul>\n<li><strong>Gene MC1R (Melanocortin 1 Receptor):<\/strong> Polimorfismos no receptor MC1R determinam a troca do fenótipo de produção de eumelanina para feomelanina, associando-se ao fenótipo ruivo (\"Red Hair Color\") e conferindo risco aumentado tanto para melanoma quanto para CBC e CEC, independentemente da cor da pele visualmente manifestada.<\/li>\n<li><strong>Mutações Familiares de Alta Penetrância no Melanoma: <\/strong>\n<ul>\n<li><strong>Gene <\/strong><em><strong>CDKN2A<\/strong><\/em><strong> (lócus 9p21):<\/strong> É o principal gene envolvido no melanoma familiar. Codifica duas proteínas supressoras de tumor cruciais: p16INK4a (que inibe a quinase dependente de ciclina CDK4/6, mantendo o retinoblastoma hipofosforilado e bloqueando a transição G1/S do ciclo celular) e p14ARF (que estabiliza a proteína p53 ao inibir a degradação mediada por MDM2). Portadores de mutações inativadoras apresentam risco cumulativo de até 70% de desenvolver melanoma ao longo da vida, além de risco aumentado de adenocarcinoma pancreático.<\/li>\n<li><strong>Gene <\/strong><em><strong>CDK4<\/strong><\/em><strong>:<\/strong> Mutações dominantes com ganho de função geram uma proteína CDK4 resistente à inibição por p16, mantendo o ciclo celular constitutivamente ativo.<\/li><\/ul><\/li>\n<li><strong>Síndromes Hereditárias Clássicas: <\/strong>\n<ul>\n<li><strong>Xeroderma Pigmentoso:<\/strong> Doença autossômica recessiva causada por mutações inativadoras nos genes da via de reparo por excisão de nucleotídeos (NER - genes <em>XPA<\/em> a <em>XPG<\/em> e <em>POLH<\/em>). Há incapacidade completa de reparar os dímeros de pirimidina induzidos por UVB, resultando em incidência de carcinomas e melanomas aumentada em mais de 1.000 a 10.000 vezes, frequentemente manifestando-se na primeira década de vida.<\/li>\n<li><strong>Síndrome de Gorlin-Goltz (Síndrome do Carcinoma Nevoide Basocelular):<\/strong> Condição autossômica dominante provocada por mutações no gene supressor de tumor <em>PTCH1<\/em> (via Sonic Hedgehog). Os pacientes desenvolvem centenas de carcinomas basocelulares precoces, além de ceratocistos odontogênicos e calcificações ectópicas.<\/li><\/ul><\/li><\/ul>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#c9daf8;\">Imunossupressão e Falência da Imunovigilância<\/h3>\n<p>O sistema imune desempenha vigilância contínua na eliminação de células com neoantígenos mutacionais induzidos pelo sol e no controle de vírus oncogênicos. Estados de imunossupressão crônica rompem essa defesa, alterando drasticamente a epidemiologia das neoplasias cutâneas:<\/p>\n<ul>\n<li><strong>Transplantados de Órgãos Sólidos:<\/strong> Devido ao uso contínuo de imunossupressores (inibidores de calcineurina como tacrolimo e ciclosporina, azatioprina e micofenolato de mofetila), receptores de transplante apresentam risco de <strong>CEC aumentado em 65 a 250 vezes<\/strong>, e de <strong>CBC em cerca de 10 a 16 vezes<\/strong>. Isso inverte a razão epidemiológica habitual da população geral (que é de aproximadamente 4 CBC para 1 CEC, passando a predominar o CEC).<\/li>\n<li><strong>Mecanismos Farmacológicos e Virais:<\/strong> Certos imunossupressores, como a azatioprina, tornam o DNA celular hiperfotossensível ao espectro UVA. Paralelamente, a imunodeficiência celular facilita a infecção crônica e replicação de papilomavírus humanos beta (beta-HPV), cujas oncoproteínas (E6 e E7) degradam vias de controle celular e inibem a apoptose de queratinócitos danificados pelo sol.<\/li>\n<li><strong>Outras Populações sob Imunocomprometimento:<\/strong> Pacientes vivendo com HIV/AIDS com contagens baixas de linfócitos T CD4+, indivíduos portadores de neoplasias hematológicas (como Leucemia Linfocítica Crônica) e pacientes em uso prolongado de agentes biológicos anti-TNF-alfa apresentam tumores com comportamento biológico mais agressivo, maiores taxas de recidiva local e risco elevado de metástase locorregional precoce.<\/li><\/ul>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#c9daf8;\">Repercussões Clínicas, Estratificação e Saúde Pública<\/h3>\n<p>A convergência desses fatores exige abordagens personalizadas de prevenção e seguimento no Sistema Único de Saúde:<\/p>\n<ul>\n<li><strong>Rastreio Estratificado na Atenção Primária:<\/strong> Pacientes de fototipos I e II com histórico de queimaduras solares, portadores de mais de 50 nevos ou histórico pessoal/familiar de melanoma devem ser submetidos a exame dermatológico corporal completo anual, priorizando o uso de dermatoscopia e mapeamento corporal nos centros especializados.<\/li>\n<li><strong>Manejo Rigoroso no Paciente Imunossupresso:<\/strong> Transplantados renais, cardíacos e hepáticos devem iniciar acompanhamento dermatológico preventivo pré-transplante e manter consultas semestrais ou trimestrais no pós-transplante, com tratamento agressivo de lesões pré-malignas (crioterapia, 5-fluorouracil, terapia fotodinâmica) para evitar a evolução para carcinomas espinocelulares invasivos de alto risco.<\/li>\n<li><strong>Educação em Saúde e Prevenção Primária:<\/strong> Políticas públicas voltadas à proteção ocupacional (uso obrigatório de Equipamentos de Proteção Individual, como chapéus de abas largas, vestimentas com fator de proteção ultravioleta FPU 50+ e protetores solares de amplo espectro UVA/UVB) são intervenções estruturais de alta relação custo-efetividade para frear a incidência dessas neoplasias no Brasil.<\/li><\/ul>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#c9daf8;\">Síntese Integradora<\/h3>\n<p>A carcinogênese cutânea é o desfecho de um processo dinâmico no qual a radiação ultravioleta atua como o principal agente iniciador e promotor do dano genético, provocando mutações características em oncogenes e supressores tumorais. A intensidade desse dano é modulada pelo fototipo cutâneo, no qual a produção relativa de feomelanina versus eumelanina dita a vulnerabilidade física e oxidativa da célula. Paralelamente, determinantes genéticos herdados estabelecem a competência de reparo de DNA e de regulação do ciclo celular.<\/p>\n<p>Por fim, a integridade do sistema imunitário atua como a barreira final de proteção tecidual; sua supressão não apenas multiplica exponencialmente o risco neoplásico, como altera o perfil de agressividade tumoral. O reconhecimento precoce desses fatores integrados constitui o alicerce fundamental para a prevenção primária, diagnóstico precoce e manejo clínico resolutivo.<\/p>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#c9daf8;\">Referências (Padrão ABNT)<\/h3>\n<ol>\n<li>1. AZULAY, Rubem David; AZULAY, David Rubem; AZULAY-ABULAFIA, Luna. <strong>Dermatologia<\/strong>. 7. ed. Rio de Janeiro: Guanabara Koogan, 2017. cap. 38 (Tumores Epiteliais Malignos), p. 645-660; cap. 40 (Melanoma Cutâneo), p. 675-690.<\/li>\n<li>2. BOLOGNIA, Jean L.; SCHAFFER, Julie V.; CERRONI, Lorenzo. <strong>Dermatologia<\/strong>. 4. ed. Rio de Janeiro: Elsevier, 2018. v. 2, cap. 108 (Carcinoma Basocelular e Carcinoma Espinocelular), p. 1872-1900; cap. 113 (Melanoma), p. 1978-2015.<\/li>\n<li>3. BRASIL. Ministério da Saúde. Instituto Nacional de Câncer José Alencar Gomes da Silva (INCA). <strong>Estimativa 2023: incidência de câncer no Brasil<\/strong>. Rio de Janeiro: INCA, 2022. Disponível em: <a href=\"https://www.gov.br/inca\" target=\"_blank\" rel=\"noopener\">https://www.gov.br/inca<\/a>. Acesso em: 17 ago. 2026.<\/li>\n<li>4. BRASIL. Ministério da Saúde. Secretaria de Atenção Especializada à Saúde. <strong>Portaria Conjunta nº 19, de 25 de outubro de 2022<\/strong>. Aprova as Diretrizes Diagnósticas e Terapêuticas do Melanoma Cutâneo. Brasília: Ministério da Saúde, 2022.<\/li>\n<li>5. KUMAR, Vinay; ABBAS, Abul K.; ASTER, Jon C. <strong>Robbins &amp; Cotran - Patologia: Bases Patológicas das Doenças<\/strong>. 10. ed. Rio de Janeiro: Elsevier, 2021. cap. 25 (A Pele), p. 1145-1158.<\/li>\n<li>6. SCHADENDORF, Dirk et al. Melanoma. <strong>The Lancet<\/strong>, v. 392, n. 10151, p. 971-984, 2018.<\/li>\n<li>7. WELLER, Richard B. et al. <strong>Clinical Dermatology<\/strong>. 5. ed. Oxford: Wiley-Blackwell, 2015. cap. 18 (Skin Cancer and Precancerous Lesions), p. 248-270.<\/li><\/ol>\n<h2 class=\"hb\" style=\"--c:#1c4587;--hb:#6d9eeb;\">6- Disserte sobre o papel da APS nas prevenções primária e secundária do câncer de pele.<\/h2>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#c9daf8;\">Introdução Conceitual e o Papel Estruturante da APS<\/h3>\n<p>A Atenção Primária à Saúde (APS) atua como o centro de comunicação e a principal porta de entrada da Rede de Atenção à Saúde (RAS) no Sistema Único de Saúde (SUS). Em virtude de seus atributos essenciais — acesso de primeiro contato, longitudinalidade, integralidade e coordenação do cuidado —, a APS ocupa uma posição estratégica sin
