l>\n<p><strong>D. Acompanhamento Ambulatorial Pós-Alta da Emergência <\/strong><\/p>\n<ul>\n<li>Consulta de retorno precoce em 7 a 14 dias para avaliar tolerância ao esquema hormonal de transição.<\/li>\n<li>Revisão de exames de imagem eletivos (ultrassonografia pélvica/transvaginal fora do sangramento agudo).<\/li>\n<li>Manutenção da suplementação férrica por pelo menos 3 meses para recomposição de estoques (ferritina).<\/li>\n<li>Definição do plano terapêutico definitivo (manutenção de método contraceptivo/supressivo ou agendamento cirúrgico).<\/li><\/ul>\n<h3 class=\"hc\" style=\"--c:#1f1f1f;\">3. Critérios Diagnósticos do Sangramento Uterino Anormal<\/h3>\n<p>O diagnóstico baseia-se em parâmetros objetivos da menstruação estabelecidos pela FIGO e na investigação etiológica sequencial:<\/p>\n<p><strong>Parâmetros Menstruais Normais vs. Alterados <\/strong><\/p>\n<ul>\n<li><strong>Frequência:<\/strong> Normal entre 24 e 38 dias (anormal: &lt; 24 dias = frequente; &gt; 38 dias = infrequente/amenorreia).<\/li>\n<li><strong>Duração:<\/strong> Normal até 8 dias (anormal: &gt; 8 dias = prolongado).<\/li>\n<li><strong>Regularidade:<\/strong> Variação entre o ciclo mais curto e o mais longo de até 7 a 9 dias (anormal: variação &gt; 8 −−10 dias = irregular).<\/li>\n<li><strong>Volume:<\/strong> Normal entre 5 e 80 mL (anormal: impacto físico, saturação de absorventes em menos de 1 a 2 horas, presença de coágulos maiores que 2 a 3 cm, anemia ferropriva secundária).<\/li><\/ul>\n<p><strong>Etapas da Investigação Diagnóstica <\/strong><\/p>\n<ol>\n<li>1. <strong>Anamnese detalhada:<\/strong> Cronologia dos ciclos, uso de medicamentos (anticoagulantes, psicotrópicos, fitoterápicos), histórico obstétrico e sintomas associados (febre, dor pélvica, perda ponderal).<\/li>\n<li>2. <strong>Exame físico e ginecológico:<\/strong> Especular (afastar sangramento vaginal, cervical, pólipos visíveis, ectopia ou lesões neoplásicas) e toque bimanual (avaliação de volume, mobilidade e dor uterina/anexial).<\/li>\n<li>3. <strong>Exclusão de Gravidez:<\/strong> Teste de gravidez (β -hCG urinário ou sérico) é obrigatório em toda paciente em idade fértil.<\/li>\n<li>4. <strong>Exames laboratoriais:<\/strong> Hemograma, ferritina, coagulograma (se histórico de sangramento desde a menarca ou história familiar), TSH e prolactina (investigação de disfunção ovulatória).<\/li>\n<li>5. <strong>Avaliação por Imagem: <\/strong>\n<ul>\n<li><strong>Ultrassonografia Transvaginal (USTV):<\/strong> Método de primeira linha para rastreio de componentes estruturais (miomas, pólipos, espessamento endometrial, adenomiose).<\/li>\n<li><strong>Histerossonografia:<\/strong> Indicada quando há dúvida diagnóstica quanto à cavidade endometrial na USTV convencional.<\/li>\n<li><strong>Ressonância Magnética de Pelve:<\/strong> Reservada para mapeamento pré-operatório complexo de miomas ou avaliação aprofundada de adenomiose.<\/li><\/ul><\/li>\n<li>6. <strong>Biópsia Endometrial:<\/strong> Obrigatória em mulheres ≥45 anos com SUA, ou abaixo dessa idade com fatores de risco para câncer de endométrio (obesidade, anovulação crônica/SOP, histórico de síndrome de Lynch, falha no tratamento clínico). Pode ser realizada por aspiração (pipelle) ou guiada por histeroscopia diagnóstica.<\/li><\/ol>\n<h3 class=\"hc\" style=\"--c:#1f1f1f;\">4. Tratamento do Sangramento Uterino Anormal<\/h3>\n<p>O plano terapêutico deve respeitar o desejo reprodutivo da paciente, a presença de fatores de risco, as contraindicações clínicas e a etiologia específica:<\/p>\n<p><strong>Tratamento Clínico e Farmacológico <\/strong><\/p>\n<ul>\n<li><strong>Não Hormonal: <\/strong>\n<ul>\n<li><em>Anti-inflamatórios não esteroides (AINEs):<\/em> Ácido mefenâmico, ibuprofeno ou naproxeno durante a menstruação. Reduzem a produção de prostaglandinas vasodilatadoras, diminuindo o fluxo em 20% a 40%.<\/li>\n<li><em>Antifibrinolíticos (Ácido Tranexâmico):<\/em> Estabiliza a rede de fibrina endometrial; reduz o fluxo em até 50% nos dias de maior sangramento.<\/li><\/ul><\/li>\n<li><strong>Hormonal: <\/strong>\n<ul>\n<li><em>Sistema Intrauterino liberador de Levonorgestrel (SIU-LNG):<\/em> Padrão-ouro clínico para causas não estruturais e adenomiose; promove atrofia endometrial acentuada.<\/li>\n<li><em>Anticoncepcionais Orais Combinados (ACOs):<\/em> Controlam o ciclo e reduzem a perda hemática por feedback negativo no eixo HHO.<\/li>\n<li><em>Progestagênios isolados:<\/em> Orais contínuos (dienogeste, desogestrel, noretisterona) ou injetáveis (acetato de medroxiprogesterona de depósito), ideais para pacientes com contraindicação a estrogênios.<\/li>\n<li><em>Moduladores/Agonistas e Antagonistas de GnRH:<\/em> Induzem estado de hipoestrogenismo com amenorreia; usados primariamente no preparo pré-operatório de grandes miomas para redução de volume e recuperação de hemoglobina.<\/li><\/ul><\/li><\/ul>\n<p><strong>Tratamento Cirúrgico <\/strong><\/p>\n<ul>\n<li><strong>Conservador (Preserva o útero / fertilidade): <\/strong>\n<ul>\n<li><em>Histeroscopia cirúrgica:<\/em> Exérese de pólipos endometriais e miomas submucosos (G0 e G1).<\/li>\n<li><em>Miomectomia (laparoscópica, robótica ou aberta):<\/em> Para miomas intramurais sintomáticos em pacientes com desejo reprodutivo.<\/li>\n<li><em>Ablação endometrial:<\/em> Destruição térmica/mecânica da camada basal do endométrio em mulheres que não desejam mais gestar e recusam histerectomia.<\/li>\n<li><em>Embolização de Artérias Uterinas (EAU):<\/em> Alternativa minimamente invasiva para múltiplos miomas sintomáticos.<\/li><\/ul><\/li>\n<li><strong>Definitivo: <\/strong>\n<ul>\n<li><em>Histerectomia (vaginal, laparoscópica ou laparotômica):<\/em> Indicada na falha do tratamento conservador, malignidade/hiperplasia atípica ou paridade constituída com doença sintomática refratária.<\/li><\/ul><\/li><\/ul>\n<h3 class=\"hc\" style=\"--c:#1f1f1f;\">5. Atuação da Equipe Multiprofissional no Cuidado<\/h3>\n<p>O SUA não é apenas uma disfunção ginecológica isolada; acarreta repercussões sistêmicas, hematológicas, psicológicas, ocupacionais e sociais. O cuidado integrado por uma equipe multiprofissional é determinante para a resolutividade e adesão terapêutica:<\/p>\n<ul>\n<li><strong>Médico(a) Ginecologista e Médico(a) de Família/Emergencista:<\/strong> Responsáveis pelo diagnóstico diferencial, estabilização hemodinâmica aguda, indicação farmacológica, rastreamento oncológico e execução de procedimentos invasivos ou cirúrgicos.<\/li>\n<li><strong>Enfermagem:<\/strong> Atuação direta na triagem rápida e classificação de risco no ambiente de urgência, monitorização hemodinâmica contínua, administração segura de hemocomponentes e medicações parenterais, além do acolhimento e orientações sobre sinais de alerta na alta.<\/li>\n<li><strong>Nutrição:<\/strong> Planejamento dietoterápico focado em fontes de ferro de alta biodisponibilidade (heme) e cofatores absortivos (vitamina C), além do manejo de patologias de base associadas a desequilíbrios hormonais (ex.: resistência à insulina e obesidade na SOP).<\/li>\n<li><strong>Psicologia:<\/strong> Apoio emocional frente ao estresse crônico decorrente de perdas hemáticas constrangedoras, dismenorreia crônica, impacto na vida sexual e ansiedade relacionada a procedimentos cirúrgicos ou diagnósticos de infertilidade/malignidade.<\/li>\n<li><strong>Serviço Social:<\/strong> Identificação de barreiras de acesso aos insumos (aquisição de absorventes higiênicos, acesso a métodos contraceptivos de longa duração/DIU pelo SUS) e suporte nas questões de afastamento laboral temporário por astenia grave secundária à anemia.<\/li><\/ul>"}];

const FLASH = {"tutoria-1-1": [["Qual é o câncer de pele mais comum e de qual célula ele se origina?", "O carcinoma basocelular (CBC). Origina-se das células basais da epiderme e do folículo piloso, cresce devagar e quase nunca dá metástase, mas destrói localmente."], ["Como é a lesão clássica do carcinoma basocelular?", "Pápula ou nódulo de aspecto perolado, com bordas elevadas e telangiectasias, que pode ulcerar no centro (a chamada úlcera roedora). Predomina em face e áreas fotoexpostas."], ["De qual célula se origina o carcinoma espinocelular (CEC) e qual sua lesão precursora típica?", "Dos queratinócitos do estrato espinhoso. A ceratose actínica, em pele com dano solar crônico, é a lesão precursora mais comum."], ["Qual o achado histológico característico do CEC?", "Ninhos e cordões de células escamosas atípicas invadindo a derme, com pleomorfismo, mitoses anormais e pérolas córneas (acúmulos de queratina)."], ["Por que o melanoma é o câncer de pele mais agressivo?", "Origina-se dos melanócitos e tem grande capacidade de invadir a derme e alcançar vasos linfáticos e sanguíneos, levando a metástases precoces para linfonodos e órgãos distantes."], ["O que avalia a regra do ABCDE?", "Sinais de alerta para melanoma: Assimetria, Bordas irregulares, Cor variada, Diâmetro maior que 6 mm e Evolução (mudança de tamanho, forma, cor ou sintomas)."], ["Qual é o principal fator prognóstico do melanoma localizado?", "A espessura de Breslow: a medida em milímetros da camada granulosa até o ponto mais profundo de invasão. Ulceração e índice mitótico também pioram o prognóstico."], ["Como o padrão de exposição solar se relaciona com cada tipo de câncer de pele?", "O CEC se associa à exposição crônica e cumulativa. O melanoma e o CBC se associam mais à exposição intensa e intermitente, com queimaduras solares, sobretudo na infância."], ["Como a radiação UVB lesa o DNA?", "Ela forma dímeros de pirimidina (principalmente de timina), que geram mutações típicas C→T em genes como o TP53. Quando o reparo falha, as mutações se acumulam e favorecem a transformação maligna."], ["Que fototipo de Fitzpatrick tem maior risco de câncer de pele?", "Os fototipos I e II: pele muito clara, que sempre queima e raramente bronzeia, geralmente com olhos e cabelos claros e sardas."], ["Que síndromes genéticas predispõem ao câncer de pele?", "Xeroderma pigmentoso (defeito no reparo por excisão de nucleotídeos), síndrome de Gorlin (gene PTCH1, múltiplos CBCs) e melanoma familiar (mutações de CDKN2A)."], ["Por que pacientes transplantados têm mais câncer de pele?", "A imunossupressão crônica reduz a imunovigilância contra células com DNA lesado e contra o HPV. O risco de CEC, em especial, aumenta muitas vezes."], ["Qual o papel da dermatoscopia?", "É um exame não invasivo que amplia a lesão e mostra estruturas pigmentares e vasculares invisíveis a olho nu. Aumenta a acurácia para diferenciar lesões benignas de melanoma e ajuda a decidir a biópsia."], ["Como se confirma o diagnóstico de câncer de pele?", "Pela biópsia com exame anatomopatológico. Na suspeita de melanoma, prefere-se a biópsia excisional com margens estreitas, para permitir medir o Breslow."], ["Qual o tratamento padrão do CBC e do CEC?", "A excisão cirúrgica com margens de segurança. A cirurgia micrográfica de Mohs é indicada em áreas nobres da face, tumores recidivados ou de bordas mal definidas."], ["Quais são as margens de ampliação no melanoma conforme o Breslow?", "In situ: 0,5 a 1 cm. Até 1 mm: 1 cm. De 1 a 2 mm: 1 a 2 cm. Acima de 2 mm: 2 cm."], ["Para que serve a pesquisa do linfonodo sentinela no melanoma?", "Identifica o primeiro linfonodo da drenagem do tumor e mostra se houve disseminação linfática. É indicada em tumores mais espessos ou ulcerados e define estadiamento e tratamento adjuvante."], ["Qual mutação é alvo terapêutico no melanoma e quais drogas a bloqueiam?", "A mutação BRAF V600, que ativa a via MAPK. É tratada com inibidores de BRAF (vemurafenibe, dabrafenibe) associados a inibidores de MEK (trametinibe, cobimetinibe)."], ["Como funcionam os inibidores de checkpoint imunológico?", "Bloqueiam os freios do linfócito T: anti-PD-1 (nivolumabe, pembrolizumabe) e anti-CTLA-4 (ipilimumabe). O linfócito volta a reconhecer e destruir o tumor."], ["Quais medidas de prevenção primária do câncer de pele cabem à APS?", "Educação em fotoproteção: evitar sol entre 10h e 16h, usar protetor solar FPS 30 ou mais e reaplicar, roupas, chapéu e óculos, com atenção a trabalhadores expostos ao sol e crianças."], ["O que é prevenção secundária do câncer de pele na APS?", "O diagnóstico precoce: exame da pele nas consultas, orientação de autoexame, reconhecimento do ABCDE e encaminhamento rápido de lesões suspeitas para biópsia (rastreamento oportunístico)."]], "tutoria-1-2": [["Qual é o tipo histológico mais comum de câncer de próstata?", "O adenocarcinoma acinar, que corresponde a cerca de 95% dos casos."], ["Em qual zona da próstata o câncer costuma surgir e por que isso importa?", "Na zona periférica (cerca de 70% dos casos), que é posterior e palpável ao toque retal. A HPB, ao contrário, surge na zona de transição."], ["Por que o câncer de próstata localizado costuma ser assintomático?", "Porque nasce na zona periférica, longe da uretra. Os sintomas urinários só aparecem quando o tumor cresce e invade estruturas vizinhas."], ["Quais são as manifestações da doença localmente avançada?", "Sintomas obstrutivos do trato urinário inferior, hematúria, hemospermia, disfunção erétil e, se invadir o trígono, obstrução ureteral com hidronefrose."], ["Qual é a manifestação mais comum da doença metastática?", "Dor óssea, sobretudo em coluna e pelve. Pode haver fraturas patológicas, compressão medular, anemia e perda de peso."], ["Quais são os principais fatores de risco do câncer de próstata?", "Idade (principal), história familiar em parente de primeiro grau, ancestralidade negra e mutações germinativas como BRCA2 e BRCA1. Obesidade se associa a formas mais agressivas."], ["Qual o papel dos androgênios no câncer de próstata?", "A testosterona é convertida em di-hidrotestosterona pela 5-alfa-redutase e ativa o receptor androgênico, estimulando o crescimento tumoral. Isso fundamenta a terapia de privação androgênica."], ["Como a HPB e o câncer se diferenciam ao toque retal?", "A HPB dá aumento difuso, liso, simétrico e fibroelástico. O câncer dá nódulo endurecido (pétreo), irregular, às vezes com perda do sulco mediano."], ["Como se apresenta a prostatite aguda?", "Febre, calafrios, disúria, polaciúria e dor perineal, com próstata muito dolorosa, quente e edemaciada. A massagem prostática é contraindicada pelo risco de bacteremia."], ["O PSA é específico para câncer?", "Não. É específico do órgão, mas não da doença: sobe também em HPB, prostatite, após ejaculação, manipulação ou ciclismo. Por isso não confirma o diagnóstico."], ["Como é calculado o escore de Gleason?", "Pela soma do padrão arquitetural mais prevalente (primário) com o segundo mais prevalente (secundário), cada um graduado de 3 a 5 na biópsia."], ["Por que o Gleason relatado começa em 6?", "Porque os padrões 1 e 2 deixaram de ser atribuídos em biópsias pela ISUP. O menor escore possível na prática é 3+3=6."], ["Quais são os Grupos de Grau da ISUP?", "GG1: Gleason ≤6. GG2: 3+4=7. GG3: 4+3=7. GG4: 8. GG5: 9 ou 10."], ["Por que 4+3 tem pior prognóstico que 3+4, se ambos somam 7?", "Porque em 4+3 predomina o padrão 4, mais indiferenciado (glândulas fundidas, cribriformes). Por isso 4+3 é GG3 e 3+4 é GG2."], ["O SUS recomenda rastreamento populacional com PSA?", "Não. O Ministério da Saúde e o INCA não recomendam, pelo risco de sobrediagnóstico e sobretratamento. Prioriza-se o diagnóstico precoce em homens com sinais e sintomas, com decisão compartilhada em quem pede o exame."], ["Como se confirma o diagnóstico de câncer de próstata?", "Pela biópsia prostática guiada por ultrassom (transretal ou transperineal), idealmente orientada pela ressonância multiparamétrica."], ["O que é vigilância ativa e para quem ela serve?", "Acompanhamento com PSA, toque retal, ressonância e biópsias seriadas, tratando só se houver progressão. Serve para doença de baixo risco (GG1, PSA baixo, tumor pequeno)."], ["Quais são os tratamentos com intenção curativa da doença localizada?", "Prostatectomia radical (aberta, laparoscópica ou robótica) ou radioterapia (externa ou braquiterapia), às vezes associada a bloqueio hormonal."], ["Como se faz a terapia de privação androgênica e quais seus efeitos adversos?", "Por orquiectomia bilateral ou castração medicamentosa com agonistas do GnRH (gosserrelina, leuprorrelina) ou antagonistas. Causa fogachos, perda de libido, osteoporose, perda muscular e alterações metabólicas."], ["Como age a abiraterona?", "Inibe a enzima CYP17, bloqueando a síntese de androgênios nas adrenais, nos testículos e no próprio tumor. É usada na doença avançada, associada a prednisona."], ["Por que o câncer de próstata metastatiza tanto para a coluna?", "O plexo venoso prostático se comunica com o plexo venoso vertebral de Batson, sem válvulas. As células chegam à coluna e à pelve, e as metástases costumam ser osteoblásticas."]], "tutoria-1-3": [["Qual é o tipo histológico mais comum de câncer colorretal?", "O adenocarcinoma, responsável por mais de 90% dos casos, geralmente originado de pólipos adenomatosos."], ["Qual é a sequência da via de instabilidade cromossômica?", "Perda do APC, depois ativação do KRAS, perdas em 18q (SMAD4) e por fim perda do TP53, levando do epitélio normal ao adenoma e ao carcinoma (sequência adenoma-carcinoma)."], ["O que acontece quando o gene APC é perdido?", "A betacatenina deixa de ser degradada, acumula-se e vai ao núcleo, ativando a via Wnt (fatores TCF/LEF). As células da cripta proliferam sem controle."], ["O que caracteriza a via de instabilidade de microssatélites?", "Defeito nos genes de reparo de pareamento (MLH1, MSH2, MSH6, PMS2), herdado na síndrome de Lynch ou adquirido. Os tumores são mais à direita, mucinosos, com muitos linfócitos e respondem bem à imunoterapia."], ["O que é a via serrilhada (CIMP)?", "Uma via epigenética com hipermetilação de promotores (como o do MLH1) e mutação do BRAF, que parte dos pólipos serrilhados sésseis."], ["Quais fatores de risco modificáveis para câncer colorretal?", "Consumo de carne vermelha e processada, dieta pobre em fibras, obesidade, sedentarismo, tabagismo e álcool."], ["Quais fatores de risco não modificáveis?", "Idade acima de 45 a 50 anos, história familiar, síndromes hereditárias (polipose adenomatosa familiar, Lynch) e doença inflamatória intestinal."], ["Como costuma se apresentar o tumor de cólon direito?", "Com anemia ferropriva por sangramento oculto, fadiga, perda de peso e às vezes massa palpável. Obstrução é rara, porque o calibre é maior e as fezes são líquidas."], ["Como costuma se apresentar o tumor de cólon esquerdo?", "Com mudança do hábito intestinal, fezes afiladas, sangue nas fezes e quadro obstrutivo, porque a luz é menor, as fezes são sólidas e a lesão costuma ser anular."], ["Quais são os sintomas típicos do câncer de reto?", "Hematoquezia, tenesmo, puxo e sensação de evacuação incompleta."], ["Como é o rastreamento do câncer colorretal em risco habitual?", "A partir de 45 a 50 anos, com pesquisa de sangue oculto nas fezes (de preferência imunoquímica) anual ou colonoscopia a cada 10 anos."], ["Qual a diferença entre o teste do guaiaco e o imunoquímico (FIT)?", "O guaiaco detecta a atividade peroxidase do heme e sofre interferência de dieta e medicamentos. O FIT usa anticorpos contra a globina humana e é mais específico para sangramento do cólon e do reto."], ["Qual exame confirma o diagnóstico de câncer colorretal?", "A colonoscopia com biópsia. Ela deve ser completa para procurar lesões sincrônicas."], ["Para que serve o CEA no câncer colorretal?", "Não serve para rastreamento nem diagnóstico. É útil como valor basal antes do tratamento e no seguimento: queda após a cirurgia e nova elevação sugerem recidiva."], ["Como se faz o estadiamento do câncer colorretal?", "Tomografia de tórax, abdome e pelve para metástases, e no reto ressonância pélvica para avaliar profundidade, linfonodos e margem circunferencial."], ["O que significa T3N1M0?", "Tumor que ultrapassa a muscular própria até os tecidos pericolorretais, com 1 a 3 linfonodos regionais acometidos e sem metástase a distância: estádio III."], ["Qual o tratamento do câncer de cólon estádio III?", "Colectomia com ressecção dos linfonodos (pelo menos 12) seguida de quimioterapia adjuvante, como FOLFOX ou CAPOX."], ["O que é o FOLFOX e qual o efeito adverso típico da oxaliplatina?", "Leucovorina (ácido folínico), 5-fluorouracil e oxaliplatina. A oxaliplatina causa neuropatia periférica, com parestesias que pioram com o frio."], ["Qual o tratamento do câncer de reto localmente avançado?", "Quimiorradioterapia neoadjuvante seguida de cirurgia com excisão total do mesorreto."], ["Qual o sítio de metástase mais comum e por quê?", "O fígado, porque o sangue do cólon e do reto superior drena pelas veias mesentéricas para a veia porta. O reto baixo drena para a cava e pode metastatizar primeiro para o pulmão."], ["O que é neutropenia febril e como se conduz?", "Neutrófilos abaixo de 500/mm³ (ou com queda prevista) com febre de 38,3 °C ou 38 °C mantida. É emergência: colher culturas e iniciar antibiótico de amplo espectro em até 1 hora."]], "tutoria-1-5": [["Qual é a causa necessária do câncer do colo do útero?", "A infecção persistente por HPV de alto risco oncogênico."], ["Quais tipos de HPV mais se associam ao câncer do colo?", "Os tipos 16 (mais ligado ao carcinoma escamoso) e 18 (mais ligado ao adenocarcinoma), responsáveis por cerca de 70% dos casos."], ["Como as proteínas E6 e E7 do HPV causam câncer?", "A E6 leva o p53 à degradação e a E7 inativa a proteína Rb. A célula perde o controle do ciclo e da apoptose, sobretudo após a integração do DNA viral."], ["Em que região do colo surgem as lesões precursoras?", "Na zona de transformação, junto à junção escamocolunar, onde há metaplasia escamosa e as células basais ficam mais acessíveis ao vírus."], ["Quais são os cofatores de risco para o câncer do colo?", "Início sexual precoce, múltiplos parceiros, tabagismo, imunossupressão (HIV), multiparidade, uso prolongado de contraceptivo oral e outras ISTs."], ["Quais são as manifestações iniciais do câncer do colo?", "Na fase inicial é assintomático. Depois surgem sinusorragia (sangramento pós-coito), sangramento intermenstrual e corrimento fétido."], ["Quais manifestações sugerem doença avançada?", "Dor pélvica ou lombar, edema de membros inferiores, hidronefrose com insuficiência renal e fístulas vesicovaginais ou retovaginais."], ["Como é o rastreamento clássico por citologia no SUS?", "Citopatológico em pessoas de 25 a 64 anos que já iniciaram atividade sexual: anual no início e, após dois exames normais seguidos, a cada 3 anos."], ["O que mudou com as diretrizes brasileiras de 2025?", "O teste de DNA-HPV oncogênico passou a ser o método primário de rastreamento, em implantação progressiva no SUS, com intervalo maior quando negativo."], ["Quais são as medidas de prevenção primária?", "Vacinação contra HPV (oferecida no SUS para meninas e meninos de 9 a 14 anos e grupos especiais) e uso de preservativo."], ["Qual a diferença entre LSIL e HSIL?", "LSIL corresponde a NIC 1 e reflete infecção produtiva, que costuma regredir. HSIL corresponde a NIC 2 e 3, é a verdadeira lesão precursora e exige colposcopia."], ["Qual a conduta diante de HSIL no citopatológico?", "Encaminhar para colposcopia com biópsia das áreas alteradas. Confirmada a lesão, trata-se com excisão da zona de transformação."], ["O que os testes do ácido acético e de Schiller mostram na colposcopia?", "Áreas acetobrancas e áreas iodo-negativas (que não coram com lugol por falta de glicogênio) são suspeitas e devem ser biopsiadas."], ["Como se confirma o diagnóstico de câncer do colo?", "Pelo exame histopatológico de biópsia, de preferência dirigida pela colposcopia. Lesão visível não é caso de rastreamento, é caso de biópsia."], ["O que a FIGO 2018 incorporou ao estadiamento?", "Exames de imagem (RM, TC, PET-CT) e achados patológicos, além do exame clínico. Linfonodos pélvicos ou para-aórticos comprometidos passaram a ser estádio IIIC."], ["Como se divide o estádio I do câncer do colo?", "Tumor restrito ao colo. IA é microscópico; IB1 até 2 cm; IB2 de 2 a 4 cm; IB3 maior que 4 cm."], ["O que caracteriza os estádios II e III?", "II: além do útero, sem atingir o terço inferior da vagina nem a parede pélvica. III: terço inferior da vagina, parede pélvica, hidronefrose ou linfonodos (IIIC)."], ["O que caracteriza o estádio IV?", "IVA: invasão da mucosa da bexiga ou do reto. IVB: metástases a distância."], ["Qual o tratamento dos estádios IB1 e IB2?", "Histerectomia radical (Wertheim-Meigs) com linfadenectomia pélvica ou pesquisa de linfonodo sentinela."], ["Qual o tratamento da doença localmente avançada (IB3 a IVA)?", "Quimiorradioterapia concomitante: cisplatina semanal com radioterapia externa, seguida de braquiterapia."], ["Qual a conduta na doença metastática ou recidiva irressecável (IVB)?", "Terapia sistêmica paliativa à base de platina, associada a cuidados paliativos para controle de dor, sangramento e qualidade de vida."]], "tutoria-2-1": [["Qual a diferença entre climatério e menopausa?", "Climatério é a fase de transição da vida reprodutiva para a não reprodutiva. Menopausa é a última menstruação, confirmada em retrospecto após 12 meses seguidos de amenorreia."], ["Em que idade costuma ocorrer a menopausa?", "Em média entre 48 e 52 anos, por volta dos 50."], ["Qual é a primeira alteração hormonal da transição menopausal?", "A queda da inibina B, que libera o FSH: ele sobe isoladamente enquanto o estradiol ainda está normal ou até oscila para cima."], ["O que é insuficiência ovariana prematura?", "Falência ovariana antes dos 40 anos, com amenorreia e FSH elevado em duas dosagens. Entre 40 e 45 anos fala-se em menopausa precoce."], ["Como o STRAW+10 marca a transição menopausal?", "Fase inicial: variação persistente de 7 dias ou mais na duração dos ciclos. Fase tardia: intervalos de amenorreia de 60 dias ou mais."], ["Qual o mecanismo dos fogachos?", "Com estrogênio baixo, os neurônios KNDy do hipotálamo (kisspeptina, neurocinina B, dinorfina) ficam hiperativos e a zona termoneutra se estreita. Pequenas elevações de temperatura disparam vasodilatação e sudorese."], ["O que é a síndrome geniturinária da menopausa?", "Atrofia do epitélio vulvovaginal e uretral por falta de estrogênio: ressecamento, ardor, dispareunia, urgência miccional e infecções urinárias de repetição, com pH vaginal mais alto."], ["Por que a menopausa causa perda óssea?", "O estrogênio freia os osteoclastos (reduz RANKL e aumenta a osteoprotegerina). Sem ele, a reabsorção supera a formação, com perda rápida de osso trabecular."], ["Como a menopausa altera o risco cardiovascular?", "Sobem LDL e triglicérides, cai o HDL, aumentam a gordura visceral e a resistência insulínica, e perde-se o efeito vasodilatador do estrogênio."], ["Para que serve o índice de Kupperman?", "É um questionário que pontua os sintomas do climatério (fogachos, insônia, nervosismo, artralgia, etc.) com pesos diferentes, classificando a síndrome como leve, moderada ou intensa e acompanhando a resposta ao tratamento."], ["É preciso dosar FSH para diagnosticar a menopausa?", "Não, em mulheres acima de 45 anos com quadro típico o diagnóstico é clínico. O FSH ajuda em mulheres jovens, histerectomizadas ou na suspeita de insuficiência ovariana prematura."], ["Quais diagnósticos diferenciais devem ser lembrados no climatério?", "Gravidez, doenças da tireoide, hiperprolactinemia e outras causas de amenorreia ou de sintomas vasomotores."], ["Qual a principal indicação da terapia hormonal da menopausa?", "Sintomas vasomotores moderados a intensos, que ela trata com máxima eficácia. Também trata a síndrome geniturinária e previne perda óssea."], ["O que é a janela de oportunidade da terapia hormonal?", "Iniciar a terapia antes dos 60 anos ou nos primeiros 10 anos após a menopausa, quando o endotélio ainda é saudável e a relação risco-benefício é favorável."], ["Por que mulheres com útero precisam de progestagênio na terapia hormonal?", "Para proteger o endométrio. Estrogênio isolado causa hiperplasia e aumenta o risco de câncer de endométrio."], ["Quais são as contraindicações à terapia hormonal sistêmica?", "Câncer de mama ou de endométrio, sangramento vaginal não esclarecido, tromboembolismo venoso, AVC ou infarto prévios, doença hepática grave ativa e porfiria."], ["Qual a vantagem da via transdérmica?", "Evita a primeira passagem hepática, com menor risco de trombose e menor efeito sobre triglicérides. É preferida em obesas, hipertensas ou com risco trombótico."], ["Quais opções não hormonais existem para fogachos?", "ISRS e IRSN (paroxetina, escitalopram, venlafaxina, desvenlafaxina), gabapentina, clonidina e os antagonistas do receptor de neurocinina 3 (fezolinetante)."], ["Que cuidado tomar com antidepressivos em mulheres usando tamoxifeno?", "Evitar paroxetina e fluoxetina, que inibem a CYP2D6 e reduzem o metabólito ativo do tamoxifeno. Preferir venlafaxina, desvenlafaxina, citalopram ou gabapentina."], ["Qual a base fisiopatológica da TPM?", "Os níveis hormonais são normais. O que muda é a sensibilidade do sistema nervoso às oscilações da fase lútea, envolvendo metabólitos da progesterona (alopregnanolona, receptor GABA-A) e a serotonina."], ["Como diferenciar TPM de transtorno disfórico pré-menstrual e como tratar o TDPM?", "O TDPM é a forma grave, com predomínio de sintomas afetivos (irritabilidade, humor deprimido, ansiedade) e prejuízo funcional, pelos critérios do DSM-5. O tratamento de primeira linha são os ISRS, contínuos ou na fase lútea."]], "tutoria-2-2": [["Quanto aumenta o débito cardíaco na gestação e quando atinge o pico?", "Aumenta de 30 a 50%, por aumento da frequência cardíaca e do volume sistólico, com pico por volta de 20 a 24 semanas."], ["O que acontece com a resistência vascular e a pressão arterial?", "A resistência vascular periférica cai por ação da progesterona, do óxido nítrico e das prostaglandinas. A pressão arterial fica mais baixa no segundo trimestre."], ["O que é a anemia fisiológica da gestação?", "O volume plasmático aumenta 40 a 50%, mais que a massa de hemácias (20 a 30%). A hemoglobina cai por diluição."], ["Por que a gestação é um estado de hipercoagulabilidade?", "Aumentam o fibrinogênio (400 a 600 mg/dL) e os fatores VII, VIII, IX e X, e cai a proteína S. Isso protege contra hemorragia no parto, mas aumenta o risco de trombose."], ["Quais são as adaptações respiratórias da gestação?", "A progesterona estimula o centro respiratório: aumentam o volume corrente e a ventilação, cai a PaCO₂ (alcalose respiratória compensada). O útero eleva o diafragma e reduz a capacidade residual funcional."], ["Quais são as adaptações renais da gestação?", "Fluxo plasmático renal e filtração glomerular aumentam cerca de 50%: creatinina e ureia ficam mais baixas, pode haver glicosúria e os ureteres dilatam, mais à direita."], ["O que é a síndrome da hipotensão supina?", "A partir da segunda metade, o útero comprime a veia cava em decúbito dorsal e reduz o retorno venoso, causando hipotensão e tontura. Por isso orienta-se o decúbito lateral esquerdo."], ["Como o metabolismo da glicose muda ao longo da gestação?", "A primeira metade é anabólica, com boa sensibilidade à insulina. Na segunda, hormônios placentários (lactogênio placentário, progesterona, cortisol, GH placentário) criam resistência insulínica."], ["Quais exames laboratoriais fazem parte da primeira consulta de pré-natal?", "Hemograma, tipagem ABO/Rh (e Coombs indireto se Rh negativo), glicemia de jejum, urina tipo 1 e urocultura, e testes para sífilis, HIV, hepatites B e C e toxoplasmose."], ["Como interpretar a glicemia de jejum no início do pré-natal?", "126 mg/dL ou mais: diabetes diagnosticado na gestação. De 92 a 125: diabetes gestacional. Abaixo de 92: fazer TOTG 75 g entre 24 e 28 semanas."], ["Quais são os pontos de corte do TOTG 75 g na gestação?", "Jejum de 92 a 125, 1 hora a partir de 180 e 2 horas de 153 a 199 mg/dL. Um único valor alterado já confirma o diabetes gestacional."], ["Quando e como pesquisar o estreptococo do grupo B?", "Com swab do terço distal da vagina e do reto entre 35 e 37 semanas. Se positivo, faz-se profilaxia antibiótica intraparto com penicilina."], ["O que diferencia gestação de risco habitual e de alto risco?", "Na de alto risco, uma condição materna ou fetal aumenta a chance de desfecho desfavorável e exige acompanhamento especializado, sem perder o vínculo com a APS."], ["Cite condições pré-existentes que tornam a gestação de alto risco.", "Hipertensão crônica, diabetes pré-gestacional, cardiopatias, nefropatias, doenças autoimunes, epilepsia, trombofilias, HIV e obesidade grave."], ["Qual a fisiopatologia do diabetes gestacional?", "Os hormônios placentários aumentam a resistência à insulina. Na gestação normal o pâncreas compensa; no DMG a célula beta não consegue, e surge hiperglicemia."], ["O que diz a hipótese de Pedersen?", "A glicose materna atravessa a placenta, mas a insulina não. O feto responde com hiperinsulinemia, que causa macrossomia e, após o parto, hipoglicemia neonatal."], ["Quais são os fatores de risco para diabetes gestacional?", "Idade materna avançada, sobrepeso ou obesidade, DMG ou macrossomia em gestação anterior, diabetes em parente de primeiro grau, SOP e hipertensão."], ["O que acontece no primeiro estágio da pré-eclâmpsia?", "A invasão trofoblástica é superficial e as artérias espiraladas não se remodelam: continuam estreitas e reativas, e a placenta fica isquêmica."], ["O que acontece no segundo estágio da pré-eclâmpsia?", "A placenta isquêmica libera fatores antiangiogênicos (sFlt-1, endoglina solúvel) que sequestram VEGF e PlGF, causando disfunção endotelial sistêmica: hipertensão, proteinúria e lesão de órgãos."], ["Quais são os fatores de alto risco para pré-eclâmpsia?", "Pré-eclâmpsia prévia, hipertensão crônica, diabetes pré-gestacional, doença renal, lúpus ou síndrome antifosfolípide e gestação múltipla. Um deles basta para indicar profilaxia."], ["Como se faz a profilaxia da pré-eclâmpsia?", "AAS 100 a 150 mg à noite e cálcio 1 a 1,5 g/dia, iniciados de preferência antes de 16 semanas, em gestantes com um fator de alto risco ou dois ou mais moderados."]], "tutoria-2-3": [["Qual é o agente da tricomoníase?", "O Trichomonas vaginalis, protozoário flagelado anaeróbio que parasita o epitélio do trato geniturinário."], ["Qual é o agente da sífilis e como ele se dissemina?", "O Treponema pallidum, uma espiroqueta que penetra por mucosa ou microlesões da pele e se dissemina rapidamente por via linfática e hematogênica."], ["Como o Trichomonas altera o ambiente vaginal?", "Adere ao epitélio com adesinas e proteases, reduz os lactobacilos e eleva o pH vaginal acima de 4,5 (geralmente 5 a 5,5), favorecendo anaeróbios e inflamação."], ["Como é o corrimento da tricomoníase?", "Abundante, amarelo-esverdeado, bolhoso e com odor fétido, acompanhado de prurido, ardor, disúria e dispareunia."], ["O que é o colo em framboesa?", "Colpite com pontos hemorrágicos (colpitis macularis) vista no exame especular da tricomoníase. No teste de Schiller dá aspecto tigroide."], ["Como se diagnostica a tricomoníase?", "Exame a fresco mostrando o protozoário móvel, pH vaginal acima de 4,5 e testes moleculares (NAAT), que são os mais sensíveis. Pode ser achado no Papanicolau."], ["Como se trata a tricomoníase?", "Metronidazol por via oral (dose única de 2 g ou 500 mg de 12/12 h por 7 dias), tratando também as parcerias sexuais."], ["Por que o metronidazol tópico isolado não deve ser usado na tricomoníase?", "Porque não atinge níveis adequados na uretra e nas glândulas periuretrais, o que leva a recidivas acima de 50%."], ["Que orientação dar sobre álcool durante o uso de metronidazol?", "Evitar álcool durante o tratamento e até 48 horas depois, pelo risco de efeito semelhante ao dissulfiram (rubor, náuseas, vômitos, taquicardia)."], ["Como é o cancro duro da sífilis primária?", "Úlcera geralmente única, indolor, de base limpa e bordas endurecidas, com linfadenopatia regional. Some sozinha em 3 a 6 semanas."], ["Como se apresenta a sífilis secundária?", "Entre 6 semanas e 6 meses: roséola, lesões palmoplantares, condiloma plano, alopecia em clareira, febre, mal-estar e linfadenopatia generalizada."], ["O que caracteriza a sífilis terciária?", "Surge anos depois, com gomas (lesões destrutivas), sífilis cardiovascular (aortite) e neurossífilis (tabes dorsalis, demência)."], ["O que é sífilis latente?", "Fase sem sinais clínicos, com sorologia reagente. É recente quando tem menos de 1 ano e tardia quando tem mais de 1 ano ou duração desconhecida."], ["Qual a diferença entre testes treponêmicos e não treponêmicos?", "Treponêmicos (teste rápido, FTA-Abs, TPHA, quimioluminescência) detectam anticorpos específicos e costumam ficar positivos para sempre. Não treponêmicos (VDRL, RPR) detectam anticardiolipina, são quantitativos e servem para seguimento."], ["O que é o efeito prozona?", "Falso-negativo no VDRL por excesso de anticorpos, que impede a floculação, típico da sífilis secundária. Resolve-se diluindo a amostra."], ["Gestante com teste rápido de sífilis reagente: qual a conduta?", "Iniciar o tratamento imediatamente, sem esperar o VDRL, e colher VDRL para titulação basal e seguimento."], ["Como se trata a sífilis recente (primária, secundária ou latente recente)?", "Penicilina G benzatina 2,4 milhões UI por via intramuscular em dose única (1,2 milhão em cada glúteo)."], ["Como se trata a sífilis tardia ou de duração desconhecida?", "Penicilina G benzatina 2,4 milhões UI por semana durante 3 semanas. A neurossífilis exige penicilina cristalina intravenosa."], ["O que é a reação de Jarisch-Herxheimer?", "Reação febril com calafrios, cefaleia e mialgia nas primeiras 24 horas após a penicilina, pela lise maciça de treponemas. Não é alergia e não contraindica continuar o tratamento."], ["O que fazer com gestante alérgica à penicilina?", "Dessensibilizar em ambiente hospitalar e tratar com penicilina benzatina, a única droga que trata adequadamente o feto."], ["Como se acompanha a resposta ao tratamento da sífilis?", "Com VDRL seriado (trimestral; mensal na gestante). Espera-se queda dos títulos em pelo menos duas diluições; elevação indica reinfecção ou falha."]], "tutoria-2-4": [["Quais são os parâmetros de normalidade do ciclo menstrual (FIGO)?", "Intervalo de 24 a 38 dias, duração de até 8 dias, ciclos regulares e volume que não prejudique a qualidade de vida (cerca de 5 a 80 mL)."], ["O que significa PALM no sistema PALM-COEIN?", "As causas estruturais: Pólipo, Adenomiose, Leiomioma e Malignidade/hiperplasia, que aparecem em exames de imagem ou histologia."], ["O que significa COEIN?", "As causas não estruturais: Coagulopatia, disfunção Ovulatória, causa Endometrial, Iatrogênica e Não classificada."], ["Qual o primeiro exame em mulher em idade reprodutiva com sangramento uterino anormal?", "O beta-hCG, para excluir gravidez e suas complicações."], ["Quais exames compõem a investigação inicial do SUA?", "Beta-hCG, hemograma e ferritina, TSH, prolactina conforme o quadro, coagulograma quando há suspeita e ultrassonografia transvaginal."], ["Quando suspeitar de coagulopatia como causa do SUA?", "Sangramento intenso desde a menarca, hemorragia pós-parto ou em cirurgias, sangramentos frequentes de gengiva ou nariz e história familiar. A doença de von Willebrand é a mais comum."], ["Qual o mecanismo do sangramento na disfunção ovulatória?", "Sem ovulação não há progesterona. O estrogênio sem oposição deixa o endométrio espesso e frágil, que descama de forma irregular. Causas: SOP, extremos da vida reprodutiva, tireoide, prolactina."], ["Quando indicar avaliação endometrial (biópsia) no SUA?", "A partir de 45 anos, ou antes disso quando há fatores de risco para hiperplasia (obesidade, anovulação crônica, estrogênio sem oposição) ou falha do tratamento clínico."], ["Qual a conduta no SUA agudo com instabilidade hemodinâmica?", "Estabilização (dois acessos calibrosos, cristaloides, hemoderivados), tamponamento com sonda de Foley e terapia clínica com ácido tranexâmico ou estrogênio venoso. Se refratário, curetagem, embolização ou histerectomia."], ["Qual a conduta no SUA agudo com estabilidade hemodinâmica?", "Tratamento hormonal em doses altas (contraceptivo combinado ou progestagênio) e/ou ácido tranexâmico, com reposição de ferro e investigação etiológica."], ["Como age o ácido tranexâmico no SUA?", "É antifibrinolítico: impede a ligação do plasminogênio à fibrina e estabiliza o coágulo, reduzindo o fluxo menstrual. Evitar em quem tem tromboembolismo ativo."], ["Como os AINEs reduzem o sangramento menstrual?", "Inibem a COX e as prostaglandinas endometriais, reduzindo o fluxo em parte e aliviando a dismenorreia."], ["Qual é a opção hormonal mais eficaz para SUA crônico?", "O DIU liberador de levonorgestrel, que atrofia o endométrio e reduz o fluxo em até cerca de 90%."], ["Qual o tratamento do leiomioma submucoso que causa sangramento?", "Miomectomia histeroscópica, sobretudo nos miomas FIGO 0 a 2."], ["Qual o tratamento do pólipo endometrial sintomático?", "Polipectomia por histeroscopia, com envio da peça para anatomopatológico."], ["Para quem serve a ablação endometrial?", "Para mulheres com prole completa, sem desejo reprodutivo, que falharam no tratamento clínico e sem suspeita de malignidade."], ["Quando a histerectomia é indicada no SUA?", "É o tratamento definitivo na falha das outras opções, em mulheres com prole completa, ou na presença de malignidade."], ["Como repor ferro na anemia por SUA?", "Sulfato ferroso por via oral (pode ser em dias alternados para melhorar tolerância). Ferro venoso se houver intolerância, má absorção ou anemia grave."], ["O que deve acontecer após a alta da emergência por SUA agudo?", "Seguimento ambulatorial para completar a investigação pelo PALM-COEIN, manter tratamento de manutenção e tratar a anemia."], ["Qual o papel da equipe multiprofissional no cuidado do SUA?", "A APS coordena o cuidado. Enfermagem acolhe e orienta o diário menstrual, nutrição trata a anemia, farmácia avalia interações e risco tromboembólico, psicologia e serviço social apoiam o impacto na vida."], ["O que define amenorreia pela FIGO?", "Ausência de sangramento por 90 dias ou mais."]]};
function fcShuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function fcEsc(s){ return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function flashRender(host, id, titulo){
  const all = FLASH[id] || [];
  let deck = [], i = 0;
  host.innerHTML = `<div class="fc"><div class="fc-k">Flashcards · ${fcEsc(titulo)}</div>
    <p class="fc-intro" style="margin-top:10px">${all.length} cartões sobre este tema. A cada clique em “Gerar flashcards” eles vêm em uma ordem diferente. Toque no cartão para ver a resposta.</p>
    <button class="fc-gen" type="button">Gerar flashcards</button><div class="fc-run"></div></div>`;
  const run = host.querySelector(".fc-run"), gen = host.querySelector(".fc-gen");
  function draw(){
    if (i >= deck.length){
      run.innerHTML = `<div class="fc-end"><b>Fim do baralho.</b><span class="fc-intro">Você passou pelos ${deck.length} cartões. Gere de novo para embaralhar.</span></div>`;
      gen.textContent = "Gerar flashcards de novo"; return;
    }
    const [q, a] = deck[i];
    run.innerHTML = `<div class="fc-card" tabindex="0" role="button" aria-label="Virar cartão"><div class="fc-in">
        <div class="fc-face fc-front"><span class="lab">Pergunta</span><span class="tx">${fcEsc(q)}</span><span class="hint">Toque para ver a resposta</span></div>
        <div class="fc-face fc-back"><span class="lab">Resposta</span><span class="tx">${fcEsc(a)}</span><span class="hint">Toque para voltar à pergunta</span></div></div></div>
      <div class="fc-bar"><button class="ghost fc-prev" type="button">← Anterior</button><span class="fc-cnt">${i + 1} de ${deck.length}</span><button class="ghost fc-next" type="button">Próximo →</button></div>
      <div class="fc-prog"><i style="width:${(i + 1) / deck.length * 100}%"></i></div>`;
    const card = run.querySelector(".fc-card");
    const flip = ()=>card.classList.toggle("flip");
    card.addEventListener("click", flip);
    card.addEventListener("keydown", e=>{ if (e.key === " " || e.key === "Enter"){ e.preventDefault(); flip(); } });
    run.querySelector(".fc-prev").disabled = i === 0;
    run.querySelector(".fc-prev").addEventListener("click", ()=>{ if (i > 0){ i--; draw(); } });
    run.querySelector(".fc-next").addEventListener("click", ()=>{ i++; draw(); });
    card.focus({preventScroll:true});
  }
  gen.addEventListener("click", ()=>{ deck = fcShuffle(all); i = 0; host.querySelector(".fc-intro").hidden = true; gen.textContent = "Embaralhar de novo"; draw(); });
}
document.addEventListener("keydown", e=>{
  const run = document.querySelector(".fc-run"); if (!run || !run.offsetParent) return;
  if (e.key === "ArrowRight") run.querySelector(".fc-next")?.click();
  if (e.key === "ArrowLeft") run.querySelector(".fc-prev")?.click();
});
/* Abas "Conteúdo | Flashcards" no leitor (Tutoria, Morfologia, Fisiologia) */
function flashTabs(id, titulo){
  const doc = document.getElementById("doc"), reader = document.getElementById("reader");
  reader.classList.remove("fc-mode");
  if (!(FLASH[id] || []).length) return;
  const body = document.createElement("div"); body.className = "fc-body";
  while (doc.firstChild) body.appendChild(doc.firstChild);
  const seg = document.createElement("div"); seg.className = "fc-seg"; seg.setAttribute("role", "group"); seg.setAttribute("aria-label", "Modo");
  seg.innerHTML = `<button type="button" data-m="c" aria-pressed="true">Conteúdo</button><button type="button" data-m="f" aria-pressed="false">Flashcards</button>`;
  const pane = document.createElement("div"); pane.className = "fc-pane"; pane.hidden = true;
  doc.append(seg, body, pane);
  seg.querySelectorAll("button").forEach(b=>b.addEventListener("click", ()=>{
    const f = b.dataset.m === "f";
    seg.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed", String(x === b)));
    body.hidden = f; pane.hidden = !f; reader.classList.toggle("fc-mode", f);
    if (f && !pane.firstChild) flashRender(pane, id, titulo);
    window.scrollTo({top:0});
  }));
}

/* Leitura */
let spy = null;
function openR(id){
  const r = ROTEIROS.find(x=>x.id===id); if (!r) return;
  const doc = $("doc"), tl = $("tocList"); tl.innerHTML = "";
  const addToc = (txt, cls, target)=>{
    const li = document.createElement("li"), a = document.createElement("a");
    a.href = "#"; a.textContent = txt; a.className = cls; a._t = target;
    a.addEventListener("click", e=>{ e.preventDefault(); a._t(); $("toc").classList.remove("open"); $("tocBtn").setAttribute("aria-expanded","false"); });
    li.appendChild(a); tl.appendChild(li); return a;
  };
  if (r.pages){
    doc.className = "doc pages"; doc.innerHTML = "";
    r.pages.forEach((src,i)=>{ const im = document.createElement("img"); im.className = "pg"; im.id = "pg" + (i+1); im.loading = i < 2 ? "eager" : "lazy";
      im.alt = r.sp + " · página " + (i+1); im.src = src; im.addEventListener("click", ()=>zoom(src)); doc.appendChild(im); });
    r.toc.forEach(h=>addToc(h.t, h.lvl === 3 ? "h3" : "h2", ()=>{
      const im = $("pg" + h.page); const top = im.getBoundingClientRect().top + window.scrollY + im.offsetHeight * h.y - 16;
      window.scrollTo({top: Math.max(0, top), behavior:"smooth"}); }));
  } else {
    doc.className = "doc";
    doc.innerHTML = `<header class="doc-head"><div class="kicker"></div><h1></h1><p></p></header>` + r.html;
    doc.querySelector(".kicker").textContent = r.sp;
    doc.querySelector("h1").textContent = r.titulo;
    doc.querySelector(".doc-head p").textContent = r.subtitulo;
    doc.querySelectorAll("h2,h3").forEach((h,i)=>{ if (!h.id) h.id = "s" + i;
      addToc(h.textContent, h.tagName.toLowerCase(), ()=>h.scrollIntoView({behavior:"smooth", block:"start"}))._h = h; });
  }
  flashTabs(r.id, r.sp + " · " + r.titulo);
  $("lib").hidden = true; $("reader").hidden = false; window.scrollTo({top:0});
  try { history.replaceState(null, "", "#" + id); } catch(e){}
  if (spy) spy.disconnect();
  if (r.pages) return;
  const links = [...tl.querySelectorAll("a")];
  spy = new IntersectionObserver(es=>{
    es.forEach(en=>{ if (en.isIntersecting){ links.forEach(a=>a.classList.toggle("on", a._h===en.target)); } });
  }, {rootMargin:"0px 0px -75% 0px"});
  doc.querySelectorAll("h2,h3").forEach(h=>spy.observe(h));
}
$("backLib").addEventListener("click", ()=>{ $("reader").hidden = true; $("lib").hidden = false; window.scrollTo({top:0}); try { history.replaceState(null, "", location.pathname + location.search); } catch(e){} });
$("tocBtn").addEventListener("click", ()=>{ const o = $("toc").classList.toggle("open"); $("tocBtn").setAttribute("aria-expanded", o ? "true" : "false"); });
function zoom(src){ $("zoomImg").src = src; $("zoom").hidden = false; $("zoomX").hidden = false; $("zoom").scrollTo(0,0); }
function unzoom(){ $("zoom").hidden = true; $("zoomX").hidden = true; }
$("zoom").addEventListener("click", unzoom); $("zoomX").addEventListener("click", unzoom);
document.addEventListener("keydown", e=>{ if (e.key === "Escape") unzoom(); });
const start = location.hash.slice(1);
if (start && ROTEIROS.some(r=>r.id===start)) openR(start);
</script>
