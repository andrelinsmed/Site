s de <strong>serina/treonina<\/strong> em vez de tirosina. Essa modificação conformacional bloqueia a cascata da PI3K/Akt, impedindo que as vesículas de GLUT4 sejam translocadas para a superfície celular. O resultado é uma acentuada redução da captação de glicose pós-prandial pela musculatura esquelética materna.<\/p>\n<h3 class=\"hb\" style=\"--c:#3c78d8;--hb:#c9daf8;\">3. Falência Relativa das Células Beta Pancreáticas: O Ponto de Ruptura<\/h3>\n<p>Em gestantes metabolicamente normais, o pâncreas compensa essa queda de 50% a 70% na sensibilidade à insulina periférica duplicando ou triplicando a sua produção basal e pós-prandial de insulina (hiperinsulinemia compensatória), processo mediado por proliferação, hiperplasia e hipertrofia das células beta sob a influência da prolactina e de incretinas (GLP-1). No DMG, essa reserva biológica é insuficiente. A gestante possui uma suscetibilidade prévia — muitas vezes silenciosa — de defeito funcional ou de depleção na massa de células beta, ligada a variantes genéticas poligênicas (semelhantes às do diabetes tipo 2), estresse crônico do retículo endoplasmático e disfunção mitocondrial. Incapaz de acompanhar a curva de demanda hormonal contrarreguladora, o pâncreas entra em falência relativa: a secreção insulínica não supera a resistência periférica, culminando no extravasamento e acúmulo de glicose no compartimento intravascular e determinando a hiperglicemia materna mantida.<\/p>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#a4c2f4;\">Repercussões Fisiopatológicas no Binômio Mãe-Feto (A Hipótese de Pedersen)<\/h3>\n<p>A compreensão das consequências clínicas do DMG apoia-se classicamente na hipótese formulada por Jørgen Pedersen, ampliada pela endocrinologia perinatal moderna. A glicose materna atravessa a barreira hematoplacentária por meio de difusão facilitada contínua, mediada por carreadores independentes de insulina da família GLUT (preponderantemente GLUT1 sinciciotrofoblástico). Em contrapartida, a insulina materna é uma macromolécula de alto peso molecular e não é capaz de ultrapassar a membrana placentária.<\/p>\n<p>Diante da hiperglicemia materna, o feto recebe uma sobrecarga ininterrupta de glicose e de outros substratos (aminoácidos e ácidos graxos livres). A partir da 10ª-12ª semana, o pâncreas fetal já é metabolicamente autônomo e plenamente funcional. Ao ser inundado por concentrações suprafisiológicas de glicose na circulação da veia umbilical, o pâncreas fetal responde com hiperplasia das ilhotas de Langerhans e secreção massiva de insulina endógena, desencadeando um quadro de <strong>hiperinsulinismo fetal reativo<\/strong>.<\/p>\n<p>A insulina atua no organismo fetal como o principal hormônio anabólico e fator de crescimento tecidual intrauterino (atuando de forma sinérgica com os fatores de crescimento semelhantes à insulina, IGF-1 e IGF-2):<\/p>\n<ul>\n<li><mark style=\"--m:#c9daf8\"><span class=\"cc\" style=\"--c:#3c78d8\"><strong>Crescimento Somático Desproporcional e Macrossomia:<\/strong><\/span><\/mark> Ocorre estímulo desmedido da lipogênese no tecido adiposo subcutâneo e da síntese proteica no músculo esquelético e órgãos viscerais, gerando organomegalia (hepatomegalia, esplenomegalia e hipertrofia do septo interventricular miocárdico) e peso fetal estimado igual ou superior a 4.000 g (ou peso acima do percentil 90 para a idade gestacional - grande para a idade gestacional - GIG). Ocorre deposição desproporcional de gordura no segmento cefálico e escapular, aumentando a circunferência abdominal e a biacromial, substrato anatômico do temido tocotraumatismo da <strong>distócia de espáduas<\/strong> durante o parto vaginal.<\/li>\n<li><mark style=\"--m:#c9daf8\"><span class=\"cc\" style=\"--c:#3c78d8\"><strong>Hipóxia Intrauterina e Policitemia:<\/strong><\/span><\/mark> O hiperinsulinismo e o excesso de glicose aceleram a taxa metabólica basal e o consumo de oxigênio pelo feto em até 20% a 30%. Quando a oferta de oxigênio placentário se torna limitante, instala-se hipóxia tecidual crônica relativa, estimulando a liberação renal fetal de eritropoietina. O feto passa a produzir hemácias em excesso, culminando em policitemia fetal (hematócrito elevado) e hiperviscosidade sanguínea.<\/li>\n<li><mark style=\"--m:#c9daf8\"><span class=\"cc\" style=\"--c:#3c78d8\"><strong>Hiperbilirrubinemia Neonatal:<\/strong><\/span><\/mark> O excesso de hemácias circulantes associado à lise eritrocitária aumentada no período pós-parto e à imaturidade relativa da enzima hepática glicuroniltransferase fetal sobrecarrega o metabolismo da bilirrubina, deflagrando icterícia neonatal acentuada.<\/li>\n<li><mark style=\"--m:#c9daf8\"><span class=\"cc\" style=\"--c:#3c78d8\"><strong>Inibição da Maturação Pulmonar:<\/strong><\/span><\/mark> O hiperinsulinismo fetal exerce um bloqueio transcricional direto sobre a maturação dos pneumócitos tipo II, inibindo o estímulo fisiológico dos glicocorticoides endógenos sobre as enzimas responsáveis pela biossíntese da dipalmitoilfosfatidilcolina (lecitina), principal fosfolipídio do surfactante pulmonar. Isso explica por que recém-nascidos de mães com DMG, mesmo quando nascidos em idades gestacionais próximas ao termo (37 a 38 semanas), exibem risco aumentado de Síndrome do Desconforto Respiratório do Recém-Nascido (doença da membrana hialina).<\/li>\n<li><mark style=\"--m:#c9daf8\"><span class=\"cc\" style=\"--c:#3c78d8\"><strong>Hipoglicemia Neonatal Precoce:<\/strong><\/span><\/mark> No clampeamento imediato do cordão umbilical ao nascimento, a fonte contínua de glicose materna é abruptamente interrompida. Contudo, os níveis circulantes de insulina fetal permanecem criticamente elevados nas primeiras horas de vida extrauterina. Essa desproporção drena rapidamente a glicose circulante para o interior das células musculares e hepáticas do neonato, enquanto bloqueia a glicogenólise e a gliconeogênese, provocando hipoglicemias sintomáticas profundas (glicemia capilar abaixo de 40 a 45 mg/dL) com risco iminente de convulsões, dano hipóxico-isquêmico neuronal e parada cardiorrespiratória.<\/li><\/ul>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#a4c2f4;\">Fatores de Risco Clínicos e Epidemiológicos<\/h3>\n<p>A probabilidade de uma gestante desenvolver DMG é modulada por um conjunto de determinantes genéticos, constitucionais, sociodemográficos e comportamentais. O rastreamento universal — adotado pelo SUS e preconizado pela FEBRASGO e Ministério da Saúde — baseia-se no fato de que aproximadamente metade das mulheres diagnosticadas com DMG não preenche nenhum dos critérios de risco clássicos isolados. Não obstante, a identificação dos fatores de risco na primeira consulta de pré-natal permite antecipar cuidados dietéticos, estratificar o risco global e interpretar achados laboratoriais duvidosos.<\/p>\n<p>Os fatores de risco categorizam-se em:<\/p>\n<h3 class=\"hb\" style=\"--c:#3c78d8;--hb:#c9daf8;\">1. Características Antropométricas e Metabólicas Maternas Prévias<\/h3>\n<ul>\n<li><strong>Sobrepeso e Obesidade Pré-Gestacionais:<\/strong> O Índice de Massa Corporal (IMC) pré-gravídico igual ou superior a 25 kg/m² (sobrepeso) ou igual ou superior a 30 kg/m² (obesidade) duplica a triplica o risco relativo de DMG. O tecido adiposo hipertrofiado funciona como um órgão endócrino inflamatório que já mantém um estado de resistência insulínica e hiperinsulinemia de base antes mesmo da implantação da placenta.<\/li>\n<li><strong>Ganho Ponderal Excessivo na Gestação Atual:<\/strong> O acúmulo acelerado de massa adiposa durante o primeiro e segundo trimestres, superando as metas das curvas de ganho de peso recomendadas para a faixa de IMC basal, sobrecarrega precocemente a capacidade adaptativa pancreática.<\/li>\n<li><strong>Idade Materna Avançada:<\/strong> Idade materna igual ou superior a 35 anos (e com risco gradualmente crescente a partir dos 25 anos), decorrente do envelhecimento fisiológico das células beta das ilhotas e da perda progressiva da plasticidade metabólica periférica.<\/li>\n<li><strong>Síndrome dos Ovários Policísticos (SOP):<\/strong> Distúrbio neuroendócrino intrinsecamente ligado a defeitos pós-receptor de sinalização insulínica e hiperandrogenismo, elevando o risco de DMG em até três a quatro vezes.<\/li>\n<li><strong>Acantose Nigricans:<\/strong> A presença de hiperpigmentação e espessamento aveludado na pele das dobras cutâneas (região posterior do pescoço, axilas e virilha), traduzindo marcador clínico cutâneo visível de resistência insulínica e hiperinsulinemia crônica em circulação.<\/li><\/ul>\n<h3 class=\"hb\" style=\"--c:#3c78d8;--hb:#c9daf8;\">2. Histórico Familiar e Antecedentes Reprodutivos e Obstétricos<\/h3>\n<ul>\n<li><strong>Histórico Familiar de Diabetes:<\/strong> Parente de primeiro grau (mãe, pai ou irmãos) com diagnóstico de Diabetes Mellitus tipo 2, refletindo uma carga genética compartilhada de suscetibilidade a defeitos poligênicos na secreção ou ação da insulina.<\/li>\n<li><strong>Antecedente Pessoal de DMG em Gestação Anterior:<\/strong> Pacientes que apresentaram DMG em gestações prévias têm probabilidade de recorrência superior a 30% a 50% nas gestações subsequentes, sinalizando baixa reserva de células beta frente ao estresse gravídico.<\/li>\n<li><strong>Histórico de Macrossomia Fetal Prévia:<\/strong> Antecedente de nascimento de concepto prévio com peso ao nascer igual ou superior a 4.000 g (ou peso compatível com feto grande para a idade gestacional - GIG).<\/li>\n<li><strong>Mortalidade Perinatal sem Causa Aparente:<\/strong> Antecedente de natimorto ou óbito neonatal precoce inexplicado em gravidez anterior, com frequência secundário a episódios não diagnosticados de acidose metabólica ou hipóxia intrauterina decorrente de disglicemia materna.<\/li>\n<li><strong>História de Pré-Eclâmpsia ou Hipertensão Arterial Sistêmica Prévias:<\/strong> As disfunções microvasculares e a inflamação endotelial crônica compartilham vias fisiopatológicas com a resistência periférica à insulina.<\/li><\/ul>\n<h3 class=\"hb\" style=\"--c:#3c78d8;--hb:#c9daf8;\">3. Condições Étnicas, Ambientais e Clínicas Intercorrentes<\/h3>\n<ul>\n<li><strong>Etnia e Carga Genética:<\/strong> Populações com ancestralidade de maior risco metabólico, incluindo hispânicos, afrodescendentes, indígenas, sul-asiáticos e nativos das ilhas do Pacífico.<\/li>\n<li><strong>Uso Contínuo de Fármacos Hiperglicemiantes:<\/strong> Uso prévio ou contínuo de corticosteroides exógenos, antirretrovirais (inibidores de protease) ou antipsicóticos atípicos.<\/li>\n<li><strong>Macrossomia Fetal ou Polidrâmnio na Gestação em Curso:<\/strong> A constatação ultrassonográfica de feto com biometria desproporcional (especialmente aumento da circunferência abdominal acima do percentil 90) ou a presença de volume de líquido amniótico aumentado (Índice de Líquido Amniótico - ILA superior a 24 cm ou maior bolsão vertical superior a 8 cm), desencadeada pela diurese osmótica fetal decorrente da hiperglicemia fetal.<\/li><\/ul>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#a4c2f4;\">Resumo Estruturado: O Eixo Fisiopatológico e os Fatores de Risco do DMG<\/h3>\n<p>A tabela a seguir consolida a correlação entre a cascata fisiopatológica, os fatores determinantes e as repercussões clínicas observadas:<\/p>\n<div class=\"tbl\"><table><tr><th><strong>Nível <\/strong> <strong>Fisiopatológico<\/strong><\/th><th><strong>Mediadores <\/strong> <strong>e <\/strong> <strong>Mecanismos<\/strong><\/th><th><strong>Fatores <\/strong> <strong>de <\/strong> <strong>Risco <\/strong> <strong>Correlacionados<\/strong><\/th><th><strong>Repercussão <\/strong> <strong>Clínica <\/strong> <strong>/ <\/strong> <strong>Desfecho<\/strong><\/th><\/tr><tr><td><strong>Placentário <\/strong> <strong>/ <\/strong> <strong>Hormonal<\/strong><\/td><td>Secreção massiva de hPL, PGH, cortisol, progesterona, prolactina e TNF-alfa a partir da 20ª-24ª semana.<\/td><td>Idade materna avançada (&gt;= 35 anos); gestações múltiplas (maior massa trofoblástica).<\/td><td>Instalação obrigatória de resistência periférica à insulina em todas as gestantes saudáveis.<\/td><\/tr><tr><td><strong>Celular Periférico <\/strong> <strong>(Músculo <\/strong> <strong>e <\/strong> <strong>Adipócito)<\/strong><\/td><td>Fosforilação anômala em serina do IRS-1; inibição da via PI3K/Akt; bloqueio da translocação do transportador GLUT4.<\/td><td>Obesidade pré-gestacional (IMC &gt;= 30 kg/m²); ganho de peso excessivo; SOP; acantose nigricans.<\/td><td>Redução drástica da captação de glicose muscular; hiperglicemia materna mantida pós-prandial.<\/td><\/tr><tr><td><strong>Pancreático <\/strong> <strong>Materno<\/strong><\/td><td>Esgotamento funcional das células beta; incapacidade de manter hiperinsulinemia compensatória reflexa.<\/td><td>Histórico familiar de DM2 (parentes de 1º grau); antecedentes pessoais de DMG em gestações prévias.<\/td><td>Descompasso secreção/demanda; instalação diagnóstica do Diabetes Gestacional (jejum &gt;= 92 mg/dL).<\/td><\/tr><tr><td><strong>Feto-Placentário <\/strong> <strong>(Pedersen)<\/strong><\/td><td>Passagem de glicose por GLUT1; hiperglicemia fetal; hiperplasia de ilhotas e hiperinsulinismo fetal.<\/td><td>Macrossomia prévia; óbito fetal anterior inexplicado; polidrâmnio na gestação atual.<\/td><td>Macrossomia fetal, distócia de ombros, tocotraumatismos, hipóxia tecidual, policitemia e hiperbilirrubinemia.<\/td><\/tr><tr><td><strong>Pós-Parto <\/strong> <strong>Imediato <\/strong> <strong>(Neonato)<\/strong><\/td><td>Clampeamento abrupto do cordão interrompe aporte de glicose sob hiperinsulinemia fetal mantida.<\/td><td>DMG descompensado no termo; falta de controle glicêmico periparto.<\/td><td>Hipoglicemia neonatal grave sintomática; desconforto respiratório por bloqueio de surfactante.<\/td><\/tr><\/table><\/div>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#a4c2f4;\">Síntese Integradora<\/h3>\n<p>O Diabetes Mellitus Gestacional expõe de forma exemplar o equilíbrio tênue entre as modificações adaptativas gravídicas e a falência de reservas fisiológicas do organismo materno. A resistência insulínica constitui um artifício biológico desenhado pela evolução para garantir o desvio ininterrupto de energia para o concepto durante sua fase de crescimento acelerado. Todavia, quando esse estímulo hormonal placentário confronta um parênquima pancreático com reserva funcional reduzida ou vulnerável pela obesidade e fatores genéticos, a barreira do controle homeostático se rompe. Pela cascata de Pedersen, a hiperglicemia resultante transforma a placenta em uma fonte excessiva de nutrientes, forçando o feto a um anabolismo exacerbado cujos custos clínicos manifestam-se em macrossomia, hipóxia intrauterina, policitemia e hipoglicemia pós-parto imediata. Sob a ótica longitudinal, o DMG transcende a duração da gravidez: a puérpera tem um risco acumulado de até 50% de desenvolver diabetes mellitus tipo 2 ao longo dos 10 anos subsequentes, enquanto o concepto nasce metabolicamente programado com maior suscetibilidade à obesidade, síndrome metabólica e doença cardiovascular na idade adulta. O rastreamento universal rigoroso no pré-natal e o controle glicêmico assertivo representam, portanto, uma intervenção de alto valor preventivo intergeracional na saúde da mulher e da criança.<\/p>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#a4c2f4;\">Referências<\/h3>\n<ol>\n<li>1. BRASIL. Ministério da Saúde. Secretaria de Atenção Primária à Saúde. <strong>Manual de Gestação de Alto Risco<\/strong>. Brasília: Ministério da Saúde, 2022. Cap. 4: Diabetes Mellitus e Gestação, p. 112-138.<\/li>\n<li>2. BRASIL. Ministério da Saúde. Secretaria de Atenção Primária à Saúde. <strong>Rastreamento e Diagnóstico de Diabetes Mellitus Gestacional no Brasil<\/strong>. Brasília: Ministério da Saúde, 2017. Relatório Técnico Conjunto com OPAS/OMS, p. 1-32.<\/li>\n<li>3. FEDERAÇÃO BRASILEIRA DAS ASSOCIAÇÕES DE GINECOLOGIA E OBSTETRÍCIA (FEBRASGO). <strong>Tratado de Obstetrícia FEBRASGO<\/strong>. 1. ed. Rio de Janeiro: Elsevier, 2019. Cap. 44: Diabetes Mellitus na Gestação, p. 467-484.<\/li>\n<li>4. FEDERAÇÃO BRASILEIRA DAS ASSOCIAÇÕES DE GINECOLOGIA E OBSTETRÍCIA (FEBRASGO). <strong>Rastreamento e Diagnóstico do Diabetes Mellitus Gestacional<\/strong>. Manual de Orientação FEBRASGO, n. 11. São Paulo: FEBRASGO, 2021.<\/li>\n<li>5. SOCIEDADE BRASILEIRA DE DIABETES (SBD). <strong>Diretrizes da Sociedade Brasileira de Diabetes 2023-2024<\/strong>. São Paulo: Clannad, 2023. Cap. 14: Diagnóstico e Tratamento do Diabetes Gestacional, p. 280-295.<\/li>\n<li>6. CUNNINGHAM, F. G. et al. <strong>Williams Obstetrícia<\/strong>. 26. ed. Porto Alegre: AMGH (Artmed), 2022. Cap. 57: Diabetes Mellitus, p. 1025-1048.<\/li>\n<li>7. AMERICAN DIABETES ASSOCIATION (ADA). Standards of Care in Diabetes—2024. Chapter 15: Management of Diabetes in Pregnancy. <strong>Diabetes Care<\/strong>, v. 47, supl. 1, p. S282-S294, jan. 2024.<\/li><\/ol>\n<h2 class=\"hb\" style=\"--c:#1c4587;--hb:#6d9eeb;\">5- Explique a fisiopatologia e os fatores de risco das síndromes hipertensivas da gestação.<\/h2>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#a4c2f4;\">*Resumo*<\/h3>\n<p><strong>\"Se você quer entender a pré-eclâmpsia de verdade, esqueça a pressão alta por um segundo e olhe pra placenta.<\/strong> A raiz de tudo tá lá atrás, quando o trofoblasto falhou em invadir e alargar as artérias espiraladas da mãe. Em vez de virarem tubos largos e complacentes, os vasos continuam finos, musculosos e rígidos. O sangue chega na placenta espirrando feito mangueira apertada, a placenta sofre em hipóxia e, no desespero, começa a jogar 'veneno' no sangue da mãe na forma de fatores antiangiogênicos, especialmente o sFlt-1. Esse sFlt-1 sequestra o VEGF e o PlGF, que são literalmente os guardiões que mantêm os vasos sanguíneos da mãe vivos e saudáveis. Sem eles, o endotélio do corpo inteiro adoece: vaza líquido nos tecidos, as artérias entram em espasmo e a pressão explode. No rim, incha tanto o glomérulo que a albumina escapa na urina; no fígado, gera isquemia e consome plaqueta gerando HELLP; e no cérebro, a pressão quebra a barreira e o edema leva à convulsão da eclâmpsia. Por isso que a gente insiste tanto em caçar os fatores de risco logo na primeira consulta: prescrever aquele AAS com cálcio antes de 16 semanas é a nossa única chance real de intervir na raiz da placentação antes que esse dominó inteiro comece a cair.\"<\/p>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#a4c2f4;\">Introdução<\/h3>\n<p>As síndromes hipertensivas da gestação (SHG) figuram historicamente como a principal causa de morbimortalidade materna direta e perinatal no Brasil e em diversos países em desenvolvimento, além de responderem por parcelas expressivas de internações em terapia intensiva obstétrica e partos prematuros iatrogênicos. Sob o ponto de vista nosológico, o espectro abrange a Hipertensão Arterial Crônica (HAC), a Hipertensão Gestacional, a Pré-Eclâmpsia/Eclâmpsia e a Pré-Eclâmpsia sobreposta à Hipertensão Crônica. Embora compartilhem a elevação dos níveis tensionais (definida como pressão arterial sistólica igual ou superior a 140 mmHg e/ou diastólica igual ou superior a 90 mmHg, confirmada em pelo menos duas aferições com intervalo mínimo de 4 horas), a pré-eclâmpsia representa a entidade de maior complexidade sistêmica. Longe de constituir uma simples alteração hemodinâmica isolada, a pré-eclâmpsia é uma síndrome multissistêmica progressiva decorrente de disfunção endotelial materna generalizada deflagrada por fatores antiangiogênicos de origem placentária, cuja compreensão fisiopatológica evoluiu do antigo modelo vasospástico puro para uma intrincada cascata biológica dividida em dois estágios interligados.<\/p>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#a4c2f4;\">Fisiopatologia da Pré-Eclâmpsia: O Modelo dos Dois Estágios<\/h3>\n<p>A patogênese clássica da pré-eclâmpsia desdobra-se temporalmente e mecanisticamente em dois momentos concatenados: o primeiro estágio, caracterizado pelo defeito de placentação e invasão trofoblástica incompleta na decídua uterina; e o segundo estágio, marcado pelo estresse sinciciotrofoblástico, liberação de mediadores antiangiogênicos na circulação materna e lesão endotelial sistêmica difusa.<\/p>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#a4c2f4;\">Estágio 1: Placentação Anômala e Falha na Remodelação das Artérias Espiraladas<\/h3>\n<p>Na gestação fisiológica normal, o citotrofoblasto extraviloso promove duas ondas sucessivas de invasão endovascular: a primeira, entre a 10ª e a 12ª semana, coloniza os segmentos deciduais das artérias espiraladas maternas; a segunda, entre a 16ª e a 20ª semana, atinge os segmentos miometriais dessas artérias. Durante essa invasão, o trofoblasto sofre um processo de \"pseudo-vasculogênese\" (adotando um fenótipo semelhante ao endotelial), degrada a lâmina elástica interna e substitui a camada muscular lisa da túnica média arterial por uma matriz fibrinoide acelular. Essa profunda transformação arquitetural converte pequenos vasos musculares de alta resistência, estreitos e vasorreativos em condutos de alto calibre, tortuosos, complacentes e de baixa resistência, assegurando fluxo sanguíneo abundante e contínuo ao espaço interviloso independentemente do tônus vasomotor materno.<\/p>\n<p>Na pré-eclâmpsia, ocorre uma falha na segunda onda de invasão trofoblástica, predominantemente restrita aos segmentos miometriais das artérias espiraladas. Esse defeito primário é mediado por uma desregulação imuno-tolerogênica materno-fetal: falhas no reconhecimento entre os receptores KIR (<em>Killer Immunoglobulin-like Receptors<\/em>) das células <em>natural killer<\/em> uterinas (uNK) maternas e os antígenos leucocitários humanos de histocompatibilidade do feto (especialmente HLA-C do trofoblasto invasor), somadas a um perfil de citocinas pró-inflamatórias (desvio da resposta imune Th2 para Th1/Th17). Como resultado, apenas 30% a 50% das artérias espiraladas sofrem transformação, e aquelas que a sofrem preservam sua túnica muscular e lâmina elástica nos segmentos profundos do miométrio. Os vasos permanecem estreitos, rígidos e hiper-reativos a substâncias vasoativas, determinando um fluxo sanguíneo intermitente, turbulento e de alta velocidade para o espaço interviloso, o qual causa lesão por cisalhamento mecânico nas vilosidades coriônicas.<\/p>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#a4c2f4;\">Estágio 2: Isquemia Placentária, Desbalanço Angiogênico e Disfunção Endotelial Sistêmica<\/h3>\n<p>O suprimento sanguíneo turbulento e insuficiente gera hipóxia tecidual e episódios cíclicos de isquemia-reperfusão no leito placentário. Esse ambiente deflagra estresse oxidativo maciço no sinciciotrofoblasto, com produção exacerbada de espécies reativas de oxigênio (EROs), disfunção mitocondrial, estresse de retículo endoplasmático e autofagia defeituosa. Em resposta a essa sobrecarga hipóxica e inflamatória, o sinciciotrofoblasto passa a secretar na corrente sanguínea materna grandes quantidades de debris celulares, micropartículas sinciciais, citocinas inflamatórias (TNF-alfa, IL-6) e, criticamente, fatores antiangiogênicos solúveis que sequestram fatores promotores da homeostase vascular:<\/p>\n<ul>\n<li><strong>sFlt-1 (<\/strong><em><strong>soluble fms-like tyrosine kinase-1<\/strong><\/em><strong>):<\/strong> Uma variante solúvel truncada do receptor do fator de crescimento endotelial vascular tipo 1 (VEGFR-1). O sFlt-1 liga-se com alta afinidade e neutraliza na circulação tanto o VEGF (<em>Vascular Endothelial Growth Factor<\/em>) quanto o PlGF (<em>Placental Growth Factor<\/em>), impedindo sua ancoragem aos receptores endoteliais transmembrana e bloqueando suas vias de sinalização essenciais de proliferação celular, sobrevivência e liberação contínua de óxido nítrico e prostaciclina (PGI₂).<\/li>\n<li><strong>sEng (<\/strong><em><strong>soluble Endoglin<\/strong><\/em><strong>):<\/strong> Um correceptor solúvel para o fator de crescimento transformador beta (TGF-beta 1 e 3), que atua de forma sinérgica com o sFlt-1 bloqueando a angiogênese dependente de TGF-beta e inibindo a síntese endotelial da óxido nítrico sintase endotelial (eNOS).<\/li><\/ul>\n<p>A depleção sistêmica de VEGF e PlGF livres quebra o equilíbrio angiogênico corporal, instalando um estado de <strong>disfunção endotelial materna generalizada<\/strong>. Privadas de estímulos pró-sobrevida, as células endoteliais sofrem dano estrutural, retração juncional e apoptose. Isso acarreta a perda da barreira de permeabilidade vascular (extravasamento plasmático e edema), ativação intrínseca da cascata de coagulação com consumo plaquetário periférico (deposição subendotelial de microtrombos de fibrina) e perda do tônus vasodilatador basal (predomínio de tromboxano A₂ e endotelina-1 sobre prostaciclina e óxido nítrico). A vasoconstrição arteriolar generalizada e o aumento drástico da resistência vascular sistêmica sustentam a elevação sustentada da pressão arterial materna.<\/p>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#a4c2f4;\">Repercussões em Órgãos-Alvo e Fisiopatologia das Complicações Graves<\/h3>\n<p>A disfunção endotelial e o vasoespasmo disseminado atingem de forma heterogênea os leitos vasculares mais suscetíveis do organismo materno:<\/p>\n<ul>\n<li><strong>Rim (Endoteliose Capilar Glomerular e Proteinúria):<\/strong> O rim depende criticamente do VEGF sintetizado pelos podócitos para manter as fenestrações do endotélio glomerular intactas. O bloqueio de VEGF pelo sFlt-1 induz o edema citoplasmático e tumefação das células endoteliais glomerulares, com oclusão dos lúmens capilares e perda das fendas de filtração — lesão histopatológica clássica denominada <strong>endoteliose capilar glomerular<\/strong>. Ocorre diminuição da taxa de filtração glomerular (TFG), elevação da creatinina sérica e retenção de sódio e ácido úrico. A perda da seletividade da barreira podocitária permite o extravasamento maciço de albumina para o espaço urinário, configurando a proteinúria (igual ou superior a 300 mg em urina de 24 horas ou relação proteína/creatinina urinária igual ou superior a 0,3 mg/mg).<\/li>\n<li><strong>Fígado (Isquemia Hepática e Síndrome HELLP):<\/strong> O vasoespasmo dos ramos da artéria hepática e a deposição de fibrina nos sinusoides promovem hipóxia celular, congestão e necrose hepatocitária periportal. Essa lesão expressa-se clinicamente pela elevação de transaminases (TGO/AST e TGP/ALT acima do dobro do limite de normalidade) e distensão da cápsula de Glisson por hematoma subcapsular ou edema, provocando dor em epigástrio ou hipocôndrio direito. A progressão desse processo microtrombótico sinusoide associa-se à <strong>Síndrome HELLP<\/strong> (<em>Hemolysis, Elevated Liver enzymes, Low Platelets<\/em>), caracterizada por:\n<ul>\n<li><em>Hemólise microangiopática:<\/em> Fragmentação mecânica das hemácias ao colidirem com os microtrombos de fibrina intravascular (esquizócitos no sangue periférico, bilirrubina indireta elevada e queda da haptoglobina);<\/li>\n<li><em>Elevação de enzimas hepáticas:<\/em> Decorrente da isquemia dos hepatócitos;<\/li>\n<li><em>Trombocitopenia:<\/em> Plaquetopenia inferior a 100.000/mm³ gerada pelo consumo acelerado de plaquetas nos sítios de endoteliopatia ativa.<\/li><\/ul><\/li>\n<li><strong>Sistema Nervoso Central (Eclâmpsia e Encefalopatia Hipertensiva):<\/strong> Níveis pressóricos elevados superam a capacidade de autorregulação miogênica do fluxo sanguíneo cerebral, enquanto as citocinas circulantes rompem as junções oclusivas (<em>tight junctions<\/em>) da barreira hematoencefálica. Instala-se hiperperfusão cerebral e edema vasogênico parieto-occipital — fisiopatologia análoga à Síndrome da Encefalopatia Posterior Reversível (PRES). Essa lesão manifesta-se clinicamente como escotomas cintilantes, turvação visual, amaurose, cefaleia refratária de padrão pulsátil e hiperreflexia tendinosa. A hiperexcitabilidade neuronal descompensada culmina nas convulsões tônico-clônicas generalizadas da <strong>eclâmpsia<\/strong>, que podem evoluir para acidente vascular cerebral hemorrágico ou coma.<\/li>\n<li><strong>Sistema Respiratório e Pulmões:<\/strong> A combinação de aumento da permeabilidade capilar alvéolo-intersticial por disfunção endotelial, elevação da pressão hidrostática intracapilar pós-carga e queda acentuada da pressão oncótica plasmática (pela proteinúria e hemodiluição) predispõe ao extravasamento de fluido para o espaço alveolar, precipitando <strong>edema agudo de pulmão<\/strong>.<\/li><\/ul>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#a4c2f4;\">Fatores de Risco Clínicos e Epidemiológicos<\/h3>\n<p>A ocorrência da pré-eclâmpsia depende da conjunção de vulnerabilidades imunológicas, genéticas, metabólicas e vasculares pré-existentes na mulher, as quais diminuem o limiar de tolerância ao estresse placentário. O Ministério da Saúde e a FEBRASGO classificam os fatores de risco em categorias de alto risco (risco elevado) e risco moderado, auxiliando na indicação de medidas profiláticas, como o ácido acetilsalicílico (AAS) e o carbonato de cálcio a partir do final do primeiro trimestre:<\/p>\n<h3 class=\"hb\" style=\"--c:#3c78d8;--hb:#c9daf8;\">1. Fatores de Alto Risco (Indicação isolada de profilaxia farmacológica com AAS)<\/h3>\n<ul>\n<li><strong>Histórico Pessoal de Pré-Eclâmpsia:<\/strong> Principal fator preditor isolado. Gestantes com histórico de pré-eclâmpsia em gestações anteriores têm risco de recorrência entre 15% e 20%, subindo para até 50% se a pré-eclâmpsia anterior tiver sido precoce (antes de 34 semanas) ou associada à síndrome HELLP.<\/li>\n<li><strong>Hipertensão Arterial Crônica (HAC):<\/strong> A presença de vasculopatia de base e hipertrofia da camada média das arteríolas dificulta a remodelação das artérias espiraladas e amplia o dano por cisalhamento, elevando em quatro a cinco vezes o risco de pré-eclâmpsia sobreposta.<\/li>\n<li><strong>Doença Renal Crônica:<\/strong> A disfunção endotelial renal e a perda prévia de néfrons reduzem a capacidade adaptativa do sistema hemodinâmico materno, cursando com sobrecarga volêmica acelerada e piora tensional precoce.<\/li>\n<li><strong>Diabetes Mellitus Pré-Gestacional (Tipo 1 ou Tipo 2):<\/strong> A hiperglicemia crônica, o estresse oxidativo basal e a glicação avançada de proteínas comprometem o endotélio vascular materno e a invasão trofoblástica, duplicando o risco de síndrome hipertensiva.<\/li>\n<li><strong>Doenças Autoimunes Sistêmicas (LES e Síndrome do Anticorpo Antifosfolipídeo - SAF):<\/strong> A presença de autoanticorpos (anticoagulante lúpico, anticardiolipina e anti-beta-2-glicoproteína-I) deflagra ativação do complemento, inibição da anexina V e trombose microvascular decidual, impedindo a angiogênese placentária e provocando infartos vilositários extensos.<\/li><\/ul>\n<h3 class=\"hb\" style=\"--c:#3c78d8;--hb:#c9daf8;\">2. Fatores de Risco Moderado (Associação de dois ou mais fatores indica profilaxia farmacológica)<\/h3>\n<ul>\n<li><strong>Primiparidade (Nuliparidade):<\/strong> A primeira exposição antigênica do sistema imunológico materno aos antígenos paternos do trofoblasto carece da tolerância imune adquirida em gestações prévias com o mesmo parceiro (ausência de células T reguladoras de memória específicas).<\/li>\n<li><strong>Nova Parceria Sexual e Intervalo Interpartal Prolongado:<\/strong> A troca de parceiro sexual reconfigura o perfil antigênico feto-placentário, comportando-se imunologicamente como uma primiparidade; similarmente, intervalos interpartais superiores a 5 ou 10 anos atenuam a memória imunológica tolerogênica decidual.<\/li>\n<li><strong>Idade Materna Avançada (igual ou superior a 35 anos) ou Extrema Juventude (menor de 15 anos):<\/strong> O envelhecimento vascular, aterosclerose subclínica e rigidez arterial nas mulheres mais velhas contrastam com a imaturidade vascular e do eixo reprodutivo nas adolescentes precoces.<\/li>\n<li><strong>Obesidade Pré-Gestacional (IMC igual ou superior a 30 kg/m²):<\/strong> O tecido adiposo hipertrofiado opera como uma fonte contínua de adipocinas pró-inflamatórias, citocinas (TNF-alfa) e radicais livres que já impõem disfunção endotelial e hiperativação simpática antes mesmo da fecundação.<\/li>\n<li><strong>Histórico Familiar de Pré-Eclâmpsia:<\/strong> Parente de primeiro grau (mãe ou irmã) com histórico da doença eleva o risco materno em duas a três vezes, refletindo suscetibilidade genética associada a polimorfismos da eNOS, do sistema renina-angiotensina e de moléculas de adesão.<\/li>\n<li><strong>Gestação Múltipla (Gemelaridade):<\/strong> O aumento proporcional da massa placentária eleva substancialmente a produção total e a concentração sérica circulante de sFlt-1 e sEng, gerando disfunção endotelial por sobrecarga mesmo na presença de uma invasão trofoblástica relativamente preservada.<\/li>\n<li><strong>Tecnologias de Reprodução Assistida:<\/strong> Procedimentos de fertilização <em>in vitro<\/em>, especialmente em ciclos com transferência de embriões congelados sem corpo lúteo espontâneo (ausência da síntese de relaxina e precursores vasoativos), duplicam a prevalência de pré-eclâmpsia.<\/li><\/ul>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#a4c2f4;\">Resumo Mecanístico e Classificatório das Síndromes Hipertensivas<\/h3>\n<p>A tabela abaixo resume as categorias clínicas das síndromes hipertensivas e o encadeamento fisiopatológico de seus principais desfechos:<\/p>\n<div class=\"tbl\"><table><tr><th><strong>Entidade <\/strong> <strong>/ <\/strong> <strong>Complicação<\/strong><\/th><th><strong>Mecanismo <\/strong> <strong>Fisiopatológico Central<\/strong><\/th><th><strong>Manifestação Clínica / <\/strong> <strong>Laboratorial Marcadora<\/strong><\/th><th><strong>Marcadores <\/strong> <strong>de <\/strong> <strong>Gravidade Associados<\/strong><\/th><\/tr><tr><td><strong>Hipertensão <\/strong> <strong>Arterial <\/strong> <strong>Crônica (HAC)<\/strong><\/td><td>Vasculopatia sistêmica prévia à gestação; rigidez arteriolar com disfunção adaptativa da pré-carga e pós-carga.<\/td><td>PA &gt;= 140/90 mmHg antes de 20 semanas ou persistindo além de 12 semanas pós-parto; sem proteinúria inicial.<\/td><td>Risco aumentado de sobreposição de pré-eclâmpsia e restrição de crescimento fetal intrauterino (RCIU).<\/td><\/tr><tr><td><strong>Hipertensão <\/strong> <strong>Gestacional<\/strong><\/td><td>Vasoconstrição e reatividade arteriolar aumentada sem dano endotelial inflamatório sistêmico significativo.<\/td><td>PA &gt;= 140/90 mmHg de início após a 20ª semana; ausência de proteinúria ou de disfunção de órgãos-alvo.<\/td><td>Risco de progressão para pré-eclâmpsia em até 25% a 50% dos casos; retorno à normotensão pós-parto.<\/td><\/tr><tr><td><strong>Pré-Eclâmpsia (PE)<\/strong><\/td><td>Invasão trofoblástica incompleta -&gt; isquemia placentária -&gt; excesso de sFlt-1/sEng -&gt; disfunção endotelial difusa.<\/td><td>PA &gt;= 140/90 mmHg após 20 semanas + Proteinúria (&gt;= 300 mg/24h ou relação P/C &gt;= 0,3) OU disfunção orgânica.<\/td><td>Creatinina &gt; 1,1 mg/dL, plaquetas &lt; 100.000/mm³, transaminases dobradas, sintomas visuais/neurológicos.<\/td><\/tr><tr><td><strong>Eclâmpsia<\/strong><\/td><td>Perda da autorregulação miogênica cerebral por picos pressóricos + quebra da barreira hematoencefálica (edema vasogênico).<\/td><td>Crises convulsivas tônico-clônicas generalizadas em gestante com pré-eclâmpsia (sem outra causa neurológica).<\/td><td>Risco de coma, acidente vascular cerebral (AVC), aspiração pulmonar e óbito materno-fetal.<\/td><\/tr><tr><td><strong>Síndrome HELLP<\/strong><\/td><td>Microangiopatia trombótica nos sinusoides hepáticos e leito capilar com anemia hemolítica microangiopática de consumo.<\/td><td>Esquizócitos no esfregaço, DHL &gt; 600 U/L, bilirrubina indireta alta + AST/ALT elevadas + plaquetas &lt; 100.000/mm³.<\/td><td>Hematoma subcapsular hepático, rotura hepática espontânea, hemorragia incoercível e choque.<\/td><\/tr><\/table><\/div>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#a4c2f4;\">Síntese Integradora<\/h3>\n<p>As síndromes hipertensivas da gestação corporificam a intersecção dinâmica entre biologia molecular, imunologia da reprodução e medicina cardiovascular materno-fetal. A pré-eclâmpsia, em especial, deve ser compreendida não como uma doença originária do endotélio materno, mas sim como uma desordem placentária que adoece secundariamente a circulação materna: a falha precoce na remodelagem das artérias espiraladas culmina em hipoperfusão do espaço interviloso, gerando uma placenta metabolicamente estressada que libera fatores antiangiogênicos (sFlt-1 e sEng) na corrente sanguínea. Esses fatores sequestram o VEGF e o PlGF, desarmando os mecanismos de manutenção endotelial e precipitando vasoespasmo, permeabilidade vascular aumentada e microtrombogênese em órgãos vitais como rins, fígado e cérebro.<\/p>\n<p>A identificação rigorosa dos fatores de risco na primeira consulta de pré-natal permite reconhecer as pacientes elegíveis para a profilaxia farmacológica primária preconizada pelas diretrizes vigentes — a saber, o uso de ácido acetilsalicílico (AAS em dose de 100 a 150 mg ao dia ao deitar) e suplementação de cálcio (1.000 a 1.500 mg ao dia) iniciados preferencialmente antes de 16 semanas de gestação. Essa intervenção terapêutica precoce atua prevenindo a agregação plaquetária nos vasos vilositários e reduzindo a incidência de pré-eclâmpsia precoce e restrição de crescimento fetal, mitigando os desfechos mais graves dessa síndrome na saúde coletiva.<\/p>\n<h3 class=\"hb\" style=\"--c:#1155cc;--hb:#a4c2f4;\">Referências<\/h3>\n<ol>\n<li>1. BRASIL. Ministério da Saúde. Secretaria de Atenção Primária à Saúde. <strong>Manual de Gestação de Alto Risco<\/strong>. Brasília: Ministério da Saúde, 2022. Cap. 2: Hipertensão Arterial e Síndromes Hipertensivas na Gestação, p. 79-111.<\/li>\n<li>2. FEDERAÇÃO BRASILEIRA DAS ASSOCIAÇÕES DE GINECOLOGIA E OBSTETRÍCIA (FEBRASGO). <strong>Tratado de Obstetrícia FEBRASGO<\/strong>. 1. ed. Rio de Janeiro: Elsevier, 2019. Cap. 45: Síndromes Hipertensivas na Gestação, p. 485-502.<\/li>\n<li>3. FEDERAÇÃO BRASILEIRA DAS ASSOCIAÇÕES DE GINECOLOGIA E OBSTETRÍCIA (FEBRASGO). <strong>Pré-eclâmpsia: Diagnóstico, Manejo e Prevenção<\/strong>. Protocolo FEBRASGO de Obstetrícia, n. 42. São Paulo: FEBRASGO, 2023.<\/li>\n<li>4. CUNNINGHAM, F. G. et al. <strong>Williams Obstetrícia<\/strong>. 26. ed. Porto Alegre: AMGH (Artmed), 2022. Cap. 47: Distúrbios Hipertensivos da Gestação, p. 850-880.<\/li>\n<li>5. REZENDE FILHO, J.; MONTENEGRO, C. A. B. <strong>Rezende Obstetrícia<\/strong>. 14. ed. Rio de Janeiro: Guanabara Koogan, 2022. Cap. 32: Doença Hipertensiva Específica da Gravidez, p. 545-568.<\/li>\n<li>6. RANA, S. et al. Preeclampsia: Pathophysiology, Challenges, and Perspectives. <strong>Circulation Research<\/strong>, v. 124, n. 7, p. 1094-1112, mar. 2019.<\/li>\n<li>7. AMERICAN COLLEGE OF OBSTETRICIANS AND GYNECOLOGISTS (ACOG). Gestational Hypertension and Preeclampsia: ACOG Practice Bulletin, Number 222. <strong>Obstetrics &amp; Gynecology<\/strong>, v. 135, n. 6, p. e237-e260, jun. 2020.<\/li><\/ol>"}, {"id": "tutoria-2-3", "num": "2.3", "sp": "Tutoria 2.3", "titulo": "Tricomoníase e sífilis", "subtitulo": "Tutoria 2.3 · objetivos de aprendizagem respondidos", "resumo": "Agentes etiológicos, fisiopatologia, manifestações, exames e tratamento.", "html": "<h2 class=\"hb\" style=\"--c:#274e13;--hb:#93c47d;\">1. Agentes Etiológicos e Relações com os Sítios de Infecção<\/h2>\n<p>A correta identificação dos agentes etiológicos das infecções sexualmente transmissíveis (ISTs) e o entendimento da sua afinidade tecidual são os pilares para compreender a história natural, a apresentação clínica e a resposta imune local. Tanto <em>Trichomonas vaginalis<\/em> quanto <em>Treponema pallidum<\/em> apresentam tropismos anatômicos e moleculares refinados, os quais delimitam não apenas os sítios primários de infecção, mas também as vias de disseminação sistêmica ou persistência local.<\/p>\n<h3 class=\"hb\" style=\"--c:#38761d;--hb:#b6d7a8;\">Trichomonas vaginalis e o Tropismo pelo Trato Geniturinário Inferior<\/h3>\n<p>O agente etiológico da tricomoníase é o <em>Trichomonas vaginalis<\/em>, um protozoário flagelado, eucarioto, anaeróbio facultativo, desprovido de mitocôndrias típicas (possuindo hidrogenossomos para o metabolismo energético por fermentação) e que existe unicamente na forma de trofozoíto, não formando cistos. Sua sobrevivência e patogenicidade estão estritamente vinculadas ao trato urogenital humano, que constitui seu único hospedeiro natural. Na anatomia ginecológica, os sítios preferenciais de colonização são a mucosa vaginal (especialmente o epitélio estratificado pavimentoso não queratinizado), a ectocérvix, as glândulas parauretrais (glândulas de Skene), as glândulas vestibulares maiores (de Bartholin) e a uretra.<\/p>\n<p>A restrição quase absoluta de <em>T. vaginalis<\/em> ao trato genital inferior decorre de exigências metabólicas e mecânicas específicas: o protozoário necessita de contato físico direto com as células epiteliais escamosas para aderir, fagocitar nutrientes e modular o microambiente. Em geral, ele é incapaz de ascender além do orifício externo do colo do útero em direção ao endométrio de forma sustentada, pois o epitélio colunar simples mucíparo e o muco endocervical espesso atuam como barreiras biológicas eficientes, embora sua ação enzimática inflamatória possa facilitar indiretamente a ascensão de outros patógenos bacterianos.<\/p>\n<h3 class=\"hb\" style=\"--c:#38761d;--hb:#b6d7a8;\">Treponema pallidum e a Capacidade de Invasão Tecidual Sistêmica<\/h3>\n<p>Em contrapartida, o agente da sífilis é o <em>Treponema pallidum<\/em> subespécie <em>pallidum<\/em>, uma espiroqueta delgada, microaerófila, de motilidade helicoidal vigorosa viabilizada por endoflagelos alojados no espaço periplasmático. Diferente do protozoário da tricomoníase, o treponema é um patógeno invasor primário e sistêmico. O sítio inicial de infecção localiza-se preferencialmente na pele ou mucosas íntegras ou microscopicamente escoriadas do trato genital externo (pequenos e grandes lábios, fúrcula vaginal, clitóris), canal vaginal, cérvix uterina, região perianal, reto ou orofaringe.<\/p>\n<p>A espiroqueta possui tropismo marcante pelas células endoteliais e pelo tecido conjuntivo perivascular. A sua capacidade de transpor barreiras epiteliais decorre de adesinas de superfície e da secreção de metaloproteinases e mucopolissacaridases, permitindo-lhe atravessar junções intercelulares. Logo após a penetração na lâmina própria do sítio mucoso ou cutâneo, o treponema ganha acesso aos capilares linfáticos e vasos sanguíneos da derme e submucosa. Assim, enquanto o sítio de infecção primário se expressa clinicamente na genitália, ocorre precocemente uma disseminação hematogênica silenciosa para virtualmente todos os órgãos e tecidos da economia corporal, incluindo baço, fígado, ossos, sistema nervoso central e placenta, caracterizando a sífilis desde suas fases iniciais como uma afecção multissistêmica.<\/p>\n<div class=\"tbl\"><table><tr><th><strong>Característica<\/strong><\/th><th><strong>Trichomonas vaginalis<\/strong><\/th><th><strong>Treponema pallidum<\/strong><\/th><\/tr><tr><td><strong>Classificação <\/strong> <strong>Biológica<\/strong><\/td><td>Protozoário flagelado (eucarioto)<\/td><td>Bactéria espiroqueta (procarioto)<\/td><\/tr><tr><td><strong>Formas Evolutivas<\/strong><\/td><td>Apenas trofozoíto (não forma cistos)<\/td><td>Forma espiralar vegetativa<\/td><\/tr><tr><td><strong>Sítios <\/strong> <strong>Anatômicos <\/strong> <strong>Principais<\/strong><\/td><td>Epitélio vaginal, ectocérvix, uretra, glândulas anexas<\/td><td>Mucosa/pele anogenital, endotélio vascular, disseminação sistêmica<\/td><\/tr><tr><td><strong>Comportamento <\/strong> <strong>Invasivo<\/strong><\/td><td>Superficial; restrito ao trato urogenital inferior<\/td><td>Altamente invasivo; transendotelial e hematogênico<\/td><\/tr><\/table><\/div>\n<p>Em síntese, enquanto a biologia de <em>Trichomonas vaginalis<\/em> o confina às superfícies epiteliais escamosas do trato geniturinário inferior por meio de mecanismos de adesão direta e dependência do microambiente vaginal, o <em>Treponema pallidum<\/em> utiliza seu maquinário invasivo e tropismo vascular para transformar uma inoculação mucosa ou cutânea localizada em uma infecção generalizada de alta complexidade tecidual.<\/p>\n<h3 class=\"hb\" style=\"--c:#38761d;--hb:#b6d7a8;\">Referências Bibliográficas<\/h3>\n<p>BRASIL. Ministério da Saúde. Secretaria de Vigilância em Saúde e Ambiente. <strong>Protocolo Clínico e Diretrizes Terapêuticas para Atenção Integral às Pessoas com Infecções Sexualmente Transmissíveis (PCDT-IST)<\/strong>. Brasília: Ministério da Saúde, 2022. Cap. 1-3. KASPER, D. L. et al. <strong>Medicina interna de Harrison<\/strong>. 20. ed. Porto Alegre: AMGH, 2020. v. 1, cap. 177 e 218.<\/p>\n<p>MURRAY, P. R.; ROSENTHAL, K. S.; PFALLER, M. A. <strong>Microbiologia Médica<\/strong>. 9. ed. Rio de Janeiro: Elsevier, 2021. cap. 34 e 72.<\/p>\n<h2 class=\"hb\" style=\"--c:#274e13;--hb:#93c47d;\">2. Fisiopatologia da Tricomoníase e da Sífilis<\/h2>\n<p>A fisiopatologia de ambas as infecções revela estratégias biológicas distintas: a tricomoníase opera predominantemente por citotoxicidade de contato, lise enzimática local e inflamação exuberante da mucosa superficial; já a sífilis estabelece um processo crônico de invasão tecidual, camuflagem imunológica e lesão vascular mediada por endarterite obliterante e hipersensibilidade tardia.<\/p>\n<h3 class=\"hb\" style=\"--c:#38761d;--hb:#b6d7a8;\">Mecanismos Fisiopatológicos da Tricomoníase<\/h3>\n<p>A infecção por <em>T. vaginalis<\/em> inicia-se com o ancoramento mecânico e bioquímico do trofozoíto às células epiteliais escamosas vaginais. Esse processo é mediado por um conjunto de proteínas de superfície denominadas genericamente de adesinas (AP65, AP51, AP33, AP23 e lipofosfoglicano - LPG). A ligação ao epitélio desencadeia uma alteração morfológica no parasita: o trofozoíto, habitualmente piriforme e móvel, achata-se contra a membrana da célula hospedeira, assumindo uma conformação ameboide que maximiza a superfície de contato intercelular.<\/p>\n<p>Uma vez ancorado, o parasita inicia a agressão citotóxica dependente de contato e a liberação de exoenzimas:<\/p>\n<ul>\n<li><strong>Cisteína-proteinases e Enzimas Líticas:<\/strong> Degradam proteínas da matriz extracelular, imunoglobulinas (IgA e IgG secretoras) e componentes estruturais das junções oclusivas celulares, promovendo descamação epitelial maciça.<\/li>\n<li><strong>Fagocitose e Hemólise:<\/strong> O protozoário fagocita ativamente células epiteliais, bactérias comensais (<em>Lactobacillus<\/em> spp.) e eritrócitos. A lise de hemácias é essencial para a aquisição de ferro livre, nutriente indispensável que regula positivamente a transcrição de suas próprias adesinas e proteases.<\/li>\n<li><strong>Evasão e Inflamação:<\/strong> O consumo de lactobacilos eleva o pH vaginal para faixas tipicamente alcalinas (superiores a 5,0 a 5,5). Essa alcalinização favorece a proliferação de anaeróbios secundários. Paralelamente, o parasita ativa a resposta imune inata por meio de receptores toll-like (TLR2 e TLR4), atraindo uma densa infiltração de neutrófilos polimorfonucleares. O estresse oxidativo local gerado pelos neutrófilos, somado à ação de toxinas parasitárias, resulta em microerosões focais, adelgaçamento da camada epitelial e neovascularização frágil, expressando-se microscopicamente como hemorragias subepiteliais pontilhadas.<\/li><\/ul>\n<h3 class=\"hb\" style=\"--c:#38761d;--hb:#b6d7a8;\">Mecanismos Fisiopatológicos da Sífilis<\/h3>\n<p>A patogênese da sífilis apoia-se em sua mobilidade axial, adesão transendotelial e capacidade de mimetismo antigênico. O <em>Treponema pallidum<\/em> adere à fibronectina e à laminina da matriz extracelular do hospedeiro por meio de adesinas específicas (como Tp0155 e Tp0483). Utilizando enzimas proteolíticas locais e sua motilidade em saca-rolhas, a espiroqueta perfura os espaços intercelulares, atravessa a lâmina basal e atinge o lúmen dos capilares dérmicos.<\/p>\n<p>A lesão histopatológica fundamental da sífilis em todas as suas fases ativas é a <strong>endarterite obliterante<\/strong> associada a um infiltrado inflamatório rico em plasmócitos e linfócitos T (CD4+ e CD8+):<\/p>\n<ul>\n<li><strong>Fase Primária (Cancro Duro):<\/strong> A multiplicação treponêmica local induz tumefação endotelial e proliferação concêntrica da túnica íntima dos pequenos vasos sanguíneos periulcerosos. A oclusão vascular resultante gera isquemia e necrose tecidual avascular superficial circunscrita, traduzindo-se na ulceração clássica de bordas elevadas e fundo limpo. A rica população treponêmica presente nessa lesão atrai macrófagos e células dendríticas, mas a bactéria expressa uma densidade extremamente baixa de proteínas integrais em sua membrana externa (\"camuflagem molecular\"), retardando a depuração fagocítica eficaz. A lesão cicatriza espontaneamente em semanas devido à contenção mediada por imunidade celular local e interferon-gama, mas as bactérias já se encontram sistemicamente disseminadas.<\/li>\n<li><strong>Fase Secundária:<\/strong> Decorre da replicação intravascular e perivascular generalizada das espiroquetas disseminadas. Ocorre depósito tecidual de imunocomplexos circulantes e uma reação inflamatória linfoplasmocitária peri-microvascular generalizada na derme e vísceras, resultando em exantema, roséolas e sifílides papulosas.<\/li>\n<li><strong>Fase Terciária:<\/strong> Ocorre anos após a infecção inicial devido a uma resposta imune celular do tipo hipersensibilidade tardia (Tipo IV) contra antígenos treponêmicos residuais sequestrados em tecidos nobres (aorta, parênquima cerebral, ossos). Formam-se os \"gomas sifilíticos\", que são granulomas com necrose gomosa central circundados por células gigantes multinucleadas, linfócitos e fibroblastos, além de vasculite proliferativa dos <em>vasa vasorum<\/em> (aortite sifilítica).<\/li><\/ul>\n<div class=\"tbl\"><table><tr><th><strong>Mecanismo Patogênico<\/strong><\/th><th><strong>Tricomoníase<\/strong><\/th><th><strong>Sífilis<\/strong><\/th><\/tr><tr><td><strong>Agressão Celular<\/strong><\/td><td>Citotoxicidade de contato, cisteína-proteases, hemólise<\/td><td>Endarterite obliterante, isquemia focal, hipersensibilidade tipo IV<\/td><\/tr><tr><td><strong>Resposta <\/strong> <strong>Imune <\/strong> <strong>Predominante<\/strong><\/td><td>Inata exuberante (neutrofilia local, inflamação superficial)<\/td><td>Celular e humoral (infiltrado linfoplasmocitário e imunocomplexos)<\/td><\/tr><tr><td><strong>Estratégia <\/strong> <strong>de <\/strong> <strong>Persistência<\/strong><\/td><td>Clivagem enzimática de IgA/IgG, depleção de lactobacilos<\/td><td>Baixa antigenicidade de superfície (escassez de proteínas de membrana)<\/td><\/tr><tr><td><strong>Dano Tecidual<\/strong><\/td><td>Desnudamento epitelial e microulcerações superficiais<\/td><td>Oclusão vascular arterial, necrose isquêmica e granulomas crônicos<\/td><\/tr><\/table><\/div>\n<p>Conclui-se que a tricomoníase destrói a barreira epitelial local primariamente por agressão química direta e recrutamento leucocitário destrutivo na luz vaginal, ao passo que a sífilis compromete a vascularização profunda por meio de endarterite e orquestra uma resposta imunológica crônica que atinge múltiplos compartimentos corporais.<\/p>\n<h3 class=\"hb\" style=\"--c:#38761d;--hb:#b6d7a8;\">Referências Bibliográficas<\/h3>\n<p>BRASIL. Ministério da Saúde. Secretaria de Vigilância em Saúde e Ambiente. <strong>Manual Técnico para o Diagnóstico da Sífilis<\/strong>. Brasília: Ministério da Saúde, 2021. p. 11-28. FARRAR, J. et al. <strong>Manson's Tropical Infectious Diseases<\/strong>. 24. ed. Londres: Elsevier, 2024. cap. 61.<\/p>\n<p>KUMAR, V. et al. <strong>Robbins &amp; Cotran: Patologia - Bases Patológicas das Doenças<\/strong>. 10. ed. Rio de Janeiro: Guanabara Koogan, 2021. cap. 8 e 9.<\/p>\n<h2 class=\"hb\" style=\"--c:#274e13;--hb:#93c47d;\">3. Manifestações Clínicas Ginecológicas da Tricomoníase e da Sífilis<\/h2>\n<p>As manifestações clínicas no aparelho genital feminino refletem diretamente os sítios teciduais acometidos e os mecanismos fisiopatológicos supracitados. Enquanto a tricomoníase se manifesta como uma síndrome de corrimento vaginal com inflamação mucocutânea aguda exuberante, a sífilis ginecológica apresenta lesões pleomórficas, muitas vezes indolores e clinicamente silenciosas, que variam conforme o estágio da doença.<\/p>\n<h3 class=\"hb\" style=\"--c:#38761d;--hb:#b6d7a8;\">Manifestações Ginecológicas da Tricomoníase<\/h3>\n<p>A tricomoníase sintomática manifesta-se classicamente como uma vaginite/vulvovaginite aguda ou subaguda. O sintoma guia é o corrimento vaginal abundante, de aspecto fluido, bolhoso (decorrente da produção de gases pela fermentação anaeróbia do protozoário), coloração amarelo-esverdeada ou acinzentada e odor fétido característico, frequentemente descrito como odor amínico (\"peixe podre\"), exacerbado após o coito ou no período pós-menstrual imediato devido à neutralização do pH pelo sêmen ou sangue.<\/p>\n<p>Ao exame especular e ectoscopia ginecológica, observam-se:<\/p>\n<ul>\n<li><strong>Hiperemia e Edema Vulvovaginal:<\/strong> A mucosa vaginal apresenta-se difusamente eritematosa, friável e edemaciada, acompanhada de prurido vulvar intenso, ardor e disúria terminal (por contiguidade uretrovulvar).<\/li>\n<li><strong>Dispareunia Intróita e Profunda:<\/strong> O contato sexual torna-se doloroso devido à inflamação e escoriação da parede vaginal.<\/li>\n<li><strong>Colo em Framboesa ou Morango (<\/strong><em><strong>Colpitis Macularis<\/strong><\/em><strong>):<\/strong> Achado clássico visualizado ao exame especular (e maximizado pela colposcopia), caracterizado por múltiplos focos de hemorragia petequial subepitelial na ectocérvix e nas paredes vaginais superiores. Ocorre em cerca de 2% a 5% dos casos à vista desarmada, mas pode ser identificado em até 45% dos exames colposcópicos detalhados.<\/li>\n<li><strong>Sensação de Queimação Pélvica:<\/strong> Pode haver desconforto no hipogástrio associado à congestão pélvica reativa. Vale ressaltar que entre 10% a 50% das mulheres infectadas podem permanecer assintomáticas ou oligossintomáticas por longos períodos, configurando reservatórios epidemiológicos fundamentais.<\/li><\/ul>\n<h3 class=\"hb\" style=\"--c:#38761d;--hb:#b6d7a8;\">Manifestações Ginecológicas da Sífilis<\/h3>\n<p>As manifestações ginecológicas da sífilis distribuem-se temporalmente e morfologicamente de acordo com a fase de evolução clínica:<\/p>\n<ul>\n<li><strong>Sífilis Primária (Cancro Duro):<\/strong> Surge após um período de incubação de 10 a 90 dias (média de 21 dias) no ponto de inoculação. No trato reprodutor feminino, manifesta-se como uma úlcera habitualmente única, com base indurada (\"cartonada\" à palpação), bordas nítidas, elevadas e regulares, fundo liso avermelhado e limpo, sem exsudato purulento (secreção serosa transparente rica em treponemas). Crucialmente, <strong>é indolor e não pruriginosa<\/strong>. Devido à anatomia feminina, o cancro duro frequentemente localiza-se na parede vaginal, fundo de saco ou colo uterino, passando totalmente despercebido pela paciente e curando-se espontaneamente em 3 a 8 semanas sem cicatriz evidente. Acompanha-se de linfoadenopatia regional (inguinal bilateral), caracterizada por linfonodos móveis, múltiplos, firmes, indolores e sem coalescência ou supuração.<\/li>\n<li><strong>Sífilis Secundária:<\/strong> Surge entre 6 semanas e 6 meses após a resolução da lesão primária. Além do exantema maculopapular sistêmico (com acometimento palmoplantar patognomônico), as manifestações ginecológicas incluem:\n<ul>\n<li><strong>Condiloma Plano (<\/strong><em><strong>Condyloma Latum<\/strong><\/em><strong>):<\/strong> Pápulas ou placas hipertróficas, de base larga, úmidas, cinza-esbranquiçadas, altamente infecciosas, localizadas na vulva, períneo e pregas perianais. Diferenciam-se do condiloma acuminado do HPV por sua superfície achatada e lisa, não verrucosa.<\/li>\n<li><strong>Placas Mucosas:<\/strong> Lesões erosivas orais ou genitais, superficiais, acinzentadas, circundadas por halo eritematoso fino, indolores e ricas em bactérias.<\/li><\/ul><\/li>\n<li><strong>Sífilis Tardia (Terciária):<\/strong> Rara na prática ginecológica contemporânea. Manifesta-se após anos como lesões gomosas destrutivas na vulva ou colo uterino, que simulam neoplasias avançadas, causando ulcerações profundas e deformidades anatômicas.<\/li><\/ul>\n<div class=\"tbl\"><table><tr><th><strong>Sinal / Sintoma<\/strong><\/th><th><strong>Tricomoníase<\/strong><\/th><th><strong>Sífilis Primária / Secundária<\/strong><\/th><\/tr><tr><td><strong>Lesão Elementar<\/strong><\/td><td>Eritema difuso, petéquias (<em>colpite macular<\/em>)<\/td><td>Úlcera única indurada (cancro) / Placas planas (<em>condyloma latum<\/em>)<\/td><\/tr><tr><td><strong>Corrimento <\/strong> <strong>Vaginal<\/strong><\/td><td>Abundante, fluido, bolhoso, amarelo-esverdeado<\/td><td>Ausente (apenas transudato seroso da úlcera ou placas úmidas)<\/td><\/tr><tr><td><strong>Sintomas <\/strong> <strong>Subjetivos<\/strong><\/td><td>Prurido vulvar severo, ardência, dispareunia<\/td><td>Indolor na fase primária; prurido ausente na maioria dos casos<\/td><\/tr><tr><td><strong>Linfonodomegalia<\/strong><\/td><td>Ausente ou leve desconforto regional inespecífico<\/td><td>Inguinal bilateral, múltipla, indolor, sem supuração<\/td><\/tr><\/table><\/div>\n<p>Em síntese, o quadro clínico ginecológico da tricomoníase impõe-se de modo sintomático e barulhento, concentrado em corrimento bolhoso, prurido e colpite macular, enquanto a sífilis primária no trato genital feminino opera como uma infecção traiçoeira e silenciosa, cujo cancro genital oculto e indolor muitas vezes é ignorado até que ocorra a eclosão da fase secundária.<\/p>\n<h3 class=\"hb\" style=\"--c:#38761d;--hb:#b6d7a8;\">Referências Bibliográficas<\/h3>\n<p>BRASIL. Ministério da Saúde. Secretaria de Vigilância em Saúde e Ambiente. <strong>Protocolo Clínico e Diretrizes Terapêuticas para Atenção Integral às Pessoas com Infecções Sexualmente Transmissíveis (PCDT-IST)<\/strong>. Brasília: Ministério da Saúde, 2022. Cap. 2 e 4. FEDERAÇÃO BRASILEIRA DAS ASSOCIAÇÕES DE GINECOLOGIA E OBSTETRÍCIA (FEBRASGO). <strong>Manual de Doenças Sexualmente Transmissíveis<\/strong>. São Paulo: FEBRASGO, 2021. cap. 3 e 5.<\/p>\n<p>HOFFMAN, B. L. et al. <strong>Ginecologia de Williams<\/strong>. 4. ed. Porto Alegre: Artmed, 2024. cap. 3.<\/p>\n<h2 class=\"hb\" style=\"--c:#274e13;--hb:#93c47d;\">4. Comparação entre Achados Clínicos e Exames Laboratoriais<\/h2>\n<p>A correlação entre a impressão clínica e os métodos diagnósticos laboratoriais é indispensável para evitar falhas terapêuticas, subnotificações ou condutas iatrogênicas. Cada metodologia diagnóstica — citologia, sorologia, biologia molecular e testes rápidos — possui sensibilidade, especificidade e janelas imunológicas próprias que determinam seu uso racional.<\/p>\n<h3 class=\"hb\" style=\"--c:#38761d;--hb:#b6d7a8;\">Avaliação Laboratorial da Tricomoníase<\/h3>\n<p>O diagnóstico clínico baseado apenas nas características do corrimento e do colo em framboesa possui baixa acurácia (sensibilidade inferior a 50%), tornando mandatória a confirmação laboratorial:<\/p>\n<ul>\n<li><strong>Exame a Fresco do Conteúdo Vaginal (Microscopia Óptica):<\/strong> É o método ambulatorial de triagem mais acessível. Avalia uma gota de secreção vaginal misturada com solução salina isotônica em lâmina aquecida. Identifica o trofozoíto flagelado dotado de motilidade ondulante ativa e a abundante presença de leucócitos polimorfonucleares. <strong>Vantagem:<\/strong> Baixo custo e resultado imediato à beira do leito. <strong>Limitação:<\/strong> Sensibilidade modesta (50% a 70%), altamente dependente da experiência do examinador e da viabilidade dos parasitas, que perdem a mobilidade em poucos minutos após a coleta ou em temperaturas baixas.<\/li>\n<li><strong>Citopatologia Cervicovaginal (Papanicolaou):<\/strong> Frequentemente relata a presença incidental de <em>Trichomonas vaginalis<\/em>. <strong>Limitação Crítica:<\/strong> Não é o método de escolha diagnóstica. Apresenta sensibilidade de aproximadamente 40% a 60% e expressiva taxa de falsos-positivos decorrente de alterações degenerativas e fixação celular, que mimetizam trofozoítos. A indicação de tratamento baseada unicamente no achado de citologia de rotina deve ser avaliada com cautela ou confirmada por método mais sensível em pacientes assintomáticas.<\/li>\n<li><strong>Testes de Amplificação de Ácidos Nucleicos (NAAT - PCR):<\/strong> Representam o atual padrão-ouro laboratorial para o diagnóstico de <em>T. vaginalis<\/em>. <strong>Vantagem:<\/strong> Sensibilidade e especificidade próximas a 98-100%, capazes de detectar quantidades ínfimas de DNA do parasita a partir de swabs vaginais, endocervicais ou amostras de urina de primeiro jato, inclusive em mulheres completamente assintomáticas. <strong>Limitação:<\/strong>  Custo elevado e menor disponibilidade na rotina de atenção primária.<\/li>\n<li><strong>Testes Rápidos de Antígeno (Imunocromatografia):<\/strong> Detectam antígenos proteicos de superfície em swabs vaginais em 10 a 15 minutos, com sensibilidade superior a 85-90%, servindo como excelente alternativa <em>point-of-care<\/em>.<\/li><\/ul>\n<h3 class=\"hb\" style=\"--c:#38761d;--hb:#b6d7a8;\">Avaliação Laboratorial da Sífilis<\/h3>\n<p>O diagnóstico laboratorial da sífilis divide-se em exames diretos (pesquisa do patógeno) e testes imunológicos/sorológicos (pesquisa de anticorpos), cuja indicação varia rigorosamente com o estágio clínico da lesão:<\/p>\n<ul>\n<li><strong>Exames Diretos (Microscopia de Campo Escuro e Imunofluorescência Direta):<\/strong>  Indicados especificamente na fase primária (cancro duro com exsudato seroso) e nas lesões ativas da sífilis secundária (condiloma plano). Demonstram a espiroqueta viva com sua motilidade helicoidal típica. <strong>Indicação:<\/strong> Fase primária precoce, na qual a sorologia ainda é negativa. <strong>Limitação:<\/strong> Exige microscópio especializado com condensador de campo escuro e profissional experiente; resultado falso-negativo rápido se a paciente tiver utilizado antimicrobianos ou substâncias tópicas.<\/li>\n<li><strong>Testes Sorológicos Não Treponêmicos (VDRL e RPR):<\/strong> Detectam anticorpos IgM e IgG direcionados contra a cardiolipina liberada das células lesionadas pelo treponema. <strong>Indicações:<\/strong> Avaliação de atividade infecciosa atual e, crucialmente, controle de cura e monitoramento de resposta terapêutica (avaliação de queda dos títulos em duas diluições/quatro vezes). <strong>Limitações:<\/strong> Janela imunológica de 1 a 3 semanas após o aparecimento do cancro primário (falso-negativo inicial em até 30% dos casos de cancro duro); suscetibilidade a fenômenos falso-positivos em doenças autoimunes (lúpus, SAF), infecções virais agudas, hanseníase e gravidez; e o <strong>efeito prozona<\/strong> (falsos-negativos por excesso de anticorpos que impedem a floculação na sífilis secundária, revertido pela diluição da amostra).<\/li>\n<li><strong>Testes Sorológicos Treponêmicos (FTA-Abs, TPHA, Quimioluminescência - CMIA, ELISA):<\/strong> Detectam anticorpos específicos contra antígenos de <em>T. pallidum<\/em>. São os primeiros a se tornarem reagentes na fase primária e permanecem positivos por toda a vida na imensa maioria dos indivíduos (cicatriz sorológica). <strong>Indicação:<\/strong>  Confirmação diagnóstica quando o teste não treponêmico é positivo ou na triagem pelo algoritmo reverso. <strong>Limitação:<\/strong> Não diferenciam infecção ativa de infecção tratada no passado, sendo contraindicados para controle de cura.<\/li>\n<li><strong>Testes Rápidos Treponêmicos (TR):<\/strong> Ensaios imunocromatográficos realizados em sangue capilar com resultado em até 30 minutos. <strong>Indicação:<\/strong> Estratégia de escolha para triagem inicial em larga escala (gestantes, populações vulneráveis, consultas de rotina), recomendada pelo Ministério da Saúde. Se reagente na triagem, impõe a coleta imediata de teste não treponêmico quantitativo (VDRL) para titulação basal e segmento terapêutico, devendo o tratamento ser iniciado de imediato na gestante sem aguardar o resultado do VDRL.<\/li><\/ul>\n<div class=\"tbl\"><table><tr><th><strong>Exame <\/strong> <strong>/ <\/strong> <strong>Tecnologia<\/strong><\/th><th><strong>Aplicação Clínica<\/strong><\/th><th><strong>Sensibilidade<\/strong><\/th><th><strong>Especificidade<\/strong><\/th><th><strong>Principais Limitações<\/strong><\/th><\/tr><tr><td><strong>Exame a fresco <\/strong> <strong>(TV)<\/strong><\/td><td>Diagnóstico imediato no consultório<\/td><td>Moderada (50-70%)<\/td><td>Alta (&gt;90%)<\/td><td>Perda rápida de motilidade; examinador-dependente<\/td><\/tr><tr><td><strong>Citologia cervical <\/strong> <strong>(TV)<\/strong><\/td><td>Rastreamento oncológico incidental<\/td><td>Baixa/Média (40-60%)<\/td><td>Moderada<\/td><td>Alta taxa de falsos-positivos/negativo s; não diagnóstica<\/td><\/tr><tr><td><strong>Biologia <\/strong> <strong>Molecular - NAAT <\/strong> <strong>(TV)<\/strong><\/td><td>Confirmação diagnóstica e assintomáticos<\/td><td>Excelente (&gt;98%)<\/td><td>Excelente (&gt;99%)<\/td><td>Custo mais elevado e necessidade de infraestrutura<\/td><\/tr><tr><td><strong>Microscopia <\/strong> <strong>de <\/strong> <strong>Campo <\/strong> <strong>Escuro <\/strong> <strong>(TP)<\/strong><\/td><td>Cancro duro recente (fase primária)<\/td><td>Alta (&gt;85% se lesão rica)<\/td><td>Altíssima (100%)<\/td><td>Indisponível em grande escala; exige lesão ativa<\/td><\/tr><tr><td><strong>Testes <\/strong> <strong>Não <\/strong> <strong>Treponêmicos <\/strong> <strong>- <\/strong> <strong>VDRL (TP)<\/strong><\/td><td>Monitoramento de cura e fase secundária<\/td><td>Alta na fase 2 (quase 100%)<\/td><td>Moderada (85-90%)<\/td><td>Falso-positivo biológico; efeito prozona; janela primária<\/td><\/tr><tr><td><strong>Testes <\/strong> <strong>Rápidos <\/strong> <strong>Treponêmicos <\/strong> <strong>(TP)<\/strong><\/td><td>Triagem ágil <em>point-of-care<\/em><\/td><td>Alta (&gt;95%)<\/td><td>Alta (&gt;95%)<\/td><td>Cicatriz sorológica (não serve para seguimento de cura)<\/td><\/tr><\/table><\/div>\n<p>Conclui-se que o diagnóstico moderno dessas patologias exige o reconhecimento do tempo biológico: na tricomoníase, a microscopia direta a fresco resolve grande parte dos casos sintomáticos, reservando-se a biologia molecular para quadros duvidosos; na sífilis, a integração temporal entre testes diretos (úlcera primária precoce), treponêmicos rápidos (triagem inicial sensível) e não treponêmicos quantitativos (titulação de fase e monitoramento de cura) constitui a única rota diagnóstica segura.<\/p>\n<h3 class=\"hb\" style=\"--c:#38761d;--hb:#b6d7a8;\">Referências Bibliográficas<\/h3>\n<p>BRASIL. Ministério da Saúde. Secretaria de Vigilância em Saúde e Ambiente. <strong>Manual Técnico para o Diagnóstico da Sífilis<\/strong>. Brasília: Ministério da Saúde, 2021. p. 29-54. CENTERS FOR DISEASE CONTROL AND PREVENTION (CDC). <strong>Sexually Transmitted Infections Treatment Guidelines, 2021<\/strong>. MMWR Recomm Rep, v. 70, n. 4, p. 1-187, 2021. McPHEE, S. J.; PAPADAKIS, M. A. <strong>Current Medical Diagnosis &amp; Treatment 2024<\/strong>. 63. ed. Nova York: McGraw-Hill Education, 2024. cap. 36.<\/p>\n<h2 class=\"hb\" style=\"--c:#274e13;--hb:#93c47d;\">5. Abordagem Terapêutica e Preventiva da Tricomoníase e da Sífilis<\/h2>\n<p>O manejo clínico da tricomoníase e da sífilis exige rigor na escolha farmacológica, adequação das vias de administração, manejo de reações adversas e estrita adesão aos princípios de saúde pública, com ênfase na quebra da cadeia de transmissão por meio da abordagem simultânea das parcerias sexuais.<\/p>\n<h3 class=\"hb\" style=\"--c:#38761d;--hb:#b6d7a8;\">Abordagem Terapêutica da Tricomoníase<\/h3>\n<p>O tratamento da tricomoníase baseia-se na classe dos 5-nitroimidazólicos, que atuam sofrendo redução de seu grupo nitro no interior dos hidrogenossomos do protozoário, liberando radicais citotóxicos e intermediários reativos que quebram as fitas de DNA do parasita.<\/p>\n<ul>\n<li><strong>Esquema de Primeira Escolha:<\/strong> Metronidazol, 500 mg, por via oral, administrado a cada 12 horas durante 7 dias (esquema multidose). Evidências clínicas robustas e diretrizes internacionais consolidadas (CDC e Ministério da Saúde) demonstraram que o esquema de 7 dias apresenta taxas de cura significativamente superiores ao esquema de dose única de 2 g (cerca de 90-95% versus 80-85%), particularmente na prevenção de recidivas e infecções persistentes em mulheres.<\/li>\n<li><strong>Esquemas Alternativos:<\/strong> Tinidazol, 2 g, por via oral, em dose única (excelente tolerabilidade e meia-vida mais longa) ou Secnidazol, 2 g, via oral, em dose única.<\/li>\n<li><strong>Manejo na Gestação e Lactação:<\/strong> O Metronidazol pode ser utilizado com segurança em todos os trimestres gestacionais, preferindo-se o esquema convencional fracionado para minimizar picos séricos e toxicidade gástrica. Mulheres que amamentam e recebem dose única devem suspender a amamentação por 12 a 24 horas (ou 3 dias com tinidazol) para evitar exposição neonatal.<\/li>\n<li><strong>Regra Fundamental de Conduta:<\/strong> O tratamento tópico vaginal com óvulos ou cremes de metronidazol é <strong>formalmente contraindicado como monoterapia<\/strong>, pois não atinge níveis terapêuticos adequados na uretra, bexiga e glândulas periuretrais/vestibulares, resultando em falha microbiológica e taxas de recidiva superiores a 50%. Os pacientes devem ser orientados quanto à abstinência alcoólica durante o uso e até 48 horas após a conclusão do metronidazol devido ao risco de efeito antabuse/dissulfiram-like (rubor, náuseas, vômitos, taquicardia).<\/li><\/ul>\n<h3 class=\"hb\" style=\"--c:#38761d;--hb:#b6d7a8;\">Abordagem Terapêutica da Sífilis<\/h3>\n<p>A droga de eleição absoluta para o tratamento da sífilis em qualquer estágio é a Penicilina G Benzatina, bactericida que bloqueia a síntese do peptideoglicano da parede celular treponêmica ao inativar as transpeptidases bacterianas (PBPs). Até o presente, não existem relatos documentados de resistência de <em>Treponema pallidum<\/em> à penicilina.<\/p>\n<p>O estadiamento clínico rigoroso determina o regime posológico:<\/p>\n<ul>\n<li><strong>Sífilis Recente (Primária, Secundária e Latente Recente com até 1 ano de evolução):<\/strong> Penicilina G Benzatina, 2,4 milhões de Unidades Internacionais (UI), administrada por via intramuscular (IM), dividida em duas injeções de 1,2 milhão de UI em cada glúteo, em <strong>dose única<\/strong>.<\/li>\n<li><strong>Sífilis Tardia (Latente Tardia com mais de 1 ano de evolução ou de duração indeterminada, Terciária):<\/strong> Penicilina G Benzatina, 2,4 milhões de UI, IM, <strong>semanalmente, por 3 semanas consecutivas<\/strong>, totalizando 7,2 milhões de UI. Caso uma gestante atrase qualquer aplicação por mais de 7 a 9 dias, o esquema terapêutico deve ser completamente reiniciado.<\/li>\n<li><strong>Neurossífilis:<\/strong> Penicilina G Cristalina aquosa, 18 a 24 milhões de UI ao dia, administrada por via intravenosa (3 a 4 milhões de UI a cada 4 horas ou infusão contínua) durante 10 a 14 dias.<\/li>\n<li><strong>Alternativas em Não Gestantes com Alergia Comprovada à Penicilina:<\/strong>  Doxiciclina, 100 mg, por via oral, a cada 12 horas, durante 15 dias (fase recente) ou 30 dias (fase tardia). <strong>Em gestantes, a penicilina é a única droga segura e eficaz para o tratamento fetal; gestantes alérgicas devem ser compulsoriamente dessensibilizadas em ambiente hospitalar e tratadas com penicilina benzatina.<\/strong><\/li>\n<li><strong>Reação de Jarisch-Herxheimer:<\/strong> Resposta febril aguda exacerbada decorrente da lise maciça de espiroquetas nas primeiras 24 horas pós-penicilina, cursando com calafrios, cefaleia, mialgia e exacerbação transitória das lesões cutâneas. É autolimitada e deve ser manejada sintomaticamente, sem suspensão do tratamento.<\/li><\/ul>\n<h3 class=\"hb\" style=\"--c:#38761d;--hb:#b6d7a8;\">Abordagem Preventiva e Manejo de Parcerias Sexuais<\/h3>\n<p>O controle epidemiológico de ambas as afecções não se encerra na cura individual, mas no bloqueio da transmissão comunitária:<\/p>\n<ul>\n<li><strong>Tratamento Simultâneo das Parcerias Sexuais:<\/strong> Na tricomoníase e na sífilis primária/secundária, todas as parcerias sexuais dos últimos 60 a 90 dias devem ser convocadas, testadas e tratadas compulsoriamente, mesmo que assintomáticas ou sorologicamente não reagentes (tratamento presuntivo/epidemiológico), para mitigar a reinfecção em \"pingue-pongue\".<\/li>\n<li><strong>Abstinência Sexual:<\/strong> Os pacientes devem manter abstinência de intercurso sexual até a resolução clínica completa das lesões e conclusão integral do esquema terapêutico de ambos os parceiros (mínimo de 7 dias após a dose única ou início do tratamento).<\/li>\n<li><strong>Prevenção Combinada e Redução de Danos:<\/strong> Uso consistente e correto de preservativos internos e externos; testagem rotineira para outras ISTs associadas (HIV, Hepatite B e C, Clamídia e Gonorreia), sabendo-se que a quebra da integridade mucosa provocada pela tricomoníase e pela sífilis eleva em 2 a 5 vezes o risco de aquisição e transmissão do HIV.<\/li>\n<li><strong>Seguimento Sorológico Pós-Tratamento da Sífilis:<\/strong> Monitoramento trimestral com testes não treponêmicos (VDRL) aos 3, 6, 9 e 12 meses (em gestantes, monitoramento mensal até o parto). Considera-se critério de cura a queda da titulação em duas diluições (ex.: de 1:32 para 1:8) em até 6 meses para sífilis recente e até 12 meses para sífilis tardia.<\/li><\/ul>\n<div class=\"tbl\"><table><tr><th><strong>Dimensão <\/strong> <strong>Terapêutica<\/strong><\/th><th><strong>Tricomoníase<\/strong><\/th><th><strong>Sífilis Recente (Primária / Secundária)<\/strong><\/th><\/tr><tr><td><strong>Droga de 1ª Linha<\/strong><\/td><td>Metronidazol 500 mg VO de 12/12h por 7 dias<\/td><td>Penicilina G Benzatina 2,4 milhões UI IM dose única<\/td><\/tr><tr><td><strong>Via Tópica Local<\/strong><\/td><td>Contraindicada em monoterapia (ineficaz)<\/td><td>Não se aplica<\/td><\/tr><tr><td><strong>Parcerias Sexuais<\/strong><\/td><td>Tratar obrigatoriamente (esquema oral simultâneo)<\/td><td>Tratar presuntivamente se contato nos últimos 90 dias<\/td><\/tr><tr><td><strong>Critério de Cura<\/strong><\/td><td>Resolução clínica dos sintomas e NAAT se persistência<\/td><td>Queda de 2 diluições (4 vezes) no VDRL aos 3-6 meses<\/td><\/tr><\/table><\/div>\n<p>A abordagem bem-sucedida da tricomoníase e da sífilis repousa na assertividade da prescrição sistêmica, na recusa ao tratamento tópico ineficaz, na vigilância laboratorial longitudinal e na incorporação irrevogável do tratamento concomitante das parcerias sexuais como diretriz indispensável de saúde pública.<\/p>\n<h3 class=\"hb\" style=\"--c:#38761d;--hb:#b6d7a8;\">Referências Bibliográficas<\/h3>\n<p>BRASIL. Ministério da Saúde. Secretaria de Vigilância em Saúde e Ambiente. <strong>Protocolo Clínico e Diretrizes Terapêuticas para Atenção Integral às Pessoas com Infecções Sexualmente Transmissíveis (PCDT-IST)<\/strong>. Brasília: Ministério da Saúde, 2022. Cap. 1, 2 e Anexos.<\/p>\n<p>CENTERS FOR DISEASE CONTROL AND PREVENTION (CDC). <strong>Sexually Transmitted Infections Treatment Guidelines, 2021<\/strong>. MMWR Recomm Rep, v. 70, n. 4, p. 1-187, 2021. GOLDMAN, L.; SCHAFER, A. I. <strong>Goldman-Cecil Medicina<\/strong>. 26. ed. Rio de Janeiro: Elsevier, 2022. v. 2, cap. 297 e 328.<\/p>"}, {"id": "tutoria-2-4", "num": "2.4", "sp": "Tutoria 2.4", "titulo": "Sangramento uterino anormal", "subtitulo": "Tutoria 2.4 · objetivos de aprendizagem respondidos", "resumo": "PALM-COEIN, manejo agudo e crônico, critérios diagnósticos, tratamento e equipe multiprofissional.", "html": "<h2 class=\"hb\" style=\"--c:#660000;--hb:#e06666;\">1- Defina Sangramento Uterino Anormal (SUA) e identifique as principais causas, bem como classificando-os pelo sistema PALM-COEIN.<\/h2>\n<p>O sangramento uterino anormal (SUA) constitui uma das queixas ginecológicas mais prevalentes tanto na atenção primária à saúde quanto em ambulatórios especializados, impactando diretamente a qualidade de vida, a capacidade laboral e o bem-estar biopsicossocial da mulher. Definido de maneira ampla, o SUA corresponde a qualquer perda <mark style=\"--m:#ffe599\">sanguínea de origem uterina que divirja dos parâmetros normais do ciclo menstrual em <\/mark> <mark style=\"--m:#ffe599\">volume, frequência, regularidade ou duração em mulheres em idade fértil, excluindo-se a <\/mark> gestação. Do ponto de vista conceitual e cronológico, o sangramento menstrual normal <mark style=\"--m:#ffe599\">caracteriza-se por um intervalo intermenstrual médio de 24 a 38 dias, duração do fluxo <\/mark> <mark style=\"--m:#ffe599\">inferior a 8 dias e volume percebido que não gere impacto hemodinâmico ou necessidade <\/mark> <mark style=\"--m:#ffe599\">de trocas constantes de protetores higiênicos (tipicamente estimado entre 5 e 80 mL). <\/mark> Qualquer alteração significativa nesses eixos, além da ocorrência de sangramento intermenstrual ou sangramento pós-coito, enquadra-se formalmente no diagnóstico sindrômico de SUA. Clinicamente, diferencia-se o quadro em SUA crônico — quando a <mark style=\"--m:#ffe599\">anormalidade nos parâmetros menstruais persiste na maior parte dos últimos seis meses — <\/mark> e SUA agudo, caracterizado por um episódio súbito de sangramento copioso com volume suficiente para exigir intervenção médica emergencial imediata visando à prevenção ou correção de instabilidade hemodinâmica.<\/p>\n<p>Historicamente, a literatura e a prática clínica utilizavam terminologias imprecisas <mark style=\"--m:#ffe599\">como \"menorragia\", \"metrorragia\", \"oligomenorreia\" e \"sangramento uterino disfuncional\", o <\/mark> que gerava intensa confusão diagnóstica, prejudicava o alinhamento de condutas terapêuticas e dificultava a comparabilidade de ensaios clínicos internacionais. Para sanar essa fragmentação semântica e sistematizar a investigação diagnóstica, o Comitê de <mark style=\"--m:#ffe599\">Distúrbios Menstruais da Federação Internacional de Ginecologia e Obstetrícia (FIGO) <\/mark> <mark style=\"--m:#ffe599\">desenvolveu em 2011, e revisou em 2018, o acrônimo mnemônico <\/mark><mark style=\"--m:#ffe599\"><strong>PALM-COEIN<\/strong><\/mark><mark style=\"--m:#ffe599\">. Esse <\/mark> <mark style=\"--m:#ffe599\">sistema categoriza as etiologias do sangramento uterino anormal em dois grandes grupos: <\/mark> <mark style=\"--m:#ffe599\">causas estruturais, passíveis de identificação por métodos de imagem diagnóstica (como <\/mark> <mark style=\"--m:#ffe599\">ultrassonografia transvaginal, histerossonografia e ressonância magnética) ou análise <\/mark> <mark style=\"--m:#ffe599\">anatomopatológica (grupo PALM); e causas não estruturais, de natureza sistêmica, <\/mark> <mark style=\"--m:#ffe599\">funcional, iatrogênica ou hemostática, que não decorrem de lesões macroscópicas no <\/mark> <mark style=\"--m:#ffe599\">miométrio ou endométrio (grupo COEIN). <\/mark><\/p>\n<h3 class=\"hb\" style=\"--c:#990000;--hb:#ea9999;\">Etiologias Estruturais: O Grupo PALM<\/h3>\n<p>As causas estruturais agrupam lesões orgânicas mensuráveis da arquitetura uterina, <mark style=\"--m:#ffe599\">nas quais o sangramento decorre predominantemente de alterações mecânicas, <\/mark> <mark style=\"--m:#ffe599\">angiogênese aberrante, compressão vasc
