ma heterogênea. A fase inicial é marcada pela irregularidade da duração dos ciclos menstruais (variações de sete ou mais dias entre ciclos consecutivos), evoluindo na transição tardia para intervalos de amenorreia superiores a 60 dias. A instabilidade vasomotora decorrente da hipoestrogenemia desregula os centros termorreguladores hipotalâmicos, gerando as clássicas ondas de calor (fogachos), sudorese noturna e despertares frequentes, com reflexos diretos na arquitetura do sono e no humor.<\/p>\n<p>Em médio e longo prazos, a privação estrogênica crônica desencadeia repercussões teciduais multissistêmicas expressivas:<\/p>\n<ul>\n<li><strong>Síndrome Geniturinária da Menopausa (SGM):<\/strong> Atrofia do epitélio estratificado da vagina e da uretra, diminuição do conteúdo de glicogênio intracelular e redução de <em>Lactobacillus<\/em>, elevando o pH vaginal e predispondo a dispaunia, ressecamento, prurido, disúria e infecções urinárias de repetição.<\/li>\n<li><strong>Remodelamento e Perda de Massa Óssea:<\/strong> Desacoplamento da remodelação óssea com predomínio da reabsorção mediada por osteoclastos (via elevação de RANKL e redução de osteoprotegerina), acelerando a perda mineral óssea trabecular e elevando o risco de osteopenia e osteoporose.<\/li>\n<li><strong>Alterações Cardiovasculares e Metabólicas:<\/strong> Perda do efeito vasodilatador e protetor do endotélio mediado pelo óxido nítrico, redistribuição androgênica da gordura corporal para o compartimento visceral e perfil lipídico desfavorável (elevação de LDL e triglicerídeos com queda de HDL).<\/li><\/ul>\n<div class=\"tbl\"><table><tr><th><strong>Critério <\/strong> <strong>de <\/strong> <strong>Comparação<\/strong><\/th><th><strong>Climatério<\/strong><\/th><th><strong>Menopausa<\/strong><\/th><\/tr><tr><td><strong>Natureza Temporal<\/strong><\/td><td>Período de transição biológica prolongado (fase de anos).<\/td><td>Evento ou marco fisiológico pontual (datação retrospectiva).<\/td><\/tr><tr><td><strong>Faixa Etária Típica<\/strong><\/td><td>Aproximadamente dos 40 aos 65 anos de idade.<\/td><td>Média populacional aos 48 a 52 anos de idade.<\/td><\/tr><tr><td><strong>Critério Diagnóstico<\/strong><\/td><td>Clínico e progressivo: alterações de ciclo, sintomas<\/td><td>Clínico e retrospectivo: 12 meses consecutivos de amenorreia espontânea.<\/td><\/tr><tr><td><\/td><td>vasomotores e neurovegetativos.<\/td><td><\/td><\/tr><tr><td><strong>Condição Hormonal<\/strong><\/td><td>Flutuação neuroendócrina dinâmica; elevação progressiva de FSH com declínio gradual de inibinas e estradiol.<\/td><td>Hipoestrogenemia definitiva e persistente associada a hipergonadotrofismo fixo (FSH e LH marcadamente elevados).<\/td><\/tr><tr><td><strong>Capacidade <\/strong> <strong>Reprodutiva<\/strong><\/td><td>Declínio progressivo e irregular da fertilidade, embora gestações raras ainda possam ocorrer nas fases iniciais.<\/td><td>Cessação absoluta e definitiva da capacidade ovulatória e reprodutiva natural.<\/td><\/tr><\/table><\/div>\n<h3 class=\"hb\" style=\"--c:#38761d;--hb:#d9ead3;\">Síntese Integradora<\/h3>\n<p>Em síntese, o climatério representa todo o continuum temporal e biológico de declínio da reserva ovariana, no qual a mulher vivencia adaptações orgânicas e sintomáticas progressivas frente à instabilidade esteroidogênica. A menopausa, por sua vez, constitui o ponto de culminância desse declínio folicular — o evento biológico demarcado por um ano de amenorreia —, separando a pré/perimenopausa da pós-menopausa definitiva. Compreender essa distinção é indispensável para o manejo clínico adequado, garantindo intervenções precisas quanto à contracepção, rastreamento de comorbidades metabólicas e indicação oportuna de terapêutica hormonal.<\/p>\n<h3 class=\"hb\" style=\"--c:#38761d;--hb:#d9ead3;\">Referências Bibliográficas<\/h3>\n<ol>\n<li>1. BEREK, J. S. <strong>Berek &amp; Novak: Tratado de Ginecologia<\/strong>. 16. ed. Rio de Janeiro: Guanabara Koogan, 2021. Cap. 21: Menopausa e Tratamento Hormonal, p. 890-942.<\/li>\n<li>2. BRASIL. Ministério da Saúde. Secretaria de Atenção à Saúde. Departamento de Ações Programáticas Estratégicas. <strong>Manual de Atenção à Mulher no Climatério/Menopausa<\/strong>. Brasília: Editora do Ministério da Saúde, 2008. (Série A. Normas e Manuais Técnicos).<\/li>\n<li>3. FEDERAÇÃO BRASILEIRA DAS ASSOCIAÇÕES DE GINECOLOGIA E OBSTETRÍCIA (FEBRASGO). <strong>Manual de Orientação em Climatério<\/strong>. São Paulo: FEBRASGO, 2020.<\/li>\n<li>4. HARLOW, S. D. et al. Executive summary of the Stages of Reproductive Aging Workshop + 10: addressing the unfinished agenda of staging reproductive aging. <strong>The Journal of Clinical Endocrinology &amp; Metabolism<\/strong>, v. 97, n. 4, p. 1159-1168, 2012.<\/li>\n<li>5. HOFFMAN, B. L. et al. <strong>Ginecologia de Williams<\/strong>. 3. ed. Porto Alegre: Artmed, 2019. Cap. 21: A Mulher Menopausada, p. 534-558.<\/li><\/ol>\n<h2 class=\"hb\" style=\"--c:#274e13;--hb:#93c47d;\">2- Descreva os principais distúrbios relacionados ao climatério (alterações vasomotoras, sono, humor, libido, urogenitais e metabólicas)<\/h2>\n<h3 class=\"hb\" style=\"--c:#38761d;--hb:#d9ead3;\">Introdução e Perspectiva Sistêmica<\/h3>\n<p>O climatério representa uma fase de transição endócrina e biológica profunda, deflagrada pela falência progressiva e definitiva da foliculogênese ovariana. Longe de ser um evento restrito ao aparelho reprodutor, a privação crônica e flutuante de esteroides sexuais — em particular do 17-beta-estradiol — repercute de maneira multissistêmica. Receptores estrogênicos dos subtipos alfa (ER-alfa) e beta (ER-beta) encontram-se amplamente distribuídos pelo organismo feminino, incluindo o sistema nervoso central, o endotélio vascular, o urotélio, a matriz óssea, os adipócitos e os hepatócitos. Consequentemente, o colapso na esteroidogênese ovariana desencadeia uma cascata fisiopatológica complexa, convertendo a transição menopáusica em um período de elevada vulnerabilidade clínica, com queixas agudas que comprometem a qualidade de vida e alterações crônicas e silenciosas que elevam a morbimortalidade cardiovascular e osteometabólica.<\/p>\n<h3 class=\"hb\" style=\"--c:#38761d;--hb:#d9ead3;\">Instabilidade Vasomotora e Termorregulação Central<\/h3>\n<p>Os sintomas vasomotores (fogachos e sudorese noturna) constituem a manifestação clínica mais prevalente da transição climatérica, acometendo entre 60% e 80% das mulheres em diferentes graus de intensidade. O mecanismo fisiopatológico subjacente decorre do estreitamento da zona de termoneutralidade no centro termorregulador hipotalâmico, localizado na área pré-óptica anterior. Em condições de euestrogenemia, o hipotálamo tolera oscilações térmicas fisiológicas sem deflagrar mecanismos imediatos de dissipação ou conservação de calor. Na carência estrogênica, pequenas elevações da temperatura central (frequentemente inferiores a 0,2°C a 0,5°C) são interpretadas de forma aberrante pelo hipotálamo como sobrecarga térmica severa.<\/p>\n<p>No cerne dessa disfunção neuroendócrina está a hipertrofia e a desinibição funcional dos neurônios KNDy (coexpressadores de kisspeptina, neurocinina B e dinorfina), localizados no núcleo arqueado do hipotálamo. Sem o retrocontrole negativo exercido pelo 17-beta-estradiol sobre os receptores ER-alfa, esses neurônios hipersecretam neurocinina B (NKB), a qual estimula os receptores NK3 nos neurônios termorreguladores do núcleo pré-óptico. Paralelamente, ocorre aumento do tônus adrenérgico central e hipersensibilização dos receptores serotoninérgicos centrais 5-HT2A. Essa cascata neuroquímica recruta de maneira fulminante o sistema nervoso autônomo simpático, deflagrando vasodilatação periférica intensa e transitória (predominantemente no tronco superior, face e pescoço), elevação abrupta do fluxo sanguíneo cutâneo, taquicardia reflexa e sudorese profusa na tentativa de perder calor. Conforme o calor é dissipado, a temperatura central cai abaixo do limiar reajustado, sucedendo-se calafrios, tremores e sensação de prostração.<\/p>\n<h3 class=\"hb\" style=\"--c:#38761d;--hb:#d9ead3;\">Síndrome Geniturinária da Menopausa (SGM)<\/h3>\n<p>A Síndrome Geniturinária da Menopausa engloba um conjunto de alterações anatômicas, histológicas e funcionais que incidem sobre a vulva, vagina, uretra e trígono vesical, estruturas de origem embriológica comum no seio urogenital e com altíssima densidade de receptores estrogênicos. Ao contrário dos fogachos, que tendem a diminuir com os anos de pós-menopausa, a SGM é progressiva e não sofre remissão espontânea sem tratamento local ou sistêmico direcionado.<\/p>\n<p>A hipoestrogenemia resulta no adelgaçamento pronunciado do epitélio estratificado não queratinizado da vagina, ocorrendo redução das camadas superficial e intermediária com predomínio de células parabasais. Sem o estímulo trófico do estradiol, as células epiteliais deixam de sintetizar e acumular glicogênio. A escassez de glicogênio na luz vaginal priva a microbiota endógena — especificamente os bacilos de Döderlein (<em>Lactobacillus<\/em> spp.) — de seu substrato primário para a fermentação em ácido lático. Ocorre, portanto, uma elevação do pH vaginal de sua faixa fisiológica ácida (3,8 a 4,5) para níveis neutros ou alcalinos (5,5 a 7,0). Essa alcalinização quebra a barreira microbiológica protetora, permitindo a substituição da flora habitual por bactérias entéricas, anaeróbias e patógenos urogenitais. Microscopicamente, verifica-se ainda fragmentação de fibras de elastina, colapso de colágeno no estroma e rarefação do leito capilar da lâmina própria.<\/p>\n<p>Clinicamente, esse processo se manifesta por:<\/p>\n<ul>\n<li>Ressecamento vaginal acentuado, prurido, sensação de queimação constante e perda de elasticidade tissular;<\/li>\n<li>Dispareunia de introito e de profundidade, fissuras pós-coito e sinusorragia devido à extrema fragilidade da mucosa;<\/li>\n<li>Sintomas urinários baixos por atrofia do epitélio uretral e trígono vesical: disúria estéril, polaciúria, urgência miccional e infecções do trato urinário (ITU) de repetição.<\/li><\/ul>\n<h3 class=\"hb\" style=\"--c:#38761d;--hb:#d9ead3;\">Fisiopatologia do Remodelamento e Perda de Massa Óssea<\/h3>\n<p>O estrogênio desempenha um papel determinante na homeostase do esqueleto adulto, atuando como o principal modulador fisiológico negativo da reabsorção óssea. Em condições saudáveis, ele promove o acoplamento equilibrado entre a atividade dos osteoclastos (reabsorção) e dos osteoblastos (deposição de matriz mineral). Na transição climatérica, a perda estrogênica rompe essa dinâmica, acelerando o ritmo de rotação do tecido ósseo (<em>turn-over<\/em>) com predomínio absoluto da fase reabsortiva, processo que consome primariamente o osso trabecular e, mais tardiamente, o osso cortical.<\/p>\n<p>No nível molecular, a privação do 17-beta-estradiol suprime a síntese de osteoprotegerina (OPG) pelos osteoblastos e células estromais da medula óssea, ao mesmo tempo em que amplifica a produção e liberação do ligante do receptor ativador do fator nuclear kappa-B (RANKL) e de citocinas inflamatórias pró-reabsortivas, como TNF-alfa, IL-1, IL-6 e M-CSF. Sem a inibição competitiva da OPG, o RANKL liga-se amplamente ao receptor transmembrana RANK na superfície dos precursores osteoclásticos mononucleares, estimulando sua diferenciação, fusão em osteoclastos multinucleados maduros e prolongando sua sobrevida via inibição da apoptose. O resultado é a abertura de lacunas de reabsorção óssea excessivamente profundas que os osteoblastos não conseguem preencher. A perda de massa óssea pode chegar a taxas anuais de 2% a 5% nos primeiros cinco a sete anos pós-menopausa, levando à deterioração da microarquitetura esquelética, fragilidade trabecular, osteopenia/osteoporose e elevação substancial do risco de fraturas por fragilidade (especialmente em corpos vertebrais, rádio distal e colo do fêmur).<\/p>\n<h3 class=\"hb\" style=\"--c:#38761d;--hb:#d9ead3;\">Alterações Metabólicas, Composição Corporal e Risco Cardiovascular<\/h3>\n<p>Antes da menopausa, os estrogênios conferem proteção vascular e metabólica à mulher, o que explica a incidência tardia de eventos cardiovasculares em comparação aos homens. Contudo, a privação hormonal pós-menopáusica altera expressivamente o perfil cardiometabólico. A queda do estradiol acarreta disfunção endotelial primária devido à redução na transcrição e fosforilação da enzima óxido nítrico sintase endotelial (eNOS), diminuindo a biodisponibilidade do óxido nítrico (NO), um potente vasodilatador e antiaterogênico, e aumentando o estresse oxidativo na parede vascular por espécies reativas de oxigênio.<\/p>\n<p>Sob a perspectiva metabólica e lipídica, a transição climatérica promove uma transição no perfil de distribuição da gordura corporal: observa-se redução dos depósitos subcutâneos periféricos (gluteofemoral, mediado por receptores estrogênicos) e redistribuição androide para o compartimento visceral intra-abdominal. O tecido adiposo visceral é hiperlipolítico, liberando grande quantidade de ácidos graxos livres na circulação portal, o que intensifica a resistência hepática e periférica à insulina. Além disso, a perda estrogênica suprime a expressão dos receptores hepáticos de LDL (ApoB/E), prolongando a permanência do LDL-colesterol na circulação e promovendo modificações aterogênicas. O painel lipídico altera-se desfavoravelmente com elevação de LDL, apolipoproteína B e triglicerídeos, acompanhada pela redução quantitativa e qualitativa do HDL-colesterol. Esse conjunto de distúrbios alinha-se aos critérios da Síndrome Metabólica, elevando o risco de hipertensão arterial sistêmica, diabetes mellitus tipo 2 e doença arterial coronariana.<\/p>\n<h3 class=\"hb\" style=\"--c:#38761d;--hb:#d9ead3;\">Distúrbios do Sono, Humor e Cognição<\/h3>\n<p>A arquitetura do sono e a regulação afetiva são profundamente moduladas por esteroides ovarianos, que influenciam vias sinápticas noradrenérgicas, serotoninérgicas e gabaérgicas. Os distúrbios do sono no climatério possuem gênese multifatorial. O componente primário e mais comum reside na fragmentação mecânica do sono secundária aos despertares noturnos súbitos provocados pelas crises vasomotoras e sudorese intensa, que desestruturam os ciclos do sono REM e o sono não-REM de ondas lentas (fase restauradora). Contudo, há também disfunção primária na regulação circadiana: a carência estrogênica afeta a síntese de melatonina e diminui a transmissão gabaérgica inibitória no sistema reticular ativador ascendente, gerando insônia de manutenção, despertares precoces e sensação de sono não restaurador, mesmo na ausência de fogachos perceptíveis.<\/p>\n<p>No campo psicoemocional, a transição menopáusica duplica o risco relativo de episódios depressivos e distúrbios de ansiedade generalizada, especialmente em mulheres com histórico prévio de transtorno disfórico pré-menstrual ou depressão pós-parto. O estradiol é um cofator relevante na síntese, recaptação e degradação de neurotransmissores: ele estimula a transcrição da triptofano hidroxilase (enzima limitante da síntese de serotonina) e suprime a atividade da monoamina oxidase (MAO), enzima que degrada serotonina, dopamina e noradrenalina. Com o declínio estrogênico, ocorre hipoatividade das vias serotoninérgicas centrais, precipitando labilidade emocional, irritabilidade acentuada, anedonia, fadiga mental e lentificação executiva. O quadro é frequentemente acompanhado pela queixa de \"névoa mental\" (<em>brain fog<\/em>), caracterizada por lapsos de memória episódica e dificuldade de concentração decorrentes da redução do metabolismo glicídico no córtex pré-frontal e no hipocampo.<\/p>\n<h3 class=\"hb\" style=\"--c:#38761d;--hb:#d9ead3;\">Disfunção Sexual e Alterações da Libido<\/h3>\n<p>A deterioração da resposta sexual no climatério decorre da sobreposição entre alterações anatômicas, hormonais e psíquicas. O sintoma mais prevalente é a redução do desejo sexual, frequentemente diagnosticada como Transtorno do Desejo Sexual Hipoativo (TDSH). A fisiopatologia hormonal dessa queixa envolve não apenas a queda dos estrogênios, mas também a redução dos níveis de androgênios biodisponíveis. Embora o estroma ovariano residual continue a sintetizar testosterona e androstenediona sob o influxo de LH elevado, os níveis totais de testosterona circulante diminuem progressivamente a partir da quarta década pela involução concomitante da zona reticular da suprarrenal.<\/p>\n<p>Adicionalmente, naquelas mulheres que não desenvolvem síndrome metabólica severa, as flutuações hormonais ou o uso de determinadas medicações podem alterar as concentrações da globulina ligadora de hormônios sexuais (SHBG), reduzindo ainda mais a fração livre (e biologicamente ativa) da testosterona. No sistema nervoso central, a testosterona e o estradiol modulam as vias de recompensa e motivação mediadas pela dopamina na área tegmental ventral e no hipotálamo ventromedial. Na carência desses hormônios, ocorre perda da excitabilidade central, diminuição da intencionalidade de fantasias sexuais e anorgasmia. Esse déficit neuroquímico se soma ao componente periférico da SGM: a atrofia e estenose vulvovaginal, associadas à redução da lubrificação e vascularização clitoridiana e vestibular, tornam o coito desconfortável ou doloroso (dispareunia), gerando um ciclo vicioso de dor antecipatória, espasmo reflexo da musculatura do assoalho pélvico e aversão ao intercurso sexual.<\/p>\n<div class=\"tbl\"><table><tr><th><strong>Eixo Fisiopatológico<\/strong><\/th><th><strong>Principais <\/strong> <strong>Mecanismos <\/strong> <strong>Neuroendócrinos/Moleculares<\/strong><\/th><th><strong>Manifestações Clínicas Primárias<\/strong><\/th><\/tr><tr><td><strong>Instabilidade <\/strong> <strong>Vasomotora<\/strong><\/td><td>Estreitamento da zona termorreguladora hipotalâmica; hiperatividade de neurônios KNDy (neurocinina B/receptores NK3); tônus adrenérgico aumentado.<\/td><td>Fogachos (ondas de calor repentinas), rubor facial, sudorese noturna profusa e calafrios pós-episódio.<\/td><\/tr><tr><td><strong>Síndrome <\/strong> <strong>Geniturinária<\/strong><\/td><td>Atrofia do epitélio vaginal; depleção de glicogênio e lactobacilos; alcalinização do pH (&gt; 5,0); fibrose estromal e isquemia local.<\/td><td>Ressecamento e prurido vaginal, dispareunia, fragilidade mucosa, disúria, polaciúria e ITU bacteriana de repetição.<\/td><\/tr><tr><td><strong>Remodelamento <\/strong> <strong>Ósseo<\/strong><\/td><td>Aumento da razão RANKL/OPG; ativação, proliferação e sobrevivência prolongada de osteoclastos; liberação de citocinas inflamatórias.<\/td><td>Perda de densidade mineral óssea (osteopenia/osteoporose) e predisposição a fraturas por fragilidade esquelética.<\/td><\/tr><tr><td><strong>Metabolismo <\/strong> <strong>e <\/strong> <strong>Cardiovascular<\/strong><\/td><td>Queda da eNOS e menor síntese de NO; perda de receptores hepáticos de LDL; lipólise visceral acentuada e resistência periférica à insulina.<\/td><td>Aumento de peso corporal com acúmulo de gordura visceral, dislipidemia aterogênica (LDL/triglicerídeos altos, HDL baixo) e risco cardiovascular.<\/td><\/tr><tr><td><strong>Sono, <\/strong> <strong>Humor <\/strong> <strong>e <\/strong> <strong>Cognição<\/strong><\/td><td>Fragmentação do sono por despertares vasomotores; redução da síntese de serotonina/melatonina e aumento da atividade da MAO; hipometabolismo hipocampal.<\/td><td>Insônia de manutenção, labilidade emocional, episódios depressivos, irritabilidade, fadiga e lapsos de memória episódica (\"névoa mental\").<\/td><\/tr><tr><td><strong>Sexualidade e Libido<\/strong><\/td><td>Queda da testosterona livre e do estradiol com menor sinalização dopaminérgica central; perda do ingurgitamento vascular genital e dispareunia.<\/td><td>Transtorno do Desejo Sexual Hipoativo (TDSH), perda de lubrificação genital, aversão sexual secundária à dor e anorgasmia.<\/td><\/tr><\/table><\/div>\n<h3 class=\"hb\" style=\"--c:#38761d;--hb:#d9ead3;\">Síntese Integradora<\/h3>\n<p>Os múltiplos distúrbios que caracterizam o climatério compartilham um elo fisiopatológico unificador: a perda do estímulo pleiotrópico exercido pelos esteroides ovarianos em receptores teciduais distribuídos por todo o organismo. O quadro clínico não deve ser visto de forma fragmentada, pois seus eixos interagem continuamente entre si. A desregulação dos centros térmicos hipotalâmicos via neurônios KNDy deflagra crises vasomotoras noturnas que quebram a arquitetura do sono; a insônia resultante potencializa a vulnerabilidade a transtornos do humor e deterioração cognitiva; a atrofia urogenital perpetua a dor ao coito, que realimenta a perda da libido; e a perda de proteção endotelial somada à dislipidemia prepara o terreno para eventos cardiovasculares e fraturas osteoporóticas futuras. A compreensão detalhada desses mecanismos é indispensável para que o profissional de saúde estabeleça abordagens terapêuticas individualizadas, seguras e baseadas em evidências.<\/p>\n<p><strong>Referências Bibliográficas <\/strong><\/p>\n<ol>\n<li>1. BEREK, Jonathan S. <strong>Berek &amp; Novak: Tratado de Ginecologia<\/strong>. 16. ed. Rio de Janeiro: Guanabara Koogan, 2021. Cap. 21: Menopausa e Tratamento Hormonal, p. 890-942.<\/li>\n<li>2. BRASIL. Ministério da Saúde. Secretaria de Atenção à Saúde. Departamento de Ações Programáticas Estratégicas. <strong>Manual de Atenção à Mulher no Climatério/Menopausa<\/strong>. Brasília: Editora do Ministério da Saúde, 2008. (Série A. Normas e Manuais Técnicos).<\/li>\n<li>3. FEDERAÇÃO BRASILEIRA DAS ASSOCIAÇÕES DE GINECOLOGIA E OBSTETRÍCIA (FEBRASGO). <strong>Manual de Orientação em Climatério<\/strong>. São Paulo: FEBRASGO, 2020.<\/li>\n<li>4. HOFFMAN, Barbara L. et al. <strong>Ginecologia de Williams<\/strong>. 3. ed. Porto Alegre: Artmed, 2019. Cap. 21: A Mulher Menopausada, p. 534-558.<\/li>\n<li>5. THE NORTH AMERICAN MENOPAUSE SOCIETY (NAMS). The 2022 hormone therapy position statement of The North American Menopause Society. <strong>Menopause: The Journal of The North American Menopause Society<\/strong>, v. 29, n. 7, p. 767-794, 2022.<\/li>\n<li>6. YEN, Samuel S. C.; JAFFE, Robert B.; BARBIERI, Robert L. <strong>Endocrinologia Ginecológica<\/strong>. 8. ed. Rio de Janeiro: Elsevier, 2019. Cap. 14: Menopausa e Envelhecimento, p. 385-418.<\/li><\/ol>\n<h2 class=\"hb\" style=\"--c:#274e13;--hb:#93c47d;\">3- Indique os métodos diagnósticos do climatério (índice de kupperman e outros)<\/h2>\n<h3 class=\"hb\" style=\"--c:#38761d;--hb:#d9ead3;\">Introdução e Raciocínio Diagnóstico no Climatério<\/h3>\n<p>O diagnóstico do climatério é eminentemente clínico e epidemiológico, alicerçado na anamnese minuciosa e na identificação do padrão de transição menstrual associado a sintomas decorrentes da instabilidade neuroendócrina e da hipoestrogenemia progressiva. Em mulheres com idade superior a 40 ou 45 anos que apresentam irregularidade na duração dos ciclos menstruais acompanhada de sintomas vasomotores característicos, a suspeição diagnóstica atinge elevado valor preditivo positivo, dispensando, na maioria dos cenários da prática clínica diária, confirmações laboratoriais repetidas ou de alto custo. A propedêutica contemporânea, recomendada pelas principais sociedades de ginecologia e endocrinologia e pelo Ministério da Saúde, enfatiza que a abordagem diagnóstica tem dupla finalidade: primeiro, confirmar a fase da transição menopáusica e afastar diagnósticos diferenciais relevantes (como tireoidopatias, hiperprolactinemia e neoplasias ginecológicas); segundo, mensurar de forma padronizada a intensidade do sofrimento sintomático e o impacto na qualidade de vida da mulher, o que direciona a indicação e monitora a resposta à terapêutica proposta.<\/p>\n<h3 class=\"hb\" style=\"--c:#38761d;--hb:#d9ead3;\">Critérios Clínicos e a Classificação STRAW + 10<\/h3>\n<p>O sistema de estadiamento do envelhecimento reprodutivo feminino mais aceito mundialmente é o <em>Stages of Reproductive Aging Workshop<\/em> (STRAW + 10), que atua como padrão-ouro para estadiamento clínico e epidemiológico. O STRAW divide a vida reprodutiva e pós-reprodutiva feminina em três grandes fases (reprodutiva, transição menopáusica e pós-menopausa), englobando sete estágios numéricos principais (de -5 a +2). O climatério tem seu início formal demarcado nos estágios de transição menopáusica:<\/p>\n<ul>\n<li><strong>Transição Inicial (Estágio -2):<\/strong> Caracteriza-se por ciclos menstruais com variação persistente de sete ou mais dias na duração de ciclos consecutivos. Essa alteração reflete o recrutamento folicular errático secundário ao início da depleção da reserva ovariana e à redução da secreção de inibina B.<\/li>\n<li><strong>Transição Tardia (Estágio -1):<\/strong> Demarcada por episódios de amenorreia com intervalo igual ou superior a 60 dias. Esse marco assinala a falência frequente dos mecanismos de recrutamento e ovulação, acompanhada por oscilações bruscas nas concentrações de estradiol sérico e elevação persistente do FSH, sendo a fase de maior expressividade clínica dos sintomas vasomotores.<\/li>\n<li><strong>Pós-Menopausa Inicial (Estágios +1a, +1b e +1c):<\/strong> O estágio +1a corresponde ao primeiro ano subsequente ao evento menopausa (demarcado clinicamente após 12 meses consecutivos de amenorreia retrospectiva), período em que as flutuações hormonais residuais ainda podem desencadear sintomas vasomotores expressivos, enquanto os estágios subsequentes cursam com estabilização hormonal em níveis baixos de estrogênios e manutenção do hipergonadotrofismo.<\/li><\/ul>\n<h3 class=\"hb\" style=\"--c:#38761d;--hb:#d9ead3;\">Instrumentos Semiológicos e Escalas de Avaliação: Índice de Kupperman e Outros<\/h3>\n<p>A quantificação dos sintomas do climatério é fundamental para transformar queixas subjetivas em parâmetros clínicos reprodutíveis, permitindo estratificar a gravidade do quadro e avaliar a eficácia das intervenções comportamentais e farmacológicas. Dentre os instrumentos validados, destacam-se:<\/p>\n<ul>\n<li><strong>Índice Menopáusico de Blatt-Kupperman (IMBK):<\/strong> Desenvolvido originalmente na década de 1950, permanece como um dos questionários mais difundidos na prática e em pesquisas clínicas, inclusive adaptado e recomendado em manuais técnicos do Ministério da Saúde. O índice avalia 11 sintomas somáticos, vasomotores e psíquicos: ondas de calor/sudorese (fogachos), parestesias, insônia, irritabilidade/nervosismo, melancolia/depressão, vertigem, fadiga/astenia, artralgias/mialgias, cefaleia, palpitações e formigamento. Para o cálculo do escore total, cada sintoma recebe uma graduação de intensidade que varia de 0 (ausente), 1 (leve), 2 (moderado) a 3 (grave). Determinados sintomas recebem fatores de ponderação específicos que multiplicam sua pontuação para refletir maior impacto biológico — os sintomas vasomotores possuem peso 4, enquanto parestesias, insônia e irritabilidade possuem peso 2, e os demais sintomas têm peso 1. A soma dos pontos ponderados classifica o climatério em: leve (até 19 pontos), moderado (de 20 a 35 pontos) e acentuado/grave (mais de 35 pontos).<\/li><\/ul>\n<figure><img loading=\"lazy\" src=\"img/d909ea188933a72c.webp\" style=\"max-width:677px\" loading=\"lazy\" alt=\"\"><\/figure>\n<ul>\n<li><strong>Escala de Avaliação da Menopausa (<\/strong><em><strong>Menopause Rating Scale<\/strong><\/em><strong> - MRS):<\/strong> Criada como uma alternativa mais moderna e psicometricamente robusta ao IMBK, a escala MRS foi concebida para contornar vieses históricos de subestimação de queixas urogenitais. Composta por 11 itens divididos em três domínios funcionais bem estabelecidos:\n<ol>\n<li>1. <em>Dimensão Somato-vegetativa:<\/em> fogachos e sudorese, desconforto cardíaco (palpitações), distúrbios do sono e queixas articulares e musculares.<\/li>\n<li>2. <em>Dimensão Psicológica:<\/em> humor deprimido, irritabilidade, ansiedade e exaustão física/mental.<\/li>\n<li>3. <em>Dimensão Urogenital:<\/em> problemas sexuais (queda da libido e desconforto no coito), queixas urinárias e ressecamento vaginal.<\/li>\n<li>4. Cada item é graduado em uma escala Likert de 0 (sem sintomas) a 4 (sintomas muito severos), permitindo tanto a pontuação setorial por domínio quanto um escore composto geral de 0 a 44 pontos, amplamente utilizado para mensurar perda de qualidade de vida relacionada à saúde.<\/li><\/ol><\/li>\n<li><strong>Escala Cervical/Vaginal para Síndrome Geniturinária e Índice de Saúde Vaginal (VHI):<\/strong> O exame físico ginecológico armado atua como método semiótico diagnóstico direto da atrofia urogenital decorrente da carência estrogênica tecidual. O <em>Vaginal Health Index<\/em> de Gloria Bachmann avalia cinco parâmetros objetivos da mucosa: elasticidade tecidual, volume de fluido/lubrificação, integridade epitelial (presença de petéquias ou sangramento ao toque), espessura e umidade do epitélio, além da mensuração objetiva do pH vaginal com fita colorimétrica. Escores inferiores a 15 confirmam atrofia genital clinicamente significativa.<\/li><\/ul>\n<h3 class=\"hb\" style=\"--c:#38761d;--hb:#d9ead3;\">Diagnóstico Laboratorial: Indicações Precisas, Limitações e Marcadores Ovarianos<\/h3>\n<p>O uso de dosagens hormonais na abordagem diagnóstica do climatério exige parcimônia, senso crítico e conhecimento fisiopatológico. <strong>Em mulheres hígidas acima de 45 anos com quadro clínico clássico de perimenopausa, a solicitação de FSH e estradiol é dispensável e contraindicada como rotina de rastreio<\/strong>, uma vez que as oscilações hormonais agudas podem gerar resultados falsamente normais em uma fase e acentuadamente alterados semanas depois, gerando confusão interpretativa.<\/p>\n<p>Contudo, a avaliação laboratorial torna-se estritamente necessária em cenários clínicos específicos:<\/p>\n<ul>\n<li>Mulheres abaixo de 40 a 45 anos com amenorreia ou oligomenorreia persistente, com a finalidade de diagnosticar formalmente a Falência Ovariana Prematura / Insuficiência Ovariana Prematura (IOP). Nesses casos, o critério diagnóstico exige <strong>duas dosagens séricas de FSH elevadas<\/strong> (habitualmente maiores que 25 a 40 UI/L), colhidas com intervalo mínimo de quatro a seis semanas, acompanhadas de hipoestrogenemia (estradiol menor que 20 a 30 pg/mL).<\/li>\n<li>Mulheres histerectomizadas sem ooforectomia bilateral prévia (nas quais a ausência de sangramento uterino impede a observação do padrão de fluxo) ou usuárias de métodos contraceptivos hormonais supressores do endométrio (como DIU liberador de levonorgestrel ou progestagênios contínuos) que apresentam sintomas vasomotores atípicos.<\/li>\n<li>Mulheres submetidas a ablação endometrial prévia ou procedimentos cirúrgicos ginecológicos que mascaram o sangramento menstrual espontâneo.<\/li><\/ul>\n<p>No painel laboratorial de reserva folicular, o Hormônio Antimülleriano (AMH) — sintetizado pelas células da granulosa de folículos pré-antrais e antrais pequenos — reflete a quantidade residual de folículos no ovário <strong>de modo independente das gonadotrofinas e sem flutuações acentuadas ao longo do ciclo<\/strong>. Níveis indetectáveis ou inferiores a 0,1 ng/mL indicam esgotamento folicular avançado, auxiliando no prognóstico reprodutivo em mulheres em fase fértil tardia, embora também não deva ser utilizado isoladamente para prever a data cronológica exata do último sangramento menstrual.<\/p>\n<h3 class=\"hb\" style=\"--c:#38761d;--hb:#d9ead3;\">Diagnóstico Diferencial e Avaliação Complementar Crítica<\/h3>\n<p>Dado que a astenia, os distúrbios cognitivos, a irregularidade menstrual e as queixas de instabilidade térmica mimetizam diversas patologias sistêmicas prevalentes nessa mesma faixa etária, a propedêutica laboratorial racional inclui a dosagem do Hormônio Estimulante da Tireoide (TSH) e de tiroxina livre (T4 livre) para afastar hipo ou hipertireoidismo primário. Da mesma forma, a dosagem de prolactina é indicada frente a amenorreias secundárias inexplicadas para excluir hiperprolactinemia decorrente de microadenomas hipofisários. Em pacientes com risco metabólico aumentado, a investigação deve ser ampliada com perfil lipídico sérico, glicemia de jejum e hemoglobina glicada.<\/p>\n<p>No âmbito da propedêutica por imagem e preventiva:<\/p>\n<ul>\n<li><strong>Ultrassonografia Transvaginal:<\/strong> Avalia a espessura da linha endometrial (que na pós-menopausa sem terapia hormonal deve medir até 4 a 5 mm; espessuras superiores demandam investigação endometrial para excluir hiperplasia ou adenocarcinoma) e descarta alterações anatômicas miometriais (miomas) ou lesões expansivas anexiais.<\/li>\n<li><strong>Densitometria Óssea de Dupla Energia (DXA):<\/strong> Indicada para mulheres na pós-menopausa para rastreio de osteopenia e osteoporose segundo os critérios da Organização Mundial da Saúde (OMS), fundamentada no cálculo do escore T (<em>T-score<\/em> normal: até -1,0 desvio padrão; osteopenia: entre -1,1 e -2,4 desvios padrão; osteoporose: menor ou igual a -2,5 desvios padrão).<\/li>\n<li><strong>Mamografia Bilateral e Citopatologia Cérvico-Vaginal:<\/strong> Rastreamento oncológico preventivo obrigatório antes do início de qualquer modalidade de terapia hormonal sistêmica e para seguimento de rotina da saúde da mulher climatérica.<\/li><\/ul>\n<div class=\"tbl\"><table><tr><th><strong>Método <\/strong> <strong>Diagnóstico<\/strong><\/th><th><strong>Tipo <\/strong> <strong>de <\/strong> <strong>Avaliação<\/strong><\/th><th><strong>Aplicação <\/strong> <strong>Clínica <\/strong> <strong>e <\/strong> <strong>Indicação Principal<\/strong><\/th><th><strong>Interpretação e Pontos de <\/strong> <strong>Corte Chave<\/strong><\/th><\/tr><tr><td><strong>Classificação <\/strong> <strong>STRAW + 10<\/strong><\/td><td>Semiológica / Temporal<\/td><td>Padronização internacional do estadiamento da senescência reprodutiva e transição climatérica.<\/td><td>Estágio -2: ciclos com variação ≥ 7 dias. Estágio -1: amenorreia ≥ 60 dias. Estágio +1: pós-menopausa (após 12 meses de amenorreia).<\/td><\/tr><tr><td><strong>Índice <\/strong> <strong>de <\/strong> <strong>Blatt-Kupperman<\/strong><\/td><td>Escala / Questionário Clínico<\/td><td>Mensuração ponderada de 11 sintomas vasomotores, neurológicos e psicológicos do climatério.<\/td><td>Classificação por escore ponderado: ≤ 19 (leve), 20 a 35 (moderado), &gt; 35 (grave/severo).<\/td><\/tr><tr><td><strong>Menopause <\/strong> <strong>Rating <\/strong> <strong>Scale <\/strong> <strong>(MRS)<\/strong><\/td><td>Escala Psicométrica<\/td><td>Avaliação multidimensional do impacto na qualidade de vida (somática, psicológica e urogenital).<\/td><td>Escore global de 0 a 44. Permite avaliar domínios separadamente e monitorar resposta ao tratamento.<\/td><\/tr><tr><td><strong>Dosagem <\/strong> <strong>Sérica <\/strong> <strong>de <\/strong> <strong>FSH <\/strong> <strong>e <\/strong> <strong>Estradiol<\/strong><\/td><td>Laboratorial Hormonal<\/td><td>Reservada para mulheres &lt; 45 anos (suspeita de IOP), histerectomizadas ou usuárias de progestagênios contínuos.<\/td><td>FSH persistentemente elevado (&gt; 25 a 40 UI/L) com hipoestrogenemia (estradiol &lt; 20-30 pg/mL) colhidos em duas amostras.<\/td><\/tr><tr><td><strong>Hormônio <\/strong> <strong>Antimülleriano <\/strong> <strong>(AMH)<\/strong><\/td><td>Laboratorial Bioquímico<\/td><td>Avaliação da dotação folicular ovariana residual (folículos pré-antrais e antrais pequenos).<\/td><td>Concentrações muito baixas (&lt; 0,1 a 0,2 ng/mL) denotam colapso iminente da reserva funcional ovariana.<\/td><\/tr><tr><td><strong>Avaliação <\/strong> <strong>Diferencial <\/strong> <strong>e <\/strong> <strong>Rastreio <\/strong> <strong>(TSH, <\/strong> <strong>DXA, USG)<\/strong><\/td><td>Laboratorial e Exames de Imagem<\/td><td>Exclusão de tireoidopatias; estratificação de risco de fraturas osteoporóticas e vigilância endometrial.<\/td><td>TSH para afastar distúrbios da tireoide; DXA com T-score ≤ -2,5 confirmando osteoporose; eco endometrial &gt; 4-5 mm sob investigação.<\/td><\/tr><\/table><\/div>\n<h3 class=\"hb\" style=\"--c:#38761d;--hb:#d9ead3;\">Síntese Integradora<\/h3>\n<p>O diagnóstico assertivo do climatério baseia-se na supremacia da avaliação clínica, estruturada pela identificação cronológica dos critérios do STRAW + 10 e pela aferição quantitativa de escalas validadas como o Índice Menopáusico de Blatt-Kupperman e a Menopause Rating Scale. A solicitação indiscriminada de dosagens hormonais em mulheres acima de 45 anos incorre em armadilhas diagnósticas devido à volatilidade neuroendócrina do eixo gonadal nessa fase, devendo o laboratório ser reservado para cenários de incerteza anatômica ou investigação de insuficiência ovariana prematura em mulheres jovens. Assim, uma abordagem diagnóstica refinada integra a anamnese detalhada, a mensuração rigorosa da intensidade sintomática e o rastreio preventivo das repercussões metabólicas e ósseas crônicas, pavimentando o caminho para uma condução terapêutica individualizada e centrada na preservação da saúde e autonomia da paciente.<\/p>\n<h3 class=\"hb\" style=\"--c:#38761d;--hb:#d9ead3;\">Referências Bibliográficas<\/h3>\n<ol>\n<li>1. BEREK, Jonathan S. <strong>Berek &amp; Novak: Tratado de Ginecologia<\/strong>. 16. ed. Rio de Janeiro: Guanabara Koogan, 2021. Cap. 21: Menopausa e Tratamento Hormonal, p. 890-942.<\/li>\n<li>2. BRASIL. Ministério da Saúde. Secretaria de Atenção à Saúde. Departamento de Ações Programáticas Estratégicas. <strong>Manual de Atenção à Mulher no Climatério/Menopausa<\/strong>. Brasília: Editora do Ministério da Saúde, 2008. (Série A. Normas e Manuais Técnicos).<\/li>\n<li>3. CASPER, Robert F. Clinical manifestations and diagnosis of menopause. <strong>UpToDate<\/strong>, Post, TW (Ed), UpToDate, Waltham, MA, 2024.<\/li>\n<li>4. FEDERAÇÃO BRASILEIRA DAS ASSOCIAÇÕES DE GINECOLOGIA E OBSTETRÍCIA (FEBRASGO). <strong>Manual de Orientação em Climatério<\/strong>. São Paulo: FEBRASGO, 2020.<\/li>\n<li>5. HARLOW, Sioban D. et al. Executive summary of the Stages of Reproductive Aging Workshop + 10: addressing the unfinished agenda of staging reproductive aging. <strong>The Journal of Clinical Endocrinology &amp; Metabolism<\/strong>, v. 97, n. 4, p. 1159-1168, 2012.<\/li>\n<li>6. HOFFMAN, Barbara L. et al. <strong>Ginecologia de Williams<\/strong>. 3. ed. Porto Alegre: Artmed, 2019. Cap. 21: A Mulher Menopausada, p. 534-558.<\/li>\n<li>7. KUPPERMAN, Herbert S. et al. Comparative clinical evaluation of estrogenic preparations by the menopausal and amenorrheic indices. <strong>The Journal of Clinical Endocrinology &amp; Metabolism<\/strong>, v. 13, n. 6, p. 688-703, 1953.<\/li><\/ol>\n<h2 class=\"hb\" style=\"--c:#274e13;--hb:#93c47d;\">4- Elucide as formas de tratamento do climatério (hormonal com indicação e contraindicação, não-hormonal e não farmacológico)<\/h2>\n<h3 class=\"hb\" style=\"--c:#38761d;--hb:#d9ead3;\">Introdução e Racional Terapêutico<\/h3>\n<p>O manejo terapêutico do climatério tem como objetivo primário mitigar o sofrimento sintomático, restaurar a qualidade de vida e prevenir repercussões crônicas da privação estrogênica prolongada, com ênfase na saúde osteometabólica e cardiovascular. O declínio funcional ovariano impõe uma quebra na homeostase de múltiplos órgãos diana, demandando intervenções escalonadas e estritamente individualizadas. Longe de constituir uma conduta padronizada ou compulsória para todas as mulheres, o tratamento requer estratificação prévia de risco e benefício, avaliação da gravidade das manifestações clínicas e mapeamento de comorbidades pré-existentes. A tomada de decisão clínica articula três grandes pilares terapêuticos integrados: intervenções não farmacológicas e modificações no estilo de vida (a base para todas as pacientes), a terapia hormonal da menopausa (THM, padrão-ouro para sintomas vasomotores e atrofia urogenital em pacientes selecionadas dentro da chamada janela de oportunidade) e as opções farmacológicas não-hormonais (essenciais para mulheres com contraindicações formais aos esteroides exógenos ou que optam por abordagens alternativas).<\/p>\n<h3 class=\"hb\" style=\"--c:#38761d;--hb:#d9ead3;\">Terapia Hormonal da Menopausa (THM): Indicações Clínicas e o Conceito de Janela de Oportunidade<\/h3>\n<p>A Terapia Hormonal da Menopausa é a intervenção de maior eficácia clínica demonstrada para o controle dos sintomas vasomotores moderados a severos e para o alívio das manifestações da Síndrome Geniturinária da Menopausa (SGM), atuando adicionalmente na preservação sustentada da densidade mineral óssea. As diretrizes da Federação Brasileira das Associações de Ginecologia e Obstetrícia (FEBRASGO), da <em>The Menopause Society<\/em> (anteriormente NAMS) e do Ministério da Saúde convergem ao definir as indicações clássicas da THM:<\/p>\n<ul>\n<li><strong>Sintomas Vasomotores Relevantes:<\/strong> Presença de fogachos e sudorese noturna que comprometem o rendimento diário, a arquitetura do sono e a estabilidade emocional.<\/li>\n<li><strong>Síndrome Geniturinária da Menopausa Sintomática:<\/strong> Ressecamento vaginal, dispareunia e disúria atrófica refratárias a hidratantes e lubrificantes não hormonais de primeira linha.<\/li>\n<li><strong>Prevenção e Tratamento da Perda de Massa Óssea:<\/strong> Mulheres na pós-menopausa com elevado risco de fraturas osteoporóticas ou perda mineral acelerada que apresentem intolerância ou contraindicação a outras classes farmacológicas antirreabsortivas, ou naquelas que já possuem indicação concomitante por sintomas vasomotores.<\/li>\n<li><strong>Insuficiência Ovariana Prematura (IOP) / Hipoestrogenismo Precoce:<\/strong> Pacientes que evoluem para menopausa antes dos 40 anos (espontânea ou cirúrgica). Nesses casos, a THM não é opcional, mas uma reposição endócrina imperativa para mimetizar os níveis fisiológicos de esteroides até a idade média da menopausa natural (cerca de 50 a 51 anos), prevenindo morbimortalidade cardiovascular e óssea precoce.<\/li><\/ul>\n<p>No centro da moderna prescrição da THM reside a teoria da <strong>janela de oportunidade<\/strong> (ou hipótese do tempo de início). Ensaios clínicos e estudos de coorte demonstraram que a relação risco-benefício da THM é favorável quando iniciada em mulheres com menos de 60 anos de idade e/ou dentro dos primeiros 10 anos após a menopausa. Nessa fase inicial, o endotélio vascular ainda preserva sua integridade estrutural, a densidade de receptores estrogênicos alfa funcionais é mantida e as placas ateroscleróticas, se presentes, são incipientes e estáveis. O estrogênio administrado nesse intervalo exerce propriedades anti-inflamatórias, vasodilatadoras e redutoras da progressão aterogênica. Por outro lado, iniciar a THM tardiamente (idade superior a 60 anos ou mais de uma década após a cessação menstrual) expõe um leito vascular já remodelado, rígido e com placas ateromatosas avançadas ao influxo de estrogênio, o que pode aumentar a expressão de metaloproteinases de matriz, induzir instabilidade e ruptura da capa fibrosa da placa e precipitar eventos trombóticos agudos e acidentes vasculares encefálicos.<\/p>\n<h3 class=\"hb\" style=\"--c:#38761d;--hb:#d9ead3;\">Regimes Posológicos, Vias de Administração e Proteção Endometrial<\/h3>\n<p>A formulação e a via de administração da THM devem ser customizadas de acordo com o perfil anatômico e metabólico da mulher:<\/p>\n<ul>\n<li><strong>Necessidade Mandatória de Proteção Endometrial:<\/strong> Em mulheres com útero preservado, a monoterapia estrogênica sistêmica é formalmente proscrita. O estrogênio livre e contínuo estimula a proliferação mitótica das glândulas endometriais, induzindo hiperplasia endometrial simples, atípica e, em última instância, elevando exponencialmente o risco de adenocarcinoma de endométrio. Portanto, o uso concomitante de um agente progestagênico é indispensável para exercer retrocontrole antiproliferativo, antagonizar o efeito estrogênico e promover a diferenciação secretora do endométrio. Podem ser utilizados regimes combinados contínuos (estrogênio e progestagênio diários, promovendo amenorreia definitiva e prevenindo sangramentos de escape) ou cíclicos/sequenciais (progestagênio adicionado por 12 a 14 dias ao mês, mimetizando sangramentos por privação previsíveis, preferidos na perimenopausa inicial). Entre os progestagênios, dá-se preferência à progesterona micronizada natural ou à didrogesterona por seu perfil neutro sobre o metabolismo lipídico, ausência de impacto na pressão arterial e menor associação com o risco relativo de neoplasia mamária em relação aos progestagênios sintéticos clássicos (como o acetato de medroxiprogesterona). O sistema intrauterino liberador de levonorgestrel (SIU-LNG) constitui uma opção de proteção endometrial local contínua com absorção sistêmica mínima.<\/li>\n<li><strong>Mulheres Histerectomizadas:<\/strong> Podem utilizar estrogênio isolado de forma contínua, uma vez que o risco de carcinogênese endometrial foi eliminado com a remoção cirúrgica do órgão, dispensando a adição de progestagênios. A única exceção refere-se a pacientes histerectomizadas com história pregressa de endometriose grave, nas quais a adição de progesterona é prudente para evitar a reativação de focos ectópicos residuais.<\/li>\n<li><strong>Via Oral versus Via Não Oral (Transdérmica):<\/strong> O 17-beta-estradiol administrado por via oral sofre metabolização hepática de primeira passagem. Esse trânsito hepático estimula a transcrição de fatores de coagulação (fatores VII, IX, X, protrombina) e reduz a antitrombina III, além de elevar a proteína C reativa ultrassensível e os triglicerídeos séricos, embora aumente o HDL e reduza o LDL. Em contrapartida, a via transdérmica (gel ou adesivos) contorna a circulação portal, fornecendo níveis estáveis de estradiol plasmático com absorção tecidual periférica direta. Por não exercer o efeito de primeira passagem hepática, a via transdérmica apresenta impacto neutro na cascata de coagulação, não elevando o risco de tromboembolismo venoso (TEV) e acidente vascular encefálico isquêmico, sendo a via de escolha para mulheres com sobrepeso, hipertensão arterial compensada, hipertrigliceridemia, diabetes mellitus ou risco cardiovascular intermediário.<\/li>\n<li><strong>Terapia Estrogênica Local (Vaginal):<\/strong> Indicada exclusivamente quando as queixas do climatério limitam-se à Síndrome Geniturinária da Menopausa. A aplicação tópica de estriol ou promestrieno em cremes, óvulos ou anéis promove trofismo celular direto do epitélio vaginal e uretra inferior, restaura a flora de lactobacilos e normaliza o pH, sem atingir concentrações séricas sistêmicas significativas. Dessa forma, a estrogenioterapia local não requer oposição com progestagênio, não apresenta repercussão vascular sistêmica e pode ser considerada, sob anuência do oncologista assistente, até mesmo em casos selecionados de neoplasias mamárias após o término de tratamentos curativos primários.<\/li><\/ul>\n<h3 class=\"hb\" style=\"--c:#38761d;--hb:#d9ead3;\">Contraindicações Formais à Terapia Hormonal Sistêmica<\/h3>\n<p>A identificação precisa das contraindicações à THM sistêmica é fundamental para evitar a ocorrência de desfechos clínicos adversos graves. Didaticamente, dividem-se em contraindicações absolutas e situações de alto risco que desautorizam o uso dos esteroides sexuais:<\/p>\n<ul>\n<li><strong>Neoplasia Maligna de Mama:<\/strong> Câncer de mama prévio, suspeito ou atual, em razão da responsividade biológica de clones tumorais aos receptores de estrogênio e progesterona.<\/li>\n<li><strong>Neoplasias Estrogênio-Dependentes:<\/strong> Histórico ou suspeita de câncer de endométrio ou outras neoplasias ginecológicas dependentes de estímulo hormonal.<\/li>\n<li><strong>Sangramento Vaginal de Causa Desconhecida:<\/strong> Qualquer episódio de sangramento uterino anormal sem diagnóstico etiológico firmado (exige investigação histopatológica prévia do endométrio para descartar atipias ou malignidade).<\/li>\n<li><strong>Tromboembolismo Venoso Ativo ou Prévio:<\/strong> Histórico pessoal de trombose venosa profunda (TVP) espontânea, embolia pulmonar (TEP) recorrente ou trombofilias congênitas de alto risco comprovadas (fator V de Leiden homozigoto, deficiência de antitrombina, mutação da protrombina).<\/li>\n<li><strong>Doença Tromboembólica Arterial Ativa ou Recente:<\/strong> Infarto agudo do miocárdio (IAM), acidente vascular encefálico (AVE) isquêmico ou ataque isquêmico transitório (AIT) prévios.<\/li>\n<li><strong>Hepatopatia Aguda ou Doença Hepática Ativa e Grave:<\/strong> Insuficiência hepática, hepatite ativa ou cirrose hepática descompensada (comprometimento crítico da metabolização de esteroides sexuais).<\/li>\n<li><strong>Porfiria Cutânea Tardia:<\/strong> Agravamento do quadro metabólico enzimático hepático precipitado pelo influxo hormonal exógeno.<\/li>\n<li><strong>Lúpus Eritematoso Sistêmico (LES) com Anticorpos Antifosfolípides Positivos:<\/strong>  Risco trombótico micro e macrovascular acentuado pela exposição estrogênica.<\/li><\/ul>\n<h3 class=\"hb\" style=\"--c:#38761d;--hb:#d9ead3;\">Tratamento Farmacológico Não-Hormonal<\/h3>\n<p>O manejo não-hormonal direciona-se primordialmente às mulheres que apresentam contraindicações formais à THM sistêmica (como sobreviventes de câncer de mama ou pacientes com antecedente trombótico) ou que recusam a terapêutica hormonal. Embora apresentem eficácia discretamente inferior à reposição estrogênica quanto à intensidade de supressão dos fogachos, essas opções reduzem significativamente as crises vasomotoras através de mecanismos neuroquímicos centrais:<\/p>\n<ul>\n<li><strong>Inibidores da Recaptação de Serotonina e Noradrenalina (IRSNs) e da Serotonina (ISRSs):<\/strong> A venlafaxina (IRSN, dose de 37,5 a 75 mg/dia) e a desvenlafaxina (50 a 100 mg/dia) modulam a recaptação de noradrenalina e serotonina no centro termorregulador hipotalâmico, reduzindo a hipersensibilidade dos neurônios pré-ópticos a variações térmicas mínimas e atenuando as crises vasomotoras em até 50% a 60%. Entre os ISRSs, a paroxetina (7,5 a 20 mg/dia) e o escitalopram também demonstram redução expressiva de fogachos. <em>Atenção oncológica:<\/em> A paroxetina e a fluoxetina são inibidores potentes da enzima citocromo P450 2D6 (CYP2D6); portanto, são formalmente contraindicadas em mulheres com câncer de mama em uso de tamoxifeno, pois impedem a biotransformação do tamoxifeno em seu metabólito ativo mais potente (endoxifeno). Nestas pacientes em uso de tamoxifeno, a venlafaxina, a desvenlafaxina, o citalopram e a gabapentina são as drogas de escolha por apresentarem interferência metabólica nula ou mínima sobre o CYP2D6.<\/li>\n<li><strong>Gabapentinoides:<\/strong> A gabapentina (dose noturna inicial de 300 mg até 900 mg fracionada) atua ligando-se à subunidade alfa-2-delta dos canais de cálcio voltagem-dependentes no sistema nervoso central, reduzindo o efluxo excitatório de neurotransmissores e estabilizando a termorregulação. Sua prescrição noturna é vantajosa para mulheres cujos sintomas vasomotores fragmentam o sono, pois agrega um efeito sedativo benéfico sobre a insônia. A pregabalina (75 a 150 mg/dia) atua por mecanismo análogo e constitui alternativa viável.<\/li>\n<li><strong>Antagonistas dos Receptores de Neurocinina 3 (NK3):<\/strong> O fezolinetante representa uma classe terapêutica desenvolvida especificamente para a fisiopatologia do climatério. Atua bloqueando seletivamente os receptores NK3 nos neurônios do núcleo pré-óptico hipotalâmico, que recebem hiperestimulação de neurocinina B secretada pelos neurônios KNDy hipertrofiados na carência estrogênica. Ao restabelecer o equilíbrio neuronal no centro termorregulador sem exercer atividade em receptores nucleares estrogênicos, suprime os sintomas vasomotores de forma comparável à THM, constituindo uma opção segura em populações oncológicas ou com risco vascular elevado.<\/li>\n<li><strong>Agonistas Alfa-2 Adrenérgicos Centrais:<\/strong> A clonidina (0,05 a 0,1 mg/dia) reduz o tônus simpático central e a liberação de noradrenalina hipotalâmica, estabilizando o diâmetro da zona termoneutra. Contudo, seu uso é limitado pela frequência de efeitos adversos, como hipotensão postural, sedação diurna intensa, xerostomia e insônia de rebote após descontinuação abrupta.<\/li>\n<li><strong>Manejo Local da Síndrome Geniturinária:<\/strong> Em pacientes com contraindicação absoluta ao estrogênio tópico (como algumas usuárias de inibidores da aromatase), utilizam-se hidratantes vaginais de base aquosa ou com ácido hialurônico (aplicados de duas a três vezes por semana para manter o turgor celular crônico) e lubrificantes hidrossolúveis de curta duração imediatamente antes da atividade coital para mitigar a dor mecânica e o atrito.<\/li><\/ul>\n<h3 class=\"hb\" style=\"--c:#38761d;--hb:#d9ead3;\">Abordagem Não Farmacológica e Intervenções no Estilo de Vida<\/h3>\n<p>As intervenções não farmacológicas compõem o alicerce terapêutico preventivo do climatério e devem ser recomendadas universalmente, independentemente da instituição de esquemas farmacológicos:<\/p>\n<ul>\n<li><strong>Prescrição de Exercício Físico Multimodal:<\/strong> A combinação de treinamento de força resistido (musculação com sobrecarga progressiva) e exercícios aeróbios regulares desempenha papel fisiológico chave. A sobrecarga mecânica axial sobre o arcabouço ósseo gera deformação piezoelétrica transitória nos cristais de hidroxiapatita e microfraturas fisiológicas controladas, estimulando a mecanotransdução nos osteócitos para sintetizar matriz óssea e modular a expressão de esclerostina e RANKL, o que atenua a reabsorção esquelética trabecular. Adicionalmente, o ganho de massa muscular esquelética melhora a translocação de receptores GLUT-4 independentemente de insulina, combatendo a resistência insulínica e a obesidade visceral, além de induzir angiogênese periférica, regular o tônus autônomo simpático e estimular a síntese de endorfinas, aliviando a reatividade hipotalâmica vasomotora e melhorando a densidade do sono profundo.<\/li>\n<li><strong>Modulações Nutricionais e Dietoterápicas:<\/strong> Adoção de padrões dietéticos de base anti-inflamatória e cardioprotetora, como a Dieta do Mediterrâneo, rica em ácidos graxos mono e poli-insaturados (azeite de oliva extravirgem, oleaginosas, peixes ricos em ômega-3) e pobre em carboidratos ultraprocessados. Deve-se garantir o aporte nutricional de cálcio elementar (1.000 a 1.200 mg/dia, preferencialmente por fontes alimentares) associado à manutenção de níveis séricos adequados de vitamina D (calcifediol &gt; 30 ng/mL em grupos de risco para osteoporose) para permitir absorção intestinal de cálcio ativa mediada pela calbindina. A restrição de alimentos termogênicos, condimentos picantes, álcool e cafeína reduz gatilhos periféricos que disparam episódios de vasodilatação reflexa e fragmentação do sono.<\/li>\n<li><strong>Terapia Cognitivo-Comportamental (TCC) e Higiene do Sono:<\/strong> Protocolos específicos de TCC adaptados para a transição menopáusica (TCC-M) demonstraram eficácia robusta na redução da percepção de incômodo e sofrimento associados aos fogachos, reestruturando cognições automáticas catastróficas e reações de estresse simpático secundárias ao episódio vasomotor. A higiene do sono — manutenção de horários regulares para deitar e acordar, resfriamento do ambiente noturno (temperatura entre 18°C e 21°C), uso de tecidos de algodão respiráveis em camadas e cessação de telas emissores de luz azul duas horas antes do repouso — reduz significativamente os despertares noturnos e a fadiga diurna.<\/li>\n<li><strong>Cessação do Tabagismo e Controle Ponderal:<\/strong> O tabaco exerce ação pró-aterogênica direta e induz o citocromo hepático CYP1A2, acelerando a conversão de estradiol em metabólitos inativos e antecipando a falência ovariana precoce em até dois anos em comparação com não tabagistas. A perda de 5% a 10% do peso corporal em mulheres com sobrepeso ou obesidade atenua o isolamento térmico subcutâneo e a hiperinsulinemia, reduzindo a gravidade dos sintomas vasomotores.<\/li><\/ul>\n<div class=\"tbl\"><table><tr><th><strong>Modalidade <\/strong> <strong>Terapêutica<\/strong><\/th><th><strong>Classe / Mecanismo <\/strong> <strong>de Ação<\/strong><\/th><th><strong>Indicações <\/strong> <strong>Clínicas <\/strong> <strong>Típicas<\/strong><\/th><th><strong>Principais <\/strong> <strong>Contraindicações <\/strong> <strong>e <\/strong> <strong>Cuidados<\/strong><\/th><\/tr><tr><td><strong>THM <\/strong> <strong>Sistêmica <\/strong> <strong>(Estrogênio <\/strong> <strong>+ <\/strong> <strong>Progestagênio)<\/strong><\/td><td>Reposição estrogênica sistêmica combinada com proteção endometrial progestagênica contínua ou cíclica.<\/td><td>Sintomas vasomotores moderados a severos e/ou alto risco de osteoporose em mulheres com útero preservado.<\/td><td>Câncer de mama e endométrio; sangramento uterino indeterminado; TEV/IAM/AVE prévios; hepatopatia aguda ativa.<\/td><\/tr><tr><td><strong>THM <\/strong> <strong>Sistêmica <\/strong> <strong>(Estrogênio <\/strong> <strong>Isolado)<\/strong><\/td><td>Reposição estrogênica sistêmica sem progesterona (via oral ou transdérmica).<\/td><td>Sintomas vasomotores moderados a severos em mulheres histerectomizadas (janela de oportunidade &lt; 60 anos).<\/td><td>Idênticas às da terapia combinada; não deve ser utilizada com útero in situ devido ao risco de câncer de endométrio.<\/td><\/tr><tr><td><strong>Terapia <\/strong> <strong>Estrogênica Local <\/strong> <strong>(Vaginal)<\/strong><\/td><td>Baixa dose de estrogênio tópico (estriol, promestrieno); absorção sistêmica mínima e sem efeito hepático.<\/td><td>Síndrome Geniturinária da Menopausa isolada (secura vaginal severa, dispareunia e disúria atrófica).<\/td><td>Sangramento vaginal de origem não diagnosticada; cuidados em neoplasias ativas sem liberação oncológica.<\/td><\/tr><tr><td><strong>Farmacoterapia <\/strong> <strong>Não-Hormonal <\/strong> <strong>(IRSNs / ISRSs)<\/strong><\/td><td>Modulação central das vias de recaptação de serotonina e noradrenalina hipotalâmicas<\/td><td>Sintomas vasomotores em mulheres com contraindicação formal à THM ou recusa ao uso de hormônios.<\/td><td>Náuseas, xerostomia e cefaleia; paroxetina/fluoxetina são contraindicadas com tamoxifeno (inibição do CYP2D6).<\/td><\/tr><tr><td><\/td><td>(venlafaxina, desvenlafaxina).<\/td><td><\/td><td><\/td><\/tr><tr><td><strong>Farmacoterapia <\/strong> <strong>Não-Hormonal <\/strong> <strong>(Antagonistas <\/strong> <strong>NK3)<\/strong><\/td><td>Bloqueio dos receptores NK3 no hipotálamo (fezolinetante), inibindo os neurônios termorreguladores estimulados por NKB.<\/td><td>Sintomas vasomotores moderados a severos em pacientes inelegíveis ou não responsivas a esteroides sexuais.<\/td><td>Monitoramento periódico das enzimas hepáticas (risco de hepatotoxicidade); contraindicado em insuficiência hepática/renal grave.<\/td><\/tr><tr><td><strong>Farmacoterapia <\/strong> <strong>Não-Hormonal <\/strong> <strong>(Gabapentinoides)<\/strong><\/td><td>Ligação aos canais de cálcio dependentes de voltagem neuronais (alfa-2-delta), estabilizando a excitabilidade central.<\/td><td>Sintomas vasomotores com predomínio noturno e insônia associada refratária a medidas convencionais.<\/td><td>Sedação diurna, tontura, sonolência, ataxia e risco de tolerância; requer titulação progressiva de doses.<\/td><\/tr><tr><td><strong>Intervenções Não <\/strong> <strong>Farmacológicas<\/strong><\/td><td>Treinamento de força resistido, Dieta do Mediterrâneo, TCC para menopausa e cessação do tabagismo.<\/td><td>Recomendação universal e mandatória para todas as mulheres em transição climatérica e pós-menopausa.<\/td><td>Ausência de contraindicações biológicas; requer adesão longitudinal e ajuste ergonômico individualizado.<\/td><\/tr><\/table><\/div>\n<h3 class=\"hb\" style=\"--c:#38761d;--hb:#d9ead3;\">Síntese Integradora<\/h3>\n<p>O tratamento do climatério estrutura-se como um plano assistencial longitudinal, dinâmico e focado no perfil clínico de cada paciente. A terapêutica hormonal da menopausa permanece como a ferramenta mais eficaz para o alívio vasomotor e urogenital, desde que prescrita dentro da janela de oportunidade (mulheres com menos de 60 anos ou dentro de 10 anos pós-menopausa), com proteção endometrial mandante para úteros intactos e seleção criteriosa da via de administração conforme o risco metabólico e cardiovascular basal. Para as pacientes que apresentam contraindicações absolutas — particularmente histórico oncológico de mama e antecedentes tromboembólicos —, os avanços nas terapias farmacológicas não-hormonais, como os inibidores da recaptação de serotonina/noradrenalina e os antagonistas dos receptores NK3, proporcionam alívio sintomático seguro. Sobrepondo-se a todas as estratégias, o estímulo regular a exercícios físicos resistidos, nutrição adequada, controle ponderal e higiene do sono compõe uma matriz preventiva insubstituível para atenuar as repercussões metabólicas e garantir um envelhecimento funcional e saudável.<\/p>\n<h3 class=\"hb\" style=\"--c:#38761d;--hb:#d9ead3;\">Referências Bibliográficas<\/h3>\n<ol>\n<li>1. BEREK, Jonathan S. <strong>Berek &amp; Novak: Tratado de Ginecologia<\/strong>. 16. ed. Rio de Janeiro: Guanabara Koogan, 2021. Cap. 21: Menopausa e Tratamento Hormonal, p. 890-942.<\/li>\n<li>2. BRASIL. Ministério da Saúde. Secretaria de Atenção à Saúde. Departamento de Ações Programáticas Estratégicas. <strong>Manual de Atenção à Mulher no Climatério/Menopausa<\/strong>. Brasília: Editora do Ministério da Saúde, 2008. (Série A. Normas e Manuais Técnicos).<\/li>\n<li>3. CASPER, Robert F. Menopausal hormone therapy: Benefits and risks. <strong>UpToDate<\/strong>, Post, TW (Ed), UpToDate, Waltham, MA, 2024.<\/li>\n<li>4. FEDERAÇÃO BRASILEIRA DAS ASSOCIAÇÕES DE GINECOLOGIA E OBSTETRÍCIA (FEBRASGO). <strong>Manual de Orientação em Climatério<\/strong>. São Paulo: FEBRASGO, 2020.<\/li>\n<li>5. HOFFMAN, Barbara L. et al. <strong>Ginecologia de Williams<\/strong>. 3. ed. Porto Alegre: Artmed, 2019. Cap. 21: A Mulher Menopausada, p. 534-558.<\/li>\n<li>6. THE 2022 HORMONE THERAPY POSITION STATEMENT OF THE NORTH AMERICAN MENOPAUSE SOCIETY. The 2022 hormone therapy position statement of The North American Menopause Society. <strong>Menopause: The Journal of The North American Menopause Society<\/strong>, v. 29, n. 7, p. 767-794, 2022.<\/li><\/ol>\n<h2 class=\"hb\" style=\"--c:#274e13;--hb:#93c47d;\">5- Sobre TPM responda:<\/h2>\n<p>a. Definição e causas b. Sinais e sintomas c. Tratamento d. Diferença de Transtorno Disfórico Pré-Menstrual<\/p>\n<h3 class=\"hb\" style=\"--c:#38761d;--hb:#d9ead3;\">Introdução e Contextualização Neuroendócrina<\/h3>\n<p>A Tensão Pré-Menstrual (TPM), formalmente denominada na literatura científica internacional como Síndrome Pré-Menstrual (SPM), consiste em um distúrbio neuroendócrino e psicossomático de caráter crônico e recorrente, intimamente acoplado à ciclicidade ovariana ovulatória. Longe de representar um mero desajuste emocional transitório ou uma flutuação hormonal quantitativa anômala, a síndrome configura um modelo de resposta biológica desadaptativa do sistema nervoso central diante de transições fisiológicas normais dos esteroides sexuais. Estima-se que até 75% a 80% das mulheres em idade reprodutiva vivenciem manifestações pré-menstruais fisiológicas leves (conhecidas como moléstias pré-menstruais), enquanto aproximadamente 20% a 30% preenchem critérios diagnósticos rigorosos para SPM clínica moderada a grave, cursando com comprometimento funcional em esferas interpessoais, ocupacionais e acadêmicas. O estudo da TPM demanda a integração entre a fisiologia da fase lútea, o processamento de neurotransmissores cerebrais e a modulação de receptores neuronais, compreendendo as bases moleculares que diferenciam o espectro pré-menstrual fisiológico de suas manifestações patológicas incapacitantes.<\/p>\n<h3 class=\"hb\" style=\"--c:#38761d;--hb:#d9ead3;\">a. Definição Conceitual e Etiopatogenia Neuroesteroide<\/h3>\n<ul>\n<li><strong>Definição Médica e Critérios Temporais:<\/strong> A Síndrome Pré-Menstrual é definida pelo surgimento cíclico, previsível e repetitivo de uma constelação de sintomas afetivos, comportamentais e somáticos que se manifestam exclusivamente durante a fase lútea do ciclo ovariano (geralmente nos 7 a 14 dias que antecedem a menstruação), sofrendo remissão completa e obrigatória nos primeiros dias após o início do fluxo menstrual (fase folicular precoce), acompanhada por um intervalo assintomático livre de queixas com duração de pelo menos uma semana. A presença de ovulação documentada e a resolução estrita pós-menstrual constituem premissas obrigatórias para o diagnóstico, afastando exacerbações pré-menstruais de transtornos psiquiátricos de base.<\/li>\n<li><strong>Etiopatogenia e Suscetibilidade Neuroquímica Central:<\/strong> As investigações endocrinológicas demonstraram de forma inequívoca que a vasta maioria das mulheres com TPM apresenta concentrações séricas absolutas de 17-beta-estradiol e progesterona rigorosamente idênticas àquelas de mulheres assintomáticas. A etiopatogenia central reside, portanto, em uma <strong>vulnerabilidade neurobiológica diferencial<\/strong> às flutuações hormonais fisiológicas, mediada primordialmente por metabólitos neuroesteroides e sistemas de neurotransmissão:\n<ul>\n<li><em>Desregulação do Eixo da Serotonina (5-HT):<\/em> O 17-beta-estradiol e a progesterona atuam como moduladores alostéricos centrais do tônus serotoninérgico. O estrogênio estimula a expressão da enzima triptofano hidroxilase (limitante da síntese de serotonina), inibe a enzima monoamina oxidase (MAO) e regula positivamente os transportadores e receptores 5-HT1A e 5-HT2A. Na fase lútea tardia, a queda sinérgica e abrupta dos níveis de estradiol e progesterona desencadeia uma depleção relativa da disponibilidade de serotonina na fenda sináptica de mulheres vulneráveis. Essa hipoatividade serotoninérgica transitória desestabiliza circuitos límbicos e do córtex pré-frontal, deflagrando irritabilidade, labilidade afetiva, disforia, compulsão por carboidratos (tentativa fisiológica de aumentar o triptofano plasmático) e amplificação da percepção dolorosa periférica.<\/li>\n<li><em>Paradoxo dos Neuroesteroides e Transmissão GABAérgica:<\/em> A progesterona ovariana é rapidamente metabolizada no tecido cerebral e periférico pela enzima 5-alfa-redutase e 3-alfa-hidroxiesteroide desidrogenase em <strong>alopregnanolona<\/strong> (3-alfa, 5-alfa-tetra-hidroprogesterona), um potente agonista alostérico positivo dos receptores GABA-A. Em concentrações basais e fisiológicas, a alopregnanolona potencializa a entrada de íons cloreto no neurônio pós-sináptico, exercendo ação sedativa, ansiolítica e moduladora de estresse. Contudo, em mulheres portadoras de suscetibilidade pré-menstrual, a flutuação rápida e o declínio nos níveis de alopregnanolona na fase lútea tardia alteram a plasticidade conformacional das subunidades do receptor GABA-A (especificamente a incorporação da subunidade alfa-4 em detrimento da subunidade alfa-1). Essa alteração estrutural converte o receptor GABA-A em uma forma insensível ou paradoxalmente excitável: a perda do tônus gabaérgico inibitório gera estados de hipervigilância, ansiedade paroxística, tensão emocional e hipersensibilidade ao estresse mediado pelo eixo hipotálamo-hipófise-adrenal (HHA).<\/li>\n<li><em>Ativação do Sistema Renina-Angiotensina-Aldosterona (SRAA):<\/em> Na fase lútea média e tardia, as altas concentrações de progesterona competem antagonicamente pelos receptores de mineralocorticoides nos túbulos renais, promovendo natriurese inicial transitória. Em resposta compensatória fisiológica exagerada, o organismo hiperativa o eixo da renina e da aldosterona tecidual. Quando os níveis de progesterona caem vertiginosamente antes da menstruação, o bloqueio mineralocorticoide cessa bruscamente, enquanto a aldosterona ainda se encontra em níveis suprafisiológicos, desencadeando reabsorção transitória excessiva de sódio e água no túbulo distal, edema estromal, ganho ponderal e distensão tecidual dolorosa.<\/li><\/ul><\/li><\/ul>\n<h3 class=\"hb\" style=\"--c:#38761d;--hb:#d9ead3;\">b. Espectro Clínico: Sinais e Sintomas<\/h3>\n<p>O quadro clínico da TPM é polimorfo e reflete a distribuição ubíqua de receptores hormonais e alvos serotoninérgicos e gabaérgicos nos sistemas corporais. Didaticamente, agrupa-se em manifestações neuroafetivas/comportamentais e manifestações somáticas/vegetativas, cuja gravidade pode oscilar entre ciclos, mas cuja morfologia temporal lútea se repete com consistência:<\/p>\n<ul>\n<li><strong>Sintomas Afetivos e Comportamentais: <\/strong>\n<ul>\n<li><em>Instabilidade Emocional e Irritabilidade:<\/em> Sintoma nuclear mais prevalente; manifesta-se por reações desproporcionais a estímulos menores, intolerância interpessoal, acessos de fúria e perda momentânea do autocontrole.<\/li>\n<li><em>Labilidade Afetiva e Humor Depressivo:<\/em> Episódios súbitos de choro espontâneo sem fator deflagrador perceptível, sensação de solidão, desesperança transitória e anedonia circunscrita à fase lútea.<\/li>\n<li><em>Ansiedade, Tensão e Inquietação:<\/em> Sensação interna de estar \"no limite\", apreensão injustificada e exacerbação da reatividade adrenérgica com palpitações autonômicas.<\/li>\n<li><em>Alterações Apetite e Compulsão Alimentar:<\/em> Desejo incontrolável (<em>craving<\/em>) por alimentos de alta densidade calórica, particularmente carboidratos simples e chocolates, mecanismo reflexo decorrente da tentativa neuroquímica de restaurar estoques centrais de serotonina.<\/li>\n<li><em>Lapsos Cognitivos e Letargia:<\/em> Redução transitória da capacidade de concentração, queixas de fadiga mental, lapsos de memória de trabalho e sensação de esgotamento físico (<em>astenia<\/em>).<\/li><\/ul><\/li>\n<li><strong>Sintomas Físicos e Somáticos: <\/strong>\n<ul>\n<li><em>Mastalgia Cíclica e Mastodinia:<\/em> Sensação de peso, aumento volumétrico bilateral e hipersensibilidade extrema ao toque no parênquima mamário, secundários à proliferação ductal mediada por estrogênio somada à retenção hídrica estromal e microedema intersticial.<\/li>\n<li><em>Retenção Hídrica e Distensão Abdominal:<\/em> Sensação de empachamento, meteorismo, edema maleolar e ganho de peso transitório mensurável na balança (frequentemente de 1 a 2 kg na fase pré-menstrual).<\/li>\n<li><em>Cefaleia Cíclica:<\/em> Cefaleias do tipo tensional ou crises de migrânea desencadeadas pela retirada abrupta do estrogênio (<em>estrogen withdrawal headache<\/em>), com alteração do tônus vascular craniano e desregulação do sistema trigeminovascular.<\/li>\n<li><em>Sintomas Musculoesqueléticos:<\/em> Mialgias difusas, lombalgia, artralgias e sensação de peso pélvico secundárias ao aumento parassimpático e liberação de prostaglandinas inflamatórias intramiometriais antes do sangramento.<\/li><\/ul><\/li><\/ul>\n<h3 class=\"hb\" style=\"--c:#38761d;--hb:#d9ead3;\">c. Abordagem Terapêutica Farmacológica e Não Farmacológica<\/h3>\n<p>O manejo terapêutico da SPM é escalonado segundo a intensidade das queixas e a repercussão funcional, dividindo-se entre medidas de modificação do estilo de vida, psicoterapia, fármacos psicotrópicos e supressão da função ovariana:<\/p>\n<ul>\n<li><strong>Pilar Não Farmacológico e Modificações Comportamentais:<\/strong> Constitui a primeira linha mandatória para todas as pacientes. Inclui a prática regular de treinamento físico aeróbio e resistido (mínimo de 150 minutos semanais), cuja capacidade de induzir liberação de endorfinas, melhorar a circulação tecidual e regular a plasticidade de receptores cerebrais de serotonina atenua o estresse e o edema periférico. A abordagem nutricional envolve a restrição drástica de cafeína, álcool e sódio na fase lútea para diminuir a hiperestimulação adrenérgica e minimizar a reabsorção tubular hídrica. A introdução de refeições fracionadas e ricas em carboidratos complexos de baixo índice glicêmico estabiliza a glicemia e atenua os picos de compulsão alimentar. A <strong>Terapia Cognitivo-Comportamental (TCC)<\/strong>  demonstra eficácia comprovada ao fornecer ferramentas de enfrentamento (<em>coping<\/em>) para a reestruturação de distorções cognitivas e relaxamento neuromuscular durante os dias sintomáticos.<\/li>\n<li><strong>Inibidores Seletivos da Recaptação de Serotonina (ISRSs) — Primeira Linha Farmacológica:<\/strong> Em mulheres com sintomas emocionais moderados a severos, os ISRSs (sertralina, fluoxetina, paroxetina ou escitalopram) representam o padrão-ouro de eficácia clínica. Diferentemente do uso psiquiátrico em depressão maior — no qual o efeito terapêutico exige de três a quatro semanas para surgir via dessensibilização genômica de receptores —, na SPM os ISRSs produzem melhora clínica quase imediata (em 24 a 48 horas). Isso se explica porque, além de bloquearem a recaptação de serotonina, essas moléculas modulam de forma alostérica e direta a enzima cerebral aldo-ceto redutase, normalizando velozmente a conversão de metabólitos de progesterona em alopregnanolona. Podem ser prescritos em dois regimes principais: <strong>uso contínuo diário<\/strong> (preferido em pacientes com ciclos muito irregulares ou ansiedade basal concorrente) ou <strong>regime intermitente da fase lútea<\/strong> (iniciado no 14º dia do ciclo ou no início presumido dos sintomas e suspenso no primeiro ou segundo dia do fluxo menstrual), o qual reduz a exposição farmacológica, minimiza custos e diminui efeitos colaterais sexuais (como anorgasmia).<\/li>\n<li><strong>Supressão da Foliculogênese e Ciclicidade Ovariana: <\/strong>\n<ul>\n<li><em>Anticoncepcionais Orais Combinados (ACOs):<\/em> O objetivo primário é extinguir as flutuações hormonais endógenas e anular a ovulação, mantendo um platô esteroidogênico estável. O esquema mais respaldado por ensaios clínicos randomizados consiste na combinação de etinilestradiol (20 mcg) associado à <strong>drospirenona<\/strong> (3 mg) administrado em regime de regime estendido (24/4 dias) ou contínuo. A drospirenona é um análogo da espironolactona dotado de propriedades antimineralocorticoides e antiandrogênicas potentes, neutralizando a retenção hidrossalina, o edema e a mastalgia, ao mesmo tempo em que a supressão folicular impede os picos e quedas de alopregnanolona.<\/li>\n<li><em>Agonistas do Hormônio Liberador de Gonadotrofinas (GnRH-a):<\/em> Substâncias como a goserrelina ou leuprorrelina provocam uma dessensibilização dos receptores de GnRH na hipófise, bloqueando a secreção de FSH e LH e induzindo uma menopausa medicamentosa reversível (<em>ooforotectomia química<\/em>). Seu emprego é de exceção absoluta, restrito a casos ultrarrefatários a ISRSs e ACOs contínuos, exigindo terapia de reposição estroprogestativa em doses baixas (<em>add-back therapy<\/em>) para prevenir sintomas vasomotores severos e desmineralização óssea.<\/li><\/ul><\/li>\n<li><strong>Medidas Farmacológicas Sintomáticas:<\/strong> A mastalgia isolada responde favoravelmente a analgésicos e anti-inflamatórios não esteroidais (AINEs), que bloqueiam a síntese local de prostaglandinas intramamárias e miometriais. A espironolactona oral (50 a 100 mg/dia na fase lútea tardia) atua antagonizando competitivamente os receptores de aldosterona, sendo reservada para alívio de edema periférico evidente e distensão abdominal refratários.<\/li><\/ul>\n<h3 class=\"hb\" style=\"--c:#38761d;--hb:#d9ead3;\">d. Distinção Fisiopatológica e Diagnóstica: TPM versus Transtorno Disfórico Pré-Menstrual (TDPM)<\/h3>\n<p>Embora compartilhem a sincronização cronológica com a fase lútea do ciclo ovulatório, a TPM e o Transtorno Disfórico Pré-Menstrual (TDPM) não constituem meros sinônimos, mas sim entidades situadas em patamares clínicos, nosológicos e terapêuticos distintos:<\/p>\n<ul>\n<li><strong>Classificação Nosológica e Gravidade:<\/strong> Enquanto a TPM é catalogada como uma afecção ginecológica e neuroendócrina comum, o TDPM é formalmente categorizado no Manual Diagnóstico e Estatístico de Transtornos Mentais (DSM-5-TR) da Associação Americana de Psiquiatria como uma entidade psiquiátrica grave e incapacitante, inserida dentro do espectro dos transtornos depressivos. A prevalência do TDPM é consideravelmente mais restrita, acometendo entre 3% e 8% das mulheres no menacme.<\/li>\n<li><strong>Predomínio Sintomático e Requisito Diagnóstico Rígido (Critérios DSM-5-TR):<\/strong>  Na TPM convencional, a mulher pode queixar-se prioritariamente de sintomas físicos (mastodinia, sensação de inchaço) com discreta instabilidade emocional. No TDPM, o componente afetivo-disfórico é mandatório, severo e desproporcional. Para o diagnóstico de TDPM, exige-se a presença confirmada de pelo menos <strong>5 sintomas<\/strong>  ao longo da maioria dos ciclos menstruais do último ano, presentes na semana final da fase lútea e remitidos nos primeiros dias da fase folicular. Dentre os sintomas presentes, pelo menos <strong>um sintoma afetivo nuclear<\/strong> obrigatório deve constar:\n<ol>\n<li>1. Marcada labilidade afetiva (mudanças bruscas de humor, crises de choro, extrema sensibilidade à rejeição).<\/li>\n<li>2. Irritabilidade ou raiva marcadas, com aumento expressivo de conflitos interpessoais.<\/li>\n<li>3. Humor acentuadamente deprimido, sentimentos de desesperança ou ideações autodepreciativas.<\/li>\n<li>4. Ansiedade acentuada, tensão, sensação de estar com os nervos à flor da pele.<\/li><\/ol><\/li>\n<li><strong>Comprometimento Funcional e Ideação Suicida:<\/strong> Diferentemente da TPM, na qual a paciente preserva a sua rotina apesar do desconforto, o TDPM caracteriza-se por grave comprometimento da funcionalidade global: há absenteísmo no trabalho, incapacidade produtiva, deterioração de relacionamentos interpessoais e, em casos severos, ideação suicida recorrente circunscrita aos dias que antecedem a menstruação.<\/li>\n<li><strong>Método Diagnóstico Prospecitivo Obrigatório:<\/strong> O diagnóstico de TDPM não pode ser firmado retrospectivamente com base apenas na memória da paciente. Requer-se a aplicação de diários de registro diário prospectivo dos sintomas por pelo menos <strong>dois ciclos menstruais consecutivos<\/strong>, utilizando ferramentas validadas como o <em>Daily Record of Severity of Problems<\/em> (DRSP), comprovando o pico sintomático lúteo e a ausência absoluta de sintomas na fase folicular precoce.<\/li><\/ul>\n<div class=\"tbl\"><table><tr><th><strong>Parâmetro <\/strong> <strong>Comparativo<\/strong><\/th><th><strong>Tensão <\/strong> <strong>Pré-Menstrual <\/strong> <strong>(TPM / <\/strong> <strong>SPM)<\/strong><\/th><th><strong>Transtorno <\/strong> <strong>Disfórico <\/strong> <strong>Pré-Menstrual <\/strong> <strong>(TDPM)<\/strong><\/th><\/tr><tr><td><strong>Enquadramento <\/strong> <strong>Nosológico<\/strong><\/td><td>Síndrome ginecológica e neuroendócrina clínica.<\/td><td>Transtorno depressivo formal (Classificação DSM-5-TR).<\/td><\/tr><tr><td><strong>Prevalência <\/strong> <strong>Epidemiológica<\/strong><\/td><td>20% a 30% das mulheres em idade fértil.<\/td><td>3% a 8% das mulheres em idade reprodutiva.<\/td><\/tr><tr><td><strong>Perfil Sintomático <\/strong> <strong>Dominante<\/strong><\/td><td>Sintomas somáticos frequentes (mastalgia, inchaço) mesclados a manifestações emocionais leves a moderadas.<\/td><td>Sintomas afetivos nucleares gravíssimos (disforia profunda, raiva, labilidade, desespero e ansiedade paroxística).<\/td><\/tr><tr><td><strong>Critério <\/strong> <strong>Diagnóstico <\/strong> <strong>Mínimo<\/strong><\/td><td>Presença de pelo menos um sintoma físico ou emocional na fase lútea com alívio pós-menstrual.<\/td><td>Mínimo de 5 sintomas no DSM-5-TR, contendo o
